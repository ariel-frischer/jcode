name: Fork CLI Release

# Only a user-promoted commit on main can publish a fork release. Development
# commits on dev and manually pushed tags are intentionally not release inputs.
on:
  push:
    branches: [main]

concurrency:
  group: fork-release-main
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  JCODE_CI: "1"
  RUSTUP_TOOLCHAIN: stable

jobs:
  prepare:
    name: Prepare exact source metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute deterministic release metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          source_sha="${SOURCE_SHA:?missing github.sha}"
          [[ "$(git rev-parse HEAD)" == "$source_sha" ]] || {
            echo "Checked out source does not match github.sha: $(git rev-parse HEAD) != $source_sha" >&2
            exit 1
          }

          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid GitHub run number: $RUN_NUMBER" >&2
            exit 1
          }
          year="$(git show -s --date=format:%Y --format=%cd "$source_sha")"
          month="$(git show -s --date=format:%m --format=%cd "$source_sha")"
          month="$((10#$month))"
          release_tag="v${year}.${month}.${RUN_NUMBER}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Generated an invalid numeric release tag: $release_tag" >&2
            exit 1
          }

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Fork release source"
            echo "- Release tag: $release_tag"
            echo "- Source commit: $source_sha"
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: jcode-linux-x86_64
            compat_container: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: jcode-linux-aarch64
            compat_container: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Preserve the inherited ARM64/Termux emulated-TLS build contract.
      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.compat_container != true
        with:
          targets: aarch64-unknown-linux-gnu
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Build portable Linux x86_64 release binary
        if: matrix.compat_container == true
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ needs.prepare.outputs.release_tag }}
          JCODE_COMPAT_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          scripts/build_linux_compat.sh dist
          test -s "dist/${JCODE_COMPAT_ARTIFACT}.tar.gz"

      - name: Build Linux ARM64 release binary
        if: matrix.compat_container != true
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ needs.prepare.outputs.release_tag }}
          RUSTUP_TOOLCHAIN: nightly
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Z tls-model=emulated"
        run: |
          set -euo pipefail
          cargo build -Z build-std=std,panic_abort --locked --release --target "${{ matrix.target }}" -p jcode --bin jcode
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jcode" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jcode-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: jcode-macos-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS CLI release binary
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" -p jcode --bin jcode
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jcode" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jcode-windows-x86_64
            cargo_args: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: jcode-windows-aarch64
            cargo_args: "--no-default-features --features pdf"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'amd64' || 'amd64_arm64' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Windows CLI release binary
        shell: pwsh
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ needs.prepare.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoArgs = @('build', '--locked', '--release', '--target', '${{ matrix.target }}', '-p', 'jcode', '--bin', 'jcode')
          $extraArgs = '${{ matrix.cargo_args }}'
          if (-not [string]::IsNullOrWhiteSpace($extraArgs)) {
            $cargoArgs += $extraArgs -split ' '
          }
          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jcode.exe" "dist/${{ matrix.artifact }}.exe"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows archive creation failed' }
          & "target/${{ matrix.target }}/release/jcode.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows binary failed to run --version' }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.exe
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish complete fork CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, build-linux, build-macos, build-windows]
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: jcode-*
          path: artifacts
          merge-multiple: true

      - name: Validate release assets and generate provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected=(
            artifacts/jcode-linux-x86_64.tar.gz
            artifacts/jcode-linux-aarch64.tar.gz
            artifacts/jcode-macos-aarch64.tar.gz
            artifacts/jcode-macos-x86_64.tar.gz
            artifacts/jcode-windows-x86_64.exe
            artifacts/jcode-windows-x86_64.tar.gz
            artifacts/jcode-windows-aarch64.exe
            artifacts/jcode-windows-aarch64.tar.gz
          )
          for asset in "${expected[@]}"; do
            test -s "$asset" || {
              echo "Missing release asset: $asset" >&2
              exit 1
            }
          done

          : > SHA256SUMS
          while IFS= read -r -d '' asset; do
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d' ' -f1)" "$(basename "$asset")" >> SHA256SUMS
          done < <(printf '%s\0' "${expected[@]}" | sort -z)

          cat > BUILD-PROVENANCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          release_tag=${RELEASE_TAG}
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          EOF

          # The new tag does not exist yet. Supply the nearest ancestor tag so
          # the first run does not put the repository's entire history in notes.
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          scripts/generate_release_notes.sh "$RELEASE_TAG" "$previous_tag" > release_notes.md
          cat >> release_notes.md <<EOF

          ## Build provenance

          - Source commit: ${GITHUB_SHA}
          - Release tag: ${RELEASE_TAG}
          - Windows artifacts are unsigned CLI binaries. This release does not include desktop installers or package-channel updates.
          EOF

          cat SHA256SUMS
          cat BUILD-PROVENANCE.txt

      - name: Verify release tag source and create draft release
        id: release_state
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          remote_tag_sha() {
            local sha
            sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$sha" ]]; then
              sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
            fi
            printf '%s' "$sha"
          }

          release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          existing_tag_sha="$(remote_tag_sha)"
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG does not point to source commit $SOURCE_SHA: $existing_tag_sha" >&2
            exit 1
          fi

          if [[ "$release_state" == "false" ]]; then
            [[ "$existing_tag_sha" == "$SOURCE_SHA" ]] || {
              echo "Published release $RELEASE_TAG has no matching source tag" >&2
              exit 1
            }
            echo "Release $RELEASE_TAG is already published; no published release mutation will occur."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$existing_tag_sha" ]]; then
            # Draft creation need not materialize a Git ref. Create the exact
            # ref explicitly, without force, before asking GitHub for a draft.
            git push origin "$SOURCE_SHA:refs/tags/$RELEASE_TAG"
            existing_tag_sha="$(remote_tag_sha)"
          fi

          [[ "$existing_tag_sha" == "$SOURCE_SHA" ]] || {
            echo "Release tag $RELEASE_TAG does not point to source commit $SOURCE_SHA after tag creation: $existing_tag_sha" >&2
            exit 1
          }

          if [[ "$release_state" != "true" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Upload assets and publish release
        if: steps.release_state.outputs.already_published != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets=(
            artifacts/jcode-linux-x86_64.tar.gz
            artifacts/jcode-linux-aarch64.tar.gz
            artifacts/jcode-macos-aarch64.tar.gz
            artifacts/jcode-macos-x86_64.tar.gz
            artifacts/jcode-windows-x86_64.exe
            artifacts/jcode-windows-x86_64.tar.gz
            artifacts/jcode-windows-aarch64.exe
            artifacts/jcode-windows-aarch64.tar.gz
            SHA256SUMS
            BUILD-PROVENANCE.txt
          )
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${assets[@]}" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
