schema_version: "1.0"
components:
  - name: Client Surfaces
    description: >-
      Current user-facing executables and libraries: the jcode CLI/TUI,
      jcode-desktop2, jcode-sdk, and jcode-harness-api clients. The removed
      legacy desktop host/worker design and optional future desktop concepts
      are outside the implemented boundary.
    responsibilities:
      - Expose session creation, listing, attachment, resume, control, prompt, approval, background-task, memory, and self-dev operations.
      - Render client-held state while disconnected, then resume from the last committed event sequence.
      - Preserve idempotency keys and reconnect tokens across retryable transport failures.
    rationale: >-
      Several current clients share one protocol and session model, so they
      remain presentation and API surfaces rather than independent authorities.
    operational_concerns:
      - Report stale or disconnected state explicitly rather than accepting local mutations.
      - Bound rendering and buffering work during event bursts.

  - name: Unix-Socket Protocol Gateway
    description: >-
      Local newline-delimited JSON transport and protocol boundary used by the
      shared daemon; harness framing is bounded by the implemented 16 MiB limit.
    responsibilities:
      - Authenticate the local client context, validate versioned request frames, and reject oversized or malformed input.
      - Multiplex request responses and ordered session event streams over client connections.
      - Re-establish attachments using state tokens and exclusive event cursors after reconnect.
    rationale: >-
      A single local boundary keeps every client on the daemon's authoritative
      mutation and ordering path without introducing a network control plane.
    operational_concerns:
      - Apply per-connection backpressure and disconnect clients whose buffers remain saturated.
      - Track acknowledgement and fanout latency against the local p95 targets.

  - name: Shared Multi-Client Daemon
    description: >-
      The single long-lived server process that owns all current local clients,
      sessions, shared runtime services, and the authoritative mutation order.
    responsibilities:
      - Route public operations to the addressed Session and retain work when an initiating client disconnects.
      - Serialize prompt acceptance, lifecycle changes, tool approvals, and swarm-plan mutations per session.
      - Fan out newly committed events to every attached client and replay committed gaps on reconnect.
    rationale: >-
      One modular-monolith daemon meets the local single-user scale target while
      avoiding duplicated provider, MCP, memory, and telemetry services per session.
    operational_concerns:
      - Isolate slow sessions so ten concurrent turns do not block control traffic or other sessions.
      - On process failure, rebuild session actors and nonterminal work from durable state.

  - name: Session Lifecycle Manager
    description: >-
      Daemon-owned session registry and per-session sequencing boundary for
      durable identity, attachment, turn lifecycle, and transcript state.
    responsibilities:
      - Assign each accepted Event a monotonically increasing sequence within its Session.
      - Deduplicate prompt and control retries by idempotency key before applying effects.
      - Commit session and turn state before acknowledgement and expose cursor-based history for recovery.
    rationale: >-
      Per-session serialization resolves the correctness-sensitive writes while
      allowing unrelated sessions to execute concurrently.
    operational_concerns:
      - Detect stuck nonterminal turns and reconcile them after daemon restart.
      - Compact or retain history without invalidating stable session identity and replay contracts.

  - name: App-Core Agent Orchestrator
    description: >-
      Current agent-turn coordinator that assembles session context and drives
      the provider, tool, persistence, memory, and client-event loop.
    responsibilities:
      - Select the configured provider adapter and start an accepted Turn outside the prompt request path.
      - Feed provider deltas and tool results through the session sequencer before client publication.
      - Handle cancellation, terminal status, bounded retries, and context or token limits.
    rationale: >-
      A single orchestration layer keeps provider-specific behavior outside the
      session contract while making event commitment and tool-loop transitions explicit.
    operational_concerns:
      - Limit concurrent turns and provider retries to control host load and external cost.
      - Surface provider failures as ordered terminal or retry-status events.

  - name: Provider Runtime Adapters
    description: >-
      Implemented adapter boundary for OpenAI, Anthropic, Bedrock, OpenRouter,
      Gemini, Copilot, Claude CLI, Cursor, and Antigravity provider runtimes.
    responsibilities:
      - Translate the common turn context, tool schema, and cancellation contract to the selected provider.
      - Normalize streamed text, reasoning, usage, tool requests, errors, and completion signals.
      - Keep provider credentials and provider-specific transport outside persisted transcript payloads.
    rationale: >-
      Adapters isolate external APIs and subprocess runtimes without splitting
      the local daemon into independently deployed services.
    operational_concerns:
      - External latency and availability dominate turn time and require timeouts and bounded retry policies.
      - Record normalized usage for configured cost and rate guardrails.

  - name: Tool and MCP Runtime
    description: >-
      Execution boundary for built-in tools and configured MCP servers, scoped
      by the session working directory and permission policy.
    responsibilities:
      - Validate tool arguments and resolve the registered built-in or MCP implementation.
      - Commit permission requests and decisions before starting protected side effects.
      - Return structured results to app-core for the next provider iteration and persisted event stream.
    rationale: >-
      Tool execution is separated from provider adaptation because permissions,
      local filesystem effects, process isolation, and MCP failures have distinct trust boundaries.
    operational_concerns:
      - Enforce timeouts, cancellation, output limits, and working-directory permissions.
      - Never automatically retry a non-idempotent tool after an ambiguous result.

  - name: Background Task and Swarm Coordinator
    description: >-
      Daemon-owned scheduler for background tasks and bounded parent-child swarm
      work that continues independently of any client connection.
    responsibilities:
      - Persist accepted task identity and parentage before scheduling execution.
      - Enforce concurrency limits, cancellation propagation, progress reporting, and bounded swarm ownership.
      - Reconcile persisted nonterminal tasks with running workers after interruption.
    rationale: >-
      Slow and concurrent work must leave the request path, but remains inside
      the shared daemon so session ordering and host resource limits stay coherent.
    operational_concerns:
      - Apply admission control and return overload rather than exhausting the developer host.
      - Retry only idempotent scheduling transitions and preserve failed work for inspection.

  - name: Persistence, Memory, and Telemetry Services
    description: >-
      Shared local services for authoritative session data, inspectable memory,
      restart metadata, and non-authoritative operational telemetry.
    responsibilities:
      - Durably store ordered Events, Session and Turn lifecycle state, task state, and restart metadata.
      - Apply memory scope, sensitivity filtering, retention, inspection, and deletion contracts.
      - Buffer telemetry independently so telemetry failure cannot block or roll back authoritative session commits.
    rationale: >-
      Central persistence enables reconnect and reload recovery, while separating
      telemetry prevents an observational sink from becoming a correctness dependency.
    operational_concerns:
      - Flush authoritative writes within the one-second abrupt-failure RPO and preserve acknowledged durable commits.
      - Bound retention, telemetry buffers, and disk growth with visible degradation on storage pressure.

  - name: Self-Dev Build and Reload Manager
    description: >-
      Current self-development path that produces immutable versioned binaries,
      selects current, stable, or canary channel links, and exec-reloads the one shared daemon.
    responsibilities:
      - Restrict build initiation to eligible sessions and run compilation and validation outside the request path.
      - Atomically select a ready immutable Build through the requested channel link.
      - Drain and persist daemon state, exec the selected binary, restore the socket, and let clients reconnect to their sessions.
    rationale: >-
      Reusing the shared daemon preserves one session authority; isolated sockets
      are reserved for non-disruptive validation rather than a second self-dev daemon.
    operational_concerns:
      - Reject activation of incomplete builds and retain the previously selected executable for rollback.
      - Expose build and activation progress while the socket may be temporarily unavailable.

data_stores:
  - name: Session Event Store
    type: local durable structured storage
    description: >-
      Source of truth for Session, Turn, Event, ToolExecution, and BackgroundTask
      state. Events are keyed by session and monotonic sequence; accepted
      idempotency keys and nonterminal work markers support retry and restart reconciliation.
  - name: Memory Store
    type: local retention-governed storage
    description: >-
      Stores inspectable MemoryRecord data by User and optional Session scope,
      with sensitivity filtering, expiry, and committed deletion.
  - name: User Workspace
    type: local filesystem
    description: >-
      User-controlled working tree read or modified by approved tools; it is not
      the transcript source of truth and filesystem side effects may require explicit reconciliation.
  - name: Build Store and Channel Links
    type: immutable local binaries and atomic symbolic links
    description: >-
      Stores versioned executables and the stable, current, and canary selectors
      used by installation, self-development activation, rollback, and daemon reload.
  - name: Telemetry Buffer
    type: bounded local append buffer
    description: >-
      Holds non-authoritative metrics and traces for eventual flush; data may be
      delayed or dropped under pressure without changing committed session state.

request_flows:
  - name: Prompt, provider-tool loop, persistence, and streaming
    steps:
      - A Client Surface sends POST /v1/sessions/{session_id}/turns with a stable idempotency key through the Unix-Socket Protocol Gateway.
      - The Shared Multi-Client Daemon routes the request to the Session Lifecycle Manager, which rejects conflicting state or deduplicates a retry to the original Turn.
      - The Session Lifecycle Manager assigns the next session sequence and commits the accepted Turn, prompt Event, idempotency key, and recoverable nonterminal marker to the Session Event Store before returning 202.
      - Only after that commit, App-Core schedules the turn; if in-memory scheduling fails or the daemon exits, restart reconciliation finds the accepted nonterminal marker and resumes or commits an ordered failure without accepting the prompt twice.
      - App-Core assembles persisted session and allowed memory context, selects the Session provider, and invokes the matching Provider Runtime Adapter.
      - Provider deltas are normalized and passed through the session sequencer; transcript-relevant events are committed in monotonic order before the daemon fans them out, while ephemeral heartbeats carry no transcript sequence.
      - A provider tool request becomes a ToolExecution; protected work pauses until the daemon commits one non-stale approval decision, then the Tool and MCP Runtime executes it once unless the operation is explicitly retry-safe.
      - The structured tool result is committed as an Event, returned to App-Core, and supplied to the provider for the next loop iteration; ambiguous non-idempotent side effects are reported for reconciliation rather than automatically repeated.
      - App-Core commits completion, cancellation, or terminal failure before the daemon streams it; a failed or slow client stream does not roll back the write and the client later replays from its last committed sequence.

  - name: Attach, reconnect, and durable recovery
    steps:
      - A client attaches with its state token and exclusive last-seen event cursor; the daemon reads authoritative Session state and committed Events from the Session Event Store.
      - The daemon returns lifecycle state and replays the committed gap in ascending sequence before switching the attachment to live fanout.
      - During a socket outage the client may display cached transcript and status as stale, but prompt, approval, lifecycle, and swarm mutations fail or wait because no client can replace the daemon's write authority.
      - After a daemon restart, the Session Lifecycle Manager reconstructs session actors and reconciles nonterminal turns and tasks; duplicate client retries resolve through their stored idempotency keys.

  - name: Background and bounded swarm work
    steps:
      - A client submits background work with an idempotency key; the coordinator commits BackgroundTask identity, parentage, pending status, and the recoverable work marker before returning 202.
      - Admission control starts work only within configured background and swarm limits; overload remains pending or is rejected with 429 instead of spawning unbounded workers.
      - Workers publish progress and child-state transitions through the owning session sequencer so clients observe one committed order even when execution is concurrent.
      - If scheduling or a worker fails after acceptance, the coordinator retries only the idempotent scheduling transition, reconciles persisted nonterminal tasks, and commits a visible failed or cancelled state when recovery is unsafe.

  - name: Self-dev build, activation, and reload
    steps:
      - An eligible Session requests a self-dev Build; the daemon commits Build identity and building state, acknowledges 202, then starts compilation and validation asynchronously.
      - The manager writes the successful executable to an immutable version path and commits ready state; failed validation leaves the active channel and daemon unchanged.
      - Activation atomically repoints the selected channel link only to a ready Build, records restart metadata, drains authoritative writes, and exec-reloads the single shared daemon.
      - Clients observe a temporary socket outage, retain clearly stale presentation state, reconnect when the socket is ready, and replay each attached Session from its last committed sequence.
      - If the new executable cannot restore service, the retained previous build supports operator rollback; isolated sockets are used for validation without changing the shared daemon channel.

solution_progression:
  - requirement_id: FR-001
    bad:
      summary: Each client embeds its own session runtime and reads or writes local files directly.
      tradeoffs:
        - Easy for one client, but clients disagree on lifecycle and transcript state.
        - Disconnecting the owning client terminates work and there is no coherent multi-client stream.
    good:
      summary: One shared daemon exposes session operations and live events to all current client surfaces.
      tradeoffs:
        - Central ownership resolves conflicts with modest local-process complexity.
        - A dropped stream still requires explicit reconnect and history recovery.
    great:
      summary: The shared daemon adds per-session sequencing, idempotent prompt acceptance, cursor replay, attachment tokens, and backpressured multi-client fanout.
      tradeoffs:
        - Meets ordered reconnect and burst targets, but requires protocol versioning, cursor retention, and slow-consumer handling.

  - requirement_id: FR-002
    bad:
      summary: The request handler calls a provider synchronously and lets provider output invoke tools directly.
      tradeoffs:
        - Minimal control flow, but provider latency blocks acknowledgement and tool side effects bypass durable approval ordering.
        - A disconnect or retry can duplicate a turn or an ambiguous tool effect.
    good:
      summary: App-Core acknowledges a persisted Turn, uses provider adapters, and routes built-in and MCP tools through one permission boundary.
      tradeoffs:
        - Supports current providers and controlled tools without separate services.
        - In-memory scheduling and streaming still require restart and disconnect recovery.
    great:
      summary: Accepted work is recoverable from durable nonterminal state, every transcript event passes a per-session sequencer, and only explicitly retry-safe provider or tool transitions are retried.
      tradeoffs:
        - Prevents duplicate acceptance and preserves inspectable failure outcomes.
        - Adds reconciliation logic, terminal-state discipline, and operational cost for provider-specific timeout and usage controls.

  - requirement_id: FR-003
    bad:
      summary: Run one daemon per client or spawn every background and swarm request immediately.
      tradeoffs:
        - Simple ownership in isolation, but duplicates shared services and races on sessions and host resources.
        - Unbounded concurrent workers can starve interactive control and streaming traffic.
    good:
      summary: One multi-client daemon owns sessions and uses bounded in-process scheduling for independent background work.
      tradeoffs:
        - Efficient for a single developer host and preserves work across client disconnects.
        - A daemon failure interrupts all active execution and in-memory scheduler state.
    great:
      summary: Persisted task identity and parentage, admission control, per-session ordered progress, cancellation propagation, and restart reconciliation bound concurrent background and swarm work.
      tradeoffs:
        - Meets the ten-turn and burst-fanout targets without a distributed queue.
        - Requires queue-depth observability, fairness policy, and careful reconciliation of already-running side effects.

  - requirement_id: FR-004
    bad:
      summary: Keep transcript, memory, and lifecycle only in daemon and client memory.
      tradeoffs:
        - Fast and simple, but any daemon exit loses identity, history, and accepted work.
    good:
      summary: Persist session history, lifecycle, memory, and restart metadata locally and reload them when clients reconnect.
      tradeoffs:
        - Provides durable local recovery with no external database dependency.
        - Clients need a defined ordering cursor and may briefly show stale cached state.
    great:
      summary: Commit monotonic session events and idempotency records before acknowledgement, replay cursor gaps, reconcile nonterminal work, and isolate bounded telemetry from authoritative persistence.
      tradeoffs:
        - Delivers clean-reload RPO 0 and bounded abrupt-failure recovery while allowing read-only stale presentation.
        - Adds fsync, compaction, retention, corruption recovery, and storage-pressure operational work.

  - requirement_id: FR-005
    bad:
      summary: Overwrite the running executable or start a second long-lived daemon for every self-dev session.
      tradeoffs:
        - Quick to prototype, but rollback is unsafe and multiple daemons split session authority.
    good:
      summary: Build an immutable executable, select it through a channel link, persist sessions, and reload the one shared daemon.
      tradeoffs:
        - Preserves one authority and enables rollback with a short planned socket interruption.
        - Build and reload state must be visible and activation must reject incomplete artifacts.
    great:
      summary: Eligibility-gated asynchronous builds, validation on an isolated socket, atomic channel activation, drained durable state, exec reload, reconnect replay, and retained prior-build rollback form one controlled lifecycle.
      tradeoffs:
        - Makes self-development recoverable without a permanent canary daemon.
        - Adds immutable-artifact storage, channel hygiene, compatibility checks, and recovery procedures.

summary: >-
  Jcode's current architecture is a local modular monolith: the CLI/TUI,
  jcode-desktop2, SDK, and harness clients share a versioned Unix-socket protocol
  to one multi-client daemon. The daemon serializes correctness-sensitive writes
  per session, app-core drives normalized provider and permissioned tool loops,
  durable ordered events support fanout and replay, and bounded background,
  memory, telemetry, and self-dev services share the process. External providers,
  MCP servers, and the user workspace sit outside the trusted control boundary;
  the removed legacy desktop host/worker design and optional future desktop
  architecture are not represented as current components.

key_decisions:
  - decision: The shared daemon and Session Event Store are the sole mutation and transcript authority.
    rationale: >-
      Prompt acceptance, lifecycle changes, approvals, task ownership, and event
      order cannot diverge across concurrent clients; per-session monotonic
      sequences and committed idempotency keys make retries and replay deterministic.
    tradeoffs:
      - Mutations wait or fail during a daemon outage instead of favoring availability.
      - Unrelated sessions remain concurrent, but a daemon process failure affects all active local work.

  - decision: Read-only client presentation is AP, while session mutations are CP.
    rationale: >-
      Cached transcript and status can remain useful during a short disconnect,
      but clients must label them stale until they replay from the last committed
      sequence; the reconnect target bounds normal staleness to five seconds after socket readiness.
    tradeoffs:
      - Users retain visibility during interruption without risking divergent writes.
      - Before socket readiness or under repeated failure, stale presentation has no fixed maximum age and cannot authorize actions.

  - decision: Accepted turns and background tasks are durable before asynchronous execution begins.
    rationale: >-
      The authoritative commit stores the user idempotency key and recoverable
      nonterminal marker before 202; scheduling failure is therefore reconciled
      from storage rather than hidden behind a successful acknowledgement.
    tradeoffs:
      - Avoids a separate distributed queue or transactional outbox in the current single-process design.
      - Restart reconciliation must distinguish retry-safe scheduling from ambiguous external side effects.

  - decision: Persist transcript events before live fanout and use replay rather than making the stream durable.
    rationale: >-
      A socket or slow consumer can fail after a write without losing the event;
      reconnect resumes exclusively after the client's last committed sequence.
    tradeoffs:
      - Adds one durable-write latency to transcript-visible events.
      - Ephemeral heartbeats and telemetry may be dropped because they are not authoritative history.

  - decision: Provider adapters and tool execution remain boundaries inside the modular-monolith daemon.
    rationale: >-
      External provider differences and permissioned filesystem, process, and MCP
      effects need isolation, but the current single-host throughput does not justify
      independently deployed services or network hops.
    tradeoffs:
      - Shared deployment keeps latency and operations low.
      - Adapter or tool isolation relies on timeouts, cancellation, output limits, and careful failure containment.

  - decision: Self-dev activation reloads the single daemon through immutable builds and atomic channel links.
    rationale: >-
      Persisted sessions and reconnect replay preserve continuity while retaining
      one authority; the previous immutable executable provides a concrete rollback target.
    tradeoffs:
      - Activation causes a short local transport interruption.
      - Isolated validation requires an extra temporary socket but not a second long-lived daemon.
