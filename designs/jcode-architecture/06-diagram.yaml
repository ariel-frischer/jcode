referenced_components:
  - Client Surfaces
  - Unix-Socket Protocol Gateway
  - Shared Multi-Client Daemon
  - Session Lifecycle Manager
  - App-Core Agent Orchestrator
  - Provider Runtime Adapters
  - Tool and MCP Runtime
  - Background Task and Swarm Coordinator
  - Persistence, Memory, and Telemetry Services
  - Self-Dev Build and Reload Manager
notes:
  - Solid arrows form the primary prompt, provider/tool, durable commit, and streamed replay path.
  - Dashed arrows are asynchronous background coordination, telemetry, or self-dev lifecycle paths.
  - The Session Event Store is authoritative; client-held state and telemetry never accept or reorder mutations.
  - Self-dev activation reloads the same shared daemon; isolated sockets are for validation, not a second long-lived authority.
