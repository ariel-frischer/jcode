constitution:
  project_name: "Jcode"
  version: "1.1.0"
  ratified: "2026-08-02"
  last_amended: "2026-08-08"

preamble: |
  Jcode is a Rust coding-agent product, and this repository is Ariel Frischer's
  custom, experimental, upstream-aware development distribution. Its shared
  server, clients, providers, tools, configuration, and persisted contracts must
  evolve through simple architecture, proactive outcome ownership, measurable
  efficiency, and strong engineering quality without surprising existing users.

principles:
  - name: "Surgical, Scope-Bound Changes"
    id: "PRIN-001"
    category: "process"
    priority: "NON-NEGOTIABLE"
    description: |
      Every change MUST be the smallest coherent edit that satisfies its approved
      outcome and acceptance criteria. Implementations MUST preserve unrelated
      working-tree changes and MUST NOT include adjacent cleanup, broad refactors,
      speculative abstractions, unnecessary dependency additions, or repository-wide
      reformatting. Newly discovered work outside the accepted scope MUST be
      reported or tracked separately rather than folded into the current change.
    rationale: "Narrow diffs reduce regression risk, review cost, and conflicts in a high-churn workspace."
    enforcement:
      - mechanism: "Scope-to-diff review"
        description: "Reviewers compare the final diff with the Bead or specification outcome, non-goals, and acceptance criteria."
      - mechanism: "Working-tree inspection"
        description: "Contributors inspect git status and explicit file diffs before staging only the files owned by the change."
    exceptions:
      - "A directly required refactor may be included only when the requested behavior cannot be implemented safely without it and the expanded scope is documented before implementation."

  - name: "Backward-Compatible User and Data Contracts"
    id: "PRIN-002"
    category: "architecture"
    priority: "NON-NEGOTIABLE"
    description: |
      Additive work MUST preserve current behavior when the new capability is
      unset or unused. Existing CLI behavior, environment variables, config
      fields and defaults, provider behavior, wire messages, serialized forms,
      persisted state, and public import or re-export paths MUST remain compatible
      unless a breaking change is explicitly approved. Migrations MUST preserve
      serde field names, defaults, skips, enum representations, and user-authored
      choices; staged crate moves MUST retain compatibility re-exports until all
      consumers intentionally migrate.
    rationale: "Jcode has persistent configuration, cross-process protocols, and multiple clients whose contracts outlive an individual code change."
    enforcement:
      - mechanism: "Compatibility tests"
        description: "Focused tests cover legacy or unset behavior, serialized shapes, fallback paths, and migrations affected by the change."
      - mechanism: "Contract review"
        description: "Plans and reviews identify every affected CLI, config, protocol, persistence, and public-path contract."
    exceptions:
      - "An intentionally breaking product change requires explicit maintainer approval, a migration or clear failure path, release notes, and an appropriate product version bump."

  - name: "Explicit Configuration Precedence"
    id: "PRIN-003"
    category: "architecture"
    priority: "MUST"
    description: |
      Every configurable behavior MUST define one canonical resolution path. For
      settings exposed at all layers, precedence is explicit per-invocation or
      per-session override, then environment override, then persisted config,
      then built-in default, unless an existing documented contract explicitly
      requires a different order. A new setting MUST reuse the owning resolver
      instead of creating a parallel request path, and MUST document the meaning
      of unset, empty, invalid, and unsupported values. Diagnostics SHOULD report
      configured and effective non-secret values when those differ.
    rationale: "Deterministic precedence makes behavior explainable while preserving Jcode's existing file-then-environment loading model."
    enforcement:
      - mechanism: "Precedence test matrix"
        description: "Tests cover built-in defaults, persisted values, environment overrides, explicit runtime overrides, invalid input, and relevant fallback combinations."
      - mechanism: "Configuration documentation review"
        description: "The config type, default config template, environment override, and diagnostic summary are updated together when applicable."
    exceptions:
      - "Credential source selection or another established subsystem may retain a different documented precedence order when compatibility or security requires it; the order must remain explicit and tested."

  - name: "Layered Rust Ownership and Dependency Direction"
    id: "PRIN-004"
    category: "architecture"
    priority: "MUST"
    description: |
      Changes MUST respect Jcode's layered workspace and existing ownership
      boundaries. Stable data contracts belong in focused, dependency-light type
      crates; those crates MUST NOT depend on root orchestration, storage,
      providers, networking, processes, protocol runtime, desktop, or TUI layers.
      Runtime behavior remains with its owning domain or composition crate until
      a complete boundary can move without cycles or increased dependency fan-out.
      High-churn orchestration may depend on stable lower layers, but stable lower
      layers MUST NOT depend back on product-specific runtime or interface code.
      The single-server, multi-client runtime model MUST remain intact unless an
      approved architecture change explicitly replaces it. The server remains the
      source of truth for sessions, agent execution, tools, persistence, shared
      provider state, and shared background services. Clients own interface-specific
      presentation and transient interaction state unless an explicit shared
      contract promotes that state to the server. Cross-process and SDK behavior
      MUST use explicit protocol or harness contracts rather than terminal-output
      parsing or duplicated server definitions. Self-development is a capability
      of the normal Jcode runtime, not a second product architecture.
    rationale: "The existing crate seams reduce compile invalidation and make ownership testable without forcing a big-bang rewrite."
    enforcement:
      - mechanism: "Dependency boundary guard"
        description: "scripts/check_dependency_boundaries.py and Cargo metadata verify allowed crate direction and lockfile consistency."
      - mechanism: "Architecture review"
        description: "Plans identify the owning crate and runtime authority, reused contracts, affected clients or SDKs, dependency impact, compatibility seams, and explicit non-goals."
      - mechanism: "Protocol boundary review"
        description: "Cross-process and SDK changes identify the canonical wire owner and test compatibility without parsing CLI output or duplicating runtime definitions."
    exceptions:
      - "A temporary compatibility adapter is allowed during a staged migration when the old path remains usable and the adapter's removal condition is documented."

  - name: "Focused Behavioral Tests"
    id: "PRIN-005"
    category: "quality"
    priority: "MUST"
    description: |
      Every behavior change MUST add or adjust tests that directly exercise its
      acceptance criteria and regression risk. Contributors MUST run the narrowest
      reliable crate, module, or exact-name tests first; broad filters known to
      select unrelated stateful, timing-sensitive, UI, or benchmark tests MUST NOT
      substitute for focused evidence. Configuration changes MUST test unchanged
      defaults, configured behavior, precedence, invalid input, and relevant
      fallback behavior. Documentation-only changes require their artifact or link
      validators rather than unrelated Rust tests.
    rationale: "Precise tests provide attributable evidence and faster iteration in a large workspace with heterogeneous test costs."
    enforcement:
      - mechanism: "Acceptance-criteria traceability"
        description: "Each behavioral acceptance criterion maps to a focused automated check or a documented reason why automation is impossible."
      - mechanism: "Targeted test commands"
        description: "Validation records exact Cargo package, module, test name, artifact validator, or deterministic smoke command and its result."
    exceptions:
      - "Manual validation is permitted only for behavior that cannot be observed automatically; the gap, environment, and expected observation must be documented."

  - name: "Visible Failures and Trust-Boundary Validation"
    id: "PRIN-006"
    category: "security"
    priority: "MUST"
    description: |
      External input, configuration, credentials, filesystem data, protocol data,
      and provider responses MUST be validated at their trust boundaries. Invalid
      or unsupported values MUST produce an actionable error or an explicitly
      documented fallback; implementations MUST NOT silently swallow errors,
      introduce panic-prone production paths, or log secret values. Diagnostic
      output may expose names, presence, lengths, or redacted fingerprints only.
      Persisted memories, transcripts, prompts, tool calls, file content, and
      credentials MUST be treated as sensitive user data. Secrets, credentials,
      sensitive files, and unnecessary personal identifying information MUST NOT
      be retained as memory. User-facing persisted memory MUST support inspection
      and deletion and MUST be disableable. Automatic destructive consolidation
      or deletion MUST be reversible, user-confirmed, or governed by a separately
      accepted retention contract. SDKs, hooks, tools, providers, and telemetry
      MUST transmit only the data required by their explicit contracts.
    rationale: "Jcode coordinates local state and external providers, so hidden failures and leaked credentials have a wide operational blast radius."
    enforcement:
      - mechanism: "Repository ratchets"
        description: "Panic, swallowed-error, and warning-budget checks prevent growth in known unsafe failure patterns."
      - mechanism: "Negative-path tests"
        description: "Focused tests verify invalid input, unsupported values, and provider or persistence failures where the change touches those boundaries."
      - mechanism: "Privacy and retention review"
        description: "Changes touching memory, telemetry, hooks, SDKs, tools, or providers verify sensitive-data filtering, user controls, and contract-bounded transmission."
    exceptions: []

  - name: "Repository Guardrails Are Delivery Gates"
    id: "PRIN-007"
    category: "quality"
    priority: "NON-NEGOTIABLE"
    description: |
      Changes MUST satisfy the repository-local command contracts before push or
      merge. Implementation changes MUST run focused checks first, then the
      relevant build, and scripts/check_guardrails.sh, which mirrors CI formatting,
      all-target and all-feature checking, clippy with warnings denied, lockfile,
      warning, code-size, test-size, panic, swallowed-error, dependency-boundary,
      wildcard re-export, frame-budget, and unused-dependency gates. Intentional
      ratchet growth MUST be reviewed before rebaselining. Validation MUST use the
      current stable Rust toolchain or disclose toolchain drift, and resource-heavy
      builds SHOULD use the repository's remote-build path when local resources are
      insufficient.
    rationale: "One canonical guardrail suite keeps local evidence aligned with CI and prevents the next contributor from inheriting a broken branch."
    enforcement:
      - mechanism: "Local guardrail script"
        description: "scripts/check_guardrails.sh must run before delivery; changed-surface gates must pass, and unrelated baseline failures must be isolated and recorded."
      - mechanism: "Continuous integration"
        description: "CI repeats formatting, quality, build, test, and platform-specific checks on supported targets."
    exceptions:
      - "A documentation-only or schema-only change may use scripts/check_guardrails.sh --skip-slow when it cannot affect compiled Rust; its dedicated artifact validator must still pass."
      - "A proven pre-existing failure outside the changed surface may be reported without expanding scope; the change must not worsen it, and ratchet baselines must not be updated to hide it."
      - "Live, costly, production-adjacent, or unavailable-platform validation may be deferred only with explicit approval and a recorded validation owner."

  - name: "Custom-First, Upstream-Aware Simplicity"
    id: "PRIN-008"
    category: "architecture"
    priority: "NON-NEGOTIABLE"
    description: |
      This repository MUST evolve as an intentional custom Jcode distribution.
      Changes MUST preserve and improve its coherent product identity, especially
      self-development, jcode run, named session profiles, efficient multi-session
      workflows, and other intentional local behavior. Upstream compatibility and
      synchronization are valuable, but upstream changes MUST NOT silently remove
      or weaken local improvements. Every capability MUST have one clear owner and
      one canonical resolution or execution path. Prefer reuse, direct composition,
      and small explicit contracts over parallel implementations, generalized
      frameworks, or a new general plugin ABI or duplicate extension mechanism
      when existing MCP, hook, or skill surfaces own the use case. Experimental
      work MUST be identified, bounded, testable, and removable or reversible.
    rationale: "A coherent custom product and simple ownership model preserve Ariel-specific value without letting experimental work become permanent architectural complexity."
    enforcement:
      - mechanism: "Local-versus-upstream impact review"
        description: "Upstream fixes and architecture changes are checked against current local behavior, intentional customizations, and priority workflows before integration."
      - mechanism: "Complexity and ownership review"
        description: "Plans name the canonical owner and reused path, identify duplicate paths avoided, and define a removal or stabilization condition for experiments."
    exceptions:
      - "A temporary adapter or parallel path is allowed only for a staged migration with an owner, compatibility purpose, and documented removal condition."

  - name: "Outcome Ownership and Safe Autonomy"
    id: "PRIN-009"
    category: "process"
    priority: "MUST"
    description: |
      Jcode MUST optimize for completing the user's real goal rather than producing
      the smallest passing artifact or merely reporting a problem. Agent behavior
      and supporting workflows MUST preserve user intent across turns, make relevant
      progress without unnecessary blocking questions, fix discovered problems
      within accepted scope, and continue iterating while a usable feedback loop
      remains. Autonomy MUST remain bounded by user control. Destructive,
      irreversible, externally visible, costly, production-adjacent,
      credential-changing, or otherwise regret-prone actions require explicit
      authorization. Work MUST NOT redefine success around what is already complete.
    rationale: "Jcode's product value comes from safely delivering the requested outcome, not from stopping at plausible code or partial evidence."
    enforcement:
      - mechanism: "Outcome-based acceptance criteria"
        description: "Specifications and plans include the observable user outcome, not only internal implementation artifacts."
      - mechanism: "Completion evidence audit"
        description: "Completion reports trace each requirement to current evidence and disclose remaining gaps, weak checks, and deferred validation."
      - mechanism: "Permission and safety tests"
        description: "Relevant irreversible, credential-affecting, or external side effects exercise their approval and refusal paths."
    exceptions:
      - "Ordinary low-risk implementation choices may proceed without extra approval when user intent is clear; irreversible or secret-affecting actions have no implicit-approval exception."

  - name: "Measured Efficiency and Runtime Truth"
    id: "PRIN-010"
    category: "quality"
    priority: "MUST"
    description: |
      Performance and resource efficiency are product requirements, especially
      startup and first-input latency, RAM use, multi-session scaling, provider and
      tool responsiveness, and self-development build iteration. Changes touching
      a relevant hot path MUST preserve the maintained budget. Any regression MUST
      be documented and explicitly approved. Numeric thresholds belong in
      benchmark or budget documents rather than this constitution. Runtime behavior
      MUST be validated against the binary and process that actually execute the
      workflow. Compilation alone is not behavioral evidence. Runtime checks MUST
      use the newly built binary through an isolated socket or private instance,
      or reload the intended daemon, and MUST confirm the resolved executable when
      multiple build channels or symlinks exist.
    rationale: "Efficiency is central to Jcode's multi-session and self-development experience, and validation against an old daemon creates false confidence."
    enforcement:
      - mechanism: "Performance and resource evidence"
        description: "Affected hot paths record an appropriate before-and-after benchmark, resource measurement, or maintained-budget check."
      - mechanism: "Built-binary workflow validation"
        description: "Changed user workflows run through the newly built or deliberately reloaded runtime, with the executable identity verified when ambiguous."
      - mechanism: "Self-development lifecycle validation"
        description: "Self-dev changes verify build, activation or reload, reconnection, and continued session behavior as applicable."
    exceptions:
      - "Changes proven unable to affect runtime or performance may use dedicated static or artifact validation."

sections:
  - name: "Project Identity and Direction"
    content: |
      Jcode is Ariel Frischer's custom development and experimental distribution
      of the open-source Jcode project. It remains upstream-aware while intentionally
      optimizing for local product improvements, simple architecture, strong
      engineering quality, self-development, efficient multi-session work, and
      reliable non-interactive execution. Experimental status is not permission to
      reduce quality. Experiments must be explicit and bounded, while stable user
      and data contracts retain normal compatibility expectations.

  - name: "Change Scope and Design"
    content: |
      Substantial work is owned by one Bead through local validation. The Bead,
      specification, or plan must state the outcome, scope, design owner, contracts
      to reuse, compatibility constraints, non-goals, acceptance criteria, and
      related-work boundaries before implementation. Ambiguity that changes
      behavior, scope, safety, or validation requires clarification; otherwise use
      the simplest implementation consistent with existing architecture. Do not
      combine unrelated cleanup or refactoring with the requested change.

  - name: "Compatibility and Configuration"
    content: |
      New configuration is optional by default and must not change behavior or
      cost when unset. Its config type, default template, environment mapping,
      resolver, diagnostics, and tests evolve as one contract. Persisted, serde,
      CLI, protocol, provider, and compatibility re-export surfaces are presumed
      stable. Migration logic must distinguish absent, machine-written legacy, and
      user-authored values where that distinction affects intent. Secrets never
      appear in summaries, logs, fixtures, commits, or validation output.

  - name: "Architecture and Dependencies"
    content: |
      Jcode remains a modular monolith with a layered Rust workspace: foundation
      and stable contracts, domain/runtime behavior, interface surfaces, and a thin
      composition layer. Crate extraction is justified by ownership, dependency
      direction, or compile-impact improvement, not file tidiness. New dependencies
      must be necessary, explicitly versioned, represented in Cargo.lock, and must
      not increase type-crate fan-out into runtime-heavy layers. Public compatibility
      paths remain until an intentional migration is complete. Each feature identifies
      affected clients, platforms, transports, protocols, providers, and SDKs.
      Platform-specific scope is acceptable when explicit and tested; accidental
      platform assumptions must not leak beneath transport or interface boundaries.
      Changes to mirrored SDK contracts follow repository synchronization,
      validation, and publication requirements.

  - name: "Documentation Authority"
    content: |
      Normative direction descends from this constitution to repository-specific
      instructions, accepted contracts and architecture decisions, approved
      specifications and plans, and finally drafts, proposals, and explorations.
      Draft or proposed documents are not binding until accepted. Descriptive truth
      comes from current source, tests, generated schemas, built binaries, and
      observed runtime behavior. Documentation that disagrees with implementation
      must be corrected or clearly marked as target-state material. Architecture
      documents must declare whether they describe current state, an accepted target,
      an active migration, or exploration.

  - name: "Validation and Delivery"
    content: |
      Validation proceeds from the smallest deterministic check to the relevant
      crate or binary build and repository guardrails. Record commands, results,
      and any skipped or deferred evidence. Stage only explicit owned files, make
      focused commits, and require the upstream branch to be an ancestor before
      pushing; do not rewrite shared history. Release work additionally updates
      Cargo.toml using product semantic versioning based on the complete release
      delta and documents breaking behavior.

governance:
  amendment_process:
    - step: 1
      action: "Propose the constitutional change in a focused reviewed change"
      requirements: "State the motivation, affected principles, compatibility impact, enforcement impact, and rejected simpler alternatives."
    - step: 2
      action: "Assess downstream impact"
      requirements: "Identify specifications, plans, tasks, templates, architecture documents, tests, guardrails, and migrations that must change."
    - step: 3
      action: "Obtain maintainer approval"
      requirements: "Approval is required before merge; a change that conflicts with a NON-NEGOTIABLE principle must amend the constitution first."
    - step: 4
      action: "Ratify and synchronize"
      requirements: "Update the semantic version, last_amended date, sync_impact, dependent artifacts, and validation evidence in the same change."

  versioning_policy: |
    Constitution versions follow semantic versioning. MAJOR changes remove or
    redefine a principle or governance rule so previously compliant work becomes
    non-compliant. MINOR changes add a principle, section, enforcement obligation,
    or materially expand governance. PATCH changes clarify wording or improve
    enforcement detail without changing required behavior. The original ratified
    date never changes; last_amended changes whenever constitution content changes.

  compliance_review:
    frequency: "At every specification, plan, implementation review, and release; formal review at least annually"
    process: "Trace affected requirements and validation evidence to these principles, resolve conflicts before implementation, and review whether enforcement remains effective and aligned with repository commands."

  rules:
    - "This constitution governs all specifications, plans, tasks, implementations, reviews, and releases in the repository."
    - "When repository instructions and this constitution differ, apply the stricter compatible rule; a direct conflict requires an approved amendment before implementation."
    - "Every specification and plan must identify applicable principles and provide executable compliance checks."
    - "Exceptions are valid only where a principle lists them and the change records the reason, scope, owner, and compensating validation."
    - "NON-NEGOTIABLE principles cannot be waived by an implementation, deadline, emergency, or generated artifact."
    - "Emergency process acceleration still requires post-hoc documentation, validation, and maintainer review, and cannot bypass compatibility, secret-handling, or delivery gates."
    - "Repository-specific instructions and accepted decisions may strengthen this constitution but cannot silently weaken or contradict it."
    - "Drafts, proposals, explorations, and unaccepted target-state documents are informative rather than binding."
    - "Current source, tests, schemas, built binaries, and runtime observations determine implemented behavior; normative documents determine required behavior."

sync_impact:
  version_change: "1.0.0 -> 1.1.0"
  modified_principles:
    - "PRIN-004: Clarified server, client, protocol, SDK, and self-development ownership."
    - "PRIN-006: Added privacy, memory control, retention, and contract-bounded transmission requirements."
    - "PRIN-008: Added custom-first, upstream-aware simplicity and experiment governance."
    - "PRIN-009: Added outcome ownership and safe autonomy."
    - "PRIN-010: Added measurable efficiency and validation against the executing runtime."
  added_sections:
    - "Project Identity and Direction"
    - "Documentation Authority"
    - "Supported surfaces and mirrored SDK obligations in Architecture and Dependencies"
  removed_sections: []
  templates_requiring_updates: []
  follow_up_todos:
    - "Future architecture documents should consistently declare current, accepted-target, migration, proposal, or exploration status."

