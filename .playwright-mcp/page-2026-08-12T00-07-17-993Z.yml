          - generic [ref=e46]:
            - paragraph [ref=e47]:
              - strong [ref=e48]: 🚀 About WRITER
            - paragraph [ref=e49]: WRITER is where the world's leading enterprises orchestrate AI-powered work. Our vision is to expand human capacity through superintelligence. And we're proving it's possible – through powerful, trustworthy AI that unites IT and business teams together to unlock enterprise-wide transformation. With WRITER's end-to-end platform, hundreds of companies like Mars, Marriott, Uber, and Vanguard are building and deploying AI agents that are grounded in their company's data and fueled by WRITER's enterprise-grade LLMs. Valued at $1.9B and backed by industry-leading investors including Premji Invest, Radical Ventures, and ICONIQ Growth, WRITER is rapidly cementing its position as the leader in enterprise generative AI.
            - paragraph [ref=e50]: Founded in 2020 with office hubs in San Francisco, New York City, Seattle, Austin, Chicago, and London, our team thinks big and moves fast, and we're looking for smart, hardworking builders and scalers to join us on our journey to create a better future of work with AI.
            - paragraph [ref=e51]
            - paragraph [ref=e52]:
              - strong [ref=e53]: 📐 About the role
            - paragraph [ref=e54]: As an AI engineer at WRITER, you'll be at the forefront of shaping how enterprises harness superintelligence. This isn't just about theory; you'll be building tangible AI solutions that power the future of work for hundreds of the world's leading companies. Your work will directly impact the performance, scalability, and ethical alignment of our cutting-edge LLMs and AI agents, enabling businesses to unlock unprecedented levels of productivity and innovation with AI that is truly grounded in their data.
            - paragraph [ref=e55]: This role can be hybrid in our San Francisco, New York City, or Seattle hubs. You'll report to the head of AI engineering.
            - paragraph [ref=e56]
            - paragraph [ref=e57]:
              - strong [ref=e58]: 🦸🏻‍♀️ What you'll do
            - list [ref=e59]:
              - listitem [ref=e60]:
                - paragraph [ref=e61]: Architect, develop, and deploy high-performance, scalable AI applications into production environments, ensuring robust integrations with our end-to-end platform.
              - listitem [ref=e62]:
                - paragraph [ref=e63]: Drive the development of intelligent agents and AI-powered features, translating complex research into practical, impactful solutions for our customers.
              - listitem [ref=e64]:
                - paragraph [ref=e65]: Collaborate closely with research scientists, data scientists, and product managers to define technical requirements and deliver features that address critical business needs.
              - listitem [ref=e66]:
                - paragraph [ref=e67]: Contribute to the research and evaluation of emerging AI technologies, frameworks, and tools to maintain WRITER's leadership in the enterprise generative AI space.
              - listitem [ref=e68]:
                - paragraph [ref=e69]: Champion responsible AI practices, including bias detection, explainability, and safety alignment, making sure our AI is trustworthy and ethical.
            - paragraph [ref=e70]
