        - tabpanel "Overview" [ref=e39]:
          - generic [ref=e40]:
            - heading "About Antithesis" [level=2] [ref=e41]
            - paragraph [ref=e42]: We’re on a mission to redefine how modern distributed systems are tested and released. Our platform is trusted by engineering teams who demand rock-solid reliability, scalable performance, and deep technical visibility. Our platform doesn’t just assure system correctness and reliability, it exists because developers need something better. If you’ve ever experienced the pain of a production outage, had a bad week on-call, or had a release delayed by weeks because of one killer bug – you’ll understand exactly why we’re doing what we do. If you're passionate about developer-first products, system resilience, and correctness, we’d love to talk.
            - heading "About the Role" [level=2] [ref=e44]
            - paragraph [ref=e45]: The best way to learn what our platform should do next is to sit next to the people using it. That's this job. You'll embed with our customers, find where shipping reliable software is still too hard or too slow, and help build what Antithesis does next.
            - heading "What You’ll Do" [level=2] [ref=e47]
            - paragraph [ref=e48]: "Almost every company we work with shows up with some version of this:"
            - paragraph [ref=e49]: "\"We're building a new system that we need to ship fast, but it can't fail. So every big change turns into weeks of careful review before we trust it. How can we use Antithesis to do this?\""
            - paragraph [ref=e50]: "You're the person who shows up. From day one you help a customer get their system running inside Antithesis, make sure it's catching the bugs they care about most, chase down the real ones it finds, and fold Antithesis into how they ship: their CI, their reviews, the way their agents write and check code. When it works, they merge big changes fast and trust that what they shipped holds."
            - paragraph [ref=e51]: "That's the customer-facing half. The other half is why we send an engineer. You notice what was slow, manual, or missing, and propose a fix. You work with our platform engineers to prototype it: a sharper way to find bugs, an easier way to fix them, or an agent skill that iterates on the results. Then you take it back to your customer to validate that it solves their problem. A lot of what makes Antithesis good today came out of that loop."
            - heading "What We Need:" [level=2] [ref=e53]
            - list [ref=e54]:
              - listitem [ref=e55]:
                - paragraph [ref=e56]: You've spent real time building or operating serious systems software, where correctness matters and the failures are subtle. You know how systems break under concurrency, faults, and load in ways no test caught. The domain matters less than the instinct for where things go wrong.
              - listitem [ref=e57]:
                - paragraph [ref=e58]: You've worked with customers as an engineer. You've been in the room where something's broken and you're the one who has to help, and you didn't hate it.
              - listitem [ref=e59]:
                - paragraph [ref=e60]: You can read an unfamiliar codebase, instrument it, write a test, and debug something you've never seen before.
              - listitem [ref=e61]:
                - paragraph [ref=e62]: When you hit a rough edge, you'd rather fix it than route around it. Here, your fix might ship to everyone.
              - listitem [ref=e63]:
                - paragraph [ref=e64]: You can explain hard things to non-technical people without lecturing.
              - listitem [ref=e65]:
                - paragraph [ref=e66]: You're up for five days a week in the office (DC, London, or SF) and occasional travel to our customers' offices.
            - heading "Bonus" [level=2] [ref=e68]
            - paragraph [ref=e69]: "Experience with fuzzing, property-based testing, or chaos engineering. Time building the kind of software our customers build: fintech, databases, blockchain, event streaming, cloud infra, trading. Building internal tools for other engineers. A startup where the job changed every six months."
            - paragraph [ref=e70]
            - heading "Why this one's different" [level=2] [ref=e71]
            - paragraph [ref=e72]: "Most customer-facing engineering jobs stop at deployment. Most jobs that let you shape a new platform keep you far from the people using it. This one does both: close enough to real systems to see what's missing, close enough to the product to build it. If that's the job you've been looking for, let's talk."
