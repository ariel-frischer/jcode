            - heading "About Us" [level=2] [ref=e42]
            - paragraph [ref=e43]:
              - text: "Legora is redefining how legal work gets done. Not built for lawyers, built with them. We work alongside the world’s best legal teams, who expect excellence, precision, and speed, and we hold ourselves to the same bar.Our AI-native workspace lets legal professionals move faster, think more clearly, and operate with sharper precision. By analysing thousands of documents in minutes and powering end-to-end workflows, we cut through complexity, teams can focus on what matters: judgment, strategy, and outcomes.1,000+ customers across 50+ countries trust us, including Cleary Gottlieb, Goodwin, Linklaters, White & Case, Dentons, and Barclays. We’ve scaled to"
              - strong [ref=e44]: $100M+ in ARR
              - text: ", with teams across Europe, North America and APAC, and continue to expand through acquisitions including Qura, Walter AI and Graceview.We partner with world-class performers: including Aaron Judge and the New York Yankees, Ludvig Åberg (and his caddie), and campaigns featuring Jude Law.Joining Legora means three things."
            - list [ref=e45]:
