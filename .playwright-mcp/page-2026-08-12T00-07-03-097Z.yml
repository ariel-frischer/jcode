            - paragraph [ref=e55]: Mission before ego. Everyone contributes. No one coasts.
            - paragraph [ref=e56]: If you’re driven by impact, pace, and raising the bar. This is the place.
            - heading [level=2] [ref=e57]:
              - strong [ref=e58]: The role
            - paragraph [ref=e59]: As a Forward Deployed Engineer at Legora, you'll sit at the intersection of product engineering and customer success — embedded directly with our most complex enterprise clients to make our AI-native platform work seamlessly in their environments. You'll write real code, solve real integration challenges, and leave behind infrastructure that outlasts your visit.
            - paragraph [ref=e60]:
              - strong [ref=e61]: What you'll be doing
            - list [ref=e62]:
              - listitem [ref=e63]:
                - paragraph [ref=e64]: Embed with enterprise customers during and after deployment, writing production-grade code to bridge Legora's platform with their existing legal tech stack
              - listitem [ref=e65]:
                - paragraph [ref=e66]: "Own the full technical scoping process: gather requirements, design integration architecture, and deliver working solutions end-to-end"
              - listitem [ref=e67]:
                - paragraph [ref=e68]: Build and maintain reusable connectors, automation scripts, and tooling that accelerate future customer deployments
              - listitem [ref=e69]:
                - paragraph [ref=e70]: Debug and resolve complex production issues at the intersection of customer environments and Legora's platform — often under time pressure
              - listitem [ref=e71]:
                - paragraph [ref=e72]: Act as the technical voice of the customer internally — surface friction points, edge cases, and integration gaps directly to our product and engineering teams
              - listitem [ref=e73]:
                - paragraph [ref=e74]: Partner with Sales and Customer Success to scope new deals and expand existing accounts where technical complexity is a deciding factor
              - listitem [ref=e75]:
                - paragraph [ref=e76]: Work closely with Engineering and Product to deliver successful integrations and improve general product offering
            - paragraph [ref=e77]:
              - strong [ref=e78]: Who you are
            - list [ref=e79]:
              - listitem [ref=e80]:
                - paragraph [ref=e81]: A strong generalist engineer comfortable writing backend code and working across APIs, auth protocols, and data pipelines
              - listitem [ref=e82]:
                - paragraph [ref=e83]: Experienced in customer-facing technical roles — pre-sales engineering, solutions engineering, or embedded delivery — where you've had to own outcomes, not just hand off specs
              - listitem [ref=e84]:
                - paragraph [ref=e85]: "Familiar with enterprise integration patterns: SSO (SAML, OIDC), REST and webhook-based APIs, and document management systems like iManage, SharePoint, or NetDocuments"
              - listitem [ref=e86]:
                - paragraph [ref=e87]: Able to move fast without cutting corners — you know when to build something robust and when to ship something good enough to unblock a customer
              - listitem [ref=e88]:
                - paragraph [ref=e89]: A clear communicator who can hold a technical conversation with an IT administrator and a strategic one with a managing partner — sometimes in the same meeting
              - listitem [ref=e90]:
                - paragraph [ref=e91]: Comfortable with ambiguity and energised by early-stage problems that don't have a playbook yet
