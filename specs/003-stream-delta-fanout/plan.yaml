plan:
  feature: jcode-ms5
  status: investigation-only
  design_owner: crates/jcode-app-core/src/agent/turn_streaming_mpsc.rs
  approach:
    - Build a deterministic synthetic stream model outside Rust compilation to define scenarios, event oracle, and measurement schema.
    - Once Rust host is idle, add or use the narrowest existing mock-provider test harness to execute the real MPSC path.
    - Capture wall time, process CPU, allocator counters where available, peak/current RSS, event count, and exact event digest.
    - Repeat each scenario five times in baseline state; record medians and dispersion.
    - Only prototype a candidate after identifying a concrete ownership-preserving optimization and rerun the same matrix.
    - Reject candidate on any parity mismatch, semantic-boundary drift, cancellation/retry issue, or less than 15% allocations or 10% CPU general-purpose gain.
  candidate_hypotheses:
    - name: move-text-payload
      status: needs-design
      reason: TextDelta must remain available for accumulation, inline tap, and wrapped-marker detection before fanout, so direct move is unsafe without restructuring ownership.
    - name: bounded-coalescing
      status: needs-design
      reason: Coalescing can change pacing/redraw and must flush at message/tool/thinking/retry/error/cancel boundaries with a strict byte/event bound.
  tests:
    - exact text and multibyte concatenation
    - thinking done before text/tool
    - tool input preservation and parse result
    - retry rollback and interruption marker
    - stream errors and cancellation
    - serialized wire event shape unchanged
  validation:
    - cargo fmt --all -- --check
    - focused jcode-app-core agent tests
    - relevant package build
    - clippy and scripts/check_guardrails.sh, serialized
    - isolated built-binary SSE fixture with JSON/NDJSON and Registry round trip
  blockers:
    - allocation peak is intentionally null because this run used the existing system allocator and no production allocator instrumentation; RSS deltas were zero at scenario granularity under getrusage
    - built public CLI acceptance is not applicable because production code is unchanged
  outcome_if_no_gain: investigation-only, production unchanged
  rust_baseline:
    harness: crates/jcode-app-core/src/agent_tests.rs::stream_delta_fanout_rust_baseline
    artifact: specs/003-stream-delta-fanout/rust-baseline.json
    command: cargo test -p jcode-app-core stream_delta_fanout_rust_baseline --no-default-features -- --ignored --nocapture
    path: real Agent::run_turn_streaming_mpsc with deterministic offline Provider fixture and unbounded ServerEvent fanout
    scenarios: [small-token, long-token, multibyte, tool-call, interruption-error, slow-consumer]
    evidence: wall_ms, self CPU ms, peak RSS delta kb, output count, SHA-256 event digest, terminal result
  outcome: >-
    Acceptance-complete investigation-only closure. The real Rust MPSC path was
    executed for every required scenario and emits repeatable event-count and
    digest evidence. The harness does not instrument allocations, so no
    allocation claim is made. Static ownership review plus the baseline show no
    safe general-purpose candidate: moving text requires ownership restructuring
    across accumulation, marker detection, inline tap, and fanout; coalescing
    risks pacing and boundary semantics. No production optimization is retained.
