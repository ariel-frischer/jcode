plan:
  branch: "agent/jcode-3so-session-profiles"
  created: "2026-08-09"
  spec_path: "specs/004-add-interactive-profiles/spec.yaml"

summary: |
  Extend the completed specs/003-add-session-profiles contract into the
  long-lived interactive session lifecycle. The implementation will reuse the
  existing Config/session-profile resolver, precedence rules, ToolConfig,
  prompt overlay, SkillRegistry, and diagnostics rather than introducing a
  second resolver. A validated profile selection will be carried as immutable,
  per-session state from CLI/TUI startup into the server Agent, and every
  future turn will use an explicitly selected or restored effective snapshot.

  Additive TUI commands will provide a searchable /profile picker, direct
  selection/clearing, profile inspection, and source-aware /info output. Session
  metadata will persist a redacted selected name and resolved snapshot so
  matching, missing, changed, and legacy restores are deterministic and
  visible. A session-local skill policy will be applied at listing, invocation,
  retrieval, prompt, child-agent, and swarm boundaries. Optional wire/debug
  fields will preserve old clients and no-profile behavior, while focused Rust,
  protocol, debug-socket, and TUI-state tests cover all deterministic behavior.

technical_context:
  language: "Rust 2024 edition"
  framework: "None"
  primary_dependencies:
    - name: "jcode-config-types"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns serde/TOML profile records, including the additive skills policy fields."
    - name: "jcode-base"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns Config resolution, ToolConfig, SkillRegistry filtering, prompt composition, and Session persistence/journal metadata."
    - name: "jcode-app-core"
      version: "workspace path dependency"
      purpose: "Owns per-session Agent state, server lifecycle, child-agent setup, swarm coordination, and debug state."
    - name: "jcode-tui"
      version: "workspace path dependency"
      purpose: "Owns slash-command dispatch, picker/overlay state, /info presentation, remote startup, and future-turn boundaries."
    - name: "jcode-protocol"
      version: "workspace path dependency"
      purpose: "Carries optional profile selection/snapshot metadata without changing existing request or event contracts."
    - name: "clap"
      version: "4"
      purpose: "Parses the existing global --profile option for interactive startup and profile inspection subcommands."
    - name: "serde / serde_json / toml"
      version: "workspace/current"
      purpose: "Preserves optional session metadata, wire compatibility, structured inspection output, and configuration semantics."
    - name: "ratatui / crossterm"
      version: "workspace/current"
      purpose: "Reuses the existing TUI picker, overlay, and input state without adding a rendering dependency."
  storage: "Existing ~/.jcode/config.toml (or configured JCODE_HOME) plus existing session JSON/journal metadata; no new store or migration"
  testing:
    framework: "Rust built-in test harness with existing jcode-base, jcode-app-core, jcode-tui, protocol, CLI, mock-provider, and debug-socket fixtures"
    approach: "Focused unit tests for config/policy/snapshots and pure commands; integration tests for Agent/server/session/child/swarm lifecycle; protocol compatibility and debug-socket tests; TUI state-machine tests for picker and slash commands; manual terminal checks only for rendering/raw input"
  target_platform: "Jcode-supported Linux, macOS, and Windows CLI/server builds"
  project_type: "cli"
  performance_goals: "Filtering and highlighting a 500-profile snapshot completes within 100ms in the state benchmark; selection/restore is local and deterministic before provider contact; no-profile startup, wire shape, prompt, tools, and output remain unchanged"
  constraints:
    - "specs/003-add-session-profiles is a completed prerequisite and remains the sole owner of the headless resolver, precedence, tool policy, prompt overlay, diagnostics, and documentation contracts."
    - "Profile selection is session-scoped; it must not rewrite config.toml, mutate a shared SkillRegistry, alter another session, or retroactively change an in-flight turn."
    - "The canonical field precedence remains invocation > environment > selected profile > unprofiled base config > built-in defaults; interactive adapters must not invent a competing order."
    - "Unknown profiles, invalid skills_mode values, unavailable skills, invalid overrides, and unsafe lifecycle handoffs fail visibly before provider contact or partial state mutation."
    - "Persisted profile metadata is optional and excludes credentials, API keys, full secret values, and other secret-bearing fields; legacy sessions and old wire payloads must deserialize."
    - "skills_mode supports all, allowlist, and none; omitted policy preserves existing no-profile behavior, and disabled_skills is subtractive everywhere."
    - "Child agents and swarm workers inherit effective profile/tool/skill restrictions unless an existing explicit override path is supplied, and overrides are child-local."
    - "Rendering and raw terminal input are the only manual validation exceptions; deterministic state, persistence, protocol, policy, and diagnostic behavior must be automated."
  scale_scope: "A small BTreeMap of configured profiles, one immutable effective selection/snapshot per session, and bounded child/swarm inheritance metadata across the existing local daemon"

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "Surgical, Scope-Bound Changes (PRIN-001)"
      status: "PASS"
      notes: "Keeps the work additive to the completed headless profile contract and limits changes to interactive startup, TUI state, session metadata, skill-policy enforcement, inheritance, compatibility tests, and required docs/changelog. Profile management and unrelated refactors remain out of scope."
    - name: "Backward-Compatible User and Data Contracts (PRIN-002)"
      status: "PASS"
      notes: "Uses optional serde-defaulted session and wire fields, omits empty no-profile metadata, preserves old clients/fixtures, and retains the existing no-profile CLI, prompt, tool, protocol, and headless output paths."
    - name: "Explicit Configuration Precedence (PRIN-003)"
      status: "PASS"
      notes: "Delegates all effective values to the prerequisite resolver, records field sources for inspection, keeps restored snapshots authoritative until explicit selection, and treats TUI changes as future-turn session state rather than global configuration."
    - name: "Layered Rust Ownership and Dependency Direction (PRIN-004)"
      status: "PASS"
      notes: "Places stable policy/config records in jcode-config-types, resolution and persistence in jcode-base, per-session orchestration in app-core, wire compatibility in jcode-protocol, and presentation/input state in jcode-tui/CLI."
    - name: "Focused Behavioral Tests (PRIN-005)"
      status: "PASS"
      notes: "Maps selection, picker state, inspection, snapshots, drift, skill truth tables, child/swarm inheritance, wire compatibility, debug observability, and no-profile regressions to focused automated tests."
    - name: "Visible Failures and Trust-Boundary Validation (PRIN-006)"
      status: "PASS"
      notes: "Validates names, policy modes, skill references, overrides, and lifecycle handoffs at their owning boundaries before provider work; warnings and diagnostics contain safe names/sources only and never secrets."
    - name: "Repository Guardrails Are Delivery Gates (PRIN-007)"
      status: "PASS"
      notes: "Requires artifact validation, focused affected-package checks, protocol/debug/e2e evidence, documentation/changelog updates, and repository guardrails while preserving unrelated dirty work."

research_findings:
  decisions:
    - topic: "Prerequisite resolver ownership"
      decision: "Treat specs/003-add-session-profiles/plan.yaml and its implemented Config/session-profile seams as the sole canonical resolver; add only additive policy/snapshot projections needed by interactive lifecycle."
      rationale: "The follow-on spec explicitly forbids a second headless resolver. Reusing existing precedence, ToolConfig composition, prompt overlay, and diagnostics prevents interactive/headless drift."
      alternatives_considered:
        - "Create a TUI-specific profile resolver, which would duplicate precedence and produce inconsistent effective values."
        - "Recompute profile state from serialized session fields in each child/UI path, which would lose one canonical validation boundary."
    - topic: "Interactive startup transport"
      decision: "Validate --profile in the CLI before provider/session work, then carry the optional selection and effective startup policy through the existing Subscribe/new-session handoff; keep server-side Agent state session-local."
      rationale: "The current interactive path can use a shared daemon, so environment or global Config mutation would leak across sessions. Optional request fields allow new clients to select a profile while old clients remain valid."
      alternatives_considered:
        - "Write the selected profile into process-global configuration or environment, which would affect unrelated sessions."
        - "Let a shared daemon infer the profile from client-local state, which cannot safely guarantee the server Agent uses the same policy."
        - "Require a new protocol version, which is unnecessary for optional fields and would break existing clients."
    - topic: "TUI picker and future-turn state"
      decision: "Reuse the existing command-palette/searchable overlay state seam with a deterministic profile-name snapshot; route picker selections and direct /profile commands through one atomic state transition that applies at the next-turn boundary."
      rationale: "The TUI already has fuzzy filtering, highlighting, cancellation, and slash dispatch patterns. A pending selection avoids changing an immutable in-flight Agent turn and keeps failed selections atomic."
      alternatives_considered:
        - "Add a second bespoke modal implementation, which would duplicate input/rendering state and increase manual-only behavior."
        - "Mutate the active Agent while it is processing, which violates the future-turn and isolation requirements."
    - topic: "Profile inspection and source reporting"
      decision: "Expose pure profile list/show/current/resolve command projections and extend /info with effective non-secret fields and per-field source labels; no inspection path initializes a provider, writes config, or mutates a session."
      rationale: "Resolver output already has the information needed for a safe projection, and pure inspection provides deterministic CLI/debug tests. Redaction at the projection boundary prevents credentials or instruction bodies from entering output."
      alternatives_considered:
        - "Reuse provider startup to discover effective values, which adds network/provider side effects to diagnostics."
        - "Print the raw config/session snapshot, which would expose secret-bearing values and obscure precedence."
    - topic: "Session snapshot and restore semantics"
      decision: "Extend Session, SessionJournalMeta, startup stubs, and remote startup snapshots with optional selected name plus a redacted resolved snapshot/fingerprint. Restore matching snapshots silently, warn on missing or drifted named profiles, keep the snapshot authoritative, and preserve legacy no-profile fixtures."
      rationale: "Session metadata is the existing durable boundary, and an immutable snapshot makes resumes reproducible when config changes. Optional serde fields maintain old file compatibility while explicit warnings make drift visible."
      alternatives_considered:
        - "Persist only the profile name and re-resolve on every restore, which silently changes old work when config drifts."
        - "Persist credentials or raw config, which creates a secret-storage and compatibility risk."
        - "Fallback to another configured profile when the saved name is missing, which violates deterministic restore and user intent."
    - topic: "Skill policy enforcement"
      decision: "Represent an optional skills_mode (all/allowlist/none) and disabled_skills in the profile contract, then derive a session-local filtered SkillRegistry/effective-skill view used by listing, slash activation, retrieval/discovery, and prompt assembly."
      rationale: "A single policy projection prevents alternate skill surfaces from bypassing restrictions while preserving omitted/no-profile legacy behavior. Filtering a view avoids mutating the shared registry or leaking project-local skills between sessions."
      alternatives_considered:
        - "Filter only the prompt's available-skill text, which would leave direct activation or retrieval bypasses."
        - "Mutate the process-global SkillRegistry, which would violate two-session isolation."
        - "Treat disabled_skills as a UI-only hide list, which would not enforce the trust boundary."
    - topic: "Child-agent and swarm inheritance"
      decision: "Extend the existing child/swarm spawn identity and persisted worker metadata with the parent's effective profile/snapshot and tool/skill policy; use current explicit override syntax to replace only the child/worker value."
      rationale: "comm_session and client lifecycle already own spawn selection and resume/restart paths, so inheritance can be added at the boundary where parent identity is resolved and persisted."
      alternatives_considered:
        - "Re-read current global config for every child, which loses the parent snapshot and can drift during a swarm."
        - "Copy the parent policy into global defaults, which leaks restrictions to unrelated sessions."
        - "Add a new override grammar, which is unnecessary while existing child/swarm override fields exist."
    - topic: "Protocol and debug compatibility"
      decision: "Add only optional, serde-defaulted profile metadata to Subscribe/ResumeSession and relevant state/debug projections, with neutral omission for no-profile clients; use the debug socket as the deterministic cross-process observation seam."
      rationale: "Existing wire tests already exercise randomized and legacy request shapes, and debug commands can inspect the server-owned session without requiring terminal rendering."
      alternatives_considered:
        - "Make profile fields required, which breaks older clients and fixtures."
        - "Expose profile state only through TUI text, which prevents deterministic integration validation."

data_model:
  entities:
    - name: "InteractiveProfileSelection"
      description: "Session-owned selection state applied at a future-turn boundary, including explicit none and restored-snapshot status."
      fields:
        - name: "profile_name"
          type: "Option<String>"
          description: "Exact configured profile selected by CLI/TUI, or none for explicit unprofiled mode."
          constraints: "Exact-name lookup; empty/unknown names are rejected before state mutation."
        - name: "source"
          type: "SelectionSource"
          description: "Invocation, picker/direct command, restored snapshot, or explicit none."
          constraints: "Must be safe to display; no credentials or raw instruction content."
        - name: "pending_until_turn_boundary"
          type: "bool"
          description: "Indicates a valid selection waiting for the current turn to finish."
          constraints: "Never changes the immutable policy of an in-flight request."
        - name: "restore_status"
          type: "RestoreStatus"
          description: "Fresh, matching, missing, changed, or legacy state used for warnings."
          constraints: "Warnings identify only safe profile names and drift fields."
      relationships:
        - target: "ResolvedProfileSnapshot"
          type: "one-to-one"
          description: "The active selection owns the effective snapshot used for future turns."
        - target: "Session"
          type: "many-to-one"
          description: "Each interactive session has at most one active selection."
    - name: "ResolvedProfileSnapshot"
      description: "Redacted, immutable effective values sufficient to restore one session without re-reading secrets or silently following config drift."
      fields:
        - name: "profile_name"
          type: "Option<String>"
          description: "Selected profile identifier, absent for no-profile sessions."
          constraints: "Optional and omitted from legacy/no-profile serialization."
        - name: "provider_model_reasoning"
          type: "SafeProviderSnapshot"
          description: "Effective provider, model, reasoning effort, and named provider profile."
          constraints: "Contains identifiers and source metadata only; excludes credentials/API keys."
        - name: "tool_policy"
          type: "ToolSelectionSnapshot"
          description: "Effective tool profile, allowed tools, and disabled tools."
          constraints: "Canonical names only; validated before persistence."
        - name: "skill_policy"
          type: "SkillPolicySnapshot"
          description: "Effective skills_mode, selected/available skills, and disabled skills."
          constraints: "Names and mode only; no skill secret or full prompt text required for policy restoration."
        - name: "prompt_overlay"
          type: "SessionPromptOverlaySnapshot"
          description: "Safe selected-skill/instruction presence and the data required by the existing additive prompt layer."
          constraints: "Redacted or separately protected according to existing session serialization; never includes provider credentials or diagnostic echoes."
        - name: "fingerprint"
          type: "String"
          description: "Stable non-secret digest used to detect profile drift."
          constraints: "Deterministic for equivalent effective values and never reversible secret material."
      relationships:
        - target: "Session"
          type: "one-to-one"
          description: "Persisted as optional session metadata and restored before future turns."
        - target: "ResolvedSessionProfile"
          type: "one-to-one"
          description: "Produced from the canonical resolver and compared on restore."
    - name: "SkillPolicy"
      description: "Session-local policy projection governing every skill consumer."
      fields:
        - name: "mode"
          type: "Option<SkillsMode>"
          description: "all, allowlist, or none; omitted means the established legacy behavior."
          constraints: "Only supported values accepted; none yields an empty effective set."
        - name: "selected_skills"
          type: "Vec<String>"
          description: "Allowlist inputs or resolved names for inspection and inheritance."
          constraints: "Validated against the effective working-directory registry; deterministic deduplication."
        - name: "disabled_skills"
          type: "Vec<String>"
          description: "Subtractive deny-list applied after all/allowlist selection."
          constraints: "Validated/canonicalized and enforced for list, invocation, retrieval, prompt, and descendants."
        - name: "effective_skills"
          type: "Vec<String>"
          description: "Final session-local usable skill view."
          constraints: "No shared registry mutation; identical across all skill surfaces."
      relationships:
        - target: "SkillRegistry"
          type: "many-to-one"
          description: "Derived as a filtered view of the global/project registry for one session."
        - target: "ResolvedProfileSnapshot"
          type: "one-to-one"
          description: "Serialized as part of the restored policy."
    - name: "ProfileInspectionResult"
      description: "Secret-safe projection used by CLI profile commands, /info, and debug state."
      fields:
        - name: "configured"
          type: "Option<NamedSessionProfileSummary>"
          description: "Configured values and presence summaries for list/show."
          constraints: "Never prints credentials, complete secret values, or full instruction bodies."
        - name: "effective"
          type: "ResolvedProfileSummary"
          description: "Current/resolved non-secret fields and effective tool/skill policy."
          constraints: "No provider/network initialization or session/config mutation."
        - name: "sources"
          type: "BTreeMap<String, FieldSource>"
          description: "Per-field invocation/environment/profile/base/default/restored source labels."
          constraints: "Only safe field names and source labels are exposed."
        - name: "warnings"
          type: "Vec<ProfileWarning>"
          description: "Missing/changed restore and blocked-policy diagnostics."
          constraints: "Actionable, non-secret, and stable enough for structured tests."
      relationships:
        - target: "InteractiveProfileSelection"
          type: "many-to-one"
          description: "Reports the current selection and restore status for one session context."

api_contracts:
  endpoints: []

project_structure:
  documentation:
    - path: "specs/003-add-session-profiles/plan.yaml"
      description: "Completed prerequisite reference; interactive documentation must reuse its headless resolver, precedence, and no-profile contracts."
    - path: "crates/jcode-base/src/config/default_file.rs"
      description: "Document skills_mode/disabled_skills, interactive selection semantics, source precedence, snapshot warnings, and a secret-free profile example."
    - path: "README.md"
      description: "Add --profile startup, /profile switching/none, inspection, restore-warning, and no-profile compatibility examples."
    - path: "docs/WRAPPERS.md"
      description: "Document CLI/profile inspection and wrapper expectations without changing existing headless run modes."
    - path: "changelog/v<next-release>.json"
      description: "Add the user-facing interactive profiles, skill policy, and restore warning entry to the next unreleased release artifact."
  source_code:
    - path: "crates/jcode-config-types/src/lib.rs"
      description: "Add serde/TOML skills_mode and disabled_skills fields to the existing SessionProfileConfig contract with omitted-field compatibility."
    - path: "crates/jcode-base/src/config/session_profile.rs"
      description: "Extend the canonical resolver with SkillPolicy, safe inspection projections, redacted snapshot/fingerprint creation, and drift comparison helpers."
    - path: "crates/jcode-base/src/skill.rs"
      description: "Provide a session-local filtered skill view and central policy checks reused by listing, invocation, retrieval/discovery, and prompt assembly."
    - path: "crates/jcode-base/src/prompt.rs"
      description: "Compose the effective skill policy and restored/profile prompt overlay while preserving the no-profile prompt bytes and existing layer order."
    - path: "crates/jcode-base/src/session.rs"
      description: "Persist optional selected profile and redacted resolved snapshot; restore matching, missing, changed, and legacy states with safe warnings."
    - path: "crates/jcode-base/src/session/journal.rs"
      description: "Carry profile metadata through journal diffs, startup stubs, remote startup snapshots, save/checkpoint, and replay metadata."
    - path: "crates/jcode-app-core/src/agent.rs"
      description: "Own immutable per-session profile/skill policy and future-turn application while retaining existing no-profile constructors."
    - path: "crates/jcode-app-core/src/agent/prompting.rs"
      description: "Build prompts from the session-local filtered skills and resolved profile overlay."
    - path: "crates/jcode-app-core/src/server/client_lifecycle.rs"
      description: "Validate interactive Subscribe profile state before Agent/session creation and expose optional startup metadata to the owning session."
    - path: "crates/jcode-app-core/src/server/client_session.rs"
      description: "Restore profile snapshots, surface missing/changed warnings, apply future-turn transitions, and keep session metadata isolated."
    - path: "crates/jcode-app-core/src/server/comm_session.rs"
      description: "Propagate effective profile/tool/skill snapshot through child-agent and swarm spawn, resume, restart, and replay identity with child-local overrides."
    - path: "crates/jcode-app-core/src/server/debug_command_exec.rs"
      description: "Add safe profile/current/policy/session inspection to the existing debug-socket seam."
    - path: "crates/jcode-protocol/src/wire.rs"
      description: "Add optional serde-defaulted profile selection/snapshot/status fields to Subscribe/ResumeSession or state projections without changing old request shapes."
    - path: "crates/jcode-tui/src/tui/app.rs"
      description: "Store current/pending profile selection, filtered skill view, restore warnings, and future-turn transition state."
    - path: "crates/jcode-tui/src/tui/app/command_palette.rs"
      description: "Reuse existing fuzzy searchable overlay mechanics for deterministic profile picker filtering, selection, cancellation, and empty states."
    - path: "crates/jcode-tui/src/tui/app/commands_dispatch.rs"
      description: "Route /profile, /profile <name>, and /profile none through one atomic selection command path."
    - path: "crates/jcode-tui/src/tui/app/state_ui.rs"
      description: "Extend /info and profile inspection presentation with effective non-secret fields, sources, and restore warnings."
    - path: "crates/jcode-tui/src/tui/app/state_ui_input_helpers.rs"
      description: "Register profile slash-command help/completion and existing overlay transitions."
    - path: "crates/jcode-tui/src/tui/app/input.rs"
      description: "Apply the filtered skill policy to direct slash activation and pending future-turn input handling."
    - path: "crates/jcode-tui/src/tui/app/remote/input_dispatch.rs"
      description: "Keep remote command and skill activation behavior aligned with the server-owned session policy."
    - path: "crates/jcode-tui/src/tui/backend.rs"
      description: "Send optional profile startup/resume metadata and consume compatibility-safe profile state/warnings."
    - path: "src/cli/args.rs"
      description: "Preserve global --profile parsing for interactive startup and add profile list/show/current/resolve subcommand arguments if needed by the existing command enum."
    - path: "src/cli/commands.rs"
      description: "Implement pure profile inspection command projections and structured/plain output without provider initialization or mutation."
    - path: "src/cli/profile.rs"
      description: "Adapt the prerequisite effective resolver/snapshot projection for interactive startup and inspection while keeping headless behavior unchanged."
    - path: "src/cli/dispatch.rs"
      description: "Validate --profile before default interactive provider/session work and pass optional startup metadata to TUI launch."
    - path: "src/cli/tui_launch.rs"
      description: "Thread validated profile selection into remote TUI Subscribe/resume startup without global daemon mutation."
  tests:
    - path: "crates/jcode-base/src/config_tests/session_profiles.rs"
      description: "skills_mode/disabled_skills parsing, truth table, profile validation, safe summaries, source precedence, snapshots, and drift fingerprints."
    - path: "crates/jcode-base/src/session_tests/cases.rs"
      description: "Selected-name/snapshot journal round trips, legacy fixture compatibility, matching/missing/changed restore warnings, and session-only persistence."
    - path: "crates/jcode-base/src/prompt_tests.rs"
      description: "No-profile prompt regression plus all/allowlist/none/disabled skill filtering and deterministic profile overlay content."
    - path: "crates/jcode-app-core/src/agent_tests/"
      description: "Per-session policy isolation, future-turn application, tool/skill blocking, prompt/retrieval behavior, and no provider request on invalid selection."
    - path: "crates/jcode-app-core/src/server/client_lifecycle_tests.rs"
      description: "Profile-aware Subscribe/resume startup, legacy requests, restore warnings, session isolation, and debug-observable effective state."
    - path: "crates/jcode-app-core/src/server/comm_session_tests.rs"
      description: "Child-agent and swarm inheritance, explicit child/worker overrides, resume/restart/replay snapshots, and parent non-mutation."
    - path: "crates/jcode-protocol/src/protocol_tests/"
      description: "Old/new wire fixtures, optional-field serialization, no-profile neutrality, and ResumeSession/Subscribe compatibility."
    - path: "crates/jcode-tui/src/tui/app/tests.rs"
      description: "Picker open/filter/highlight/cancel/select/no-match states, atomic failed selection, future-turn boundary, /profile none, and /info projection."
    - path: "src/cli/profile.rs"
      description: "Pure list/show/current/resolve output, redaction, source labels, unknown/missing cases, and zero-provider side effects."
    - path: "src/cli/args/tests.rs"
      description: "Interactive --profile placement, omitted/unknown values, and profile inspection command parsing without changing unrelated commands."
    - path: "tests/e2e/session_flow.rs"
      description: "Deterministic debug/mock-provider interactive startup, future-turn switching, restore warnings, profile metadata, and two-session isolation."
    - path: "tests/e2e/provider_behavior.rs"
      description: "No-profile headless plain/JSON/NDJSON/schema regressions and pre-provider failure behavior for invalid profile/policy values."
    - path: "tests/e2e/profile_debug_socket.rs"
      description: "Profile selection, effective inspection, child/swarm metadata, and warning behavior through the deterministic debug socket."

implementation_phases:
  - phase: 1
    name: "Extend the canonical profile and skill-policy contract"
    goal: "Add interactive-safe policy and snapshot projections to the completed resolver without changing headless semantics."
    deliverables:
      - "Extend SessionProfileConfig with optional skills_mode and disabled_skills, strict supported-value validation, and omitted-field legacy behavior."
      - "Implement one effective SkillPolicy projection with all/allowlist/none truth-table semantics and subtractive disabled skills across the working-directory-aware registry."
      - "Add safe inspection/source projections and redacted resolved snapshot/fingerprint helpers owned by the existing resolver."
      - "Add focused config, policy, prompt, redaction, and no-profile regression tests."
  - phase: 2
    name: "Interactive CLI/server startup and optional wire handoff"
    goal: "Make --profile work for new TUI sessions with validation before provider/session work and preserve old clients."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Validate the existing global --profile input before default interactive provider/session startup, including actionable unknown/empty/missing-profile diagnostics."
      - "Carry optional profile selection/effective startup metadata through Subscribe/new-session and resume paths into a per-session Agent; do not mutate a shared daemon/global config."
      - "Keep old Subscribe/ResumeSession payloads, no-profile requests, ACP clients, and headless plain/JSON/NDJSON/schema output neutral."
      - "Add protocol, startup, lifecycle, and debug-socket tests proving invalid selections make no provider request or partial session."
  - phase: 3
    name: "TUI profile picker, switching, and inspection"
    goal: "Expose searchable/direct/none profile controls and safe current/effective inspection while respecting future-turn semantics."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Reuse the existing searchable overlay/picker state for /profile with deterministic ordering, active indication, cancellation, no-match, and no-profile states; meet the 500-profile/100ms state benchmark."
      - "Route picker selection, /profile <name>, and /profile none through an atomic pending transition applied only after the current turn, retaining the prior state on failure."
      - "Add profile list/show/current/resolve command projections and extend /info with effective non-secret fields, per-field sources, policy, and restore warnings without provider/network side effects."
      - "Add TUI state, CLI command, redaction, and source-reporting tests; keep manual validation limited to terminal rendering/raw input."
  - phase: 4
    name: "Session metadata, restore, and drift warnings"
    goal: "Persist and restore selected profile state reproducibly across local, remote, legacy, and journaled session paths."
    dependencies:
      - "Phase 1"
      - "Phase 2"
    deliverables:
      - "Extend Session/journal/startup-stub/remote-snapshot serialization with optional selected name and credential-free resolved snapshot/fingerprint, omitting empty no-profile fields."
