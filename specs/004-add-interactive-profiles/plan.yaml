risks:
  - id: "RISK-001"
    risk: "A profile selected by a client could leak through a shared daemon if startup state is stored in process-global environment/config or applied to the wrong Agent."
    likelihood: "medium"
    impact: "high"
    mitigation: "Validate before provider contact, carry optional per-session metadata over Subscribe/resume, keep immutable Agent policy, and fail clearly when the lifecycle cannot isolate a profile. Add two-session/debug tests."
  - id: "RISK-002"
    risk: "A pending profile change could affect an in-flight turn or leave partially applied tool/skill restrictions after a failed selection."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use a validated pending transition committed only at the future-turn boundary, replace the complete policy atomically, and assert failed selections preserve the prior snapshot."
  - id: "RISK-003"
    risk: "Persisted snapshots, warnings, or inspection output could expose credentials, full instruction text, or other secret-bearing values."
    likelihood: "low"
    impact: "high"
    mitigation: "Define a typed redacted snapshot/projection, persist identifiers/policy/fingerprints only where sufficient, and test output/serialized bytes against credential-like fixtures."
  - id: "RISK-004"
    risk: "One skill surface could bypass skills_mode or disabled_skills, making the policy appear enforced while direct activation or retrieval still exposes content."
    likelihood: "medium"
    impact: "high"
    mitigation: "Centralize effective-skill filtering at the session-local registry/policy seam and exercise list, slash, retrieval, prompt, child, and swarm consumers from the same truth table."
  - id: "RISK-005"
    risk: "Changed or missing profiles could silently re-resolve a session and make historical work non-reproducible."
    likelihood: "medium"
    impact: "high"
    mitigation: "Persist a stable redacted snapshot/fingerprint, make it authoritative on restore, emit explicit missing/changed warnings, and require deliberate profile selection to replace it."
  - id: "RISK-006"
    risk: "Adding wire fields or command variants could break older clients, ACP, randomized protocol fixtures, or no-profile output contracts."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Use optional serde-defaulted fields, neutral omission for no-profile, preserve existing constructors/commands, and run old/new wire and headless regression fixtures."
  - id: "RISK-007"
    risk: "A large profile map could make picker filtering sluggish or nondeterministic."
    likelihood: "low"
    impact: "medium"
    mitigation: "Snapshot stable BTreeMap names once, use the existing bounded fuzzy-filter state, avoid provider/filesystem work per keystroke, and benchmark 500 profiles under 100ms."

