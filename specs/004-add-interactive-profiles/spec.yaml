feature:
  branch: "004-add-interactive-profiles"
  created: "2026-08-08"
  status: "Draft"
  input: "Complete the remaining scope of upstream issue #721, building on the already implemented and validated headless subset in specs/003-add-session-profiles. Do not duplicate or discard the existing config/profile resolver, jcode run plain/json/ndjson/schema, tool policy, prompt overlay, precedence, diagnostics, and documentation work. Generate a follow-on feature spec/plan/tasks for the missing first-class session-profile behavior: jcode --profile <name> for new interactive TUI sessions; /profile searchable picker, /profile <name> switching for future turns, and /profile none; profile list/show/current/resolve inspection commands; /info effective profile and non-secret source reporting; persistence of profile name and resolved snapshot in session metadata with restore and missing/changed-profile warnings; skills_mode all/allowlist/none, disabled_skills, and enforcement across available skills, slash activation, retrieval/discovery, and prompt context; inheritance of profile and tool/skill restrictions by child agents and swarm workers unless explicitly overridden; protocol and no-profile compatibility. Reuse existing TUI overlay/picker, slash-command, info, session serialization, debug-socket tester, SkillRegistry, tool policy, prompt, and swarm seams. Define automated unit/integration/debug-socket/TUI state tests and reserve manual terminal validation only for rendering/input behavior that cannot be automated. The follow-on artifacts must clearly reference specs/003-add-session-profiles as completed prerequisite work."

user_stories:
  - id: "US-001"
    title: "Start an interactive session with a profile"
    priority: "P1"
    as_a: "Jcode user starting a new interactive TUI session"
    i_want: "to select a named session profile with jcode --profile <name>"
    so_that: "the session starts with the same deliberate provider, model, tool, prompt, and skill policy I use for recurring work"
    why_this_priority: "Initial interactive selection is the entry point for making the already validated headless profile contract useful in the TUI."
    independent_test: "Start a new session against a deterministic provider/debug fixture with a valid, unknown, and omitted profile and inspect the resulting session setup before sending a turn."
    acceptance_scenarios:
      - given: "A valid profile named review exists in the loaded configuration"
        when: "The user runs jcode --profile review and starts a new interactive session"
        then: "The new session uses review's resolved profile values and records the selected profile without changing persisted configuration"
      - given: "The user supplies an unknown profile name"
        when: "The interactive session is requested"
        then: "Startup stops before provider/session work with an actionable diagnostic naming the requested name and available choices"
      - given: "The user omits --profile"
        when: "A new interactive session starts"
        then: "The existing no-profile startup behavior, prompt, tools, and protocol messages remain unchanged"

  - id: "US-002"
    title: "Switch profiles for future turns"
    priority: "P1"
    as_a: "User in an active TUI session"
    i_want: "to search profiles with /profile, choose /profile <name>, or clear the choice with /profile none"
    so_that: "I can change the setup for the next task without restarting or altering an in-flight turn"
    why_this_priority: "Interactive switching is the primary missing first-class behavior and must be predictable during a long-lived session."
    independent_test: "Drive the TUI command state machine with slash-command events, assert picker filtering/selection state, and verify that the next turn receives the selected effective profile."
    acceptance_scenarios:
      - given: "The session has several configured profiles"
        when: "The user invokes /profile and types a search term"
        then: "The existing searchable overlay lists only matching profiles with a deterministic active/disabled state"
      - given: "A profile picker or direct /profile <name> selection succeeds"
        when: "The current turn completes and the user submits the next turn"
        then: "Only the future turn uses the newly resolved profile; the completed turn is not retroactively changed"
      - given: "The user invokes /profile none"
        when: "The next turn is submitted"
        then: "The session returns to the documented unprofiled resolution while retaining normal base configuration and no stale profile restrictions"
      - given: "The requested profile is invalid or unavailable"
        when: "The user selects it from the picker or direct command"
        then: "The selection is rejected atomically, the current effective profile remains active, and the diagnostic is actionable"

  - id: "US-003"
    title: "Inspect profile configuration and effective state"
    priority: "P1"
    as_a: "User diagnosing or auditing a session setup"
    i_want: "profile list, show, current, and resolve commands plus /info profile details"
    so_that: "I can understand configured values, effective values, precedence, and sources without exposing secrets or starting a provider"
    why_this_priority: "Inspection prevents opaque profile behavior and is required to diagnose precedence and restore warnings safely."
    independent_test: "Run each inspection command against fixture configurations and an active session, then compare structured output with the resolver result and redaction rules."
    acceptance_scenarios:
      - given: "Configuration contains multiple profiles and the session has one selected"
        when: "The user runs profile list and profile current"
        then: "The commands show deterministic names, the selected/current state, and no credentials or secret values"
      - given: "A profile has values overridden by an invocation, environment, or session state"
        when: "The user runs profile resolve or /info"
        then: "Output reports effective non-secret values and a source for each relevant field, including that an override won"
      - given: "The user runs profile show for a profile containing instructions or secret-bearing provider settings"
        when: "The command renders its result"
        then: "It reports safe presence/summary information and never prints credentials, API keys, or complete secret values"
      - given: "No profile is selected"
        when: "The user runs profile current or /info"
        then: "Output explicitly reports no profile and the effective unprofiled sources rather than inventing a name"

  - id: "US-004"
    title: "Restore profile state across sessions"
    priority: "P1"
    as_a: "User resuming a saved or crashed session"
    i_want: "the selected profile name and resolved snapshot to be persisted in session metadata"
    so_that: "a resumed session is reproducible even when configuration changes after the session was created"
    why_this_priority: "Long-lived sessions need deterministic restore semantics and visible drift warnings instead of silent behavior changes."
    independent_test: "Create, persist, reload, and resume sessions from JSON fixtures with matching, missing, changed, and legacy profile metadata."
    acceptance_scenarios:
      - given: "A session was saved with profile review and a resolved snapshot"
        when: "The same profile is unchanged when the session is restored"
        then: "The profile and snapshot restore without a warning and future turns use the restored effective state"
      - given: "The saved profile no longer exists"
        when: "The session is restored"
        then: "The saved snapshot remains usable, a non-secret missing-profile warning is surfaced, and the user can explicitly choose another profile"
      - given: "The saved profile exists but its resolved values differ from the snapshot"
        when: "The session is restored"
        then: "A non-secret changed-profile warning identifies drift, keeps the restored snapshot deterministic, and does not silently overwrite session state"
      - given: "A legacy session has no profile metadata"
        when: "It is loaded or resumed"
        then: "Deserialization succeeds and the session follows the pre-profile no-profile behavior"

  - id: "US-005"
    title: "Apply a consistent skill policy"
    priority: "P1"
    as_a: "User who controls which skills a session may use"
    i_want: "skills_mode all, allowlist, or none and disabled_skills to govern every skill surface"
    so_that: "available-skill context, slash activation, retrieval/discovery, and prompt content cannot bypass my profile restrictions"
    why_this_priority: "A partial skill restriction would be misleading and could expose tools or prompt context the user deliberately disabled."
    independent_test: "Build a fixture SkillRegistry and exercise listing, direct slash invocation, retrieval/discovery, and prompt assembly under all three modes and disabled-skills combinations."
    acceptance_scenarios:
      - given: "skills_mode is all and disabled_skills contains one installed skill"
        when: "The session lists or activates skills"
        then: "All other available skills are visible and usable, while the disabled skill is absent or rejected consistently"
      - given: "skills_mode is allowlist with selected skills and disabled_skills"
        when: "The session resolves prompt context or invokes a skill"
        then: "Only allowlisted, non-disabled skills are discoverable, activatable, retrievable, and rendered"
      - given: "skills_mode is none"
        when: "The session asks for available skills, uses a slash skill, or resolves retrieval context"
        then: "No skills are exposed or activated and the user receives a clear policy diagnostic where an explicit activation is blocked"
      - given: "A profile references an unavailable or empty skill name"
        when: "The profile is selected or resolved"
        then: "Selection fails before a turn with the profile, skill, and safe available-name guidance"

  - id: "US-006"
    title: "Inherit profile restrictions in child work"
    priority: "P1"
    as_a: "User running child agents or a swarm from a profiled session"
    i_want: "child agents and swarm workers to inherit the effective profile and tool/skill restrictions by default"
    so_that: "delegated work cannot silently escape the parent session's policy"
    why_this_priority: "Agent and swarm boundaries are security and reproducibility boundaries, not merely UI conveniences."
    independent_test: "Spawn deterministic child-agent and swarm-worker fixtures, inspect their startup metadata and effective tool/skill sets, and exercise an explicit child override."
    acceptance_scenarios:
      - given: "A parent session has profile review, a restricted tool selection, and an allowlisted skill policy"
        when: "It starts a child agent or swarm worker without an override"
        then: "The child inherits the profile name, resolved snapshot, tools, skills mode, allowlist, and disabled skills"
      - given: "A child explicitly supplies a supported profile or policy override"
        when: "The child starts"
        then: "The explicit child value wins for that child only, is visible in its inspection metadata, and does not mutate the parent"
      - given: "A swarm worker is resumed or restarted"
        when: "Its session metadata is restored"
        then: "The inherited restrictions and drift warnings remain consistent with the originating parent snapshot"

  - id: "US-007"
    title: "Preserve protocol and no-profile compatibility"
    priority: "P1"
    as_a: "User or integration using existing clients, protocols, or headless commands"
    i_want: "profile metadata and controls to be additive and optional"
    so_that: "existing clients, sessions, debug tooling, and jcode run output modes continue to work when no profile is used"
    why_this_priority: "Jcode has persisted and cross-process contracts; compatibility is required before interactive state can ship."
    independent_test: "Replay old session/protocol fixtures and run plain, JSON, NDJSON, schema, and debug-socket cases with profile selection omitted and present."
    acceptance_scenarios:
      - given: "An older client or session payload omits profile fields"
        when: "The current server loads it"
        then: "The payload is accepted with the legacy no-profile defaults and no protocol-version break"
      - given: "A no-profile headless command uses plain, JSON, NDJSON, or schema output"
        when: "The command runs through the existing resolver"
        then: "Its request shape, output schema, tools, prompt, and diagnostics remain unchanged"
      - given: "A debug-socket test selects a profile"
        when: "The server starts and the test inspects the session"
        then: "The profile state is observable through the debug seam without requiring manual terminal interaction"

  - id: "US-008"
    title: "Validate and document the interactive contract"
    priority: "P2"
    as_a: "Maintainer reviewing the follow-on feature"
    i_want: "deterministic automated evidence and documentation for every profile lifecycle rule"
    so_that: "the implementation can be reviewed without relying on fragile manual terminal sessions"
    why_this_priority: "Rendering and input need human eyes, but state, persistence, protocol, policy, and diagnostics must be regression-tested."
    independent_test: "Map every functional requirement to a focused unit, integration, debug-socket, or TUI-state test and run the artifact/documentation validators."
    acceptance_scenarios:
      - given: "A profile lifecycle behavior can be observed without a real terminal"
        when: "The feature is validated"
        then: "An automated test covers it and records the exact command or test name"
      - given: "Only rendering or raw input behavior cannot be observed by the state harness"
        when: "The feature is validated"
        then: "Manual terminal validation is limited to that behavior and documents the environment and expected observation"

requirements:
  functional:
    - id: "FR-001"
      description: "The follow-on implementation MUST treat specs/003-add-session-profiles as a completed prerequisite and MUST reuse its config/profile resolver, headless run modes, tool policy, prompt overlay, precedence, diagnostics, and documentation contracts rather than reimplementing them."
      acceptance_criteria: "The plan and implementation map each reused contract to the prerequisite artifact and contain no second headless resolver or conflicting field semantics."
    - id: "FR-002"
      description: "The interactive CLI MUST accept jcode --profile <name> when creating a new TUI session and MUST validate the name before provider/session work begins."
      acceptance_criteria: "CLI and startup tests cover valid, empty, unknown, and omitted names; unknown selection produces no provider request or created interactive session."
    - id: "FR-003"
      description: "The initial interactive profile selection MUST use the same documented precedence and effective values as the completed headless profile resolver for every field it owns."
      acceptance_criteria: "A shared resolver fixture produces identical effective provider, model, reasoning, tool, prompt, and skill-policy values for equivalent interactive and headless selections."
    - id: "FR-004"
      description: "The TUI MUST expose /profile as a searchable picker using the existing overlay/picker state seam, with deterministic ordering, active-profile indication, and safe empty/error states."
      acceptance_criteria: "TUI state tests assert opening, filtering, highlighting, selection, cancellation, no matches, and no configured profiles without depending on terminal rendering."
    - id: "FR-005"
      description: "The slash-command path MUST accept /profile <name> and apply the selected profile atomically for future turns only."
      acceptance_criteria: "State and integration tests prove an in-flight/current turn is unchanged, the next turn uses the new resolution, and a failed selection leaves the previous effective profile intact."
    - id: "FR-006"
      description: "The slash-command path MUST accept /profile none and clear the session's explicit profile selection for future turns without mutating persisted global configuration."
      acceptance_criteria: "Tests assert the next turn follows the existing unprofiled resolution, stale tool/skill restrictions are removed, and the config file is unchanged."
    - id: "FR-007"
      description: "Profile list, profile show, profile current, and profile resolve inspection commands MUST be available without initializing a provider or changing session state."
      acceptance_criteria: "Command tests verify deterministic exit/output for valid, missing, and unknown names and prove provider initialization, config writes, and session mutations do not occur."
    - id: "FR-008"
      description: "profile list MUST show all configured names in stable order and identify the effective/current selection when a session context exists."
      acceptance_criteria: "Snapshot or structured-output tests assert stable ordering, active/no-profile state, and correct behavior for an empty profile map."
    - id: "FR-009"
      description: "profile show MUST report configured non-secret fields, including skill policy, disabled skills, tool restrictions, and instruction presence/summary, without printing credentials or secret values."
      acceptance_criteria: "Redaction tests include provider credentials, API-key-like values, and instruction bodies and find no secret value in output or diagnostics."
    - id: "FR-010"
      description: "profile current and /info MUST report the effective profile name or explicit no-profile state, effective tool/skill policy, and non-secret source for each overridden or relevant value."
      acceptance_criteria: "Info-state tests cover CLI, environment, persisted profile, restored snapshot, base config, built-in default, and none sources with no secret leakage."
    - id: "FR-011"
      description: "profile resolve MUST resolve a named or current profile through the canonical resolver and display field-level effective values and precedence sources without making a provider request."
      acceptance_criteria: "Pure resolver and command tests cover conflicts, unset fields, invalid profiles, and no-profile resolution with zero provider initialization."
    - id: "FR-012"
      description: "A session MUST persist an optional selected profile name in its metadata while preserving the legacy serialized shape when no profile is selected."
      acceptance_criteria: "Session serialization tests round-trip a selected name and assert old/no-profile fixtures deserialize and omit empty profile metadata."
    - id: "FR-013"
      description: "A profiled session MUST persist a resolved snapshot sufficient to restore its effective provider/model/reasoning, tool restrictions, skill policy, selected skills, disabled skills, and prompt overlay, excluding credentials."
      acceptance_criteria: "Metadata fixtures round-trip the snapshot, restore all listed effective values, and contain no provider secret fields or secret-bearing diagnostic output."
    - id: "FR-014"
      description: "Restoring a session with a matching profile MUST use its persisted snapshot and profile name deterministically, while restoring a legacy session with no profile metadata MUST use the no-profile path."
      acceptance_criteria: "Restore tests compare effective state and prompt/tool/skill inputs for matching-profile and legacy fixtures."
    - id: "FR-015"
      description: "Restoring a session whose named profile is missing MUST preserve the persisted snapshot, emit a non-secret warning, and allow an explicit profile change without silently selecting a fallback."
      acceptance_criteria: "Missing-profile restore tests assert warning content, snapshot usability, no implicit fallback, and successful explicit replacement."
    - id: "FR-016"
      description: "Restoring a session whose named profile exists but differs from the persisted snapshot MUST detect drift, emit a non-secret changed-profile warning, and continue with the restored snapshot until the user explicitly selects a profile."
      acceptance_criteria: "Changed-profile fixtures alter scalar, tool, and skill fields independently and assert drift detection, warning source, and deterministic restored values."
    - id: "FR-017"
      description: "Switching or clearing a profile MUST update the session's persisted name and resolved snapshot at the session-owned persistence boundary, without rewriting global configuration or another session."
      acceptance_criteria: "Lifecycle tests inspect session and config bytes before/after /profile changes and prove isolation across two sessions."
    - id: "FR-018"
      description: "The configuration MUST support skills_mode values all, allowlist, and none for a session profile, with an omitted value retaining existing no-profile skill behavior."
      acceptance_criteria: "Config and resolver tests accept exactly the supported values, reject unsupported values with profile/key diagnostics, and prove omitted profiles preserve legacy behavior."
    - id: "FR-019"
      description: "When skills_mode is all, the effective skill set MUST include all available session skills except disabled_skills; when it is allowlist, it MUST include only the profile's selected skills minus disabled_skills; when it is none, it MUST include no skills."
      acceptance_criteria: "A truth-table test covers all modes, empty lists, duplicates, project overlays, and disabled intersections with identical effective sets across all skill consumers."
    - id: "FR-020"
      description: "disabled_skills MUST be validated and enforced consistently across available-skill listings, direct slash activation, retrieval/discovery, selected-skill prompt context, and child/swarm inheritance."
      acceptance_criteria: "SkillRegistry and integration tests prove a disabled skill cannot appear as usable or be activated/retrieved through any available path."
    - id: "FR-021"
      description: "A skills_mode none policy MUST prevent skill discovery, retrieval, slash activation, and prompt injection while returning an actionable policy diagnostic for explicit blocked activation."
      acceptance_criteria: "Negative tests exercise each surface and assert no disabled skill content or name is added to the effective prompt/context."
    - id: "FR-022"
      description: "Changing profiles between turns MUST replace the session skill policy atomically and MUST NOT mutate the shared SkillRegistry or leak project-local skills into another session."
      acceptance_criteria: "Two-session isolation tests switch between all, allowlist, and none and observe independent registries, prompts, and slash behavior."
    - id: "FR-023"
      description: "Child agents MUST inherit the parent session's effective profile name, resolved snapshot, tool policy, skills_mode, selected skills, and disabled_skills unless an explicit child override is supplied."
      acceptance_criteria: "Child-agent integration tests inspect inherited startup/session metadata and effective tools/skills for a parent with each supported policy."
    - id: "FR-024"
      description: "An explicit child profile or tool/skill-policy override MUST win only for that child, be reflected in child inspection metadata, and MUST NOT mutate the parent session or persisted parent snapshot."
      acceptance_criteria: "Override tests assert child-only changes and unchanged parent state after completion and reload."
    - id: "FR-025"
      description: "Swarm workers MUST inherit profile and tool/skill restrictions through creation, resume, restart, and replayable session metadata unless an explicit worker override is supported and supplied."
      acceptance_criteria: "Deterministic swarm fixtures cover new and restored workers and compare inherited metadata/policy with the parent snapshot."
    - id: "FR-026"
      description: "Profile metadata added to protocol or debug-socket messages MUST be optional, backward-compatible, and absent or neutral when no profile is selected."
      acceptance_criteria: "Wire-shape tests deserialize old payloads, serialize no-profile payloads without new required fields, and exercise profile-aware debug-socket startup/current-state inspection."
    - id: "FR-027"
      description: "Existing jcode run plain, JSON, NDJSON, and schema modes, ACP/protocol clients, and no-profile interactive sessions MUST retain their pre-feature behavior and output contracts."
      acceptance_criteria: "Focused regression fixtures compare request/output shapes and protocol handling before and after the follow-on behavior with profile selection omitted."
    - id: "FR-028"
      description: "Profile and skill-policy failures MUST be visible at the owning boundary, identify the profile/key or policy and corrective action, and MUST occur before provider contact or partial state mutation."
      acceptance_criteria: "Negative unit, integration, and debug-socket tests cover unknown names, invalid modes, missing skills, invalid overrides, and restore drift with zero provider requests on selection failure."
    - id: "FR-029"
      description: "The feature MUST provide automated unit, integration, debug-socket, and TUI state tests for deterministic behavior, and MUST reserve manual terminal validation for rendering or raw input behavior that those tests cannot observe."
      acceptance_criteria: "The plan/task artifact maps every functional requirement to an automated test or documents the narrow manual exception, including environment and expected observation."
    - id: "FR-030"
      description: "User-facing documentation and changelog material MUST describe the follow-on interactive commands, inspection/source output, restore warnings, skill modes, inheritance, and the completed specs/003-add-session-profiles prerequisite without duplicating or contradicting its headless contract."
      acceptance_criteria: "Documentation checks find examples for initial selection, switching/none, inspection, policy modes, restore warnings, and no-profile compatibility with links or references to the prerequisite artifact."

  non_functional:
    - id: "NFR-001"
      category: "usability"
      description: "Interactive profile selection and inspection MUST be understandable without reading implementation details, with stable names, explicit no-profile state, and actionable diagnostics."
      measurable_target: "100% of picker, slash-command, inspection, and restore-warning acceptance cases expose the current/effective state and a corrective action where applicable."
    - id: "NFR-002"
      category: "security"
      description: "Profile, session metadata, diagnostics, protocol summaries, and inspection output MUST never expose provider credentials, API keys, or secret values."
      measurable_target: "All redaction fixtures pass with zero secret-value matches in command output, warnings, logs captured by tests, and serialized inspection responses."
    - id: "NFR-003"
      category: "reliability"
      description: "Profile switching, restore, and inheritance MUST be deterministic and session-scoped, with no partial policy application or cross-session registry mutation."
      measurable_target: "Zero observed cross-session leakage or partial state changes across repeated two-session, child, swarm, and restore runs."
    - id: "NFR-004"
      category: "reliability"
      description: "Missing or changed profiles MUST fail visibly as warnings during restore while preserving a usable deterministic snapshot and requiring explicit user action for replacement."
      measurable_target: "100% of missing/changed restore fixtures preserve snapshot values, emit one attributable warning, and avoid implicit fallback selection."
    - id: "NFR-005"
      category: "performance"
      description: "Profile and skill picker filtering MUST remain responsive for a realistic large configuration without provider or filesystem work on every keystroke."
      measurable_target: "State-level filtering of 500 profiles completes within 100 ms per query in the deterministic picker benchmark."
    - id: "NFR-006"
      category: "code_quality"
      description: "The implementation MUST reuse the existing TUI overlay/picker, slash-command, info, session serialization, debug-socket, SkillRegistry, tool policy, prompt, swarm, and canonical profile-resolution seams."
      measurable_target: "The plan identifies one owner for each seam, adds no parallel resolver or duplicate skill-policy path, and passes repository dependency/guardrail checks."
    - id: "NFR-007"
      category: "reliability"
      description: "When profile selection is unused, serialized data, protocol fields, prompts, tool exposure, output modes, and startup cost MUST remain compatible with the completed prerequisite and legacy behavior."
      measurable_target: "100% of no-profile regression fixtures match the established request/output/metadata shape and effective policy."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "A user can start a new TUI session with a valid named profile and receive the same effective setup as the completed headless resolver."
      metric: "Interactive/headless parity cases"
      target: "100% of valid profile parity cases resolve identical provider, model, reasoning, tool, prompt, and skill-policy values"
    - id: "SC-002"
      description: "A user can search and switch profiles or clear the selection without restarting, and the change applies only to future turns."
      metric: "TUI state and turn-boundary cases"
      target: "100% of picker, direct-selection, none, cancellation, and failed-selection cases preserve turn and session isolation"
    - id: "SC-003"
      description: "Users can determine the configured and effective profile state, field sources, and policy from inspection commands and /info."
      metric: "Inspection/source reporting cases"
      target: "100% report non-secret effective values and correct sources without provider initialization"
    - id: "SC-004"
      description: "Resumed profiled sessions remain reproducible and make missing or changed configuration visible."
      metric: "Session metadata restore cases"
      target: "100% restore matching snapshots silently, warn on drift, and avoid implicit fallback"
    - id: "SC-005"
      description: "Skill policy is enforced consistently across every available, activation, retrieval, discovery, and prompt surface."
      metric: "Skill-policy truth-table cases"
      target: "100% of all/allowlist/none and disabled-skills cases produce the same effective allowed set across surfaces"
    - id: "SC-006"
      description: "Delegated child and swarm work remains within the parent profile and policy unless explicitly overridden."
      metric: "Inheritance and override cases"
      target: "100% inherit by default, isolate explicit overrides, and preserve parent state"
    - id: "SC-007"
      description: "Existing no-profile users and protocol clients experience no behavior or serialized-contract regression."
      metric: "Legacy/no-profile regression fixtures"
      target: "100% of plain/JSON/NDJSON/schema, protocol, debug-socket, and legacy-session fixtures remain compatible"
    - id: "SC-008"
      description: "The feature is reviewable with deterministic automated evidence, with manual checks limited to unavoidable terminal rendering/input behavior."
      metric: "Requirement-to-test traceability"
      target: "Every functional requirement has an automated check or one documented manual exception"

key_entities:
  - name: "Interactive profile selection"
    description: "The effective profile choice for a newly created or currently active interactive session, including an explicit no-profile state."
    attributes:
      - "profile name or none"
      - "selection source"
      - "selection time/turn boundary"
      - "validation and warning state"
  - name: "Resolved profile snapshot"
    description: "The session-owned, reproducible effective profile values persisted with a session so restore does not silently follow later configuration drift."
    attributes:
      - "profile name"
      - "effective provider/model/reasoning"
      - "effective tool selection"
      - "skills mode, selected skills, and disabled skills"
      - "prompt-overlay values and non-secret source metadata"
      - "configuration/profile fingerprint for drift detection"
  - name: "Skill policy"
    description: "The effective rule controlling which skills are available to, activatable by, retrievable by, and rendered into one session."
    attributes:
      - "skills_mode"
      - "allowlist/selected skill names"
      - "disabled_skills"
      - "effective allowed set"
      - "policy source"
  - name: "Profile inspection result"
    description: "A deterministic, non-secret view of configured or effective profile fields and their sources for commands and /info."
    attributes:
      - "configured/effective values"
      - "source per field"
      - "current/restored/drift status"
      - "redacted presence and summary fields"
  - name: "Inherited child policy"
    description: "The profile and tool/skill restrictions passed from a parent session to a child agent or swarm worker unless explicitly overridden."
    attributes:
      - "parent session/profile identity"
      - "inherited snapshot"
      - "inherited tool policy"
      - "inherited skill policy"
      - "explicit child override, if any"

edge_cases:
  - scenario: "The user starts the TUI with an empty, whitespace-only, unknown, or malformed profile name."
    expected_behavior: "Startup fails before provider/session work with a safe diagnostic and available profile guidance; no partial session is created."
  - scenario: "The profile picker is opened with no profiles, a query with no matches, or a cancelled selection."
    expected_behavior: "The overlay remains usable, shows an explicit empty/no-match state, and cancellation leaves the current effective profile unchanged."
  - scenario: "A profile is selected while a turn is streaming or a child/swarm operation is in flight."
    expected_behavior: "The current operation keeps its immutable policy; the new profile is queued for the next eligible turn or rejected with a clear busy-state diagnostic."
  - scenario: "The user selects a profile whose tool, model, provider, or skill values are invalid after the configuration was edited."
    expected_behavior: "Selection is atomic and fails before the next provider request; the previous effective state remains active."
  - scenario: "The user invokes /profile none after a restored session reported profile drift."
    expected_behavior: "The explicit none choice clears the restored profile override for future turns, records the new snapshot, and retains the prior warning in session-visible history if the existing UI supports it."
  - scenario: "The profile contains skills_mode allowlist with duplicate, missing, or disabled names."
    expected_behavior: "Duplicates normalize deterministically, missing names fail with available-name guidance, and disabled names are excluded rather than re-enabled."
  - scenario: "A project-local skill has the same name as a global skill but the active profile disables that name."
    expected_behavior: "The disabled name is blocked across both sources; a session-local overlay cannot bypass the policy."
  - scenario: "A profile is changed while a session is closed, then restored with a stored snapshot."
    expected_behavior: "Restore reports changed-profile drift and uses the stored effective snapshot until the user explicitly chooses a current profile."
  - scenario: "A profile is deleted while a session is restored."
    expected_behavior: "Restore reports a missing-profile warning, does not fall back to another named profile, and keeps the stored snapshot usable."
  - scenario: "A legacy session or old protocol client omits all new profile fields."
    expected_behavior: "Defaults deserialize and behave as no-profile without required-field or version errors."
  - scenario: "A child explicitly overrides only one part of the inherited policy."
    expected_behavior: "Only the explicitly overridden field changes for the child; all other inherited fields remain and the parent remains unchanged."
  - scenario: "Inspection output encounters an instruction, provider setting, or metadata field that could contain a secret."
    expected_behavior: "Output reports only safe presence, length, fingerprint, or source information and never emits the value."

assumptions:
  - "specs/003-add-session-profiles is complete prerequisite work and is the source of truth for persisted profile fields, headless jcode run behavior, precedence, tool semantics, prompt overlays, diagnostics, and existing documentation."
  - "The default omitted skills_mode preserves the existing no-profile available-skill behavior; profiles opt into allowlist or none explicitly."
  - "The profile's existing selected skills list is the allowlist input when skills_mode is allowlist; disabled_skills is always subtractive and cannot grant a skill."
  - "Profile switching changes future turns only; an already-started provider request, tool call, child, or swarm worker keeps its immutable effective policy."
  - "A restored snapshot is authoritative for deterministic continuation; missing or changed named profiles produce warnings and require explicit user action to adopt current configuration."
  - "Session metadata may persist the non-credential values required to rebuild the resolved prompt/tool/skill context, while inspection and diagnostics redact secrets and sensitive values."
  - "Inspection commands operate locally through existing configuration/session seams and do not require provider credentials or network access."
  - "Child and swarm override syntax, if already available, is reused; this feature defines inheritance and isolation rather than a new general agent configuration language."
  - "The existing debug-socket tester can observe session/profile state and is the preferred deterministic integration seam for daemon behavior."
  - "Manual terminal checks are necessary only for rendering fidelity and raw keyboard/input behavior that cannot be represented by TUI state tests."

constraints:
  - "Keep the change additive and scope-bound: do not duplicate, discard, or change the completed headless subset in specs/003-add-session-profiles."
  - "Reuse the existing TUI overlay/picker, slash-command, /info, session serialization, debug-socket tester, SkillRegistry, tool policy, prompt, and swarm seams; do not introduce parallel resolution paths."
  - "No profile, no-profile protocol payload, legacy session, and existing jcode run plain/json/ndjson/schema behavior must remain compatible."
  - "All external profile, skill, protocol, and session metadata values must be validated at their owning trust boundary with visible failures."
  - "Provider credentials, API keys, and secret values must not appear in profile inspection, /info, warnings, logs, fixtures, documentation, or snapshots intended for diagnostics."
  - "Validation must proceed from focused unit/state tests through integration/debug-socket tests and affected builds; manual terminal validation is restricted to unavoidable rendering/input observations."
  - "Applicable constitution principles are PRIN-001 through PRIN-007, especially surgical scope, backward-compatible contracts, explicit precedence, layered ownership, focused tests, visible failures, and repository guardrails."

out_of_scope:
  - "Editing, creating, deleting, importing, exporting, synchronizing, or sharing profile definitions through a management UI or remote service."
  - "Changing the completed configuration/profile resolver, jcode run output modes, existing tool semantics, prompt ordering, precedence rules, diagnostics contract, or prerequisite documentation except for additive interactive integration."
  - "Installing, fetching, modifying, or globally enabling skills as a side effect of selecting or restoring a profile."
  - "Changing provider authentication, credentials, provider catalog behavior, ACP semantics, or introducing a breaking protocol version."
  - "Making profile changes retroactively affect an in-flight turn, already-started child, or already-running swarm worker."
  - "Relying on manual terminal sessions for deterministic state, persistence, policy, protocol, or diagnostic validation."

