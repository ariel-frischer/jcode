research_findings:
  decisions:
    - topic: "Canonical Go SDK ownership"
      decision: "Make github.com/ariel-frischer/jcode-go branch dev the sole implementation and test owner; keep version tags as consumer release boundaries and crates/jcode-harness-api as the Rust wire authority."
      rationale: "The dependency Bead already landed the accepted event and run-safety behavior on clean jcode-go dev, whose repository owns the module, examples, tests, and complete CI matrix. Retaining sdk/go would preserve the drift the feature exists to remove."
      alternatives_considered:
        - "Keep sdk/go canonical and treat jcode-go as a projection."
        - "Use main rather than dev as the development branch."
        - "Add jcode-go as a submodule or vendored tree in Jcode."
    - topic: "Cross-repository compatibility contract"
      decision: "Add scripts/validate_jcode_go_compat.sh with a required --jcode-go-dir argument; resolve the script's Jcode root and supplied module root, then run the supplied checkout's complete protocol package tests with JCODE_REPO_ROOT set to Jcode."
      rationale: "jcode-go/protocol/parity_test.go already treats JCODE_REPO_ROOT as the explicit boundary and reads crates/jcode-harness-api directly. Running the complete protocol package avoids duplicating a fragile list of parity test names in Jcode."
      alternatives_considered:
        - "Copy parity fixtures or generated schema into Jcode."
        - "Hard-code the current parity test names in the Jcode runner."
        - "Parse jcode CLI output as compatibility evidence."
    - topic: "Validator implementation language"
      decision: "Use a small Bash entry point and fixture test instead of adding a Go or Rust helper binary."
      rationale: "The Jcode scripts directory already owns developer validators, and adding Go source to host a validator would weaken the sole-source message while a Rust binary would add workspace and build surface for simple path validation and process delegation."
      alternatives_considered:
        - "Add a Go validator under Jcode."
        - "Add a Rust workspace binary or xtask."
        - "Use Make recipes alone without a directly testable entry point."
    - topic: "Read-only execution boundary"
      decision: "Validate explicit checkout identity without branch switching, use resolved quoted paths, set GOWORK=off, pass -mod=readonly and -count=1 to Go tests, and perform no Git or filesystem mutation."
      rationale: "These controls avoid workspace leakage, module-file updates, cached test results, and path ambiguity while permitting clean or pre-existing dirty caller state to be tested exactly as supplied."
      alternatives_considered:
        - "Require a clean jcode-go checkout, which would reject a required edge case."
        - "Copy both repositories to temporary directories before testing."
        - "Run go mod tidy or generate fixtures before parity."
    - topic: "Repository-state proof"
      decision: "Use controlled clean and dirty Git fixtures plus exact before/after evidence for HEAD, symbolic branch, refs/tags, index, tracked content, and untracked content across successful and failing runs."
      rationale: "A plain git status comparison can miss changes to content that was already dirty. The acceptance contract requires zero changes to every caller-owned state class."
      alternatives_considered:
        - "Compare only git status output."
        - "Require clean repositories and skip dirty-state evidence."
        - "Let the validator repair changes after tests."
    - topic: "Publication and validation workflow removal"
      decision: "Delete sdk/go, scripts/sync-jcode-go.sh, scripts/test_sync_jcode_go.sh, scripts/validate_go_sdk.sh, scripts/test_validate_go_sdk.sh, and the embedded Go CI job; do not retain deprecated wrappers or aliases."
      rationale: "Compatibility wrappers would leave an active sync or embedded-validation path and conflict with the requirement for one owner and one compatibility path. jcode-go CI already owns the complete Go quality suite."
      alternatives_considered:
        - "Keep deprecated no-op sync commands."
        - "Retarget the old full-SDK validator to the external checkout."
        - "Keep embedded Go CI as an optional job."
    - topic: "Active versus historical documentation"
      decision: "Rewrite active Jcode and jcode-go ownership, architecture, validation, contribution, and release guidance while leaving prior specs and completed planning artifacts unchanged."
      rationale: "Current top-level docs and repository instructions still describe sdk/go as canonical and the public repository as a projection, whereas the specification explicitly preserves those same statements only as historical records."
      alternatives_considered:
        - "Edit historical specs to remove old terminology."
        - "Add a new doc while leaving current conflicting docs active."
        - "Delete all Jcode Go SDK documentation after removing the source."

data_model:
  entities:
    - name: "Compatibility Invocation"
      description: "One explicit validation request pairing the current Jcode checkout with a caller-supplied jcode-go checkout."
      fields:
        - name: "jcode_root"
          type: "absolute resolved path"
          description: "Jcode checkout containing the validator and authoritative Rust wire sources."
          constraints: "Derived from the validator location; must contain Cargo.toml and crates/jcode-harness-api."
        - name: "jcode_go_root"
          type: "absolute resolved path"
          description: "Explicit caller-supplied Go SDK checkout."
          constraints: "Required; must be a Git worktree whose root go.mod declares github.com/ariel-frischer/jcode-go."
        - name: "jcode_repo_root_env"
          type: "environment path"
          description: "JCODE_REPO_ROOT passed only to the jcode-go test process."
          constraints: "Must equal jcode_root regardless of the caller's existing environment."
        - name: "result"
          type: "exit status and diagnostic stream"
          description: "Unambiguous compatibility success, parity failure, or input/tooling error."
          constraints: "Zero only when protocol tests pass; non-zero diagnostics name the failed condition."
      relationships:
        - target: "Wire Contract"
          type: "many-to-one"
          description: "Every invocation checks one Jcode protocol-v1 wire authority revision."
        - target: "Checkout State Evidence"
          type: "one-to-many"
          description: "Each repository has before/after evidence proving the invocation did not alter it."
    - name: "Wire Contract"
      description: "The protocol-v1 request, event, serialization, and publication contract owned by crates/jcode-harness-api."
      fields:
        - name: "protocol_major"
          type: "integer"
          description: "Supported harness protocol major version."
          constraints: "Remains 1 with no serialized contract changes."
        - name: "rust_authority"
          type: "repository path set"
          description: "requests.rs, events.rs, and their schema/publication tests in crates/jcode-harness-api."
          constraints: "Read-only for this migration."
        - name: "go_parity_suite"
          type: "Go package test suite"
          description: "The supplied jcode-go protocol package that compares Go inventory and behavior with Rust source."
          constraints: "Runs from jcode-go and receives JCODE_REPO_ROOT explicitly."
      relationships:
        - target: "Release Boundary"
          type: "one-to-many"
          description: "Each tagged SDK release states compatibility with the maintained protocol-v1 authority."
    - name: "Checkout State Evidence"
      description: "Non-persisted before/after proof that validation preserved caller-owned Git and file state."
      fields:
        - name: "repository_identity"
          type: "resolved root and module identity"
          description: "Distinguishes the Jcode and jcode-go checkouts."
          constraints: "Paths may contain spaces or arrive through symlinks but must resolve to distinct intended roots."
        - name: "git_state"
          type: "HEAD, symbolic branch, refs, tags, and index fingerprint"
          description: "Captures version-control state relevant to mutation safety."
          constraints: "Before and after values must be identical."
        - name: "content_state"
          type: "tracked and untracked path, mode, and content fingerprints"
          description: "Captures clean and pre-existing dirty filesystem state."
          constraints: "Before and after values must be identical on success and failure."
      relationships: []
    - name: "Release Boundary"
      description: "The documented jcode-go lifecycle separating active development from consumer-ready releases."
      fields:
        - name: "development_branch"
          type: "Git branch"
          description: "The sole branch on which active Go SDK development is integrated."
          constraints: "Exactly dev."
        - name: "release_ref"
          type: "semantic version tag"
          description: "Immutable consumer release point used by go get."
          constraints: "A reviewed version tag; this migration creates no tag."
        - name: "quality_owner"
          type: "repository automation"
          description: "jcode-go CI and contributor workflow for format, module, build, vet, test, race, and supported-platform checks."
          constraints: "Must not depend on an embedded Jcode Go tree or sync workflow."
      relationships: []

api_contracts:
  endpoints:
    - method: "CLI"
      path: "scripts/validate_jcode_go_compat.sh --jcode-go-dir PATH"
      description: "Validate an explicitly supplied jcode-go checkout against the current Jcode checkout without changing either repository."
      request:
        content_type: "command-line arguments and process environment"
        body_schema: "Required --jcode-go-dir PATH; no implicit default, remote URL, branch mutation, or caller-provided JCODE_REPO_ROOT override"
      response:
        success_code: 0
        body_schema: "Visible compatibility success after the supplied checkout's protocol package tests pass"
      errors:
        - code: 2
          description: "Missing/unknown arguments, inaccessible paths, wrong repository/module identity, missing Go toolchain, or invalid checkout structure."
        - code: 1
          description: "The maintained jcode-go protocol/parity suite reports incompatible Rust/Go evidence or another test failure."

