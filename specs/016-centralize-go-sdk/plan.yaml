implementation_phases:
  - phase: 1
    name: "Freeze compatibility and mutation-safety contracts"
    goal: "Turn every validator, ownership, compatibility, and no-mutation requirement into focused failing evidence before removing the old source."
    deliverables:
      - "Active-surface inventory separating Jcode, jcode-go, and immutable historical artifacts"
      - "Fixture acceptance matrix for explicit paths, checkout identity, spaces, symlinks, caller environment, success, failure, clean state, and pre-existing dirty state"
      - "Exact before/after Git, index, ref, tracked-content, and untracked-content evidence helpers"
      - "Failing validator contract tests for invalid input, correct JCODE_REPO_ROOT delegation, read-only Go flags, diagnostics, and exit propagation"
  - phase: 2
    name: "Establish the sole-source validation boundary"
    goal: "Replace embedded Go development and publication with one read-only compatibility path."
    dependencies:
      - "Phase 1"
    deliverables:
      - "scripts/validate_jcode_go_compat.sh with required explicit jcode-go checkout validation"
      - "Passing focused compatibility-runner fixtures"
      - "Removal of sdk/go, sync preview/apply scripts and tests, embedded full-SDK validator and tests, and Jcode's Go CI job"
      - "No replacement copy, mirror, generation, submodule, vendor, publication, or deprecated alias path"
  - phase: 3
    name: "Align active ownership and release guidance"
    goal: "Make both repositories describe one development owner, one wire authority, one compatibility path, and tag-based releases without rewriting history."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Updated Jcode AGENTS, README, Go SDK overview, architecture, release-boundary, and documentation index guidance"
      - "Updated jcode-go AGENTS, README, and architecture guidance on dev development, tag releases, full validation, and Rust wire authority"
      - "Repository scans proving zero conflicting active sdk/go canonical-source or sync/publication instructions"
      - "Historical specifications and completed planning records verified unchanged"
  - phase: 4
    name: "Cross-repository acceptance and delivery gates"
    goal: "Prove the sole-source migration against real dev behavior, caller-owned state, repository policy, and the supported quality matrix."
    dependencies:
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "Successful real compatibility validation against the explicit clean jcode-go dev checkout"
      - "Controlled incompatible-checkout failure with actionable preserved parity diagnostics"
      - "Ten repeat compatibility runs within the 10-minute per-run ceiling and identical results"
      - "Zero before/after changes in both checkouts for success, failure, clean, and pre-existing dirty cases"
      - "Complete jcode-go format, module, build, vet, test, race, and Windows amd64 compile evidence"
      - "Protocol-v1 and public Go API compatibility evidence with zero approved contract differences"
      - "Focused script tests, repository scans, git diff checks, and scripts/check_guardrails.sh passing"

