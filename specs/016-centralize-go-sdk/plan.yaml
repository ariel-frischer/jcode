plan:
  branch: "016-centralize-go-sdk"
  created: "2026-08-23"
  spec_path: "specs/016-centralize-go-sdk/spec.yaml"

summary: |
  Remove the duplicated Go SDK implementation and publication machinery from
  Jcode, making github.com/ariel-frischer/jcode-go branch dev the sole active
  development source. Jcode will continue to own protocol v1 on the Rust side
  through crates/jcode-harness-api, but it will no longer contain Go module
  metadata, Go implementation or tests, Go CI, or a copy/sync/apply path.

  Replace the embedded validation workflow with one dependency-light Jcode
  entry point that requires an explicit jcode-go checkout, resolves both roots,
  and runs that checkout's protocol package tests with JCODE_REPO_ROOT pointing
  at the current Jcode checkout. The runner uses read-only Go module mode and
  performs no fetch, checkout, generation, copying, or repository mutation.
  Focused fixture tests and before/after repository-state evidence cover valid,
  invalid, dirty, symlinked, successful, and failing cases. Active ownership and
  release guidance in both repositories will identify dev as development, tags
  as releases, and historical specifications as unchanged records.

technical_context:
  language: "Bash 3.2+ orchestration with Go 1.23+ compatibility tests and Markdown/YAML documentation"
  framework: "None"
  primary_dependencies:
    - name: "Go toolchain"
      version: "1.23 or newer; jcode-go CI matrix remains 1.23.x and 1.24.x"
      purpose: "Runs the explicitly supplied jcode-go checkout's protocol parity package without hosting Go source in Jcode."
    - name: "Go standard library testing package"
      version: "Go 1.23 module contract"
      purpose: "Owns jcode-go protocol, schema-parity, typed-event coverage, and public API tests without third-party modules."
    - name: "Bash"
      version: "3.2+"
      purpose: "Implements the small explicit-checkout compatibility entry point and its repository-local fixture test in the existing scripts convention."
    - name: "Git CLI"
      version: "2.x"
      purpose: "Identifies checkout roots and provides non-mutating before/after state evidence in tests and validation receipts."
  storage: "None; validation reads two caller-owned Git checkouts and writes only normal Go caches outside those checkouts"
  testing:
    framework: "Bash fixture tests, Go testing package, repository scans, and Jcode guardrails"
    approach: "Test the validator contract first with temporary repositories and a controlled Go shim, then run the real jcode-go protocol package and complete jcode-go quality suite from dev, compare exact checkout state before and after success and failure, scan active Jcode and jcode-go surfaces for obsolete ownership, and finish with Jcode guardrails."
  target_platform: "Linux and macOS developer checkouts; jcode-go CI remains authoritative for Linux Go 1.23/1.24 tests and the Windows amd64 compile boundary"
  project_type: "cli"
  performance_goals: "A stable checkout pair returns the same result across 10 consecutive runs, each conclusive run completes within 10 minutes, and validation introduces zero tracked, staged, untracked, ref, branch, tag, or commit changes in either checkout"
  constraints:
    - "github.com/ariel-frischer/jcode-go branch dev is the only active Go SDK development source; version tags are release boundaries."
    - "crates/jcode-harness-api remains the authoritative Rust protocol-v1 wire definition."
    - "No Go SDK implementation, module metadata, tests, examples, or Go CI remain under Jcode sdk/go."
    - "No preview, apply, copy, mirror, synchronization, generated SDK, vendored SDK, or submodule path replaces the removed workflow."
    - "The compatibility validator requires an explicit local jcode-go checkout and never fetches, switches, cleans, stages, commits, or writes either checkout."
    - "GOWORK is disabled and Go module resolution is read-only during cross-repository compatibility validation."
    - "Protocol v1 wire behavior and every existing public Go API remain unchanged."
    - "jcode-go owns formatting, module integrity, vet, build, test, race, and supported-platform validation."
    - "Historical specifications and completed planning records remain byte-for-byte unchanged and are excluded from active-guidance scans."
    - "No release, tag, push, protocol change, public API change, live runtime, provider, credential, or paid validation is part of this migration."
  scale_scope: "One removed embedded Go module, three removed Jcode SDK scripts/tests, one removed Jcode CI job, one new compatibility runner with one fixture suite, and focused active documentation in Jcode and jcode-go"

