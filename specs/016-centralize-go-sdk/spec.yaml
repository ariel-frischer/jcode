feature:
  branch: "016-centralize-go-sdk"
  created: "2026-08-23"
  status: "Draft"
  input: "Bead jcode-7os: make github.com/ariel-frischer/jcode-go branch dev the sole Go SDK development source. Remove the duplicate sdk/go implementation from this Jcode repository and remove the sync preview/apply publication workflow. Keep crates/jcode-harness-api as Rust wire authority. Add a non-mutating cross-repository compatibility validator that accepts an explicit jcode-go checkout and runs its parity tests with JCODE_REPO_ROOT pointing at this Jcode checkout. Remove embedded Go CI and update active Jcode and jcode-go ownership/release docs so dev is development and tags are releases. Preserve historical specs as historical records. Do not change protocol v1 or Go public APIs."

user_stories:
  - id: "US-001"
    title: "Develop the Go SDK in one canonical repository"
    priority: "P1"
    as_a: "Go SDK maintainer"
    i_want: "the jcode-go dev branch to be the sole development source for the Go SDK"
    so_that: "implementation changes have one unambiguous owner and do not require mirrored updates"
    why_this_priority: "Duplicate development sources create drift and make ownership and release state unclear."
    independent_test: "Inspect both repositories and confirm that all active Go SDK implementation, module metadata, examples, tests, and Go CI are owned by jcode-go, with no sdk/go implementation remaining in Jcode."
    acceptance_scenarios:
      - given: "the active Jcode and jcode-go development repositories"
        when: "a maintainer locates the Go SDK development source"
        then: "jcode-go dev is the only active source and the Jcode repository contains no duplicate sdk/go implementation"
      - given: "a Go SDK change is prepared on jcode-go dev"
        when: "the maintainer reviews the development workflow"
        then: "no preview, apply, copy, mirror, or publication-sync step back to or from Jcode is required"

  - id: "US-002"
    title: "Validate compatibility across explicit checkouts"
    priority: "P1"
    as_a: "Jcode maintainer"
    i_want: "to validate an explicitly supplied jcode-go checkout against the current Jcode checkout without changing either checkout"
    so_that: "wire compatibility can be proven while repository ownership stays separate"
    why_this_priority: "Removing the embedded SDK must not remove deterministic evidence that the Go SDK matches the Rust wire authority."
    independent_test: "Run the compatibility entry point against a known compatible jcode-go checkout, verify its parity suite passes with JCODE_REPO_ROOT resolving to the current Jcode checkout, and confirm both checkout states are unchanged afterward."
    acceptance_scenarios:
      - given: "an explicit compatible jcode-go checkout and the current Jcode checkout"
        when: "a maintainer runs the cross-repository compatibility validation"
        then: "the jcode-go parity tests use this Jcode checkout as their wire reference and report success without modifying either checkout"
      - given: "an explicit jcode-go checkout whose parity expectations do not match the Rust wire authority"
        when: "the compatibility validation runs"
        then: "it reports a clear failure and leaves both checkouts unchanged"

  - id: "US-003"
    title: "Understand development and release ownership"
    priority: "P1"
    as_a: "SDK contributor or consumer"
    i_want: "active documentation to distinguish jcode-go dev development from tagged releases"
    so_that: "I can contribute to the correct branch and consume intentional release points"
    why_this_priority: "A sole-source transition is incomplete if active instructions still describe a mirrored or embedded workflow."
    independent_test: "Review active ownership and release documentation in both repositories and confirm it consistently identifies dev as development, tags as releases, and crates/jcode-harness-api as the Rust wire authority."
    acceptance_scenarios:
      - given: "a contributor reading active Jcode or jcode-go instructions"
        when: "they look for Go SDK ownership and release guidance"
        then: "they are directed to jcode-go dev for development and version tags for releases"
      - given: "a historical specification describing the former embedded or synchronization workflow"
        when: "the ownership migration is completed"
        then: "the historical record remains preserved and is not treated as active guidance"

requirements:
  functional:
    - id: "FR-001"
      description: "The ownership model MUST designate github.com/ariel-frischer/jcode-go branch dev as the sole active development source for the Go SDK."
      acceptance_criteria: "Active source and documentation inspection identifies exactly one Go SDK development repository and branch: jcode-go dev."
    - id: "FR-002"
      description: "The Jcode repository MUST contain no active sdk/go implementation, Go module metadata, Go SDK tests, Go SDK examples, or embedded Go CI."
      acceptance_criteria: "A repository scan finds no sdk/go implementation tree or CI job that builds or tests an embedded Go SDK."
    - id: "FR-003"
      description: "The active workflow MUST contain no preview/apply publication, mirroring, synchronization, or canonical-copy mechanism between Jcode and jcode-go."
      acceptance_criteria: "Searches of active scripts, automation, configuration, and documentation find no executable or instructed SDK copy/sync workflow."
    - id: "FR-004"
      description: "The ownership model MUST retain crates/jcode-harness-api as the authoritative Rust definition of the wire contract."
      acceptance_criteria: "Active architecture and ownership guidance identifies crates/jcode-harness-api as the Rust wire authority, and compatibility evidence derives from that authority."
    - id: "FR-005"
      description: "Jcode MUST provide one compatibility validation entry point that requires an explicit local jcode-go checkout."
      acceptance_criteria: "Invoking the validator with a valid explicit checkout runs compatibility validation; omitting or supplying an invalid checkout produces an actionable failure."
    - id: "FR-006"
      description: "The compatibility validator MUST run the supplied jcode-go checkout's parity tests with JCODE_REPO_ROOT resolving to the Jcode checkout from which validation is requested."
      acceptance_criteria: "A controlled parity test observes the expected Jcode repository root and completes against the supplied jcode-go checkout."
    - id: "FR-007"
      description: "The compatibility validator MUST NOT copy, generate, rewrite, stage, commit, or otherwise mutate files in either checkout."
      acceptance_criteria: "Before-and-after checkout state is identical for clean and pre-existing dirty checkout fixtures after both successful and failing validation runs."
    - id: "FR-008"
      description: "The compatibility validator MUST propagate parity success and failure as an unambiguous result with actionable diagnostics."
      acceptance_criteria: "A compatible checkout reports success; a deliberately incompatible checkout reports failure and identifies the failed parity evidence."
    - id: "FR-009"
      description: "jcode-go's own validation and release guidance MUST remain authoritative for Go formatting, module integrity, static analysis, builds, tests, race checks, and supported-platform checks."
      acceptance_criteria: "Active documentation and automation assign the complete Go SDK quality suite to jcode-go and do not assign embedded Go validation to Jcode."
    - id: "FR-010"
      description: "Active Jcode and jcode-go ownership and release documentation MUST consistently state that dev is the development branch and version tags are release boundaries."
      acceptance_criteria: "An active-document review finds no conflicting branch, mirror, embedded-source, or release ownership statement."
    - id: "FR-011"
      description: "Historical specifications and completed planning records MUST be preserved as historical records even when they describe the superseded embedded or synchronization model."
      acceptance_criteria: "Historical artifacts remain present and unchanged, while active guidance clearly supersedes their former ownership model."
    - id: "FR-012"
      description: "The migration MUST preserve protocol v1 without changing its wire behavior or serialized contract."
      acceptance_criteria: "Existing protocol v1 compatibility and parity checks pass without approved wire-contract differences."
    - id: "FR-013"
      description: "The migration MUST preserve all existing public Go APIs."
      acceptance_criteria: "The established public API compatibility checks and existing consumer-facing tests pass with no removed, renamed, or behaviorally incompatible public surface."
    - id: "FR-014"
      description: "The sole-source transition MUST preserve the Go SDK behavior already accepted on jcode-go dev before the embedded source is removed."
      acceptance_criteria: "The complete jcode-go validation suite and cross-repository parity suite pass from dev after the Jcode duplicate and synchronization workflow are absent."

  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Compatibility validation must produce repeatable results for the same pair of checkout revisions."
      measurable_target: "Ten consecutive validations of an unchanged compatible revision pair produce the same successful result."
    - id: "NFR-002"
      category: "security"
      description: "Validation must preserve caller-owned repository data and pre-existing working state."
      measurable_target: "Zero tracked, untracked, staged, branch, tag, or commit changes are introduced in either checkout by successful or failing validation."
    - id: "NFR-003"
      category: "usability"
      description: "Invalid checkout input and parity failures must be understandable without inspecting validator internals."
      measurable_target: "Every tested invalid-input or parity-failure case names the failed condition and returns a distinct unsuccessful result."
    - id: "NFR-004"
      category: "code_quality"
      description: "Active ownership must have one canonical source and one compatibility path, with no duplicate implementation or publication path."
      measurable_target: "Repository and documentation scans find zero active duplicate Go SDK sources and zero active sync workflows."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Maintainers have exactly one place to develop and review Go SDK implementation changes."
      metric: "Count of active Go SDK development sources"
      target: "Exactly 1: jcode-go dev"
    - id: "SC-002"
      description: "Maintainers can reach a conclusive compatibility result from explicit local checkouts in a routine development cycle."
      metric: "Elapsed time from validation start to a clear pass or fail on the maintained parity suite"
      target: "No more than 10 minutes in a supported development environment"
    - id: "SC-003"
      description: "Compatibility checking never changes caller-owned checkout state."
      metric: "New checkout changes caused by validation across success, failure, clean, and pre-existing dirty cases"
      target: "0 changes"
    - id: "SC-004"
      description: "The ownership migration preserves established consumer compatibility."
      metric: "Protocol v1 parity and public Go API compatibility checks passing after migration"
      target: "100% of maintained checks pass with 0 approved contract changes"
    - id: "SC-005"
      description: "Active contributor guidance communicates one consistent development and release lifecycle."
      metric: "Conflicting ownership or release statements found by independent active-document review"
      target: "0 conflicting statements; reviewers identify dev as development and tags as releases"

key_entities:
  - name: "Jcode checkout"
    description: "The local Jcode source tree that owns the Rust wire authority and initiates compatibility validation."
    attributes:
      - "explicit repository root"
      - "wire-authority revision"
      - "unchanged checkout state"
  - name: "jcode-go checkout"
    description: "The explicitly supplied local checkout of the sole Go SDK development repository."
    attributes:
      - "explicit checkout root"
      - "development revision"
      - "parity suite"
      - "unchanged checkout state"
  - name: "Wire contract"
    description: "The protocol v1 contract for which crates/jcode-harness-api remains the authoritative Rust definition."
    attributes:
      - "protocol version"
      - "event and message shapes"
      - "compatibility expectations"
  - name: "Release boundary"
    description: "A version tag in jcode-go that identifies a consumer-ready Go SDK release."
    attributes:
      - "version tag"
      - "source revision"
      - "validated public API"

edge_cases:
  - scenario: "The explicit jcode-go path is missing, inaccessible, or is not a jcode-go checkout."
    expected_behavior: "Validation stops with an actionable input error before running parity tests or changing either checkout."
  - scenario: "The supplied jcode-go checkout already contains tracked, staged, or untracked user changes."
    expected_behavior: "Validation may read and test the supplied state but preserves the exact pre-existing checkout state."
  - scenario: "Parity tests fail or terminate unexpectedly."
    expected_behavior: "Validation reports failure, preserves the underlying diagnostics, and leaves both checkouts unchanged."
  - scenario: "A checkout path contains spaces or resolves through a symbolic link."
    expected_behavior: "The explicit checkout is resolved consistently and validation targets the intended repositories without mutation."
  - scenario: "Historical specifications still mention sdk/go or the former sync workflow."
    expected_behavior: "They remain intact as historical records and are excluded from assertions about active ownership guidance."
  - scenario: "An active document conflicts with the sole-source ownership model."
    expected_behavior: "The migration is not considered complete until the active conflict is corrected."

assumptions:
  - "The jcode-go dev branch already contains the accepted Go SDK implementation and tests that must survive the ownership migration."
  - "The supplied jcode-go checkout provides the maintained parity tests and can consume JCODE_REPO_ROOT as its explicit Jcode reference."
  - "Historical specifications are immutable records; only active documentation and instructions are expected to reflect current ownership."
  - "Version tags, rather than the dev branch itself, are the supported consumer release boundaries."
  - "The existing protocol v1 and public Go API compatibility checks define the no-change baseline."

constraints:
  - "crates/jcode-harness-api remains the Rust wire authority in accordance with the repository's layered ownership principle."
  - "The transition must be surgical and must not introduce a replacement mirror, submodule, generated SDK copy, or parallel publication path."
  - "Cross-repository validation is read-only with respect to both caller-owned checkouts."
  - "Protocol v1 wire behavior and public Go APIs remain backward compatible."
  - "All acceptance evidence must come from focused artifact, compatibility, and repository-state checks."

out_of_scope:
  - "Changing protocol v1 messages, events, serialization, or behavior."
  - "Removing, renaming, or incompatibly changing any public Go API."
  - "Creating a new Go SDK release or choosing a new release version."
  - "Adding jcode-go as a submodule or vendored source inside Jcode."
  - "Editing historical specifications solely to remove descriptions of the former workflow."
  - "Moving the Rust wire authority out of crates/jcode-harness-api."

