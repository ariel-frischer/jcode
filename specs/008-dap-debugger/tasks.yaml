            - "Actions classify into readonly, process-control, evaluate, and memory-write tiers with memory writes denied by default."
            - "Protocol and policy tests pass."
    - number: 3
      title: "User Story 1 - Configure language-neutral debugger adapters"
      purpose: "Provide built-in, user, and project adapter configuration with deterministic selection."
      story_reference: "US-001"
      independent_test: "Load temporary config layers and select adapters for files, roots, explicit names, disabled entries, and unavailable commands."
