          type: "test"
          parallel: true
          story_id: "US-001"
          file_path: "crates/jcode-dap/src/config_tests.rs"
          dependencies: ["T004"]
          acceptance_criteria:
            - "Tests specify built-in/user/project precedence, deep default merging, enable/disable, relative commands, root markers, file types, explicit selection, and no-adapter behavior."
        - id: "T006"
          title: "Implement adapter registry, catalog, resolution, and matching"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "crates/jcode-dap/src/config.rs"
          dependencies: ["T005"]
          acceptance_criteria:
            - "Built-in entries include at least gdb, lldb-dap, debugpy, dlv, and js-debug-adapter as lazy declarative catalog entries."
            - "TOML layers merge deterministically and preserve disabled or unavailable diagnostics without launching them."
            - "Selection prefers explicit adapter, then root specificity, then stable adapter name order."
            - "All config tests pass without requiring installed debuggers."
    - number: 4
      title: "User Story 2 - Run bounded DAP sessions"
      purpose: "Own adapter transports and lifecycle for explicit launch and attach operations."
      story_reference: "US-002"
      independent_test: "Use the fake adapter to launch and attach over stdio and TCP, exercise failure/cancellation, and assert cleanup."
      tasks:
        - id: "T007"
          title: "Write transport and lifecycle red tests"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-dap/src/transport_tests.rs, crates/jcode-dap/tests/fake_adapter.rs"
          dependencies: ["T002", "T006"]
          acceptance_criteria:
            - "Tests cover stdio, TCP, and Unix-socket or platform-gated transport startup, launch versus attach, adapter exit, request timeout, cancellation, malformed frames, and disconnect cleanup."
        - id: "T008"
          title: "Implement Content-Length transport and correlated request client"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-dap/src/transport.rs"
          dependencies: ["T007"]
          acceptance_criteria:
            - "Transport uses direct process spawning with non-interactive detached process groups and no shell interpolation."
            - "One reader task drains frames, correlates responses, dispatches events, bounds writes, and recovers from malformed messages."
            - "Stdio, TCP, and Unix socket modes report actionable startup and cleanup errors."
            - "Transport tests pass and no pending request survives adapter exit."
    - number: 5
      title: "User Story 3 - Inspect and control a stopped program"
      purpose: "Implement capability-aware session state and debugger operations."
      story_reference: "US-003"
      independent_test: "Run the fake adapter diagnosis scenario from launch or attach through breakpoint, stop, inspection, evaluate, continue, and disconnect."
      tasks:
        - id: "T009"
          title: "Write session operation and capability-gate red tests"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-003"
          file_path: "crates/jcode-dap/src/session_tests.rs"
          dependencies: ["T008"]
          acceptance_criteria:
            - "Tests cover launch, attach, initialize/configurationDone, breakpoints, continue, pause, step over/in/out, threads, stack, scopes, variables, evaluate, output, stop, disconnect, unsupported capabilities, and bounded output."
        - id: "T010"
          title: "Implement server-owned DAP session manager"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-003"
          file_path: "crates/jcode-dap/src/session.rs"
          dependencies: ["T009"]
          acceptance_criteria:
            - "Session manager owns clients, status, negotiated capabilities, breakpoint state, stop location, output tail, and exit metadata."
            - "Launch and attach are separate explicit paths and do not implicitly launch arbitrary programs."
            - "Optional operations check capabilities before dispatch and return structured capability errors."
            - "Stop/continue/output events update state, output is capped at 128 KiB, and idle sessions can be reaped."
            - "Session tests pass."
        - id: "T011"
          title: "Add child-session relationship and session-tree cleanup handling"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: "US-003"
          file_path: "crates/jcode-dap/src/session.rs, crates/jcode-dap/src/transport.rs"
          dependencies: ["T010"]
          acceptance_criteria:
            - "Sessions can record parent and child ids and cleanup traverses descendants before releasing the root."
            - "A reverse start-debugging request is answered safely or reported as unsupported without leaking the adapter."
