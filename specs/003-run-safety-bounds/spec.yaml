feature:
  branch: "agent/jcode-qwi-run-limits"
  created: "2026-08-08"
  status: "Draft"
  input: "Private internal fix for GitHub issue #803: add configurable safety bounds to unattended jcode run. Support optional max turns, max tool steps, a native token-usage/cost-equivalent budget, and a wall-clock deadline with explicit invocation/environment/persisted-config precedence, validation, and stable structured stop reasons in plain, JSON, and NDJSON output. Preserve legacy behavior when unset. Do not post or mutate anything on GitHub."

user_stories:
  - id: "US-001"
    title: "Configure unattended run bounds"
    priority: "P1"
    as_a: "operator running jcode unattended"
    i_want: "to set optional turn, tool-step, token-usage, and wall-clock limits"
    so_that: "a runaway or unexpectedly expensive run stops within a budget I control"
    why_this_priority: "Safety bounds are the primary outcome of the requested internal fix."
    independent_test: "Set each bound independently and verify that a run stops when that bound is reached."
    acceptance_scenarios:
      - given: "only a maximum turn count is configured"
        when: "an unattended run reaches that count"
        then: "the run stops at the configured turn bound and reports the canonical maximum-turns stop reason"
      - given: "only a maximum tool-step count is configured"
        when: "an unattended run reaches that count"
        then: "the run stops at the configured tool-step bound and reports the canonical maximum-tool-steps stop reason"
      - given: "a token-usage or cost-equivalent budget is configured"
        when: "the native usage counter reaches the budget"
        then: "the run stops before starting work that would exceed the budget"
      - given: "a future wall-clock deadline is configured"
        when: "the deadline is reached during an unattended run"
        then: "the run stops and reports the canonical deadline stop reason"

  - id: "US-002"
    title: "Resolve bounds predictably"
    priority: "P1"
    as_a: "operator managing repeatable automation"
    i_want: "explicit invocation, environment, and persisted configuration precedence"
    so_that: "the effective safety policy is deterministic and explainable in every execution context"
    why_this_priority: "Unambiguous precedence prevents a stale persisted value from weakening an explicit safety choice."
    independent_test: "Provide conflicting values at all supported sources and verify the effective value for each bound."
    acceptance_scenarios:
      - given: "a bound is set in persisted configuration, the environment, and the invocation"
        when: "the run starts"
        then: "the invocation value is effective"
      - given: "a bound is set in persisted configuration and the environment but not the invocation"
        when: "the run starts"
        then: "the environment value is effective"
      - given: "a bound is set only in persisted configuration"
        when: "the run starts"
        then: "the persisted value is effective"
      - given: "a bound is absent from all sources"
        when: "the run starts"
        then: "that bound is disabled and legacy behavior is retained"

  - id: "US-003"
    title: "Understand bounded stops"
    priority: "P1"
    as_a: "operator or automation consuming run results"
    i_want: "stable stop reasons in plain, JSON, and NDJSON output"
    so_that: "I can distinguish an intentional safety stop from completion, failure, or cancellation"
    why_this_priority: "Reliable machine and human interpretation is required for unattended workflows."
    independent_test: "Trigger each bound through each output mode and compare the reason code and outcome fields."
    acceptance_scenarios:
      - given: "a run stops because the turn bound is reached"
        when: "plain output is selected"
        then: "the output includes the stable maximum-turns reason label and indicates a bounded stop"
      - given: "a run stops because any configured bound is reached"
        when: "JSON or NDJSON output is selected"
        then: "the emitted result contains the same stable stop-reason code in the documented structured field"
      - given: "multiple bounds are reached at the same checkpoint"
        when: "the stop result is emitted"
        then: "one deterministic primary reason is selected and the result remains valid for the chosen output mode"

  - id: "US-004"
    title: "Reject unsafe bound configuration"
    priority: "P1"
    as_a: "operator configuring unattended automation"
    i_want: "invalid or ambiguous bound values to fail with actionable diagnostics"
    so_that: "a typo cannot silently disable a safety control or change the effective budget"
    why_this_priority: "Safety configuration is only trustworthy when invalid input is visible before work begins."
    independent_test: "Supply malformed, zero, negative, past, and overflow values at each source and verify validation errors identify the source and correction."
    acceptance_scenarios:
      - given: "a bound value cannot be parsed or is outside the supported range"
        when: "configuration is resolved"
        then: "the run is rejected before unattended work begins with an actionable validation diagnostic"
      - given: "an environment value is empty or whitespace-only"
        when: "configuration is resolved"
        then: "the value is rejected as invalid before work starts and never silently weakens a valid persisted bound"

requirements:
  functional:
    - id: "FR-001"
      description: "The system MUST accept an optional maximum-turn bound for an unattended run."
      acceptance_criteria: "A valid invocation, environment, or persisted value limits the number of completed turns, and an unset value applies no turn bound."
    - id: "FR-002"
      description: "The system MUST accept an optional maximum-tool-step bound for an unattended run."
      acceptance_criteria: "A valid value limits tool steps counted by the run, and an unset value applies no tool-step bound."
    - id: "FR-003"
      description: "The system MUST accept an optional native token-usage or cost-equivalent budget for an unattended run."
      acceptance_criteria: "The configured budget is compared against the run's native cumulative usage measure and prevents work that would exceed the budget; an unset value applies no usage budget."
    - id: "FR-004"
      description: "The system MUST accept an optional wall-clock deadline for an unattended run."
      acceptance_criteria: "A valid future deadline is resolved once for the run, is enforced while work is in progress, and an unset value applies no deadline."
    - id: "FR-005"
      description: "Each safety bound MUST resolve independently using invocation value first, then environment value, then persisted configuration, then the built-in unset default."
      acceptance_criteria: "A precedence matrix with conflicting and absent values for every bound produces the documented effective value without cross-bound inheritance."
    - id: "FR-006"
      description: "The system MUST validate safety-bound values at the configuration boundary before starting unattended work."
      acceptance_criteria: "Malformed, non-positive, out-of-range, overflow, and past-deadline values are rejected with a diagnostic naming the bound, source, supplied value, and corrective action."
    - id: "FR-007"
      description: "The system MUST stop an unattended run as soon as an effective safety bound is reached, without starting additional work that would violate that bound."
      acceptance_criteria: "Focused tests show that each bound stops the run at its threshold and that no subsequent turn, tool step, or budget-consuming operation is started."
    - id: "FR-008"
      description: "Bounded stops MUST expose stable canonical reason codes: max_turns_exceeded, max_tool_steps_exceeded, token_budget_exceeded, or deadline_exceeded."
      acceptance_criteria: "Each trigger produces its documented reason code consistently across repeated runs and output modes."
    - id: "FR-009"
      description: "Plain output MUST identify a bounded stop with its stable reason label, while JSON and NDJSON output MUST include the stable reason code in the documented structured result field."
      acceptance_criteria: "Golden or equivalent focused checks verify the reason label/code and valid output shape for every supported format."
    - id: "FR-010"
      description: "When multiple bounds are reached at one observation point, the system MUST choose a deterministic primary stop reason and preserve a valid result."
      acceptance_criteria: "A simultaneous-trigger test demonstrates repeatable reason selection and valid plain, JSON, and NDJSON output."
    - id: "FR-011"
      description: "When all safety bounds are unset, unattended runs MUST preserve legacy execution, completion, error, cancellation, and output behavior."
      acceptance_criteria: "Regression tests compare unset-bound runs with the pre-feature behavior and show no new stop reason, default bound, or output field that changes the legacy contract."
    - id: "FR-012"
      description: "The persisted configuration and environment guidance MUST document every bound, accepted value form, precedence, unset behavior, and stable stop-reason contract."
      acceptance_criteria: "Configuration documentation and examples cover invocation-over-environment-over-persisted precedence and show how operators interpret each output mode."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Safety bounds must be enforced deterministically at their configured thresholds, including during long-running tool activity."
      measurable_target: "100% of focused threshold and deadline tests stop without an over-bound operation."
    - id: "NFR-002"
      category: "reliability"
      description: "The feature must not alter behavior, output, or cost for runs that leave all new bounds unset."
      measurable_target: "100% of legacy unset-bound regression scenarios retain their existing result and output contract."
    - id: "NFR-003"
      category: "usability"
      description: "Operators and automation must be able to determine which bound caused a stop without parsing unstable prose."
      measurable_target: "Every bounded-stop scenario exposes one of the four canonical codes in JSON and NDJSON and its corresponding label in plain output."
    - id: "NFR-004"
      category: "security"
      description: "Validation and diagnostics must not reveal credentials, prompts, provider secrets, or unrelated sensitive usage data."
      measurable_target: "Focused invalid-input and output tests contain only non-secret bound names, values, sources, and corrective guidance."
    - id: "NFR-005"
      category: "code_quality"
      description: "The implementation must reuse the existing unattended-run configuration and result-resolution path rather than creating parallel precedence or output contracts."
      measurable_target: "Affected focused tests and repository guardrails pass without new dependency-boundary or compatibility violations."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Operators can cap every supported unattended-run dimension independently."
      metric: "Bound configuration scenarios that enforce the requested threshold"
      target: "100% of max-turn, max-tool-step, token-budget, and deadline scenarios stop at or before their configured bound"
    - id: "SC-002"
      description: "The effective safety policy is predictable when settings conflict across sources."
      metric: "Invocation, environment, persisted, and unset precedence matrix"
      target: "100% of matrix cases resolve invocation > environment > persisted > unset"
    - id: "SC-003"
      description: "Automation can reliably classify why a run stopped."
      metric: "Stable reason coverage across supported output formats"
      target: "100% of bounded-stop cases emit one canonical reason code in JSON/NDJSON and its matching label in plain output"
    - id: "SC-004"
      description: "Existing users see no behavior change when they do not configure bounds."
      metric: "Unset-bound compatibility regression scenarios"
      target: "100% of legacy completion, failure, cancellation, and output scenarios remain unchanged"
    - id: "SC-005"
      description: "Invalid safety settings fail before unattended work can begin."
      metric: "Malformed and out-of-range configuration scenarios"
      target: "100% produce actionable diagnostics and zero started run work"

key_entities:
  - name: "Safety bound configuration"
    description: "The optional operator-provided limits for turns, tool steps, native usage, and wall-clock time."
    attributes:
      - "maximum turns"
      - "maximum tool steps"
      - "native token-usage or cost-equivalent budget"
      - "wall-clock deadline"
      - "source and precedence rank"
  - name: "Effective run safety policy"
    description: "The resolved set of enabled and disabled bounds applied to one unattended run."
    attributes:
      - "effective bound values"
      - "unset bounds"
      - "resolution source"
      - "run start time"
  - name: "Bounded stop result"
    description: "The run outcome emitted when a safety bound ends unattended execution."
    attributes:
      - "primary stop reason code"
      - "human-readable reason label"
      - "observed usage at stop"
      - "output format"

edge_cases:
  - scenario: "A maximum turn or tool-step value is zero, negative, malformed, or larger than the supported numeric range."
    expected_behavior: "Configuration is rejected before work starts with a bound-specific, source-specific correction message."
  - scenario: "A token budget is exactly reached at a checkpoint, or the next operation would cross it."
    expected_behavior: "The run stops at the threshold and does not start an operation that would exceed the budget."
  - scenario: "A wall-clock deadline is already past, or is reached while a tool operation is active."
    expected_behavior: "A past deadline is rejected before work; a reached deadline stops at the earliest safe observation point and reports deadline_exceeded."
  - scenario: "The environment contains an empty, whitespace-only, or malformed bound while persisted configuration contains a valid value."
    expected_behavior: "The value is rejected as invalid before work starts; an invalid higher-precedence value never silently falls through as though it were valid."
  - scenario: "Two or more bounds are reached at the same observation point."
    expected_behavior: "A deterministic primary reason is selected, and the result remains valid in plain, JSON, and NDJSON output."
  - scenario: "All bounds are unset, including when no persisted configuration file exists."
    expected_behavior: "The run follows the legacy path with no new default limit or bounded-stop output."
  - scenario: "A bounded stop occurs after partial assistant or tool output has already been produced."
    expected_behavior: "The selected output format remains well-formed and clearly marks the final result as a bounded stop."

assumptions:
  - "Maximum turns and maximum tool steps are positive whole numbers; zero and negative values are invalid rather than implicit disable switches."
  - "The token-usage or cost-equivalent budget uses the native cumulative usage measure already available to the run and does not introduce currency conversion or provider-specific pricing."
  - "A wall-clock deadline resolves to one absolute future instant for the run; the accepted textual form and timezone handling are documented with the setting."
  - "Invocation, environment, and persisted settings use one canonical resolver per bound, and an absent value means no bound rather than a hidden built-in limit."
  - "When multiple bounds trigger together, the implementation defines and documents a fixed deterministic primary-reason order while retaining enough result detail for operators to understand the stop."
  - "Plain output may remain human-readable, but its bounded-stop label is stable; JSON and NDJSON carry the machine-readable canonical code."

constraints:
  - "PRIN-001 applies: changes remain surgical and limited to unattended-run safety bounds, validation, and result reporting."
  - "PRIN-002 applies: all bounds are optional and unset behavior, persisted forms, and existing output contracts remain backward-compatible."
  - "PRIN-003 applies: invocation > environment > persisted configuration > built-in unset default is the single canonical precedence for every bound."
  - "PRIN-004 applies: configuration, run enforcement, and output changes remain in their existing ownership layers and preserve the single-server runtime model."
  - "PRIN-005 and PRIN-006 apply: focused tests cover defaults, precedence, enforcement, invalid input, simultaneous triggers, output formats, and safe diagnostics."
  - "PRIN-007 applies: this artifact must validate now; implementation later requires focused checks, a relevant build, and repository guardrails."
  - "This is a private internal fix; it MUST NOT post to or mutate GitHub, issue state, pull requests, comments, or remote repository data."

out_of_scope:
  - "Changing default limits, pricing, token accounting, provider billing, or model selection when bounds are unset."
  - "Adding a new interactive dashboard, remote policy service, or cross-run quota system."
  - "Changing normal interactive jcode runs unless they already use the unattended-run path covered by this specification."
  - "Changing cancellation, retry, authentication, or provider routing semantics beyond making a bounded stop observable."
  - "Posting, commenting, labeling, closing, or otherwise mutating GitHub issue #803 or any other GitHub resource."

