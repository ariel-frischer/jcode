implementation_phases:
  - phase: 1
    name: "Configuration contract and source-aware policy resolution"
    goal: "Represent all optional bounds and resolve/validate them deterministically before any unattended work starts."
    deliverables:
      - "Add the serde-defaulted run-safety config section, Config field, environment override keys, fingerprint entries, and commented default-template guidance."
      - "Add ordinary-run invocation flags and a single resolver implementing independent invocation > environment > persisted > unset precedence."
      - "Parse positive u64 counters and RFC3339 future deadlines, reject empty/invalid/overflow/past values with source-specific actionable diagnostics, and capture the per-run token baseline."
      - "Document accepted forms, source precedence, unset behavior, tool/token accounting, schema-mode boundary, and canonical reason priority."
  - phase: 2
    name: "Agent-bound enforcement controller"
    goal: "Stop before additional controllable work can violate an effective bound while leaving interactive Agent callers unchanged."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Add an opt-in non-persisted Agent safety controller and canonical RunStopReason state/accessors."
      - "Check deadline and token budget before provider requests and between stream events; update usage from existing native telemetry and stop before the next request when the current-run budget is reached."
      - "Check max tool steps immediately before Registry execution, preserve valid tool-result/history state for skipped work, and observe deadline after active tools at the earliest safe point."
      - "Integrate the same controller with capture/plain and streaming-mpsc turn loops without changing the default interactive path or server wire protocol."
  - phase: 3
    name: "CLI result contracts and deterministic trigger behavior"
    goal: "Expose bounded stops consistently in each supported output mode and preserve existing output when no bound triggers."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Apply the policy across all ordinary run loops, including auto-poke follow-up turns, and select one reason using the fixed priority order when checks coincide."
      - "Emit the stable plain label and add skip-when-none stop_reason/outcome metadata to JSON and NDJSON final results; keep errors and cancellations distinct."
      - "Reject explicit safety options in the separate --schema bridge path before server/bridge startup."
  - phase: 4
    name: "Focused regression evidence and delivery gates"
    goal: "Prove every acceptance path and validate the affected Rust surfaces and repository guardrails."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Add exact tests for defaults, every precedence matrix combination, malformed/empty/zero/negative/overflow/past inputs, each threshold, active-tool/deadline observation, simultaneous triggers, and no-over-bound follow-up work."
      - "Add output-shape tests for plain, JSON, NDJSON, schema rejection, and unset legacy compatibility, including safe diagnostic content."
      - "Run focused tests first, then affected-package check/build and scripts/check_guardrails.sh on the current stable toolchain; isolate any pre-existing unrelated failures without rebaselining."

