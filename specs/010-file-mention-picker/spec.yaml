feature:
  branch: "010-file-mention-picker"
  created: "2026-08-21"
  status: "Draft"
  input: "Fix the TUI @ file mention picker: add a boolean enable/disable setting, prevent synchronous filesystem discovery from freezing input, use bounded lazy or background discovery rather than loading the whole tree at once, preserve replacement behavior, and add focused regression tests plus performance benchmarks demonstrating scaling and an input latency budget."

user_stories:
  - id: "US-001"
    title: "Control file mention picker availability"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "to enable or disable the TUI @ file mention picker with a boolean setting"
    so_that: "I can choose whether @ mentions invoke filesystem-backed suggestions"
    why_this_priority: "The setting is the primary user-facing control and must be available without changing other input behavior."
    independent_test: "Set the option to enabled and disabled in isolated sessions, trigger an @ mention, and verify the corresponding picker behavior."
    acceptance_scenarios:
      - given: "The file mention picker setting is enabled"
        when: "The user types @ in the TUI input"
        then: "The picker opens and begins offering file suggestions using the existing mention interaction."
      - given: "The file mention picker setting is disabled"
        when: "The user types @ in the TUI input"
        then: "The picker does not open, and the typed input remains available for the normal input flow."

  - id: "US-002"
    title: "Keep input responsive during file discovery"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "file suggestions to be discovered incrementally without blocking keystrokes"
    so_that: "typing, navigation, cancellation, and submission remain responsive in large workspaces"
    why_this_priority: "Synchronous whole-tree discovery currently freezes the core interaction and makes the picker unusable at scale."
    independent_test: "Open the picker against deterministic small and large directory fixtures, inject keystrokes while discovery is active, and measure event-to-input handling latency."
    acceptance_scenarios:
      - given: "A workspace contains more files than the picker can display in one bounded result batch"
        when: "The user opens the picker and continues typing or moves the selection"
        then: "Input events are processed while additional suggestions arrive incrementally, without waiting for the complete tree."
      - given: "The user changes or cancels a query while discovery is still running"
        when: "Previously started discovery produces more results"
        then: "Stale results do not overwrite the current query or selection, and cancellation remains responsive."

  - id: "US-003"
    title: "Preserve mention replacement behavior"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "selecting a file suggestion to replace the active @ mention exactly as before"
    so_that: "the chosen path is inserted in the intended span without changing surrounding text"
    why_this_priority: "Performance changes must not break the established text-editing contract for file mentions."
    independent_test: "Place an @ mention at the start, middle, and end of representative input strings, select a suggestion, and compare the resulting text with the existing replacement contract."
    acceptance_scenarios:
      - given: "The input contains an active @ mention with a partial path and surrounding text"
        when: "The user selects a file suggestion"
        then: "Only the active mention span is replaced with the selected path, preserving all preceding and following text."
      - given: "The active mention has no matching files or the picker is dismissed"
        when: "The user continues editing"
        then: "The input remains unchanged except for the user's explicit edits."

  - id: "US-004"
    title: "Verify picker regressions and scaling"
    priority: "P2"
    as_a: "Jcode maintainer"
    i_want: "focused regression tests and repeatable performance benchmarks for the picker"
    so_that: "future changes can prove replacement correctness, scaling behavior, and an explicit input-latency budget"
    why_this_priority: "Durable evidence is required to prevent the synchronous-discovery regression from returning."
    independent_test: "Run the picker regression suite and benchmark fixtures at multiple file-tree sizes, then inspect latency and result-discovery measurements."
    acceptance_scenarios:
      - given: "Deterministic directory fixtures at increasing sizes"
        when: "The benchmark suite runs picker discovery and synthetic input events"
        then: "The output reports scaling across fixture sizes and whether the input latency budget is met."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST expose a boolean setting that enables or disables the TUI @ file mention picker, with the existing picker behavior preserved when enabled."
      acceptance_criteria: "Configuration and interaction tests pass for both setting values; enabled sessions open the picker and disabled sessions do not invoke filesystem-backed suggestions."
    - id: "FR-002"
      description: "MUST avoid synchronous whole-tree filesystem discovery on the input-handling path when the picker opens or the query changes."
      acceptance_criteria: "A responsiveness regression test injects input during discovery and shows that input handling proceeds before all workspace files have been enumerated."
    - id: "FR-003"
      description: "MUST discover suggestions through bounded lazy or background batches and make partial results available before the complete workspace tree is loaded."
      acceptance_criteria: "Tests observe an initial bounded result batch, continued incremental results for larger fixtures, and no requirement to materialize the entire tree before rendering suggestions."
    - id: "FR-004"
      description: "MUST cancel or supersede stale discovery when the query changes or the picker closes, without applying results to a newer query."
      acceptance_criteria: "A focused concurrency or sequencing test changes the query during discovery and verifies that only results matching the latest active query are shown."
    - id: "FR-005"
      description: "MUST preserve existing @ mention replacement behavior when a suggestion is selected, including the active mention span and all surrounding input text."
      acceptance_criteria: "Replacement regression tests cover mentions at the beginning, middle, and end of input and assert byte-for-byte preservation of non-mention text."
    - id: "FR-006"
      description: "MUST add focused regression tests and performance benchmarks that measure discovery scaling and input latency under representative directory sizes."
      acceptance_criteria: "The targeted test and benchmark commands run on deterministic fixtures with at least three tree sizes and report discovery work plus input-latency measurements."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Input events MUST remain responsive while file discovery is active, including in the largest benchmark fixture."
      measurable_target: "At least 95% of synthetic keypresses are handled within 50 ms and no keypress waits for complete workspace enumeration."
    - id: "NFR-002"
      category: "performance"
      description: "Picker discovery MUST scale incrementally with workspace size rather than requiring an upfront full-tree load."
      measurable_target: "The first bounded result batch is available within 100 ms for each fixture size, while total discovery work is reported separately and may continue in the background."
    - id: "NFR-003"
      category: "reliability"
      description: "Disabling, closing, or replacing a picker query MUST leave no stale discovery result capable of mutating the active input."
      measurable_target: "Cancellation and stale-result regression fixtures pass with zero post-close or wrong-query input mutations across 100 repetitions."
    - id: "NFR-004"
      category: "code_quality"
      description: "The change MUST remain focused on picker configuration, discovery scheduling, replacement behavior, and their tests and benchmarks."
      measurable_target: "Review finds no unrelated UI redesign, dependency changes, or broad formatting-only edits."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can explicitly control whether @ invokes the file mention picker without changing ordinary text entry when it is disabled."
      metric: "Enabled and disabled setting interaction scenarios"
      target: "100% of required setting scenarios pass"
    - id: "SC-002"
      description: "Typing and navigation remain responsive while suggestions are discovered in small, medium, and large workspaces."
      metric: "Synthetic input event latency during active discovery"
      target: "At least 95% of events complete within 50 ms, with zero waits for complete-tree enumeration"
    - id: "SC-003"
      description: "The picker provides useful suggestions early and continues to scale without loading the entire workspace before showing results."
      metric: "Time to first bounded result batch across benchmark fixture sizes"
      target: "A first batch is available within 100 ms for every fixture size"
    - id: "SC-004"
      description: "Selecting a suggestion replaces exactly the active @ mention and preserves all surrounding user text."
      metric: "Replacement regression scenario pass rate"
      target: "100% across beginning, middle, end, empty-query, and dismissal fixtures"
    - id: "SC-005"
      description: "The regression and benchmark suite provides repeatable evidence against synchronous-discovery regressions."
      metric: "Deterministic fixture and benchmark coverage"
      target: "At least three directory sizes and 100 stale-result/cancellation repetitions are reported by automated checks"

key_entities:
  - name: "File mention picker setting"
    description: "The boolean user preference controlling whether the TUI @ file mention picker is available."
    attributes:
      - "enabled state"
      - "effective configuration source"
      - "default behavior"
  - name: "Mention query"
    description: "The active @ mention text and replacement span being edited in the TUI input."
    attributes:
      - "query text"
      - "start and end positions"
      - "query generation or freshness"
  - name: "Discovery session"
    description: "An incremental file suggestion search associated with one active mention query."
    attributes:
      - "workspace root"
      - "bounded result batch"
      - "completion or cancellation state"
      - "query identity"
  - name: "File suggestion"
    description: "A discovered path that can be displayed and selected for mention replacement."
    attributes:
      - "display path"
      - "matching state"
      - "selection position"

edge_cases:
  - scenario: "The picker is disabled while an existing picker session is open."
    expected_behavior: "The active picker closes or becomes inert, cancels discovery, and does not mutate the input with later results."
  - scenario: "A query changes several times before background discovery returns."
    expected_behavior: "Only results associated with the latest query are rendered and eligible for selection."
  - scenario: "The workspace contains no matching files or contains unreadable directories."
    expected_behavior: "The picker remains responsive and presents an empty or actionable result state without an input freeze."
  - scenario: "The workspace is very large and discovery continues after the first result batch."
    expected_behavior: "The user can keep typing, navigate, select, or dismiss while bounded batches continue or are cancelled."
  - scenario: "The active @ mention appears adjacent to punctuation, spaces, or other text."
    expected_behavior: "Selection replaces only the established mention span and preserves every surrounding character."

assumptions:
  - "The picker is enabled by default to preserve existing behavior unless a user explicitly disables it."
  - "Discovery remains limited to the workspace or filesystem boundary already used by the TUI picker and follows existing permission rules."
  - "A bounded result batch and a 50 ms input-latency budget are reasonable defaults for interactive terminal use and can be measured with deterministic fixtures."
  - "Benchmarks run locally against generated directory fixtures and do not require a live user workspace or production infrastructure."

constraints:
  - "The implementation must preserve the existing mention replacement contract and normal text-entry behavior."
  - "Discovery must not require loading the complete workspace tree before the picker can process input or display initial results."
  - "Validation must use focused deterministic regression tests and repeatable performance benchmarks."
  - "The change must remain compatible with the repository's existing configuration and TUI interaction surfaces."

out_of_scope:
  - "Redesigning the picker UI, matching algorithm, or keyboard shortcut scheme beyond what is required for incremental discovery."
  - "Building a persistent cross-session filesystem index or adding a separate indexing service."
  - "Changing the semantics of @ mentions outside file suggestion discovery and replacement."
  - "Live production-scale profiling, remote filesystems, or unrelated terminal input performance work."

