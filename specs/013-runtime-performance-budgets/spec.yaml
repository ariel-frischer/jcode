feature:
    branch: "013-runtime-performance-budgets"
    created: "2026-08-21"
    status: "Approved"
    input: "Establish maintained and reproducible client and shared-daemon runtime performance budgets for Bead jcode-l89.1. Reuse existing startup PTY benchmarks, runtime memory diagnostics, isolated socket/private daemon validation, frame/update guardrails, and actual built-binary identity checks. Define canonical metrics, commands, sample counts, aggregation, baseline thresholds or ratchets, and review action for first-visible and input-ready latency, daemon readiness, idle CPU/RSS, per-session memory scaling, representative frame/update work, and local protocol/tool round-trip overhead. Automate only deterministic low-variance gates; keep noisy machine-sensitive metrics reproducible with baseline comparison and tolerances. Add focused tests for parsing, missing or old binary rejection, timeouts/failures, and budget comparison. Validate scripts/check_guardrails.sh and a newly built isolated-runtime smoke path. Preserve the single-server multi-client architecture and backward compatibility. Explicitly state that developer-velocity changes cannot silently regress runtime budgets. Trace PRIN-002, PRIN-004, PRIN-005, PRIN-007, and PRIN-010. Use TDD for behavior changes. Keep edits surgical. Do not mutate Beads, merge, push, or remove the worktree. Commit the completed bounded implementation and report exact checks."
user_stories:
    - id: "US-001"
      title: "Maintain a canonical runtime budget"
      priority: "P1"
      as_a: "Jcode maintainer"
      i_want: "one reviewed contract for client and shared-daemon performance metrics, measurement conditions, thresholds, and ratchets"
      so_that: "runtime regressions are visible and comparable across changes instead of being judged ad hoc"
      why_this_priority: "Runtime efficiency is a product requirement and currently distributed across several benchmarks, diagnostics, and guardrails."
      independent_test: "Inspect the budget artifact and verify that every required metric has a definition, command, sample count, aggregation rule, comparison rule, and review action."
      acceptance_scenarios:
        - given: "the maintained runtime budget and its referenced measurement surfaces"
          when: "a maintainer reviews the canonical metric inventory"
          then: "first-visible latency, input-ready latency, daemon readiness, idle CPU and RSS, per-session memory scaling, frame/update work, and local protocol/tool round-trip overhead are all defined without conflicting owners"
        - given: "a developer-velocity change that touches startup, runtime, protocol, tool, frame, or memory behavior"
          when: "the change is prepared for review"
          then: "the relevant maintained budget is measured and any regression is disclosed rather than silently accepted"
    - id: "US-002"
      title: "Reproduce runtime comparisons"
      priority: "P1"
      as_a: "Jcode contributor"
      i_want: "canonical commands and controlled measurement conditions for a newly built isolated runtime"
      so_that: "I can compare a candidate with its baseline without measuring an old shared daemon or disturbing active sessions"
      why_this_priority: "A benchmark is not trustworthy unless it identifies the executable and isolates the runtime under test."
      independent_test: "Run the documented smoke and comparison workflow with a current build, then repeat with a missing, mismatched, or stale executable and verify that invalid runs are rejected before samples are accepted."
      acceptance_scenarios:
        - given: "a newly built candidate binary and a recorded baseline"
          when: "the canonical runtime comparison is run on an isolated socket with the prescribed samples"
          then: "the report identifies the candidate and baseline, records all samples and aggregates, and classifies every metric as pass, regression requiring review, or measurement failure"
        - given: "a missing executable, an executable other than the requested build, or a build older than the expected source revision"
          when: "measurement starts"
          then: "the workflow fails before producing an acceptable performance result and explains the identity problem"
    - id: "US-003"
      title: "Apply risk-appropriate performance gates"
      priority: "P1"
      as_a: "Jcode reviewer"
      i_want: "deterministic regressions to fail automatically and machine-sensitive changes to require explicit baseline review"
      so_that: "low-variance regressions are blocked while noisy measurements remain useful and reproducible"
      why_this_priority: "Treating all performance measurements as hard wall-clock gates would create unstable checks, while treating none as gates would permit silent regressions."
      independent_test: "Exercise comparison fixtures at, below, and above each threshold or tolerance and verify the required automated or review outcome."
      acceptance_scenarios:
        - given: "a deterministic invariant or low-variance hard limit is exceeded"
          when: "the runtime budget check runs"
          then: "the check fails without silently updating the accepted value"
        - given: "a machine-sensitive metric exceeds its allowed baseline tolerance"
          when: "the comparison report is reviewed"
          then: "the change requires before-and-after evidence, a written explanation, and explicit maintainer approval or a fix before its baseline can change"
requirements:
    functional:
        - id: "FR-001"
          description: "The maintained budget MUST define first-visible latency as elapsed time from client process launch until the first meaningful rendered PTY content is visible, excluding terminal-control responses."
          acceptance_criteria: "The canonical startup PTY command performs 1 unrecorded warm-up and 10 recorded runs, reports every sample plus median and nearest-rank p95, and compares both aggregates with the same-machine baseline using a tolerance of the greater of 15 percent or 20 milliseconds."
        - id: "FR-002"
          description: "The maintained budget MUST define input-ready latency as elapsed time from client process launch until a typed readiness probe is visibly accepted by the rendered client."
          acceptance_criteria: "The startup PTY workflow records input-ready results for the same 10 runs as first-visible latency, reports median and nearest-rank p95, and flags either aggregate when it exceeds the same-machine baseline by the greater of 15 percent or 20 milliseconds."
        - id: "FR-003"
          description: "The maintained budget MUST define daemon readiness as elapsed time from private daemon process launch until its isolated local socket accepts a connection."
          acceptance_criteria: "The isolated daemon command runs 5 samples, reports every sample and the median, times out each attempt within 5 seconds, and retains the existing median readiness ceiling of 80 milliseconds as an automated low-variance gate."
        - id: "FR-004"
          description: "The maintained budget MUST define shared-daemon idle resource measurements for CPU utilization and resident memory after startup work has settled."
          acceptance_criteria: "The command waits 5 seconds after readiness, collects 5 samples at 1-second intervals, reports median CPU percentage and median RSS in MiB, and flags increases above the same-machine baseline of more than 0.5 percentage points CPU or the greater of 10 percent or 8 MiB RSS for review rather than automatic rejection."
        - id: "FR-005"
          description: "The maintained budget MUST define per-session memory scaling while preserving one shared daemon serving multiple clients."
          acceptance_criteria: "The isolated workflow measures 1, 4, and 8 equivalent settled sessions in 3 trials per population, reports median daemon RSS and attributed session memory at each population, derives the median incremental MiB per added session, and flags slope growth above the same-machine baseline by the greater of 15 percent or 2 MiB per session."
        - id: "FR-006"
          description: "The maintained budget MUST reuse representative frame/update work invariants as deterministic gates rather than relying on wall-clock rendering thresholds."
          acceptance_criteria: "The canonical guardrail command runs the existing state-space frame budget and fails if an unchanged frame performs transcript layout work or if any maintained exact work-count limit grows without an explicitly reviewed ratchet update."
        - id: "FR-007"
          description: "The maintained budget MUST define local protocol and representative local tool round-trip overhead without external provider or network cost."
          acceptance_criteria: "Each round-trip case performs 5 unrecorded warm-ups and 30 recorded operations through the isolated shared daemon, reports every sample plus median and nearest-rank p95, and flags either aggregate when it exceeds the same-machine baseline by the greater of 15 percent or 1 millisecond."
        - id: "FR-008"
          description: "The canonical workflow MUST reuse the existing startup PTY benchmarks, runtime memory diagnostics, isolated socket/private-daemon path, and frame/update guardrails as the authoritative measurement surfaces."
          acceptance_criteria: "The budget artifact names one canonical command for a full report and maps its metric groups to scripts/bench_startup_visible_ready.py, scripts/bench_startup.py, scripts/bench_memory_cli.py, scripts/analyze_runtime_memory_log.py, and scripts/check_guardrails.sh without introducing a second runtime architecture."
        - id: "FR-009"
          description: "Every accepted runtime result MUST identify the actual candidate executable and daemon process being measured."
          acceptance_criteria: "The report records the requested path, fully resolved executable path, version or revision identity, and a content fingerprint; it rejects missing or non-executable paths, a resolved path different from the requested candidate, a running daemon executable different from that candidate, and a candidate older than the expected build revision or declared build start."
        - id: "FR-010"
          description: "The workflow MUST isolate candidate runtime state and transport from the user's active shared daemon and sessions."
          acceptance_criteria: "Runtime smoke and measurements use a private temporary home/runtime directory and unique socket, verify that the private daemon owns the socket, terminate only processes created by the workflow, and leave the normal shared-daemon socket and sessions untouched."
        - id: "FR-011"
          description: "The comparison result MUST distinguish deterministic gate failures, noisy regressions requiring review, invalid measurements, and passing results."
          acceptance_criteria: "Machine-readable and human-readable output classify each metric, retain raw samples and baseline provenance, and return a nonzero result for deterministic violations or invalid measurements while never silently changing a baseline."
        - id: "FR-012"
          description: "Baseline ratchets MUST be explicit, reviewable, and attributable to a stable comparison environment."
          acceptance_criteria: "A baseline records operating system and architecture, executable identity, measurement command and parameters, sample count, aggregate method, collection timestamp, and relevant toolchain profile; updating it requires a visible diff and stated reason."
        - id: "FR-013"
          description: "The runtime budget behavior MUST be developed test-first and include focused coverage for result parsing, budget comparison, binary identity rejection, timeouts, and subprocess failures."
          acceptance_criteria: "Tests first demonstrate failure for the new behavior, then pass for valid and malformed samples, missing fields, threshold boundaries, missing/mismatched/stale binaries, readiness and operation timeouts, nonzero subprocess exits, and partial-run rejection."
        - id: "FR-014"
          description: "The completed change MUST validate the canonical repository guardrails and a newly built isolated-runtime smoke path."
          acceptance_criteria: "Delivery evidence records successful scripts/check_guardrails.sh execution and a smoke command that builds the candidate, verifies its identity, launches its private daemon on an isolated socket, completes one local client or tool round trip, and shuts down only that private runtime."
        - id: "FR-015"
          description: "The runtime budget capability MUST preserve existing CLI, protocol, configuration, and default behavior when its reporting or comparison workflow is not invoked."
          acceptance_criteria: "Focused compatibility checks show unchanged normal startup and shared-server multi-client behavior, with no required new configuration and no wire-format break for existing clients."
        - id: "FR-016"
          description: "Developer-velocity improvements MUST NOT silently regress maintained client or daemon runtime budgets."
          acceptance_criteria: "Any change presented as improving build, reload, startup, or development iteration speed includes the relevant runtime-budget result; a measured regression above a gate or tolerance is fixed or explicitly approved with its baseline change."
        - id: "FR-017"
          description: "The completed bounded implementation MUST be committed without mutating Beads, merging, pushing, or removing the worktree."
          acceptance_criteria: "Delivery reports the focused commit identifier and exact checks while Bead state, remote branches, integration branches, and worktree presence remain unchanged."
    non_functional:
        - id: "NFR-001"
          category: "performance"
          description: "Deterministic low-variance limits must remain automated delivery gates, while wall-clock and operating-system resource metrics remain reproducible comparison evidence."
          measurable_target: "100 percent of defined metrics are classified as either automated gates or baseline comparisons, with no machine-sensitive metric treated as a universal hard gate."
        - id: "NFR-002"
          category: "reliability"
          description: "A failed or incomplete measurement must never be reported as a passing budget result."
          measurable_target: "All missing samples, timeouts, process failures, malformed results, and identity mismatches produce an invalid result and nonzero exit status."
        - id: "NFR-003"
          category: "code_quality"
          description: "The change must remain surgical and reuse established measurement and guardrail ownership."
          measurable_target: "No duplicate daemon model, protocol definition, or replacement benchmark suite is introduced; every new behavior maps to a focused test."
        - id: "NFR-004"
          category: "reliability"
          description: "PRIN-002 compatibility obligations must govern all public and persisted contracts touched by the budget workflow."
          measurable_target: "Existing CLI defaults, protocol behavior, configuration, and shared-server usage remain unchanged when the workflow is unused."
        - id: "NFR-005"
          category: "code_quality"
          description: "PRIN-004 ownership must preserve the single-server multi-client architecture and established layer boundaries."
          measurable_target: "All runtime measurements observe one authoritative server and use existing protocol or harness contracts rather than terminal-output parsing for cross-process semantics."
        - id: "NFR-006"
          category: "code_quality"
          description: "PRIN-005 and PRIN-007 must be satisfied by focused behavioral evidence followed by the repository guardrail suite."
          measurable_target: "Every behavioral acceptance criterion has a direct check, and scripts/check_guardrails.sh passes before delivery."
        - id: "NFR-007"
          category: "performance"
          description: "PRIN-010 must be satisfied by measuring the executable and processes that actually run the isolated workflow."
          measurable_target: "Every runtime report contains verified executable identity and zero accepted samples from a missing, stale, mismatched, or pre-existing daemon binary."
success_criteria:
    measurable_outcomes:
        - id: "SC-001"
          description: "Maintainers can review all requested runtime dimensions from one consistent budget report."
          metric: "Coverage of the seven required metric groups and their required metadata"
          target: "7 of 7 metric groups include raw samples, aggregation, comparison rule, provenance, and review outcome."
        - id: "SC-002"
          description: "Contributors can reproduce a candidate-versus-baseline comparison without affecting their active Jcode service."
          metric: "Isolated smoke completion and shared-runtime interference"
          target: "The smoke completes against the verified new build with one private daemon and zero changes to the active shared daemon or its sessions."
        - id: "SC-003"
          description: "Invalid runtime evidence is reliably rejected."
          metric: "Focused negative-case acceptance rate"
          target: "100 percent of covered missing, stale, mismatched, timeout, subprocess-failure, malformed, and partial-result cases are rejected."
        - id: "SC-004"
          description: "Performance regressions receive the correct delivery response."
          metric: "Classification accuracy across threshold-boundary fixtures"
          target: "100 percent of deterministic violations fail, noisy out-of-tolerance changes require review, and in-tolerance results pass without changing baselines."
        - id: "SC-005"
          description: "Existing Jcode users experience no behavior or compatibility change unless they explicitly run the budget workflow."
          metric: "Regression checks for default CLI, protocol, and shared-daemon behavior"
          target: "All focused compatibility checks and repository guardrails pass with no new required configuration."
key_entities:
    - name: "Runtime Metric"
      description: "A user-observable latency, process-resource measurement, scaling measure, deterministic work count, or local round-trip measure."
      attributes:
        - "name and unit"
        - "measurement boundary"
        - "sample and warm-up counts"
        - "aggregation rule"
        - "gate or tolerance classification"
    - name: "Runtime Baseline"
      description: "A reviewed reference result for machine-sensitive comparison."
      attributes:
        - "raw samples and aggregates"
        - "executable identity"
        - "environment provenance"
        - "comparison tolerance"
        - "collection date and review reason"
    - name: "Runtime Report"
      description: "The auditable outcome of measuring one candidate against maintained gates and an optional baseline."
      attributes:
        - "candidate and daemon identity"
        - "metric classifications"
        - "failures and timeouts"
        - "review actions"
    - name: "Isolated Runtime"
      description: "A private daemon and client set created only for a measurement run."
      attributes:
        - "unique socket"
        - "private state directories"
        - "owned process identifiers"
        - "verified executable"
edge_cases:
    - scenario: "The candidate path is a symlink or launcher that resolves to a different build than expected."
      expected_behavior: "Resolve and record the executable identity, then reject the run if it is not the declared candidate."
    - scenario: "A socket file exists before the private daemon starts or belongs to another process."
      expected_behavior: "Reject or safely choose a new isolated socket without connecting to or terminating the unrelated process."
    - scenario: "Only some samples complete before a timeout or subprocess failure."
      expected_behavior: "Preserve diagnostic samples but classify the metric as invalid; do not aggregate it into a passing result."
    - scenario: "The baseline was collected with different sample counts, aggregation rules, architecture, or command parameters."
      expected_behavior: "Mark the results non-comparable and require a compatible baseline rather than applying misleading tolerances."
    - scenario: "A value is exactly on its hard limit or tolerance boundary."
      expected_behavior: "Treat the value as within budget; only values strictly above the boundary regress."
    - scenario: "Resource readings are unavailable on the current platform."
      expected_behavior: "Report the metric as unsupported with platform details; do not fabricate a pass or weaken supported-platform checks."
assumptions:
    - "Linux is the initial canonical environment for PTY, Unix-socket, CPU, RSS, and process-identity measurements; other platforms may report unsupported metrics without changing their existing runtime behavior."
    - "Nearest-rank p95 is used so percentile aggregation is deterministic for the prescribed small sample sets."
    - "Existing hard startup ceilings remain authoritative until reviewed evidence justifies a ratchet change; new machine-sensitive resource and round-trip values begin as same-machine baseline comparisons rather than universal limits."
    - "The baseline candidate and changed candidate are measured under equivalent local load, power, build profile, configuration, and runtime state."
    - "The existing startup, memory, frame, protocol, and isolated-runtime surfaces are sufficient owners; the work may compose or extend them but does not replace them."
constraints:
    - "PRIN-002: Preserve backward-compatible CLI, configuration, protocol, persistence, and default behavior."
    - "PRIN-004: Preserve layered ownership and the single-server multi-client architecture; the server remains runtime authority."
    - "PRIN-005: Use TDD for behavior changes and map each acceptance criterion to a focused test or explicit manual evidence."
    - "PRIN-007: Run focused checks first, then the relevant build and scripts/check_guardrails.sh; do not hide failures by silently rebaselining."
    - "PRIN-010: Maintain explicit runtime budgets, require approval for regressions, and validate against the actual newly built executable and isolated processes."
    - "Keep edits surgical, preserve unrelated work, and add no speculative framework or duplicate runtime path."
    - "Do not mutate Beads, merge, push, or remove this worktree during the bounded implementation."
out_of_scope:
    - "Changing the single-server multi-client architecture or moving runtime authority into clients."
    - "Provider-network latency, model response latency, live external tools, or costly production-adjacent performance validation."
    - "Universal hard limits for noisy CPU, RSS, PTY latency, session-scaling, or local round-trip measurements across heterogeneous machines."
    - "Unrelated runtime optimization, broad benchmark refactoring, dependency changes, or cleanup discovered during implementation."
    - "Automatic baseline updates or acceptance of a regression without explicit review."
