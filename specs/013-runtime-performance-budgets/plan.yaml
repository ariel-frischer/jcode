implementation_phases:
  - phase: 1
    name: "Freeze report, identity, and comparison contracts"
    goal: "Establish failing focused tests and versioned data contracts before collector behavior changes."
    deliverables:
      - "Report and baseline fixtures covering all seven metric groups, provenance, classifications, and incomplete/unsupported states."
      - "Nearest-rank p95 and strict-above-boundary tolerance tests."
      - "Missing, non-executable, symlink-mismatch, stale, post-run-changed, and daemon-executable mismatch tests."
      - "Owned temporary runtime and safe cleanup tests that preserve pre-existing sockets and unrelated processes."
  - phase: 2
    name: "Implement shared budget primitives and CLI"
    goal: "Provide one tested owner for identity, isolation, aggregation, comparison, and report serialization."
    dependencies:
      - "Phase 1"
    deliverables:
      - "scripts/runtime_budget.py data and lifecycle primitives."
      - "collect, compare, and explicit baseline subcommands with stable exit/classification semantics."
      - "Human-readable output rendered from the same validated JSON report."
      - "Pinned pyte runtime-benchmark dependency and actionable dependency preflight."
  - phase: 3
    name: "Integrate startup and deterministic gates"
    goal: "Bring visible readiness, input readiness, daemon readiness, and frame work under the canonical report without duplicating collectors."
    dependencies:
      - "Phase 2"
    deliverables:
      - "One warm-up plus 10 complete PTY samples with median and nearest-rank p95."
      - "Five private daemon readiness samples with per-attempt timeout and 80 ms median gate."
      - "Deterministic desktop state-space frame result imported from the existing guardrail command."
      - "Structured failure propagation for PTY, socket, subprocess, and incomplete-run errors."
  - phase: 4
    name: "Integrate resource, scaling, and local round-trip evidence"
    goal: "Complete the remaining private shared-daemon metric groups with correct attribution and noisy-comparison policies."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Five idle CPU/RSS readings after a five-second settle period."
      - "Three trials each for 1, 4, and 8 equivalent clients, including daemon RSS, attributed session memory, and incremental MiB/session."
      - "Five warm-ups plus 30 recorded protocol and local-tool operations with median and nearest-rank p95."
      - "Explicit unsupported-platform results and no external provider/network dependency."
  - phase: 5
    name: "Document, baseline, and validate delivery"
    goal: "Publish the maintained budget contract and prove the full workflow against the intended built runtime."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Canonical documentation and an explicitly reviewed Linux reference baseline with all required provenance."
      - "Focused Python suites and collector integration tests."
      - "Existing desktop frame gate and scripts/check_guardrails.sh passing without silent ratchet changes."
      - "Fresh selfdev build identity verification and isolated smoke covering daemon launch, one local round trip, and owned shutdown."
      - "Focused implementation commit and exact evidence handoff without Bead mutation, merge, push, or worktree removal."

open_questions:
  - question: "Which stable Linux host and load/power conditions should own the first checked-in same-machine baseline values?"
    context: "The spec fixes tolerances but intentionally does not provide trustworthy raw baseline samples; collecting them on an unstable or undocumented host would make the first ratchet misleading."
    proposed_resolution: "During Phase 5, collect repeated healthy reports on Ariel's designated development host under documented idle/load and power conditions, review variance, then commit only the accepted report-derived baseline and its reason."
    resolution: "Use Ariel's designated Linux development host on AC power with stable performance settings and no concurrent Cargo, rustc, build, or benchmark process at collection start. Review three sequential complete reports and retain the selected report plus all deterministic failures truthfully."
  - question: "Should the benchmark dependency runner use the active Python 3.14 interpreter or a separately pinned supported interpreter?"
    context: "pyte 0.8.2 declares Python >=3.8 but its published classifiers stop at Python 3.12, and pyte is absent from the current Python 3.14 environment."
    proposed_resolution: "Pin pyte 0.8.2, run its focused screen fixture under the active interpreter first, and add a repository-local Python toolchain pin only if that compatibility check fails; do not introduce a second interpreter contract speculatively."
    resolution: "Use the active Python 3.14 interpreter. The pinned pyte 0.8.2 dependency and all 77 focused runtime-budget tests passed under that interpreter, so no second interpreter contract is required."

