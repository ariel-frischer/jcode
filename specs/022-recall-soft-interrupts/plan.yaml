research_findings:
  decisions:
    - topic: "Ownership"
      decision: "Bind user soft interrupts to the stable current_client_instance_id at enqueue."
      rationale: "The server already verifies and tracks this identity across reconnect."
      alternatives_considered: ["connection ID", "content matching", "session-wide ownership"]
    - topic: "Selection"
      decision: "Under the existing queue mutex, remove only the last entry whose source is User and owner matches the requester."
      rationale: "This implements newest-first one-message recall and naturally preserves every other entry's order."
      alternatives_considered: ["clear-all", "recall all owned messages", "client queue indexes"]
    - topic: "Authoritative response and replay"
      decision: "Use a stable client operation ID and a bounded session-scoped completed-result cache."
      rationale: "A retry after response loss can return the same result without a second queue mutation."
      alternatives_considered: ["optimistic composer mutation", "fire-and-forget removal", "unbounded cache"]
    - topic: "Composer rule"
      decision: "Do nothing unless both composer text and images are empty; on success replace the empty composer with exactly one returned message."
      rationale: "This matches established Alt+q behavior and avoids draft merging."
      alternatives_considered: ["append to draft", "prepend to draft", "recall while images are attached"]
    - topic: "Fallback"
      decision: "Preserve the existing local queued-message recall path; server recall is attempted only when no local editable queued message was taken and local tracking indicates server-pending input."
      rationale: "Existing local cycling stays immediate and unchanged."
      alternatives_considered: ["server-first for every press", "disable local recall while connected"]

api_contracts:
  endpoints:
    - method: "WIRE"
      path: "recall_soft_interrupt"
      description: "Request one newest still-queued User message owned by the invoking client."
      request:
        content_type: "application/json"
        body_schema: "{ type: recall_soft_interrupt, id: u64, operation_id: string }"
      response:
        success_code: 200
        body_schema: "{ type: soft_interrupt_recalled, id: u64, operation_id: string, message: RecallableSoftInterrupt|null }"
      errors:
        - code: 400
          description: "Missing or invalid stable client identity or operation identity."
        - code: 409
          description: "Conflicting reuse of an operation identity."

