plan:
  branch: "agent/jcode-c9u-alt-q-soft-queue"
  created: "2026-09-01"
  spec_path: "specs/022-recall-soft-interrupts/spec.yaml"

summary: |
  Add an additive, ownership-aware soft-interrupt recall contract across jcode-agent-runtime, jcode-protocol, jcode-app-core, and jcode-tui. Each user-originated queued interrupt will carry a stable message identity and the subscribing TUI client's stable client_instance_id. Alt+q will issue an idempotent recall operation before touching the composer. The server will atomically partition the queue under its existing mutex, remove only currently available User messages whose verified owner matches the requester, preserve every other entry in relative order, persist the remaining queue, and return the exact recalled messages as the authoritative result.

  The TUI will correlate results by request and operation identity, ignore stale or duplicate completions, and mutate the composer only after a confirmed result. Existing draft content remains first, followed by recalled message text in queue order separated by a documented newline boundary, while image vectors are appended in the corresponding draft-then-message order supported by the current composer model. A confirmed empty result falls back to the existing local queued-message recall path. CancelSoftInterrupts remains a distinct all-pending cancellation action. Focused protocol, persistence, server queue, TUI, race, and isolated-socket runtime checks will prove ownership, ordering, multimodal preservation, partial and failure behavior, compatibility, and latency.

technical_context:
  language: "Rust 2024 edition"
  framework: "Tokio 1 asynchronous runtime with Ratatui 0.30 and Crossterm 0.29 TUI"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "Use the existing server, transport, event-loop, timeout, and concurrency primitives without introducing another runtime."
    - name: "serde"
      version: "1"
      purpose: "Extend the existing JSON-lines wire and persisted soft-interrupt representations with additive defaulted fields."
    - name: "serde_json"
      version: "1"
      purpose: "Validate protocol serialization and persisted queue compatibility fixtures."
    - name: "ratatui"
      version: "0.30"
      purpose: "Present pending, success, partial, unavailable, and failure recall outcomes in the existing TUI status-notice surface."
    - name: "crossterm"
      version: "0.29"
      purpose: "Preserve the existing Alt+q keyboard route in local and remote key handling."
  storage: "Existing per-session pending-soft-interrupt JSON files, extended additively with stable message identity and optional client ownership. Legacy records load as unowned and therefore fail closed for recall. Idempotent recall outcomes are retained in bounded server session state for reconnect/retry reconciliation."
  testing:
    framework: "Rust built-in test framework with Tokio async tests, protocol serde fixtures, Ratatui App tests, and isolated-socket runtime probes"
    approach: "Start with exact unit tests for message metadata, serialization, atomic queue partitioning, ownership, ordering, persistence, and idempotency. Add server client-lifecycle tests for mixed queues, partial and concurrent outcomes, TUI tests for authoritative composer application and local fallback, then run focused package checks, a coordinated TUI build, guardrails, a 10,000-iteration race stress test, and a newly built isolated-socket workflow."
  target_platform: "Jcode's supported Linux, macOS, and Windows TUI clients connected to the single shared server model"
  project_type: "cli"
  performance_goals: "At least 95% of normal local recall attempts produce a confirmed result or clear pending/failure indication within 500 ms, with zero loss, duplication, or unrelated-message movement across 10,000 forced race iterations."
  constraints:
    - "The server is authoritative for queue contents, ownership verification, current availability, and the exact recalled result."
    - "Ownership must fail closed for absent, stale, mismatched, or legacy metadata."
    - "Only SoftInterruptSource::User messages owned by the invoking client are recallable."
    - "Other clients' messages and all system or background interrupts must remain queued in relative order."
    - "The composer and local recall queue must not change before an authoritative result arrives."
    - "CancelSoftInterrupts semantics and the established local Alt+q queue-edit cycle must remain compatible."
    - "Protocol and persistence changes must be additive and tolerate older messages, clients, and stored records."
    - "Do not add a new dependency or duplicate the canonical protocol, queue, or composer paths."
    - "Serialize Rust builds, tests, Clippy, stress runs, and guardrails on the resource-constrained development machine."
    - "Runtime validation must use the newly built binary on an isolated socket or a deliberately reloaded intended daemon."
  scale_scope: "One mutex-protected ordered queue per active session, typically tens of pending interrupts, plus a small bounded idempotency cache of recent recall operations per session and one in-flight recall operation per TUI client."

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "PRIN-001 Surgical, Scope-Bound Changes"
      status: "PASS"
      notes: "The plan limits changes to soft-interrupt identity and persistence, one additive recall wire path, authoritative server queue mutation, Alt+q result handling, and focused tests. It excludes unrelated composer or interrupt redesign."
    - name: "PRIN-002 Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "New wire variants are additive, new persisted fields are defaulted, legacy unowned records remain valid but unrecalled, and explicit regressions preserve CancelSoftInterrupts and local recall behavior."
    - name: "PRIN-003 Explicit Configuration Precedence"
      status: "N/A"
      notes: "The feature introduces no configuration setting or precedence path. Server ownership metadata and the authoritative result are mandatory rather than configurable."
    - name: "PRIN-004 Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "Stable message metadata remains in jcode-agent-runtime, cross-process types remain in jcode-protocol, server authority and persistence remain in jcode-app-core and jcode-base, and transient composer application remains in jcode-tui."
    - name: "PRIN-005 Focused Behavioral Tests"
      status: "PASS"
      notes: "The validation matrix maps ownership, mixed queues, ordering, images, races, partial results, reconnect idempotency, cancellation compatibility, local fallback, and draft merging to focused boundary tests before broader checks."
    - name: "PRIN-006 Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "Client identity and protocol metadata are validated at the server boundary, unverifiable ownership fails closed, stale or duplicate results are rejected, and unavailable, partial, timeout, disconnect, persistence, and protocol failures remain visible without unconfirmed composer mutation."
    - name: "PRIN-007 Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "The final phase requires formatting, focused crate checks, a coordinated build, scripts/check_guardrails.sh, and disclosure of any proven unrelated baseline failure."
    - name: "PRIN-008 Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The design extends the current custom Alt+q local recall and canonical soft-interrupt queue instead of adding a parallel queue, generic undo system, or imported implementation."
    - name: "PRIN-009 Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "Acceptance is defined by safely returning the user's still-queued owned content to an editable composer while preserving all unrelated work and exposing every non-success outcome."
    - name: "PRIN-010 Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "The plan includes the 500 ms latency target, a 10,000-iteration race stress check, and an isolated-socket workflow against the newly built executable rather than compilation-only evidence."

research_findings:
  decisions:
    - topic: "Canonical ownership boundary"
      decision: "Associate each user-originated SoftInterruptMessage with the stable client_instance_id captured by Subscribe, and authorize recall only when that owner exactly matches the invoking connection's current verified client identity."
      rationale: "The server already receives and tracks client_instance_id across subscribe and reconnect. Binding ownership when the message is queued makes selection authoritative and prevents connection-local guesses or session-wide ownership from affecting another client."
      alternatives_considered:
        - "Treat every user message in the shared session as owned by the current caller."
        - "Use transient connection IDs that change on reconnect."
        - "Infer ownership from content, queue position, or client-side state."
    - topic: "Stable message and operation identity"
      decision: "Add a stable queued-message identity derived from the owner's client identity plus the originating soft-interrupt request ID, and give each recall attempt a client-generated operation identity that the server handles idempotently."
      rationale: "Message identity lets the server describe unavailable candidates and partial outcomes precisely. Operation identity lets retries or reconnect reconciliation return the same authoritative result without removing or inserting content twice."
      alternatives_considered:
        - "Return only a count with no message identities."
        - "Treat each retry as a new recall operation."
        - "Use queue indexes, which change as messages are consumed or inserted."
    - topic: "Atomic queue selection"
      decision: "Perform one stable partition while holding the existing SoftInterruptQueue mutex: collect eligible owned User messages in original order and rebuild the queue from all non-selected messages in original order."
      rationale: "Injection, cancellation, and recall then serialize at the same lock boundary, giving every message exactly one state at the decision point and naturally preserving relative ordering on both sides of the partition."
      alternatives_considered:
        - "Snapshot the queue, release the lock, then remove by index."
        - "Clear the queue and requeue unrelated entries."
        - "Let the client identify queue positions to remove."
    - topic: "Disconnect and duplicate-result reconciliation"
      decision: "Retain a bounded per-session cache of completed recall outcomes keyed by verified client and operation identity, return the cached result for duplicates, and let the TUI retain in-flight and applied operation identities across transport reconnects."
      rationale: "A response lost after server mutation must be recoverable, while a repeated response after client application must not duplicate composer content. Bounded state avoids an unbounded session leak and preserves the single-server authority model."
      alternatives_considered:
        - "Fire-and-forget removal with no retry semantics."
        - "Mutate the composer optimistically before the server response."
        - "Use a two-phase user-visible confirmation flow for every recall."
    - topic: "Protocol result shape"
      decision: "Add a dedicated RecallSoftInterrupts request and SoftInterruptsRecalled server event carrying request ID, operation identity, ordered recalled messages, unavailable candidate identities, and an explicit complete, partial, or unavailable outcome. Keep Ack unchanged for queue and cancellation requests."
      rationale: "A generic Ack cannot carry authoritative content or distinguish partial and unavailable outcomes. A dedicated additive event is explicit, serializable, testable, and ignorable by older clients."
      alternatives_considered:
        - "Overload CancelSoftInterrupts to return removed content."
        - "Encode recalled content in a generic status string."
        - "Send Ack followed by unrelated synthetic message events."
    - topic: "Persistence compatibility"
      decision: "Extend PersistedSoftInterrupt with defaulted optional identity and owner fields, snapshot the post-recall queue through the existing overwrite path, and load legacy entries as unowned and non-recallable."
      rationale: "This preserves existing JSON files and prevents legacy or background data from gaining ownership by assumption. Reusing overwrite avoids a second queue persistence format."
      alternatives_considered:
        - "Migrate legacy entries to the first reconnecting client."
        - "Delete legacy pending files."
        - "Create a second recall-only persistence store for queue entries."
    - topic: "Composer merge rule"
      decision: "Preserve the existing draft first, append recalled message text in server-returned queue order with one newline boundary between non-empty text segments, and append recalled image vectors after existing draft images in the same message order."
      rationale: "The current composer stores text and images separately, so this rule is deterministic, lossless within the supported model, compatible with existing attachment handling, and avoids replacing user-authored draft content."
      alternatives_considered:
        - "Replace the draft with recalled content."
        - "Prepend recalled content before the draft."
        - "Attempt to invent unsupported arbitrary text-image interleaving metadata."
    - topic: "Alt+q fallback and request serialization"
      decision: "Allow at most one in-flight server recall per TUI client. On confirmed non-empty success or partial success, apply only returned content. On confirmed empty unavailable, invoke the unchanged local retrieve_queued_message_for_edit path. On timeout, rejection, or disconnect, preserve both composer and local queue and show a non-destructive notice."
      rationale: "This gives server-owned messages priority without consuming local fallback state prematurely, prevents repeated Alt+q from creating contradictory operations, and directly satisfies failure and compatibility requirements."
      alternatives_considered:
        - "Recall local content immediately while the server request is pending."
        - "Issue one concurrent server request for every key repeat."
        - "Disable local recall whenever connected to a server."
    - topic: "SDK and harness scope"
      decision: "Update jcode-protocol and the TUI/server path in this feature, then explicitly triage jcode-harness-api and jcode-sdk capability coverage so public automation either gains a matching additive recall method or records the capability as intentionally TUI-only. Do not create or vendor a Go SDK implementation in this repository."
      rationale: "The canonical Rust wire contract must not drift silently from supported public clients, while AGENTS.md reserves Go SDK ownership to the separate jcode-go repository."
      alternatives_considered:
        - "Change only private TUI structs and bypass the wire contract."
        - "Duplicate the protocol definition in the root crate."
        - "Add a Go projection under this repository."

data_model:
  entities:
    - name: "QueuedInterruptMessage"
      description: "One pending interrupt in the authoritative ordered server queue."
      fields:
        - name: "message_id"
          type: "QueuedSoftInterruptId"
          description: "Stable identity used for precise recall and race outcomes."
          constraints: "Unique within the owning client identity and stable through queue persistence; legacy records may be absent and are not recallable."
        - name: "content"
          type: "String"
          description: "User, system, or background text payload."
          constraints: "Returned byte-for-byte for a confirmed recall."
        - name: "images"
          type: "Vec<(String, String)>"
          description: "Ordered media-type and encoded-image attachments."
          constraints: "Returned without omission, substitution, duplication, or reordering."
        - name: "urgent"
          type: "bool"
          description: "Existing injection priority behavior."
          constraints: "Preserved for queued messages and does not broaden recall eligibility."
        - name: "source"
          type: "SoftInterruptSource"
          description: "User, System, or BackgroundTask origin category."
          constraints: "Only User is eligible for client recall."
        - name: "owner_client_instance_id"
          type: "Option<String>"
          description: "Stable verified TUI client permitted to recall the message."
          constraints: "Must exactly match the invoking subscribed client; None fails closed."
      relationships:
        - target: "ClientOwnership"
          type: "many-to-one"
          description: "Multiple user messages may be owned by one stable client identity."
        - target: "RecallOperation"
          type: "many-to-many"
          description: "A message may be requested by retries of one operation but can be confirmed recalled by at most one authoritative operation."
    - name: "ClientOwnership"
      description: "The server-verified association between a subscribed TUI client and its queued user messages."
      fields:
        - name: "client_instance_id"
          type: "String"
          description: "Stable identity supplied on Subscribe and tracked by the server."
          constraints: "Must be present and current on both enqueue and recall; mismatches and absent values are rejected."
        - name: "connection_id"
          type: "String"
          description: "Transient transport identity used to locate the current requester."
          constraints: "Never substitutes for stable ownership and may change on reconnect."
        - name: "verification_status"
          type: "Verified | Missing | Mismatched"
          description: "Authorization outcome at the recall boundary."
          constraints: "Only Verified permits selection."
      relationships:
        - target: "QueuedInterruptMessage"
          type: "one-to-many"
          description: "Verified ownership authorizes only associated User messages."
    - name: "RecallOperation"
      description: "An idempotent client request to atomically recall a known set of still-queued owned messages."
      fields:
        - name: "operation_id"
          type: "String"
          description: "Stable client-generated identity reused across retries and reconnect reconciliation."
          constraints: "Unique per client instance and retained until the authoritative result is applied or abandoned."
        - name: "request_id"
          type: "u64"
          description: "Current transport correlation ID."
          constraints: "May differ across retries and is not the ownership key."
        - name: "candidate_message_ids"
          type: "Vec<QueuedSoftInterruptId>"
          description: "Messages the TUI believes it has queued and wants to take back."
          constraints: "The server independently verifies ownership, source, and current availability for every candidate."
        - name: "state"
          type: "Pending | Completed"
          description: "Server-side operation lifecycle."
          constraints: "Completed operations return the same cached result on duplicate requests."
      relationships:
        - target: "RecallResult"
          type: "one-to-one"
          description: "Each operation has one immutable authoritative result."
    - name: "RecallResult"
      description: "The server-authoritative outcome returned to the requesting TUI."
      fields:
        - name: "outcome"
          type: "Complete | Partial | Unavailable"
          description: "User-visible classification based on confirmed recalled and unavailable candidates."
          constraints: "Failure or rejection uses the existing protocol Error path and contains no recalled content."
        - name: "recalled_messages"
          type: "Vec<SoftInterruptMessage>"
          description: "Ordered messages atomically removed from the queue."
          constraints: "Contains only verified owned User messages and exactly matches server mutation."
        - name: "unavailable_message_ids"
          type: "Vec<QueuedSoftInterruptId>"
          description: "Requested candidates that were consumed, canceled, missing, unowned, or otherwise ineligible."
          constraints: "Must not expose another client's content or sensitive payload."
        - name: "remaining_owned_count"
          type: "usize"
          description: "Optional diagnostic count of still-queued eligible owned messages not included by the candidate set."
          constraints: "Count only; must not leak unrelated queue data."
      relationships:
        - target: "EditableComposerContent"
          type: "one-to-one"
          description: "Only a current, non-duplicate authoritative result may be merged into the composer."
    - name: "EditableComposerContent"
      description: "Transient TUI draft state after applying a confirmed recall result or existing local fallback."
      fields:
        - name: "text"
          type: "String"
          description: "Existing draft followed by confirmed recalled text segments."
          constraints: "Must remain unchanged on pending, timeout, rejection, disconnect, or malformed result."
        - name: "images"
          type: "Vec<(String, String)>"
          description: "Existing draft images followed by confirmed recalled images in message order."
          constraints: "Must preserve attachment content and relative order exactly once."
        - name: "applied_operation_ids"
          type: "BoundedSet<String>"
          description: "Recently applied recall operations used to reject duplicate replay after reconnect."
          constraints: "Bounded and transient; repeated results never mutate the composer twice."
      relationships:
        - target: "RecallResult"
          type: "one-to-many"
          description: "Results may be applied over time, each at most once and in completion order."

api_contracts:
  endpoints:
    - method: "WIRE"
      path: "recall_soft_interrupts"
      description: "JSON-lines client-to-server request that asks the authoritative server to recall currently available owned user soft interrupts idempotently."
      request:
        content_type: "application/json"
        body_schema: "{ type: recall_soft_interrupts, id: u64, operation_id: string, message_ids: [QueuedSoftInterruptId] }"
      response:
        success_code: 200
        body_schema: "{ type: soft_interrupts_recalled, id: u64, operation_id: string, outcome: complete|partial|unavailable, recalled_messages: [RecallableSoftInterrupt], unavailable_message_ids: [QueuedSoftInterruptId] }"
      errors:
        - code: 400
          description: "Malformed request, missing stable client identity, invalid candidate identity, or mismatched operation replay."
        - code: 403
          description: "The requester cannot verify ownership of any supplied candidate; no queue or composer mutation occurs."
        - code: 409
          description: "The operation identity conflicts with a different prior request; the original cached result remains authoritative."
        - code: 500
          description: "Queue locking, persistence, or server processing failed before an authoritative result could be committed."
    - method: "WIRE"
      path: "soft_interrupts_recalled"
      description: "Dedicated server event consumed only by the requesting client and correlated to its in-flight recall operation."
      request:
        content_type: "application/json"
        body_schema: "Server-generated event; no independent client request body."
      response:
        success_code: 200
        body_schema: "The TUI validates request and operation identity, applies recalled content once, shows outcome status, or falls back locally only for a confirmed empty unavailable result."
      errors:
        - code: 400
          description: "A stale, duplicate, malformed, or uncorrelated event is ignored and surfaced diagnostically without composer mutation."

