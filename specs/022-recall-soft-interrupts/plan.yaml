implementation_phases:
  - phase: 1
    name: "Identity and compatible contracts"
    goal: "Make queued user interrupts verifiably ownable and serializable without changing existing cancellation or injection behavior."
    deliverables:
      - "Add stable queued-message identity and optional client owner metadata to SoftInterruptMessage."
      - "Bind Request::SoftInterrupt messages to the current subscribed client_instance_id; leave system and background producers unowned."
      - "Extend persisted soft-interrupt records with defaulted optional identity and owner fields, with legacy records loading unowned."
      - "Add the RecallSoftInterrupts request and SoftInterruptsRecalled result event, request-ID plumbing, serde fixtures, and lifecycle logging classification."
      - "Decide and document harness and Rust SDK exposure while preserving the separate Go SDK ownership boundary."
  - phase: 2
    name: "Authoritative atomic server recall"
    goal: "Select and remove only currently available eligible owned messages at one server decision point while preserving all unrelated queue state."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Add a stable-partition recall helper under the existing queue mutex and unit-test both recalled and remaining order."
      - "Require exact current client ownership and User source for every selected message; reject missing or mismatched ownership closed."
      - "Persist the post-recall remaining queue through the existing snapshot path and emit no success result when authoritative commit fails."
      - "Return ordered recalled payloads and unavailable candidate identities so complete, partial, and unavailable outcomes are explicit."
      - "Keep CancelSoftInterrupts as the existing distinct clear-all action and add overlap tests proving one final state per message."
  - phase: 3
    name: "Idempotency, races, and reconnect reconciliation"
    goal: "Ensure retries, concurrent consumption, cancellation, and transport loss cannot duplicate or silently lose recalled content."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Add bounded per-session completed-operation caching keyed by verified client and operation identity."
      - "Return immutable cached results for identical retries and reject conflicting reuse of an operation identity."
      - "Serialize queue injection, consumption, cancellation, and recall at the queue lock and test consumed, queued, canceled, and recalled as mutually exclusive outcomes."
      - "Retain TUI in-flight and applied operation state across reconnect, retry unresolved operations, and ignore repeated authoritative results already applied."
      - "Run a deterministic 10,000-iteration race harness with zero duplicates, unrelated-message loss, or unconfirmed composer insertions."
  - phase: 4
    name: "Alt+q composer integration"
    goal: "Make server-confirmed recalled content editable while preserving drafts, images, local fallback, and clear user feedback."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Route local and remote Alt+q through a one-in-flight server recall state machine and coalesce repeated key presses."
      - "Show an immediate pending notice, then distinct success, partial, unavailable, rejected, timeout, and failure notices."
      - "Apply only current authoritative recalled messages, preserving draft text first, newline-delimited recalled text order, and draft-then-recalled image order."
      - "On a confirmed empty unavailable result only, invoke the unchanged local queued-message recall helper."
      - "Leave composer and local queue state byte-for-byte unchanged on request failure, timeout, disconnect, stale result, or malformed response."
  - phase: 5
    name: "Acceptance, compatibility, and runtime proof"
    goal: "Demonstrate the complete workflow at protocol, server, TUI, performance, and running-binary boundaries."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Run exact protocol serialization, persistence, queue partition, client lifecycle, server action, and TUI event/application tests."
      - "Run regression tests for CancelSoftInterrupts and every established local Alt+q queue-edit scenario."
      - "Measure normal local request-to-indication latency and verify at least 95% complete within 500 ms."
