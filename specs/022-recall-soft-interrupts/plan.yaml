  created: "2026-09-01"
  spec_path: "specs/022-recall-soft-interrupts/spec.yaml"

summary: |
  Add a small ownership-aware recall operation for exactly one newest server-queued user soft interrupt. A queued user message carries a stable identity and the verified subscribing client_instance_id. Lowercase Alt+q with an empty composer and no recall already pending sends an additive request with a stable operation ID. The server atomically selects only the newest eligible message for that owner, preserves every unrelated queue entry and its order, and returns the exact text and images only to the requester. The TUI applies only the matching authoritative result. A bounded per-session replay record lets the same operation reconcile response loss without removing or applying the message twice. Existing local Alt+q cycling and CancelSoftInterrupts remain separate and unchanged.

technical_context:
  language: "Rust 2024 edition"
  framework: "Tokio server and Ratatui/Crossterm TUI"
  primary_dependencies:
    - name: "serde"
      version: "1"
      purpose: "Add backward-compatible wire and persistence fields."
    - name: "tokio"
      version: "1"
      purpose: "Use existing server and transport synchronization."
  storage: "Existing soft-interrupt persistence gains defaulted optional identity and owner metadata; legacy entries remain unowned. Completed replay results use a small bounded session-scoped cache."
  testing:
    framework: "Rust unit and async tests plus isolated-socket runtime validation"
    approach: "TDD with new small focused test files for protocol, queue selection, ownership, ordering, images, one-in-flight behavior, failure immutability, replay, local fallback, and cancellation compatibility."
  target_platform: "Supported Jcode TUI platforms"
  project_type: "cli"
  performance_goals: "One mutex scan over the usually small pending queue and immediate status feedback."
  constraints:
    - "Alt+q is active only when composer text and images are empty."
    - "Recall at most one newest owned User message per operation."
    - "Never call CancelSoftInterrupts from recall."
    - "Never mutate composer state before a matching authoritative result."
    - "Preserve all unrelated entries and relative order."
    - "Keep protocol and persistence changes additive."
    - "Avoid growing already oversized TUI source and test files where a small module can own the behavior."
    - "Serialize Rust validation commands."
  scale_scope: "One ordered queue per session, one in-flight recall per TUI, and a small bounded replay cache."

