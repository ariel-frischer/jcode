feature:
  branch: "agent/jcode-c9u-alt-q-soft-queue"
  created: "2026-09-01"
  status: "Draft"
  input: "Make lowercase Alt+q recall this TUI client's newest server-queued user soft interrupt into an empty composer without disturbing unrelated queued work."

user_stories:
  - id: "US-001"
    title: "Recall the newest queued message"
    priority: "P1"
    as_a: "TUI user who queued messages during an active turn"
    i_want: "Alt+q to return the newest still-queued message to the empty composer"
    so_that: "I can edit or remove it"
    why_this_priority: "This is the reported broken behavior."
    independent_test: "Queue two owned soft interrupts, press Alt+q twice after each result, and observe newest-first one-message recall."
    acceptance_scenarios:
      - given: "the composer is empty and this client owns multiple queued user soft interrupts"
        when: "Alt+q is pressed"
        then: "only the newest still-queued owned message is authoritatively removed and restored with its images"
      - given: "one message was recalled and the composer is empty again"
        when: "Alt+q is pressed again"
        then: "the next newest eligible message is recalled"
      - given: "the composer contains text or images"
        when: "Alt+q is pressed"
        then: "the composer and every queue remain unchanged"

  - id: "US-002"
    title: "Preserve unrelated queued work"
    priority: "P1"
    as_a: "user sharing a session with other clients and background activity"
    i_want: "recall to affect only my eligible user message"
    so_that: "other clients and system work are never lost"
    why_this_priority: "A session-wide cancellation would be destructive."
    independent_test: "Recall from a mixed queue and compare all non-selected entries and their order."
    acceptance_scenarios:
      - given: "owned messages are interleaved with another client's, system, background, or unowned messages"
        when: "this client requests recall"
        then: "only its newest User-source message is removed and every other entry keeps its relative order"
      - given: "ownership cannot be verified"
        when: "recall is requested"
        then: "the request fails closed without queue or composer mutation"

  - id: "US-003"
    title: "Apply only authoritative results"
    priority: "P1"
    as_a: "TUI user recalling input while processing continues"
    i_want: "the composer to change only after the server confirms the exact message"
    so_that: "races and disconnects cannot duplicate or silently lose input"
    why_this_priority: "The queue is shared and concurrently consumed."
    independent_test: "Race recall with consumption, duplicate key presses, duplicate results, and reconnect retry."
    acceptance_scenarios:
      - given: "a recall request is in flight"
        when: "Alt+q is pressed again"
        then: "no second request is sent and no local state is consumed"
      - given: "the request fails, disconnects, or has no authoritative result"
        when: "the TUI handles the outcome"
        then: "the composer and local queue remain unchanged"
      - given: "the server result is replayed after response loss"
        when: "the same operation is retried"
        then: "the same result is returned and applied at most once"

  - id: "US-004"
    title: "Preserve existing queue controls"
    priority: "P2"
    as_a: "user of local queue recall and explicit cancellation"
    i_want: "the new server recall to coexist with established behavior"
    so_that: "the fix does not regress prior workflows"
    why_this_priority: "Compatibility is required for landing."
    independent_test: "Run existing local Alt+q cycling and CancelSoftInterrupts regression tests."
    acceptance_scenarios:
      - given: "a local queued message is available"
        when: "Alt+q uses the existing local path"
        then: "newest-first cycling and original-slot restoration remain unchanged"
      - given: "CancelSoftInterrupts is invoked"
        when: "the server handles it"
        then: "its existing clear-all cancellation semantics remain unchanged"

requirements:
  functional:
    - id: "FR-001"
      description: "Alt+q MUST act only when the composer has no text or images."
      acceptance_criteria: "Nonempty composer tests show no request and no mutation."
    - id: "FR-002"
      description: "Each Alt+q operation MUST recall at most one message, selecting the newest available User-source message owned by the invoking stable client identity."
      acceptance_criteria: "Two repeated successful operations return newest then next-newest."
    - id: "FR-003"
      description: "The server MUST verify ownership and source and preserve all non-selected entries in relative order."
      acceptance_criteria: "Mixed-client and mixed-source queue tests preserve unrelated entries byte-equivalently."
    - id: "FR-004"
      description: "A successful result MUST preserve exact text and ordered image attachments."
      acceptance_criteria: "Text, image-only, and multimodal fixtures round trip exactly."
    - id: "FR-005"
      description: "The TUI MUST mutate the composer only after receiving the matching authoritative result."
      acceptance_criteria: "Pending, failed, stale, malformed, and disconnected cases leave the composer unchanged."
    - id: "FR-006"
      description: "Only one server recall operation MAY be in flight per TUI client."
      acceptance_criteria: "Repeated Alt+q while pending emits one request."
    - id: "FR-007"
      description: "A retried operation MUST not remove or apply a message twice."
      acceptance_criteria: "Response-loss and duplicate-result tests observe one queue mutation and one composer application."
    - id: "FR-008"
      description: "Legacy or unverifiably owned messages MUST remain non-recallable."
      acceptance_criteria: "Legacy persistence fixtures load and fail closed."
    - id: "FR-009"
      description: "Existing local Alt+q cycling and CancelSoftInterrupts behavior MUST remain unchanged."
      acceptance_criteria: "Established regression tests retain their expectations."
  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Ownership validation fails closed and recalled payloads are returned only to the requester."
      measurable_target: "All mixed-owner and requester-routing tests pass."
    - id: "NFR-002"
      category: "reliability"
      description: "Bounded deterministic race tests show no duplication, unrelated-message loss, or unconfirmed composer mutation."
      measurable_target: "All focused race scenarios pass repeatedly in the affected test suites."
    - id: "NFR-003"
      category: "code_quality"
      description: "The implementation remains additive, focused, and covered at protocol, server, TUI, and runtime boundaries."
      measurable_target: "Focused tests, format, relevant checks, guardrails, and one isolated built-binary workflow pass or disclose verified baseline failures."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Lowercase Alt+q returns the newest owned server-queued message to an empty composer one at a time."
      metric: "Focused TUI and isolated runtime scenarios"
      target: "100% pass"
    - id: "SC-002"
      description: "Other clients and system/background messages are never removed by recall."
      metric: "Mixed-queue preservation assertions"
      target: "Zero unrelated mutations"
    - id: "SC-003"
      description: "Disconnect, retry, and duplicate delivery do not silently lose or duplicate recalled input."
      metric: "Deterministic reconciliation scenarios"
      target: "Exactly one authoritative outcome per operation"

key_entities:
  - name: "Queued interrupt"
    description: "A pending server message with payload, source, optional owner, and stable identity."
    attributes: ["identity", "owner", "source", "text", "images", "queue position"]
  - name: "Recall operation"
    description: "One idempotent request for the newest eligible message."
    attributes: ["operation identity", "request identity", "authoritative result"]
  - name: "Composer"
    description: "Editable TUI text and image state."
    attributes: ["text", "images", "pending recall"]

edge_cases:
  - scenario: "The composer has text or images."
    expected_behavior: "Alt+q does nothing."
  - scenario: "No owned eligible server message exists."
    expected_behavior: "No server state changes; existing local recall remains available."
  - scenario: "The newest owned message is consumed before the recall decision."
    expected_behavior: "The server returns unavailable or the next authoritative eligible outcome without restoring consumed content."
  - scenario: "Another client or a system/background producer is interleaved in the queue."
    expected_behavior: "Every unrelated entry remains in relative order."
  - scenario: "The connection drops after server mutation but before result delivery."
    expected_behavior: "Retrying the same operation reconciles the authoritative result without a second removal."
  - scenario: "Alt+q or the result is repeated."
    expected_behavior: "At most one request is in flight and at most one composer application occurs."

assumptions:
  - "The existing stable client_instance_id is authoritative for the lifetime in which recall is supported."
  - "The current composer can preserve recalled image vectors even though text and images are stored separately."
  - "Local queued-message editing retains its existing original-slot semantics."

constraints:
  - "Do not use CancelSoftInterrupts to implement recall."
  - "Do not combine recalled content with a nonempty draft."
  - "Do not introduce a parallel queue, a Go SDK copy, or unrelated composer redesign."
  - "Use bounded focused tests suitable for this repository and machine."

out_of_scope:
  - "Recalling another client's messages."
  - "Recalling already consumed conversation content."
  - "A general conversation undo feature."
  - "Changing system/background interrupt semantics."

