feature:
  branch: "022-recall-soft-interrupts"
  created: "2026-09-01"
  status: "Draft"
  input: "Make Alt+q selectively and safely take back this TUI client’s server-queued soft-interrupt messages into the editable composer. Require client ownership, authoritative server confirmation, preservation of other clients and system/background interrupts, ordering and images, race-safe failure handling, compatibility with existing CancelSoftInterrupts and local queue recall, and focused protocol/server/TUI/runtime validation."

user_stories:
  - id: "US-001"
    title: "Recall my queued soft interrupts"
    priority: "P1"
    as_a: "TUI user with an active editable composer"
    i_want: "Alt+q to take back soft-interrupt messages queued on the server by this TUI client"
    so_that: "I can revise or resend messages that have not yet been consumed"
    why_this_priority: "This is the primary user-visible capability and must not risk recalling messages that the user does not own."
    independent_test: "Queue multiple owned soft-interrupt messages, invoke Alt+q, and verify that authoritative confirmation precedes their restoration to the composer."
    acceptance_scenarios:
      - given: "this TUI client owns one or more server-queued soft-interrupt messages that remain available for recall"
        when: "the user presses Alt+q"
        then: "the available owned messages are removed from the server queue only after authoritative confirmation and restored to the editable composer"
      - given: "the owned messages include text and images"
        when: "the recall succeeds"
        then: "the composer contains the same text and images in their original message order"
      - given: "no server-queued messages owned by this client are available"
        when: "the user presses Alt+q"
        then: "the system falls back to the existing local queue recall behavior without changing unrelated server state"

  - id: "US-002"
    title: "Preserve unrelated interrupts"
    priority: "P1"
    as_a: "user sharing a server session with other clients and background activity"
    i_want: "recall to select messages solely by verified client ownership and eligible soft-interrupt type"
    so_that: "other clients and system or background work remain undisturbed"
    why_this_priority: "Incorrect selection could silently remove another actor's input or operational control messages."
    independent_test: "Populate the queue with interleaved owned, other-client, system, and background interrupts, then verify that only eligible owned messages are recalled."
    acceptance_scenarios:
      - given: "the server queue interleaves this client's soft interrupts with another client's soft interrupts"
        when: "this client requests recall"
        then: "only this client's eligible messages are returned and the other client's messages retain their relative order"
      - given: "the server queue contains system or background interrupts"
        when: "this client requests recall"
        then: "those interrupts remain queued and unchanged regardless of their position"
      - given: "a message lacks verifiable ownership by this client"
        when: "recall selection is evaluated"
        then: "the message is not recalled"

  - id: "US-003"
    title: "Handle recall races safely"
    priority: "P1"
    as_a: "TUI user recalling queued input during active processing"
    i_want: "the composer to change only according to the server's authoritative recall result"
    so_that: "concurrent consumption, cancellation, or reconnect events cannot duplicate or lose my input"
    why_this_priority: "Recall races occur at the boundary between editable input and active processing and require an unambiguous outcome."
    independent_test: "Race recall against message consumption, cancellation, and connection loss, then verify that only server-confirmed messages enter the composer and failures leave existing composer content intact."
    acceptance_scenarios:
      - given: "an eligible message is consumed before the server confirms recall"
        when: "the recall result is returned"
        then: "the consumed message is not inserted into the composer or reported as recalled"
      - given: "the recall request fails or its outcome cannot be authoritatively confirmed"
        when: "the TUI handles the failure"
        then: "the existing composer and local recall queue remain unchanged and no unconfirmed message is inserted"
      - given: "some requested messages remain recallable while others have already changed state"
        when: "the server confirms a partial result"
        then: "only the confirmed recalled messages are restored, with a clear indication that the recall was partial"

  - id: "US-004"
    title: "Retain established cancellation and local recall behavior"
    priority: "P2"
    as_a: "user relying on existing interruption controls"
    i_want: "server-queue recall to coexist with cancellation and local queue recall"
    so_that: "Alt+q gains the new capability without regressing established workflows"
    why_this_priority: "Compatibility is required for safe adoption but follows the core ownership and race-safety guarantees."
    independent_test: "Exercise existing soft-interrupt cancellation and local recall scenarios before and after server-owned recall scenarios and compare observable outcomes."
    acceptance_scenarios:
      - given: "soft interrupts have been canceled through the existing cancellation action"
        when: "Alt+q is subsequently invoked"
        then: "the canceled messages are not incorrectly restored as server-confirmed recalls"
      - given: "the local queue contains recallable content and the server has no confirmed owned messages"
        when: "Alt+q is invoked"
        then: "the prior local queue recall behavior remains available"
      - given: "the server confirms owned recalled messages while the composer already contains a draft"
        when: "the TUI applies the result"
        then: "the recalled content and existing draft are combined deterministically without dropping text or images"

requirements:
  functional:
    - id: "FR-001"
      description: "The product MUST allow Alt+q in the TUI to request recall of eligible soft-interrupt messages queued on the server for the invoking client."
      acceptance_criteria: "With eligible owned messages queued, one Alt+q action initiates recall and ultimately makes server-confirmed recalled content editable."
    - id: "FR-002"
      description: "The product MUST require verifiable ownership by the invoking client before any queued message can be recalled."
      acceptance_criteria: "Messages owned by another client or lacking verified ownership are never included in the recall result."
    - id: "FR-003"
      description: "The product MUST limit server recall to user-originated soft-interrupt messages and MUST exclude system, background, and other non-eligible interrupts."
      acceptance_criteria: "A mixed queue test recalls only eligible user-originated soft interrupts owned by the requester."
    - id: "FR-004"
      description: "The product MUST treat the server's confirmed result as authoritative for which messages were removed and may be restored to the composer."
      acceptance_criteria: "The composer receives exactly the messages confirmed as recalled, no more and no fewer."
    - id: "FR-005"
      description: "The product MUST preserve all non-recalled queued messages and their relative ordering."
      acceptance_criteria: "After recall from an interleaved queue, every unrelated message remains present in the same relative order."
    - id: "FR-006"
      description: "The product MUST preserve the relative ordering of recalled messages when restoring them to editable content."
      acceptance_criteria: "Multiple confirmed messages appear in the composer in the same order in which they were queued."
    - id: "FR-007"
      description: "The product MUST preserve recalled text and image attachments without omission, substitution, duplication, or reordering."
      acceptance_criteria: "A recall containing multiple text segments and images restores an exact content-equivalent editable sequence."
    - id: "FR-008"
      description: "The product MUST leave existing composer content intact when recall fails, is rejected, times out, or lacks authoritative confirmation."
      acceptance_criteria: "Each failure mode produces no unconfirmed composer mutation and preserves the pre-request draft."
    - id: "FR-009"
      description: "The product MUST prevent a message consumed or otherwise made unavailable during a recall race from also being restored to the composer."
      acceptance_criteria: "In a forced race, each message has one observable outcome: consumed, still queued, or confirmed recalled, never more than one."
    - id: "FR-010"
      description: "The product MUST support authoritative partial recall when only a subset of eligible messages remains available."
      acceptance_criteria: "Only the confirmed subset enters the composer, unavailable messages do not, and the user receives a clear partial-result indication."
    - id: "FR-011"
      description: "The product MUST combine confirmed recalled content with an existing draft according to one deterministic, documented ordering rule."
      acceptance_criteria: "Repeating the same recall with the same draft and recalled messages produces the same complete composer ordering every time."
    - id: "FR-012"
      description: "The product MUST preserve the established behavior of CancelSoftInterrupts for cancellation use cases."
      acceptance_criteria: "Existing cancellation scenarios produce the same externally observable queue and user outcomes when no recall is requested."
    - id: "FR-013"
      description: "The product MUST preserve existing local queue recall behavior when no server-confirmed owned messages are returned."
      acceptance_criteria: "Existing local-only Alt+q recall scenarios continue to restore the same content in the same order."
    - id: "FR-014"
      description: "The product MUST provide a clear, non-destructive user indication when recall is unavailable, rejected, partial, or fails."
      acceptance_criteria: "Each non-success outcome is distinguishable to the user and does not claim that unconfirmed content was recalled."
    - id: "FR-015"
      description: "The product MUST maintain correct recall behavior across supported connection, reconnect, and active-processing states."
      acceptance_criteria: "Focused end-to-end scenarios in each supported state satisfy ownership, preservation, ordering, and no-duplication requirements."
  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Recall authorization must fail closed when client ownership cannot be verified."
      measurable_target: "100% of messages with missing, mismatched, or unverifiable ownership remain unrecalled in the ownership test matrix."
    - id: "NFR-002"
      category: "reliability"
      description: "Recall must not cause message loss or duplication under concurrent queue activity."
      measurable_target: "10,000 race-focused test iterations complete with zero duplicated messages, zero lost unrelated messages, and zero unconfirmed composer insertions."
    - id: "NFR-003"
      category: "performance"
      description: "Recall feedback should feel immediate during normal interactive use."
      measurable_target: "At least 95% of recall attempts provide a confirmed outcome or clear pending/failure indication within 500 milliseconds under normal local operating conditions."
    - id: "NFR-004"
      category: "usability"
      description: "Users must be able to distinguish successful, partial, unavailable, and failed recall outcomes."
      measurable_target: "In usability verification, at least 9 of 10 participants correctly identify each outcome without inspecting logs or internal state."
    - id: "NFR-005"
      category: "code_quality"
      description: "The feature must have focused coverage across the message contract, authoritative queue behavior, TUI interaction, and running end-to-end workflow."
      measurable_target: "All ownership, mixed-queue, image, ordering, cancellation compatibility, local fallback, and race scenarios have automated checks at the relevant boundaries and one passing runtime workflow."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can recover all still-available soft-interrupt messages owned by their current TUI client into editable content with one Alt+q action."
      metric: "Successful recovery rate across eligible-message scenarios"
      target: "100% of server-confirmed eligible messages are restored exactly once."
    - id: "SC-002"
      description: "Recall never changes messages belonging to other clients or to system and background activity."
      metric: "Unrelated-message preservation rate across mixed-queue scenarios"
      target: "100% of unrelated messages remain unchanged and in relative order."
    - id: "SC-003"
      description: "Recalled text and images retain their content and ordering."
      metric: "Content-equivalence checks for recalled multimodal message sequences"
      target: "100% content and order equivalence with no missing or duplicated item."
    - id: "SC-004"
      description: "Concurrent processing does not create ambiguous or destructive recall outcomes."
      metric: "Message loss, duplication, and unconfirmed restoration incidents during race testing"
      target: "Zero incidents across 10,000 forced race iterations."
    - id: "SC-005"
      description: "Existing cancellation and local recall workflows remain usable after the feature is introduced."
      metric: "Regression pass rate for established CancelSoftInterrupts and local recall scenarios"
      target: "100% of established scenarios pass with unchanged expected outcomes."
    - id: "SC-006"
      description: "Users receive timely and understandable recall outcomes."
      metric: "Outcome indication latency and user interpretation accuracy"
      target: "95% indicated within 500 milliseconds and at least 90% correctly interpreted."

key_entities:
  - name: "Queued interrupt message"
    description: "A pending message that may represent user input, system control, or background activity."
    attributes:
      - "stable identity"
      - "origin category"
      - "interrupt type"
      - "queue position"
      - "current availability state"
  - name: "Client ownership"
    description: "The authoritative association between a queued user message and the TUI client permitted to recall it."
    attributes:
      - "client identity"
      - "verification status"
      - "message association"
  - name: "Recall result"
    description: "The authoritative outcome identifying which requested messages were actually removed for editing."
    attributes:
      - "outcome status"
      - "confirmed recalled messages"
      - "unavailable or rejected messages"
      - "ordering"
  - name: "Editable composer content"
    description: "The user's current draft plus any server-confirmed or locally recalled text and images."
    attributes:
      - "text content"
      - "image attachments"
      - "item ordering"
      - "preexisting draft boundary"

edge_cases:
  - scenario: "Alt+q is pressed when neither the server nor the local queue has recallable content."
    expected_behavior: "No queue or composer content changes, and the user receives a non-destructive unavailable indication."
  - scenario: "Owned messages are interleaved with messages from multiple other clients."
    expected_behavior: "Only confirmed owned messages are removed; all others retain their relative order."
  - scenario: "Owned soft interrupts are interleaved with system and background interrupts."
    expected_behavior: "System and background interrupts remain untouched regardless of position."
  - scenario: "One of several owned messages is consumed while recall is in progress."
    expected_behavior: "The consumed message is excluded, while any server-confirmed subset is restored in order and reported as partial."
  - scenario: "The connection drops after the request but before confirmation reaches the TUI."
    expected_behavior: "The TUI does not insert unconfirmed content; later reconciliation avoids both duplication and silent loss."
  - scenario: "A recalled message contains only images or a mixture of text and multiple images."
    expected_behavior: "All items are restored exactly once in their original sequence and remain editable where supported."
  - scenario: "The composer already contains text and images when recall succeeds."
    expected_behavior: "Existing and recalled content are combined by the deterministic ordering rule without overwriting either."
  - scenario: "Alt+q is pressed repeatedly before the first recall completes."
    expected_behavior: "Repeated input does not duplicate recalls, corrupt the draft, or produce contradictory outcomes."
  - scenario: "Cancellation and recall requests overlap."
    expected_behavior: "Each message receives one authoritative final state, and only messages confirmed as recalled enter the composer."
  - scenario: "Ownership metadata is absent, stale, or mismatched after reconnect."
    expected_behavior: "Recall fails closed for affected messages and leaves them unchanged."

assumptions:
  - "A TUI client has a stable identity that the server can authoritatively associate with user-originated queued messages for the lifetime in which recall is allowed."
  - "Only messages that remain queued and unconsumed at the authoritative decision point are eligible for recall."
  - "Alt+q continues to serve its established local queue recall role, with server-owned recall attempted without removing the local fallback."
  - "When a draft already exists, confirmed recalled content is added using a single product-defined ordering rule rather than replacing the draft."
  - "A partial authoritative result is preferable to treating the entire recall as failed when some owned messages remain safely recallable."
  - "Images referenced by recallable messages remain available long enough to be restored into the composer."

constraints:
  - "Recall must not depend on client-side assumptions about current server queue contents."
  - "The feature must coexist with existing CancelSoftInterrupts behavior and local queue recall."
  - "The feature must preserve other clients' inputs and all system or background interrupts."
  - "Validation must cover the message contract, authoritative server behavior, TUI interaction, and an isolated running workflow."

out_of_scope:
  - "Recalling messages owned by another client, even when both clients belong to the same user."
  - "Recalling messages that have already begun or completed processing."
  - "Changing the semantics of system or background interrupts."
  - "Using Alt+q as a general undo mechanism for completed conversation turns."
  - "Redesigning unrelated composer editing or attachment workflows."

