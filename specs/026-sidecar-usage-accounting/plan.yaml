research_findings:
  decisions:
    - topic: "Native capture and usage normalization"
      decision: "Capture per-attempt usage alongside text internally, while preserving complete() -> Result<String> compatibility. Keep optional field-level usage and terminal status independent of text parsing success."
      rationale: "sidecar.rs:464-520 returns only text; :947-1023 drops response.completed/incomplete payloads and errors before retaining usage. ClaudeMessagesResponse also discards _usage. Reuse StreamEvent::TokenUsage field semantics in jcode-message-types/src/lib.rs; do not import app-core TokenUsage into base."
      alternatives_considered:
        - "Estimate from prompt length or default max_tokens: rejected because neither is native usage."
        - "Count operation completions only: rejected because votes/retries/fallbacks are distinct requests."
    - topic: "Attribution and exactly-once aggregation"
      decision: "Pass immutable optional session context plus operation kind/id into Sidecar, clone it into spawned operations, allocate a fresh local attempt ID at each actual send boundary, and finalize once on success/error/cancellation."
      rationale: "memory_agent.rs:171 owns final extraction session; :773 reranking; :1033 detached extraction; :1124 contradiction; :1421 cluster naming currently loses caller context. Thread context from the real caller, never current-session globals. One operation may have several vote/request IDs."
      alternatives_considered:
        - "Task-local ambient identity: rejected because explicit spawned work may not inherit it."
        - "Provider response ID as sole identity: rejected because errors may omit it and it is external data."
    - topic: "Bounded local recorder without a reverse dependency"
      decision: "Add a small domain-owned recorder in base for typed sidecar records in one globally bounded usage journal, with optional session ownership in each record. Reuse existing observability effective status, private-file helpers and diagnostic rotation/age policies. Reuse only the necessary lower-level file helpers, not a new general recorder framework."
      rationale: "LifecycleRecorder lives in app-core (:45-155), above base, and its envelope requires a session. Sidecar also serves ownerless callers. A base-owned bounded sink avoids a dependency cycle and fictitious session identities; shared storage policies remain canonical. Existing lifecycle.rs:47 opens files without explicit private mode, so privacy must be verified rather than assumed."
      alternatives_considered:
        - "Import app-core LifecycleRecorder into base: rejected dependency cycle."
        - "Put ownerless calls into a synthetic session or telemetry upload path: rejected attribution/privacy violation."
    - topic: "Pricing without fabricated bills or network refresh"
      decision: "Use exact resolved-model public API rates via existing provider-core pricing. If cached catalog rates are needed, add a narrow cache-only accessor to existing model_pricing, never call its refresh-triggering lookup from accounting. Persist pricing basis/rate snapshot or explicit unknown."
      rationale: "provider-core/pricing.rs:156-220 returns None for unknown models (including current Luna); :223-237 OAuth pricing is a subscription heuristic, unsuitable for token cost. model_pricing.rs:155-180 lookup schedules a network refresh when stale. Neither is authority to invent Luna rates or actual charges."
      alternatives_considered:
        - "Divide subscription price by requests or map Luna to another model: rejected."
        - "Fetch rates on each report: rejected local-only/no-new-network scope."
    - topic: "Minimal user interface"
      decision: "Add jcode memory usage with optional --session <id>, --calls, and --json. Default shows bounded retained summaries grouped by authentic session plus an explicit unattributed group. Per-call output carries operation/request identities, optional usage, outcome and estimate basis."
      rationale: "src/cli/args.rs:1164 owns MemoryCommand and src/cli/commands.rs:1610 owns dispatch. Match existing session lifecycle JSON/text conventions without new TUI or SDK contracts. All queries are local and expose effective controls/coverage."
      alternatives_considered:
        - "TUI-only visibility or raw logs: rejected discoverability/machine-readability requirement."
data_model:
  entities:
    - name: "MemoryCallUsage"
      description: "Versioned content-free observation for one actual transport attempt"
      fields:
        - name: "session_id, operation_id, operation_kind, request_id"
          type: "Option<bounded identifier>, bounded identifier, closed enum, unique local identifier"
          description: "True ownership and deduplication identity; request ID is not a provider secret or account ID"
          constraints: "Validate IDs at trust boundary; None means genuinely ownerless, not unknown last-active session"
        - name: "provider, resolved_model, resolved_effort, auth_class, outcome"
          type: "bounded metadata and closed enums/options"
          description: "Actual attempted route and sanitized success/incomplete/error/cancelled status"
          constraints: "No arbitrary raw provider errors, URLs, prompts, memory text or credentials"
        - name: "input_tokens, cached_input_tokens, output_tokens, reasoning_tokens"
          type: "Option<u64> fields plus usage validity/completeness"
          description: "Provider-native counts normalized to total input including cache and output including reasoning"
          constraints: "Absent is null, not zero; cached <= input and reasoning <= output when known; preserve unknown subcounts"
        - name: "estimate, pricing_basis, coverage"
          type: "Optional existing fixed-unit cost/rates, provenance enum, completeness flags"
          description: "Known API-equivalent estimate or explicit unknown and retained observation coverage"
          constraints: "Output charged once; cached discount only when known; no charge inferred from missing usage or subscription plan"
    - name: "MemoryUsageSummary"
      description: "Deterministic aggregation of unique retained request records"
      fields:
        - name: "request_counts, known_subtotals, unknown_counts, status, warnings"
          type: "bounded summary values and enum warnings"
          description: "Separate complete totals from partial known subtotals, with local controls and retained-window coverage"
          constraints: "Deduplicate request_id; never claim full-session lifetime totals after drops/rotation/restart gaps; deterministic ordering"
