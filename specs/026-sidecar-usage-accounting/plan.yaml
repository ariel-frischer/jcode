    risk: "Medium overall: incorrect attribution or unknown counts could produce misleading usage/cost summaries"
    likelihood: "medium"
    impact: "medium"
    mitigation: "Explicit context, distinct attempt IDs, optional native fields and exact cross-session/duplicate fixtures. Inline root review is the approved action; rollback removes additive accounting without touching memories/config."
  - id: "RISK-002"
    risk: "Metrics could leak provider error content or slow asynchronous memory work"
    likelihood: "medium"
    impact: "high"
    mitigation: "Closed error enums, allowlisted bounded identifiers, private files, existing controls, nonblocking fixed queue and saturation/privacy tests. Blast radius is local diagnostics only; no uploads or inference changes."
