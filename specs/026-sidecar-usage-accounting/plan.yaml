plan:
  branch: "agent/jcode-cyko"
  created: "2026-09-05"
  spec_path: "specs/026-sidecar-usage-accounting/spec.yaml"
summary: |
  Add local memory-request accounting at the actual native send/response boundary,
  preserving the existing text completion API and request behavior. Carry explicit
  session and operation context through memory work, votes and detached extraction.
  Normalize provider-reported optional usage once per physical attempt and aggregate
  retained observations, never treating reasoning as additional output or unknowns
  as zero. Use existing public API pricing contracts, not subscription cheapness,
  and label OAuth costs as API-equivalent estimates, never actual bills.

  Keep the accounting runtime in jcode-base and its stable metadata in existing
  dependency-light types. Reuse lifecycle diagnostics controls, bounded JSONL storage
  policy and private-file utilities through a narrow accounting adapter, without
  moving app orchestration down or creating a general telemetry framework. Add
  jcode memory usage text/JSON reporting. This is a proposed implementation plan
  for jcode-cyko, not implementation evidence. Only spec and plan are produced now.
technical_context:
  language: "Rust, edition 2024, current stable toolchain"
  framework: "Tokio async runtime and existing Clap CLI"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "Existing bounded nonblocking channel and background worker"
    - name: "reqwest"
      version: "0.12"
      purpose: "Existing native JSON/SSE transport, unchanged request payloads"
    - name: "serde / serde_json"
      version: "1 / 1"
      purpose: "Optional typed usage, private JSONL and deterministic CLI JSON"
    - name: "jcode-provider-core / jcode-message-types / jcode-session-types"
      version: "workspace path dependencies"
      purpose: "Reuse pricing, stream usage semantics and stable local diagnostic contracts"
  storage: "Bounded private local diagnostic JSONL under the existing Jcode data root; no database, uploads or pricing refresh"
  testing:
    framework: "Rust unit/integration tests, Tokio tests and built CLI fixture tests"
    approach: "Direct parser and payload regressions, memory-operation reconciliation, privacy/control/fault fixtures, then serial build and guardrails; no live inference"
  target_platform: "Existing Jcode platforms; Linux built-binary evidence in the assigned worktree, portable path handling and platform-specific private-file checks"
  project_type: "cli"
  performance_goals: "Zero added inference; fixed-capacity submission and retained state; before/after normal and saturated submission timing against maintained budgets (NFR-001, AC-7)"
  constraints:
    - "Preserve Luna xhigh, votes2, cadence3, routing, fallback, payload and output-cap behavior. Native OpenAI currently omits max_output_tokens; do not infer a 1024 cap."
    - "No persistent configuration edits, paid/live inference, provider/runtime activation or memory cleanup."
    - "No prompts, memory text, raw provider errors, credentials or account identifiers in metrics or logs."
    - "Reuse effective lifecycle enabled/persist_session_events/emit_structured_logs controls independently, including failure diagnostics."
    - "Root alone owns Beads, tasks/implementation execution, review, worktrees, integration, push, install, report, cleanup and closure. No delegation or analyze."
    - "No new crate or external dependency, SDK endpoint, TUI panel or shared-server change is required."
  scale_scope: "Concurrent sessions and all memory inference operations; summaries cover only bounded retained observations, not a lifetime billing ledger"
