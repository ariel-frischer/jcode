research_findings:
  decisions:
    - topic: "Native collection and failure boundaries"
      decision: "Keep per-attempt optional usage beside text/error collection and finalize the observation exactly once at each real send, including cancellation and fallback."
      rationale: |
        sidecar.rs complete_openai_with_model owns sends; collect_openai_sse_text
        (947-992) currently returns at completed/incomplete without usage, while
        ClaudeMessagesResponse (1115-1135) explicitly discards usage. Attach a
        request-local accumulator/guard before send, not before credential or
        reasoning validation. Capture reported partial usage even if text fails.
        SSE duplicate/cumulative snapshots replace fields rather than sum them.
      alternatives_considered:
        - "Count high-level complete calls, which loses physical fallbacks/retries"
        - "Change existing completion return types globally, which expands compatibility risk"
    - topic: "True operation and session ownership"
      decision: "Pass a small explicit context through sidecar helpers and clones, assigning an operation ID at the memory operation and a fresh attempt ID per send."
      rationale: |
        memory_agent.rs run_final_extraction already receives session_id;
        extract_from_context (979-1037) clones it into spawned work. Preserve
        that identity through reranking votes, contradiction checks and cluster
        naming, never using memory/activity.rs global UI state for attribution.
        Enumerate additional Sidecar call sites before implementation. Ownerless
        work uses null session ownership, not a fabricated session.
      alternatives_considered:
        - "Last-active-session globals or task-local context lost across tokio::spawn"
        - "Treat one consensus result as one provider request"
    - topic: "Reuse usage semantics without expanding wire contracts"
      decision: "Use optional u64 fields consistent with StreamEvent::TokenUsage, with native reasoning detail in the accounting type; generic provider paths consume existing usage/retry events where exposed."
      rationale: |
        jcode-message-types/src/lib.rs (749-757) exposes optional input/output,
        cache read/write and reported cost, but no reasoning field. Native
        OpenAI input includes cache reads; normalize to total input and split
        cache components before pricing. Claude uncached input and cache
        read/creation are separate components. Reasoning remains within output.
        Validate negative/overflow/subset violations without inventing values.
        Do not count a provider completion as proof of hidden physical retries;
        unavailable attempt detail makes coverage explicitly incomplete.
      alternatives_considered:
        - "Add reasoning to all existing stream/SDK contracts unnecessarily"
        - "Default absent cache/reasoning/usage fields to zero"
    - topic: "Honest offline cost estimates"
      decision: "Use provider-core public API rate functions for the actual resolved model, with rate provenance and unknown component handling."
      rationale: |
        pricing.rs openai_api_pricing_with_tier (156-220) returns None for
        unpriced models including Luna. openai_oauth_pricing (223-237) instead
        returns monthly subscription cheapness and is unsuitable for per-call
        cost. Use integer rate arithmetic with checked wider intermediates and
        documented rounding; keep full estimate null when required usage/rates
        are absent and show any known component subtotal separately. Cache
        creation without a known rate also remains unknown. Never substitute
        an alias price, monthly fee, or routing reference_request_cost.
      alternatives_considered:
        - "Estimate Luna using another model's rates"
        - "Divide subscription price into tokens or report an actual bill"
    - topic: "Local storage reuse and layering"
      decision: "Add a sidecar accounting adapter in jcode-base using narrowly shared diagnostic file helpers/policy, with its own versioned record shape and bounded worker."
      rationale: |
        session/lifecycle.rs provides 1 MiB files, 30-day retention, rotation
        and malformed-record recovery. app-core/lifecycle_observability.rs
        provides a 256-entry try_send model and effective sink controls, but
        lives above base and assumes mandatory session envelopes. Reusing it
        directly would invert dependencies or fabricate ownerless sessions.
        Share only needed storage/path/validation primitives with a distinct
        accounting suffix. Do not copy a second general lifecycle system or
        modify lifecycle wire enums. Explicitly ensure private creation rather
        than assuming existing OpenOptions honors private mode. Bound queue,
        records, warnings, identifiers, session state and report scans. Report
        dropped records, retention and restart/persistence uncertainty; never
        claim completeness when a durable loss marker cannot be written.
      alternatives_considered:
        - "Append to public/network telemetry or memory graphs"
        - "Move the full app recorder down, alter wire events, or build an unbounded ledger"
    - topic: "Discoverable user surface"
      decision: "Add jcode memory usage with --session, --calls and --json; default to retained per-session summaries including an unattributed bucket."
      rationale: |
        src/cli/args.rs MemoryCommand, dispatch.rs map_memory_subcommand and
        commands.rs run_memory_command_for_dir are the existing command seams.
        Read local diagnostics only, no provider fetch, server restart or new
        protocol. A separate command handler avoids expanding the large existing
        command function. Validate session selectors through safe path utilities.
      alternatives_considered:
        - "Only log counters, which is not discoverable or machine-readable"
        - "New TUI panel or SDK endpoint beyond approved scope"
data_model:
  entities:
    - name: "MemoryCallContext"
      description: "Ephemeral explicit owner propagated through one logical operation"
      fields:
        - name: "session_id"
          type: "Option<String>"
          description: "Authentic originating session or explicit absence"
          constraints: "Validated bounded opaque identifier, never a path or inferred active session"
        - name: "operation_id / operation_kind"
          type: "opaque ID / closed enum"
          description: "Correlates votes and attempts to rerank, extraction, final extraction, contradiction or cluster naming"
          constraints: "No content-derived names; preserve through spawned work"
      relationships:
        - target: "MemoryRequestObservation"
          type: "one-to-many"
          description: "One logical operation may issue multiple physical attempts"
    - name: "MemoryRequestObservation"
      description: "Versioned privacy-safe observation finalized once per physical send"
      fields:
        - name: "schema_version / request_id / context / recorded_at"
          type: "u16 / opaque ID / MemoryCallContext / UTC timestamp"
          description: "Stable identity, attribution and retained-window ordering"
          constraints: "Unique send identity; duplicate observations do not add totals; bounded validated records"
        - name: "provider / model / effort / auth_class / outcome"
          type: "bounded identifiers and closed enums with optional effort"
          description: "Actual resolved metadata and success, incomplete, error or cancelled outcome"
          constraints: "No credentials, account identity, prompt, text or raw errors"
        - name: "input_tokens / cached_input_tokens / cache_creation_tokens / output_tokens / reasoning_tokens"
          type: "Option<u64> per field"
          description: "Normalized reported totals and subsets with field-level validity"
          constraints: "Absent is unknown; cache components do not inflate total input; reasoning <= output; checked arithmetic"
        - name: "estimate / known_cost_subtotal / pricing_basis / coverage"
          type: "optional fixed-precision USD / fixed-precision USD / typed provenance / typed status"
          description: "Full estimate only when all required components are known, alongside honest partial evidence"
          constraints: "OAuth label is API-equivalent estimate, not billed charges; no guessed model rates"
      relationships:
        - target: "SessionUsageSummary"
          type: "many-to-one"
          description: "Distinct retained observations aggregate by true session, with ownerless records separate"
    - name: "SessionUsageSummary"
      description: "Deterministic retained-window view, not lifetime or invoice totals"
      fields:
        - name: "session_id / calls / token_subtotals / cost_subtotal / unknown_counts"
          type: "optional identifier / u64 / typed totals / fixed-precision USD / per-field counts"
          description: "Reconcilable known values and separately visible unknown records"
          constraints: "Reasoning not added twice; mixed known/unknown never implies complete totals"
        - name: "window / control_status / coverage / warnings"
          type: "time bounds / effective lifecycle status / completeness enum / bounded safe categories"
          description: "Retention, disabled sinks, malformed data, queue loss and unavailable persistence"
          constraints: "Absence of history is not evidence of zero lifetime consumption"
api_contracts:
  endpoints: []
  cli:
    command: "jcode memory usage [--session <id>] [--calls] [--json]"
    request: "Local read only; optional validated session filter, optional per-call detail, JSON instead of text"
    response: "Versioned summary object with sessions, optional calls, effective controls, retained coverage and bounded warnings; sort sessions by ID and calls by timestamp/request ID"
    errors: "Invalid selector or unsupported command input returns actionable nonzero exit; recoverable malformed records yield partial output and safe warnings"
    compatibility: "Additive CLI only. JSON uses null for unknown values, explicit pricing basis and no billed-cost assertion. No HTTP/protocol endpoint."
