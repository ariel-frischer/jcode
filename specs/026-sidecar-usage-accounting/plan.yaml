plan:
  branch: "agent/jcode-cyko"
  created: "2026-09-05"
  spec_path: "specs/026-sidecar-usage-accounting/spec.yaml"
summary: |
  Draft target for approved Bead jcode-cyko, not implementation evidence. Add optional,
  content-free request observations at the existing sidecar transport boundary, carry
  explicit memory-operation/session context through spawned work, and aggregate a bounded
  local request journal for a discoverable memory usage CLI. Keep completion text/error
  compatibility, existing requests, all routing/defaults and user configuration unchanged.
  Reuse provider token semantics, canonical public API pricing and local diagnostics
  controls/storage policies. Do not introduce uploads, a general telemetry framework,
  subscription bill estimates or a new provider execution path. Three serial phases cover
  the entire frozen matrix; root alone owns AC-9 and decides when to run tasks/implementation.
technical_context:
  language: "Rust, existing workspace toolchain"
  framework: "Existing Tokio runtime and Clap CLI"
  primary_dependencies:
    - name: "tokio, serde, serde_json, reqwest"
      version: "Existing workspace-locked versions; no dependency additions planned"
      purpose: "Bounded asynchronous submission, typed local records and existing native transport"
    - name: "jcode-message-types, jcode-memory-types, jcode-provider-core"
      version: "Existing workspace crates"
      purpose: "Stable usage vocabulary, memory contract ownership and pricing reuse"
  storage: "Private bounded local diagnostic JSONL, sharing existing session diagnostic path validation/rotation policies, not memory graph or transcript content"
  testing:
    framework: "Existing Rust unit/integration fixtures and built CLI smoke tests"
    approach: "Synthetic responses and free local mocks only; direct parser, caller-attribution, recorder, aggregation, privacy and CLI checks before serial build/guardrails"
  target_platform: "Existing Jcode CLI/server platforms; private-file permission assertions on Unix with existing platform-safe storage handling elsewhere"
  project_type: "cli"
  performance_goals: "Zero added inference requests; bounded nonblocking submission and fixed retention; before/after measurements against maintained hot-path budgets"
  constraints:
    - "All artifacts/source only in assigned worktree. No Beads/delegation/worktree/provider/config/runtime mutation by this worker."
    - "Preserve Luna xhigh, votes2, cadence3, request payloads, fallback decisions and caps; no inferred native OpenAI 1024 cap."
    - "Keep base independent of app-core; stable type crates never depend on runtime storage or providers."
    - "No new SDK/wire endpoint or TUI panel. Root builds the TUI-bearing product binary for compatibility."
  scale_scope: "One record per actual memory request, bounded process queue and retained diagnostics across concurrent sessions; not an unbounded lifetime billing ledger"
