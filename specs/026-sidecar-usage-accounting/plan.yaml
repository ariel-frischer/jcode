implementation_phases:
  - phase: 1
    name: "Capture and attribute native request usage"
    goal: "FR-001/002/003/004/008; AC-1/2/3/6"
    deliverables:
      - "Inventory all actual memory call sites before edits; tests for rerank votes, incremental/final extraction, contradiction and cluster naming, plus discovered callers. Preserve ownerless compatibility."
      - "Typed optional usage, per-attempt identity/outcome and immutable context; parse native OpenAI SSE/JSON and Claude fallback usage. Keep existing generic provider execution and consume available native usage/attempt events without inventing hidden attempt detail."
      - "Focused fixture tests for chunk boundaries, malformed/partial/error/cancellation, duplicate snapshots, fallback requests, concurrent sessions and exact normalized totals. Exact unchanged request/default assertions."
  - phase: 2
    name: "Bounded local accounting and honest cost aggregation"
    goal: "FR-005/007/009; NFR-001/002/003; AC-3/5/7"
    dependencies:
      - "Phase 1"
    deliverables:
      - "Bounded try-send recorder, private append/read/rotation using existing diagnostic policies, existing control resolver and bounded failure diagnostics. No new inference, uploads or pricing refresh."
      - "No added unbounded per-session/dedup maps. Bound queue (reuse 256-entry local-recorder precedent), diagnostic warnings (32), and one global usage journal with existing 1 MiB file, three rotations and 30-day policy (at most four files, independent of session count). Queries scan only that bounded retained set and label retained-window coverage. Keep failure/drop counters fixed-size; when exact affected sessions are unavailable mark coverage conservatively rather than allocating unbounded tracking."
      - "Known-rate fixed-unit estimates and deterministic per-request/session aggregation; explicit nulls, known subtotals, unknown counts and API-equivalent-not-billed labels. Pricing snapshots do not reinterpret historic rates."
      - "Disabled-control, private-permission, sentinel, malformed-record/path, queue-pressure, persistence-failure, restart and retention tests; before/after hot-path timing and memory bounds documented against maintained budgets."
  - phase: 3
    name: "Expose CLI and prove offline end-to-end behavior"
    goal: "FR-006/010; all acceptance rows reconciled, AC-9 handed to root"
    dependencies:
      - "Phase 2"
    deliverables:
      - "memory usage --session/--calls/--json CLI help, argument validation, deterministic JSON/text and indexed user documentation."
      - "Newly built binary consumes private synthetic diagnostics; isolated local mock drives actual memory caller -> sidecar parser -> recorder -> persisted summary. No credentials, production sessions or paid inference. Confirm binary path/revision and private socket when daemon execution is involved."
      - "Serial focused Cargo checks, relevant TUI-bearing binary build, scripts/check_guardrails.sh and scripts/check_swarm_routing_contract.sh with nonzero matching tests. Record exact commands/results and every gap, without weakening the frozen matrix."
      - "Return root-owned handoff for current-base review, non-rewriting landing/push, scripts/install_release.sh --fast, graceful server reload, task-owned cleanup, private HTML report and Bead closure. Worker performs none of those effects."
