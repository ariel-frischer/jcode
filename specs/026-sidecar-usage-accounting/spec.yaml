feature:
  branch: "026-sidecar-usage-accounting"
  created: "2026-09-05"
  status: "Draft"
  input: "Implement approved jcode-cyko: memory-sidecar per-call and per-session native token usage and honest API-equivalent cost summaries. First read /home/ari/.jcode/scratch/jcode-cyko/bead.json and comments.json for explicit approval and FULL frozen acceptance matrix. All artifacts and source changes only in this assigned worktree. Root handles Beads, worktrees, review, integration, push, install and cleanup. You must not mutate Beads, delegate, create worktrees, merge, push, change persistent configuration or run paid/live inference. Prior cleanup jcode-5o54 is COMPLETE, do not rerun. Preserve Luna xhigh/votes2/cadence3/routing/output caps. Use existing usage/pricing/local diagnostics contracts, true session/operation/request attribution, no prompts/memory text/secrets in metrics, no uploads, bounded privacy-safe local observability honoring controls. Count actual requests including votes/retries once and reasoning as subset of output. Missing usage/pricing remain unknown and native OAuth API-equivalent estimates must not imply actual bills. Parse streamed/nonstreamed, partial/error fixtures, expose discoverable per-call/session CLI JSON and text, add direct regression and integration fixtures, bounded hot path evidence. Source starts crates/jcode-base/src/sidecar.rs. Do not infer 1024 cap. Constitution applies. Produce spec and plan only now, no analyze. Keep plan minimal and acceptance traceable. Root will run tasks and phase implementation after reviewing your artifacts. No configuration or runtime/provider changes."
user_stories:
  - id: "US-001"
    title: "Understand each memory request and its session totals"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "per-request native token counts attributed to the originating memory operation and session"
    so_that: "I can explain memory processing usage without confusing votes, retries, or concurrent sessions"
    independent_test: "Replay synthetic multi-session memory operations and reconcile every distinct request against the session summary."
    acceptance_scenarios:
      - given: "Two sessions issue extraction, reranking votes, contradiction checks, cluster naming, and final extraction"
        when: "Requests finish, retry, fail, or receive repeated terminal usage events"
        then: "Each actual request appears once under its true operation and session, including partial or unknown usage."
      - given: "An operation has no session owner"
        when: "Its usage is recorded"
        then: "It is explicitly unattributed and never assigned to the last active session."
  - id: "US-002"
    title: "Inspect honest local usage and cost summaries"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "discoverable per-call and per-session summaries in text and deterministic JSON"
    so_that: "I can compare usage and API-equivalent estimates without mistaking them for actual subscription charges"
    independent_test: "Run the newly built CLI against private synthetic diagnostics without network access."
    acceptance_scenarios:
      - given: "Known usage and model-specific public pricing"
        when: "I inspect a native OAuth request"
        then: "The cost is labeled API-equivalent estimate, not actual billed charges."
      - given: "Missing usage, missing rates, dropped observations, or expired records"
        when: "I inspect a summary"
        then: "Unknown values and incomplete coverage remain visible, separate from known subtotals and genuine zeros."
  - id: "US-003"
    title: "Retain privacy and existing memory behavior"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "bounded local accounting that follows existing observability controls"
    so_that: "visibility does not disclose content, create extra inference, or change my configured memory behavior"
    independent_test: "Use privacy sentinels, disabled controls, queue pressure, storage faults, and unchanged-payload fixtures."
    acceptance_scenarios:
      - given: "Prompts and provider errors contain synthetic sensitive sentinel strings"
        when: "Metrics are stored, logged, or rendered"
        then: "No prompt, memory content, raw error, credential, or sentinel is exposed."
      - given: "Observability is disabled or its persistence worker fails"
        when: "A memory operation executes"
        then: "Existing memory behavior is preserved and no unauthorized persistence or upload occurs."
requirements:
  functional:
    - id: "FR-001"
      description: "MUST collect provider-reported input, cached-input, output, and reasoning token fields from streamed and nonstreamed native responses, preserving field-level unknowns and partial/error outcomes."
      acceptance_criteria: "AC-1 fixtures cover complete, incomplete, failed, malformed, missing usage, missing details, truncated streams, split chunks, and duplicate terminal events. Reported zero differs from absent usage."
    - id: "FR-002"
      description: "MUST attribute every supported memory inference operation to an explicit operation identity, actual request identity, resolved provider/model/effort and authentic originating session where available."
      acceptance_criteria: "AC-2 integration fixtures enumerate rerank votes, incremental extraction, final extraction, contradiction checks, cluster naming, and all additional discovered live call sites. Spawned work preserves context; concurrent sessions never cross-attribute; ownerless calls are explicit."
    - id: "FR-003"
      description: "MUST count each actual request once, including distinct votes, retries and fallback attempts; repeated usage observations must not multiply request counts or totals."
      acceptance_criteria: "AC-3 exact ledger reconciliation covers successful and failed attempts, retry/fallback identity, repeated cumulative events and concurrent votes. Preflight rejection or skipped/backoff work does not invent a sent request."
    - id: "FR-004"
      description: "MUST treat reasoning tokens as a subset of output and normalize cached-input accounting according to the provider's usage semantics."
      acceptance_criteria: "AC-1/AC-3 fixtures prove total tokens equal normalized input plus output, never plus reasoning again; cached input is not charged twice; invalid subset values are marked invalid/unknown rather than silently coerced."
    - id: "FR-005"
      description: "MUST reuse existing pricing contracts and known model-specific rates, distinguish API-equivalent estimates from actual billed charges, and retain unknown pricing or usage without invented rates."
      acceptance_criteria: "AC-4 fixtures exercise known rates, missing cached rates, unknown models including unpriced Luna, partial usage, actual zero rates, mixed models and mixed known/unknown calls. No alias-based guessed Luna price or subscription-fee division is used."
    - id: "FR-006"
      description: "MUST expose discoverable CLI per-call and per-session text and deterministic JSON summaries, including coverage, unknown counts, known subtotals, attribution, effective metadata, pricing basis and local-control status."
      acceptance_criteria: "AC-4 new-binary help, session filtering, per-call detail, JSON parsing/order, text labels, empty history, invalid session identifiers, unknown values, and privacy tests run against private fixtures. Retained-window summaries never claim complete lifetime accounting."
    - id: "FR-007"
      description: "MUST use bounded, private, local diagnostics honoring the existing master, persistence, and structured-log observability controls; no content payloads, secrets, uploads or raw provider error strings belong in metrics."
      acceptance_criteria: "AC-5 allowlisted schema and negative fixtures verify disabled controls, private file permissions, retention, bounded identifiers, safe error categories, malformed stored records and zero network telemetry."
    - id: "FR-008"
      description: "MUST preserve configured Luna xhigh, votes two, cadence three, routing, fallback behavior and existing request/output-cap behavior."
      acceptance_criteria: "AC-6 exact native payload/default regressions and scope review prove no persistent configuration, routing or cap changes. Native OpenAI currently omits max_output_tokens; DEFAULT_MAX_TOKENS must not be inferred as a native OpenAI 1024 cap."
    - id: "FR-009"
      description: "MUST make queue loss, retention truncation and persistence failure visible as accounting incompleteness without blocking or failing memory inference."
      acceptance_criteria: "AC-5/AC-7 pressure, worker-failure, restart and rotation fixtures expose partial coverage, bound all added state, and preserve operation results."
    - id: "FR-010"
      description: "MUST deliver direct regression, integration, new-binary local workflow and bounded-overhead evidence before root-owned landing."
      acceptance_criteria: "AC-7/AC-8 focused checks, TUI binary build, guardrails and nonzero native swarm-routing contract checks pass serially; local mock runtime confirms executing binary identity. AC-9 remains explicitly root-owned, not worker-completed."
  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "The accounting hot path MUST use bounded nonblocking submission, no synchronous disk/pricing/inference work, and no added inference requests."
      measurable_target: "AC-7: zero additional inference requests; record before/after submission timing under normal and saturated load, verify maintained hot-path budgets and fixed queue/state limits. Numeric evidence is recorded in the existing budget/evidence documentation before implementation is accepted."
    - id: "NFR-002"
      category: "security"
      description: "Accounting MUST remain privacy-safe and local even on errors."
      measurable_target: "AC-5: zero sensitive sentinels in persisted/logged/rendered metrics, zero telemetry uploads, all created metric files private, and all existing observability control combinations tested."
    - id: "NFR-003"
      category: "code_quality"
      description: "Changes MUST follow constitution v1.1.0, canonical ownership, additive compatibility and surgical scope."
      measurable_target: "AC-6/AC-8: no new dependency cycle, no duplicate pricing/telemetry system, unchanged public completion compatibility, focused tests and required guardrails pass."
success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Operators can reconcile every observed request with its correct session and operation."
      metric: "Distinct synthetic requests versus per-call ledger and session totals"
      target: "100% reconcile, zero cross-session attribution or double counting"
    - id: "SC-002"
      description: "Operators can distinguish unknown costs from estimates and actual charges."
      metric: "Known, partial and unknown usage/pricing presentation cases"
      target: "100% explicitly labeled in both text and JSON; no fabricated billed amounts"
    - id: "SC-003"
      description: "Visibility preserves privacy and memory behavior."
      metric: "Sensitive output, additional inference and request/config differences"
      target: "Zero sensitive disclosure, zero new inference calls, zero unauthorized behavior changes"
key_entities:
  - name: "Memory request observation"
    description: "One actual inference attempt with optional provider usage and honest status"
    attributes:
      - "session ownership, operation identity/kind, unique attempt identity"
      - "resolved provider/model/effort and auth class, not account identifiers"
      - "optional normalized usage, terminal status, estimate provenance"
  - name: "Session usage summary"
    description: "Aggregation of distinct retained request observations for one authentic session"
    attributes:
      - "known token/cost subtotals and unknown request counts"
      - "coverage/control status, retention window and warnings"
edge_cases:
  - scenario: "Partial stream followed by error, cancellation or missing terminal usage"
    expected_behavior: "Retain only reported usage and an explicit incomplete/error outcome; never invent zero consumption."
  - scenario: "Two votes each retry and repeated events contain cumulative usage"
    expected_behavior: "Every physical attempt is distinct, each cumulative usage snapshot is counted once."
  - scenario: "Session closes before final extraction finishes"
    expected_behavior: "The original session attribution survives detached work and shutdown flushing remains bounded."
  - scenario: "Diagnostics disabled, rotated, corrupted, queue-saturated or unwritable"
    expected_behavior: "Inference remains unchanged; summaries communicate unavailable or partial evidence, not a complete zero."
assumptions:
  - "This is a draft target design for root review, not implementation evidence or an approval of new effects."
  - "Per-session totals describe retained observed requests, with explicit incompleteness rather than an unbounded lifetime ledger."
  - "Native OpenAI and native Claude fallback parsing are in scope; generic provider paths reuse their existing usage/attempt contract and honestly expose unavailable detail."
