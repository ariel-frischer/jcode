  - "Bead jcode-cyko owns the entire implementation and frozen AC-1 through AC-9 matrix; source approval read from bead.json and comments.json under /home/ari/.jcode/scratch/jcode-cyko."
  - "All generated artifacts and source changes stay in /home/ari/repos/jcode/.worktrees/agent/jcode-cyko. Current actual Git branch remains agent/jcode-cyko; autospec returned feature identifier 026-sidecar-usage-accounting with a HEAD-reference warning and did not switch branches."
  - "Root owns Beads, tasks/phase execution, review, worktrees, non-rewriting integration/push, install_release --fast, graceful reload, private HTML report, cleanup and closure (AC-9)."
  - "Worker produces spec and plan only now. No analyze, delegation, implementation, configuration mutation, paid/live inference or provider/runtime changes."
  - "All ten constitution principles PRIN-001 through PRIN-010 apply; plan maps them to checks and ownership."
out_of_scope:
  - "Prior completed memory cleanup jcode-5o54 and jcode-lec4; do not rerun."
  - "Pricing network refresh initiated by reporting, new uploads, new billing claims, model/effort/vote/cadence tuning or output-cap changes."
  - "New TUI panels, SDK endpoints, generalized telemetry framework or unrelated accounting refactors."
