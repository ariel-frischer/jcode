feature:
  branch: "007-add-session-librarian"
  created: "2026-08-14"
  status: "Draft"
  input: "Implement Bead jcode-zor: add a manually triggered token-bounded session librarian sidecar and slash skill trigger. Default runtime route must be native OpenAI OAuth gpt-5.6-luna xhigh, independently configurable. Produce versioned summary.md and summary.json under ~/.jcode/feedback/sessions/<session-id>, exclude hidden reasoning, repeated startup instructions, full AGENTS.md and skill bodies, and bulk successful tool output. Include a handoff_brief and relevant files reusable by the existing handoff contract. Ensure strict cost/input/output budgets, idempotent fingerprints, local-only sensitive-data handling, explicit failures, and zero cost when unused. In specify and plan, prioritize modularity, minimal custom surface, existing hook/skill/session/provider/config reuse, no parallel session store or plugin ABI, and minimal upstream drift/removable integration."

user_stories:
  - id: "US-001"
    title: "Manually generate a bounded session summary"
    priority: "P0"
    as_a: "Jcode user"
    i_want: "to invoke a session librarian explicitly from a slash skill"
    so_that: "I can condense a long session only when I decide the result is worth the provider usage"
    why_this_priority: "Manual opt-in and zero activity when unused are the core safety and cost contract."
    independent_test: "Start a session without invoking the librarian and verify no librarian provider request or summary artifact occurs, then invoke it once and verify one bounded summarization attempt begins."
    acceptance_scenarios:
      - given: "a session in which the librarian has not been invoked"
        when: "the user continues normal Jcode work"
        then: "the librarian performs no processing, provider request, or file write"
      - given: "an eligible session and valid librarian configuration"
        when: "the user invokes the librarian slash skill"
        then: "the system runs one explicitly bounded summarization attempt and reports its result"

  - id: "US-002"
    title: "Receive safe versioned summary artifacts"
    priority: "P0"
    as_a: "Jcode user"
    i_want: "human-readable and machine-readable summaries that omit low-value and sensitive transcript material"
    so_that: "I can review and reuse the important session context without retaining or transmitting unnecessary content"
    why_this_priority: "The artifacts and their privacy exclusions are the primary user-visible outcome."
    independent_test: "Use a fixture session containing hidden-reasoning markers, duplicate startup instructions, complete instruction and skill bodies, secrets, and large successful tool output, then verify both artifacts exist and omit every excluded category."
    acceptance_scenarios:
      - given: "a session containing relevant decisions alongside excluded transcript categories"
        when: "the librarian completes successfully"
        then: "summary.md and summary.json contain the relevant outcomes but contain none of the excluded source material"
      - given: "a successful generation"
        when: "the user inspects the session feedback directory"
        then: "both artifacts identify their format version, source fingerprint, generation time, and bounded usage"

  - id: "US-003"
    title: "Reuse the summary for handoff"
    priority: "P1"
    as_a: "Jcode user continuing work in another session"
    i_want: "the summary to include a concise handoff brief and relevant file paths"
    so_that: "the existing handoff workflow can continue the work without rereading the full session"
    why_this_priority: "Cross-session continuity is a principal value of session summarization."
    independent_test: "Generate a summary from a fixture with decisions, unfinished work, and referenced files, then verify the structured handoff fields are present and directly consumable by the existing handoff contract."
    acceptance_scenarios:
      - given: "a session with a clear goal, completed work, next steps, and relevant files"
        when: "the librarian succeeds"
        then: "the machine-readable artifact includes a handoff_brief and a deduplicated relevant_files list that agree with the human-readable artifact"

  - id: "US-004"
    title: "Control route and hard budgets independently"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "independent librarian route and budget settings with visible validation failures"
    so_that: "summarization cannot silently use the main session route or exceed my approved limits"
    why_this_priority: "Independent control is required for predictable cost, privacy, and operational behavior."
    independent_test: "Exercise default, overridden, missing-authentication, invalid-budget, provider-failure, and over-budget cases and verify the effective route or explicit failure in each case."
    acceptance_scenarios:
      - given: "no librarian-specific route override"
        when: "the librarian is invoked"
        then: "the effective route is native OpenAI OAuth gpt-5.6-luna with xhigh effort"
      - given: "a valid librarian-specific route override"
        when: "the librarian is invoked"
        then: "the librarian uses that route without changing the active session route"
      - given: "invalid configuration or a budget that cannot safely admit the request"
        when: "the librarian is invoked"
        then: "the attempt stops before the disallowed work and returns an actionable failure without publishing partial artifacts"

requirements:
  functional:
    - id: "FR-001"
      description: "The system MUST expose a manually invoked session librarian through a slash skill and MUST NOT run librarian work automatically."
      testable: true
      acceptance_criteria: "Across sessions where the trigger is never invoked, the number of librarian provider requests and librarian artifact writes is exactly zero; one valid invocation starts exactly one attempt."
    - id: "FR-002"
      description: "The librarian MUST summarize the current canonical session rather than creating or maintaining a separate session history store."
      testable: true
      acceptance_criteria: "The summary source corresponds to the current session identifier and no duplicate transcript or parallel session record is created."
    - id: "FR-003"
      description: "On success, the librarian MUST publish summary.md and summary.json beneath ~/.jcode/feedback/sessions/<session-id>."
      testable: true
      acceptance_criteria: "Both files exist in the directory for the invoked session, are readable, and describe the same source fingerprint and summary outcome."
    - id: "FR-004"
      description: "Both artifacts MUST carry an explicit summary format version, source fingerprint, generation timestamp, effective non-secret route identity, and actual bounded input and output usage."
      testable: true
      acceptance_criteria: "Each successful artifact exposes all listed metadata, and corresponding values match between the Markdown and JSON forms."
    - id: "FR-005"
      description: "The librarian MUST exclude hidden reasoning, repeated startup instructions, complete AGENTS.md content, complete skill bodies, and bulk output from successful tools from both provider input and persisted summaries."
      testable: true
      acceptance_criteria: "Fixture markers unique to each excluded category appear neither in the admitted provider payload nor in either output artifact, while concise failure output and relevant user-visible outcomes remain eligible."
    - id: "FR-006"
      description: "The librarian MUST handle secrets and sensitive session data locally, redact recognized secret values before any provider request or persistence, and MUST NOT include raw credentials in diagnostics."
      testable: true
      acceptance_criteria: "Fixtures containing credential-like values produce only redacted placeholders in admitted content, artifacts, and errors; diagnostics expose at most names, presence, lengths, or redacted fingerprints."
    - id: "FR-007"
      description: "The librarian MUST enforce hard per-invocation limits for admitted input, generated output, provider requests, and approved cost exposure before and during generation."
      testable: true
      acceptance_criteria: "No completed or failed invocation exceeds any configured hard limit; work that cannot fit is deterministically reduced or rejected before the relevant limit is crossed."
    - id: "FR-008"
      description: "The default librarian route MUST be native OpenAI OAuth gpt-5.6-luna with xhigh effort, and librarian route settings MUST be independently configurable from the active session route."
      testable: true
      acceptance_criteria: "The unset case resolves to the stated default, a librarian override changes only librarian generation, and active session provider settings remain unchanged."
    - id: "FR-009"
      description: "The librarian MUST validate authentication, route support, budget values, source availability, output location, and provider results at their boundaries and return explicit actionable failures."
      testable: true
      acceptance_criteria: "Each invalid or unavailable boundary condition returns a distinct non-secret error, exits unsuccessfully, and leaves no newly published partial summary pair."
    - id: "FR-010"
      description: "The librarian MUST compute an idempotent fingerprint from the admitted session content and summary-affecting configuration."
      testable: true
      acceptance_criteria: "Repeated invocations over equivalent admitted content and configuration produce the same fingerprint and do not create duplicate generation work; a summary-affecting change produces a different fingerprint."
    - id: "FR-011"
      description: "The JSON artifact MUST include a handoff_brief and a deduplicated relevant_files collection reusable by the existing handoff contract, with equivalent information visible in the Markdown artifact."
      testable: true
      acceptance_criteria: "A fixture with continuation context yields a non-empty handoff brief and normalized relevant file list that can populate the existing handoff inputs without transcript parsing."
    - id: "FR-012"
      description: "The feature MUST reuse existing session, provider, configuration, hook, skill, and handoff contracts where they already own the behavior, and MUST NOT introduce a general plugin interface or duplicate extension mechanism."
      testable: true
      acceptance_criteria: "Design review identifies one canonical owner for every new behavior, no new parallel session store or general plugin ABI exists, and disabling or removing the feature leaves existing contracts intact."
    - id: "FR-013"
      description: "Publishing MUST be atomic at the artifact-pair level so a reported success never exposes mismatched or partially updated summary.md and summary.json files."
      testable: true
      acceptance_criteria: "Interrupted and failed writes leave the prior valid pair unchanged or leave no pair; successful writes expose matching fingerprints in both files."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Unused librarian functionality must add no provider activity and no user-observable background workload."
      measurable_target: "Zero librarian provider requests, zero librarian artifact writes, and no librarian task execution before manual invocation."
    - id: "NFR-002"
      category: "security"
      description: "Sensitive data must remain locally filtered and raw secrets must never be transmitted or persisted by the librarian."
      measurable_target: "100% of recognized secret fixtures are redacted before provider admission and absent from artifacts and diagnostics."
    - id: "NFR-003"
      category: "reliability"
      description: "Budget enforcement and artifact publication must fail closed."
      measurable_target: "100% of invalid, over-budget, provider-failure, and interrupted-write tests return explicit failure with no newly published partial artifact pair."
    - id: "NFR-004"
      category: "code_quality"
      description: "The integration must remain modular, removable, and low drift relative to existing Jcode ownership boundaries."
      measurable_target: "No parallel session store, no general plugin ABI, no changed behavior when unused, and all new contracts have a named existing owner or one focused removable owner."
    - id: "NFR-005"
      category: "usability"
      description: "A user must be able to identify what happened after every manual invocation."
      measurable_target: "100% of invocations return either the artifact location and usage summary or one actionable non-secret failure reason."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users incur no librarian usage or cost unless they explicitly request a summary."
      metric: "Librarian attempts and provider requests in sessions without a manual trigger"
      target: "Exactly 0"
    - id: "SC-002"
      description: "Every successful invocation gives users a consistent human-readable and machine-readable summary."
      metric: "Successful invocations publishing a matching artifact pair"
      target: "100%"
    - id: "SC-003"
      description: "Summaries remain within all user-approved input, output, request, and cost limits."
      metric: "Invocations exceeding any configured hard budget"
      target: "0"
    - id: "SC-004"
      description: "Excluded and recognized sensitive source material does not appear in admitted summarization input or output artifacts."
      metric: "Excluded-category or raw-secret fixture markers found after filtering"
      target: "0 across all defined fixture categories"
    - id: "SC-005"
      description: "Repeated requests for unchanged eligible content avoid duplicate generation."
      metric: "Additional provider generations for an unchanged fingerprint"
      target: "0 after the first successful generation"
    - id: "SC-006"
      description: "Generated summaries provide enough structured continuation context for the established handoff workflow."
      metric: "Eligible successful summaries containing a usable handoff brief and relevant file list"
      target: "100%"
    - id: "SC-007"
      description: "Users receive a clear outcome promptly after manually requesting a summary."
      metric: "Invocations that return either success details or an actionable failure within the configured execution deadline"
      target: "100%"

key_entities:
  - name: "Session Summary"
    description: "The paired human-readable and machine-readable account of the eligible session context."
    attributes:
      - "format version"
      - "session identifier"
      - "source fingerprint"
      - "generation timestamp"
      - "bounded usage"
      - "summary content"
      - "handoff brief"
      - "relevant files"
  - name: "Librarian Invocation"
    description: "One user-authorized attempt to filter and summarize a session under hard limits."
    attributes:
      - "manual trigger"
      - "effective route"
      - "input budget"
      - "output budget"
      - "request budget"
      - "cost budget"
      - "result status"
      - "failure reason"
  - name: "Source Fingerprint"
    description: "A stable identity for eligible session content plus summary-affecting settings."
    attributes:
      - "fingerprint algorithm version"
      - "eligible content identity"
      - "summary-affecting configuration identity"

edge_cases:
  - scenario: "The session has no meaningful eligible content after exclusions."
    expected_behavior: "The invocation fails explicitly without a provider request or empty artifact publication."
  - scenario: "The eligible input exceeds the configured input budget."
    expected_behavior: "Deterministic filtering or truncation reduces it within budget while preserving the newest and highest-value continuation context, or the invocation fails before generation if it cannot fit safely."
  - scenario: "The provider response reaches the output limit or is malformed."
    expected_behavior: "The invocation reports an explicit failure and does not replace a previously valid artifact pair."
  - scenario: "The same session is invoked repeatedly without summary-affecting changes."
    expected_behavior: "The same fingerprint resolves to the existing successful artifacts without another provider generation."
  - scenario: "Session content changes after a successful summary."
    expected_behavior: "A new fingerprint permits a new versioned generation while retaining a clear version identity in the published artifacts."
  - scenario: "Two librarian invocations race for the same session."
    expected_behavior: "At most one generation proceeds for a fingerprint, and readers observe only a complete matching artifact pair."
  - scenario: "The output directory is missing, unwritable, or contains a prior artifact version."
    expected_behavior: "The system creates the expected local directory when safe, preserves prior valid artifacts on failure, and reports permission or compatibility problems explicitly."
  - scenario: "The configured route lacks valid native OAuth authentication or does not support the requested model or effort."
    expected_behavior: "The invocation fails before content transmission and explains the unsupported or unavailable non-secret setting."

assumptions:
  - "Manual invocation applies to the currently active canonical session unless the existing slash-skill contract already supports an explicit session target."
  - "Versioning means both artifacts expose an explicit format version and fingerprint; changed eligible content may replace the canonical filenames atomically while remaining distinguishable by version metadata."
  - "Hard budget values are independently configurable, validated as positive finite limits, and have conservative built-in defaults documented during planning."
  - "Recognized sensitive data includes credentials and secret-like values detectable by existing local redaction contracts; users remain responsible for content that cannot reasonably be recognized as sensitive."
  - "Bulk successful tool output may be represented by a concise local metadata digest, while failure output and small result excerpts remain eligible when relevant."
  - "The existing handoff contract remains authoritative for handoff field meanings and path normalization."

constraints:
  - "The default librarian runtime route is native OpenAI OAuth gpt-5.6-luna with xhigh effort."
  - "Librarian route and budget configuration is independent from the main session route."
  - "All sensitive-data filtering occurs locally before provider transmission or artifact persistence."
  - "The integration must preserve existing behavior, session storage, provider behavior, and cost when unset or unused."
  - "The design must minimize custom surface and upstream drift by reusing existing contracts and keeping the experiment removable."
  - "No parallel session store, general plugin ABI, or duplicate skill, hook, provider, configuration, or handoff mechanism may be introduced."

out_of_scope:
  - "Automatic or scheduled session summarization."
  - "Automatic transcript deletion, consolidation, retention enforcement, or remote synchronization."
  - "A replacement session database or alternate source of truth for sessions."
  - "A general-purpose plugin ABI or third-party extension marketplace."
  - "Changes to the established handoff contract beyond consuming its existing reusable fields."
  - "Summarizing complete repository instruction files, complete skill definitions, hidden reasoning, or bulk successful tool output."
  - "Guaranteeing detection of every possible form of user-authored sensitive information beyond the supported local redaction contract."

