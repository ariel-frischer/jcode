    name: "Contracts and configuration"
    goal: "Define additive versioned artifacts and an independently resolved, fail-closed librarian route and budget policy."
    deliverables:
      - "SessionSummary, bounded usage, route identity, fingerprint, and handoff-compatible serde contracts"
      - "Persisted and environment configuration with documented precedence and conservative defaults"
      - "Validation for positive finite budgets, route support, authentication kind, pricing evidence, and active-route isolation"
  - phase: 2
    name: "Local admission and fingerprinting"
    goal: "Transform the canonical session into deterministic, redacted, bounded provider input without another session store."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Typed exclusion of hidden reasoning, startup/AGENTS content, skill bodies, and bulk successful tool output"
      - "Existing secret-redaction reuse with fixture-complete privacy tests"
      - "Deterministic priority reduction, token accounting, and versioned SHA-256 fingerprint"
  - phase: 3
    name: "Bounded provider generation"
    goal: "Invoke one independently configured provider request under hard input, output, request, cost, and deadline limits."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Separate provider instance using existing native OAuth registry and credential resolution"
      - "Worst-case cost preflight and runtime request/output/deadline guards"
      - "Versioned structured response schema with malformed, truncated, unsupported, and provider-failure handling"
  - phase: 4
    name: "Atomic artifacts and handoff projection"
    goal: "Publish one immutable matching Markdown/JSON pair and reuse it for equivalent invocations."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Validated SessionSummary as the single source for both renderings"
      - "Normalized deduplicated handoff_brief and relevant_files projection"
      - "Per-session/fingerprint lock, staging directory, atomic rename, prior-generation preservation, and idempotent reuse"
  - phase: 5
    name: "Manual skill and tool integration"
    goal: "Expose the workflow only through the existing slash-skill and tool surfaces with clear user outcomes."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Focused current-session librarian tool and bundled session-librarian skill"
      - "Zero-work-when-unused and exactly-one-attempt invocation tests"
      - "Success response with artifact path and bounded usage, or one actionable non-secret failure"
  - phase: 6
    name: "Delivery and runtime validation"
