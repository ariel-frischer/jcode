  branch: "agent/jcode-zor-librarian"
  created: "2026-08-14"
  spec_path: "specs/007-add-session-librarian/spec.yaml"

summary: |
  Add the session librarian as a manually invoked, one-shot server-side workflow
  reached through Jcode's existing slash-skill and model-tool surfaces. The skill
  activates the focused librarian tool for the current canonical session. The
  server reads the existing session record, structurally excludes hidden reasoning,
  startup instruction bodies, complete skill bodies, and bulk successful tool
  output, applies the existing local secret redactor, admits content under hard
  budgets, and invokes a separately resolved provider route without mutating the
  active session provider.

  A successful provider response must satisfy a versioned structured schema before
  Jcode renders both Markdown and JSON from the same validated value. The artifact
  pair is staged in a fingerprint-named generation directory and published with one
  atomic directory rename beneath ~/.jcode/feedback/sessions/<session-id>, which
  makes retries idempotent and prevents readers from observing a partial pair. The
  design adds no automatic task, parallel transcript store, protocol expansion, or
  plugin ABI, and remains removable by deleting the focused workflow, config, tool,
  and bundled skill registration.

technical_context:
  language: "Rust 2024 edition"
  framework: "None"
  primary_dependencies:
    - name: "jcode-config-types"
      version: "workspace"
      purpose: "Owns additive serde-compatible librarian route and budget configuration."
    - name: "jcode-session-types"
      version: "workspace"
      purpose: "Owns dependency-light versioned summary artifact and bounded usage contracts."
    - name: "jcode-base"
      version: "workspace"
      purpose: "Provides canonical session data, configuration resolution, secret redaction, storage helpers, and provider abstractions."
    - name: "jcode-app-core"
      version: "workspace"
      purpose: "Owns librarian orchestration, filtering, budgeting, provider invocation, locking, and artifact publication."
    - name: "jcode-provider-openai-runtime"
      version: "workspace"
      purpose: "Supplies the default native OpenAI OAuth provider route through the existing provider registry."
    - name: "serde and serde_json"
      version: "workspace/root constraints"
      purpose: "Validate the provider's structured response and render the machine-readable artifact."
    - name: "sha2"
      version: "0.10"
      purpose: "Computes a stable versioned fingerprint from admitted content and summary-affecting configuration."
  storage: "Existing canonical session persistence as read-only input; immutable version directories under ~/.jcode/feedback/sessions/<session-id>/<fingerprint>/ for summary.md and summary.json"
  testing:
    framework: "Rust built-in test harness with existing config, session, provider, tool, and storage fixtures"
    approach: "Test-first unit coverage for filtering, redaction, precedence, budgets, fingerprints, schema validation, and rendering; integration coverage with fake providers and interrupted/racing publication; built-binary slash-skill smoke test on an isolated socket without live provider cost"
  target_platform: "Jcode-supported Linux, macOS, and Windows CLI/server builds"
  project_type: "cli"
  performance_goals: "Exactly zero librarian execution, provider requests, or artifact writes when unused; one request maximum per invocation; deterministic bounded admission; every invocation returns success details or an actionable failure within a default 120-second deadline"
  constraints:
    - "The default route is native OpenAI OAuth, model gpt-5.6-luna, effort xhigh."
    - "Librarian route and budgets resolve independently and never mutate the active session route."
    - "Conservative built-in limits are 24000 admitted input tokens, 4000 output tokens, 1 provider request, USD 1.00 maximum approved exposure, and a 120-second deadline."
    - "Input accounting must use an existing provider-aware counter when available and otherwise a conservative upper bound that cannot undercount the configured limit."
    - "All exclusions and recognized-secret redaction occur locally before provider transmission and again before persistence."
    - "No partial or malformed provider response may replace or publish an artifact pair."
    - "No parallel session store, automatic scheduler, general plugin ABI, new protocol contract, or duplicate handoff mechanism is introduced."
    - "The existing handoff contract remains authoritative for handoff_brief meaning and relevant-file normalization."
  scale_scope: "One manually requested current-session summary at a time per session, one provider request per new fingerprint, and bounded local processing of one canonical session transcript"

