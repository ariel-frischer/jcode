research_findings:
  decisions:
    - topic: "Manual trigger and integration surface"
      decision: "Ship a bundled session-librarian slash skill that invokes one focused server-side librarian tool through the existing skill and tool registration paths."
      rationale: "Existing slash skills already provide explicit user activation and tool availability. This avoids a new command protocol, background daemon, hook type, or plugin ABI while guaranteeing no work when unused."
      alternatives_considered:
        - "Add a dedicated TUI slash command and protocol request, which increases client and wire surface."
        - "Run from a session hook, which risks automatic activity and violates manual-only behavior."
        - "Create a general sidecar plugin system, which is explicitly out of scope."
    - topic: "Canonical session source and ownership"
      decision: "Run in the authoritative server process and read the current Session object and existing persisted message model without copying the transcript into another store."
      rationale: "The server already owns sessions, provider state, tools, and persistence, and a current-session tool can identify the source session without terminal parsing."
      alternatives_considered:
        - "Read TUI display history, which is presentation state and may be incomplete."
        - "Create a librarian transcript database, which would establish a conflicting source of truth."
    - topic: "Transcript admission and privacy"
      decision: "Build a deterministic local admission pipeline from typed session message and content metadata, remove excluded categories structurally, collapse repeated startup material by stable identity, summarize successful tool calls as bounded metadata, retain concise failures when relevant, and apply jcode-base message::redact_secrets before hashing, transmission, rendering, and diagnostics."
      rationale: "Typed filtering is safer than prompt-only instructions, while the existing redactor already covers known direct tokens and assignment forms and has focused tests."
      alternatives_considered:
        - "Ask the provider to ignore sensitive or low-value content after transmission."
        - "Filter only by text regexes, which is brittle for typed reasoning and tool content."
        - "Persist the unfiltered payload for debugging, which violates the privacy contract."
    - topic: "Independent provider route"
      decision: "Resolve a librarian-specific route record and instantiate a separate provider through the existing provider registry and credential resolver, defaulting to native OpenAI OAuth gpt-5.6-luna xhigh."
      rationale: "A separate provider instance preserves the active session route and reuses current authentication, capability validation, reasoning-effort, streaming, usage, and error contracts."
      alternatives_considered:
        - "Temporarily mutate the active Agent provider and restore it afterward."
        - "Call the OpenAI HTTP API directly, duplicating authentication and provider behavior."
        - "Inherit the active session route by default, which conflicts with the specified default."
    - topic: "Budget enforcement"
      decision: "Resolve positive finite hard limits for admitted input, output, requests, approved cost exposure, and deadline; calculate worst-case exposure from route pricing metadata before transmission; set provider output and request caps; stop streaming at the output boundary; reject routes without sufficient capability or pricing evidence."
      rationale: "Preflight worst-case cost plus runtime token/request/deadline guards fails closed and prevents an invocation from exceeding user-approved exposure."
      alternatives_considered:
        - "Track cost only after completion, which cannot enforce a hard limit."
        - "Use character limits alone, which do not match provider token and cost accounting."
        - "Allow unknown pricing with a warning, which weakens the approved-cost contract."
    - topic: "Fingerprint and retry behavior"
      decision: "Hash a canonical serialization containing fingerprint algorithm version, admitted redacted content, prompt/schema version, route identity, effort, and all summary-affecting budgets and options. Reuse an existing validated generation directory for the same fingerprint."
      rationale: "The fingerprint makes idempotency deterministic while changing whenever source eligibility or output semantics can change."
      alternatives_considered:
        - "Hash the raw transcript, which includes excluded and unstable content."
        - "Use session modification time, which is not content-addressed."
        - "Always regenerate, which violates the duplicate-cost requirement."
    - topic: "Atomic artifact-pair publication"
      decision: "Render both artifacts from one validated SummaryArtifact into a same-filesystem staging directory, fsync as supported, then atomically rename the directory to <session-id>/<fingerprint>. Lock per session/fingerprint so only one generation proceeds."
      rationale: "A directory rename publishes the pair as one filesystem operation and immutable fingerprint directories preserve previous valid results after failures or source changes."
      alternatives_considered:
        - "Rename summary.md and summary.json separately, which exposes an observable mismatch window."
        - "Overwrite canonical files in place, which can corrupt the prior pair on interruption."
        - "Use a database transaction, which adds an unnecessary parallel persistence system."
    - topic: "Structured output and handoff reuse"
      decision: "Require one versioned JSON response schema, validate and locally normalize handoff_brief and relevant_files against the established handoff semantics, then render JSON and Markdown from the same in-memory value."
      rationale: "One source object prevents artifact drift and makes continuation data directly reusable without transcript parsing."
      alternatives_considered:
        - "Generate Markdown and JSON in separate provider requests."
        - "Parse handoff fields back out of prose."
        - "Modify the handoff contract, which is out of scope."

data_model:
  entities:
    - name: "LibrarianConfig"
      description: "Additive configuration resolved independently for one librarian invocation."
      fields:
        - name: "provider"
          type: "String"
          description: "Provider route identifier."
          constraints: "Defaults to native OpenAI OAuth; must resolve through the existing registry and support the selected model."
        - name: "model"
          type: "String"
          description: "Librarian model identifier."
          constraints: "Defaults to gpt-5.6-luna and must be supported by the provider."
        - name: "reasoning_effort"
          type: "String"
          description: "Independent reasoning effort."
          constraints: "Defaults to xhigh and must be supported by the route."
        - name: "max_input_tokens"
          type: "u32"
          description: "Maximum admitted provider input."
          constraints: "Positive finite value; default 24000."
        - name: "max_output_tokens"
          type: "u32"
          description: "Maximum generated provider output."
          constraints: "Positive finite value; default 4000."
        - name: "max_requests"
          type: "u8"
          description: "Maximum provider requests per invocation."
          constraints: "Positive finite value; default and supported initial maximum are 1."
        - name: "max_cost_usd"
          type: "decimal-compatible string or integer micros"
          description: "Maximum worst-case approved provider cost exposure."
          constraints: "Positive finite value; default USD 1.00; never represented internally as binary floating-point for boundary comparison."
        - name: "deadline_seconds"
          type: "u32"
          description: "Wall-clock deadline for the attempt."
          constraints: "Positive finite value; default 120."
      relationships:
        - target: "LibrarianInvocation"
          type: "one-to-many"
          description: "Each invocation records one effective non-secret resolved configuration."
    - name: "AdmittedSessionContent"
      description: "Deterministic redacted and bounded representation of eligible canonical session context."
      fields:
        - name: "session_id"
          type: "String"
          description: "Canonical source session identifier."
          constraints: "Must equal the current tool-owning session."
        - name: "items"
          type: "Vec<AdmittedItem>"
          description: "Ordered decisions, user-visible messages, concise failures, tool metadata, and continuation context."
          constraints: "Contains no hidden reasoning, complete startup instructions, complete skill bodies, bulk successful tool output, or recognized raw secrets."
        - name: "input_tokens"
          type: "u32"
          description: "Conservatively accounted admitted input size."
          constraints: "Must not exceed max_input_tokens."
        - name: "filter_version"
          type: "String"
          description: "Version of structural exclusion and deterministic reduction rules."
          constraints: "Included in the source fingerprint."
      relationships:
        - target: "SourceFingerprint"
          type: "one-to-one"
          description: "The admitted canonical serialization is an input to the fingerprint."
    - name: "SourceFingerprint"
      description: "Idempotent identity for admitted content and all summary-affecting settings."
      fields:
        - name: "algorithm_version"
          type: "String"
          description: "Fingerprint contract version."
          constraints: "Explicit and stable for a given canonicalization algorithm."
        - name: "digest"
          type: "SHA-256 hex string"
          description: "Content-addressed generation identity."
          constraints: "Lowercase fixed-length hexadecimal and safe as a directory name."
        - name: "configuration_identity"
          type: "canonical JSON"
          description: "Non-secret route, budgets, prompt version, schema version, and filter version."
          constraints: "Canonical key ordering; excludes credentials and timestamps."
      relationships:
        - target: "SessionSummary"
          type: "one-to-one"
          description: "One successful immutable artifact pair exists per session and fingerprint."
    - name: "LibrarianInvocation"
      description: "One manually authorized bounded attempt or idempotent reuse result."
      fields:
        - name: "session_id"
          type: "String"
          description: "Current canonical session."
          constraints: "Required and available before provider work."
        - name: "fingerprint"
          type: "SourceFingerprint"
          description: "Identity used for locking and reuse."
          constraints: "Computed after filtering and configuration resolution."
        - name: "effective_route"
          type: "RouteIdentity"
          description: "Provider, model, transport/auth kind, and effort without credentials."
          constraints: "Must not mutate the active session route."
        - name: "usage"
          type: "BoundedUsage"
          description: "Actual input, output, request count, elapsed time, and cost."
          constraints: "Every value must remain within its effective hard limit."
        - name: "status"
          type: "reused | succeeded | failed"
          description: "Terminal invocation result."
          constraints: "Failure is actionable and never publishes a new partial pair."
      relationships:
        - target: "SessionSummary"
          type: "many-to-one"
          description: "Equivalent successful invocations reuse the same fingerprinted summary."
    - name: "SessionSummary"
      description: "Versioned structured result used to render matching summary.json and summary.md."
      fields:
        - name: "format_version"
          type: "String"
          description: "Artifact schema and Markdown contract version."
          constraints: "Required in both renderings."
        - name: "session_id"
          type: "String"
          description: "Source canonical session."
          constraints: "Must match invocation and output directory."
        - name: "source_fingerprint"
          type: "SourceFingerprint"
          description: "Generation identity."
          constraints: "Must match directory name and both artifacts."
        - name: "generated_at"
          type: "RFC 3339 timestamp"
          description: "Successful generation time."
          constraints: "Excluded from fingerprint input."
        - name: "effective_route"
          type: "RouteIdentity"
          description: "Non-secret provider route used."
          constraints: "No credential material."
        - name: "usage"
          type: "BoundedUsage"
          description: "Actual bounded provider and elapsed usage."
          constraints: "Matching values in both artifacts."
        - name: "summary"
          type: "StructuredSummarySections"
          description: "Goal, outcomes, decisions, unresolved work, risks, and next steps."
          constraints: "Schema-valid, bounded, redacted, and free of excluded source material."
        - name: "handoff_brief"
          type: "String"
          description: "Concise continuation prompt compatible with the existing handoff contract."
          constraints: "Non-empty when continuation context exists and bounded by output schema limits."
        - name: "relevant_files"
          type: "Vec<PathBuf>"
          description: "Normalized deduplicated paths relevant to continuation."
          constraints: "Uses existing handoff normalization; excludes secrets and invalid/unbounded entries."
      relationships:
        - target: "ArtifactGeneration"
          type: "one-to-one"
          description: "One validated summary renders one immutable Markdown/JSON pair."
    - name: "ArtifactGeneration"
      description: "Filesystem publication unit for one session fingerprint."
      fields:
        - name: "staging_directory"
          type: "PathBuf"
          description: "Private same-filesystem directory used before publication."
          constraints: "Unique, permission-restricted, and cleaned after failure."
        - name: "final_directory"
          type: "PathBuf"
          description: "~/.jcode/feedback/sessions/<session-id>/<fingerprint>."
          constraints: "Immutable after successful atomic rename."
        - name: "files"
          type: "summary.md and summary.json"
          description: "Two renderings of the same validated SessionSummary."
          constraints: "Both fingerprints and metadata must match before rename."
      relationships:
        - target: "SourceFingerprint"
          type: "many-to-one"
          description: "The fingerprint determines the immutable destination and idempotent reuse key."

