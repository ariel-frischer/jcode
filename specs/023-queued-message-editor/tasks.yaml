    story_reference: "US-002"
    independent_test: "Interleave owned queued User messages with excluded owners, legacy records, non-User sources, and injected work; start and replay navigation, move in both directions, disconnect, and verify only the eligible owned snapshot is held or restored exactly once."
    tasks:
      - id: "T009"
