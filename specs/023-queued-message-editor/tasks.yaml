        status: "Pending"
        type: "test"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/server/state_tests/queued_message_editor.rs"
        dependencies: ["T008"]
        acceptance_criteria:
          - "Tests require start to atomically reserve only queued, non-injected, User-source records owned by the verified requester and select the newest snapshot item."
          - "Tests reject cross-client continuation without disclosing held content and prove excluded records retain identity, content, state, and relative order."
          - "Repeated operations with matching fingerprints return equivalent cached outcomes; conflicting operation_id reuse is rejected without mutation."
      - id: "T010"
        title: "Add failing requester delivery, disconnect, timeout, and shutdown recovery tests"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/server/client_lifecycle_tests.rs"
        dependencies: ["T008"]
        acceptance_criteria:
          - "Results are delivered only to the verified owning client and connection lifecycle binds the navigation session to that owner."
          - "Transient disconnect begins a bounded owner reconnect grace period; matching reconnect resumes or replays without a second reservation."
          - "Grace expiry, explicit abandonment, timeout, shutdown, and unsupported continuation release immutable originals exactly once and leave no active reservation."
      - id: "T011"
        title: "Implement the authoritative navigation coordinator and bounded replay cache"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/server/state.rs"
        dependencies: ["T009"]
        acceptance_criteria:
          - "One session-scoped authority serializes start, save-and-move, release, ownership validation, persistence, and outcome recording."
          - "Start captures an immutable oldest-to-newest eligible snapshot, reserves it atomically, selects newest, and excludes all later arrivals."
          - "Replay keys include owner, Jcode session, navigation session, operation ID, and request fingerprint with bounded completed-outcome retention."
      - id: "T012"
        title: "Wire verified client ownership, editor dispatch, and abandonment release"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/server/client_lifecycle.rs"
        dependencies: ["T010", "T011"]
        acceptance_criteria:
          - "Validate identities and operation shapes before invoking the coordinator and return typed owner-safe errors."
          - "Route matching results only to the requester; retain the owner-scoped session during bounded reconnect grace and resume stable operations on matching reconnect."
          - "Release immutable originals on grace expiry, explicit abandonment, timeout, or shutdown without applying uncommitted working drafts."
      - id: "T013"
        title: "Keep reserved snapshots outside dispatch and preserve atomic recovery persistence"
        status: "Pending"
        type: "implementation"
        parallel: true
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/agent/interrupts.rs"
