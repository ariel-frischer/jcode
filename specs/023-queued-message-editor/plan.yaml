plan:
  branch: "023-queued-message-editor"
  created: "2026-09-01"
  spec_path: "specs/023-queued-message-editor/spec.yaml"

summary: |
  Extend the landed one-shot Alt+Q recall into one keyboard-driven queued-message editing state machine shared conceptually by local and authoritative modes. The TUI will hold an ordered snapshot of editable drafts, save text and ordered images before every move, route lowercase Alt+Q toward older items and Alt+Shift+Q toward newer items, preserve visible boundary feedback, and use Enter as the only commit or empty-draft delete boundary. Outside an active editor session, the existing Alt+Q, Enter, history, and CancelSoftInterrupts paths remain unchanged.

  For server-backed soft interrupts, add an additive capability and replay-safe wire operation family owned by jcode-protocol. A session-scoped server coordinator will atomically reserve only the requesting client's queued, non-injected User records, retain their durable original content separately from transient working drafts, record stable queue anchors and snapshot generation, and serialize every save, navigation, commit, delete, release, timeout, and disconnect transition under one authority. Restoration will use the specified nearest-surviving-anchor rule, new arrivals will remain outside the snapshot, and every boundary, replay, stale placement, conflict, and release outcome will be explicit. Persistence will use a backward-compatible versioned envelope that can read the existing legacy array format and atomically stores both dispatchable records and reservation recovery metadata in one session file.

technical_context:
  language: "Rust 2024 edition"
  framework: "Tokio server with Ratatui 0.30 and Crossterm 0.29 TUI"
  primary_dependencies:
    - name: "serde"
      version: "1"
      purpose: "Define additive wire types and backward-compatible versioned soft-interrupt persistence."
    - name: "serde_json"
      version: "1"
      purpose: "Round-trip protocol fixtures, capability payloads, persistence envelopes, and replay outcomes."
    - name: "tokio"
      version: "1"
      purpose: "Use the existing server, transport, connection lifecycle, timers, and synchronization infrastructure."
    - name: "ratatui"
      version: "0.30"
      purpose: "Render composer state and distinct boundary, stale, conflict, commit, delete, and recovery feedback."
    - name: "crossterm"
      version: "0.29"
      purpose: "Recognize lowercase Alt+Q and Alt+Shift+Q consistently in local and remote key paths."
  storage: "The existing per-session pending-soft-interrupt JSON store becomes a backward-compatible versioned envelope containing the dispatchable queue plus active navigation recovery records. Legacy array files remain readable; one atomic file replacement records queue and reservation state together. Local editor state remains transient TUI memory."
  testing:
    framework: "Rust built-in unit and async test framework, Tokio tests, Ratatui TestBackend, protocol JSON fixtures, and private-socket runtime scripts"
    approach: "Develop focused tests first for local traversal, ordered images, protocol compatibility, persistence migration and crash recovery, atomic server reservation and anchoring, replay and cross-client isolation, TUI feedback and history regressions, SDK capability discovery, then run serialized format/check/Clippy/guardrails, a newly built private-socket runtime matrix, installed-runtime verification, and explicit fixture and process cleanup. Maintain a requirement-to-evidence matrix covering every FR and NFR category."
  target_platform: "Jcode TUI and shared daemon on supported Linux, macOS, and Windows targets, including legacy and capability-aware clients"
  project_type: "cli"
  performance_goals: "For 1,000 eligible messages, at least 95% of local navigation actions update within 100 ms and at least 95% of normal server-backed actions return visible results within 1 second; 1,000 mixed replay and recovery trials produce zero loss, duplication, or repeated commit."
  constraints:
    - "Preserve the completed jcode-c9u one-shot Alt+Q recall contract as the editor entry path."
    - "Authoritative server queue state remains the source of truth for server-backed soft interrupts."
    - "Reuse the landed message_id, owner_client_instance_id, and SoftInterruptSource fields from jcode-c9u; add only the minimal backward-compatible enqueue sequencing or reservation metadata that the editor actually requires."
    - "Only queued, non-injected, User-source messages with stable identity and the verified requesting client owner are eligible."
    - "Never mutate, reserve, reorder, disclose, cancel, or otherwise affect another client's records, unowned legacy records, system or background interrupts, non-User sources, or injected work."
    - "Every authoritative transition must be atomic, idempotent, replay-safe, disconnect-safe, and image-order preserving."
    - "New arrivals remain outside the active snapshot and concurrent dispatch may proceed only for non-held work."
    - "Persist durable original queued content separately from uncommitted working drafts so abandoned sessions restore originals exactly once."
    - "Use the documented two-anchor, one-anchor, and no-anchor restoration rule and visibly distinguish exact, stale, conflict, replay, boundary, and release outcomes."
    - "Keep protocol and persisted data changes additive and preserve older client and legacy file behavior."
    - "Do not add FZF, slash-command picker, or a second queued-message UI path."
    - "README and in-product help must describe both directions, save-before-move, commit, deletion, images, eligibility, anchoring, boundaries, and conflict feedback consistently."
    - "Serialize Rust builds, tests, Clippy, and guardrail commands on the resource-constrained development machine."
    - "Runtime proof must use the newly built binary on an isolated socket before installed-runtime validation."
  scale_scope: "One small ordered soft-interrupt queue and at most one active navigation session per owning client and Jcode session, with bounded completed-operation replay records and snapshots of up to approximately 1,000 eligible messages."

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "PRIN-001 Surgical, Scope-Bound Changes"
      status: "PASS"
      notes: "The plan extends the existing queue model, recall wire path, persistence store, server control, TUI composer state, capability surface, help, README, and focused tests only. FZF, slash pickers, ordinary history redesign, and unrelated refactors are explicit non-goals."
    - name: "PRIN-002 Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "Wire requests, outcomes, and capability tokens are additive; the persistence reader accepts the existing array format; unowned legacy entries fail closed; legacy clients retain one-shot recall, Enter, history, cancellation, and ordinary queue behavior."
    - name: "PRIN-003 Explicit Configuration Precedence"
      status: "N/A"
      notes: "No setting or configuration precedence path is introduced. Capability discovery and active editor state determine behavior."
    - name: "PRIN-004 Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "jcode-agent-runtime owns stable queue record fields, jcode-protocol owns cross-process contracts, jcode-base owns persistence, jcode-app-core owns authoritative reservations and recovery, jcode-tui owns composer presentation, and harness/SDK crates expose capability-aware contracts without duplicating server logic."
    - name: "PRIN-005 Focused Behavioral Tests"
      status: "PASS"
      notes: "Each FR and NFR will map to focused protocol, persistence, server, TUI, regression, SDK, format/check, private-socket, installed-runtime, and cleanup evidence, with justified N/A cells only where a category cannot exercise the requirement."
    - name: "PRIN-006 Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "Verified client identity, session ownership, stable message and operation IDs, lifecycle eligibility, persistence versions, and replay inputs are validated. Boundaries, stale placement, conflicts, unsupported peers, and recovery failures are visible while complete drafts remain recoverable."
    - name: "PRIN-007 Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "The final phase requires focused checks, formatting, affected package checks, Clippy as applicable, a TUI build, scripts/check_guardrails.sh, runtime evidence, and cleanup inspection before delivery."
    - name: "PRIN-008 Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The design extends Ariel's landed jcode-c9u workflow and canonical queue rather than importing a parallel picker or speculative abstraction."
    - name: "PRIN-009 Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "The plan includes compatibility, failure recovery, end-to-end runtime proof, installed verification, and cleanup so delivery reaches safe user-visible editing rather than stopping at compilation."
    - name: "PRIN-010 Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "The plan uses explicit 100 ms and 1 second responsiveness targets, 1,000-trial reliability evidence, serialized narrow checks, a freshly built private socket, and installed-runtime verification against the actual served binary."

research_findings:
  decisions:
    - topic: "Local editor representation"
      decision: "Replace index-only local editing with a small ordered editor session containing held drafts, current selection, and exact text plus ordered images."
      rationale: "The current queued_message_edit_index and String-only queued_messages path can move older but cannot navigate newer or preserve per-message images. A dedicated transient state gives symmetric save-before-move behavior without changing ordinary queue history."
      alternatives_considered:
        - "Continue removing and reinserting Strings by mutable queue index"
        - "Add a second stack only for newer traversal"
        - "Open a picker over queued text"
    - topic: "Authoritative reservation model"
      decision: "Reuse the landed jcode-c9u message identity, verified owner, and source fields. Atomically remove the complete eligible snapshot from the dispatchable queue into one session-scoped server reservation while retaining immutable originals and anchors as authoritative recovery data; add only minimal enqueue sequencing metadata needed to distinguish post-snapshot arrivals."
      rationale: "A stable snapshot excludes new arrivals, prevents held dispatch, enables deterministic bidirectional traversal, and gives commit, delete, release, and disconnect one atomic ownership boundary."
      alternatives_considered:
        - "Recall one message per keypress"
        - "Let the client own queue indexes"
        - "Cancel and recreate messages around every navigation step"
    - topic: "Durable reservation persistence"
      decision: "Evolve the per-session soft-interrupt file to a versioned envelope that atomically stores dispatchable queue records and active navigation recovery records, while deserializing legacy arrays."
      rationale: "One file replacement avoids a crash window between queue removal and reservation persistence. Original durable content survives restart, while working drafts remain distinguishable and abandoned sessions can restore originals exactly once."
      alternatives_considered:
        - "Separate queue and reservation files"
        - "Memory-only reservations"
        - "Persist only uncommitted client drafts"
    - topic: "Concurrency anchoring"
      decision: "Capture nearest non-held predecessor and successor identities plus a snapshot boundary generation; restore between surviving anchors, adjacent to the one survivor on the original side, or between pre-snapshot survivors and post-snapshot arrivals when neither survives."
      rationale: "This directly implements FR-013 through FR-017, preserves all required relative orders, and makes impossible exact placement deterministic and visibly stale rather than silently arbitrary."
      alternatives_considered:
        - "Restore by absolute numeric index"
        - "Always prepend held records"
        - "Always append held records"
    - topic: "Operation and replay contract"
      decision: "Use a stable navigation_session_id plus unique operation_id and request fingerprint for start, move/save, finish, and release operations; cache bounded completed outcomes by owner, session, and operation identity."
      rationale: "Stable identities allow exact replay after response loss or reconnect, reject conflicting operation reuse, prevent cross-client continuation, and avoid repeated reservation or commit."
      alternatives_considered:
        - "Reuse only transport request IDs"
        - "Sequence numbers without operation identities"
        - "Unbounded replay history"
    - topic: "Wire surface"
      decision: "Add one typed queued_message_editor request with an operation enum and one authoritative queued_message_editor_result event carrying explicit outcome, selection, draft, stale placement, and capability-safe error data."
      rationale: "A typed operation family keeps related transitions consistent, minimizes enum growth, supports all required outcomes, and remains additive for legacy peers."
      alternatives_considered:
        - "Separate request and event variants for every transition"
        - "Overload RecallSoftInterrupt with optional fields"
        - "Encode outcomes in generic Error strings"
    - topic: "Capability compatibility"
      decision: "Advertise a stable queued_message_navigation_v1 capability through the supported daemon and SDK capability surface; the TUI uses server navigation only when present and otherwise preserves legacy one-shot behavior."
      rationale: "New clients must not send unsupported operations and old clients must continue operating against newer servers. A named capability is explicit and testable across Rust and Go compatibility validation."
      alternatives_considered:
        - "Infer support from server version"
        - "Optimistically send and parse generic errors"
        - "Change legacy recall semantics in place"
    - topic: "Images and empty-draft semantics"
      decision: "Treat every draft as text plus an ordered Vec of image payload pairs; deletion occurs only when both are empty."
      rationale: "This preserves byte identity and order across traversal and correctly treats images-only drafts as committable content."
      alternatives_considered:
        - "Text-only draft state"
        - "Delete when text is empty regardless of images"
        - "Store images in a session-global side list"
    - topic: "Disconnect and timeout behavior"
      decision: "Bind active reservations to verified client identity and connection lifecycle. A transport disconnect starts a bounded recovery grace period in which the same owner may reconnect and replay or continue; grace expiry, explicit abandonment, shutdown recovery, or unsupported continuation releases immutable originals exactly once."
      rationale: "Transient transport loss should not destroy an active editing journey, but uncommitted edits must never become durable queue mutations and durable originals must never remain permanently held or become injected during recovery."
      alternatives_considered:
        - "Commit the latest draft automatically on disconnect"
        - "Keep reservations indefinitely"
        - "Drop held records during server restart"
    - topic: "Verification strategy"
      decision: "Create a requirement-to-evidence matrix and validate in layers: protocol, persistence, server, TUI, regressions, SDK capability, format/check, private socket, installed runtime, then cleanup."
      rationale: "The specification explicitly requires complete traceability and runtime truth. Layered checks isolate faults while the final runtime and cleanup steps prove the user-facing outcome safely."
      alternatives_considered:
        - "Rely on broad cargo test only"
        - "Stop after cargo build"
        - "Use the shared daemon for initial experiments"


data_model:
  entities:
    - name: "QueuedUserMessage"
      description: "A local queued draft or authoritative queued User soft interrupt eligible for editing."
      fields:
        - name: "message_id"
          type: "Option<String> locally, required String for authoritative eligibility"
          description: "Stable identity used for reservation, anchors, replay, commit, and recovery."
          constraints: "Unique within a session; legacy None records are never server-editor eligible."
        - name: "owner_client_instance_id"
          type: "Option<String>"
          description: "Verified client owner for authoritative records."
          constraints: "Must exactly match the requesting client for all server editor operations."
        - name: "source"
          type: "SoftInterruptSource"
          description: "User, System, or BackgroundTask source classification."
          constraints: "Only User is eligible."
        - name: "enqueue_sequence"
          type: "Option<u64>"
          description: "Monotonic enqueue generation used to separate pre-snapshot survivors from post-snapshot arrivals."
          constraints: "New records receive a value; legacy None records remain ordinary pre-snapshot queue entries and are never made editor-eligible solely by migration."
        - name: "content"
          type: "String"
          description: "Message text."
          constraints: "May be empty when images are present or when intentionally saved for deletion."
        - name: "images"
          type: "Vec<(String, String)>"
          description: "Ordered image payloads in the existing protocol representation."
          constraints: "Order, count, and bytes are preserved unless explicitly edited."
      relationships:
        - target: "NavigationSession"
          type: "many-to-one"
          description: "Eligible authoritative messages may be reserved by at most one active owner session."
        - target: "QueueAnchor"
          type: "one-to-many"
          description: "A message identity may serve as a neighboring restoration anchor."
    - name: "NavigationSession"
      description: "Client-owned editing context over one stable ordered eligible snapshot."
      fields:
        - name: "navigation_session_id"
          type: "String"
          description: "Stable identity reused across reconnect and every editor operation."
          constraints: "Globally unpredictable, non-empty, and bound to one Jcode session plus owner client."
        - name: "owner_client_instance_id"
          type: "String"
          description: "Verified client permitted to navigate, finish, or release the session."
          constraints: "Cross-client operations are rejected without draft disclosure."
        - name: "snapshot_message_ids"
          type: "Vec<String>"
          description: "Oldest-to-newest stable eligible snapshot captured at start."
          constraints: "Immutable for session lifetime; excludes post-snapshot arrivals."
        - name: "selected_index"
          type: "usize"
          description: "Current selected held draft."
          constraints: "Within snapshot bounds; start selects newest."
        - name: "snapshot_queue_sequence"
          type: "u64"
          description: "Highest enqueue generation present when navigation starts."
          constraints: "Used only for deterministic restoration partitioning."
        - name: "state"
          type: "Active | Finishing | Released"
          description: "Lifecycle state used for replay and cleanup."
          constraints: "Terminal outcomes cannot be mutated again."
        - name: "expires_at"
          type: "Option<Timestamp>"
          description: "Abandonment deadline for release cleanup."
          constraints: "Expiry releases originals, never working drafts."
      relationships:
        - target: "HeldDraft"
          type: "one-to-many"
          description: "Owns an ordered draft for every snapshotted message."
        - target: "QueueAnchor"
          type: "one-to-many"
          description: "Owns the restoration anchors captured at snapshot time."
        - target: "OperationOutcome"
          type: "one-to-many"
          description: "Owns bounded replay-safe outcomes for editor operations."
    - name: "HeldDraft"
      description: "Original durable record and current editable working copy for one held message."
      fields:
        - name: "message_id"
          type: "String"
          description: "Identity of the reserved queued message."
          constraints: "Must occur exactly once in the parent snapshot."
        - name: "original_content"
          type: "String"
          description: "Pre-session text restored on abandonment."
          constraints: "Immutable during the navigation session."
        - name: "original_images"
          type: "Vec<(String, String)>"
          description: "Pre-session ordered images restored on abandonment."
          constraints: "Immutable and byte preserving."
        - name: "draft_content"
          type: "String"
          description: "Latest text saved before navigation or finish."
          constraints: "May be empty."
        - name: "draft_images"
          type: "Vec<(String, String)>"
          description: "Latest ordered image working copy."
          constraints: "May be empty; images-only remains non-empty for commit semantics."
        - name: "original_relative_index"
          type: "usize"
          description: "Stable ordering among held records."
          constraints: "Unique and contiguous within the snapshot."
        - name: "dirty"
          type: "bool"
          description: "Whether working content differs from the original."
          constraints: "Diagnostic only; commit semantics use actual draft content."
      relationships:
        - target: "QueuedUserMessage"
          type: "one-to-one"
          description: "Represents one reserved authoritative or local queued message."
    - name: "QueueAnchor"
      description: "Original neighboring non-held identity and snapshot boundary metadata used for deterministic restoration."
      fields:
        - name: "predecessor_message_id"
          type: "Option<String>"
          description: "Nearest record immediately before the held region at snapshot time."
          constraints: "May refer to any excluded or eligible non-held queue record; content is not disclosed to the client."
        - name: "successor_message_id"
          type: "Option<String>"
          description: "Nearest record immediately after the held region at snapshot time."
          constraints: "May refer to any excluded or eligible non-held queue record; content is not disclosed to the client."
        - name: "snapshot_queue_sequence"
          type: "u64"
          description: "Boundary separating pre-snapshot survivors and post-snapshot arrivals."
          constraints: "Stable for one navigation session."
      relationships:
        - target: "NavigationSession"
          type: "many-to-one"
          description: "Anchors belong to one captured snapshot."
    - name: "OperationOutcome"
      description: "Replayable authoritative result for one owner-scoped editor operation."
      fields:
        - name: "operation_id"
          type: "String"
          description: "Stable caller-owned idempotency identity."
          constraints: "Unique per navigation session and request fingerprint."
        - name: "request_fingerprint"
          type: "String"
          description: "Hash of operation kind and relevant payload."
          constraints: "Conflicting reuse of operation_id with a different fingerprint is rejected."
        - name: "kind"
          type: "Started | Moved | Boundary | Committed | Deleted | Released | StalePlacement | Conflict | Replay"
          description: "Machine-readable and user-visible outcome category."
          constraints: "Exactly one terminal category per completed operation."
        - name: "selected_message_id"
          type: "Option<String>"
          description: "Current selection when safe to disclose to the owning client."
          constraints: "Never disclosed across owners."
        - name: "draft"
          type: "Option<RecallableSoftInterrupt>"
          description: "Exact selected text and ordered images for the owner."
          constraints: "Present only for outcomes that retain or change selection."
        - name: "placement"
          type: "Exact | StaleBestEffort | NotApplied"
          description: "Whether restoration matched original anchors, used fallback, or was rejected."
          constraints: "Conflicts use NotApplied and preserve the recoverable draft."
      relationships:
        - target: "NavigationSession"
          type: "many-to-one"
          description: "Cached in a bounded owner and session scoped replay history."

api_contracts:
  endpoints:
    - method: "WIRE"
      path: "queued_message_editor"
      description: "Start, move within, finish, or release one client-owned authoritative queued-message navigation session using stable replay identities."
      request:
        content_type: "application/json"
        body_schema: "{ type: queued_message_editor, id: u64, navigation_session_id: string, operation_id: string, operation: { kind: start } | { kind: move, direction: older|newer, selected_message_id: string, draft: { content: string, images: [[string,string], ...] } } | { kind: finish, selected_message_id: string, draft: { content: string, images: [[string,string], ...] } } | { kind: release } }"
      response:
        success_code: 200
        body_schema: "{ type: queued_message_editor_result, id: u64, navigation_session_id: string, operation_id: string, outcome: started|moved|boundary|committed|deleted|released|stale_placement|conflict|replay, selection: { message_id: string, content: string, images: [[string,string], ...], older_available: bool, newer_available: bool }|null, placement: exact|stale_best_effort|not_applied, message: string|null }"
      errors:
        - code: 400
          description: "Malformed identity, unsupported operation shape, invalid selected message, or persistence validation failure."
        - code: 403
          description: "Verified client does not own the navigation session; no held content is disclosed or changed."
        - code: 409
          description: "Conflicting operation replay, stale selection, changed eligibility, unsafe commit, or another active reservation prevents the operation; the owning client's full draft remains recoverable."
        - code: 501
          description: "Peer does not advertise queued_message_navigation_v1; the client preserves legacy one-shot behavior."
    - method: "CAPABILITY"
      path: "queued_message_navigation_v1"
      description: "Advertise support for the bidirectional editor request, explicit outcomes, ordered images, owner isolation, anchoring, replay, release, and recovery contract."
      request:
        content_type: "application/json"
        body_schema: "Existing client or SDK handshake and capability query."
      response:
        success_code: 200
        body_schema: "Capability list contains queued_message_navigation_v1 when all required operation and outcome semantics are supported."
      errors:
        - code: 404
          description: "Capability absent on legacy peers; clients must not issue editor operations and must retain legacy behavior."

