feature:
  branch: "023-queued-message-editor"
  created: "2026-09-01"
  status: "Draft"
  input: >-
    Extend the landed Alt+Q server soft-interrupt recall into a bidirectional queued-message editor. Lowercase Alt+Q moves to the next older queued user message even while a recalled draft occupies the composer, first saving that draft and its ordered images. Alt+Shift+Q moves toward the next newer message. Enter commits the selected draft and exits editing while all other held messages return to their original relative queue positions; clearing the selected draft then Enter deletes only that selected message. Cover local queue mode and authoritative server-backed soft interrupts. Server navigation must be client-owned, User-source-only, atomic, idempotent, replay-safe, disconnect-safe, image-preserving, and must not touch other clients, unowned legacy entries, system/background interrupts, or already injected work. Concurrent dispatch and newly queued messages need a deterministic documented best-effort anchoring rule with visible stale/conflict feedback and no silent loss or duplication. Preserve existing one-shot Alt+Q, CancelSoftInterrupts, Enter, and history behavior. Document the feature in README and in-product help. Treat FZF and a slash picker as non-goals because they do not solve authoritative reservation/order and would create a second UI path before the navigation contract is stable. Bead jcode-egd, related to completed jcode-c9u. Map every requirement to focused protocol, persistence, server, TUI, regression, SDK capability, format/check, private-socket, installed-runtime, and cleanup evidence.

user_stories:
  - id: "US-001"
    title: "Navigate and revise queued local messages"
    priority: "P1"
    as_a: "terminal user with several locally queued messages"
    i_want: "to move backward and forward through queued drafts while preserving each draft and its images"
    so_that: "I can correct an earlier queued instruction without losing later work"
    why_this_priority: "Bidirectional editing is the primary user-visible capability."
    independent_test: "Queue three local user messages with distinct text and ordered images, navigate older and newer, edit each, and verify every draft remains associated with its original images."
    acceptance_scenarios:
      - given: "three local user messages are queued and the composer is empty"
        when: "the user presses Alt+Q twice"
        then: "the newest message is recalled first, its edited draft is saved, and the next older message becomes selected"
      - given: "the user has moved to an older selected message"
        when: "the user presses Alt+Shift+Q"
        then: "the current draft is saved and the next newer held message becomes selected"

  - id: "US-002"
    title: "Safely edit authoritative server soft interrupts"
    priority: "P0"
    as_a: "client connected to a session with server-backed queued soft interrupts"
    i_want: "navigation to reserve only my eligible queued user messages"
    so_that: "editing cannot alter, inject, lose, or duplicate unrelated queued work"
    why_this_priority: "Cross-client isolation and authoritative queue correctness are critical data-safety properties."
    independent_test: "Interleave owned user messages with another client's messages, legacy unowned entries, background and system interrupts, and injected work, then navigate and verify only eligible owned user messages are held or changed."
    acceptance_scenarios:
      - given: "the authoritative queue contains mixed owners, sources, and lifecycle states"
        when: "one client starts queued-message navigation"
        then: "only that client's queued, non-injected User-source messages participate"
      - given: "a navigation request is replayed after its result was applied"
        when: "the server handles the repeated operation"
        then: "the original result is returned without an additional reservation, mutation, loss, or duplicate"

  - id: "US-003"
    title: "Commit or delete one selected message"
    priority: "P1"
    as_a: "user editing a selected queued message"
    i_want: "Enter to commit the selected draft, or delete it when I intentionally clear it"
    so_that: "the chosen message changes while every other held message keeps its queue relationship"
    why_this_priority: "A predictable commit boundary is essential to making navigation useful and safe."
    independent_test: "Edit one selected message and commit, then repeat with a fully cleared selected draft; verify only the selected record changes or is removed and all other held records retain relative order."
    acceptance_scenarios:
      - given: "a non-empty selected draft and other held messages"
        when: "the user presses Enter"
        then: "the selected message is updated, editing ends, and all other held messages return in their original relative order"
      - given: "the selected draft has no text and no images"
        when: "the user presses Enter"
        then: "only the selected message is deleted and editing ends"

  - id: "US-004"
    title: "Resolve concurrent queue changes visibly"
    priority: "P0"
    as_a: "user editing while dispatch or new queue activity occurs"
    i_want: "deterministic best-effort placement and explicit stale or conflict feedback"
    so_that: "I never mistake silent loss, duplication, or unexpected reordering for a successful edit"
    why_this_priority: "Concurrency ambiguity can corrupt user intent in an authoritative queue."
    independent_test: "Exercise commits after adjacent anchors dispatch, after new messages arrive, and after eligibility changes; verify deterministic placement or visible rejection with the draft preserved."
    acceptance_scenarios:
      - given: "one or both original placement anchors no longer exist at commit time"
        when: "the user commits the selected draft"
        then: "the documented fallback rule is used and the user sees stale placement feedback"
      - given: "the selected message can no longer be safely committed"
        when: "the commit is attempted"
        then: "the edit is rejected visibly and the complete text and ordered images remain recoverable"

  - id: "US-005"
    title: "Retain established keyboard and queue behavior"
    priority: "P1"
    as_a: "existing Alt+Q and queue workflow user"
    i_want: "one-shot recall, cancellation, Enter submission, and composer history behavior to remain familiar"
    so_that: "the editor adds navigation without breaking established workflows"
    why_this_priority: "The feature extends a landed workflow and must not regress its existing contract."
    independent_test: "Run the pre-feature one-shot Alt+Q, CancelSoftInterrupts, ordinary Enter, and history regression scenarios outside an active navigation session."
    acceptance_scenarios:
      - given: "no queued-message navigation session is active"
        when: "the user uses Alt+Q, Enter, cancellation, or history as before"
        then: "the established behavior and eligibility rules remain unchanged"

  - id: "US-006"
    title: "Understand and verify the navigation contract"
    priority: "P2"
    as_a: "user, SDK integrator, or release maintainer"
    i_want: "consistent capability reporting, documentation, and requirement-linked evidence"
    so_that: "I can discover, integrate, and trust the feature across supported runtime paths"
    why_this_priority: "Clear discovery and end-to-end evidence reduce rollout and compatibility risk."
    independent_test: "Verify capability discovery, README and in-product help, then inspect the evidence matrix for every requirement and supported runtime path."
    acceptance_scenarios:
      - given: "a user opens in-product help"
        when: "they inspect queued-message controls"
        then: "both navigation directions, commit and delete behavior, boundaries, and conflict feedback are explained"

requirements:
  functional:
    - id: "FR-001"
      description: "The product MUST preserve the established one-shot Alt+Q entry behavior and use it to select the newest eligible queued user message when navigation begins."
      acceptance_criteria: "Existing one-shot regression scenarios pass, and the first selected item is the newest eligible message."
    - id: "FR-002"
      description: "While queued-message editing is active, lowercase Alt+Q MUST first save the selected draft's current text and ordered images, then move to the next older eligible held message."
      acceptance_criteria: "After repeated older navigation, returning to each visited item reproduces its latest text and image order exactly."
    - id: "FR-003"
      description: "While queued-message editing is active, Alt+Shift+Q MUST first save the selected draft's current text and ordered images, then move to the next newer eligible held message."
      acceptance_criteria: "Newer navigation traverses held items in reverse of older navigation without discarding edits."
    - id: "FR-004"
      description: "Navigation at the oldest or newest available boundary MUST keep the current selection and draft unchanged and provide visible boundary feedback."
      acceptance_criteria: "A boundary keypress causes no queue mutation, selection change, image change, loss, or duplicate."
    - id: "FR-005"
      description: "Local queue mode MUST support the same older, newer, save, commit, delete, boundary, text, and ordered-image behavior as authoritative server mode wherever server ownership semantics do not apply."
      acceptance_criteria: "Equivalent local and server-backed user scenarios produce the same composer-visible results and final eligible-message order."
    - id: "FR-006"
      description: "Authoritative server navigation MUST include only queued, non-injected, User-source soft interrupts owned by the requesting client."
      acceptance_criteria: "Mixed-source and mixed-owner tests show that every participating item satisfies all eligibility conditions."
    - id: "FR-007"
      description: "Each authoritative navigation, save, commit, delete, release, and cancellation transition MUST be atomic with respect to the affected eligible records."
      acceptance_criteria: "Observers can see only the state before or after each transition, never a partial hold, partial restore, partial edit, or partial delete."
    - id: "FR-008"
      description: "Authoritative operations MUST be idempotent and replay-safe for a stable navigation session and operation identity."
      acceptance_criteria: "Repeating any completed request one or more times returns an equivalent result and creates no additional mutation, item, reservation, dispatch, loss, or duplicate."
    - id: "FR-009"
      description: "A disconnect or abandoned navigation session MUST release held messages without applying an uncommitted selected draft and MUST restore all authoritative held messages according to the anchoring rule."
      acceptance_criteria: "Forced disconnect tests leave no durable reservation and restore each held server message exactly once with its pre-session content and images."
    - id: "FR-010"
      description: "Text and all attached images, including image order, MUST be preserved on navigation, save, commit, release, replay, reconnect recovery, and conflict paths."
      acceptance_criteria: "Distinct multi-image fixtures retain byte identity, count, and ordering through every supported path unless the user explicitly edits or removes them."
    - id: "FR-011"
      description: "Enter during active editing with a non-empty selected draft MUST commit only that selected draft, exit editing, and return every other held message to its original relative queue order."
      acceptance_criteria: "A commit changes only the selected message content, retains one instance of every other held message, and ends navigation."
    - id: "FR-012"
      description: "Enter during active editing when the selected draft contains neither text nor images MUST delete only that selected queued message, exit editing, and restore every other held message."
      acceptance_criteria: "Exactly the selected record is absent afterward; all other held records remain once and in original relative order."
    - id: "FR-013"
      description: "At authoritative navigation start, the product MUST capture a stable ordered eligible-message snapshot and the nearest surrounding non-held queue anchors needed for deterministic best-effort restoration."
      acceptance_criteria: "The same starting queue and concurrent event sequence always yields the same snapshot, anchors, and final placement."
    - id: "FR-014"
      description: "Restoration MUST place held messages between the nearest surviving original predecessor and successor anchors; if only one survives, messages MUST remain adjacent on their original side; if neither survives, pre-snapshot survivors MUST stay ahead of post-snapshot arrivals and held messages MUST occupy the boundary between those groups."
      acceptance_criteria: "Tests for two, one, and zero surviving anchors match the documented rule while preserving held-message relative order."
    - id: "FR-015"
      description: "Messages queued after a navigation snapshot MUST NOT be added to that active navigation session and MUST retain their relative order with one another."
      acceptance_criteria: "New arrivals never appear during navigation and remain once, in arrival order, after commit, delete, release, or disconnect."
    - id: "FR-016"
      description: "Concurrent dispatch MAY continue for non-held work, but a held authoritative message MUST NOT be dispatched or injected until it is committed, deleted, or released."
      acceptance_criteria: "Concurrent dispatch tests inject eligible non-held work normally and never inject a reserved held record."
    - id: "FR-017"
      description: "When exact original placement is no longer possible, the product MUST apply the deterministic best-effort anchor rule and show visible stale-placement feedback; when safe commit is impossible, it MUST reject visibly while preserving the complete draft for retry or recovery."
      acceptance_criteria: "Every simulated stale or conflict outcome is visible and results in either one deterministic placement or a recoverable unchanged draft, with no silent success."
    - id: "FR-018"
      description: "Navigation and editing MUST NOT mutate, reserve, reorder, cancel, or otherwise affect another client's entries, unowned legacy entries, system or background interrupts, non-User sources, or already injected work."
      acceptance_criteria: "Before-and-after identity, content, state, and relative-order comparisons for excluded records are unchanged by every editor operation."
    - id: "FR-019"
      description: "The existing CancelSoftInterrupts operation MUST retain its established eligibility, result, and idempotence behavior, including when editor-capable clients exist."
      acceptance_criteria: "All prior cancellation contract and regression scenarios pass without broadening the set of cancellable records."
    - id: "FR-020"
      description: "Ordinary Enter submission and composer history behavior outside active queued-message editing MUST remain unchanged, and editor traversal MUST NOT create ordinary history entries until the selected edit is committed under the established history policy."
      acceptance_criteria: "Existing Enter and history tests pass, and navigation-only activity adds no unexpected history records."
    - id: "FR-021"
      description: "Server-backed navigation MUST be scoped to a client-owned navigation session that cannot be continued, committed, released, or replayed by another client."
      acceptance_criteria: "Cross-client attempts are rejected without revealing or changing held draft content or queue state."
    - id: "FR-022"
      description: "Persistence and recovery MUST distinguish active reservations from durable queued content so restart, replay, timeout, and disconnect cleanup cannot turn a held item into loss, duplication, or injected work."
      acceptance_criteria: "Recovery scenarios restore each durable held item exactly once and leave no active reservation after its owning session is gone."
    - id: "FR-023"
      description: "The supported SDK capability surface MUST let clients detect bidirectional queued-message navigation support and represent all required navigation outcomes, including success, boundary, stale placement, conflict, replay, and release."
      acceptance_criteria: "Capability-aware clients can avoid unsupported operations, and compatibility tests cover both capable and legacy peers without changing legacy behavior."
    - id: "FR-024"
      description: "README documentation and in-product help MUST describe Alt+Q older navigation, Alt+Shift+Q newer navigation, save-before-move behavior, Enter commit, empty-draft deletion, image preservation, boundaries, eligibility, concurrency anchoring, and stale/conflict feedback."
      acceptance_criteria: "A documentation review finds every listed behavior in both required documentation surfaces with no contradictory key binding or queue rule."
    - id: "FR-025"
      description: "The feature MUST use the keyboard navigation path only; FZF and slash-command picker interfaces MUST NOT be introduced as part of this scope."
      acceptance_criteria: "No new picker entry point exists, and all supported queued-message editing scenarios are reachable through the documented composer keys."
    - id: "FR-026"
      description: "Every functional and non-functional requirement MUST map to focused protocol, persistence, server, TUI, regression, SDK capability, format/check, private-socket, installed-runtime, and cleanup evidence, with an explicit justified not-applicable entry where a category cannot exercise that requirement."
      acceptance_criteria: "A requirement-to-evidence matrix has no blank requirement-category cells, links each applicable cell to a focused result, and records a rationale for every not-applicable cell."
    - id: "FR-027"
      description: "Verification cleanup MUST remove test reservations, queued fixtures, private runtime endpoints, temporary state, and navigation sessions without altering unrelated user or server state."
      acceptance_criteria: "Post-verification inspection finds no feature-created active reservation, queued fixture, temporary endpoint, or orphaned process, while unrelated baseline state remains unchanged."

  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Queue editing outcomes must be exactly-once from the user's perspective across retries, duplicate requests, reconnects, and server recovery."
      measurable_target: "Across 1,000 mixed replay and recovery trials, zero messages are silently lost, duplicated, or committed more than once."
    - id: "NFR-002"
      category: "security"
      description: "Client ownership and source eligibility must provide complete isolation from excluded queue records."
      measurable_target: "Across the full cross-client and mixed-source test matrix, 100% of unauthorized operations are rejected and zero excluded records change."
    - id: "NFR-003"
      category: "usability"
      description: "Navigation, boundary, stale, conflict, commit, and delete outcomes must be apparent without requiring users to inspect logs or server state."
      measurable_target: "Every outcome category produces distinct visible feedback in acceptance testing, and no destructive result is reported as an ordinary successful navigation."
    - id: "NFR-004"
      category: "performance"
      description: "Queued-message navigation must remain responsive for realistically large user queues without blocking unrelated queue progress."
      measurable_target: "For a queue of 1,000 eligible user messages, 95% of local navigation actions update within 100 ms and 95% of server-backed actions show a result within 1 second under normal operating conditions."
    - id: "NFR-005"
      category: "code_quality"
      description: "The navigation contract and its compatibility boundaries must be reviewable through complete requirement traceability and focused checks."
      measurable_target: "100% of requirements have complete evidence-matrix coverage, all required format and check gates pass, and no unexplained not-applicable evidence entries remain."
    - id: "NFR-006"
      category: "reliability"
      description: "The feature must remain backward compatible with clients and persisted entries that predate navigation ownership metadata."
      measurable_target: "100% of legacy compatibility scenarios preserve prior behavior, and zero unowned legacy entries become navigable or mutable through the editor."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can revise any eligible queued message by moving in both directions without losing draft text or image order."
      metric: "Successful completion rate across local and server-backed multi-message editing journeys"
      target: "100% of acceptance journeys preserve all unmodified text and ordered images"
    - id: "SC-002"
      description: "A committed or deleted selection changes only the intended message while all other held messages retain their relative queue order."
      metric: "Queue identity and ordering comparison before and after commit or delete"
      target: "Zero unintended record changes, losses, duplicates, or relative-order violations across the acceptance matrix"
    - id: "SC-003"
      description: "Concurrent dispatch, new arrivals, retries, disconnects, and recovery produce deterministic or visibly rejected outcomes."
      metric: "Concurrency and recovery scenarios with silent or ambiguous outcomes"
      target: "0 silent outcomes and 100% match to the documented anchoring or conflict rule"
    - id: "SC-004"
      description: "Existing one-shot recall, cancellation, Enter, history, legacy-client, and excluded-entry behavior remains intact."
      metric: "Pass rate of pre-existing and added compatibility regressions"
      target: "100% pass rate with zero broadened eligibility"
    - id: "SC-005"
      description: "Users can discover and understand the editor without a second picker workflow."
      metric: "Documentation coverage and task completion in a guided usability review"
      target: "All required behaviors appear in README and help, and at least 90% of reviewers complete older, newer, commit, and delete tasks without external guidance"
    - id: "SC-006"
      description: "Release evidence demonstrates the same safe behavior in isolated and installed user-facing runtimes."
      metric: "Completed requirement-evidence cells and unresolved cleanup findings"
      target: "100% evidence coverage and zero unresolved cleanup findings"

key_entities:
  - name: "Queued User Message"
    description: "A user-authored message waiting for local dispatch or represented as an authoritative queued soft interrupt."
    attributes:
      - "stable identity"
      - "client owner"
      - "source"
      - "lifecycle state"
      - "text"
      - "ordered images"
      - "queue position"
  - name: "Navigation Session"
    description: "A client-owned editing context that tracks the eligible snapshot, held messages, current selection, and replay-safe operations."
    attributes:
      - "owning client"
      - "stable session identity"
      - "ordered eligible snapshot"
      - "current selection"
      - "operation outcomes"
      - "active or released state"
  - name: "Held Draft"
    description: "The recoverable editable representation of one reserved queued user message during navigation."
    attributes:
      - "original message identity"
      - "current text"
      - "ordered images"
      - "original relative position"
      - "dirty state"
  - name: "Queue Anchor"
    description: "A surviving neighboring queue record or snapshot boundary used to restore held messages deterministically."
    attributes:
      - "predecessor identity"
      - "successor identity"
      - "snapshot boundary"
      - "survival state"
  - name: "Navigation Outcome"
    description: "The user-visible result of a replay-safe editor operation."
    attributes:
      - "success"
      - "boundary"
      - "stale placement"
      - "conflict"
      - "replay"
      - "release"

edge_cases:
  - scenario: "The user navigates with only one eligible queued message."
    expected_behavior: "Both directions preserve the selected draft and show boundary feedback without changing queue state."
  - scenario: "The selected draft contains images but no text."
    expected_behavior: "The draft is non-empty and Enter commits it; deletion requires both text and images to be absent."
  - scenario: "The user removes all text and images, navigates away, returns, and presses Enter."
    expected_behavior: "The saved empty state is restored and only that selected message is deleted."
  - scenario: "An adjacent anchor dispatches while the client is editing."
    expected_behavior: "The nearest surviving anchor fallback is used, stale placement is visible, and every held message appears exactly once."
  - scenario: "Both original anchors disappear and new messages arrive."
    expected_behavior: "Pre-snapshot survivors remain ahead of post-snapshot arrivals, restored held messages occupy their documented boundary, and stale placement is visible."
  - scenario: "The same commit request is delivered repeatedly before and after reconnect."
    expected_behavior: "The selected change is applied at most once and every repeat returns an equivalent recorded outcome."
  - scenario: "A second client attempts to navigate or commit the first client's held message."
    expected_behavior: "The attempt is rejected without content disclosure, reservation change, reordering, or mutation."
  - scenario: "The server restarts while messages are held."
    expected_behavior: "Durable queued content is recovered exactly once, stale reservations are released, and no held item is injected by recovery."
  - scenario: "A held message becomes otherwise ineligible before commit."
    expected_behavior: "Unsafe commit is rejected with visible conflict feedback and the complete draft remains recoverable."
  - scenario: "CancelSoftInterrupts is invoked while editor-capable entries and excluded entries coexist."
    expected_behavior: "Its established eligibility and result remain unchanged, with no new effect on excluded records."
  - scenario: "An older client connects to a server that supports navigation, or a newer client connects to one that does not."
    expected_behavior: "Capability discovery prevents unsupported navigation and preserves the legacy one-shot and queue behavior."

assumptions:
  - "An empty draft means that both text and the ordered image list are empty; an images-only draft is valid and is not deleted by Enter."
  - "The initial Alt+Q entry conditions remain those of the landed one-shot recall; bidirectional key handling begins only after a queued message has been recalled into an active editing session."
  - "Newly queued messages are intentionally excluded from an already active navigation snapshot so navigation remains stable and replayable."
  - "A visible stale-placement notice may accompany a successful deterministic commit, while a conflict indicates that no safe commit was applied."
  - "Best-effort anchoring prioritizes no loss, no duplication, held-message relative order, pre-snapshot survivor order, and post-snapshot arrival order over recreating an impossible absolute position."
  - "Timed-out or disconnected authoritative sessions are treated as abandoned and restore original durable content rather than uncommitted composer edits."

constraints:
  - "The feature extends bead jcode-egd and must remain compatible with the completed jcode-c9u one-shot server soft-interrupt recall behavior."
  - "Authoritative queue state remains the source of truth for server-backed soft interrupts."
  - "Only the owning client may operate an authoritative navigation session."
  - "Excluded records and already injected work are immutable from the queued-message editor's perspective."
  - "All behavior must be documented consistently in README and in-product help."
  - "Release readiness requires focused protocol, persistence, server, TUI, regression, SDK capability, format/check, private-socket, installed-runtime, and cleanup evidence."

out_of_scope:
  - "An FZF-based queued-message picker."
  - "A slash-command queued-message picker."
  - "Editing another client's queued messages."
  - "Editing unowned legacy entries, system interrupts, background interrupts, non-User-source entries, or already injected work."
  - "Pulling messages that arrive after navigation begins into the active navigation snapshot."
  - "Redesigning ordinary composer history, Enter submission, CancelSoftInterrupts, or the landed one-shot Alt+Q entry contract."

