  spec_path: "specs/012-opt-in-launch-hotkeys/spec.yaml"
summary: >-
  Make Linux compositor launch-hotkey mutation an explicit manual action while
  preserving the existing installer, managed-block renderer, backup behavior,
  and unrelated platform behavior. Treat absent and legacy enabled settings
  conservatively on every unattended path, and prove the boundary with focused
  gating, call-site, installer, and user-facing output tests.
technical_context:
  language: "Rust"
  framework: "Cargo workspace with jcode-setup-hints, jcode-base, and root CLI composition"
  primary_dependencies:
    - "jcode-setup-hints Linux compositor adapters and managed-block renderers"
    - "jcode-base Config::bake_launch_hotkeys_once"
    - "src/cli/dispatch.rs startup setup-hint and config-bake call site"
  storage: "User config under ~/.jcode plus compositor-owned config stores; no schema migration"
  testing:
    unit: "Pure LinuxHotkeySetupAction gating tests and setup-hint output assertions"
    integration: "Focused jcode-setup-hints and jcode-base tests plus call-site regression checks"
    runtime: "Newly built isolated-socket or command-level smoke where the Linux path is observable"
  target_platform: "Linux, with macOS and Windows behavior preserved unless shared code requires compatibility checks"
  project_type: "Rust coding-agent CLI and shared server"
  performance_goals: "Remove Linux compositor writes from unattended startup without adding work to the first-frame path"
  constraints:
    - "No new dependencies"
    - "No automatic compositor reloads, backups, or managed-block writes"
    - "Explicit setup-hotkey remains the sole Linux compositor mutation owner"
    - "User-authored compositor content must remain untouched"
  scale_scope: "One compositor setup boundary and its existing startup/config-change callers"
implementation_phases:
  - phase: 1
    name: "Regression contract"
    goal: "Freeze the fail-closed Linux gating contract and prove the current behavior fails it"
    deliverables:
      - "Tests for absent, legacy enabled, disabled, installed, and tracking-version cases"
      - "Call-site assertions that startup and config-change paths do not invoke the Linux installer"
      - "A user-facing output assertion for manual opt-in language"
    dependencies: []
  - phase: 2
    name: "Manual-only Linux mutation"
    goal: "Gate unattended Linux paths while leaving explicit setup-hotkey installation unchanged"
    deliverables:
      - "Linux automatic gate defaults to no-op for absent and legacy enabled settings"
      - "Linux config-change reinstall path is read-only"
      - "Explicit setup-hotkey continues to render, backup before changed writes, reload when required, and remain idempotent"
      - "Comments and config documentation describe the new safety boundary"
    dependencies:
      - 1
  - phase: 3
    name: "Focused delivery validation"
    goal: "Validate the changed surface and record runtime and guardrail evidence"
    deliverables:
      - "Focused package tests and formatting"
      - "Relevant dependency and guardrail checks"
      - "Selfdev build and isolated runtime or deterministic command-level smoke"
      - "Bead comment with exact evidence and remaining platform gaps"
    dependencies:
      - 2
