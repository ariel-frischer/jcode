    likelihood: "medium"
    impact: "high"
    mitigation: "Gate only Linux automatic call sites and run existing cross-platform setup-hint tests."
  - id: "RISK-002"
    risk: "The config-bake thread could still trigger a Linux reinstall indirectly."
    likelihood: "high"
    impact: "high"
    mitigation: "Cover Config bake return handling and the Linux branch of reinstall_launch_hotkeys_after_config_change directly."
  - id: "RISK-003"
    risk: "Manual setup could lose backup or idempotence while automatic code is removed."
    likelihood: "low"
    impact: "high"
    mitigation: "Keep installer functions unchanged where possible and retain focused managed-block and no-op tests."
