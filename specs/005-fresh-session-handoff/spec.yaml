feature:
  branch: "005-fresh-session-handoff"
  created: "2026-08-10"
  status: "Draft"
  input: >-
    Implement Bead jcode-ggj fresh-session handoff from docs/proposals/FRESH_SESSION_HANDOFF.md. Build manual /handoff and default-enabled model-callable session_transition, clean child session semantics, same-client TUI reattachment, optional blank/new action, deferred safe-boundary execution after source turn persistence, idempotency, chain limits, global config and session-profile overrides, both inline instructions and instructions_file dynamically appended to the normal instruction stack only when enabled, Bead-oriented startup context, tests-first, docs/changelog, selfdev build and isolated-socket runtime acceptance. Reuse existing session/profile/protocol/startup-submission machinery and do not copy conversation, compaction, provider IDs, pending tools, or approvals.

user_stories:
  - id: "US-001"
    title: "Manually start a fresh-session handoff"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "to invoke /handoff with an optional next goal or prompt and move the current TUI into a clean child session"
    so_that: "I can begin a separately specifiable task without carrying stale conversation context"
    why_this_priority: "Manual handoff is the foundational user workflow and provides a safe way to validate clean-session semantics."
    independent_test: "Invoke /handoff with a prompt in a controlled TUI session and verify the client is attached to a child with only the intended startup content."
    acceptance_scenarios:
      - given: "An active session and a separately specifiable next task"
        when: "The user invokes /handoff with an explicit prompt"
        then: "A child session is created with empty prior conversation, the prompt is available as its startup content, and the same TUI client is attached to the child."
      - given: "An active session and no next-task prompt"
        when: "The user invokes /handoff without an explicit prompt"
        then: "The system creates an editable, bounded handoff draft or reports that no usable handoff content could be generated."

  - id: "US-002"
    title: "Let the agent request a bounded self-handoff"
    priority: "P1"
    as_a: "Jcode agent"
    i_want: "to call session_transition after a verified task boundary"
    so_that: "I can continue sequential work in a fresh context without requiring a separate coordinator session"
    why_this_priority: "Agent-initiated continuation is a central requested capability and must work without weakening lifecycle safety."
    independent_test: "Expose the tool in a normal session, submit a handoff request, and verify that it returns an accepted transition ID while the source turn continues normally."
    acceptance_scenarios:
      - given: "The handoff capability is enabled and the agent has completed a bounded task"
        when: "The agent calls session_transition with action=handoff and auto_start=true"
        then: "The request is accepted, identified, and deferred until the source turn reaches a safe boundary before the child starts."
      - given: "The handoff capability is disabled for agent invocation but manual handoff remains enabled"
        when: "The agent attempts to call session_transition"
        then: "The tool is unavailable or returns an actionable disabled error, while /handoff remains usable."

  - id: "US-003"
    title: "Start an intentionally blank session"
    priority: "P1"
    as_a: "Jcode user or agent"
    i_want: "to choose the new action instead of a prompted handoff"
    so_that: "I can switch to a completely blank session when no transition brief is appropriate"
    why_this_priority: "The requested blank/new action is a distinct user-visible semantic and must not accidentally become a fork."
    independent_test: "Request action=new with auto_start=false and verify the child has no conversation or submitted startup turn."
    acceptance_scenarios:
      - given: "An active session"
        when: "The user or agent requests action=new"
        then: "The system creates a child with no copied conversation and presents an empty composer without automatically submitting an empty turn."
      - given: "A new-session request includes an explicit prompt"
        when: "The request is processed"
        then: "The system either rejects the conflicting combination with an actionable error or applies the documented action precedence without copying source context."

  - id: "US-004"
    title: "Preserve operational continuity without conversation leakage"
    priority: "P0"
    as_a: "Jcode user"
    i_want: "the child to inherit only the operational metadata needed to continue work"
    so_that: "the new session behaves consistently while remaining a genuinely fresh model context"
    why_this_priority: "Copying forbidden state would violate the core safety and privacy contract of fresh-session handoff."
    independent_test: "Inspect a child created from a populated source session and compare persisted session state against an allowlist and denylist."
    acceptance_scenarios:
      - given: "A source session with messages, compaction data, provider identifiers, pending tools, and approvals"
        when: "A handoff creates a child"
        then: "The child contains none of those source-context artifacts and has a new provider conversation identity when a provider conversation is established."
      - given: "A source session with a working directory, session profile, model, reasoning effort, permissions, and client placement"
        when: "A handoff creates a child"
        then: "The child preserves the supported operational metadata through the existing session and profile machinery."

  - id: "US-005"
    title: "Transition only after a safe source-turn boundary"
    priority: "P0"
    as_a: "Jcode runtime operator"
    i_want: "handoff execution to wait until the source turn and transition record are durably settled"
    so_that: "a tool result, queued input, approval, or partial turn cannot be lost or run concurrently with the child"
    why_this_priority: "The transition changes session ownership and must not terminate or detach the source inside tool execution."
    independent_test: "Inject delayed tool completion, queued input, and persistence failure cases and assert the transition state and source/child lifecycle ordering."
    acceptance_scenarios:
      - given: "A session_transition request is made during an active assistant turn"
        when: "The model-callable tool returns"
        then: "The source turn can finish and persist normally, and no child activation occurs inside the tool call."
      - given: "The source turn has pending work or conflicting queued input"
        when: "The safe drain boundary is reached"
        then: "The system settles or rejects the conflict explicitly before marking the source handed off and activating the child."

  - id: "US-006"
    title: "Reattach the existing client and show lineage"
    priority: "P1"
    as_a: "TUI user"
    i_want: "the current client to switch to the child session in place"
    so_that: "I can continue without a second terminal while still understanding where the previous session went"
    why_this_priority: "Same-client reattachment is the requested UX distinction from launching a separate blank terminal."
    independent_test: "Run a handoff through a TUI client and verify the client identity, active session, transition event, and parent/child navigation links."
    acceptance_scenarios:
      - given: "A TUI client is attached to the source session"
        when: "The transition completes at the safe boundary"
        then: "The same client is atomically attached to the child and displays a visible transition event with parent and child navigation."
      - given: "The source client disconnects during an admitted transition"
        when: "The child is created"
        then: "The transition remains recoverable and a later compatible client can discover the child without creating a duplicate."

  - id: "US-007"
    title: "Continue with durable Bead context"
    priority: "P1"
    as_a: "Developer working through Beads"
    i_want: "the child startup context to identify the requested Bead and relevant durable state"
    so_that: "the fresh agent can resume the engineering workflow by reading the repository and task tracker instead of replaying the old transcript"
    why_this_priority: "Bead-oriented context is the primary continuity mechanism for sequential engineering work."
    independent_test: "Create a handoff with a bead_id and selected files, then verify that the startup content names the Bead and bounded durable context without embedding the source transcript."
    acceptance_scenarios:
      - given: "A valid bead_id and optional relevant files"
        when: "A prompted handoff is created"
        then: "The child startup content includes the Bead identifier, bounded status or recent comments, repository state needed for orientation, and the selected files."
      - given: "No bead_id is supplied"
        when: "A handoff is created"
        then: "The child still starts from the explicit or generated handoff content and normal project instructions without inventing a Bead."

  - id: "US-008"
    title: "Control handoff policy through configuration"
    priority: "P1"
    as_a: "Jcode administrator or project maintainer"
    i_want: "global settings and session-profile overrides for handoff behavior and dynamic instructions"
    so_that: "I can enable safe automation, disable only agent invocation, require confirmation, control automatic start, and add project policy consistently"
    why_this_priority: "The requested defaults and override surfaces must be deterministic and explainable across sessions."
    independent_test: "Exercise default, global, profile, explicit request, invalid, and disabled combinations and inspect the resolved behavior."
    acceptance_scenarios:
      - given: "No handoff settings are configured"
        when: "A normal session starts"
        then: "Manual and model-callable handoff are enabled with automatic continuation and bounded chain defaults."
      - given: "A session profile overrides the global handoff policy"
        when: "The session resolves its profile"
        then: "The profile-specific effective values govern that session and diagnostics identify non-secret configured versus effective values when they differ."
      - given: "Inline instructions and an instructions_file are configured while handoff is disabled"
        when: "The normal instruction stack is built"
        then: "Neither source is dynamically appended and the file is not required to be read for the disabled feature."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST provide a user-facing /handoff command that accepts an optional explicit prompt or next-task goal and creates a fresh child-session transition."
      testable: true
      acceptance_criteria: "Focused command tests cover a prompted handoff, an omitted prompt, invalid input, and the resulting accepted or actionable error state."
    - id: "FR-002"
      description: "MUST support a blank/new transition action that creates an empty child session and does not submit an empty startup turn."
      testable: true
      acceptance_criteria: "A focused test verifies action=new leaves the child conversation and composer blank, with no copied source messages or automatic empty request."
    - id: "FR-003"
      description: "MUST advertise a model-callable session_transition capability in normal sessions by default when global handoff is enabled."
      testable: true
      acceptance_criteria: "Tool-schema and session-instruction tests verify default registration, the supported action and fields, and absence or refusal when agent invocation is disabled."
    - id: "FR-004"
      description: "MUST accept action, prompt, goal, bead_id, relevant_files, auto_start, and reason inputs with bounded validation and an accepted transition identifier."
      testable: true
      acceptance_criteria: "Protocol and tool tests verify valid requests, unsupported actions, malformed fields, bounded values, and that tool execution returns without terminating the source session."
    - id: "FR-005"
      description: "MUST resolve handoff settings through one canonical precedence path covering explicit transition options, session-profile overrides, global configuration, and built-in defaults."
      testable: true
      acceptance_criteria: "A precedence matrix verifies enabled, agent_enabled, agent_requires_confirmation, auto_start, chain limits, inline instructions, and instructions_file across unset, global, profile, explicit, invalid, and fallback cases."
    - id: "FR-006"
      description: "MUST default manual and model-callable handoff to enabled, require no per-transition confirmation, automatically start a prompted child turn, and enforce a finite default transition-chain limit."
      testable: true
      acceptance_criteria: "Default-resolution tests assert the documented defaults, including a max_chain_transitions default of 8 or an explicitly recorded equivalent."
    - id: "FR-007"
      description: "MUST retain manual /handoff when agent_enabled is false, while enabled=false disables all handoff behavior with an actionable diagnostic."
      testable: true
      acceptance_criteria: "Configuration tests distinguish overall disablement from model-only disablement and verify that unrelated existing session behavior remains available."
    - id: "FR-008"
      description: "MUST dynamically append configured inline handoff instructions and readable instructions_file content to the normal instruction stack only when handoff is enabled."
      testable: true
      acceptance_criteria: "Instruction-stack tests verify both sources are appended in the documented order only for enabled sessions, are absent when disabled, and are not duplicated across repeated requests."
    - id: "FR-009"
      description: "MUST surface an actionable, non-secret diagnostic for an unreadable or invalid instructions_file and omit unavailable content without silently replacing the normal instruction stack."
      testable: true
      acceptance_criteria: "Negative-path tests cover missing, unreadable, empty, and valid files while asserting that file contents and other sensitive data are not emitted in diagnostics."
    - id: "FR-010"
      description: "MUST persist a pending transition and its idempotency key before the source turn can reach the execution boundary."
      testable: true
      acceptance_criteria: "Persistence-order tests observe the pending record and transition identifier before source-turn completion and verify recovery behavior after a persistence failure."
    - id: "FR-011"
      description: "MUST defer child creation and client reattachment until after the source assistant turn, tool result, and relevant session state are durably persisted at the server safe boundary."
      testable: true
      acceptance_criteria: "Lifecycle tests with delayed tool results and queued input prove no child activation occurs inside tool execution and source persistence precedes source handoff and child activation."
    - id: "FR-012"
      description: "MUST settle, reject, or explicitly preserve conflicting queued input, pending approvals, and other unsafe work before activating the child."
      testable: true
      acceptance_criteria: "Conflict tests verify each unsafe state produces a deterministic visible outcome and never runs source and child work concurrently."
    - id: "FR-013"
      description: "MUST create the child with a parent-session link and no copied messages, compaction state, provider conversation IDs, replay events, pending tool calls, or pending approvals."
      testable: true
      acceptance_criteria: "Persistence and protocol tests compare the child against the forbidden-state denylist and assert that its message history starts empty."
    - id: "FR-014"
      description: "MUST preserve only supported operational metadata needed for continuation, including working directory, resolved session profile and provider selection, model, reasoning effort, permission mode, applicable debug or self-development mode, and client placement metadata."
      testable: true
      acceptance_criteria: "An allowlist test verifies operational metadata inheritance and confirms that profile resolution uses existing session/profile machinery rather than a duplicate path."
    - id: "FR-015"
      description: "MUST compose prompted startup content from explicit prompt when supplied, otherwise a bounded generated handoff or goal, plus Bead state and selected relevant files, while leaving action=new blank."
      testable: true
      acceptance_criteria: "Startup-submission tests cover explicit prompt precedence, generated content, Bead context, selected files, blank action, bounded size, and omission of full transcripts or logs."
    - id: "FR-016"
      description: "MUST use the existing startup-submission machinery to submit an auto-start prompt only after the child is active, while auto_start=false leaves the content editable and agent_requires_confirmation=true waits for user confirmation."
      testable: true
      acceptance_criteria: "Submission tests verify ordering, editable draft behavior, confirmation gating, and that blank/new never submits an empty turn."
    - id: "FR-017"
      description: "MUST atomically reattach the current compatible TUI client to the child and persist reciprocal parent-child navigation metadata plus a visible transition event."
      testable: true
      acceptance_criteria: "TUI and protocol tests verify same-client attachment, visible lineage, source read-only or handed-off state, and reconnect recovery without duplicate children."
    - id: "FR-018"
      description: "MUST make repeated requests with the same idempotency key resolve to the same transition and child result without creating duplicate children or submissions."
      testable: true
      acceptance_criteria: "Concurrency and retry tests issue duplicate requests before and after the safe boundary and assert one durable transition, one child, and a stable result."
    - id: "FR-019"
      description: "MUST reject or stop a transition whose lineage would exceed the configured max_chain_transitions limit and MUST expose the chain position and reason to the user or agent."
      testable: true
      acceptance_criteria: "Boundary tests cover zero, one, default, and exhausted limits and verify no child is activated beyond the limit."
    - id: "FR-020"
      description: "MUST include Bead-oriented startup context when bead_id is supplied, using the existing durable tracker and bounded recent status or comments without replaying the source transcript."
      testable: true
      acceptance_criteria: "Bead bootstrap tests verify identifier, status or recent comments, repository orientation, selected files, and omission of conversation history."
    - id: "FR-021"
      description: "MUST preserve existing restart, resume, fork, compaction, schedule, and unrelated session behavior when fresh-session handoff is unused or disabled."
      testable: true
      acceptance_criteria: "Focused compatibility tests exercise legacy paths with handoff settings absent and disabled and compare their existing persisted and protocol behavior."
    - id: "FR-022"
      description: "MUST document the user command, model-callable policy, configuration and profile precedence, safe-boundary behavior, clean-child guarantees, chain limits, and recovery states, and MUST add a changelog entry."
      testable: true
      acceptance_criteria: "Documentation and changelog validators confirm the new behavior is discoverable and does not describe the draft proposal as current behavior before implementation."
    - id: "FR-023"
      description: "MUST provide tests-first coverage for the acceptance criteria and validate the changed workflow through a self-development build and an isolated-socket runtime using the newly built binary."
      testable: true
      acceptance_criteria: "The implementation plan and delivery evidence name focused tests, the selfdev build command, the isolated socket, and a successful runtime handoff observation."

  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Accepted transitions must be recoverable across source-turn completion, client disconnect, child-start failure, and process restart without duplicate children or lost durable transition state."
      measurable_target: "100% of focused failure-injection cases retain one inspectable transition record and either one child or an actionable recovery state."
    - id: "NFR-002"
      category: "security"
      description: "Fresh-session handoff must not retain or expose source conversation content, credentials, provider identifiers, pending approvals, tool payloads, or file contents beyond the explicit startup contract."
      measurable_target: "100% of persistence, protocol, diagnostic, and startup-content tests pass the forbidden-data denylist checks."
    - id: "NFR-003"
      category: "usability"
      description: "The active TUI must clearly communicate the transition, current child session, parent relationship, chain position, and any refusal or recovery reason."
      measurable_target: "All successful, refused, confirmation-waiting, and recovery states have a visible user-facing status and navigation path in focused TUI or protocol tests."
    - id: "NFR-004"
      category: "code_quality"
      description: "The feature must reuse existing session, profile, protocol, startup-submission, and instruction-stack ownership paths instead of creating parallel contracts or duplicate runtime definitions."
      measurable_target: "Architecture review identifies one canonical owner per new setting and transition phase, with no new dependency layer or duplicate session-spawn path."
    - id: "NFR-005"
      category: "performance"
      description: "A successful handoff should reattach the same client promptly after the safe boundary without requiring a second terminal or replaying the old conversation."
      measurable_target: "At least 95% of isolated-runtime successful transitions reattach and expose the child within 2 seconds after safe-boundary completion under the acceptance harness."
    - id: "NFR-006"
      category: "reliability"
      description: "Transition chains must remain bounded and diagnostics must make the remaining budget and cumulative transition count inspectable without secret values."
      measurable_target: "No focused chain test permits a transition beyond the configured maximum, and every refusal reports the effective limit and current position."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can move from a completed task into a genuinely fresh child session through /handoff without opening another terminal."
      metric: "Successful manual handoffs in focused TUI acceptance runs"
      target: "100% attach the existing client to the child and show a visible parent-child transition event"
    - id: "SC-002"
      description: "Every accepted handoff preserves operational continuity while excluding prior conversation context and unsafe pending state."
      metric: "Child-session persistence and protocol inspections"
      target: "100% of accepted transitions pass the operational allowlist and forbidden-state denylist"
    - id: "SC-003"
      description: "The source turn is durably recorded before the child can become active."
      metric: "Ordered lifecycle events in safe-boundary tests"
      target: "0 child activations before source-turn persistence and transition settlement"
    - id: "SC-004"
      description: "Retries do not create duplicate child sessions or duplicate startup submissions."
      metric: "Repeated and concurrent requests using one idempotency key"
      target: "1 transition, 1 child, and 1 startup submission per idempotency key"
    - id: "SC-005"
      description: "Configured chain limits prevent autonomous fresh-session loops from continuing indefinitely."
      metric: "Transition count across boundary and exhaustion tests"
      target: "0 transitions beyond the effective max_chain_transitions value"
    - id: "SC-006"
      description: "Project-specific handoff policy is applied only when the capability is enabled and follows documented configuration precedence."
      metric: "Instruction-stack and configuration matrix"
      target: "100% of enabled cases append the resolved inline and file instructions once, and 100% of disabled cases append neither"
    - id: "SC-007"
      description: "A Bead-oriented child can identify its next durable engineering task without receiving the source transcript."
      metric: "Bead bootstrap acceptance runs"
      target: "Every valid bead_id startup contains the Bead identifier and bounded durable context while containing none of the source conversation"
    - id: "SC-008"
      description: "The changed workflow is proven against the binary that will execute it rather than only by compilation."
      metric: "Self-development isolated-socket runtime acceptance"
      target: "A newly built binary completes at least one prompted handoff and one blank/new transition on a private socket"

key_entities:
  - name: "Session transition"
    description: "A durable, idempotent request to move from one source session to a clean child session at a safe server boundary."
    attributes:
      - "transition identifier"
      - "idempotency key"
      - "source session identifier"
      - "child session identifier"
      - "action and startup options"
      - "lifecycle status"
      - "chain position and effective limit"
  - name: "Fresh child session"
    description: "A new session with parent lineage and operational metadata but no copied conversation or unsafe transient state."
    attributes:
      - "session identifier"
      - "parent session identifier"
      - "resolved profile and model metadata"
      - "working directory"
      - "startup content state"
      - "client attachment state"
  - name: "Handoff policy"
    description: "The resolved global, session-profile, and per-transition settings governing availability, confirmation, startup, instructions, and chain limits."
    attributes:
      - "enabled"
      - "agent_enabled"
      - "agent_requires_confirmation"
      - "auto_start"
      - "max_chain_transitions"
      - "inline instructions"
      - "instructions_file"
  - name: "Bead startup context"
    description: "A bounded durable orientation package for the child based on an explicitly supplied Bead and selected repository context."
    attributes:
      - "Bead identifier"
      - "status or recent comments"
      - "repository state"
      - "relevant files"
      - "next outcome"

edge_cases:
  - scenario: "The same transition request is retried before the safe boundary or after the child is active."
    expected_behavior: "The idempotency key returns the existing transition result and never creates a second child or startup submission."
  - scenario: "The source turn has a pending tool result, approval request, queued user message, or persistence failure."
    expected_behavior: "The transition waits for a safe resolution or returns a visible recovery/refusal state; the child is not activated concurrently or prematurely."
  - scenario: "The source session is already handed off, closed, or at the configured chain limit."
    expected_behavior: "The request is rejected with the current lineage and limit, and no additional child is created."
  - scenario: "Child creation or client reattachment fails after the transition is admitted."
    expected_behavior: "The transition remains inspectable and recoverable, the source is not silently duplicated, and a compatible reconnect can finish or report recovery."
  - scenario: "The TUI client disconnects or is not the active client when the safe boundary completes."
    expected_behavior: "The server preserves the child and lineage, emits a protocol-visible state, and reattaches on the next compatible client without creating another child."
  - scenario: "The configured instructions_file is missing, unreadable, empty, or contains invalid input."
    expected_behavior: "The system reports an actionable non-secret diagnostic, omits unavailable content, and does not read or append the file when handoff is disabled."
  - scenario: "Both an explicit prompt and a goal are supplied."
    expected_behavior: "The explicit prompt is authoritative and the goal is not silently merged in a way that changes user intent; the behavior is documented and tested."
  - scenario: "action=new is requested with auto_start=true."
    expected_behavior: "The child remains blank and no empty model turn is submitted; auto_start applies only to non-empty prompted startup content."
  - scenario: "A handoff request contains oversized prompt, goal, file list, reason, or generated context."
    expected_behavior: "The request is bounded or rejected with an actionable validation error and never falls back to copying the full transcript."
  - scenario: "Handoff settings are absent, invalid, or overridden by a session profile."
    expected_behavior: "The canonical resolver applies documented defaults or profile precedence, reports invalid values, and preserves unrelated session behavior."

assumptions:
  - "The requested Bead identifier jcode-ggj is authoritative for this work even though the research proposal names a different exploratory Bead."
  - "The intended steady-state defaults are manual and agent handoff enabled, agent confirmation disabled, automatic prompted startup enabled, and max_chain_transitions set to 8 unless an accepted plan records a more compatible existing limit."
  - "Per-transition explicit values take precedence over session-profile overrides, which take precedence over global persisted settings and built-in defaults, while any existing environment layer retains its documented position."
  - "The existing profile resolver owns session-profile handoff overrides, and the existing startup instruction builder owns dynamic instruction-stack composition."
  - "A valid bead_id refers to durable tracker state that can be read through existing Bead machinery; this feature does not invent a new tracker or automatically select the next backlog item."
  - "Generated handoff content is bounded, inspectable, and goal-directed. It may summarize durable task state but never copies the source transcript, full logs, or provider context."
  - "Instructions files use the existing project or configuration path resolution conventions and are read dynamically when the effective handoff capability is enabled."
  - "Same-client reattachment is required for the existing TUI protocol path; other compatible clients receive the canonical transition state and remain backward compatible."
  - "The isolated-socket runtime acceptance uses the newly built self-development binary and does not disturb the shared daemon or the caller's active session."

constraints:
  - "Reuse existing session creation and lineage, session-profile resolution, protocol, TUI attachment, startup-submission, instruction-stack, and Bead startup machinery."
  - "The server remains authoritative for transition lifecycle, persistence, session ownership, provider state, and client attachment."
  - "Do not copy conversation messages, compaction state, provider conversation IDs, replay events, pending tool calls, pending approvals, or other source-session transient execution state."
  - "Do not overload process restart, compaction, fork, or delayed schedule-spawn semantics with fresh-session handoff behavior."
  - "All external, configuration, filesystem, protocol, and tracker inputs require visible validation and non-secret diagnostics."
  - "The change must preserve existing behavior when the feature is unused or explicitly disabled, except for the requested default advertisement and policy instructions in enabled normal sessions."
  - "Validation must be tests-first, include focused behavioral checks and documentation/changelog validation, and include self-development isolated-socket runtime acceptance against the new binary."
  - "The implementation must remain a bounded experimental capability with an explicit owner, finite chain limits, recovery states, and no accidental controller loop."

out_of_scope:
  - "Restarting the Jcode process, daemon, provider, or binary as part of a handoff."
  - "Changing compaction behavior or replacing compaction for tightly coupled work."
  - "Changing existing fork, resume, schedule spawn, swarm, or subagent semantics."
  - "Copying any source transcript, compacted history, provider conversation identity, replay event, pending tool, or approval into the child."
  - "A general autonomous backlog controller that selects and executes unlimited Bead chains."
  - "Comparative token-cost or context-quality benchmarking across handoff, compaction, and subagent workflows beyond the requested runtime acceptance."
  - "Cross-device or cross-client session migration beyond the existing same-client TUI reattachment and compatible protocol recovery path."
  - "Adding a new external service, provider integration, or general-purpose plugin mechanism."

