research_findings:
  decisions:
    - topic: "Relationship to existing /transfer"
      decision: "Keep /transfer unchanged because it intentionally carries compacted context and opens another terminal; implement /handoff as a clean child and in-place resume."
      rationale: "The requested semantics require no conversation or compaction and a same-client continuation."
      alternatives_considered:
        - "Rename or change /transfer, which would break an existing workflow."
        - "Treat handoff as compaction, which would not clear model context."
    - topic: "Agent safe boundary"
      decision: "The tool stages one pending transition and returns normally; server turn completion consumes it only after the source turn is persisted and emits a transition-ready event."
      rationale: "A tool cannot safely detach or terminate its own active turn."
      alternatives_considered:
        - "Create and start the child inside tool execution, which risks concurrent source and child work."
        - "Spawn a separate coordinator, which defeats the sequential self-handoff goal."
    - topic: "Instruction ownership"
      decision: "Resolve inline and file-backed handoff instructions into the existing session prompt overlay only while effective handoff is enabled."
      rationale: "This is toggleable per config/profile and does not rewrite repository instruction files."
      alternatives_considered:
        - "Edit AGENTS.md automatically, which creates persistent project mutations."
        - "Use a separate system prompt path, which would duplicate prompt ownership."
    - topic: "Client transition"
      decision: "Emit an additive protocol event and let the TUI call its existing ResumeSession path on the next idle tick."
      rationale: "This preserves one client process and reuses tested history/startup synchronization."
      alternatives_considered:
        - "Open a second terminal like split/transfer."
        - "Mutate TUI session state without server ResumeSession, which would desynchronize ownership."
data_model:
  entities:
    - name: "HandoffPolicy"
      description: "Effective per-session availability, startup, instruction, and chain settings."
      fields:
        - name: "enabled"
          type: "bool"
          description: "Controls manual and agent handoff availability."
          constraints: "Defaults true."
        - name: "agent_enabled"
          type: "bool"
          description: "Controls model tool exposure and execution."
          constraints: "Defaults true and cannot override enabled=false."
        - name: "agent_requires_confirmation"
          type: "bool"
          description: "Leaves agent-generated startup content editable when true."
          constraints: "Defaults false."
        - name: "auto_start"
          type: "bool"
          description: "Auto-submits non-empty startup content after child resume."
          constraints: "Defaults true."
        - name: "max_chain_transitions"
          type: "usize"
          description: "Maximum child lineage depth attributable to handoff."
          constraints: "Defaults 8 and must be finite."
        - name: "instructions"
          type: "Option<String>"
          description: "Inline policy appended to normal instructions while enabled."
          constraints: "Bounded and non-empty after trim."
        - name: "instructions_file"
          type: "Option<PathBuf>"
          description: "File-backed policy appended after inline policy while enabled."
          constraints: "Readable, bounded, and resolved with config path conventions."
      relationships: []
    - name: "SessionTransition"
      description: "A bounded pending request from one source session to one clean child."
      fields:
        - name: "id"
          type: "String"
          description: "Stable transition identifier."
          constraints: "Unique and returned to the caller."
        - name: "source_session_id"
          type: "String"
          description: "Session whose safe boundary owns the request."
          constraints: "Must exist and not already have another pending transition."
        - name: "child_session_id"
          type: "Option<String>"
          description: "Created once when transition is consumed."
          constraints: "At most one child."
        - name: "action"
          type: "handoff | new"
          description: "Prompted continuation or intentionally blank child."
          constraints: "new never auto-submits an empty turn."
        - name: "startup_content"
          type: "Option<String>"
          description: "Explicit bounded prompt/goal and optional Bead/file orientation."
          constraints: "Contains no source transcript."
        - name: "chain_position"
          type: "usize"
          description: "Current handoff depth."
          constraints: "Must not exceed effective maximum."
      relationships:
        - target: "Session"
          type: "many-to-one"
          description: "Links source and child using the existing parent_id."
