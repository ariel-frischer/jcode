  spec_path: "specs/005-fresh-session-handoff/spec.yaml"
summary: |
  Add a bounded fresh-session transition primitive instead of overloading fork,
  transfer, compaction, schedule, or process restart. A global handoff policy and
  optional session-profile overlay resolve once per session. Enabled policy text
  is appended dynamically to the existing prompt overlay without editing
  AGENTS.md. Manual `/handoff` requests and the `session_transition` model tool
  both produce a clean child containing operational metadata and explicit startup
  content, but no source messages, compaction, provider conversation identity, or
  pending execution state.

  The server remains authoritative for child creation. Manual remote requests are
  accepted only at an idle boundary. Agent requests are durably staged by the
  tool and consumed after the source turn's terminal event. A protocol event tells
  the current TUI to use its existing in-place ResumeSession flow, after which the
  existing startup-submission machinery either auto-submits or leaves an editable
  draft. Transition lineage and a finite chain limit prevent runaway loops.
