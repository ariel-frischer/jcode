  testing:
    framework: "Rust built-in test harness and existing protocol/server/TUI fixtures"
    approach: "Tests first for policy resolution, clean-child denylist, tool validation, protocol roundtrips, deferred safe-boundary consumption, and TUI in-place resume"
  target_platform: "Jcode-supported Linux, macOS, and Windows CLI/server builds"
  project_type: "cli"
  performance_goals: "Transition creation is local and bounded; the current TUI begins in-place resume within two seconds of the safe boundary"
  constraints:
    - "Do not mutate AGENTS.md or global instruction files."
    - "Do not copy source messages, compaction, provider session IDs, replay events, pending tools, or approvals."
    - "Manual handoff remains available when only agent invocation is disabled."
    - "Use the existing profile resolver, prompt overlay, session persistence, ResumeSession, and startup-submission paths."
    - "Default maximum chain length is eight."
    - "Existing fork, transfer, compaction, schedule, resume, and restart behavior remains unchanged."
  scale_scope: "One pending transition per source session and a maximum default lineage depth of eight"
