plan:
  branch: "agent/jcode-h3eu-swarm-routing"
  created: "2026-09-05"
  spec_path: "specs/025-restore-swarm-routing/spec.yaml"

summary: >-
  Restore the optional per-worker model request only at the existing swarm tool,
  protocol, dispatcher, assignment, and spawn-selection seams removed by b76f96561.
  Re-establish one resolution order of explicit request, agents.swarm_model, then
  coordinator identity, preserving route-qualified provider/auth metadata and all
  omitted behavior. Bound list_models with deterministic selection and an explicit
  truncation summary. Protect the downstream contract with one named regression
  gate invoked by canonical local guardrails and CI. Begin with failing contract
  tests, keep runtime validation behind root approval, and avoid SDK, provider,
  config, dependency, or unrelated operator-control changes.

technical_context:
  language: "Rust 2024, Bash, Python 3, YAML"
  framework: "Serde-tagged protocol, async shared server, tool JSON schemas, provider route catalog, Cargo tests, shell and CI guardrails"
  primary_dependencies:
    - name: "serde and serde_json"
      version: "existing workspace versions"
      purpose: "Additive optional tool and wire fields with omitted-field compatibility and schema assertions."
    - name: "jcode-provider-core route catalog"
      version: "workspace"
      purpose: "Reuse existing ModelRoute and route identity data rather than creating routing logic."
    - name: "jcode protocol and app-core"
      version: "workspace"
      purpose: "Carry optional model through CommSpawn, CommAssignNext, dispatch, assignment, spawn resolution, and runtime metadata."
  storage: "Existing Session model/provider_key/route_api_method/reasoning_effort fields and swarm runtime metadata; no new persisted fields."
  testing:
    framework: "Cargo unit/integration tests, provider-facing tool projection tests, named Python or shell contract guard, and isolated private-socket runtime acceptance"
    approach: "First reverse the upstream omission assertions and add failing coverage for projected schema, wire round trips, both dispatchers, assignment-created spawns, precedence/auth identity, native openai:gpt-6-astra low metadata, and oversized catalog bounds. Then make the smallest restoration, run focused tests, canonical guardrails and a fresh build, obtain root approval, and run one bounded read-only worker against the resolved fresh binary."
  target_platform: "Jcode CLI/TUI shared-server paths on supported platforms, with final runtime evidence on the current Linux x86_64 host."
  project_type: "cli"
  performance_goals: "list_models output <= 12 KiB for any catalog; a synthetic 10,000-route fixture formats in <100 ms on the development host; omitted routing has zero observable behavior change."
  constraints:
    - "Remain in the existing worktree and branch; root owns lifecycle."
    - "Do not mutate Beads, user configuration, SDK ownership, providers, dependencies, or coordinator model selection."
    - "Reuse resolve_swarm_task_route and current spawn/profile route helpers where their ownership applies; do not add parallel routing."
    - "Do not wholesale revert b76f96561 or restore unrelated SDK/operator-control edits."
    - "Run one Cargo-heavy command at a time."
    - "Do not start a real worker until root explicitly approves the bounded read-only runtime check."
  scale_scope: "One optional model string per worker-creation request and route catalogs from zero to at least 10,000 synthetic entries."

implementation_phases:
  - phase: 1
    name: "Regression-first contract exposure"
    goal: "Make the intended downstream contract fail visibly before production restoration."
    deliverables:
      - "Direct and provider-projected swarm schema regressions requiring optional model while preserving effort and action branches."
      - "Protocol round trips requiring explicit model preservation and unset omission for CommSpawn and CommAssignNext."
      - "Forwarding regressions for full and lightweight dispatch plus explicit spawn and assignment request construction."
    dependencies: []
  - phase: 2
    name: "Canonical route restoration"
    goal: "Restore optional model propagation and one precedence resolver without changing omitted behavior."
    deliverables:
      - "CommunicateInput/schema and all new-worker request paths carry optional model."
      - "CommSpawn/CommAssignNext and both server dispatch paths forward model unchanged."
      - "Existing spawn selection accepts explicit request ahead of agents.swarm_model and coordinator inheritance, including explicit inherit."
      - "Profile snapshot, provider key, route API method, request nonce, and mutation-key identity remain coherent."
    dependencies: [1]
  - phase: 3
    name: "Assignment and runtime identity"
    goal: "Prove every worker-creation path and runtime metadata uses the intended effective route."
    deliverables:
      - "assign_task, assign_next, run_plan, fill/replacement spawn paths route only newly created workers."
      - "Existing task route resolver remains authoritative for task metadata and feeds the canonical spawn request where applicable."
      - "openai:gpt-6-astra with low effort is covered through effective model, provider/auth route, session identity, and SwarmMemberRuntime metadata without fallback."
    dependencies: [2]
  - phase: 4
    name: "Bounded route catalog"
    goal: "Replace unbounded full-catalog rendering with deterministic useful output."
    deliverables:
      - "Measured baseline demonstrating current growth on a large fixture."
      - "A deterministic selection policy that prioritizes current/configured and useful available routes, deduplicates noise, and reports omitted count."
      - "Small, empty, duplicate, unavailable, and 10,000-route fixtures under the 12 KiB and 100 ms targets."
    dependencies: [1]
  - phase: 5
    name: "Downstream contract guard"
    goal: "Make future upstream removal fail a named canonical gate."
    deliverables:
      - "A named custom swarm routing contract check with actionable failures across schema/projection, wire, forwarding, precedence/auth, runtime metadata, and catalog-bound tests."
      - "Invocation from scripts/check_guardrails.sh and the CI Quality Guardrails job."
      - "A negative self-test or fixture proving representative contract deletion is detected independently of one unit-test name or assertion polarity."
    dependencies: [2, 3, 4]
  - phase: 6
    name: "Validation and root-gated runtime"
    goal: "Establish build, guardrail, runtime, and fresh-base integration evidence without taking lifecycle actions."
    deliverables:
      - "Focused test matrix, format/check results, serialized fresh build, and canonical guardrails."
      - "Root approval checkpoint before live worker creation."
      - "One private-socket, fresh-built, bounded read-only worker proving openai:gpt-6-astra low runtime metadata."
      - "Fresh-base diff/rebase simulation or equivalent integration-safety evidence, with no merge, push, or cleanup."
    dependencies: [5]

