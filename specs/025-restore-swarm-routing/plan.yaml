research_findings:
  root_cause:
    - "Upstream b76f96561 intentionally removed model from CommunicateInput/schema, CommSpawn, CommAssignNext, both dispatchers, request construction, and resolve_swarm_spawn_selection."
    - "Current communicate_tests.rs locks the upstream policy with schema_omits_model_override_and_advertises_effort."
    - "Current resolve_swarm_spawn_selection still contains configured-pin and coordinator inheritance logic, route-qualified selection helpers, profile snapshot preservation, and persisted coordinator fallback."
    - "Current resolve_swarm_task_route already resolves task-node role/model/effort metadata and should not be duplicated."
    - "format_swarm_model_list currently appends one unbounded line per ModelRoute, explaining catalog-sized output growth."
  decisions:
    routing: "Restore the removed optional parameter through existing seams and add it as the highest-priority input to the current spawn selection helper."
    auth_preservation: "Resolve route-qualified explicit values through existing route/profile helpers and assert provider_key plus route_api_method at session and runtime boundaries."
    assignments: "Forward the caller/task-derived model only when assignment creates a new worker; never retarget an existing worker."
    catalog_bound: "Use deterministic capped rendering with current/configured route priority, deduplication, an omitted-count footer, and a hard final byte guard."
    regression_gate: "Create one named downstream contract runner that invokes exact focused tests and structural checks, then call that runner from local and CI guardrails."
    runtime: "After root approval, use a private socket and freshly resolved executable for one short read-only worker task, then inspect status/runtime metadata."

data_model:
  entities:
    - name: "SwarmRoutingRequest"
      description: "Optional per-worker routing input accepted by explicit spawn and assignment-created spawn paths."
      fields:
        - name: "model"
          type: "Option<String>"
          description: "Concrete model route or explicit inherit/coordinator sentinel."
          constraints: "Optional; trimmed; invalid or unavailable explicit routes fail visibly; omitted remains backward compatible."
        - name: "effort"
          type: "Option<String>"
          description: "Requested child reasoning effort."
          constraints: "Existing enum semantics remain unchanged."
        - name: "action"
          type: "String"
          description: "Worker-creation action or assignment path."
          constraints: "Routing affects only newly created workers."
      relationships:
        - target: "EffectiveWorkerRoute"
          type: "one-to-one"
          description: "The canonical resolver converts each new-worker request into one immutable effective selection."
    - name: "EffectiveWorkerRoute"
      description: "Resolved child execution and runtime identity."
      fields:
        - name: "model"
          type: "Option<String>"
          description: "Effective bare model after route resolution."
          constraints: "Must match an explicit valid request without silent substitution."
        - name: "provider_key"
          type: "Option<String>"
          description: "Selected provider/authentication route identity."
          constraints: "Derived from existing route ownership, never independently supplied."
        - name: "route_api_method"
          type: "Option<String>"
          description: "Stable API/auth method persisted with the child session."
          constraints: "Must remain coherent with model and provider_key."
        - name: "effort"
          type: "Option<String>"
          description: "Effective reasoning effort reported in runtime metadata."
          constraints: "Explicit low must remain low for the native OpenAI acceptance route."
      relationships:
        - target: "RoutingContractGate"
          type: "many-to-one"
          description: "Contract checks protect resolution and metadata behavior across representative routes."
    - name: "RoutingContractGate"
      description: "Named downstream regression gate invoked locally and in CI."
      fields:
        - name: "required_surfaces"
          type: "List<String>"
          description: "Schema, projection, wire, forwarding, precedence, metadata, and catalog checks."
          constraints: "Must fail with actionable diagnostics when any protected surface is removed."
        - name: "catalog_output_budget"
          type: "usize"
          description: "Maximum list_models formatted output size."
          constraints: "At most 12 KiB for oversized fixtures."
      relationships:
        - target: "SwarmRoutingRequest"
          type: "one-to-many"
          description: "The gate covers explicit, omitted, inherit, and assignment-created request cases."

api_contracts:
  swarm_tool:
    model: "Optional string on public and provider-projected schema; omitted preserves current policy; explicit inherit/coordinator forces coordinator inheritance."
    effort: "Existing optional enum remains unchanged and combines with the selected model where supported."
  protocol:
    CommSpawn: "Additive optional model omitted from JSON when unset."
    CommAssignNext: "Additive optional model omitted from JSON when unset and forwarded only into newly spawned workers."
  runtime_metadata:
    contract: "Effective model, provider/auth route, and effort match the created worker Session and SwarmMemberRuntime."
  list_models:
    contract: "Bounded deterministic text retaining current/configured context and actionable available route samples with truncation disclosure."

project_structure:
  modify:
    - "crates/jcode-app-core/src/tool/communicate.rs and communicate_tests.rs"
    - "crates/jcode-protocol/src/wire.rs and protocol_tests/comm_requests.rs"
    - "crates/jcode-app-core/src/protocol_tests/comm_requests.rs"
    - "crates/jcode-app-core/src/server/client_lifecycle.rs"
    - "crates/jcode-app-core/src/server/client_lightweight_control.rs"
    - "crates/jcode-app-core/src/server/comm_session.rs and comm_session_tests.rs"
    - "crates/jcode-app-core/src/server/comm_control.rs and focused assignment tests"
    - "scripts/check_guardrails.sh and .github/workflows/ci.yml"
  add_if_minimal:
    - "One named scripts/check_custom_swarm_routing_contract.py or .sh plus focused self-test/fixture"
  reuse:
    - "docs/CAPABILITY_ROUTING_CONTRACT.md"
    - "server::swarm::resolve_swarm_task_route"
    - "existing provider/tool definition projection path"
    - "existing spawn route and profile snapshot helpers"

risks:
  - id: "RISK-001"
    risk: "A restored bare model changes provider/auth identity or silently falls back."
    likelihood: "medium"
    impact: "high"
    mitigation: "Assert model, provider_key, route_api_method, profile snapshot, session identity, and runtime metadata for native and route-qualified cases."
  - id: "RISK-002"
    risk: "Assignment paths diverge from explicit spawn or mutate reused workers."
    likelihood: "medium"
    impact: "high"
    mitigation: "Cover every assignment-created spawn path and separately assert reuse does not alter an existing worker."
  - id: "RISK-003"
    risk: "Catalog bounding hides the configured or currently active route."
    likelihood: "low"
    impact: "medium"
    mitigation: "Reserve output budget for current/configured entries and test deterministic priority before general samples."
  - id: "RISK-004"
    risk: "The guardrail is brittle or can be defeated by renaming a test."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use a named contract runner with structural assertions and stable focused behavior selectors rather than one reversed assertion."
  - id: "RISK-005"
    risk: "Live validation accidentally uses the shared daemon or performs mutating work."
    likelihood: "low"
    impact: "high"
    mitigation: "Require root approval, resolve the new binary, use a unique private socket, bound time/output, and give the worker a read-only metadata task."

