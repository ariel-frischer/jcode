feature:
  branch: "agent/jcode-h3eu-swarm-routing"
  created: "2026-09-04"
  status: "Draft"
  input: >-
    Prepare jcode-h3eu: restore explicit swarm model routing and protect it from future upstream syncs. Work only in this already-created worktree. Do not create another worktree, mutate Beads, spawn agents, edit user configuration, implement code, merge, push, or clean up. Root owns lifecycle. Root cause verified: upstream commit b76f96561 intentionally removed model from CommunicateInput/schema, CommSpawn/CommAssignNext wire messages and server forwarding/resolver; current communicate_tests.rs explicitly asserts schema omits model. Restore optional model with existing route resolver, explicit > agents.swarm_model > coordinator inheritance, preserving omitted behavior. Cover native openai:gpt-6-astra low route propagation and runtime metadata without silent fallback. Diagnose/bound list_models formatter that currently emits entire route catalog (reported 75k tokens). Add named custom-routing contract regression gate to canonical check_guardrails.sh and CI so future syncs cannot merely reverse an upstream assertion. Reuse existing CAPABILITY_ROUTING_CONTRACT.md and provider projection, existing task model resolver where applicable. Do not introduce parallel routing, SDK copies, config changes, provider changes, broad refactors. Required checks: regression-first exposed and projected schema, wire serialization and forwarding including assignment paths, precedence/auth preservation, bounded catalog fixture, focused tests, build and canonical guardrails, isolated fresh-built runtime with real bounded read-only worker after approval by root, fresh-base integration safety. Existing upstream removal diff can guide investigation but do not wholesale revert unrelated SDK or operator-control changes. Produce compact spec, plan, phase-based tasks. Read constitution and current files. Tests and restoration should remain surgical. Root will review before implementation.

user_stories:
  - id: "US-001"
    title: "Choose a swarm worker model explicitly"
    priority: "P0"
    as_a: "swarm coordinator"
    i_want: "to optionally select a model route and effort for a spawned or assignment-created worker"
    so_that: "the worker runs on the intended provider, authentication route, model, and effort instead of silently using another route"
    why_this_priority: "Explicit routing is the core custom capability removed by upstream and incorrect fallback can change cost, authentication, and behavior."
    independent_test: "Issue explicit spawn and assignment requests for openai:gpt-6-astra with low effort and verify the created worker reports the same effective runtime identity."
    acceptance_scenarios:
      - given: "an explicit valid model route is supplied for a new worker"
        when: "the worker is created through spawn or an assignment path"
        then: "the explicit route takes precedence and the worker runtime metadata reports that route and requested effort"
      - given: "an explicit inherit sentinel is supplied while agents.swarm_model is configured"
        when: "the worker is created"
        then: "the worker inherits the coordinator identity rather than using the configured pin"
  - id: "US-002"
    title: "Preserve existing omitted routing behavior"
    priority: "P0"
    as_a: "Jcode operator"
    i_want: "requests that omit model to retain the established operator-controlled fallback order"
    so_that: "restoring explicit routing does not change existing swarm behavior"
    why_this_priority: "Backward compatibility is required for all existing callers and operator configuration."
    independent_test: "Exercise omitted model with and without agents.swarm_model and verify configured pin then coordinator inheritance, including provider and auth identity."
    acceptance_scenarios:
      - given: "model is omitted and agents.swarm_model names a concrete route"
        when: "a worker is created"
        then: "the configured route is used"
      - given: "model is omitted and agents.swarm_model is absent or inherit"
        when: "a worker is created"
        then: "the coordinator model and authentication route are inherited"
  - id: "US-003"
    title: "Inspect routes without excessive output"
    priority: "P1"
    as_a: "swarm coordinator"
    i_want: "list_models to return a bounded and useful route summary"
    so_that: "route discovery cannot consume an excessive context window while still showing actionable choices"
    why_this_priority: "The current formatter can emit the full catalog and has reportedly produced about 75,000 tokens."
    independent_test: "Format a deliberately oversized catalog fixture and verify deterministic bounds, essential current/configured route context, and clear truncation guidance."
    acceptance_scenarios:
      - given: "the available route catalog exceeds the output budget"
        when: "list_models is requested"
        then: "the result stays within the defined bound and clearly indicates that entries were omitted"
      - given: "the route catalog is small"
        when: "list_models is requested"
        then: "all useful entries and current/configured route context are shown"
  - id: "US-004"
    title: "Protect the custom routing contract"
    priority: "P0"
    as_a: "repository maintainer"
    i_want: "a named canonical regression gate for explicit swarm routing"
    so_that: "future upstream syncs cannot remove the capability by merely reversing a local assertion"
    why_this_priority: "The regression originated in an intentional upstream policy change that conflicts with this repository's accepted routing contract."
    independent_test: "Run the named contract gate against the restored tree, then demonstrate that removing schema or wire model support makes both local guardrails and CI fail."
    acceptance_scenarios:
      - given: "the explicit model field is removed from any required public, wire, forwarding, precedence, or metadata surface"
        when: "canonical guardrails run"
        then: "the named custom-routing contract gate fails with an actionable message"

requirements:
  functional:
    - id: "FR-001"
      description: "The swarm tool MUST expose model as an optional input on the public schema while preserving effort and all existing action-specific requirements."
      acceptance_criteria: "Direct schema inspection and provider-facing projected schema both include optional model and retain valid spawn/non-spawn branches."
    - id: "FR-002"
      description: "Explicit model input MUST be accepted by spawn, assign_task, assign_next, run_plan, and assignment-created spawn paths that create a new worker."
      acceptance_criteria: "Focused tests cover request construction and forwarding for each worker-creation path without changing reuse-only assignment behavior."
    - id: "FR-003"
      description: "CommSpawn and CommAssignNext wire messages MUST carry optional model values and omit the field when unset."
      acceptance_criteria: "Serialization round trips preserve explicit values and legacy/unset payloads remain valid."
    - id: "FR-004"
      description: "Server request dispatchers MUST forward optional model unchanged through full and lightweight control paths."
      acceptance_criteria: "Handler-boundary tests observe the same explicit value at the canonical spawn resolver for both dispatch paths."
    - id: "FR-005"
      description: "Worker model resolution MUST use one precedence order: explicit request, concrete agents.swarm_model, coordinator inheritance, then existing built-in fallback only when authoritative identity is unavailable."
      acceptance_criteria: "A precedence matrix verifies explicit concrete route, explicit inherit, configured concrete route, configured inherit/empty, coordinator inheritance, and unavailable coordinator identity."
    - id: "FR-006"
      description: "Route-qualified explicit models MUST preserve the selected provider and authentication route rather than resolving only the bare model name."
      acceptance_criteria: "Tests verify model, provider key, and route API method for representative native and alternate routes."
    - id: "FR-007"
      description: "An explicit openai:gpt-6-astra request with low effort MUST reach the created worker and its runtime metadata without silent fallback."
      acceptance_criteria: "Focused and approved isolated-runtime evidence reports gpt-6-astra, the native OpenAI route identity, and low effort on the real read-only worker."
    - id: "FR-008"
      description: "Existing task-node model resolution MUST remain authoritative for planned task metadata and MUST be reused where assignment routing already derives a task route."
      acceptance_criteria: "Assignment tests prove task metadata and explicit request forwarding converge on one effective spawn selection without a parallel resolver."
    - id: "FR-009"
      description: "Omitting model MUST preserve current agents.swarm_model and coordinator inheritance behavior, including profile snapshot and authentication identity preservation."
      acceptance_criteria: "Compatibility tests pass for omitted legacy payloads, configured pins, busy coordinator persisted-session fallback, and inherited profile snapshots."
    - id: "FR-010"
      description: "list_models MUST return a deterministic bounded summary rather than the entire route catalog when the catalog is large."
      acceptance_criteria: "An oversized fixture remains within the approved byte or token-equivalent limit, preserves essential context, and reports omitted entry count or truncation."
    - id: "FR-011"
      description: "The bounded list_models result MUST retain current coordinator model, agents.swarm_model state, availability/auth cues for selected entries, and actionable discovery guidance."
      acceptance_criteria: "Small and oversized catalog tests assert all required summary elements."
    - id: "FR-012"
      description: "A named custom swarm routing contract check MUST verify the accepted downstream contract independently of individual reversible unit-test wording."
      acceptance_criteria: "The check fails when model is absent from exposed/projected schema, required wire messages, forwarding paths, precedence coverage, runtime metadata coverage, or bounded catalog coverage."
    - id: "FR-013"
      description: "The named contract check MUST run from scripts/check_guardrails.sh and the canonical CI quality job."
      acceptance_criteria: "Local script inspection and CI configuration both invoke the same named check."
    - id: "FR-014"
      description: "Implementation validation MUST include focused tests, a fresh build, canonical guardrails, and fresh-base integration safety."
      acceptance_criteria: "Review evidence records each command, resolved binary or base revision, result, and any unrelated baseline failure."
    - id: "FR-015"
      description: "A real isolated read-only worker runtime check MUST occur only after root approval and MUST use the freshly built binary on a private socket."
      acceptance_criteria: "Approval is recorded before execution, the worker performs only bounded read-only work, and runtime metadata proves the requested route and effort."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Explicit valid routing must never silently downgrade to another model or authentication route."
      measurable_target: "100% of covered explicit-route cases either report the requested effective identity or return an actionable error."
    - id: "NFR-002"
      category: "performance"
      description: "Route discovery output must stay bounded for arbitrarily large catalogs."
      measurable_target: "The formatter output stays at or below an implementation-plan budget of 12 KiB and formats a 10,000-entry fixture in under 100 ms on the test host."
    - id: "NFR-003"
      category: "code_quality"
      description: "The restoration must be surgical and reuse existing route, task, profile, and provider projection ownership."
      measurable_target: "No new routing subsystem, config field, provider behavior, SDK copy, dependency, or unrelated refactor is introduced."
    - id: "NFR-004"
      category: "reliability"
      description: "The custom contract must remain detectable after upstream synchronization."
      measurable_target: "One named guardrail fails on every required contract-surface deletion represented by its regression fixture."

success_criteria:
  - id: "SC-001"
    description: "Coordinators can explicitly route every new-worker creation path to a chosen model and effort with observable identity."
    metric: "Covered worker-creation paths matching requested model, auth route, and effort"
    target: "100%"
  - id: "SC-002"
    description: "Existing callers that omit model experience no routing behavior change."
    metric: "Legacy and omitted-model compatibility scenarios passing"
    target: "100%"
  - id: "SC-003"
    description: "Route catalog discovery cannot consume an excessive context window."
    metric: "Maximum formatted output for oversized catalogs"
    target: "At most 12 KiB with explicit truncation notice"
  - id: "SC-004"
    description: "Future removal of the downstream custom routing contract is caught before integration."
    metric: "Required local and CI contract gates triggered by simulated contract removal"
    target: "2 of 2 gates fail"
  - id: "SC-005"
    description: "A freshly built isolated runtime starts a bounded read-only worker on the requested native OpenAI route after root approval."
    metric: "Runtime metadata fields matching request"
    target: "model, provider/auth route, and low effort all match with no fallback"

key_entities:
  - name: "Swarm routing request"
    description: "Optional per-worker model and effort supplied through explicit spawn or assignment flows."
    attributes:
      - "model"
      - "effort"
      - "action"
  - name: "Effective worker route"
    description: "Resolved runtime identity used to create and report a swarm child."
    attributes:
      - "model"
      - "provider key"
      - "route API method"
      - "reasoning effort"
  - name: "Routing contract gate"
    description: "Named downstream regression check covering public schema, wire flow, resolver precedence, metadata, and bounded discovery."
    attributes:
      - "required surfaces"
      - "failure diagnostics"
      - "local guardrail integration"
      - "CI integration"

edge_cases:
  - scenario: "model is omitted, blank, inherit, or coordinator while agents.swarm_model is concrete"
    expected_behavior: "Omitted or blank follows configured policy; explicit inherit/coordinator forces coordinator inheritance according to the accepted contract."
  - scenario: "an explicit route-qualified model is unavailable or invalid"
    expected_behavior: "Return an actionable error or explicit unavailable result; never silently substitute another route."
  - scenario: "the coordinator agent is busy and cannot be locked"
    expected_behavior: "Use the authoritative persisted session identity and preserve model/provider/auth metadata."
  - scenario: "assignment reuses an existing worker rather than creating one"
    expected_behavior: "Do not mutate that worker's model; routing input applies only when a new worker is spawned."
  - scenario: "duplicate routes or a catalog much larger than the output budget"
    expected_behavior: "Select a deterministic useful subset, avoid duplicate noise, and report truncation while staying bounded."
  - scenario: "root has not approved live worker execution"
    expected_behavior: "Stop before runtime worker creation and report the pending approval gate."

assumptions:
  - "The current branch agent/jcode-h3eu-swarm-routing is the root-created feature branch and must remain checked out."
  - "The accepted docs/CAPABILITY_ROUTING_CONTRACT.md remains the authoritative downstream policy even where current code reflects upstream removal."
  - "The existing route parser, spawn selection helpers, task route resolver, profile snapshot handling, and provider-facing tool definition projection can support restoration without new configuration or provider behavior."
  - "A 12 KiB list_models ceiling is a conservative initial bound that can be tightened during regression-first diagnosis if representative catalogs remain useful."
  - "The native route spelling openai:gpt-6-astra is valid in the intended runtime catalog and must preserve its concrete provider/auth identity."

constraints:
  - "Work only in the existing worktree and branch; do not create or switch branches or worktrees."
  - "Do not mutate Beads, user configuration, SDK ownership, providers, dependencies, or unrelated operator-control behavior."
  - "Do not wholesale revert b76f96561 or copy unrelated SDK/operator changes from its parent."
  - "Implementation must remain surgical and await root review of these artifacts."
  - "Do not merge, push, clean up, or run a real worker before root approval."
  - "Serialize Cargo-heavy checks on the resource-constrained host."

out_of_scope:
  - "Role inference, new routing vocabularies, or a second route resolver."
  - "New model providers, authentication methods, model catalog entries, or provider behavior changes."
  - "New agents configuration fields, user configuration edits, or default policy changes."
  - "Go or TypeScript SDK copies, generated protocol projections, or SDK ownership changes."
  - "Changing the coordinator's active model when routing a child."
  - "Broad swarm, protocol, session, or formatter refactors."
  - "Executing implementation, live-worker validation, integration, merge, push, or cleanup during specification preparation."

