feature:
  branch: "agent/jcode-5hc-pr4-integration"
  created: "2026-08-25"
  status: "Complete"
  input: "Reconcile fork PR 4 bounded unattended tool rounds into current dev without weakening the existing run-safety architecture."

user_stories:
  - id: "US-001"
    title: "Bound tool-call loops when turns are bounded"
    priority: "P1"
    as_a: "jcode run operator"
    i_want: "a bounded turn policy to also cap provider/tool rounds within each turn"
    so_that: "one turn cannot loop forever while bypassing the completed-turn bound"
    independent_test: "A fake provider emits tool calls repeatedly and the run stops before provider request 33 when max_turns is configured."
    acceptance_scenarios:
      - given: "an effective max_turns value from invocation, environment, or persisted config"
        when: "one turn completes 32 provider responses containing executable tool calls"
        then: "the run stops before issuing another provider request with max_tool_rounds_exceeded"
      - given: "a new turn starts"
        when: "the previous turn used tool rounds"
        then: "the per-turn counter resets to zero"
      - given: "max_turns is absent from every source"
        when: "a tool loop runs"
        then: "no implicit per-turn round limit is introduced"

  - id: "US-002"
    title: "Retain compatible bounded-stop output"
    priority: "P1"
    as_a: "human or automation consuming run output"
    i_want: "the new stop to use existing typed run-safety reporting"
    so_that: "plain and machine-readable consumers remain deterministic"
    independent_test: "Trigger the new bound in plain, JSON, and NDJSON modes and validate channel, shape, reason code, source, bound, and exit status."
    acceptance_scenarios:
      - given: "plain output"
        when: "the round bound stops the run"
        then: "the stable stop diagnostic is written to stderr"
      - given: "JSON or NDJSON output"
        when: "the round bound stops the run"
        then: "stdout remains valid structured data containing max_tool_rounds_exceeded"

requirements:
  functional:
    - id: "FR-001"
      description: "An effective max_turns policy MUST imply a per-turn maximum of 32 completed provider/tool rounds."
      acceptance_criteria: "All three max_turns sources enable the same internal bound and unset max_turns does not."
    - id: "FR-002"
      description: "The round counter MUST reset before every new outer turn."
      acceptance_criteria: "Two-turn tests prove prior rounds do not reduce the next turn's allowance."
    - id: "FR-003"
      description: "The system MUST stop before the provider request that would exceed the per-turn round bound."
      acceptance_criteria: "The fake provider observes exactly 32 tool-bearing responses and no request 33."
    - id: "FR-004"
      description: "Only fully processed provider responses containing tool calls MUST count as completed rounds."
      acceptance_criteria: "Text-only completion, provider error, cancellation, and partially processed responses do not increment the counter."
    - id: "FR-005"
      description: "The new stop MUST use the canonical code max_tool_rounds_exceeded and expose the inherited max_turns source plus a bound of 32."
      acceptance_criteria: "Controller and output tests assert code, source, and bound metadata."
    - id: "FR-006"
      description: "Existing max_tool_steps, token_budget, deadline, and max_turns stops MUST retain first-stop-wins behavior and established priority."
      acceptance_criteria: "A lower explicit max_tool_steps bound wins before the implicit round bound and existing reason tests remain green."
    - id: "FR-007"
      description: "Capture and streaming Agent loops MUST enforce identical round semantics."
      acceptance_criteria: "Focused tests cover both execution paths at the provider-request boundary."
    - id: "FR-008"
      description: "Plain bounded-stop diagnostics MUST use stderr while JSON and NDJSON stdout remain parseable and compatible."
      acceptance_criteria: "CLI output tests validate channels, structured shape, and successful bounded-stop exit status."
    - id: "FR-009"
      description: "Harness and protocol contracts MUST remain additive and compatible."
      acceptance_criteria: "Existing harness/protocol safety tests pass and any new reason maps through the shared typed result without parallel reporting."
    - id: "FR-010"
      description: "Documentation MUST distinguish per-turn provider/tool rounds from invocation-global Registry tool steps."
      acceptance_criteria: "docs/RUN_SAFETY_BOUNDS.md states trigger, counting, reset, code, source, and unset behavior."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "No prohibited provider request may start after the round bound is reached."
      measurable_target: "100% of capture and streaming boundary tests observe no request 33."
    - id: "NFR-002"
      category: "compatibility"
      description: "Runs without max_turns must preserve existing unbounded-round behavior."
      measurable_target: "Unset regression tests expose no new policy or stop reason."
    - id: "NFR-003"
      category: "code_quality"
      description: "The implementation must extend RunSafetyController instead of adding a PR-only CLI loop."
      measurable_target: "No duplicate safety controller, precedence resolver, or result schema is introduced."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Turn-bounded runs cannot perform an unbounded provider/tool loop in one turn."
      metric: "Provider requests before bounded stop"
      target: "At most 32 completed tool-bearing rounds per turn"
    - id: "SC-002"
      description: "Existing safety and output contracts remain compatible."
      metric: "Focused and repository validation"
      target: "All affected tests, build, formatting, Clippy, guardrails, and isolated runtime checks pass"

scope:
  in_scope:
    - "RunSafetyPolicy/RunSafetyController per-turn round state and reason metadata"
    - "Capture and streaming provider-loop enforcement"
    - "Plain/JSON/NDJSON output channel and reason tests"
    - "Run-safety documentation and focused harness/protocol compatibility checks"
  out_of_scope:
    - "PR2 implementation"
    - "Replacing existing max_tool_steps, token_budget, deadline, or max_turns controls"
    - "Interactive TUI behavior"
    - "New user-facing configuration for the fixed implicit value"
    - "Provider-internal tools not represented by a jcode tool-call response"
