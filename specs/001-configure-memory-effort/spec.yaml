feature:
  branch: "001-configure-memory-effort"
  created: "2026-08-02"
  status: "Draft"
  input: "Implement bead jcode-sk5: make the dedicated memory sidecar reasoning effort user-configurable. Add optional agents.memory_reasoning_effort and JCODE_MEMORY_REASONING_EFFORT with environment-over-TOML precedence. Preserve unset defaults exactly: GPT-5.6 Luna uses none, Luna ChatGPT OAuth fallback to GPT-5.4 uses low, and other OpenAI memory models omit reasoning. Validate supported and model-compatible effort values with actionable diagnostics. Report configured and effective memory effort in config summary. Do not inherit from or mutate main-session reasoning. Reuse Sidecar reasoning_override precedence. Add focused tests for defaults, xhigh override, env precedence, main-session isolation, invalid/incompatible values, summary output, and explicit fallback behavior. Follow docs/feature-requests/memory-sidecar-reasoning-effort.md and the jcode-sk5 acceptance criteria."

user_stories:
  - id: "US-001"
    title: "Choose memory reasoning effort"
    priority: "P1"
    as_a: "Jcode user who relies on memory-assisted tasks"
    i_want: "to configure the dedicated memory sidecar's reasoning effort independently"
    so_that: "I can deliberately trade memory-call cost and latency for stronger relevance, reranking, contradiction checks, and extraction judgment"
    why_this_priority: "The feature's primary value is explicit control over the memory sidecar without changing the main session."
    independent_test: "Configure GPT-5.6 Luna as the memory model with xhigh effort and verify that memory requests use xhigh while the main-session effort remains unchanged."
    acceptance_scenarios:
      - given: "GPT-5.6 Luna is selected as the memory model and memory_reasoning_effort is xhigh"
        when: "a memory operation is performed"
        then: "the memory request uses xhigh reasoning effort"
      - given: "the main session has a different reasoning effort"
        when: "a memory effort is configured and memory operations run"
        then: "neither setting inherits from or mutates the other"

  - id: "US-002"
    title: "Override memory effort per environment"
    priority: "P1"
    as_a: "Jcode user operating across multiple environments"
    i_want: "an environment setting to override the persisted memory effort"
    so_that: "I can change memory reasoning behavior without editing shared configuration"
    why_this_priority: "Deterministic environment-over-persisted precedence is required for predictable operation and automation."
    independent_test: "Set conflicting persisted and environment values and verify that the environment value is configured and effective for memory requests only."
    acceptance_scenarios:
      - given: "the persisted memory effort is low and JCODE_MEMORY_REASONING_EFFORT is xhigh"
        when: "configuration is resolved"
        then: "xhigh is the configured and effective memory effort"

  - id: "US-003"
    title: "Understand effective memory behavior"
    priority: "P1"
    as_a: "Jcode user diagnosing cost, latency, or model behavior"
    i_want: "clear validation and a summary of configured and effective memory effort"
    so_that: "I can identify invalid choices and verify defaults or fallbacks before relying on them"
    why_this_priority: "Invisible fallback and invalid configuration would make the new control unreliable and could unexpectedly change cost."
    independent_test: "Inspect summaries for configured, default, omitted, and fallback cases, and verify that invalid or model-incompatible values identify the value, model, and supported alternatives."
    acceptance_scenarios:
      - given: "an unsupported or model-incompatible memory effort is supplied"
        when: "configuration is validated"
        then: "Jcode produces an actionable diagnostic that identifies the invalid value, selected memory model, and allowed alternatives"
      - given: "no memory effort is configured"
        when: "the configuration summary is displayed"
        then: "the summary distinguishes the unset configured value from the effective model-specific behavior"

requirements:
  functional:
    - id: "FR-001"
      description: "The system MUST accept an optional agents.memory_reasoning_effort user setting dedicated to memory-sidecar operations."
      acceptance_criteria: "A configuration containing a valid memory effort loads successfully and the selected effort is observable on a memory request."
    - id: "FR-002"
      description: "The system MUST accept JCODE_MEMORY_REASONING_EFFORT as the environment override for the dedicated memory effort."
      acceptance_criteria: "When only the environment setting is present, its valid value becomes the configured memory effort."
    - id: "FR-003"
      description: "The environment value MUST take precedence over the persisted agents.memory_reasoning_effort value."
      acceptance_criteria: "With conflicting valid values in both sources, a memory request and the configuration summary both reflect the environment value."
    - id: "FR-004"
      description: "An explicit memory effort MUST take precedence over the memory model's built-in or fallback effort for every memory request, including an authentication-driven model fallback."
      acceptance_criteria: "GPT-5.6 Luna configured with xhigh uses xhigh, and a Luna request falling back to GPT-5.4 also uses the explicit xhigh override rather than the built-in low fallback."
    - id: "FR-005"
      description: "When memory effort is unset, GPT-5.6 Luna memory requests MUST continue using none."
      acceptance_criteria: "A focused request test verifies reasoning.effort is none for Luna when neither persisted nor environment memory effort is set."
    - id: "FR-006"
      description: "When memory effort is unset and GPT-5.6 Luna falls back to GPT-5.4 for ChatGPT OAuth availability, the fallback request MUST continue using low."
      acceptance_criteria: "A focused fallback test verifies reasoning.effort is low on the GPT-5.4 retry when no explicit memory effort is set."
    - id: "FR-007"
      description: "When memory effort is unset for any other OpenAI memory model, the system MUST continue omitting an explicit reasoning effort."
      acceptance_criteria: "A focused request test for a non-Luna OpenAI memory model verifies that no reasoning effort is added."
    - id: "FR-008"
      description: "The memory effort MUST neither inherit from nor modify the main-session reasoning effort, regardless of whether the memory effort is unset or explicitly configured."
      acceptance_criteria: "Focused isolation tests use different main-session and memory values and verify each remains unchanged before and after memory operations."
    - id: "FR-009"
      description: "The system MUST validate memory effort values against the supported reasoning-effort vocabulary and the selected memory model's capabilities before use."
      acceptance_criteria: "Tests cover an unknown value and a recognized but model-incompatible value; both produce a diagnostic rather than silently applying or ignoring the value."
    - id: "FR-010"
      description: "Invalid or model-incompatible memory effort diagnostics MUST identify the supplied value, the affected memory model, and the supported alternatives or corrective action."
      acceptance_criteria: "Diagnostic assertions verify all three pieces of actionable context are present without exposing credentials or other secrets."
    - id: "FR-011"
      description: "The configuration summary MUST report both the configured memory effort source result and the effective effort behavior for the resolved memory model."
      acceptance_criteria: "Summary tests cover explicit xhigh, Luna's none default, GPT-5.4 fallback low, and omitted reasoning for another OpenAI memory model."
    - id: "FR-012"
      description: "The default configuration guidance MUST document the optional memory effort setting, its accepted vocabulary, environment override, precedence, and unset behavior."
      acceptance_criteria: "The generated or example configuration describes how explicit, environment, persisted, and model-default behavior resolve without implying inheritance from the main session."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Leaving the new setting unset must preserve all existing memory request behavior and cost characteristics."
      measurable_target: "100% of focused unset-default tests reproduce the pre-feature Luna, OAuth fallback, and other-OpenAI request shapes."
    - id: "NFR-002"
      category: "usability"
      description: "Users must be able to determine the memory effort that will be requested without inferring it from the main session."
      measurable_target: "Every supported configured, default, omitted, and fallback state is represented unambiguously in configuration-summary tests."
    - id: "NFR-003"
      category: "code_quality"
      description: "The change must remain within the existing memory-sidecar configuration and request-resolution contract."
      measurable_target: "No new parallel precedence path, provider-wide default change, or dependency-boundary violation is introduced; all affected repository guardrails pass or are documented as pre-existing failures."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can explicitly select a supported memory reasoning effort and observe the same effective choice on memory operations."
      metric: "Configured-to-effective agreement across supported test cases"
      target: "100% agreement, including xhigh on GPT-5.6 Luna"
    - id: "SC-002"
      description: "Existing users who do not configure memory effort experience no change in memory effort or unexpected cost."
      metric: "Regression results for all documented unset model and fallback paths"
      target: "100% preservation of the three documented unset behaviors"
    - id: "SC-003"
      description: "Users receive enough information to correct invalid memory effort configuration on the first attempt."
      metric: "Required context present in invalid and incompatible diagnostic scenarios"
      target: "100% of diagnostics name the value, model, and supported alternatives or corrective action"
    - id: "SC-004"
      description: "Memory and main-session effort controls remain independent."
      metric: "Cross-setting isolation scenarios"
      target: "Zero inheritance or mutation across all focused isolation tests"

key_entities:
  - name: "Memory reasoning configuration"
    description: "The optional user choice controlling reasoning effort for dedicated memory-sidecar operations."
    attributes:
      - "persisted value"
      - "environment override value"
      - "configured source result"
      - "resolved memory model"
      - "effective request effort or omission"
  - name: "Memory request resolution"
    description: "The observable decision that combines an explicit memory choice with model-specific defaults and authentication fallback behavior."
    attributes:
      - "requested memory model"
      - "actual request model"
      - "explicit effort override"
      - "model-specific default effort"
      - "fallback effort"

edge_cases:
  - scenario: "The environment variable is present but empty or whitespace-only."
    expected_behavior: "It is treated consistently with existing environment-override conventions and does not silently replace a valid persisted value with an unusable effort."
  - scenario: "A recognized effort is valid generally but unsupported by the selected memory model."
    expected_behavior: "Jcode rejects or warns on the combination with an actionable model-specific diagnostic before silently changing request behavior."
  - scenario: "The configured Luna model falls back to GPT-5.4 while an explicit memory effort is present."
    expected_behavior: "The explicit memory effort remains authoritative on the fallback request."
  - scenario: "The resolved non-Luna OpenAI memory model has no explicit memory effort."
    expected_behavior: "No reasoning effort is sent, and the summary describes the effective behavior as provider/model default rather than guessing a level."
  - scenario: "The main-session effort changes while a memory effort is configured or unset."
    expected_behavior: "The effective memory effort remains determined only by the dedicated memory configuration and memory-model rules."

assumptions:
  - "The accepted base vocabulary follows Jcode's existing OpenAI reasoning-effort levels: none, minimal, low, medium, high, xhigh, and max; model capability may narrow that set."
  - "An actionable warning or a configuration error both satisfy invalid-input handling, provided the invalid value is never silently used or ignored and the user receives corrective guidance."
  - "An empty environment value follows the repository's established environment-override normalization rather than defining a new precedence rule."
  - "Configured effort means the resolved explicit user value after environment-over-persisted precedence; effective effort means the value sent for the resolved request model, or an explicit indication that no effort is sent."

constraints:
  - "PRIN-001 applies: changes remain surgical and limited to the memory-sidecar effort outcome."
  - "PRIN-002 and PRIN-003 apply: unset behavior remains backward-compatible and one canonical resolution order governs explicit override, environment, persisted configuration, and built-in model behavior."
  - "PRIN-004 applies: configuration contracts and runtime behavior remain in their existing ownership layers without reversing dependency direction."
  - "PRIN-005 and PRIN-006 apply: focused positive, negative, precedence, fallback, summary, and isolation checks provide executable compliance evidence with actionable trust-boundary validation."
  - "PRIN-007 applies: the specification artifact validator is required at this stage; implementation later requires focused tests, a relevant build, and repository guardrails before delivery."
  - "PRIN-008 applies: the existing sidecar override and configuration resolver remain the single canonical path, with no duplicate extension mechanism or speculative abstraction."
  - "PRIN-009 applies: completion is measured by the user's observable configured and effective memory behavior, while the change performs no destructive, irreversible, or externally visible action requiring approval."
  - "PRIN-010 applies: unset cost and request count remain unchanged, affected request paths receive focused performance-sensitive checks, and runtime claims require validation against the newly built binary."
  - "The existing memory-sidecar explicit reasoning override remains the authoritative runtime precedence mechanism."

out_of_scope:
  - "Changing main-session reasoning configuration, defaults, model-picker behavior, or provider-wide reasoning defaults."
  - "Changing memory relevance, reranking, contradiction, extraction, or other memory policy beyond the effort sent to the selected model."
  - "Adding an interactive memory-effort picker or broader memory settings interface."
  - "Changing authentication selection or the models used by the existing Luna-to-GPT-5.4 fallback."
  - "Guaranteeing a named effective effort when an external OpenAI model receives no explicit reasoning field."

