            - "No code-size, test-size, panic, swallowed-error, dependency-boundary, wildcard-reexport, warning, formatting, clippy, lockfile, or unused-dependency ratchet is worsened or rebaselined."
            - "Final git diff contains only the approved config contract, environment mapping, resolver/request integration, summary/guidance, and focused tests; unrelated dirty files remain untouched."
