implementation_phases:
  - phase: 1
    name: "Configuration contract and resolver"
    goal: "Represent the optional setting and define one deterministic configured/effective resolution contract."
    deliverables:
      - "Add the serde-defaulted AgentsConfig field, environment fingerprint, non-empty environment override, and default configuration guidance."
      - "Add sidecar-owned canonicalization and model-capability validation that returns actionable errors without changing public constructors."
      - "Keep oversized touched files LOC-flat or smaller through reasoning-only local extraction where necessary."
  - phase: 2
    name: "Runtime and diagnostics integration"
    goal: "Use the resolver for all memory request paths and expose the same decision in configuration diagnostics."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Initialize Sidecar reasoning_override from Config and apply it to primary, pre-resolved fallback, and retry fallback OpenAI requests."
      - "Preserve the exact unset none, low, and omitted payload behaviors."
      - "Render configured and effective memory effort, resolved model, omission/default/fallback state, or actionable incompatibility in Config::display_string."
  - phase: 3
    name: "Focused regression evidence and delivery gates"
    goal: "Prove every acceptance path and verify no boundary or baseline regression was introduced."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Add deterministic tests for defaults, xhigh, env precedence including blank input, fallback, invalid/incompatible values, summary output, and main-session isolation."
      - "Run exact-name tests first, then cargo check/test/build for affected packages and scripts/check_guardrails.sh on current stable Rust."
      - "Record any already-known unrelated Cargo.lock, size, test-size, or swallowed-error baseline failures without rebaselining or expanding scope."

risks:
  - id: "RISK-001"
    risk: "The retry-after-unavailable branch could bypass the explicit effort and retain its hardcoded low fallback."
    likelihood: "medium"
    impact: "high"
    mitigation: "Route both fallback entry paths through the same override-or-default resolver and assert the final request payload for each."
  - id: "RISK-002"
    risk: "Configuration summary text could diverge from actual account/model fallback behavior."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Render the summary from the same pure resolution type used by request construction and test each state table."
  - id: "RISK-003"
    risk: "OpenAI catalog metadata may be absent or stale when validating a configured effort."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Use advertised per-model values when available, otherwise accept only the canonical OpenAI base vocabulary and still validate the final resolved backend before sending."
  - id: "RISK-004"
    risk: "Adding directly to oversized source files could worsen repository code-size ratchet failures."
    likelihood: "high"
    impact: "medium"
    mitigation: "Extract only reasoning-specific helpers/tests into the sidecar submodule, keep touched oversized files net-flat or smaller, and never rebaseline unrelated growth."

