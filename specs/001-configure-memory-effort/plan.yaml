research_findings:
  decisions:
    - topic: "Configuration representation and migration"
      decision: "Add memory_reasoning_effort as Option<String> beside memory_model in AgentsConfig and default it to None."
      rationale: "This matches existing provider effort storage, preserves old TOML without migration, and defers model-aware validation to the runtime trust boundary where the resolved backend and model are known."
      alternatives_considered:
        - "Add a new serialized enum, which would reject unknown TOML during deserialization but duplicate the existing provider vocabulary and make forward compatibility stricter."
        - "Store the value only in jcode-base, which would violate the established configuration ownership boundary."
    - topic: "Environment precedence and empty values"
      decision: "Trim and lowercase JCODE_MEMORY_REASONING_EFFORT, apply a non-empty value after TOML loading, and ignore empty or whitespace-only values."
      rationale: "Config::load already applies environment overrides after file parsing, and the existing OpenAI/Anthropic effort variables ignore blanks so a valid persisted effort remains intact."
      alternatives_considered:
        - "Treat blank as an explicit clear, which would silently erase the persisted choice and conflict with the feature edge-case requirement."
        - "Read the environment variable inside Sidecar, which would create a second precedence path outside Config."
    - topic: "Resolution ownership and summary consistency"
      decision: "Create a focused sidecar reasoning-resolution module and have both request construction and Config::display_string consume its configured/effective result."
      rationale: "One pure resolution contract prevents summary drift, supports deterministic tests, and keeps auth/model fallback behavior in the existing sidecar runtime layer."
      alternatives_considered:
        - "Duplicate formatting logic in display_summary.rs, which could disagree with the request path."
        - "Move sidecar runtime rules into jcode-config-types, which would reverse dependency direction and mix stable data with auth/provider behavior."
    - topic: "Supported and model-compatible effort validation"
      decision: "Reuse canonical_reasoning_effort for the base vocabulary, reject Jcode-only swarm sentinels, consult cached OpenAI catalog efforts when present, and reject explicit effort for a resolved backend/model that cannot carry an OpenAI reasoning field."
      rationale: "This reuses current capability sources, produces model-specific alternatives when known, and still permits canonical OpenAI values before catalog metadata is available."
      alternatives_considered:
        - "Maintain a new hardcoded per-model table in the sidecar, which would drift from catalog metadata."
        - "Silently clear incompatible values, which fails the diagnostic and trust-boundary requirements."
    - topic: "Luna OAuth fallback override"
      decision: "Apply the existing reasoning_override to both the pre-resolved fallback path and the retry-after-unavailable path, with the hardcoded low used only when no explicit override exists."
      rationale: "The current primary request already gives reasoning_override precedence, but the retry branch hardcodes low; sharing resolution closes that gap while preserving unset behavior."
      alternatives_considered:
        - "Change the GPT-5.4 fallback default globally, which would increase cost for existing users."
        - "Update only the primary request path, which would fail explicit fallback behavior."
    - topic: "File-size guardrail strategy"
      decision: "Place new pure resolution code and its tests under the sidecar module and locally extract existing reasoning helpers if needed so oversized touched files do not grow."
      rationale: "The branch has recorded pre-existing ratchet failures, and the constitution forbids worsening them; a reasoning-only extraction is directly tied to the feature and keeps the runtime owner intact."
      alternatives_considered:
        - "Append all logic and tests to sidecar.rs, risking a new code-size regression."
        - "Rebaseline the ratchet, which would hide unrelated growth and requires separate review."

data_model:
  entities:
    - name: "MemoryReasoningConfiguration"
      description: "The optional explicit user choice after persisted configuration and environment precedence are resolved."
      fields:
        - name: "persisted_value"
          type: "Option<String>"
          description: "Value deserialized from agents.memory_reasoning_effort."
          constraints: "Unset by default; accepted base values are none, minimal, low, medium, high, xhigh, and max."
        - name: "environment_value"
          type: "Option<String>"
          description: "Trimmed JCODE_MEMORY_REASONING_EFFORT override."
          constraints: "A non-empty value overrides persisted_value; blank input is ignored."
        - name: "configured_value"
          type: "Option<String>"
          description: "The explicit value visible to Sidecar after Config::load precedence."
          constraints: "Must remain independent from all main-session reasoning fields."
      relationships:
        - target: "MemoryRequestResolution"
          type: "one-to-one"
          description: "One configured choice contributes to each sidecar's effective request decision."
    - name: "MemoryRequestResolution"
      description: "The model-aware decision used by payload construction, validation diagnostics, and configuration summary output."
      fields:
        - name: "requested_model"
          type: "String"
          description: "Configured or auto-selected memory model before account fallback."
          constraints: "Must resolve through the existing Sidecar backend selection."
        - name: "request_model"
          type: "String"
          description: "Actual model used for the primary call or OAuth fallback."
          constraints: "GPT-5.6 Luna may resolve to GPT-5.4 only through the existing availability fallback."
        - name: "explicit_override"
          type: "Option<String>"
          description: "Validated configured effort that takes precedence over defaults."
          constraints: "Canonical base vocabulary only and compatible with the resolved model."
        - name: "effective_effort"
          type: "Option<String>"
          description: "Effort sent to OpenAI, or None when the reasoning field is omitted."
          constraints: "Unset Luna resolves to none; unset GPT-5.4 OAuth fallback resolves to low; other unset OpenAI models remain None."
        - name: "effective_description"
          type: "String"
          description: "Non-secret summary text explaining explicit, default, fallback, omitted, or invalid behavior."
          constraints: "Must distinguish configured from effective state and identify the resolved model."
      relationships:
        - target: "MemoryReasoningConfiguration"
          type: "one-to-one"
          description: "Consumes the resolved explicit configuration without reading main-session state."

