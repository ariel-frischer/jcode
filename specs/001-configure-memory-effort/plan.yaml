plan:
  branch: "agent/jcode-sk5"
  created: "2026-08-02"
  spec_path: "specs/001-configure-memory-effort/spec.yaml"

summary: |
  Add the dedicated memory reasoning choice to the existing optional agent
  configuration contract, then resolve it through one sidecar-owned path that
  supplies request construction, model-aware validation, diagnostics, and
  configuration-summary output. JCODE_MEMORY_REASONING_EFFORT will be applied
  after TOML loading and will ignore blank values, matching the existing
  provider reasoning-effort override convention.

  Runtime integration will preserve Sidecar's existing public constructors and
  reasoning_override precedence. A focused reasoning-resolution module will
  distinguish the configured value from the effective request behavior, reuse
  canonical and catalog-advertised effort metadata, and ensure the same explicit
  override wins for the primary Luna request and the GPT-5.4 OAuth fallback.
  Unset Luna, fallback, and other-OpenAI payloads remain byte-for-byte compatible
  in their reasoning fields, and no main-session setting participates in this
  resolution.

technical_context:
  language: "Rust 2024 edition"
  framework: "None"
  primary_dependencies:
    - name: "jcode-config-types"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns the serialized AgentsConfig contract and backward-compatible optional field default."
    - name: "jcode-provider-core"
      version: "workspace path dependency"
      purpose: "Provides canonical OpenAI reasoning-effort vocabulary and model identity helpers."
    - name: "serde"
      version: "1"
      purpose: "Deserializes and serializes the optional TOML configuration field without a migration."
    - name: "toml"
      version: "0.8"
      purpose: "Loads persisted configuration and supports strict parse-path tests."
    - name: "serde_json"
      version: "1"
      purpose: "Builds and asserts OpenAI Responses API request payloads in focused sidecar tests."
    - name: "reqwest"
      version: "0.12"
      purpose: "Existing sidecar HTTP transport; request count and transport behavior remain unchanged."
  storage: "Existing ~/.jcode/config.toml TOML file plus process environment; no new storage"
  testing:
    framework: "Rust built-in test harness with existing jcode-base test utilities"
    approach: "Focused unit and configuration tests for serde defaults, TOML/env precedence, pure resolution and diagnostics, request payloads, fallback, summary output, and main-session isolation; then package build and repository guardrails."
  target_platform: "Jcode-supported Linux, macOS, and Windows CLI/server builds"
  project_type: "cli"
  performance_goals: "No additional requests, network probes, or persistent reads per memory operation; unset request payloads and cost characteristics remain unchanged."
  constraints:
    - "The optional field must deserialize to None for all existing configuration files and preserve current serialized names and defaults."
    - "Resolution order is explicit sidecar override, then JCODE_MEMORY_REASONING_EFFORT, then agents.memory_reasoning_effort, then the existing model-specific default or omission."
    - "Blank or whitespace-only environment values do not replace a valid persisted effort."
    - "Memory reasoning never reads, inherits, writes, or otherwise mutates provider.openai_reasoning_effort or live main-session effort state."
    - "Explicit effort must win on both the primary OpenAI request and an authentication-driven GPT-5.4 retry."
    - "Unsupported vocabulary and resolved-model incompatibility must stop the request with actionable value, model, and alternatives context rather than silently clearing the choice."
    - "No new third-party dependency, provider-wide default, protocol field, interactive picker, or crate-boundary inversion is introduced."
    - "Touched oversized files must stay within repository ratchets; reasoning-only extraction may be used to keep sidecar.rs and config-type changes LOC-flat or smaller."
  scale_scope: "One optional configuration value resolved for each in-process memory sidecar; constant-time string and cached-capability lookup."

