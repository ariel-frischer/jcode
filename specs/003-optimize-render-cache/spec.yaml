feature:
  branch: "003-optimize-render-cache"
  created: "2026-08-08"
  status: "Draft"
  input: "Measure and conditionally remove full render-cache Vec clones for Bead jcode-g25. Work only in the existing assigned worktree. Baseline first. Scope crates/jcode-tui-messages/src/cache.rs and directly required callers/tests. Consider immutable shared views or ownership-preserving cache API only if representative short/large message hit and miss workloads show material general-purpose CPU/memory/allocation improvement with no miss, invalidation, key, width/display-mode, immutability, bounded-policy, public-API, or cross-session regression. No unsafe aliasing, broad Arcification, renderer redesign, speculative dependencies. Rust-heavy commands remain coordinator-gated; produce planning and benchmark design artifacts only until explicit release."

user_stories:
  - id: "US-001"
    title: "Establish a representative render-cache baseline"
    priority: "P1"
    as_a: "Jcode performance maintainer"
    i_want: "repeatable baseline measurements for representative render-cache hits and misses"
    so_that: "I can distinguish a general-purpose improvement from noise or a synthetic-only win"
    why_this_priority: "The baseline is the evidence gate for every subsequent change."
    independent_test: "Run the approved benchmark matrix against the unchanged baseline and confirm it reports CPU time, wall latency, allocation count and volume, and memory for every required workload."
    acceptance_scenarios:
      - given: "representative short and large messages across the supported width and display-mode cases"
        when: "cache hits and cache misses are measured under a controlled repeatable workload"
        then: "the results separately report CPU time, wall latency, allocations, and memory for each case"
      - given: "cache invalidation and concurrent-reader workloads"
        when: "the baseline is measured"
        then: "the results include invalidation cost and cross-session correctness observations"

  - id: "US-002"
    title: "Accept only a material general-purpose optimization"
    priority: "P1"
    as_a: "Jcode maintainer"
    i_want: "a candidate cache ownership change to proceed only when it materially improves representative workloads"
    so_that: "Jcode uses less CPU and memory without trading away miss performance or robustness"
    why_this_priority: "The requested code change is explicitly conditional on measured value."
    independent_test: "Compare baseline and candidate results using the same benchmark matrix and environment, and apply the documented acceptance thresholds."
    acceptance_scenarios:
      - given: "a candidate produces repeatable material gains across representative short and large cache-hit workloads"
        when: "misses, invalidation, memory, and concurrent-reader results remain within the allowed regression budget"
        then: "the candidate is eligible for implementation review"
      - given: "no candidate meets the material-gain and no-regression gates"
        when: "the investigation concludes"
        then: "runtime code remains unchanged and the measured result is documented"

  - id: "US-003"
    title: "Preserve render-cache behavior and isolation"
    priority: "P1"
    as_a: "Jcode TUI user"
    i_want: "cached and uncached messages to render identically and remain isolated between sessions"
    so_that: "performance work cannot introduce stale output, mutation, or compatibility regressions"
    why_this_priority: "Correctness and session isolation are mandatory regardless of measured performance."
    independent_test: "Exercise hit, miss, invalidation, width, display-mode, bounded-policy, immutable-reader, and cross-session scenarios and compare observable output and cache behavior with the baseline."
    acceptance_scenarios:
      - given: "the same message and rendering inputs"
        when: "the result is served from a cache hit or freshly produced after a miss"
        then: "the displayed content and ordering are identical"
      - given: "two sessions with distinct render inputs and concurrent readers"
        when: "both sessions use the render cache"
        then: "neither session observes stale, mutable, or cross-session data"

requirements:
  functional:
    - id: "FR-001"
      description: "The investigation MUST capture an unchanged baseline before evaluating any runtime change."
      acceptance_criteria: "A dated baseline report identifies the tested revision, environment, workload matrix, sample count, and measurements before any candidate result."
    - id: "FR-002"
      description: "The benchmark matrix MUST include cache hits and misses for representative short and large messages."
      acceptance_criteria: "Results contain separate short-hit, short-miss, large-hit, and large-miss measurements."
    - id: "FR-003"
      description: "The benchmark matrix MUST cover multiple representative widths, supported display modes, invalidation, and concurrent readers."
      acceptance_criteria: "Every named dimension has an explicit workload and a reported result or a documented reason it cannot be measured."
    - id: "FR-004"
      description: "Each measured workload MUST report CPU time, wall latency, allocation count, allocated volume, and memory impact."
      acceptance_criteria: "Baseline and candidate reports expose all five measures with consistent units and methodology."
    - id: "FR-005"
      description: "A runtime change MUST be considered only after the baseline and benchmark design receive explicit coordinator release for Rust-heavy execution."
      acceptance_criteria: "Before release, repository changes are limited to specification, planning, and benchmark-design artifacts; no Rust-heavy command result is claimed."
    - id: "FR-006"
      description: "An accepted candidate MUST preserve cache-hit and cache-miss output parity with the unchanged baseline."
      acceptance_criteria: "Focused comparisons show identical rendered content and ordering for every representative hit and miss scenario."
    - id: "FR-007"
      description: "An accepted candidate MUST preserve cache-key, width, display-mode, invalidation, and bounded-policy behavior."
      acceptance_criteria: "Focused checks cover each behavior and show no observable difference from the baseline."
    - id: "FR-008"
      description: "Cached render data MUST remain immutable to callers and MUST NOT become mutable through aliases."
      acceptance_criteria: "Focused checks demonstrate that concurrent or sequential consumers cannot mutate a cached entry or affect another consumer's result."
    - id: "FR-009"
      description: "An accepted candidate MUST prevent stale data from crossing session boundaries."
      acceptance_criteria: "Concurrent, distinct-session workloads complete with zero observed cross-session or stale render results."
    - id: "FR-010"
      description: "An accepted candidate MUST preserve existing public compatibility contracts."
      acceptance_criteria: "Existing public consumers compile and behave unchanged, with no required caller migration outside the approved direct scope."
    - id: "FR-011"
      description: "A candidate MUST be rejected when its gain is limited to a synthetic hit path or when it causes a meaningful miss, invalidation, memory, or correctness regression."
      acceptance_criteria: "The decision report applies the same documented thresholds to the complete matrix and records an accept or reject decision with supporting measurements."
    - id: "FR-012"
      description: "If no candidate passes all evidence gates, the investigation MUST leave runtime behavior unchanged and document the outcome."
      acceptance_criteria: "The final diff contains no runtime cache change, and the report records the tested alternatives, measurements, and rejection reasons."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "An accepted candidate must deliver a repeatable, material improvement in representative cache-hit workloads."
      measurable_target: "At least 10% lower median CPU time and allocated volume for both representative short and large cache-hit workloads across five comparable samples."
    - id: "NFR-002"
      category: "performance"
      description: "An accepted candidate must not materially degrade cache misses, invalidation, latency, or memory."
      measurable_target: "No required workload has more than a 3% median regression in CPU time, wall latency, allocated volume, or peak memory across five comparable samples."
    - id: "NFR-003"
      category: "reliability"
      description: "Rendering correctness, cache invalidation, bounded behavior, immutability, and session isolation must remain exact."
      measurable_target: "Zero mismatches or stale, mutable, cross-session, or bound-violation observations in all focused correctness workloads."
    - id: "NFR-004"
      category: "code_quality"
      description: "Any accepted change must remain surgical and preserve existing ownership and compatibility boundaries."
      measurable_target: "Changes are limited to the render cache and directly required callers/tests, with zero new dependencies and zero public breaking changes."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Maintainers can make an evidence-backed accept-or-reject decision for the proposed optimization."
      metric: "Required benchmark cells with complete comparable baseline and candidate evidence"
      target: "100% of required cells before a runtime change is accepted"
    - id: "SC-002"
      description: "Accepted cache hits reduce rendering resource cost for both ordinary and large messages."
      metric: "Median CPU time and allocation-volume change over five comparable samples"
      target: "At least 10% improvement for both short and large hit workloads"
    - id: "SC-003"
      description: "Users experience no meaningful slowdown or memory increase outside cache-hit gains."
      metric: "Worst median regression across required miss, invalidation, latency, and memory measurements"
      target: "No more than 3%"
    - id: "SC-004"
      description: "Users receive identical, isolated rendering behavior after any accepted optimization."
      metric: "Correctness failures across parity, invalidation, immutability, bounded-policy, and cross-session checks"
      target: "0 failures"

key_entities:
  - name: "Render-cache entry"
    description: "An immutable cached rendering associated with a complete set of rendering inputs."
    attributes:
      - "rendered message content and ordering"
      - "cache identity inputs"
      - "width and display mode"
      - "invalidation state"
  - name: "Benchmark workload"
    description: "A controlled rendering scenario used to compare baseline and candidate behavior."
    attributes:
      - "hit or miss status"
      - "short or large message size"
      - "width and display mode"
      - "reader concurrency and session identity"
      - "CPU, latency, allocation, and memory measurements"
  - name: "Optimization decision"
    description: "The evidence-backed outcome that accepts a candidate or preserves the baseline implementation."
    attributes:
      - "measurement evidence"
      - "threshold evaluation"
      - "correctness and compatibility evidence"
      - "acceptance or rejection rationale"

edge_cases:
  - scenario: "A candidate improves large-message hits but regresses short-message hits or misses."
    expected_behavior: "Reject the candidate unless it still satisfies every general-purpose gain and regression threshold."
  - scenario: "A candidate reduces allocations but retains memory longer or increases peak memory."
    expected_behavior: "Treat retained and peak memory as regressions and reject the candidate when the regression budget is exceeded."
  - scenario: "Widths or display modes produce visually similar but cache-distinct output."
    expected_behavior: "Preserve the existing identity and invalidation distinctions exactly."
  - scenario: "Concurrent readers access an entry while another session invalidates or replaces related data."
    expected_behavior: "Each reader observes a stable immutable result, and no stale data crosses sessions."
  - scenario: "Benchmark variance obscures whether the material-gain threshold is met."
    expected_behavior: "Do not accept the candidate; increase controlled sampling only after coordinator approval."
  - scenario: "No safe candidate meets the acceptance gates."
    expected_behavior: "Keep the runtime code unchanged and retain the benchmark findings as the completed outcome."

assumptions:
  - "Representative short and large message fixtures, supported display modes, and widths will be selected from existing Jcode rendering behavior during planning."
  - "A 10% median improvement across five comparable samples is the default definition of material gain for this investigation."
  - "A 3% median change is the default maximum tolerated performance or memory regression outside the target hit workloads."
  - "All baseline and candidate measurements will use the same machine state, build configuration, inputs, and sampling method."
  - "The existing cache identity, invalidation, bounded-policy, public compatibility, and cross-session behavior are authoritative."

constraints:
  - "Work must remain in the existing assigned worktree for Bead jcode-g25."
  - "Scope is limited to crates/jcode-tui-messages/src/cache.rs and directly required callers, tests, and planning or benchmark-design artifacts."
  - "Rust-heavy commands and runtime implementation require explicit coordinator release and must remain serialized."
  - "Baseline evidence must precede candidate implementation or comparison."
  - "No unsafe aliasing, broad shared-ownership conversion, renderer redesign, or speculative dependency is permitted."
  - "Any runtime implementation is conditional on material, repeatable, general-purpose improvement with all correctness and compatibility gates passing."

out_of_scope:
  - "Changing cache keys, invalidation semantics, width or display-mode behavior, or the bounded cache policy."
  - "Redesigning the renderer or unrelated message-rendering paths."
  - "Converting unrelated data structures to shared ownership."
  - "Adding dependencies without demonstrated necessity."
  - "Accepting unsafe aliasing or caller-visible mutation."
  - "Optimizing only a synthetic cache-hit case while harming representative misses or general workloads."
  - "Running Rust-heavy benchmarks, tests, builds, or implementation before explicit coordinator release."

