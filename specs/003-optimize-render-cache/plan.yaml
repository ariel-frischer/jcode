plan:
  branch: "agent/jcode-g25-render-cache"
  created: "2026-08-08"
  spec_path: "specs/003-optimize-render-cache/spec.yaml"

summary: |
  Establish a controlled, baseline-first benchmark for the existing message render
  cache before changing runtime ownership. Reuse the opt-in tui_bench TestBackend,
  existing render functions, and existing jemalloc/process-memory instrumentation so
  short and large hit, miss, invalidation, width, display-mode, bounded-policy, and
  concurrent-reader workloads are measured through representative caller paths rather
  than only through a synthetic cache lookup.

  After coordinator release for serialized Rust-heavy work, compare the unchanged
  baseline with one narrow immutable shared-view or ownership-preserving prototype.
  Preserve the current Vec-returning public API as a compatibility adapter and change
  direct internal callers only if both short and large representative hit workloads
  improve by at least 10% while every miss, invalidation, latency, and memory result
  stays within 3% and all correctness checks remain exact. If the caller ownership
  boundary forces equivalent cloning or any gate fails, remove the prototype, leave
  runtime behavior unchanged, and publish the rejection evidence.

technical_context:
  language: "Rust 2024 edition"
  framework: "None; Ratatui terminal rendering with the existing TestBackend benchmark path"
  primary_dependencies:
    - name: "ratatui"
      version: "0.30"
      purpose: "Defines Line and Span render data and provides the TestBackend used by representative frame workloads."
    - name: "jcode-tui-messages"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns MessageCacheKey, MessageCacheState, MessageCacheContext, and the public Vec-returning cache function."
    - name: "jcode-config-types"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns the existing DiffDisplayMode and DiagramDisplayMode cache-key contracts."
    - name: "tikv-jemallocator and tikv-jemalloc-ctl"
      version: "existing optional workspace dependencies (0.6)"
      purpose: "Provide allocator statistics for allocation count, allocated volume, active/resident memory, and retained-memory comparison without adding a dependency."
  storage: "One process-global OnceLock<Mutex<MessageCacheState>> containing at most 2048 immutable Arc-backed render entries; benchmark reports are repository artifacts, not runtime persistence."
  testing:
    framework: "Rust built-in test harness plus the existing opt-in tui_bench binary"
    approach: "Add deterministic cache-state and caller parity tests; after coordinator release run five isolated comparable samples per benchmark cell, focused package tests/checks, a built-binary TestBackend workload, and repository guardrails."
  target_platform: "Runtime behavior remains portable across Jcode-supported Linux, macOS, and Windows builds; performance evidence is collected on the assigned Linux coordinator host."
  project_type: "cli"
  performance_goals: "At least 10% lower median CPU time and allocated volume for both representative short and large cache-hit workloads across five comparable samples, with no required miss, invalidation, wall-latency, allocated-volume, or peak-memory median regression above 3%."
  constraints:
    - "Capture and retain the unchanged baseline before creating or measuring any runtime candidate."
    - "Do not run Rust-heavy benchmarks, tests, builds, or implementation until the coordinator explicitly releases serialized execution."
    - "Keep runtime ownership in crates/jcode-tui-messages/src/cache.rs and limit caller changes to the existing jcode-tui cache adapter and directly consuming preparation or viewport paths."
    - "Preserve the complete key, width, diff-mode, diagram-mode, invalidation, bounded-policy, and poison-recovery behavior."
    - "Keep returned cached data immutable and do not introduce unsafe aliasing, broad Arc conversion, renderer redesign, or new dependencies."
    - "Preserve get_cached_message_lines and all existing public import paths and Vec-returning behavior."
    - "Reject a candidate that only wins in a cache-local microbenchmark or whose caller conversion recreates the avoided clone."
  scale_scope: "A bounded 2048-entry process-global message cache, representative 1 KiB and 64 KiB assistant/tool fixtures, widths 80 and 160, supported cache-relevant display modes, single-reader and concurrent-reader cases, and five isolated samples per matrix cell."

constitution_check:
