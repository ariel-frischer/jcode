implementation_phases:
  - phase: 1
    name: "Benchmark contract and execution gate"
    goal: "Finish all allowed non-Rust design work and make the later baseline reproducible before requesting coordinator release."
    deliverables:
      - "Write benchmark-design.md with the bounded workload matrix, deterministic fixtures, five-sample method, environment controls, units, baseline/candidate report schema, and exact acceptance formula."
      - "Record the unchanged revision and verify that every required metric has a collection method; do not run Rust-heavy commands or modify runtime Rust."
      - "Obtain explicit coordinator release before beginning Phase 2."
  - phase: 2
    name: "Harness and unchanged baseline"
    goal: "Capture complete attributable evidence from the unchanged cache before any runtime candidate exists."
    dependencies:
      - "Phase 1"
      - "Explicit coordinator release for serialized Rust-heavy execution"
    deliverables:
      - "Add only benchmark/test instrumentation needed to reset and classify message-cache and prepared-body-cache hits without changing production behavior."
      - "Extend tui_bench with short/large hit, miss, invalidation, width, display-mode, bounded-eviction, and 1/4-reader workloads plus CPU, wall, allocation, and memory output."
      - "Run five isolated samples per required baseline cell against the unchanged cache implementation and write baseline.yaml before creating a candidate."
  - phase: 3
    name: "Conditional ownership prototype"
    goal: "Determine whether one narrow immutable view can remove real caller-visible clone cost while preserving all contracts."
    dependencies:
      - "Phase 2"
    deliverables:
      - "First prove the proposed view can reach direct TUI consumers without equivalent Vec/Line cloning or broader PreparedMessages/renderer redesign; reject immediately if it cannot."
      - "If viable, add one internal immutable shared-view or owned-or-shared path while retaining get_cached_message_lines as an unchanged Vec-returning compatibility adapter."
      - "Add focused parity, key, invalidation, eviction, immutability, concurrent-reader, and distinct-session tests before candidate measurement."
  - phase: 4
    name: "Comparison, decision, and delivery"
    goal: "Apply the complete evidence gates and finish with either a validated surgical optimization or an unchanged runtime."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Run the identical five-sample candidate matrix and calculate per-cell medians, both required hit gains, and the worst miss/invalidation/latency/memory regression."
      - "Accept only if both hit gains are at least 10%, every regression is at most 3%, all required cells are complete, and correctness failures are zero; otherwise remove all runtime candidate edits."
      - "Write decision.md, run exact focused tests first, then relevant package checks/build and scripts/check_guardrails.sh, and record commands/results without claiming unavailable or deferred evidence."

risks:
  - id: "RISK-001"
    risk: "An Arc-return microbenchmark looks faster while direct TUI consumers recreate the deep clone to own or align Lines."
    likelihood: "high"
    impact: "high"
    mitigation: "Require an end-to-end TestBackend gain and reject before implementation if the ownership proof shows equivalent materialization."
  - id: "RISK-002"
    risk: "The higher-level PreparedMessages body cache masks message-cache behavior and produces noisy or irrelevant results."
    likelihood: "high"
    impact: "medium"
    mitigation: "Separate unchanged-body controls from prepared-body invalidation with stable message keys and report cache classification per cell."
  - id: "RISK-003"
    risk: "Allocator retention or process noise makes a reduction in cloned bytes appear as no gain or a memory regression."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Use isolated processes, fixed allocator settings, warmup exclusion, five samples, complete allocator/RSS fields, and the conservative reject-on-uncertainty rule."
  - id: "RISK-004"
    risk: "A process-global cache test leaks state across cases or mistakes concurrency for cross-session isolation."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use local MessageCacheState for deterministic unit tests, explicit benchmark-only resets for process-global scenarios, distinct fixture identities, and serialized stateful cases."
  - id: "RISK-005"
    risk: "Benchmark additions to the large tui_bench or ui_prepare surfaces worsen repository size ratchets."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Keep benchmark logic mode-specific and focused, extract only directly required benchmark code if a touched-file ratchet requires it, and never rebaseline unrelated growth."

