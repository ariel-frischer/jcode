feature:
  branch: "007-session-feedback-proposals"
  created: "2026-08-14"
  status: "Completed"
  input: |-
    Implement Bead jcode-2ho: a standalone, human-triggered `/session-feedback [session-id]` skill workflow that creates review-only improvement proposals. It must work on first run without the session librarian. Evidence acquisition is pluggable: opportunistically use a compatible librarian `summary.json`, otherwise create a deterministic compact fallback bundle only from already-visible session outcomes, todo assessments, tool and skill invocation receipts, bounded failure excerpts, validation receipts, and relevant paths. Normalize both paths into one versioned bounded evidence contract.

    Token efficiency and privacy are non-negotiable. Never load or transmit a full transcript, repeated startup instructions, complete skill corpus, raw edit or patch payloads, images, binary/base64 content, or bulk successful tool output. Do not reread repository files merely to enrich evidence. Perform deterministic local target shortlisting from names, metadata, hashes, invocation outcomes, and cited hiccups. Load a bounded excerpt from a full skill or instruction file only after it is shortlisted as a concrete proposal target, and report its added input size.

    Default generator route: native OpenAI OAuth `gpt-5.6-sol`, effort `medium`, one request maximum. Make model, effort, input/output, evidence, excerpt, proposal, time, and cost limits configurable with clear precedence. Keep this primarily a removable project-local `.jcode/skills/session-feedback/SKILL.md` plus narrow helper/schema/test artifacts that can be copied unchanged to `~/.jcode/skills/session-feedback`. No new `jcode feedback` CLI. No automatic session-end trigger in v1. Avoid core-Jcode changes unless a narrow public integration boundary is strictly required.

    Store outputs only under `~/.jcode/feedback/`. Bootstrap `~/.jcode/feedback/.beads` locally without replication. Deduplicate proposed improvements using normalized target/problem/outcome fingerprints across open, in-progress, and relevant closed Beads. New proposal Beads are `needs-approval`; duplicates append evidence. Proposal Markdown/JSON must include target category and concrete target, evidence references, problem, hypothesis, suggested behavior or patch outline, expected benefit, measured or estimated token/context impact, risk/blast radius, validation plan, confidence, fingerprint, and non-goals. Zero proposals is valid. Never edit targets, apply patches, approve proposals, start implementation, delete or replace skills, or perform destructive/external actions.

    Proposal taxonomy includes global instructions, skills, hooks/config, model/profile choices, context and skill routing, harness setup/contracts, SDK/public surfaces, and Jcode itself. Distinguish personal-global from project-Jcode targets. Keep an orchestrator interface reusable by a later optional pre-close Y/n prompt without implementing that prompt now.

    Use full Autospec spec, plan, and tasks. Emphasize modularity, first-run independence, minimal upstream drift, bounded public slash-flow tests with and without a librarian artifact, no-mutation guarantees, standalone bootstrap failure behavior, dedup behavior, one-request enforcement, and prompt/input accounting. This feedback lane must not depend on Bead jcode-zor and should avoid Rust/Cargo work where skill/helper artifacts suffice.

user_stories:
  - id: "US-001"
    title: "Request session feedback on demand"
    priority: "P0"
    as_a: "Jcode user"
    i_want: "to invoke session feedback for the current or a named session"
    so_that: "I can deliberately review workflow friction without enabling an automatic trigger"
    why_this_priority: "The human-triggered slash workflow is the feature's primary user entry point."
    independent_test: "Invoke the workflow with no session librarian installed and verify it completes using only permitted visible evidence."
    acceptance_scenarios:
      - given: "a completed session with visible outcomes and no librarian artifact"
        when: "the user invokes /session-feedback"
        then: "the workflow produces a bounded review result or explicitly reports zero proposals"
      - given: "a valid visible session identifier"
        when: "the user invokes /session-feedback with that identifier"
        then: "the workflow reviews that session and identifies it in the output"

  - id: "US-002"
    title: "Use bounded privacy-safe evidence"
    priority: "P0"
    as_a: "privacy-conscious user"
    i_want: "feedback generation to use only a compact allowlisted evidence set"
    so_that: "sensitive or high-volume session content is not unnecessarily loaded or transmitted"
    why_this_priority: "Privacy and token efficiency are non-negotiable safety properties."
    independent_test: "Provide fixtures containing both permitted receipts and prohibited transcript, patch, image, binary, and bulk output content, then verify only permitted bounded evidence enters the normalized contract."
    acceptance_scenarios:
      - given: "a compatible librarian summary containing bounded allowed fields"
        when: "feedback evidence is acquired"
        then: "the summary is normalized into the common evidence contract without loading the full transcript"
      - given: "no compatible librarian summary"
        when: "feedback evidence is acquired"
        then: "a deterministic fallback bundle is built only from already-visible allowlisted outcomes and receipts"

  - id: "US-003"
    title: "Generate bounded review-only proposals"
    priority: "P0"
    as_a: "Jcode maintainer"
    i_want: "each proposed improvement to be concrete, evidence-linked, bounded, and review-only"
    so_that: "I can evaluate changes before any target is modified or implementation begins"
    why_this_priority: "The lane must create useful proposals while preserving explicit approval and mutation boundaries."
    independent_test: "Run the generator against deterministic evidence and verify proposal completeness, limits, one-request enforcement, and absence of target mutations."
    acceptance_scenarios:
      - given: "evidence that supports a concrete improvement"
        when: "proposal generation completes"
        then: "the proposal contains every required review field and remains needs-approval"
      - given: "evidence that does not support a sufficiently confident improvement"
        when: "proposal generation completes"
        then: "the workflow succeeds with zero proposals"

  - id: "US-004"
    title: "Deduplicate improvement proposals"
    priority: "P1"
    as_a: "proposal reviewer"
    i_want: "repeated findings to update an existing proposal rather than create duplicates"
    so_that: "the approval queue remains concise while preserving new evidence"
    why_this_priority: "Deduplication is required for repeated human-triggered reviews to remain usable."
    independent_test: "Run two reviews with normalized equivalent target, problem, and outcome data across multiple Bead states and verify one proposal remains with appended evidence."
    acceptance_scenarios:
      - given: "an open, in-progress, or relevant closed proposal with the same normalized fingerprint"
        when: "equivalent evidence is reviewed"
        then: "new evidence is appended to that proposal and no new proposal is created"
      - given: "no matching normalized fingerprint"
        when: "a valid proposal is produced"
        then: "a new local needs-approval proposal is created"

  - id: "US-005"
    title: "Configure generation budgets predictably"
    priority: "P1"
    as_a: "workflow operator"
    i_want: "generation route and resource limits to have explicit configurable precedence"
    so_that: "I can control model choice, privacy exposure, latency, output volume, and cost"
    why_this_priority: "Predictable bounds are necessary for safe routine use but follow the core review flow."
    independent_test: "Exercise built-in defaults, persisted settings, environment overrides, invocation overrides, and invalid values, then verify the effective non-secret configuration and enforced limits."
    acceptance_scenarios:
      - given: "no configuration overrides"
        when: "feedback runs"
        then: "it uses native OpenAI OAuth gpt-5.6-sol at medium effort with at most one generation request"
      - given: "the same setting at multiple supported levels"
        when: "effective configuration is resolved"
        then: "the documented highest-precedence valid value is used"

  - id: "US-006"
    title: "Operate as a removable standalone skill"
    priority: "P1"
    as_a: "Jcode custom-distribution maintainer"
    i_want: "the workflow to live primarily in a copyable project-local skill with narrow supporting artifacts"
    so_that: "it can be installed globally or removed with minimal upstream drift and no unnecessary core changes"
    why_this_priority: "Removability and first-run independence preserve architectural simplicity."
    independent_test: "Copy the skill directory unchanged to the user skill location, invoke it in an environment without prior feedback state, and verify local bootstrap and review behavior."
    acceptance_scenarios:
      - given: "no feedback data directory or local feedback Beads store"
        when: "the workflow runs for the first time"
        then: "it bootstraps local non-replicated state or fails visibly without partial external effects"
      - given: "the standalone skill artifacts are removed"
        when: "normal Jcode workflows continue"
        then: "existing behavior remains unchanged"

requirements:
  functional:
    - id: "FR-001"
      description: "The workflow MUST be invocable only through a human-triggered /session-feedback slash flow, with an optional session identifier."
      testable: true
      acceptance_criteria: "Public slash-flow tests verify invocation with no identifier and with a valid identifier, and verify no automatic session-end invocation occurs."
    - id: "FR-002"
      description: "The workflow MUST complete its first run without requiring a session librarian or any dependency on Bead jcode-zor."
      testable: true
      acceptance_criteria: "A clean-environment test with no librarian artifact and no jcode-zor resources completes through the fallback evidence path."
    - id: "FR-003"
      description: "Evidence acquisition MUST opportunistically accept a compatible librarian summary.json and otherwise use the deterministic fallback path."
      testable: true
      acceptance_criteria: "Separate fixtures with and without a compatible summary select the expected path and produce equivalent contract versions."
    - id: "FR-004"
      description: "Both evidence paths MUST normalize into one explicitly versioned, bounded evidence contract."
      testable: true
      acceptance_criteria: "Normalized output from both paths validates against the same contract version and rejects unsupported versions or oversized fields with actionable errors."
    - id: "FR-005"
      description: "The fallback bundle MUST contain only already-visible session outcomes, todo assessments, tool and skill invocation receipts, bounded failure excerpts, validation receipts, and relevant paths."
      testable: true
      acceptance_criteria: "An allowlist test verifies every fallback field originates from an enumerated visible evidence category and unlisted categories are excluded."
    - id: "FR-006"
      description: "The workflow MUST NOT load or transmit full transcripts, repeated startup instructions, complete skill corpora, raw edit or patch payloads, images, binary or base64 content, or bulk successful tool output."
      testable: true
      acceptance_criteria: "Sentinel fixtures for each prohibited content class remain absent from evidence, shortlisted excerpts, prompts, outputs, and request recordings."
    - id: "FR-007"
      description: "The workflow MUST NOT reread repository files merely to enrich evidence."
      testable: true
      acceptance_criteria: "Invocation receipts show no repository content reads before a concrete target is shortlisted, except artifacts explicitly supplied as visible session evidence."
    - id: "FR-008"
      description: "The workflow MUST shortlist proposal targets deterministically from names, metadata, hashes, invocation outcomes, and cited hiccups before reading any target excerpt."
      testable: true
      acceptance_criteria: "Repeated runs on identical evidence produce the same ordered shortlist and shortlist decisions cite only permitted metadata."
    - id: "FR-009"
      description: "The workflow MAY load a bounded excerpt from a full skill or instruction file only after that file is shortlisted as a concrete proposal target."
      testable: true
      acceptance_criteria: "Tests verify non-shortlisted files are never opened and shortlisted excerpts never exceed the configured excerpt limit."
    - id: "FR-010"
      description: "The workflow MUST report the added input size of every loaded target excerpt."
      testable: true
      acceptance_criteria: "Prompt accounting identifies each excerpt and reports its measured added size with totals matching the final request input."
    - id: "FR-011"
      description: "The default generation route MUST use native OpenAI OAuth with model gpt-5.6-sol, medium effort, and no more than one request per invocation."
      testable: true
      acceptance_criteria: "A default-route test records the provider, authentication route, model, effort, and exactly zero or one generation requests."
    - id: "FR-012"
      description: "Model, effort, request input, request output, evidence, excerpt, proposal count, elapsed time, and cost limits MUST be configurable with one documented precedence order."
      testable: true
      acceptance_criteria: "A precedence matrix covers invocation overrides, environment overrides, persisted configuration, built-in defaults, invalid values, empty values, and unsupported values."
    - id: "FR-013"
      description: "All configured limits MUST be enforced before or during work so an invocation cannot silently exceed an effective bound."
      testable: true
      acceptance_criteria: "Boundary tests at, below, and above every limit show accepted work, deterministic truncation where allowed, or an actionable failure without a second request."
    - id: "FR-014"
      description: "All feedback state and generated output MUST be stored only beneath ~/.jcode/feedback/."
      testable: true
      acceptance_criteria: "A filesystem side-effect test verifies no new output or state appears outside the isolated feedback root."
    - id: "FR-015"
      description: "On first run, the workflow MUST bootstrap ~/.jcode/feedback/.beads as a local store without replication."
      testable: true
      acceptance_criteria: "A clean-home test verifies local initialization, absence of replication configuration or network activity, and successful subsequent access."
    - id: "FR-016"
      description: "A standalone bootstrap failure MUST be visible and MUST NOT leave a falsely successful proposal result or perform external actions."
      testable: true
      acceptance_criteria: "Injected permission and initialization failures return actionable errors, produce no proposal success marker, and cause no network or target mutation."
    - id: "FR-017"
      description: "The workflow MUST compute a deterministic fingerprint from normalized concrete target, problem, and intended outcome data."
      testable: true
      acceptance_criteria: "Equivalent normalized inputs yield identical fingerprints while a material target, problem, or outcome change yields a different fingerprint."
    - id: "FR-018"
      description: "Deduplication MUST search open, in-progress, and relevant closed feedback proposal Beads for a matching fingerprint."
      testable: true
      acceptance_criteria: "State-specific fixtures verify matches are found in each required state and unrelated closed Beads are ignored."
    - id: "FR-019"
      description: "When a fingerprint match exists, the workflow MUST append new evidence to the existing proposal rather than create another proposal."
      testable: true
      acceptance_criteria: "A repeated review leaves one proposal identity, preserves existing content, appends nonduplicate evidence references, and records the new review occurrence."
    - id: "FR-020"
      description: "When no fingerprint match exists, every new proposal Bead MUST be created locally with needs-approval status."
      testable: true
      acceptance_criteria: "A unique finding creates exactly one local proposal in needs-approval state and does not approve or start it."
    - id: "FR-021"
      description: "Each proposal's Markdown and JSON representations MUST include target category, concrete target, evidence references, problem, hypothesis, suggested behavior or patch outline, expected benefit, token or context impact, risk and blast radius, validation plan, confidence, fingerprint, and non-goals."
      testable: true
      acceptance_criteria: "Schema and rendering tests reject missing required fields and verify semantic parity between Markdown and JSON."
    - id: "FR-022"
      description: "The proposal taxonomy MUST support global instructions, skills, hooks or configuration, model or profile choices, context and skill routing, harness setup or contracts, SDK or public surfaces, and Jcode itself."
      testable: true
      acceptance_criteria: "Taxonomy fixtures validate one proposal for every category and reject unknown categories unless a versioned contract explicitly allows them."
    - id: "FR-023"
      description: "Proposal targets MUST distinguish personal-global scope from project-Jcode scope."
      testable: true
      acceptance_criteria: "Target classification tests show otherwise similar personal and project targets receive distinct concrete identities and fingerprints."
    - id: "FR-024"
      description: "The workflow MUST treat zero proposals as a successful valid outcome."
      testable: true
      acceptance_criteria: "A no-finding fixture exits successfully, records bounded accounting, and creates no proposal Bead."
    - id: "FR-025"
      description: "The workflow MUST never edit a proposed target, apply a patch, approve a proposal, start implementation, delete or replace a skill, or perform destructive or external actions."
      testable: true
      acceptance_criteria: "No-mutation tests instrument filesystem, Bead state transitions, process execution, and network access and verify only allowed feedback-root writes and the single configured generation request can occur."
    - id: "FR-026"
      description: "The workflow MUST expose a reusable review orchestrator interface that can later be called by an optional pre-close confirmation flow without implementing or enabling that prompt in version 1."
      testable: true
      acceptance_criteria: "A contract test invokes the same orchestrator through the slash flow while confirming no pre-close prompt or automatic hook is registered."
    - id: "FR-027"
      description: "The standalone skill and its supporting contract artifacts MUST be copyable unchanged from project-local to user-global skill scope."
      testable: true
      acceptance_criteria: "The same artifact set passes slash-flow tests from both supported locations without source modification."
    - id: "FR-028"
      description: "The workflow MUST report effective non-secret configuration, evidence size, excerpt size, request input and output size, proposal count, elapsed time, and measured or bounded estimated cost."
      testable: true
      acceptance_criteria: "Accounting tests reconcile reported totals with fixture sizes and request receipts while confirming no credential values are disclosed."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Evidence processing and generation must minimize sensitive data exposure through explicit allowlists and bounded transmission."
      measurable_target: "100% of prohibited-content sentinel tests remain absent from normalized evidence and generated request input."
    - id: "NFR-002"
      category: "performance"
      description: "The workflow must maintain strict context and output budgets suitable for routine human-triggered use."
      measurable_target: "Every invocation stays within configured evidence, excerpt, input, output, proposal, time, and cost limits, with zero unaccounted bytes or tokens in test fixtures."
    - id: "NFR-003"
      category: "reliability"
      description: "Equivalent visible evidence and configuration must produce deterministic acquisition, normalization, shortlisting, and fingerprinting behavior."
      measurable_target: "100 repeated fixture runs produce identical normalized contracts, shortlist ordering, and fingerprints."
    - id: "NFR-004"
      category: "reliability"
      description: "Failures at local storage, evidence compatibility, limit enforcement, and generation boundaries must be actionable and must preserve review-only safety."
      measurable_target: "All injected boundary failures return a non-success result with no target mutation, no duplicate proposal, and no unauthorized external action."
    - id: "NFR-005"
      category: "usability"
      description: "A user must be able to understand what was reviewed, what was proposed, and what resources were consumed."
      measurable_target: "Every successful run reports session identity, evidence path, proposal count, accounting summary, and proposal locations or an explicit zero-proposal result."
    - id: "NFR-006"
      category: "code_quality"
      description: "The feature must remain modular, removable, and minimally coupled to Jcode core behavior."
      measurable_target: "The accepted design uses the existing slash-skill surface, adds no new feedback CLI, and requires zero core changes unless a documented narrow public boundary is proven necessary."
    - id: "NFR-007"
      category: "security"
      description: "All proposal persistence must remain local and non-replicated by default."
      measurable_target: "Clean-environment and failure tests observe zero replication configuration, zero proposal publication, and zero network activity other than the permitted generation request."
    - id: "NFR-008"
      category: "code_quality"
      description: "Acceptance evidence must directly cover the public workflow and every safety boundary."
      measurable_target: "Automated checks cover slash flows with and without librarian evidence, bootstrap failure, dedup states, no mutation, one-request enforcement, and complete accounting."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can obtain a review result on the first invocation without installing or running a session librarian."
      metric: "Successful clean-environment slash-flow completion rate"
      target: "100% for valid fallback-evidence fixtures"
    - id: "SC-002"
      description: "Feedback reviews disclose no prohibited session or repository content."
      metric: "Prohibited-content leakage rate across privacy fixtures"
      target: "0%"
    - id: "SC-003"
      description: "Every review remains within its declared resource and proposal budgets."
      metric: "Invocations exceeding any effective configured limit"
      target: "0"
    - id: "SC-004"
      description: "A review uses no more than one generation request while still allowing a valid zero-proposal outcome."
      metric: "Generation requests per invocation"
      target: "0 or 1, never more than 1"
    - id: "SC-005"
      description: "Repeated equivalent findings do not increase the proposal queue."
      metric: "New proposal count for an existing normalized fingerprint"
      target: "0, with new evidence appended to the existing proposal"
    - id: "SC-006"
      description: "Reviewers receive complete, decision-ready proposal records whenever an improvement is suggested."
      metric: "Required proposal fields present and consistent across Markdown and JSON"
      target: "100%"
    - id: "SC-007"
      description: "Running feedback never changes the proposed target or advances a proposal beyond review."
      metric: "Unauthorized target mutations or proposal state transitions"
      target: "0"
    - id: "SC-008"
      description: "The feedback feature can be removed without altering normal Jcode behavior."
      metric: "Regression failures in existing workflows after skill artifact removal"
      target: "0"

key_entities:
  - name: "Feedback Invocation"
    description: "One human-triggered review request for a current or named session."
    attributes:
      - "session identity"
      - "effective configuration"
      - "evidence source"
      - "accounting totals"
      - "completion outcome"
  - name: "Normalized Evidence Bundle"
    description: "A versioned bounded representation shared by librarian and fallback evidence paths."
    attributes:
      - "contract version"
      - "allowed evidence references"
      - "bounded failure excerpts"
      - "validation and invocation receipts"
      - "relevant paths and hashes"
      - "size accounting"
  - name: "Target Shortlist Entry"
    description: "A deterministic candidate improvement target selected before any bounded file excerpt is loaded."
    attributes:
      - "target category"
      - "target scope"
      - "concrete target identity"
      - "selection evidence"
      - "metadata hash"
      - "excerpt allowance and size"
  - name: "Improvement Proposal"
    description: "A review-only recommendation requiring explicit approval before any implementation."
    attributes:
      - "target and evidence references"
      - "problem and hypothesis"
      - "suggested behavior or patch outline"
      - "benefit and token impact"
      - "risk, validation, confidence, and non-goals"
      - "normalized fingerprint"
  - name: "Feedback Proposal Bead"
    description: "The local approval record used to persist and deduplicate improvement proposals."
    attributes:
      - "needs-approval state"
      - "fingerprint"
      - "evidence history"
      - "open, in-progress, or relevant closed lifecycle state"
  - name: "Generation Budget"
    description: "The resolved set of limits and route choices governing one review."
    attributes:
      - "model and effort"
      - "input and output limits"
      - "evidence and excerpt limits"
      - "proposal, time, and cost limits"
      - "configuration source precedence"

edge_cases:
  - scenario: "The requested session identifier is missing, unknown, or not visible to the workflow."
    expected_behavior: "Fail with an actionable message and create no proposal or partial feedback state beyond safe local diagnostics."
  - scenario: "A librarian summary exists but has an unsupported version, malformed fields, prohibited content, or exceeds evidence limits."
    expected_behavior: "Reject it visibly and use the deterministic fallback only if the fallback can be built entirely from permitted already-visible evidence; otherwise fail safely."
  - scenario: "There is too little evidence to support a concrete improvement."
    expected_behavior: "Complete successfully with zero proposals and report the evidence and accounting outcome."
  - scenario: "The shortlist contains a target whose file is missing, unreadable, or larger than the excerpt budget."
    expected_behavior: "Do not broaden repository reads; omit or boundedly handle the excerpt, lower confidence as appropriate, and remain within limits."
  - scenario: "The configured generation request fails or times out."
    expected_behavior: "Do not retry beyond the one-request maximum, report the failure, and create no unsupported proposal."
  - scenario: "The output is malformed, oversized, or contains an unknown proposal category."
    expected_behavior: "Reject the invalid result without creating or updating proposal Beads."
  - scenario: "The feedback root is unwritable or local Beads bootstrap is partially initialized."
    expected_behavior: "Fail visibly, avoid replication and external actions, and do not claim successful proposal persistence."
  - scenario: "An equivalent fingerprint exists in more than one legacy or inconsistent proposal record."
    expected_behavior: "Do not create another proposal; report the ambiguity for review and avoid destructive consolidation."
  - scenario: "New evidence exactly duplicates evidence already attached to a matching proposal."
    expected_behavior: "Keep one proposal and avoid appending a duplicate evidence reference while recording a bounded invocation outcome if appropriate."
  - scenario: "Configuration values are empty, invalid, unsupported, or conflict across levels."
    expected_behavior: "Apply the documented precedence and validation contract, report effective non-secret values, and fail before generation when no safe valid value can be resolved."

assumptions:
  - "The existing slash-skill mechanism can supply or expose bounded session outcomes and invocation receipts without requiring full transcript access."
  - "Compatible librarian summaries are optional inputs and are not the authority for feedback persistence or proposal approval."
  - "Relevant closed Beads means closed feedback proposals still within the deduplication policy, not every closed project Bead."
  - "Measured token counts are preferred; deterministic estimates are acceptable where exact provider accounting is unavailable and must be labeled as estimates."
  - "The canonical configuration precedence follows explicit invocation override, environment override, persisted feedback configuration, then built-in default."
  - "Only the single configured model-generation request may use the network; local Beads bootstrap and all other workflow operations remain offline."
  - "Proposal creation and evidence append operations are permitted review-record mutations under the feedback root, while all proposed targets and approval states remain immutable."
  - "A bounded excerpt may be omitted when metadata evidence is sufficient or when loading it would violate an effective limit."

constraints:
  - "The primary deliverable is a removable project-local .jcode/skills/session-feedback skill plus only narrow helper, schema, and test artifacts."
  - "The project-local artifact set must be copyable unchanged to ~/.jcode/skills/session-feedback."
  - "All persisted feedback outputs and state must remain under ~/.jcode/feedback/."
  - "The local feedback Beads store must not replicate."
  - "No new jcode feedback CLI may be added."
  - "No automatic session-end or pre-close prompt may be implemented in version 1."
  - "Core Jcode changes are disallowed unless a narrow public integration boundary is strictly necessary and documented; the shipped headless `jcode run` preparation path injects the trusted current session ID only for a bare `/session-feedback`, matching the TUI slash boundary without changing explicit arguments."
  - "The workflow must not depend on Bead jcode-zor."
  - "Rust or Cargo changes should be avoided when skill and helper artifacts can satisfy the accepted behavior."
  - "The default route is native OpenAI OAuth gpt-5.6-sol at medium effort with a maximum of one generation request."
  - "The design must preserve existing behavior when the skill is absent or unused and minimize upstream synchronization drift."

out_of_scope:
  - "Automatically invoking feedback at session end or before session close."
  - "Implementing the future optional pre-close Y/n user experience."
  - "Adding a dedicated jcode feedback command or a new general plugin system."
  - "Editing instructions, skills, hooks, configuration, profiles, SDKs, harnesses, or Jcode source based on a proposal."
  - "Applying patches, approving proposals, starting implementation, or changing proposal ownership automatically."
  - "Deleting, replacing, or destructively consolidating skills or proposal records."
  - "Uploading, publishing, replicating, or otherwise externally distributing feedback records."
  - "Reading full transcripts or broad repository content for richer feedback."
  - "Depending on the session librarian or Bead jcode-zor for first-run operation."
  - "General-purpose session analytics, telemetry, or continuous background monitoring."

