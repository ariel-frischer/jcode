plan:
  branch: "agent/jcode-2ho-feedback"
  created: "2026-08-14"
  spec_path: "specs/007-session-feedback-proposals/spec.yaml"

summary: |
  Implement session feedback as a removable project-local slash skill whose Markdown
  orchestrator owns the human-triggered workflow and whose dependency-free Python helper
  owns deterministic configuration resolution, evidence normalization, target shortlisting,
  budget enforcement, proposal validation, fingerprinting, accounting, and local persistence.
  The same directory is location-independent so it can be copied unchanged from
  .jcode/skills/session-feedback to ~/.jcode/skills/session-feedback. No production Rust,
  protocol, SDK, hook, or new CLI surface is planned.

  Evidence enters through one versioned allowlisted JSON contract. A compatible librarian
  summary is accepted only when its already-visible path is explicitly cited; otherwise the
  skill constructs the same contract from bounded visible outcomes and receipts without
  rereading repository content. After deterministic shortlisting, only bounded excerpts from
  concrete skill or instruction targets may be read. One schema-constrained `jcode run`
  invocation generates zero or more review-only proposals, which are validated and then
  deduplicated into a local non-replicated Beads store beneath ~/.jcode/feedback/.

technical_context:
  language: "Python 3 standard library and Markdown skill instructions; Rust 2024 tests only where needed for the public slash surface"
  framework: "None"
  primary_dependencies:
    - name: "Python standard library"
      version: ">=3.10"
      purpose: "Provides deterministic JSON, hashing, subprocess, path, time, and unittest support without adding package dependencies."
    - name: "Jcode CLI"
      version: "workspace v0.75.3-dev or newer compatible build"
      purpose: "Provides the existing slash-skill surface and the bounded native OpenAI OAuth `jcode run` generation path."
    - name: "Beads CLI"
      version: "installed `bd` with Dolt backend"
      purpose: "Bootstraps and maintains the local review queue, lifecycle labels, comments, and deduplication records under the feedback root."
    - name: "JSON Schema"
      version: "Draft 2020-12"
      purpose: "Defines versioned evidence, generator-response, proposal, and run-accounting contracts consumed by the helper and `jcode run --schema`."
  storage: "Local files only under ~/.jcode/feedback/: config.json, runs/, proposals/, and a non-replicated .beads Dolt store"
  testing:
    framework: "Python unittest plus existing Rust built-in test harness for slash-skill discovery and activation"
    approach: "Pure unit tests cover normalization, privacy filters, ordering, limits, fingerprints, rendering, and accounting; temporary-home integration tests cover first-run bootstrap, dedup states, failure atomicity, and filesystem/network allowlists; bounded public slash-flow tests cover current and named sessions with and without librarian evidence using an injected fake generator instead of a live paid request."
  target_platform: "Jcode-supported Linux and macOS first, with path and subprocess behavior kept portable for Windows where the existing Python, jcode, and bd executables are available"
  project_type: "cli"
  performance_goals: "Every invocation remains within effective evidence, excerpt, request-input, request-output, proposal-count, elapsed-time, and cost limits; deterministic fixtures have zero unaccounted bytes or tokens; generation performs exactly zero or one model request."
  constraints:
    - "The only user entry point is the human-triggered /session-feedback [session-id] skill flow."
    - "The workflow must succeed on first run without a session librarian or Bead jcode-zor."
    - "Never load or transmit full transcripts, startup instruction repetition, complete skill corpora, raw edit or patch payloads, images, binary/base64 data, or bulk successful tool output."
    - "Do not read repository files before deterministic target shortlisting; read only bounded excerpts from shortlisted skill or instruction targets."
    - "Configuration precedence is invocation override, environment override, ~/.jcode/feedback/config.json, then built-in default."
    - "The default generation route is native OpenAI OAuth, model gpt-5.6-sol, medium effort, with one request maximum."
    - "All feedback-specific state and outputs remain under ~/.jcode/feedback/ and Beads replication is never configured."
    - "Proposal creation and evidence append are the only permitted mutations; targets and approval state remain unchanged."
    - "No production core-Jcode, Cargo dependency, feedback CLI, automatic hook, pre-close prompt, patch application, approval, or implementation behavior is added."
    - "The artifact directory must work unchanged from project-local and user-global skill locations."
  scale_scope: "One bounded human-triggered review at a time, a small configurable proposal count per invocation, and a local proposal queue searched by normalized fingerprint across feedback-labeled open, in-progress, and closed records."

