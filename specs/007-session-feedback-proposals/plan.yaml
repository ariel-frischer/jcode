    - path: ".jcode/skills/session-feedback/SKILL.md"
      description: "Normative slash workflow, safety boundary, visible-evidence acquisition rules, configuration interface, and reusable review orchestrator entry contract."
    - path: ".jcode/skills/session-feedback/schemas/evidence-v1.schema.json"
      description: "Versioned bounded normalized evidence contract."
    - path: ".jcode/skills/session-feedback/schemas/generator-response-v1.schema.json"
      description: "Schema supplied to the single `jcode run` request."
    - path: ".jcode/skills/session-feedback/schemas/proposal-v1.schema.json"
      description: "Canonical review proposal and Markdown/JSON parity contract."
  source_code:
    - path: ".jcode/skills/session-feedback/session_feedback.py"
      description: "Location-independent deterministic orchestrator helper for config, schemas, bounds, shortlisting, invocation, accounting, fingerprints, deduplication, and persistence."
    - path: ".jcode/skills/session-feedback/__main__.py"
      description: "Thin reusable local entry point used by the slash skill now and a possible future pre-close caller without registering that caller."
    - path: ".jcode/skills/session-feedback/fixtures/"
      description: "Small allowlisted librarian, fallback, generator, dedup, and prohibited-content fixtures."
  tests:
    - path: ".jcode/skills/session-feedback/tests/test_session_feedback.py"
      description: "Dependency-free unit and temporary-home integration coverage for contracts, privacy, budgets, determinism, bootstrap, dedup, accounting, and no-mutation guarantees."
    - path: "crates/jcode-tui/src/tui/app/tests/"
      description: "Focused tests proving the real project-local and copied global skill are discoverable and `/session-feedback` forwards current or named-session arguments without any automatic trigger."
    - path: "scripts/check_guardrails.sh"
      description: "Existing delivery gate, run with --skip-slow for the skill/schema-only path unless Rust test changes require the corresponding focused Cargo checks."

implementation_phases:
  - phase: 1
    name: "Contracts and deterministic core"
    goal: "Define versioned contracts and implement pure configuration, normalization, privacy, shortlisting, fingerprinting, and accounting behavior."
    deliverables:
      - "Evidence, generator-response, and proposal JSON Schemas"
      - "Location-independent Python helper with explicit configuration precedence"
      - "Allowlist, prohibited-content, deterministic ordering, bounds, and fingerprint tests"
  - phase: 2
    name: "Standalone slash orchestrator and generation boundary"
    goal: "Expose the human-triggered current/named-session workflow and enforce one bounded native OAuth generation request."
    dependencies:
      - "Phase 1"
    deliverables:
      - "/session-feedback skill instructions and reusable orchestrator entry point"
      - "Librarian adapter and first-run fallback evidence path"
      - "Post-shortlist bounded excerpt loading with measured input accounting"
      - "Schema-constrained no-tools `jcode run` invocation with request, time, token, output, and cost controls"
  - phase: 3
    name: "Local persistence and deduplication"
    goal: "Persist only validated review records beneath the feedback root and keep one approval record per normalized finding."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Idempotent non-replicated ~/.jcode/feedback/.beads bootstrap"
      - "needs-approval proposal creation with Markdown/JSON parity"
      - "Open, in-progress, and relevant closed fingerprint lookup"
      - "Nonduplicate evidence append and ambiguous-match safe failure"
  - phase: 4
    name: "Public safety and failure validation"
    goal: "Prove the workflow's public slash behavior, first-run independence, strict side-effect boundary, and complete accounting."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Current and named-session slash tests with and without librarian evidence"
      - "Clean-home, copied-global-skill, bootstrap failure, malformed output, timeout, and zero-proposal tests"
      - "One-request, no-target-mutation, no-replication, process/network allowlist, and prohibited-content sentinel checks"
      - "100-run determinism and exact accounting assertions"
  - phase: 5
    name: "Delivery and runtime verification"
    goal: "Validate the artifact and executing slash workflow while preserving minimal upstream drift."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Autospec artifact/schema validation and focused Python/Rust tests"
      - "Formatting and repository guardrails with the applicable skip-slow exception"
      - "Isolated executing-binary slash smoke using a fake generator, with resolved binary identity recorded"
      - "Changelog or targeted documentation update only if repository delivery conventions require it"

