research_findings:
  decisions:
    - topic: "Feature ownership and implementation language"
      decision: "Keep orchestration in .jcode/skills/session-feedback/SKILL.md and place deterministic mechanics in a dependency-free Python helper beside it."
      rationale: "Project-local skills are already discovered dynamically and can be copied to the global skill directory unchanged. Python keeps schemas, fixtures, and deterministic transforms small without adding Cargo dependencies or production core code."
      alternatives_considered:
        - "Add a `jcode feedback` Rust command, which is explicitly out of scope and increases upstream drift."
        - "Use a prompt-only skill, which cannot reliably enforce deterministic limits, fingerprints, schemas, and atomic persistence."
        - "Use shell helpers, which are less portable and less suitable for structured validation and tests."
    - topic: "Evidence acquisition without transcript loading"
      decision: "Accept a librarian summary only through an explicitly cited already-visible path and normalize it with a versioned adapter; otherwise have the skill serialize only the enumerated visible evidence categories into the same contract."
      rationale: "There is no existing repository librarian contract or canonical discovery path. Explicit path injection is pluggable, avoids filesystem scans, and preserves first-run independence."
      alternatives_considered:
        - "Search session directories broadly for summary.json, which would violate bounded-read requirements."
        - "Require the librarian, which violates the standalone first-run outcome."
        - "Read stored transcripts to reconstruct evidence, which violates the privacy contract."
    - topic: "Deterministic target shortlisting and excerpts"
      decision: "Sort candidates by normalized scope, category, concrete target, metadata hash, failure relevance, and stable tie-breakers; only then permit bounded reads of exact skill or instruction targets."
      rationale: "A pure deterministic stage makes repeated runs reproducible and proves repository content was not used to select targets."
      alternatives_considered:
        - "Ask the generator to choose files from repository contents, which would require broad reads and make selection nondeterministic."
        - "Load every skill or instruction file up front, which violates token and privacy constraints."
    - topic: "Generation route and request enforcement"
      decision: "Build exactly one `jcode run --provider openai --model gpt-5.6-sol --reasoning-effort medium --tool-profile none --max-turns 1 --schema ... --json` command after all local validation, adding token-budget and deadline controls from effective configuration."
      rationale: "This reuses the existing native OAuth headless path, prevents generator-side tool mutation, validates structured output, and makes the one-request boundary observable and injectable in tests."
      alternatives_considered:
        - "Call an external OpenAI API directly, which would duplicate authentication and provider routing."
        - "Use swarm or another agent surface, which adds orchestration and request-count ambiguity."
        - "Allow generator tools, which would violate the review-only mutation boundary."
    - topic: "Configuration semantics"
      decision: "Resolve each setting through invocation, JCODE_SESSION_FEEDBACK_* environment variables, ~/.jcode/feedback/config.json, and defaults; empty values are unset, while a present invalid or unsupported value fails before generation."
      rationale: "This matches the constitution's precedence contract and prevents a mistyped high-precedence safety limit from silently falling through to a looser value."
      alternatives_considered:
        - "Silently ignore invalid values and fall back, which can hide operator mistakes."
        - "Use normal Jcode config.toml, which would couple a removable skill to production config types."
    - topic: "Local proposal persistence and deduplication"
      decision: "Initialize `~/.jcode/feedback/.beads` idempotently with no remote, label all records `session-feedback`, store the fingerprint in structured metadata, and search only feedback records in open, in-progress, and closed states before mutation."
      rationale: "A dedicated root prevents repository Beads contamination, keeps all proposal artifacts local, and makes relevant closed records precisely those owned by this feedback lane."
      alternatives_considered:
        - "Use the repository .beads store, which violates output isolation and removability."
        - "Use filename-only persistence, which loses the requested approval queue and lifecycle semantics."
        - "Search every closed Bead, which is unnecessary and can produce unrelated matches."
    - topic: "Atomic review-only writes"
      decision: "Validate the complete generator response and compute all dedup actions before writing; use temporary files plus atomic rename and bounded `bd` create/comment/label operations only after bootstrap succeeds."
      rationale: "Invalid output, ambiguous duplicate matches, bootstrap errors, and generation failures must leave no falsely successful or partially persisted proposal result."
      alternatives_considered:
        - "Create Beads while parsing proposals, which can leave partial state."
        - "Repair malformed model output with a second request, which violates the request maximum."
    - topic: "Testing the slash workflow without paid or external effects"
      decision: "Inject the generator executable and isolated HOME/JCODE feedback root in tests, record the exact command and request payload, and use sentinels plus filesystem/process/network spies to prove allowed effects."
      rationale: "This directly tests public behavior, route selection, one-request enforcement, privacy, and persistence deterministically without a live costly request."
      alternatives_considered:
        - "Rely only on helper unit tests, which would not prove the slash contract."
        - "Run live provider requests in routine tests, which is costly and nondeterministic."

data_model:
  entities:
    - name: "FeedbackInvocation"
      description: "One explicit review request for the current or a named session."
      fields:
        - name: "invocation_id"
          type: "string"
          description: "Stable local identifier for accounting and output paths."
          constraints: "Unique beneath the feedback root and safe for filenames."
        - name: "session_id"
          type: "string"
          description: "Current or explicitly requested session identity."
          constraints: "Must be visible and validated before evidence acquisition."
        - name: "effective_config"
          type: "GenerationBudget"
          description: "Resolved non-secret route and bounds."
          constraints: "Every value records its source and passes range validation."
        - name: "outcome"
          type: "zero_proposals | proposals_persisted | failed"
          description: "Terminal review result."
          constraints: "Failure cannot be represented as successful persistence."
      relationships:
        - target: "NormalizedEvidenceBundle"
          type: "one-to-one"
          description: "Each invocation uses one normalized bounded evidence bundle."
        - target: "ImprovementProposal"
          type: "one-to-many"
          description: "An invocation may produce zero or a bounded number of proposals."
    - name: "GenerationBudget"
      description: "Effective route, privacy, resource, and proposal bounds for one invocation."
      fields:
        - name: "model"
          type: "string"
          description: "Generator model identifier."
          constraints: "Defaults to gpt-5.6-sol and must be supported by the selected native route."
        - name: "effort"
          type: "enum"
          description: "Reasoning effort passed to Jcode."
          constraints: "Defaults to medium and must be a supported value."
        - name: "limits"
          type: "object"
          description: "Evidence bytes, excerpt bytes, input tokens, output tokens, proposal count, elapsed time, and estimated cost ceilings."
          constraints: "Positive bounded values; enforced before or during work."
        - name: "sources"
          type: "map<string, invocation|environment|persisted|default>"
          description: "Precedence source for each effective setting."
          constraints: "Contains no secret values."
      relationships:
        - target: "FeedbackInvocation"
          type: "one-to-one"
          description: "One resolved budget governs the complete invocation."
    - name: "NormalizedEvidenceBundle"
      description: "Versioned allowlisted evidence shared by librarian and fallback paths."
      fields:
        - name: "contract_version"
          type: "string"
          description: "Evidence schema version."
          constraints: "Exactly one supported v1 value."
        - name: "source"
          type: "librarian | fallback"
          description: "Acquisition adapter used."
          constraints: "Librarian input must be explicitly cited and compatible."
        - name: "items"
          type: "array<EvidenceItem>"
          description: "Bounded outcomes, todo assessments, invocation receipts, failure excerpts, validation receipts, and relevant paths."
          constraints: "Allowlisted categories only; per-item and aggregate bounds apply."
        - name: "accounting"
          type: "object"
          description: "Measured byte and deterministic token totals by evidence category."
          constraints: "Totals reconcile exactly with serialized request material."
      relationships:
        - target: "TargetShortlistEntry"
          type: "one-to-many"
          description: "Permitted metadata produces an ordered deterministic shortlist."
    - name: "TargetShortlistEntry"
      description: "A concrete candidate chosen before any target file content is read."
      fields:
        - name: "category"
          type: "enum"
          description: "Proposal taxonomy category."
          constraints: "One of global instructions, skills, hooks/config, model/profile, context/skill routing, harness/contracts, SDK/public surfaces, or Jcode."
        - name: "scope"
          type: "personal-global | project-jcode"
          description: "Distinguishes personal and project target identity."
          constraints: "Required and included in fingerprint material."
        - name: "concrete_target"
          type: "string"
          description: "Exact file, skill, configuration key, profile, contract, SDK surface, or Jcode component."
          constraints: "Normalized, bounded, and path-contained when file-backed."
        - name: "selection_evidence"
          type: "array<string>"
          description: "Evidence references and metadata supporting selection."
          constraints: "Must not contain repository file content."
        - name: "excerpt"
          type: "optional bounded string"
          description: "Post-shortlist excerpt from a skill or instruction target."
          constraints: "Only allowed target classes; measured and within excerpt budget."
      relationships:
        - target: "ImprovementProposal"
          type: "one-to-many"
          description: "Validated proposals must refer to a shortlisted concrete target."
    - name: "ImprovementProposal"
      description: "Schema-validated review-only recommendation returned by the generator."
      fields:
        - name: "target"
          type: "object"
          description: "Category, scope, and concrete target."
          constraints: "Must match a shortlist entry and supported taxonomy."
        - name: "evidence_references"
          type: "array<string>"
          description: "Stable references into the evidence bundle."
          constraints: "Non-empty, deduplicated, and resolvable."
        - name: "review_content"
          type: "object"
          description: "Problem, hypothesis, suggested behavior or patch outline, expected benefit, impact, risk/blast radius, validation plan, confidence, and non-goals."
          constraints: "Every required review field is present and bounded."
        - name: "fingerprint"
          type: "sha256 hex string"
          description: "Hash of normalized scope/category/target, problem, and intended outcome."
          constraints: "Recomputed locally; generator-supplied mismatches are rejected."
      relationships:
        - target: "FeedbackProposalBead"
          type: "many-to-one"
          description: "Equivalent fingerprints update one existing record; unique fingerprints create one record."
    - name: "FeedbackProposalBead"
      description: "Local approval record and evidence history for one normalized proposal fingerprint."
      fields:
        - name: "bead_id"
          type: "string"
          description: "Local Beads identity."
          constraints: "Created only beneath ~/.jcode/feedback/.beads."
        - name: "fingerprint"
          type: "sha256 hex string"
          description: "Deduplication key stored in metadata."
          constraints: "Unique for normal operation; multiple matches cause a safe ambiguity failure."
        - name: "lifecycle"
          type: "Beads status plus labels"
          description: "Review queue state."
          constraints: "New records are labeled needs-approval; the workflow never approves, claims, or starts them."
        - name: "evidence_history"
          type: "array<EvidenceOccurrence>"
          description: "Nonduplicate references from repeated reviews."
          constraints: "Append-only through bounded comments or metadata; exact duplicates are not re-added."
      relationships:
        - target: "ImprovementProposal"
          type: "one-to-many"
          description: "One persisted record accumulates equivalent review occurrences."

