# ============ REQUIRED SECTIONS ============

feature:
  branch: "021-resilient-websearch-fallbacks"
  created: "2026-08-31"
  status: "Draft"
  input: 'Implement Bead jcode-ow6: a simple modular free-only resilient websearch architecture. Preserve existing DuckDuckGo, Bing, and SearXNG compatibility while adding configurable orchestration with a master enable switch, per-engine enable controls, fallback order, bounded per-attempt timeout, narrowly eligible transient retries, short-lived engine circuit/health suppression, and aggregate non-secret diagnostics. Add only reasonable free fallbacks that do not require paid APIs, browser automation, CAPTCHA bypass, or an untrusted public default. Reuse existing shared HTTP and ToolOutput/event contracts. Add minimal TUI visibility showing selected engine and fallback/attempt summary without redesigning the TUI or making successful output noisy. Keep legacy config valid and defaults simple. Include deterministic tests for config precedence, ordering, disabled engines, empty/challenge/transient outcomes, retry/circuit behavior, diagnostics, and TUI rendering. Include reasonable orchestration-overhead benchmark evidence, built-binary isolated-socket validation, documentation, and an explicit post-integration user-config enablement step. Follow .autospec/constitution.yaml and the frozen acceptance matrix in Bead jcode-ow6.'

