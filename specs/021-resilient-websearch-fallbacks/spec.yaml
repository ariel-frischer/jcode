glossary:
  - term: "preferred engine"
    definition: "The existing configured engine used when no request engine is supplied."
  - term: "selected engine"
    definition: "The explicit request engine when supplied, or the preferred engine otherwise; in a completed success summary, selected_engine is the engine whose usable result is returned."
  - term: "considered engine"
    definition: "An engine in the merged, deduplicated resilient order, including engines that are later skipped."
  - term: "skipped engine"
    definition: "A considered engine that receives no physical adapter invocation because it is disabled, unavailable, or health-suppressed."
  - term: "physical attempt"
    definition: "One adapter/network invocation for one engine, including an initial invocation or an additional retry."
  - term: "retry"
    definition: "An additional physical attempt for the same engine after an eligible transient outcome."
  - term: "per-engine outcome"
    definition: "The terminal normalized classification for one considered engine; it excludes aggregate exhausted."
  - term: "search terminal"
    definition: "The aggregate outcome for the whole search, including success, actionable no-eligible/configuration failure, or exhausted after all permitted engines are unusable."
  - term: "exhausted"
    definition: "An aggregate search-terminal classification only; it is never a per-engine classification."

diagnostics_contract:
  schema:
    fields: ["schema_version", "effective_policy", "considered", "physical_attempt_count", "retry_count", "skip_count", "elapsed_ms", "selected_engine", "per_engine_outcomes", "search_terminal"]
    bounds: "At most one considered entry per supported engine, at most E*(1+R) physical attempts with E <= 3, and bounded elapsed_ms; only canonical names, booleans, bounded counts, classifications, and redacted reasons are allowed."
    prohibited: ["query", "credentials", "secret values", "response bodies", "SearXNG URL", "other endpoint URLs"]
  trigger_matrix:
    - condition: "diagnostics_enabled and clean first-attempt success"
      metadata: "Present, including selected_engine and one success outcome."
      text: "Absent beyond ordinary result text; no extra diagnostic line."
    - condition: "diagnostics_enabled and fallback, retry, or suppression occurred"
      metadata: "Present with considered/skipped/attempt/retry counts and per-engine outcomes."
      text: "One bounded summary line."
    - condition: "diagnostics_enabled and aggregate search-terminal failure"
      metadata: "Present with actionable aggregate search-terminal outcome and concise reason for each considered engine."
      text: "One bounded actionable summary line."
    - condition: "diagnostics disabled"
      metadata: "Absent."
      text: "Absent beyond normal result and actionable aggregate outcome."

out_of_scope:
  - "Browser-driven search, CAPTCHA solving, anti-bot bypass, or impersonation intended to defeat access controls."
  - "A paid search service or required API-key dependency for resilient fallback behavior."
  - "Shipping a default public SearXNG instance or automatically selecting an untrusted third-party instance."
  - "A second websearch tool, a broad provider framework, or speculative engines without a reasonable trusted free access path."
  - "A TUI redesign, persistent diagnostics dashboard, or verbose successful-search transcript output."
  - "Breaking changes to existing engine names, legacy websearch configuration, tool inputs, result contracts, or events."
  - "Changing the user's active configuration before the integrated build supports and validates the new settings."

