checklist:
  feature: "Resilient Websearch Fallbacks"
  branch: "021-resilient-websearch-fallbacks"
  spec_path: "specs/021-resilient-websearch-fallbacks/spec.yaml"
  domain: "api"
  audience: "reviewer"
  depth: "comprehensive"

categories:
  - name: "Requirement Completeness"
    description: "Are all necessary websearch policy, compatibility, delivery, and trust requirements documented?"
    items:
      - id: "CHK001"
        description: "Are the resilient master switch, its disabled default, absent-value semantics, and explicit opt-in boundary defined?"
        quality_dimension: "completeness"
        spec_reference: "FR-001"
        status: "pass"
        notes: ""
      - id: "CHK002"
        description: "Are the canonical DuckDuckGo, Bing, and SearXNG names, aliases, legacy fields, and existing tool-input fields enumerated?"
        quality_dimension: "completeness"
        spec_reference: "FR-002"
        status: "pass"
        notes: ""
      - id: "CHK003"
        description: "Are independent controls defined for each engine, fallback use, transient retries, health suppression, and diagnostics?"
        quality_dimension: "completeness"
        spec_reference: "FR-003"
        status: "pass"
        notes: ""
      - id: "CHK004"
        description: "Are all configuration sources and their precedence scopes defined for every supported operational setting, including the distinct fallback_order source chain?"
        quality_dimension: "completeness"
        spec_reference: "FR-004"
        status: "pass"
        notes: "Pass: request/session > environment > persisted > built-in default applies per field; fallback_order uses request resilience.fallback_order > JCODE_WEBSEARCH_FALLBACK_ENGINES > existing persisted websearch.fallback_engines > [bing]."
      - id: "CHK005"
        description: "Are the supported free engines, their explicit boolean eligibility defaults/unknown-key behavior, and the trust requirement for SearXNG explicitly bounded?"
        quality_dimension: "completeness"
        spec_reference: "FR-018"
        status: "pass"
        notes: ""
      - id: "CHK006"
        description: "Are success, empty, challenge, timeout, transient, permanent, disabled, unavailable, health-suppressed, and exhausted classifications all documented with their decision meaning?"
        quality_dimension: "completeness"
        spec_reference: "FR-013"
        status: "pass"
        notes: ""
      - id: "CHK007"
        description: "Are timeout, retry count, retry delay, health threshold, health cooldown, E <= 3, and the total-work formula stated together?"
        quality_dimension: "completeness"
        spec_reference: "FR-008"
        status: "pass"
        notes: ""
      - id: "CHK008"
        description: "Are aggregate diagnostic fields, boundedness expectations, selected-engine information, and prohibited sensitive fields specified?"
        quality_dimension: "completeness"
        spec_reference: "FR-014"
        status: "pass"
        notes: ""
      - id: "CHK009"
        description: "Does the requirement set preserve concise per-engine terminal reasons for every considered engine while reserving exhausted for aggregate search scope?"
        quality_dimension: "completeness"
        spec_reference: "FR-015"
        status: "pass"
        notes: ""
      - id: "CHK010"
        description: "Are compatibility obligations for the public websearch identity, result text, ToolOutput fields, events, and consumers that ignore diagnostics stated?"
        quality_dimension: "completeness"
        spec_reference: "FR-019"
        status: "pass"
        notes: ""
      - id: "CHK011"
        description: "Are documentation obligations defined for controls, defaults, precedence, bounds, outcome classes, health behavior, privacy, trusted SearXNG setup, and both operating modes?"
        quality_dimension: "completeness"
        spec_reference: "FR-020"
        status: "pass"
        notes: ""
      - id: "CHK012"
        description: "Are deterministic evidence obligations defined for configuration, ordering, outcomes, retries, health, diagnostics, privacy, and TUI status requirements?"
        quality_dimension: "completeness"
        spec_reference: "FR-021"
        status: "pass"
        notes: ""
      - id: "CHK013"
        description: "Are built-product evidence, isolated endpoint conditions, benchmark evidence, integration sequencing, and post-integration configuration enablement treated as separate delivery requirements?"
        quality_dimension: "completeness"
        spec_reference: "FR-022"
        status: "pass"
        notes: ""
      - id: "CHK014"
        description: "Does the specification reproduce or link the eleven frozen Bead acceptance checks so reviewers can trace each one to an explicit requirement and evidence record?"
        quality_dimension: "completeness"
        spec_reference: "frozen_acceptance_checks"
        status: "pass"
        notes: "Resolved: OW6-001..OW6-011 are enumerated in spec.yaml and mapped to tasks and validation.md#OW6-* evidence anchors in spec.yaml, plan.yaml, and tasks.yaml."
      - id: "CHK068"
        description: "Does the specification identify PRIN-001 through PRIN-010, map each principle to requirement references, and provide an executable compliance check?"
        quality_dimension: "completeness"
        spec_reference: "constitution_check"
        status: "pass"
        notes: "Resolved: spec.yaml constitution_check.principles contains PRIN-001..PRIN-010 with requirement_refs and executable_checks, mirrored by plan and delivery tasks."
      - id: "CHK069"
        description: "Does the specification define a diagnostics trigger matrix requiring metadata on diagnostics-enabled first success while forbidding extra diagnostic text, and distinguish meaningful activity, aggregate failure, and diagnostics-disabled output?"
        quality_dimension: "completeness"
        spec_reference: "diagnostics_contract"
        status: "pass"
        notes: "Resolved: the schema and trigger matrix define metadata/text behavior for clean success, meaningful activity, aggregate failure, and disabled diagnostics."

  - name: "Requirement Clarity"
    description: "Are websearch policy terms, boundaries, and outcomes specific enough to avoid interpretation differences?"
    items:
      - id: "CHK015"
        description: "Is a usable result set defined with objective parsing and content criteria rather than left as an implementation-dependent phrase?"
        quality_dimension: "clarity"
        spec_reference: "FR-007"
        status: "pass"
        notes: "Resolved: usable means at least one result with a non-empty title and valid http/https URL; snippet is optional and partial results are unusable."
      - id: "CHK016"
        description: "Are the exact eligible transient classes limited to transport failure, timeout, rate limit, and server-unavailable outcomes?"
        quality_dimension: "clarity"
        spec_reference: "FR-009"
        status: "pass"
        notes: ""
      - id: "CHK017"
        description: "Are the retry allowance, fixed delay, finite engine sequence, and total-work bound described with a formula or equally precise limit?"
        quality_dimension: "clarity"
        spec_reference: "FR-010"
        status: "pass"
        notes: ""
      - id: "CHK018"
        description: "Are disabled, unavailable, and health-suppressed outcomes distinguished by mutually exclusive definitions and user-visible implications?"
        quality_dimension: "clarity"
        spec_reference: "FR-005"
        status: "pass"
        notes: ""
      - id: "CHK019"
        description: "Are duplicate-removal rules explicit about first occurrence, preferred-engine precedence, and the point at which eligibility filtering is applied?"
        quality_dimension: "clarity"
        spec_reference: "FR-005"
        status: "pass"
        notes: ""
      - id: "CHK020"
        description: "Are unset, empty, malformed, out-of-range, and unsupported configuration candidates assigned an unambiguous lower-precedence or visible-error outcome?"
        quality_dimension: "clarity"
        spec_reference: "FR-004"
        status: "pass"
        notes: "Pass: request errors fail before network, persisted-policy failures produce an actionable configuration outcome before network, and invalid or empty environment candidates warn without values and fall through."
      - id: "CHK021"
        description: "Is a trusted SearXNG instance defined by explicit validity and trust conditions without implying that any public endpoint is acceptable?"
        quality_dimension: "clarity"
        spec_reference: "FR-018"
        status: "pass"
        notes: ""
      - id: "CHK022"
        description: "Are consecutive eligible failures, threshold crossing, cooldown start, cooldown expiry, probing, and successful recovery defined precisely?"
        quality_dimension: "clarity"
        spec_reference: "FR-011"
        status: "pass"
        notes: ""
      - id: "CHK023"
        description: "Is the meaning of actionable aggregate failure defined in terms of retained reasons, user guidance, and bounded detail?"
        quality_dimension: "clarity"
        spec_reference: "FR-015"
        status: "pass"
        notes: ""
      - id: "CHK024"
        description: "Is compact TUI status quantified by explicit line, content, or size criteria for ordinary success and meaningful fallback activity?"
        quality_dimension: "clarity"
        spec_reference: "FR-017"
        status: "pass"
        notes: "Resolved: one line, maximum 96 display characters, deterministic ellipsis."
      - id: "CHK025"
        description: "Are the words selected engine, considered engine, attempted engine, skipped engine, retry, and terminal outcome used consistently and defined?"
        quality_dimension: "clarity"
        spec_reference: "glossary"
        status: "pass"
        notes: "Resolved: preferred, selected, considered, skipped, physical attempt, retry, per-engine outcome, search terminal, and exhausted are defined with exhausted aggregate-only."

  - name: "Requirement Consistency"
    description: "Do policy, compatibility, privacy, presentation, and delivery requirements align without conflicts?"
    items:
      - id: "CHK026"
        description: "Are the master-disabled requirements consistent with the promise that legacy execution, fields, aliases, results, and events remain unchanged?"
        quality_dimension: "consistency"
        spec_reference: "FR-001"
        status: "pass"
        notes: ""
      - id: "CHK027"
        description: "Are explicit engine selection rules consistent between legacy mode, resilient mode, disabled engines, unavailable engines, and fallback-enabled mode?"
        quality_dimension: "consistency"
        spec_reference: "FR-006"
        status: "pass"
        notes: ""
      - id: "CHK028"
        description: "Are fallback-disabled behavior and configured fallback ordering described consistently when the preferred engine is unusable?"
        quality_dimension: "consistency"
        spec_reference: "FR-005"
        status: "pass"
        notes: "Pass: fallback_enabled=false leaves only the preferred/request-selected engine in the considered sequence and terminates its unusable or skipped outcome actionably."
      - id: "CHK029"
        description: "Are retries-enabled, maximum-retries, eligible outcome, timeout, fixed-delay, one-health-increment-per-sequence, and whole-search bound requirements mutually consistent?"
        quality_dimension: "consistency"
        spec_reference: "FR-009"
        status: "pass"
        notes: ""
      - id: "CHK030"
        description: "Are health suppression requirements consistent with the rule that only eligible transient terminal failures affect health and that success recovers state?"
        quality_dimension: "consistency"
        spec_reference: "FR-011"
        status: "pass"
        notes: ""
      - id: "CHK031"
        description: "Are contract-level diagnostics and presentation-level text/TUI noise requirements consistent and separately testable across enabled and disabled diagnostics?"
        quality_dimension: "consistency"
        spec_reference: "FR-016"
        status: "pass"
        notes: "Pass: contract metadata privacy is asserted under NFR-003 separately from presentation text/title/TUI privacy and noise under NFR-004."
      - id: "CHK032"
        description: "Are free-only requirements consistent with resilient keyless Bing HTML, legacy credentialed Bing API compatibility, and configuration-only credentials?"
        quality_dimension: "consistency"
        spec_reference: "FR-018"
        status: "pass"
        notes: ""
      - id: "CHK033"
        description: "Are ToolOutput metadata, title, text, event compatibility, and targeted TUI visibility described as additive uses of one existing contract, with handled timeout exhaustion remaining ToolOutput?"
        quality_dimension: "consistency"
        spec_reference: "FR-019"
        status: "pass"
        notes: "Pass: handled per-engine timeouts and aggregate timeout exhaustion remain ToolOutput outcomes; only infrastructure/runtime failures escape as errors."
      - id: "CHK034"
        description: "Are the requirement scope and non-goals consistent with adding only existing free engines and avoiding a broad provider framework or unrelated interface redesign?"
        quality_dimension: "consistency"
        spec_reference: "NFR-005"
        status: "pass"
        notes: ""

  - name: "Acceptance Criteria Quality"
    description: "Can a reviewer determine objectively whether the specified outcome has been met?"
    items:
      - id: "CHK035"
        description: "Can the master-switch acceptance criteria distinguish absent, explicitly disabled, and explicitly enabled policy states without relying on subjective interpretation?"
        quality_dimension: "measurability"
        spec_reference: "FR-001"
        status: "pass"
        notes: ""
      - id: "CHK036"
        description: "Can the precedence criteria identify the winning value for each source combination, including invalid and unsupported candidates?"
        quality_dimension: "measurability"
        spec_reference: "FR-004"
        status: "pass"
        notes: ""
      - id: "CHK037"
        description: "Can ordering criteria compare recorded eligible engines against a deterministic first-occurrence sequence and prove no later consideration after success?"
        quality_dimension: "measurability"
        spec_reference: "FR-005"
        status: "pass"
        notes: ""
      - id: "CHK038"
        description: "Can timeout criteria define the allowed timing tolerance and the observable result for an invalid timeout value?"
        quality_dimension: "measurability"
        spec_reference: "FR-008"
        status: "pass"
        notes: ""
      - id: "CHK039"
        description: "Can retry criteria count physical attempts separately from engines considered and distinguish every retryable class from every non-retryable class?"
        quality_dimension: "measurability"
        spec_reference: "FR-009"
        status: "pass"
        notes: ""
      - id: "CHK040"
        description: "Can health criteria identify the exact threshold, cooldown interval, expiry observation, recovery transition, and engine isolation expected in each scenario?"
        quality_dimension: "measurability"
        spec_reference: "FR-011"
        status: "pass"
        notes: ""
      - id: "CHK041"
        description: "Can diagnostic criteria enumerate required fields and provide objective negative assertions for every prohibited sensitive value?"
        quality_dimension: "measurability"
        spec_reference: "NFR-003"
        status: "pass"
        notes: "Pass: the structured metadata schema has explicit fields, bounds, and negative assertions for every prohibited value. Presentation checks are separate."
      - id: "CHK042"
        description: "Can TUI criteria distinguish first-attempt success from fallback, retry, suppression, and aggregate failure while bounding extra status detail?"
        quality_dimension: "measurability"
        spec_reference: "FR-017"
        status: "pass"
        notes: "Pass: presentation tests distinguish clean first success from fallback/retry/suppression/failure and enforce one deterministic line no wider than 96 display characters."
      - id: "CHK043"
        description: "Can benchmark criteria require warm-up, sample count, median, p95, the sub-millisecond target, the two-percent target, and an attributable comparison baseline?"
        quality_dimension: "measurability"
        spec_reference: "NFR-001"
        status: "pass"
        notes: ""
      - id: "CHK044"
        description: "Can built-product and post-integration criteria identify the candidate identity, isolated endpoint, active build prerequisite, configuration boundary, and rollback state?"
        quality_dimension: "measurability"
        spec_reference: "FR-023"
        status: "pass"
        notes: ""
      - id: "CHK045"
        description: "Does the specification map each of the eleven frozen Bead acceptance checks to one observable evidence artifact or state why a direct check is impossible?"
        quality_dimension: "measurability"
        spec_reference: "frozen_acceptance_checks"
        status: "pass"
        notes: "Resolved: the eleven frozen checks have stable IDs, task mappings, and validation evidence anchors."

  - name: "Scenario Coverage"
    description: "Are primary, compatibility, control, presentation, and delivery scenarios represented?"
    items:
      - id: "CHK046"
        description: "Are requirements defined for legacy configurations with the resilience section absent, explicitly disabled, and containing legacy engine aliases?"
        quality_dimension: "coverage"
        spec_reference: "NFR-006"
        status: "pass"
        notes: ""
      - id: "CHK047"
        description: "Are requirements defined for first-engine success with no fallback or retry and for showing only the selected engine?"
        quality_dimension: "coverage"
        spec_reference: "US-003"
        status: "pass"
        notes: ""
      - id: "CHK048"
        description: "Are challenged, empty, transient, timeout, and permanent outcomes covered both before a usable fallback result and at aggregate exhaustion?"
        quality_dimension: "coverage"
        spec_reference: "US-001"
        status: "pass"
        notes: ""
      - id: "CHK049"
        description: "Are disabled, unavailable, and suppressed preferred engines covered with fallback enabled and disabled?"
        quality_dimension: "coverage"
        spec_reference: "US-002"
        status: "pass"
        notes: ""
      - id: "CHK050"
        description: "Are explicit engine selections covered when the selected engine is eligible, disabled, unavailable, duplicated, or absent from the effective order?"
        quality_dimension: "coverage"
        spec_reference: "FR-006"
        status: "pass"
        notes: "Resolved: explicit selection is prepended and deduplicated; ineligible selection is skipped and fallback depends on fallback_enabled."
      - id: "CHK051"
        description: "Are independent control scenarios covered for fallback, retries, health suppression, diagnostics, per-engine flags, timeout, threshold, and cooldown?"
        quality_dimension: "coverage"
        spec_reference: "FR-003"
        status: "pass"
        notes: ""
      - id: "CHK052"
        description: "Are precedence scenarios covered for each source alone, all conflicting combinations, and per-field rather than all-or-nothing resolution?"
        quality_dimension: "coverage"
        spec_reference: "FR-004"
        status: "pass"
        notes: ""
      - id: "CHK053"
        description: "Are diagnostics-enabled and diagnostics-disabled scenarios covered for successful fallback, retry, suppression, and aggregate failure?"
        quality_dimension: "coverage"
        spec_reference: "FR-016"
        status: "pass"
        notes: ""
      - id: "CHK054"
        description: "Are TUI scenarios covered for first success, fallback success, retry success, suppression, aggregate failure, and diagnostics-disabled output?"
        quality_dimension: "coverage"
        spec_reference: "FR-017"
        status: "pass"
        notes: ""
      - id: "CHK055"
        description: "Are delivery scenarios covered for the benchmark, isolated built-binary path, guardrails, integration, active-build verification, and the final reversible user enablement step?"
        quality_dimension: "coverage"
        spec_reference: "US-004"
        status: "pass"
        notes: ""

  - name: "Edge Case Coverage"
    description: "Are boundary, malformed-input, trust-boundary, privacy, and sequencing conditions explicitly specified?"
    items:
      - id: "CHK056"
        description: "Does the spec define the outcome when the configured order is empty or contains only disabled, unavailable, or suppressed engines?"
        quality_dimension: "edge_cases"
        spec_reference: "edge_cases"
        status: "pass"
        notes: "Resolved: fallback-disabled considers only the preferred/request-selected engine; no-eligible/configuration and aggregate exhausted remain actionable but distinct, and exhausted is aggregate-only."
      - id: "CHK057"
        description: "Does the spec define duplicate handling when the preferred engine appears in fallback order and when all fallback entries are duplicates?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-005"
        status: "pass"
        notes: ""
      - id: "CHK058"
        description: "Are empty, malformed, out-of-range, and unsupported values covered independently at every supported configuration source?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-004"
        status: "pass"
        notes: ""
      - id: "CHK059"
        description: "Are lower-bound, upper-bound, zero, and over-boundary cases defined for timeout, retry count, failure threshold, and cooldown?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-008"
        status: "pass"
        notes: ""
      - id: "CHK060"
        description: "Are retry-delay and total-work boundaries specified when all engines time out, all transient outcomes retry, or retry allowance is zero?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-010"
        status: "pass"
        notes: ""
      - id: "CHK061"
        description: "Are alternating transient and successful outcomes around the health threshold defined so only eligible failures affect state and success recovery is unambiguous?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-012"
        status: "pass"
        notes: ""
      - id: "CHK062"
        description: "Does the spec define a single consistent time observation when cooldown expiry overlaps engine selection?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-011"
        status: "pass"
        notes: "Resolved: one captured time is used; expiry is now >= suppressed_until and suppression state clears before a normal attempt."
      - id: "CHK063"
        description: "Are missing, empty, invalid, or untrusted SearXNG endpoints covered without selecting a public default?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-018"
        status: "pass"
        notes: ""
      - id: "CHK064"
        description: "Are challenge pages, empty parsed results, malformed successful responses, authentication failures, and unsupported responses distinguished from retryable transport outcomes?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-009"
        status: "pass"
        notes: ""
      - id: "CHK065"
        description: "Are diagnostics and TUI summaries explicitly protected against fixture queries, credentials, secret environment values, response bodies, and private endpoint URLs in every outcome?"
        quality_dimension: "edge_cases"
        spec_reference: "NFR-003, NFR-004"
        status: "pass"
        notes: "Pass: structured contract metadata and presentation text/title/TUI lines have separate negative privacy assertions; the presentation path also enforces the noise and width bound."
      - id: "CHK066"
        description: "Does the scope explicitly exclude paid services, browser automation, CAPTCHA bypass, speculative engines, untrusted public endpoints, and unrelated interface expansion?"
        quality_dimension: "edge_cases"
        spec_reference: "NFR-005"
        status: "pass"
        notes: ""
      - id: "CHK067"
        description: "Does the delivery sequence define what happens if the supporting build is not yet integrated or active, including preservation of personal configuration and a master-disabled rollback?"
        quality_dimension: "edge_cases"
        spec_reference: "FR-023"
        status: "pass"
        notes: ""

