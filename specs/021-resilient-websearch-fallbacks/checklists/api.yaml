categories:
  - name: "Requirement Completeness"
    description: "Are all necessary websearch policy, compatibility, delivery, and trust requirements documented?"
    items:
      - id: "CHK001"
        description: "Are the resilient master switch, its disabled default, absent-value semantics, and explicit opt-in boundary defined?"
        quality_dimension: "completeness"
        spec_reference: "FR-001"
        status: "pending"
        notes: ""
      - id: "CHK002"
        description: "Are the canonical DuckDuckGo, Bing, and SearXNG names, aliases, legacy fields, and existing tool-input fields enumerated?"
        quality_dimension: "completeness"
        spec_reference: "FR-002"
        status: "pending"
        notes: ""
      - id: "CHK003"
        description: "Are independent controls defined for each engine, fallback use, transient retries, health suppression, and diagnostics?"
        quality_dimension: "completeness"
        spec_reference: "FR-003"
        status: "pending"
        notes: ""
      - id: "CHK004"
        description: "Are all configuration sources and their precedence scopes defined for every supported operational setting?"
        quality_dimension: "completeness"
        spec_reference: "FR-004"
        status: "pending"
        notes: ""
      - id: "CHK005"
        description: "Are the supported free engines, their eligibility conditions, and the trust requirement for SearXNG explicitly bounded?"
        quality_dimension: "completeness"
        spec_reference: "FR-018"
        status: "pending"
        notes: ""
      - id: "CHK006"
        description: "Are success, empty, challenge, timeout, transient, permanent, disabled, unavailable, health-suppressed, and exhausted classifications all documented with their decision meaning?"
        quality_dimension: "completeness"
        spec_reference: "FR-013"
        status: "pending"
        notes: ""
      - id: "CHK007"
        description: "Are timeout, retry count, retry delay, health threshold, and health cooldown defaults and valid bounds stated together?"
        quality_dimension: "completeness"
        spec_reference: "FR-008"
        status: "pending"
        notes: ""
      - id: "CHK008"
        description: "Are aggregate diagnostic fields, boundedness expectations, selected-engine information, and prohibited sensitive fields specified?"
        quality_dimension: "completeness"
        spec_reference: "FR-014"
        status: "pending"
        notes: ""
      - id: "CHK009"
        description: "Does the requirement set preserve concise terminal reasons for every considered engine when no usable result is available?"
        quality_dimension: "completeness"
        spec_reference: "FR-015"
        status: "pending"
        notes: ""
      - id: "CHK010"
        description: "Are compatibility obligations for the public websearch identity, result text, ToolOutput fields, events, and consumers that ignore diagnostics stated?"
        quality_dimension: "completeness"
        spec_reference: "FR-019"
        status: "pending"
        notes: ""
      - id: "CHK011"
        description: "Are documentation obligations defined for controls, defaults, precedence, bounds, outcome classes, health behavior, privacy, trusted SearXNG setup, and both operating modes?"
        quality_dimension: "completeness"
        spec_reference: "FR-020"
        status: "pending"
        notes: ""
      - id: "CHK012"
        description: "Are deterministic evidence obligations defined for configuration, ordering, outcomes, retries, health, diagnostics, privacy, and TUI status requirements?"
        quality_dimension: "completeness"
        spec_reference: "FR-021"
        status: "pending"
        notes: ""
      - id: "CHK013"
        description: "Are built-product evidence, isolated endpoint conditions, benchmark evidence, integration sequencing, and post-integration configuration enablement treated as separate delivery requirements?"
        quality_dimension: "completeness"
        spec_reference: "FR-022"
        status: "pending"
        notes: ""
      - id: "CHK014"
        description: "Does the specification reproduce or link the eleven frozen Bead acceptance checks so reviewers can trace each one to an explicit requirement and evidence record?"
        quality_dimension: "completeness"
        spec_reference: null
        status: "pending"
        notes: "Gap marker: the spec refers to eleven frozen checks but does not include their individual identifiers or text."

  - name: "Requirement Clarity"
    description: "Are websearch policy terms, boundaries, and outcomes specific enough to avoid interpretation differences?"
    items:
      - id: "CHK015"
        description: "Is a usable result set defined with objective parsing and content criteria rather than left as an implementation-dependent phrase?"
        quality_dimension: "clarity"
        spec_reference: null
        status: "pending"
        notes: "Gap marker: the requirement says usable result set but does not state the minimum result or parser criteria."
      - id: "CHK016"
        description: "Are the exact eligible transient classes limited to transport failure, timeout, rate limit, and server-unavailable outcomes?"
        quality_dimension: "clarity"
        spec_reference: "FR-009"
        status: "pending"
        notes: ""
      - id: "CHK017"
        description: "Are the retry allowance, fixed delay, finite engine sequence, and total-work bound described with a formula or equally precise limit?"
        quality_dimension: "clarity"
        spec_reference: "FR-010"
        status: "pending"
        notes: ""
      - id: "CHK018"
        description: "Are disabled, unavailable, and health-suppressed outcomes distinguished by mutually exclusive definitions and user-visible implications?"
        quality_dimension: "clarity"
        spec_reference: "FR-005"
        status: "pending"
        notes: ""
      - id: "CHK019"
        description: "Are duplicate-removal rules explicit about first occurrence, preferred-engine precedence, and the point at which eligibility filtering is applied?"
        quality_dimension: "clarity"
        spec_reference: "FR-005"
        status: "pending"
        notes: ""
      - id: "CHK020"
        description: "Are unset, empty, malformed, out-of-range, and unsupported configuration candidates assigned an unambiguous lower-precedence or visible-error outcome?"
        quality_dimension: "clarity"
        spec_reference: "FR-004"
        status: "pending"
        notes: ""
      - id: "CHK021"
        description: "Is a trusted SearXNG instance defined by explicit validity and trust conditions without implying that any public endpoint is acceptable?"
        quality_dimension: "clarity"
        spec_reference: "FR-018"
        status: "pending"
        notes: ""
      - id: "CHK022"
        description: "Are consecutive eligible failures, threshold crossing, cooldown start, cooldown expiry, probing, and successful recovery defined precisely?"
        quality_dimension: "clarity"
        spec_reference: "FR-011"
        status: "pending"
        notes: ""
      - id: "CHK023"
        description: "Is the meaning of actionable aggregate failure defined in terms of retained reasons, user guidance, and bounded detail?"
        quality_dimension: "clarity"
        spec_reference: "FR-015"
        status: "pending"
        notes: ""
      - id: "CHK024"
        description: "Is compact TUI status quantified by explicit line, content, or size criteria for ordinary success and meaningful fallback activity?"
        quality_dimension: "clarity"
        spec_reference: "NFR-004"
        status: "pending"
        notes: "Gap marker: compact and one-line behavior are described, but no concrete size or truncation criterion is stated."
      - id: "CHK025"
        description: "Are the words selected engine, considered engine, attempted engine, skipped engine, retry, and terminal outcome used consistently and defined?"
        quality_dimension: "clarity"
        spec_reference: null
        status: "pending"
        notes: "Gap marker: the terms appear across the spec and plan but lack one shared glossary or state definition."

  - name: "Requirement Consistency"
    description: "Do policy, compatibility, privacy, presentation, and delivery requirements align without conflicts?"
    items:
      - id: "CHK026"
