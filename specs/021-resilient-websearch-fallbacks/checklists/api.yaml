        spec_reference: "FR-001"
        status: "pending"
        notes: ""
      - id: "CHK036"
        description: "Can the precedence criteria identify the winning value for each source combination, including invalid and unsupported candidates?"
        quality_dimension: "measurability"
        spec_reference: "FR-004"
        status: "pending"
        notes: ""
      - id: "CHK037"
        description: "Can ordering criteria compare recorded eligible engines against a deterministic first-occurrence sequence and prove no later consideration after success?"
        quality_dimension: "measurability"
        spec_reference: "FR-005"
        status: "pending"
        notes: ""
      - id: "CHK038"
        description: "Can timeout criteria define the allowed timing tolerance and the observable result for an invalid timeout value?"
        quality_dimension: "measurability"
        spec_reference: "FR-008"
        status: "pending"
        notes: ""
      - id: "CHK039"
        description: "Can retry criteria count physical attempts separately from engines considered and distinguish every retryable class from every non-retryable class?"
