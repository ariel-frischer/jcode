    - path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
      description: "Scripted deterministic order, disablement, deduplication, empty/challenge/transient/permanent outcomes, stop-on-success, retry limits, timeouts, health suppression/recovery/isolation, diagnostics, privacy, repeated-run determinism, and benchmark-style tests."
    - path: "crates/jcode-app-core/src/tool/websearch.rs"
      description: "Existing parser/alias regression tests plus local HTTP fixture classification and ToolOutput integration tests."
    - path: "crates/jcode-tui/src/tui/ui_messages.rs"
