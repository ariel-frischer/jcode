diagnostics_contract:
  schema:
    fields: ["schema_version", "effective_policy", "considered", "physical_attempt_count", "retry_count", "skip_count", "elapsed_ms", "selected_engine", "per_engine_outcomes", "search_terminal"]
    bounds: "At most one considered entry per supported engine, E <= 3, physical attempts <= E*(1+R), and elapsed upper bound E*(1+R)*timeout + E*R*retry_delay plus scheduler tolerance."
    prohibited: ["query", "credentials", "secret values", "response bodies", "SearXNG URL", "other endpoint URLs"]
    presentation: "ToolOutput text, title, and TUI rendering are a separate presentation contract: at most one deterministic one-line summary, no wider than 96 display characters, with the same prohibited-value negative assertions but no requirement to serialize the metadata schema."
  trigger_matrix:
    - condition: "diagnostics_enabled and clean first-attempt success"
      metadata: "Present with selected_engine and success outcome."
      text: "No extra diagnostic text."
    - condition: "diagnostics_enabled and fallback/retry/suppression"
      metadata: "Present with ordered considered entries, counts, and per-engine outcomes."
      text: "Exactly one bounded summary line."
    - condition: "diagnostics_enabled and aggregate failure"
      metadata: "Present with concise reason for every considered engine and aggregate search-terminal outcome."
      text: "Exactly one bounded actionable line."
    - condition: "diagnostics disabled"
      metadata: "Absent."
      text: "Absent beyond normal result or actionable aggregate outcome."

implementation_phases:
  - phase: 1
    name: "Setup"
    goal: "Freeze compatibility facts, the eleven frozen Bead checks, the accepted target boundary, and deterministic evidence commands before runtime changes."
    deliverables:
      - "Legacy configuration/request/output/event inventory and baseline evidence."
      - "OW6-001..OW6-011 matrix mapped to requirements, tasks, and validation.md evidence anchors."
      - "Explicit statement that master-disabled behavior remains legacy and personal configuration is untouched before T027."
  - phase: 2
    name: "Foundational"
    goal: "Define additive policy contracts, exact source precedence, validation behavior, and pure typed orchestration primitives."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Explicit DuckDuckGo/Bing/SearXNG boolean eligibility fields with missing=true and unknown-key rejection."
      - "fallback_order source chain: request resilience.fallback_order > JCODE_WEBSEARCH_FALLBACK_ENGINES > existing persisted websearch.fallback_engines > default [bing]."
      - "Invalid request/persisted/environment candidate behavior, with pre-network failures or handled outcomes and value-free warnings as specified."
      - "Stable preferred/request-selected prepend and first-occurrence deduplication, typed per-engine outcomes, aggregate-only exhausted, and explicit-time health state."
  - phase: 3
    name: "User Story 1 - Receive reliable free web search results"
    goal: "Use the existing free adapters through a bounded resilient state machine that recognizes objective usable results and preserves the exact legacy branch."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Usable result predicate: at least one result with non-empty title and valid http/https URL; snippet optional."
      - "Fallback-disabled terminal behavior, narrow transient retries, exact E*(1+R) and elapsed bounds, and actionable aggregate outcomes."
      - "SearXNG trust validation and resilient keyless Bing HTML versus legacy credentialed Bing API behavior."
  - phase: 4
    name: "User Story 2 - Control resilient search behavior"
    goal: "Expose independently validated operator controls and request policy overrides without expanding the credential or endpoint trust boundary."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Canonical request fields and non-secret request override wiring."
      - "Pre-network validation for request/persisted policy errors and warning-only value-free environment fallthrough."
      - "Independent eligibility, fallback, retry, health, timeout, and diagnostics controls with no global-state mutation."
  - phase: 5
    name: "User Story 3 - Understand fallback activity without noise"
    goal: "Attach the stable bounded diagnostic contract and one-line TUI visibility while separating metadata contract requirements from presentation noise requirements."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Diagnostics schema/trigger matrix, including metadata on diagnostics-enabled first success and no extra text."
      - "Contract-level privacy assertions and presentation-level privacy/noise assertions kept distinct."
      - "One-line TUI title capped at 96 display characters with deterministic ellipsis."
  - phase: 6
    name: "User Story 4 - Adopt the feature with confidence"
    goal: "Document the accepted target and produce attributable benchmark and newly built public-path evidence before integration."
    dependencies:
      - "Phase 5"
    deliverables:
      - "Documentation/template coverage for both modes, precedence, bounds, trust, privacy, and rollback."
      - "Orchestration-only benchmark receipt with median/p95 and formula evidence."
      - "Isolated-socket built-binary smoke using local trusted SearXNG fixture, candidate identity, fallback summary, selected title, compatible output, and zero external search traffic."
  - phase: 7
    name: "Polish & Cross-Cutting Concerns"
    goal: "Run final checks, hand off only owned files, verify the active landed build, then perform the explicit reversible personal-config enablement."
    dependencies:
      - "Phase 6"
    deliverables:
      - "Focused acceptance matrix, repeated-run proof, formatting/build/Clippy/guardrail/dependency checks."
      - "Feature-owned commit and reviewed integration handoff without root-branch changes."
      - "Post-merge install/reload and active executable identity before any personal config write; backup, enablement, validation, and master-disabled rollback."

open_questions:
  - question: "Which explicitly trusted SearXNG instance, if any, should be placed in Ariel's personal configuration during the post-integration enablement step?"
    context: "The repository must not ship or infer a public default, and private instance URLs must not be committed or printed in diagnostics."
    proposed_resolution: "Use an already operator-approved private/self-hosted instance from existing secret-safe configuration; if none is approved, enable resilient DuckDuckGo/Bing behavior and leave SearXNG unavailable until Ariel supplies one."

