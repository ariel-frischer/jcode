plan:
  branch: "021-resilient-websearch-fallbacks"
  created: "2026-08-31"
  spec_path: "specs/021-resilient-websearch-fallbacks/spec.yaml"

summary: |
  Keep the existing `websearch` tool, DuckDuckGo/Bing/SearXNG adapters, shared reqwest client, result text, and ToolOutput/event flow as the compatibility shell. Add an opt-in policy resolver and a small orchestration submodule in `jcode-app-core` that produces a stable eligible order, normalizes engine outcomes, applies one bounded transient retry by default, and maintains short-lived in-memory health suppression per engine. Legacy execution remains the exact path when the new master switch is absent or false. The resilient path uses only DuckDuckGo HTML, keyless Bing HTML fallback, and an explicitly configured trusted SearXNG instance; it adds no paid, browser-driven, CAPTCHA-bypass, or untrusted-public engine.

  Add additive typed configuration in `jcode-config-types`, environment resolution in `jcode-base`, and optional non-secret request policy overrides while retaining all legacy input fields and aliases. A bounded privacy-safe diagnostic summary is attached through existing ToolOutput metadata/text and a compact ToolOutput title. The TUI makes one targeted `websearch` rendering exception so ordinary success shows only the selected engine, while fallback, retry, suppression, or exhaustion shows one compact attempt summary. Delivery proceeds through focused deterministic tests, orchestration-only benchmark evidence, a newly built binary on an isolated socket with a local trusted SearXNG fixture, documentation, guardrails, integration, and only then a separate explicit user-config enablement step.

technical_context:
  language: "Rust 2024 edition"
  framework: "Tokio async runtime with reqwest HTTP and ratatui TUI"
  primary_dependencies:
    - name: "jcode-config-types"
      version: "workspace path dependency"
      purpose: "Owns additive serialized websearch policy, engine controls, defaults, validation bounds, and request override types."
    - name: "jcode-base"
      version: "workspace path dependency"
      purpose: "Owns persisted configuration loading, environment overrides, default config documentation, and canonical effective-policy resolution support."
    - name: "jcode-app-core"
      version: "workspace path dependency"
      purpose: "Owns the existing websearch tool, engine adapters, orchestration, health state, diagnostics, and shared HTTP client use."
    - name: "jcode-tool-types"
      version: "workspace path dependency"
      purpose: "Provides the existing ToolOutput title and metadata contract reused without a new event or result type."
    - name: "jcode-tui"
      version: "workspace path dependency"
      purpose: "Owns the existing tool-card rendering surface and focused rendering tests."
    - name: "tokio"
      version: "1"
      purpose: "Provides bounded async timeouts and deterministic async test execution."
    - name: "reqwest"
      version: "0.12"
      purpose: "Continues all existing DuckDuckGo, Bing, and SearXNG HTTP work through the shared client."
    - name: "serde / serde_json"
      version: "1"
      purpose: "Preserves additive config and tool-input compatibility and carries structured non-secret diagnostics."
  storage: "Existing TOML configuration plus process-local in-memory per-engine health state; no new persistent storage."
  testing:
    framework: "Rust built-in test harness, Tokio tests, local TCP HTTP fixtures, ratatui rendering assertions, and isolated-socket built-binary smoke validation"
    approach: "Test the pure resolver and orchestration state machine first with scripted engine outcomes and explicit timestamps, then adapter classification with local HTTP fixtures, ToolOutput/TUI summaries, repeated deterministic runs, a focused ignored benchmark-style test, and a built candidate using a temporary JCODE_HOME and private socket."
  target_platform: "Jcode-supported Linux, macOS, and Windows builds; runtime smoke on Linux x86_64"
  project_type: "cli"
  performance_goals: "Median orchestration-only bookkeeping below 1 millisecond per search and below 2 percent of a representative 100 millisecond network attempt, with no HTTP-client construction on the normal path."
  constraints:
    - "The resilient master switch defaults to false, and the false or absent setting must execute the current legacy path unchanged."
    - "DuckDuckGo, Bing, and SearXNG names, aliases, existing config fields, tool input, result text shape, and events remain valid."
    - "The canonical precedence for new operational settings is request override, then environment, then persisted configuration, then built-in default."
    - "Default resilient policy uses fallback, retry, health suppression, and diagnostics only after the master switch is enabled."
    - "SearXNG is unavailable without an explicitly configured trusted instance, and diagnostics must never print its URL."
    - "No required API key, paid search API, browser automation, CAPTCHA solving, challenge bypass, or default untrusted public endpoint is introduced."
    - "All waits and work are bounded by finite per-attempt timeout, retry count, fixed capped retry delay, finite engine order, and short health cooldown."
    - "Queries, keys, response bodies, and private endpoint URLs are prohibited from diagnostics and TUI summaries."
    - "The existing shared HTTP client and ToolOutput/event contracts must be reused."
    - "Personal user configuration remains untouched until the supporting change is merged, installed, active, and separately verified."
    - "No new external crate dependency is required."
  scale_scope: "At most three supported engines per search, default one retry per eligible engine, small process-local health entries keyed by engine, and one bounded summary per tool call."

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "Surgical, Scope-Bound Changes (PRIN-001)"
      status: "PASS"
      notes: "The plan changes only websearch config/resolution, the existing app-core tool plus one focused submodule, one targeted TUI summary branch, tests, docs, and delivery evidence."
    - name: "Backward-Compatible User and Data Contracts (PRIN-002)"
      status: "PASS"
      notes: "All new fields are additive and defaulted, the master switch is false, legacy execution remains separate and unchanged, and existing ToolOutput/events are reused."
    - name: "Explicit Configuration Precedence (PRIN-003)"
      status: "PASS"
      notes: "One typed effective-policy resolver applies request, environment, persisted, and default candidates and tests unset, empty, invalid, unsupported, and conflicting values."
    - name: "Layered Rust Ownership and Dependency Direction (PRIN-004)"
      status: "PASS"
      notes: "Stable config types remain in jcode-config-types, environment/persisted resolution in jcode-base, runtime orchestration in jcode-app-core, and presentation in jcode-tui with no reverse dependency."
    - name: "Focused Behavioral Tests (PRIN-005)"
      status: "PASS"
      notes: "Every frozen Bead check and specification behavior maps to an exact resolver, state-machine, adapter, privacy, rendering, benchmark, or isolated-runtime check."
    - name: "Visible Failures and Trust-Boundary Validation (PRIN-006)"
      status: "PASS"
      notes: "Invalid policy values fail or use a documented lower-precedence safe value before network work, exhausted search is actionable, and negative assertions prohibit sensitive diagnostics."
    - name: "Repository Guardrails Are Delivery Gates (PRIN-007)"
      status: "PASS"
      notes: "Focused tests precede affected builds; formatting, Clippy/guardrails, benchmark evidence, and the isolated built-binary smoke are explicit delivery gates."
    - name: "Custom-First, Upstream-Aware Simplicity (PRIN-008)"
      status: "PASS"
      notes: "The existing custom websearch owner and public tool are extended directly without a plugin ABI, second tool, broad provider framework, or speculative engine."
    - name: "Outcome Ownership and Safe Autonomy (PRIN-009)"
      status: "PASS"
      notes: "The plan carries work through built-product proof and integration while separating the regret-prone personal-config edit until the active build is confirmed."
    - name: "Measured Efficiency and Runtime Truth (PRIN-010)"
      status: "PASS"
      notes: "A focused orchestration benchmark enforces the stated budget, and runtime evidence uses the newly built executable through a private socket with executable identity recorded."

research_findings:
  decisions:
    - topic: "Compatibility boundary"
      decision: "Branch at the start of WebSearchTool execution: master disabled uses the current legacy loop and master enabled uses the new orchestrator."
      rationale: "A hard opt-in boundary is the clearest way to prove unchanged legacy defaults, fields, aliases, Bing API behavior, result formatting, and event flow."
      alternatives_considered:
        - "Route both modes through the new state machine, which creates unnecessary regression risk for legacy users."
        - "Replace the websearch tool, which would break the public identity and consumer expectations."
    - topic: "Supported free engine set"
      decision: "Orchestrate only the three existing engines: DuckDuckGo HTML, keyless Bing HTML for fallback, and explicitly configured trusted SearXNG."
      rationale: "No additional engine found in scope offers a clearly trustworthy free access path without paid credentials, unstable scraping, browser automation, or an untrusted public default."
      alternatives_considered:
        - "Add a paid search API, rejected by the free-only requirement."
        - "Ship a public SearXNG instance, rejected by the trust requirement."
        - "Add speculative HTML scrapers such as Yahoo or Mojeek, rejected as unnecessary scope and reliability risk."
    - topic: "Configuration shape and defaults"
      decision: "Add a defaulted nested resilience policy with master disabled; fallback, all named engine eligibility flags, retries, health suppression, and diagnostics default enabled inside the opt-in policy. Use a 10000 ms attempt timeout bounded to 100..60000 ms, one retry bounded to 0..2, a fixed 200 ms retry delay, health threshold 2 bounded to 1..10, and cooldown 30000 ms bounded to 1000..300000 ms."
      rationale: "The master switch preserves legacy behavior while the enabled mode is useful without excessive tuning; all time and count values remain small, positive, documented, and testable."
      alternatives_considered:
        - "Default the master switch on, which violates legacy and post-integration acceptance."
        - "Expose unbounded retry/backoff controls, which increases complexity and risk."
        - "Disable every subfeature by default, which makes opt-in orchestration unexpectedly ineffective."
    - topic: "Precedence and request controls"
      decision: "Represent non-secret operational request overrides as one optional nested WebSearchPolicyOverride while retaining existing flat engine, market, query, and result-count inputs; resolve each field independently over raw environment, persisted config, and defaults."
      rationale: "This satisfies the mandated precedence without duplicating credentials or private URLs in tool input and avoids a large set of new top-level model-facing fields."
      alternatives_considered:
        - "Use only global config, which fails request-over-environment precedence."
        - "Expose Bing keys or SearXNG URLs in request policy, which expands the sensitive-data boundary."
        - "Mutate global configuration per request, which would leak state across sessions."
    - topic: "Stable orchestration and outcome model"
      decision: "Use a small pure policy/order/state layer with a scripted backend seam for tests; normalize each engine attempt as success, empty, challenge, timeout, transient, permanent, unavailable, disabled, or health-suppressed."
      rationale: "Typed outcomes make retry, fallback, health, diagnostics, and exhaustive tests deterministic instead of inferring policy from anyhow strings."
      alternatives_considered:
        - "Continue matching human-readable error strings, which is brittle and leaks presentation into policy."
        - "Build a general search-provider framework, which is broader than the three-engine requirement."
    - topic: "Retry, timeout, and health semantics"
      decision: "Wrap each physical engine request in tokio::time::timeout, retry only transport errors, timeouts, HTTP 429, and HTTP 502/503/504, never retry challenge/empty/auth/config/parser/permanent outcomes, and update health only for eligible transient terminal failures."
      rationale: "This directly implements the narrow transient policy, prevents challenge hammering, and bounds total work by engine count times retry allowance and timeout."
      alternatives_considered:
        - "Retry every error, which wastes time and risks repeated blocked requests."
        - "Persist circuit state, which adds storage and stale-state complexity not required by the Bead."
        - "Use a global circuit shared across engines, which violates engine isolation."
    - topic: "Health-state ownership and time control"
      decision: "Keep health state in the long-lived WebSearchTool instance behind a small mutex, keyed by engine; pass explicit observed Instants into pure health transitions and capture one selection-time Instant per engine-order decision."
      rationale: "State survives repeated calls in the owning runtime without persistence, engines remain isolated, and tests can advance time deterministically without a new clock dependency."
      alternatives_considered:
        - "Use process-wide mutable statics, which complicate test isolation and ownership."
        - "Create state per call, which cannot suppress repeatedly failing engines."
        - "Add a clock crate, which is unnecessary for explicit-time pure transitions."
    - topic: "Diagnostics and exhausted outcome"
      decision: "Build one bounded privacy-safe SearchDiagnosticSummary, attach its structured form as ToolOutput metadata when enabled, add one concise text line only for meaningful fallback/retry/suppression or exhaustion, and return handled exhaustion as an actionable ToolOutput rather than discarding all but the last error."
      rationale: "Existing consumers keep valid tool output, the public path can observe the summary, and the TUI can render a title without an event-contract change."
      alternatives_considered:
        - "Log full requests/responses, which violates privacy."
        - "Return only the final anyhow error, which loses per-engine causes and the ToolOutput title."
        - "Always print verbose diagnostics, which makes successful output noisy."
    - topic: "Minimal TUI visibility"
      decision: "Set the WebSearch ToolOutput title to the selected engine for ordinary success or a compact engine/attempt/retry summary for meaningful activity, and teach the existing generic tool-card renderer to prefer title only for websearch."
      rationale: "The current TUI already transports ToolOutput titles but only special-cases subagent titles; one websearch branch provides visibility without a new panel or event shape."
      alternatives_considered:
        - "Redesign the tool card or add a diagnostics panel, which is explicitly out of scope."
        - "Put all status detail in result content, which is noisier for the model and transcript."
        - "Extend ToolEvent with websearch-specific fields, which creates avoidable protocol compatibility work."
    - topic: "Performance and runtime evidence"
      decision: "Add a focused ignored benchmark-style Rust test over the pure orchestrator and record median/p95 evidence, then run the built jcode binary with a temporary config, isolated socket, disabled first engine, and local trusted SearXNG fixture to force deterministic fallback without external search traffic."
      rationale: "The benchmark measures only bookkeeping, and the smoke proves the shipped public path and TUI-compatible title/output against the candidate binary rather than the shared daemon."
      alternatives_considered:
        - "Treat cargo build as runtime evidence, which the constitution rejects."
        - "Use live DuckDuckGo or Bing for the smoke, which is nondeterministic and may trigger challenges."
        - "Add production endpoint overrides for testability, which expands the trust surface."


data_model:
  entities:
    - name: "WebSearchResilienceConfig"
      description: "Persisted and environment-overridable operational controls for opt-in resilient search."
      fields:
        - name: "enabled"
          type: "bool"
          description: "Master switch selecting legacy or resilient execution."
          constraints: "Defaults false."
        - name: "engine_enabled"
          type: "Map<WebSearchEngine, bool>"
          description: "Independent eligibility for DuckDuckGo, Bing, and SearXNG."
          constraints: "Known engines only; legacy path ignores these flags."
        - name: "fallback_enabled"
          type: "bool"
          description: "Whether eligible engines after the preferred engine may be considered."
          constraints: "Defaults true inside resilient mode."
        - name: "attempt_timeout_ms"
          type: "u64"
          description: "Finite timeout for each physical engine request."
          constraints: "100 through 60000 inclusive; default 10000."
        - name: "retries_enabled"
          type: "bool"
          description: "Whether narrowly eligible transient outcomes may retry the same engine."
          constraints: "Defaults true inside resilient mode."
        - name: "max_retries"
          type: "u8"
          description: "Maximum additional attempts for one engine sequence."
          constraints: "0 through 2 inclusive; default 1."
        - name: "health_suppression_enabled"
          type: "bool"
          description: "Whether repeated eligible failures temporarily suppress an engine."
          constraints: "Defaults true inside resilient mode."
        - name: "health_failure_threshold"
          type: "u8"
          description: "Consecutive eligible terminal failures before suppression."
          constraints: "1 through 10 inclusive; default 2."
        - name: "health_cooldown_ms"
          type: "u64"
          description: "Short suppression lifetime."
          constraints: "1000 through 300000 inclusive; default 30000."
        - name: "diagnostics_enabled"
          type: "bool"
          description: "Whether optional structured and textual aggregate diagnostics are emitted."
          constraints: "Never permits query, key, body, or private URL disclosure."
      relationships:
        - target: "ResolvedWebSearchPolicy"
          type: "one-to-one"
          description: "Provides persisted candidates below request and environment candidates."
    - name: "WebSearchPolicyOverride"
      description: "Optional non-secret per-request or per-session operational candidates."
      fields:
        - name: "fields"
          type: "Option values matching WebSearchResilienceConfig"
          description: "Only explicitly supplied values override lower-precedence sources."
          constraints: "No credentials or endpoint URLs; invalid values fail before network work."
      relationships:
        - target: "ResolvedWebSearchPolicy"
          type: "many-to-one"
          description: "One request overlay contributes the highest-precedence candidates to one effective policy."
    - name: "ResolvedWebSearchPolicy"
      description: "Validated effective settings and stable eligible engine order for one search."
      fields:
        - name: "values"
          type: "Typed effective policy"
          description: "Resolved operational behavior."
          constraints: "Each value records a non-secret source and satisfies documented bounds."
        - name: "engine_order"
          type: "Vec<WebSearchEngine>"
          description: "Preferred engine followed by configured fallbacks in first-occurrence order."
          constraints: "No duplicates; disabled, unavailable, and currently suppressed engines are excluded from attempts."
      relationships:
        - target: "EngineAttemptOutcome"
          type: "one-to-many"
          description: "The policy controls a bounded sequence of normalized attempts."
        - target: "SearchDiagnosticSummary"
          type: "one-to-one"
          description: "Effective non-secret values and selection decisions feed the aggregate summary."
    - name: "EngineAttemptOutcome"
      description: "Normalized result of considering or physically attempting one engine."
      fields:
        - name: "engine"
          type: "WebSearchEngine"
          description: "Canonical existing engine identity."
          constraints: "DuckDuckGo, Bing, or SearXNG."
        - name: "attempt_number"
          type: "u8"
          description: "Physical attempt index for the engine."
          constraints: "At most max_retries plus one."
        - name: "classification"
          type: "EngineOutcomeKind"
          description: "Success, empty, challenge, timeout, transient, permanent, disabled, unavailable, health-suppressed, or exhausted."
          constraints: "Classification deterministically defines retry, fallback, health, and terminal behavior."
        - name: "elapsed_ms"
          type: "u64"
          description: "Privacy-safe bounded attempt duration."
          constraints: "Contains no URL, query, body, or credential material."
      relationships:
        - target: "EngineHealthState"
          type: "many-to-one"
          description: "Eligible terminal outcomes update only the matching engine state."
        - target: "SearchDiagnosticSummary"
          type: "many-to-one"
          description: "Bounded attempt records contribute aggregate reasons and counts."
    - name: "EngineHealthState"
      description: "Short-lived process-local circuit state isolated by engine."
      fields:
        - name: "consecutive_failures"
          type: "u8"
          description: "Count of eligible consecutive terminal failures."
          constraints: "Reset or improved on success; permanent/challenge/empty outcomes do not increment."
        - name: "suppressed_until"
          type: "Option<Instant>"
          description: "Cooldown expiry for the engine."
          constraints: "Not serialized; expiry is evaluated against one captured decision time."
      relationships:
        - target: "WebSearchTool"
          type: "many-to-one"
          description: "The long-lived existing tool instance owns one entry per engine."
    - name: "SearchDiagnosticSummary"
      description: "Bounded aggregate operational explanation attached through existing ToolOutput fields."
      fields:
        - name: "considered"
          type: "Vec<EngineSummary>"
          description: "Ordered attempted and skipped engine outcomes."
          constraints: "Maximum one bounded entry per supported engine plus retry counts."
        - name: "selected_engine"
          type: "Option<WebSearchEngine>"
          description: "Engine producing usable results, if any."
          constraints: "Canonical public engine name only."
        - name: "attempt_count"
          type: "u8"
          description: "Total physical attempts."
          constraints: "Bounded by eligible engines and retry allowance."
        - name: "terminal_outcome"
          type: "EngineOutcomeKind"
          description: "Success or aggregate exhaustion classification."
          constraints: "Actionable but privacy-safe."
      relationships:
        - target: "ToolOutput"
          type: "one-to-one"
          description: "Produces compact title, optional structured metadata, and conditional bounded text without changing the contract."

api_contracts:
  endpoints:
    - method: "TOOL"
      path: "websearch"
      description: "Existing public websearch tool with additive optional resilient operational overrides."
      request:
        content_type: "application/json"
        body_schema: "{query:string, num_results?:integer, engine?:duckduckgo|ddg|bing|searxng|searx, bing_market?:string, resilience?:WebSearchPolicyOverride}"
      response:
        success_code: 200
        body_schema: "Existing ToolOutput text plus title and optional privacy-safe metadata; ordinary result formatting remains compatible, and handled exhaustion returns one actionable aggregate outcome."
      errors:
        - code: 400
          description: "Malformed JSON, invalid override bounds, unsupported engine values, or other pre-network input validation failure."
        - code: 504
          description: "Individual engine timeouts are normalized and may fallback; only unhandled tool-runtime failures escape the aggregate orchestration contract."

