      check: "git diff --check; review git status/diff and stage only feature-owned paths in T025"
    - principle: "PRIN-002"
      check: "Focused legacy fixture and absent/false-master regression tests in T002/T009/T011/T023"
    - principle: "PRIN-003"
      check: "T003/T006/T012/T013 precedence matrix, including exact fallback_order source chain"
    - principle: "PRIN-004"
      check: "scripts/check_dependency_boundaries.py and Cargo metadata in T024"
    - principle: "PRIN-005"
      check: "Exact focused config, orchestration, adapter, diagnostics, and TUI tests in T023"
    - principle: "PRIN-006"
      check: "Pre-network invalid-policy/trust-boundary and negative privacy assertions in T003/T009/T014/T022"
    - principle: "PRIN-007"
      check: "Formatting, affected builds, Clippy, guardrails, and artifact validators in T024"
    - principle: "PRIN-008"
      check: "No paid/browser dependency, second tool, or unrelated TUI redesign in T009/T011/T024"
    - principle: "PRIN-009"
      check: "T025/T026/T027 active-build-before-config-write and reversible post-integration workflow"
    - principle: "PRIN-010"
      check: "T018/T020 benchmark receipt and T022 isolated-socket built-binary runtime identity"

