implementation_phases:
  - phase: 1
    name: "Freeze compatibility and policy contracts"
    goal: "Define additive config and request types, exact defaults/ranges, canonical precedence, and failing tests before runtime behavior changes."
    deliverables:
      - "Legacy TOML and tool-input fixtures for DuckDuckGo, Bing, SearXNG, aliases, fallback_engines, Bing settings, and absent resilience policy."
      - "WebSearchResilienceConfig and WebSearchPolicyOverride serde/default/validation tests."
      - "Full request > environment > persisted > default precedence matrix, including unset, empty, invalid, unsupported, and conflicting candidates."
      - "Documented environment variable names and lower-precedence fallback/error behavior."
  - phase: 2
    name: "Build the deterministic orchestration core"
    goal: "Introduce the modular typed outcome and state-machine layer without changing the existing engine HTTP code."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Stable first-occurrence engine ordering and eligibility filtering."
      - "Typed success, empty, challenge, timeout, transient, permanent, disabled, unavailable, health-suppressed, and exhausted outcomes."
      - "Scripted backend seam with exact attempt-order, no-duplicate, no-disabled-attempt, stop-on-success, and aggregate-reason tests."
      - "At least 100 repeated deterministic decision runs with identical recorded attempts."
  - phase: 3
    name: "Integrate adapters, bounds, retries, and health"
    goal: "Route resilient mode through existing DuckDuckGo, Bing, and SearXNG adapters while preserving the disabled-master legacy path."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Existing shared HTTP client retained with per-request tokio timeout wrappers."
      - "HTTP/transport/parser response mapping into normalized outcomes using local deterministic servers where transport classification is required."
      - "One default retry only for transport, timeout, 429, 502, 503, and 504 outcomes with fixed bounded delay and no retry for challenge, empty, auth, config, malformed, or permanent outcomes."
      - "Process-local per-engine health threshold, cooldown, skip, expiry, success recovery, and cross-engine isolation with explicit-time tests."
      - "Trusted SearXNG unavailable behavior with no inferred public endpoint."
      - "Legacy and resilient Bing API/HTML compatibility tests proving no new paid dependency and keyless fallback behavior."
  - phase: 4
    name: "Add aggregate diagnostics and minimal TUI status"
    goal: "Explain meaningful fallback behavior through existing output contracts without making ordinary success noisy."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Bounded SearchDiagnosticSummary with effective non-secret values, considered engines, attempts, retries, skips, elapsed summary, selected engine, and terminal reasons."
      - "Negative assertions for query fixtures, keys, secret environment values, response bodies, and private SearXNG URLs."
      - "ToolOutput title showing only the selected engine on first success and a compact attempt/retry summary on meaningful activity."
      - "Conditional one-line public output summary for fallback/retry/suppression/exhaustion only when diagnostics are enabled."
      - "Targeted TUI rendering tests for first success, fallback success, retry success, suppression, diagnostics disabled, and aggregate failure without a new panel."
  - phase: 5
    name: "Document and prove performance"
    goal: "Make configuration predictable and record attributable orchestration-overhead evidence."
    dependencies:
      - "Phase 4"
    deliverables:
      - "docs/WEBSEARCH.md and default config template covering every control, default, precedence rule, valid range, retry class, cooldown behavior, privacy promise, trusted SearXNG requirement, and disabled/enabled examples."
      - "Focused ignored benchmark-style test over orchestration-only work with warm-up, repeated samples, median and p95 output, and assertion of median below 1 ms and below 2 percent of 100 ms."
      - "Before/after or legacy/resilient benchmark receipt with command, candidate commit, profile, hardware, sample count, and measured values in validation.md."
  - phase: 6
    name: "Validate the built public path"
    goal: "Prove the candidate binary, not the shared old daemon, exposes deterministic resilient behavior through the public websearch workflow."
    dependencies:
      - "Phase 5"
    deliverables:
      - "Focused config, app-core, and TUI tests plus formatting and affected builds."
      - "Temporary JCODE_HOME with resilience enabled, first engine disabled, trusted local SearXNG fixture, diagnostics enabled, and no personal config mutation."
      - "Newly built jcode run against a unique isolated socket with resolved executable identity and candidate commit recorded."
      - "Observed fallback/skip summary, selected SearXNG title, compatible search output, and zero external search requests in the deterministic fixture smoke."
      - "scripts/check_guardrails.sh result with unrelated baseline failures isolated rather than hidden."
  - phase: 7
    name: "Integrate, activate, and explicitly enable user configuration"
    goal: "Complete the frozen post-integration acceptance check without enabling unsupported settings early."
    dependencies:
      - "Phase 6"
    deliverables:
      - "Commit only owned feature files in the isolated worktree and hand the reviewed branch to the repository integration workflow."
      - "After merge into dev, install the active build using the repository fast install/reload procedure and verify the launcher/shared-server binary contains the supporting commit."
