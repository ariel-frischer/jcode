        dependencies: ["T014"]
        acceptance_criteria:
          - "Build one bounded aggregate summary from normalized attempts and health decisions using canonical engine names and non-secret counts/reasons only."
          - "Attach structured diagnostics through existing ToolOutput metadata and set a compact title to the selected engine on ordinary success or to an engine/attempt/retry summary for meaningful activity."
          - "Add one conditional user-facing summary line only for fallback, retry, suppression, or exhaustion when diagnostics are enabled; preserve existing result formatting and handled aggregate errors."
          - "All diagnostic structure, privacy, and noise tests pass without changing the ToolOutput or event contract."

      - id: "T017"
        title: "Implement the targeted websearch title preference in the existing TUI tool-card renderer"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-003"
        file_path: "crates/jcode-tui/src/tui/ui_messages.rs"
        dependencies: ["T015", "T016"]
        acceptance_criteria:
          - "Teach the existing generic tool-card rendering path to prefer the websearch ToolOutput title without redesigning cards, adding a panel, or special-casing unrelated tools."
          - "Show only the selected engine for a clean first success and the compact attempt summary for fallback/retry/suppression/exhaustion."
          - "All deterministic TUI rendering and privacy tests pass, including diagnostics-disabled behavior and existing tool-card regressions."

