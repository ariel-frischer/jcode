phases:
  - number: 1
    title: "Setup"
    purpose: "Freeze the compatibility boundary, acceptance evidence plan, and deterministic fixture strategy before changing runtime behavior."
    tasks:
      - id: "T001"
        title: "Record the legacy websearch baseline and frozen Bead acceptance evidence plan"
        status: "Pending"
        type: "setup"
        parallel: false
        story_id: null
        file_path: "specs/021-resilient-websearch-fallbacks/validation.md"
        dependencies: []
        acceptance_criteria:
          - "Record the current branch, candidate base revision, existing focused websearch/config/TUI test commands, and any unrelated baseline failures before implementation."
          - "Inventory the existing DuckDuckGo, Bing, and SearXNG names and aliases, legacy WebSearchConfig fields, request fields, Bing API behavior, result text shape, ToolOutput fields, and event flow that must remain compatible."
          - "Map all eleven frozen jcode-ow6 acceptance checks and every FR/NFR to a later task and an attributable command or assertion."
          - "State explicitly that the master switch is opt-in and that personal user configuration must not be modified before the post-integration task."

  - number: 2
    title: "Foundational"
    purpose: "Define additive policy contracts, canonical source precedence, and the pure typed orchestration primitives required by all user stories."
    tasks:
      - id: "T002"
        title: "Add failing config contract tests for resilient policy defaults, bounds, aliases, and legacy decoding"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: null
        file_path: "crates/jcode-config-types/src/lib.rs"
        dependencies: ["T001"]
        acceptance_criteria:
          - "Tests require a defaulted nested WebSearchResilienceConfig with enabled = false, fallback/retry/health/diagnostic subcontrols enabled inside resilient mode, timeout 10000 ms, max_retries 1, threshold 2, cooldown 30000 ms, and documented inclusive bounds."
          - "Tests cover WebSearchPolicyOverride decoding with independently optional non-secret fields and reject or safely resolve values outside 100..60000 ms, 0..2 retries, 1..10 failures, and 1000..300000 ms cooldown."
          - "Legacy TOML and request fixtures continue to decode DuckDuckGo, ddg, Bing, SearXNG, searx, fallback_engines, Bing settings, and an absent resilience section without migration."
          - "Tests assert that request overrides do not provide credentials or SearXNG endpoint URLs."

      - id: "T003"
        title: "Add failing environment and persisted-policy precedence matrix tests"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: null
        file_path: "crates/jcode-base/src/config/env_overrides.rs"
        dependencies: ["T001"]
        acceptance_criteria:
          - "The matrix covers built-in defaults, persisted TOML values, environment candidates, and request/session candidates both alone and in every conflicting combination."
          - "Tests define the canonical order request/session override > environment > persisted config > built-in default for each field independently."
          - "Unset, empty, malformed, out-of-range, and unsupported engine/order values have documented lower-precedence fallback or visible pre-network validation behavior."
          - "Environment tests isolate and restore all JCODE_WEBSEARCH_* variables, including master switch, engine flags/order, timeout, retry, health, and diagnostics controls."

      - id: "T004"
        title: "Add failing deterministic tests for typed outcomes, order filtering, and health transitions"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: null
        file_path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
        dependencies: ["T001"]
        acceptance_criteria:
          - "Tests require canonical DuckDuckGo, Bing, and SearXNG outcome classifications for success, empty, challenge, timeout, transient, permanent, disabled, unavailable, health-suppressed, and exhausted states."
          - "Tests require first-occurrence de-duplication of preferred and fallback engines and exclusion of disabled, unavailable, and actively suppressed engines."
          - "Tests use explicit Instants to prove threshold, cooldown expiry, success recovery, per-engine isolation, and one consistent selection-time observation."
          - "A scripted backend test repeats the same decision at least 100 times and requires identical recorded attempts and terminal classification."

      - id: "T005"
        title: "Implement additive WebSearchResilienceConfig and WebSearchPolicyOverride types"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: null
        file_path: "crates/jcode-config-types/src/lib.rs"
        dependencies: ["T002"]
        acceptance_criteria:
          - "Add serde-defaulted policy and optional override types beside the existing WebSearchEngine and WebSearchConfig without changing legacy field names, aliases, or defaults."
          - "Implement typed engine enable controls, fallback order, bounded timeout/retry/health values, and diagnostics controls with the exact defaults and validation bounds from the plan."
          - "Keep the request override non-secret and additive; preserve existing flat engine, market, query, result-count, Bing credential, and SearXNG URL inputs."
          - "All config contract tests pass, including round trips for absent and explicit master settings."

      - id: "T006"
        title: "Implement the canonical websearch policy source resolver and safe environment parsing"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: null
        file_path: "crates/jcode-base/src/config/env_overrides.rs"
        dependencies: ["T003", "T005"]
        acceptance_criteria:
          - "Resolve each operational field independently in request/session, environment, persisted, default order and expose only validated effective values to runtime callers."
          - "Define and document stable JCODE_WEBSEARCH_* names for the master switch, per-engine flags/order, fallback, timeout, retries, health, and diagnostics settings."
          - "Empty, invalid, unsupported, or out-of-range candidates use the documented safe lower-precedence value or produce a visible pre-network validation error, never an unbounded or silently unsafe policy."
          - "All precedence tests pass while legacy configuration loading remains unchanged when the resilience section is absent."

      - id: "T007"
        title: "Implement the pure orchestration model, eligible-order resolver, and per-engine health state"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: null
        file_path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
        dependencies: ["T004", "T005", "T006"]
        acceptance_criteria:
          - "Define typed normalized outcomes, resolved policy/order, bounded attempt records, aggregate state, and process-local health entries keyed only by WebSearchEngine."
          - "Produce a stable first-occurrence engine order and mark disabled, unavailable, and health-suppressed engines without contacting them."
          - "Make health transitions pure with explicit observed Instants, incrementing only eligible transient terminal failures, suppressing at threshold, expiring after cooldown, and clearing or improving on success."
          - "Provide a small scripted backend seam so orchestration decisions can be tested without live network access or a new external crate."
          - "Foundational ordering, outcome, health, privacy-safe field, and repeated-run tests compile and pass."

  - number: 3
    title: "User Story 1 - Receive reliable free web search results"
    purpose: "Use the existing free engines through a bounded resilient state machine that falls back on unusable or eligible transient outcomes and stops at the first usable result."
    story_reference: "US-001"
    independent_test: "Run the scripted backend and local HTTP fixture sequences for challenge, empty, transient, timeout, permanent, and success outcomes; verify exact attempts, retry bounds, health decisions, stop-on-success behavior, and actionable exhaustion without external search traffic."
    tasks:
      - id: "T008"
        title: "Add failing orchestration behavior tests for fallback, retry, timeout, and exhaustion"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: "US-001"
        file_path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
        dependencies: ["T007"]
        acceptance_criteria:
          - "Challenge, empty, and eligible transient scripted sequences continue in configured eligible order, while the first usable result stops all later attempts."
          - "Transport, timeout, HTTP 429, and HTTP 502/503/504 outcomes retry only while retries are enabled and allowance remains; challenge, empty, authentication, invalid configuration, malformed, unsupported, and permanent outcomes never same-engine retry."
          - "Tests prove one default retry, configured zero-to-two retry bounds, fixed bounded retry delay, finite engine count, and no attempt after exhaustion or success."
          - "Mixed failure sequences retain per-engine terminal reasons and return an actionable aggregate exhausted outcome instead of only the last error."

      - id: "T009"
        title: "Add failing local HTTP adapter and legacy compatibility tests"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: "US-001"
        file_path: "crates/jcode-app-core/src/tool/websearch.rs"
        dependencies: ["T007"]
        acceptance_criteria:
          - "Local TCP fixtures classify DuckDuckGo challenge/empty/usable HTML, Bing keyless HTML and API responses, SearXNG JSON, malformed bodies, 429/5xx, and stalled responses into the typed outcomes."
          - "Tests prove every physical request uses the existing shared reqwest client and a finite tokio timeout without constructing a second client on the normal path."
          - "Existing engine aliases, parser result text, Bing API key behavior, keyless Bing fallback, SearXNG URL handling, and ToolOutput/event compatibility remain covered."
          - "The fixtures never require a paid API, browser automation, CAPTCHA bypass, or a public default endpoint."

      - id: "T010"
        title: "Implement bounded retry/fallback execution and health-aware attempt transitions"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
        dependencies: ["T008"]
        acceptance_criteria:
          - "Execute at most the finite eligible engine order, wrap each physical adapter call in tokio::time::timeout using the validated policy, and apply only the narrow transient retry class."
          - "Use the configured fixed capped retry delay and never exceed max_retries, per-attempt timeout, or the total bounded engine sequence."
          - "Update only the matching engine health state for eligible terminal transient failures, skip active suppression, permit cooldown expiry, and recover state after success."
          - "Return the first usable SearchResult and otherwise return one aggregate exhausted outcome containing concise terminal classifications."
          - "All US-001 orchestration behavior tests pass deterministically."

      - id: "T011"
        title: "Integrate resilient execution into WebSearchTool while preserving the exact legacy branch"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-app-core/src/tool/websearch.rs"
        dependencies: ["T009", "T010"]
        acceptance_criteria:
          - "Branch at the start of WebSearchTool::execute: absent or false master switch uses the current legacy loop unchanged, while true uses the orchestrator."
          - "The resilient path calls the existing DuckDuckGo, Bing, and explicitly configured SearXNG adapters through the shared HTTP client and normalizes their responses without a new provider framework."
          - "No trusted SearXNG URL means SearXNG is unavailable and no public instance is inferred; fallback continues or returns an actionable configuration outcome."
          - "The public websearch tool name, request schema, ToolOutput/event contracts, and ordinary result text remain compatible."
          - "Local adapter and legacy regression tests pass with no paid or browser dependency added."

  - number: 4
    title: "User Story 2 - Control resilient search behavior"
    purpose: "Expose predictable, opt-in controls for engine eligibility, fallback, timeout, retries, health suppression, diagnostics, and request-level operational overrides."
    story_reference: "US-002"
    independent_test: "Resolve isolated persisted, environment, and request candidates and execute deterministic searches with disabled, unavailable, duplicate, suppressed, or explicitly selected engines; verify exact effective policy and contacted-engine set."
    tasks:
      - id: "T012"
        title: "Add failing end-to-end control, precedence, and free-only compatibility tests"
        status: "Pending"
        type: "test"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/tool/websearch.rs"
        dependencies: ["T011"]
        acceptance_criteria:
          - "Tests cover absent/false/true master switch, each independent engine flag, fallback disabled, retry disabled, health disabled, diagnostics disabled, timeout/retry/health bounds, and ordered duplicate fallback entries."
          - "A preferred engine that is disabled, unavailable, or suppressed is never contacted; fallback proceeds only when policy allows and reports skipped status without sensitive values."
          - "Request/session overrides beat environment, environment beats persisted config, and persisted config beats defaults for individual fields without mutating global state across calls."
          - "Explicit engine selection remains compatible in legacy mode and follows resilient eligibility/fallback rules in enabled mode."
          - "SearXNG without an explicitly trusted valid instance remains unavailable, while a Bing credential remains legacy-compatible but is not required by resilient keyless fallback."

      - id: "T013"
        title: "Wire resolved policy and request overrides into WebSearchTool execution"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-app-core/src/tool/websearch.rs"
        dependencies: ["T012"]
        acceptance_criteria:
          - "Decode the additive optional resilience override and pass it through the canonical resolver without duplicating precedence logic or exposing credentials/private URLs in request input."
          - "Use the effective master switch to select the untouched legacy path or resilient path and use effective engine flags/order/timeout/retry/health/diagnostic settings for that call."
          - "Validate unsupported engines and bounds before any network work, de-duplicate order preserving first occurrence, and keep policy state local to the request except for the owning tool's health map."
          - "All US-002 control and compatibility tests pass and all legacy fixtures remain valid with no user-config enablement performed."

  - number: 5
    title: "User Story 3 - Understand fallback activity without noise"
    purpose: "Attach bounded non-secret diagnostics and add one focused TUI rendering exception that shows the selected engine while keeping ordinary success concise."
    story_reference: "US-003"
    independent_test: "Construct deterministic first-success, fallback, retry, suppression, diagnostics-disabled, and aggregate-failure ToolOutputs, then render them through the existing tool-card path and compare compact text."
    tasks:
      - id: "T014"
        title: "Add failing diagnostic privacy and output-contract tests"
        status: "Pending"
        type: "test"
        parallel: true
        story_id: "US-003"
        file_path: "crates/jcode-app-core/src/tool/websearch/orchestration.rs"
        dependencies: ["T013"]
        acceptance_criteria:
