          - "First-attempt success has only the selected-engine title and no verbose diagnostic line; fallback, retry, suppression, or exhaustion has at most one concise summary line when diagnostics are enabled."
          - "Diagnostics-disabled success and failure retain normal result/actionable error behavior while omitting optional aggregate detail."
          - "Negative assertions prove fixture queries, Bing keys, secret environment values, response bodies, and private SearXNG URLs never occur in metadata, text, titles, or derived summaries."

      - id: "T015"
        title: "Add failing TUI rendering tests for selected-engine and compact attempt summaries"
