feature:
  branch: "015-tune-rust-feedback"
  created: "2026-08-22"
  status: "Draft"
  input: "Benchmark and tune Rust development feedback after deduplication. Implement the approved jcode-l89.4 contract: freeze a reproducible benchmark matrix for warm and cold builds, focused and invalid tests, broad validation, and coordinated duplicate requests; compare adaptive Cargo jobs against 6 and 8; safely narrow eligible package/target/features while preserving explicit feature precedence and optional-feature correctness; add visible zero-test preflight; bound nextest and non-incremental sccache experiments; adopt only measured p50/p95 wins with runtime budgets unchanged; preserve full-feature release validation; add focused tests, benchmark receipts, rejected-experiment evidence, guardrails, built-binary isolated-socket validation, and trace PRIN-002/003/005/007/008/010."

user_stories:
  - id: "US-001"
    title: "Compare development feedback reproducibly"
    priority: "P0"
    as_a: "Jcode maintainer"
    i_want: "a frozen benchmark matrix that compares representative Rust development workflows under controlled conditions"
    so_that: "feedback improvements are supported by repeatable evidence rather than isolated timing anecdotes"
    why_this_priority: "A trustworthy baseline and comparison method are prerequisites for every tuning decision in this feature."
    independent_test: "Run the frozen matrix for a baseline and candidate and verify that all required scenarios, samples, environment metadata, action counts, timings, resource observations, and outcomes are retained in reviewable receipts."
    acceptance_scenarios:
      - given: "the same recorded source state, toolchain, machine conditions, and benchmark definition"
        when: "a maintainer repeats the baseline or candidate matrix"
        then: "the run covers warm and cold builds, focused and invalid tests, broad validation, and coordinated duplicate requests and reports comparable p50 and p95 results"
      - given: "a matrix run has missing scenarios, invalid samples, retries, or environmental interference"
        when: "the report is produced"
        then: "the omissions or invalidations are visible and the run cannot be presented as complete evidence"

  - id: "US-002"
    title: "Receive faster focused feedback safely"
    priority: "P0"
    as_a: "developer iterating on Jcode Rust code"
    i_want: "eligible inner-loop validation to use only the package, target, and features required by my change"
    so_that: "I receive focused feedback sooner without falsely validating code that depends on optional features"
    why_this_priority: "Narrowing scope is a primary potential latency win, but incorrect narrowing would undermine validation correctness."
    independent_test: "Exercise representative changed paths and explicit command options, then verify that eligible requests choose the narrowest correct scope, explicit feature choices win, and optional-feature code is never checked without its required feature."
    acceptance_scenarios:
      - given: "a changed path has one demonstrably sufficient package, target, and required feature set"
        when: "focused validation is requested without explicit overriding feature arguments"
        then: "the request uses that narrow scope and records the effective selection"
      - given: "the developer explicitly supplies feature arguments"
        when: "focused validation is resolved"
        then: "the explicit arguments retain precedence over inferred defaults"
      - given: "an affected path requires an optional feature that cannot be determined safely"
        when: "focused validation is resolved"
        then: "the system falls back to a correctness-preserving broader scope rather than reporting false success"

  - id: "US-003"
    title: "Reject empty test requests early"
    priority: "P1"
    as_a: "developer running a focused test"
    i_want: "invalid package and test-filter combinations to fail visibly before avoidable queue and gate waiting"
    so_that: "I can correct a zero-test request immediately while valid exact tests keep familiar behavior"
    why_this_priority: "Existing zero-test exits waste scarce validation capacity and delay actionable feedback."
    independent_test: "Submit known invalid and valid exact test scopes with discovery data available and verify that invalid scopes fail before gate acquisition while valid scopes preserve normal matching and execution semantics."
    acceptance_scenarios:
      - given: "available discovery data proves that a package and test-filter combination selects zero tests"
        when: "the request is submitted"
        then: "the request fails before avoidable broad queue or Cargo-gate wait with an actionable zero-test message"
      - given: "discovery data is unavailable or cannot prove the scope invalid"
        when: "the request is submitted"
        then: "the system preserves the established execution path rather than rejecting a potentially valid test"
      - given: "a valid exact test request"
        when: "preflight and execution complete"
        then: "the requested test runs with existing Cargo-compatible filtering semantics"

  - id: "US-004"
    title: "Evaluate bounded acceleration options"
    priority: "P1"
    as_a: "Jcode maintainer"
    i_want: "adaptive job counts, alternative test execution, and cold-build caching to be evaluated in bounded reversible experiments"
    so_that: "only operationally safe improvements are adopted and unsuccessful experiments are not repeatedly retried"
    why_this_priority: "These options may improve feedback but can also increase resource contention, disk use, incompatibility, or failure risk."
    independent_test: "Run the predefined adaptive-versus-6-versus-8 job comparison and bounded nextest and non-incremental sccache lanes, then verify compatibility, resource, fallback, and rejection evidence before any default changes."
    acceptance_scenarios:
      - given: "isolated one-action benchmark scenarios"
        when: "adaptive jobs, 6 jobs, and 8 jobs are compared"
        then: "each configuration uses the same matrix and records wall time, execution time, peak memory, swap, exit status, and retries"
      - given: "coordinated duplicate requests"
        when: "job-count behavior is measured"
        then: "the existing coordinator owns the shared execution and the experiment does not introduce uncontrolled concurrent Cargo work"
      - given: "nextest or non-incremental sccache is unavailable, incompatible, slower, unstable, or operationally costly"
        when: "the bounded trial concludes"
        then: "the option is rejected with evidence and the established path remains the default"

  - id: "US-005"
    title: "Preserve release and runtime confidence"
    priority: "P0"
    as_a: "Jcode reviewer"
    i_want: "every adopted development optimization to retain full-feature release validation and maintained runtime budgets"
    so_that: "faster inner-loop feedback does not hide correctness gaps or degrade the product users run"
    why_this_priority: "Runtime performance and full-feature correctness dominate developer-velocity tradeoffs under the approved contract."
    independent_test: "Verify focused regression tests, explicit full-feature release paths, repository guardrails, and newly built isolated-runtime checks against every adopted change."
    acceptance_scenarios:
      - given: "a candidate optimization improves one or more development scenarios"
        when: "the adoption gate is evaluated"
        then: "it is accepted only when representative p50 and p95 evidence supports the win and applicable client and daemon budgets do not regress"
      - given: "focused defaults omit optional features"
        when: "full-feature or release validation is explicitly requested"
        then: "the complete validation remains available and behaves as before"
      - given: "a newly built candidate binary"
        when: "isolated-socket runtime validation is performed"
        then: "the executing binary identity is confirmed and the maintained runtime checks pass without disturbing the shared daemon"

requirements:
  functional:
    - id: "FR-001"
      description: "The benchmark contract MUST define one versioned reproducible matrix covering warm touched-file checks and builds, cold or fresh-worktree builds, focused tests, invalid zero-test requests, broad validation, and coordinated duplicate requests. [PRIN-005, PRIN-010]"
      testable: true
      acceptance_criteria: "The maintained benchmark definition lists every scenario, its source-state preparation, warm or cold classification, command intent, sample policy, validity rules, and expected evidence; removing any required scenario makes matrix validation fail."
    - id: "FR-002"
      description: "Every benchmark run MUST identify the baseline or candidate, source revision and dirty-state fingerprint, lockfile, toolchain, host and resource conditions, relevant configuration, timestamp, and benchmark-definition version. [PRIN-010]"
      testable: true
      acceptance_criteria: "A machine-readable receipt contains all identity and environment fields, redacts sensitive values, and rejects comparison between runs whose incompatible conditions are not explicitly disclosed."
    - id: "FR-003"
      description: "Every matrix scenario MUST record total wall time, underlying execution time, queue wait, Cargo-gate wait, peak resident memory, swap activity, cache hit information when applicable, exit status, retry count, and requested, executed, and coalesced action counts. [PRIN-010]"
      testable: true
      acceptance_criteria: "Receipt validation fails when a required metric is absent or internally inconsistent and preserves explicit not-applicable values where a metric cannot apply."
    - id: "FR-004"
      description: "The comparison report MUST retain all valid raw samples and compute p50 and nearest-rank p95 for edit-to-feedback and applicable resource metrics, while separately identifying invalidated and retried samples."
      testable: true
      acceptance_criteria: "Deterministic fixture tests verify percentile calculations, invalid-sample exclusion, retry accounting, and report reproduction from stored samples."
    - id: "FR-005"
      description: "The benchmark process MUST compare the current adaptive Cargo job behavior with explicit job counts of 6 and 8 in isolated one-action scenarios using otherwise equivalent conditions."
      testable: true
      acceptance_criteria: "The final evidence contains complete comparable sample sets for adaptive, 6, and 8 jobs for each eligible scenario and reports timing, memory, swap, exit, and retry differences."
    - id: "FR-006"
      description: "Coordinated duplicate-request scenarios MUST use the existing server-owned self-development coordinator and global Cargo safety gate rather than launching uncontrolled concurrent Cargo processes. [PRIN-002, PRIN-008]"
      testable: true
      acceptance_criteria: "A multi-request benchmark shows the requested, executed, follower, reused, and coalesced counts, with exactly the coordinator-authorized underlying execution count and no bypass of the global gate."
    - id: "FR-007"
      description: "Eligible inner-loop validation MUST select the narrowest demonstrably correct package and target scope and MUST fall back to the established broader scope whenever narrow correctness cannot be proven. [PRIN-002, PRIN-008]"
      testable: true
      acceptance_criteria: "A changed-path matrix verifies narrow selection for known eligible paths and correctness-preserving fallback for unknown, ambiguous, cross-package, generated, build-script, workspace, and release-sensitive paths."
    - id: "FR-008"
      description: "Feature resolution MUST preserve the canonical precedence of explicit per-request feature arguments over inferred path requirements and defaults. [PRIN-003]"
      testable: true
      acceptance_criteria: "Tests cover explicit feature, explicit no-default-feature, explicit all-feature, inferred feature, empty, unset, conflicting, and unsupported combinations and verify one deterministic effective selection or an actionable error."
    - id: "FR-009"
      description: "A focused scope MUST include every optional feature required by the affected source path and MUST NOT report success from compiling a configuration that excludes affected optional-feature code. [PRIN-002, PRIN-005]"
      testable: true
      acceptance_criteria: "Fixtures for each affected optional-feature path fail under an insufficient feature set and pass only when the required feature is selected or the workflow safely broadens to full-feature validation."
    - id: "FR-010"
      description: "Inferred package, target, and feature selection MUST be visible in development receipts, including whether the result came from explicit input, inference, or a conservative fallback. [PRIN-003]"
      testable: true
      acceptance_criteria: "Focused action receipts expose configured and effective non-secret scope values and their resolution source for all precedence and fallback paths."
    - id: "FR-011"
      description: "When available discovery data proves that a package and test-filter combination selects zero tests, the request MUST fail visibly before avoidable broad queue or Cargo-gate waiting. [PRIN-005]"
      testable: true
      acceptance_criteria: "A deterministic invalid-scope test records an actionable zero-test result and proves no Cargo-gate acquisition or underlying test execution occurred."
    - id: "FR-012"
      description: "Zero-test preflight MUST preserve valid exact-name and filter semantics and MUST NOT reject a request when available data cannot prove that its scope is empty. [PRIN-002, PRIN-005]"
      testable: true
      acceptance_criteria: "Positive, ambiguous, stale-discovery, ignored-test, integration-test, library-test, and substring-filter cases preserve established execution semantics, with conservative fallback when preflight certainty is insufficient."
    - id: "FR-013"
      description: "The nextest experiment MUST be bounded to compatible focused-test scenarios and MUST measure availability, discovery and execution compatibility, timing, resource use, disk use, reporting differences, and fallback behavior before adoption. [PRIN-008, PRIN-010]"
      testable: true
      acceptance_criteria: "The experiment has a predefined scenario and time boundary, leaves the established test path available, records all compatibility differences and measurements, and produces an adopt-or-reject decision."
    - id: "FR-014"
      description: "The sccache experiment MUST be bounded to cold or fresh-worktree lanes with incremental compilation disabled and MUST measure cache effectiveness, worktree behavior, disk use, failure behavior, and fallback before adoption. [PRIN-008, PRIN-010]"
      testable: true
      acceptance_criteria: "Cold-lane receipts distinguish cold miss and reusable hit behavior, report cache and disk metrics, verify safe fallback on cache failure, and show that warm incremental development does not enable sccache by default."
    - id: "FR-015"
      description: "An experimental job count, scope rule, test executor, or cache mode MUST be adopted only when the representative matrix demonstrates a repeatable operational win in both p50 and p95 for its intended scenarios without material reliability or resource regressions. [PRIN-008, PRIN-010]"
      testable: true
      acceptance_criteria: "The adoption record cites complete baseline and candidate samples, shows lower p50 and p95 edit-to-feedback for the intended scenarios, no increased failure or retry rate, no unacceptable RSS, swap, or disk impact, and no regression in applicable maintained runtime budgets."
    - id: "FR-016"
      description: "Every evaluated experiment that is not adopted MUST have a durable rejection record containing the tested configuration, evidence, reason, and condition that would justify reconsideration. [PRIN-008]"
      testable: true
      acceptance_criteria: "The final evidence ledger accounts for every tested adaptive, fixed-job, nextest, sccache, and narrowing candidate as adopted or rejected and contains no unexplained trial."
    - id: "FR-017"
      description: "Explicit full-feature check, test, build, and release-validation behavior MUST remain available and unchanged unless the user explicitly selects a different existing mode. [PRIN-002]"
      testable: true
      acceptance_criteria: "Compatibility tests compare pre-change and candidate explicit full-feature and release commands, arguments, selected features, targets, exits, and receipts and find no contract change."
    - id: "FR-018"
      description: "Focused defaults MUST NOT mask failures that appear under full-feature validation, and the delivery workflow MUST run the repository's complete required full-feature release checks. [PRIN-005, PRIN-007]"
      testable: true
      acceptance_criteria: "A missing-feature regression fixture proves focused success cannot satisfy the release gate, and the recorded guardrail run includes all-target and all-feature validation."
    - id: "FR-019"
      description: "The change MUST include focused automated coverage for benchmark parsing and percentiles, scope and feature resolution, zero-test preflight, explicit compatibility, experiment fallback, and receipt correctness. [PRIN-005]"
      testable: true
      acceptance_criteria: "Each behavioral requirement maps to an exact test or deterministic script check, and all focused checks pass before broad validation."
    - id: "FR-020"
      description: "Delivery MUST pass repository guardrails, coordinated self-development build and reload, and built-binary isolated-socket runtime validation while confirming the executing binary identity. [PRIN-007, PRIN-010]"
      testable: true
      acceptance_criteria: "Recorded evidence shows focused checks, scripts/check_guardrails.sh, successful coordinated build and reload, and an isolated-socket smoke run against the newly built resolved executable without disturbing the shared runtime."
    - id: "FR-021"
      description: "The final evidence MUST trace requirements and checks to PRIN-002, PRIN-003, PRIN-005, PRIN-007, PRIN-008, and PRIN-010."
      testable: true
      acceptance_criteria: "A compliance matrix maps every named principle to affected requirements, exact validation commands, results, and any documented non-applicability; no named principle is left untraced."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Adopted changes must improve representative Rust edit-to-feedback latency without increasing maintained client or daemon runtime budgets."
      measurable_target: "Both p50 and p95 improve for each intended adopted scenario, while every applicable runtime metric remains within its existing budget or accepted baseline tolerance."
    - id: "NFR-002"
      category: "reliability"
      description: "Development tuning must not increase failed, retried, or falsely successful validation outcomes."
      measurable_target: "No increase in failure or retry rate across valid benchmark scenarios and zero false-success outcomes in optional-feature and full-feature regression fixtures."
    - id: "NFR-003"
      category: "code_quality"
      description: "Benchmark and validation evidence must be reproducible, reviewable, and attributable."
      measurable_target: "100 percent of accepted benchmark comparisons retain raw samples, percentile method, environment identity, receipt schema version, command intent, and terminal outcome."
    - id: "NFR-004"
      category: "usability"
      description: "Invalid zero-test requests and inferred validation scope must be understandable to developers."
      measurable_target: "100 percent of proven zero-test rejections identify the invalid scope before gate acquisition, and 100 percent of focused receipts state the effective package, target, features, and resolution source."
    - id: "NFR-005"
      category: "reliability"
      description: "Experiments must be bounded, reversible, and safe for existing multi-session development workflows."
      measurable_target: "Every experiment has a recorded boundary, fallback, resource evidence, and adopt-or-reject result, with zero uncontrolled duplicate Cargo executions and zero shared-daemon disruption."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Maintainers can reproduce a complete baseline and candidate comparison for all representative development workflows."
      metric: "Required benchmark scenarios with valid, reviewable baseline and candidate receipts"
      target: "100 percent of warm, cold, focused, invalid, broad, and coordinated-duplicate scenarios"
    - id: "SC-002"
      description: "Developers receive faster feedback from every tuning choice that becomes a default."
      metric: "Before-and-after edit-to-feedback distributions for each adopted scenario"
      target: "Candidate p50 and p95 are both lower than baseline, with no higher failure or retry rate"
    - id: "SC-003"
      description: "Invalid empty test scopes avoid unnecessary waiting while valid focused tests remain compatible."
      metric: "Proven zero-test requests rejected before gate acquisition and valid compatibility cases preserved"
      target: "100 percent early rejection for provably empty scopes and 100 percent pass rate for the valid compatibility matrix"
    - id: "SC-004"
      description: "Focused validation remains trustworthy across package, target, and optional-feature boundaries."
      metric: "Scope-resolution and missing-feature regression cases with correct outcomes"
      target: "100 percent correct narrow-or-fallback decisions and zero optional-feature false successes"
    - id: "SC-005"
      description: "Runtime users experience no degradation from developer-feedback tuning."
      metric: "Applicable maintained client and daemon runtime budget checks"
      target: "All checks remain within their existing budgets and baseline tolerances"
    - id: "SC-006"
      description: "Reviewers can understand why each evaluated option was adopted or rejected."
      metric: "Evaluated options represented in the final decision ledger with evidence and rationale"
      target: "100 percent of job-count, scope, nextest, and sccache trials accounted for"

key_entities:
  - name: "Benchmark Matrix"
    description: "The versioned definition of representative development scenarios and their controlled measurement conditions."
    attributes:
      - "scenario identifier and warm or cold classification"
      - "source-state and environment preparation"
      - "sample and validity policy"
      - "required metrics and acceptance gate"
  - name: "Benchmark Receipt"
    description: "A machine-readable and reviewable record of one benchmark run or scenario result."
    attributes:
      - "baseline or candidate identity"
      - "raw samples and p50/p95 aggregates"
      - "queue, gate, execution, and wall timing"
      - "resource, cache, action-count, exit, and retry evidence"
  - name: "Validation Scope"
    description: "The effective package, target, and feature selection used for one development request."
    attributes:
      - "explicit inputs"
      - "inferred requirements"
      - "effective selection and resolution source"
      - "fallback or rejection reason"
  - name: "Experiment Decision"
    description: "The durable conclusion for an evaluated tuning option."
    attributes:
      - "tested configuration and bounded lane"
      - "supporting benchmark receipts"
      - "adopted or rejected status and rationale"
      - "fallback and reconsideration condition"

edge_cases:
  - scenario: "The benchmark host experiences unrelated load, swap pressure, thermal throttling, or another Cargo process during sampling."
    expected_behavior: "Affected samples are marked invalid with the observed reason and are not silently included in an adoption decision."
  - scenario: "A changed path maps to multiple packages, targets, generated outputs, build scripts, or optional features."
    expected_behavior: "Validation broadens to the smallest correctness-preserving scope or the established broad default when no safe narrow scope is provable."
  - scenario: "Explicit feature arguments conflict with inferred requirements or disable defaults needed by an affected path."
    expected_behavior: "Explicit precedence is preserved, but the request fails actionably when it cannot validate the affected code rather than claiming success."
  - scenario: "Test discovery information is missing, stale, ambiguous, or differs across targets."
    expected_behavior: "Preflight does not issue a false zero-test rejection and falls back to established execution semantics with visible provenance."
  - scenario: "A coordinated duplicate benchmark has followers that cancel, arrive late, or reuse a completed result."
    expected_behavior: "Receipts truthfully separate requested, executed, coalesced, reused, and cancelled actions without launching uncontrolled duplicate work."
  - scenario: "nextest or sccache is not installed or fails during a bounded experiment."
    expected_behavior: "The experiment records unavailability or failure, uses the established safe fallback, and does not change defaults."
  - scenario: "A candidate improves median feedback but worsens p95, memory, swap, reliability, disk use, or runtime budgets."
    expected_behavior: "The candidate is not adopted under this contract and the rejection reason is recorded."
  - scenario: "Focused development validation passes while full-feature validation exposes a missing-feature failure."
    expected_behavior: "Delivery fails at the full-feature gate and focused success is not treated as release evidence."

assumptions:
  - "The completed runtime-performance budget and self-development deduplication work from jcode-l89.1 and jcode-l89.2 are the authoritative prerequisites and are available for reuse."
  - "The approved jcode-l89.4 Bead and its frozen acceptance matrix define the intended scope and require no additional product clarification."
  - "Adaptive Cargo jobs means the current repository default in effect at benchmark time, which is recorded rather than redefined by this specification."
  - "Benchmark sampling uses repeated same-machine baseline and candidate runs under equivalent controlled conditions; invalid environmental samples are rerun and retained as invalid evidence."
  - "An improvement must lower both p50 and p95 for the scenarios where it is intended to apply; no fixed percentage threshold is assumed beyond existing runtime budget tolerances."
  - "Package, target, and feature narrowing applies only to eligible inner-loop development requests, not explicit broad, full-feature, guardrail, or release-validation requests."
  - "No live, paid-provider, production-adjacent, or externally costly validation is required."

constraints:
  - "Runtime budgets remain unchanged and dominate developer-feedback optimization decisions."
  - "The existing single-server multi-client coordinator and global Cargo safety gate remain the canonical concurrency path."
  - "Cargo-heavy benchmark and validation work is serialized except for coordinator-owned duplicate-request scenarios."
  - "Warm incremental builds do not enable sccache by default; sccache evaluation is limited to non-incremental cold or fresh-worktree lanes."
  - "Full-feature release validation remains complete, explicit, and available."
  - "Changes and evidence must remain surgical and trace PRIN-002, PRIN-003, PRIN-005, PRIN-007, PRIN-008, and PRIN-010."

out_of_scope:
  - "Changing linkers without new separately approved evidence."
  - "Re-evaluating or adopting Cranelift after the existing slower result."
  - "Speculative crate splitting or broad workspace architecture changes."
  - "Disabling or weakening the global Cargo safety gate."
  - "Replacing Cargo or introducing uncontrolled parallel broad validation."
  - "Changing client or daemon runtime performance budgets."
  - "Weakening, skipping, or replacing full-feature release validation."
  - "Optimizing unrelated runtime, provider, protocol, or user-interface paths."

