    - name: "Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "Explicit Cargo commands, broad/full-feature/release validation, arbitrary selfdev test behavior, persisted legacy requests, and fallback execution remain unchanged when inference or discovery cannot prove a safe optimization."
    - name: "Explicit Configuration Precedence"
      status: "PASS"
      notes: "Explicit per-request Cargo package, target, all-features, features, and no-default-features arguments win over inferred scope and existing profile defaults; configured and effective values are recorded."
    - name: "Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "Runtime coordination and preflight remain in jcode-app-core, source identity reuses jcode-build-support, and script-side policy remains in scripts/dev_cargo.sh without a new crate or reverse dependency."
    - name: "Focused Behavioral Tests"
      status: "PASS"
      notes: "Every changed behavior maps to deterministic benchmark, scope, feature-precedence, optional-feature, zero-test, fallback, receipt, and compatibility tests before broad validation."
    - name: "Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "Invalid matrix/receipt data, incompatible comparisons, unsupported explicit feature combinations, and provably empty tests fail actionably; secrets and raw source content are excluded from receipts."
    - name: "Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "The delivery sequence includes focused Python/shell/Rust checks, relevant builds, scripts/check_guardrails.sh with all-target/all-feature validation, and recorded pre-existing failure isolation if needed."
    - name: "Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The plan strengthens Ariel's existing selfdev coordinator and dev_cargo path; nextest and sccache are explicitly bounded, reversible experiments rather than parallel permanent systems."
    - name: "Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "The plan carries every experiment through measured adoption or durable rejection while avoiding live, paid, destructive, or shared-daemon-disrupting validation."
    - name: "Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "Adoption requires raw p50/p95 and resource evidence, maintained runtime-budget checks, coordinated execution counts, and validation against the resolved newly built binary on an isolated socket."

research_findings:
  decisions:
    - topic: "Benchmark ownership and artifact format"
      decision: "Add one Python standard-library coordinator plus a versioned JSON matrix and JSON receipt/report schema; render the human review ledger from the same retained samples."
      rationale: "Existing benchmark scripts already use repository-local Python/Bash, while JSON gives deterministic validation and reproduction without adding a Rust crate or YAML parser dependency."
      alternatives_considered:
        - "Extend the legacy human-only scripts/bench_selfdev_build.sh output"
        - "Add a third-party benchmark framework or database"
        - "Implement benchmark orchestration inside the runtime server"
    - topic: "Measurement and comparison method"
      decision: "Record all raw samples, classify invalid and retried samples separately, and calculate p50 plus nearest-rank p95 only over valid comparable samples."
      rationale: "This directly implements the frozen evidence contract and prevents noisy or incomplete runs from becoming adoption evidence."
      alternatives_considered:
        - "Compare one-off wall-clock timings"
        - "Use arithmetic means only"
        - "Discard invalid samples without retaining reasons"
    - topic: "Cargo job experiment"
      decision: "Treat the current adaptive policy as the baseline behavior and use existing JCODE_BUILD_JOBS overrides for equivalent 6-job and 8-job candidate lanes."
      rationale: "scripts/dev_cargo.sh already gives explicit overrides precedence and records effective job policy, so the experiment does not need a second job resolver or gate bypass."
      alternatives_considered:
        - "Hard-code a new default before measuring"
        - "Run job-count candidates concurrently"
        - "Change the global Cargo gate"
    - topic: "Focused package and target resolution"
      decision: "Use Cargo metadata plus a conservative repository-owned path rule table to infer only demonstrably sufficient package/target scopes; ambiguous and release-sensitive paths return the established broad command."
      rationale: "Cargo metadata is authoritative for workspace ownership, while an explicit allowlist/fallback table is reviewable and safer than guessing from directory names."
      alternatives_considered:
        - "Always run the root package"
        - "Infer solely from path prefixes"
        - "Narrow every dirty worktree automatically"
    - topic: "Feature precedence and optional-feature safety"
      decision: "Centralize effective feature resolution in the dev_cargo path: explicit Cargo arguments first, then proven path-required features, then existing JCODE_DEV_FEATURE_PROFILE/defaults; reject conflicts that cannot compile affected code and otherwise broaden."
      rationale: "dev_cargo already owns explicit feature detection and profile expansion, so extending that canonical resolver preserves PRIN-003 and avoids split behavior between direct Cargo and selfdev requests."
      alternatives_considered:
        - "Let inferred features overwrite explicit arguments"
        - "Use minimal features for every focused command"
        - "Maintain separate selfdev and shell feature resolvers"
    - topic: "Zero-test preflight"
      decision: "Persist bounded discovery snapshots keyed by source state and effective package/target/features, and reject only when a current snapshot proves the Cargo-compatible filter selects zero tests."
      rationale: "A pre-Cargo cache can avoid queue and gate waiting, while strict source/scope keys and conservative fallback prevent stale or incomplete discovery from rejecting valid tests."
      alternatives_considered:
        - "Run cargo test --list before every request"
        - "Parse Rust source and assume macros generate no tests"
        - "Reject every prior zero-test exit heuristically"
    - topic: "nextest experiment"
      decision: "Evaluate nextest only through the benchmark coordinator in a predefined focused-test lane with availability, discovery, reporting, filter, resource, disk, and fallback checks."
      rationale: "nextest may improve execution but has compatibility and operational differences; keeping it opt-in until the complete adoption gate passes preserves established Cargo behavior."
      alternatives_considered:
        - "Replace cargo test globally"
        - "Add nextest as a required dependency immediately"
        - "Benchmark broad stateful tests first"
    - topic: "sccache experiment"
      decision: "Use existing JCODE_SCCACHE and CARGO_INCREMENTAL controls only in isolated cold/fresh-worktree, non-incremental miss/hit lanes and record cache/disk/failure evidence."
      rationale: "dev_cargo already intentionally skips sccache for incremental profiles; this tests the only lane where reusable hits are plausible without slowing the warm inner loop."
      alternatives_considered:
        - "Enable sccache for warm incremental selfdev builds"
        - "Change release/profile defaults before evidence"
        - "Ignore disk growth and cache failure fallback"
    - topic: "Runtime and release validation"
      decision: "Keep scripts/check_guardrails.sh and the maintained runtime-performance benchmark as independent gates, then test the resolved target/selfdev binary through a unique socket before coordinated build/reload evidence."
      rationale: "Focused development speed cannot replace all-feature release correctness or prove behavior of the actual daemon binary."
      alternatives_considered:
        - "Treat cargo build as runtime evidence"
        - "Test through the existing shared daemon"
        - "Lower runtime budgets to accommodate a tuning regression"

data_model:
  entities:
    - name: "BenchmarkMatrix"
      description: "Versioned definition of required Rust development scenarios and controlled experiment variants."
      fields:
        - name: "schema_version"
          type: "string"
          description: "Matrix contract version used to validate and compare receipts."
          constraints: "Required, non-empty, and identical for direct comparisons unless incompatibility is explicitly disclosed."
        - name: "scenarios"
          type: "list of BenchmarkScenario"
          description: "Warm, cold, focused, invalid, broad, and coordinated-duplicate cases."
          constraints: "Every required scenario class appears with preparation, command intent, sample policy, validity rules, and evidence requirements."
        - name: "experiment_variants"
          type: "list"
          description: "Adaptive, 6-job, 8-job, nextest, sccache miss, and sccache hit configurations."
          constraints: "Each variant declares eligibility, boundary, fallback, and resource metrics."
      relationships:
        - target: "BenchmarkReceipt"
          type: "one-to-many"
          description: "Each matrix execution produces receipts tied to this exact version."
    - name: "BenchmarkReceipt"
      description: "Machine-readable provenance, raw measurements, outcomes, and aggregates for one run."
      fields:
        - name: "run_identity"
          type: "object"
          description: "Baseline/candidate label, source revision, dirty fingerprint, lockfile, toolchain, host conditions, configuration, timestamp, and matrix version."
          constraints: "Required, redacted, and comparison-compatible or explicitly marked incompatible."
        - name: "samples"
          type: "list of ScenarioSample"
          description: "Raw valid, invalid, and retried observations."
          constraints: "Retained without silent deletion and includes validity/retry reason."
        - name: "aggregates"
          type: "object"
          description: "p50 and nearest-rank p95 timing/resource values derived from valid samples."
          constraints: "Reproducible from retained samples and omitted when sample validity is insufficient."
        - name: "action_counts"
          type: "object"
          description: "Requested, executed, follower, coalesced, reused, and cancelled counts."
          constraints: "Internally consistent and tied to coordinator/gate evidence."
      relationships:
        - target: "ExperimentDecision"
          type: "many-to-many"
          description: "One decision may cite multiple baseline and candidate receipts."
    - name: "ValidationScope"
      description: "Configured, inferred, and effective Cargo package, target, and feature selection for one eligible request."
      fields:
        - name: "explicit_inputs"
          type: "object"
          description: "User-provided package, target, feature, no-default-feature, and all-feature arguments."
          constraints: "Preserved exactly and receives highest precedence."
        - name: "affected_paths"
          type: "list of redacted repository-relative paths"
          description: "Paths considered for safe scope inference."
          constraints: "No file contents; ambiguous or release-sensitive paths force fallback."
        - name: "effective_scope"
          type: "object"
          description: "Resolved package, target, features, and broad/focused mode."
          constraints: "Must compile every affected optional-feature path or fail/broaden actionably."
        - name: "resolution_source"
          type: "explicit | inferred | default | conservative_fallback"
          description: "Provenance shown in receipts."
          constraints: "Always present for eligible resolution."
      relationships:
        - target: "TestDiscoverySnapshot"
          type: "many-to-one"
          description: "A test request may consult a snapshot with exactly matching source and effective scope."
    - name: "TestDiscoverySnapshot"
      description: "Bounded list of discovered Cargo-compatible test names for one current source and effective scope."
      fields:
        - name: "source_fingerprint"
          type: "string"
          description: "Existing redacted SourceState identity."
          constraints: "Must exactly match the submitted request or the snapshot is unusable."
        - name: "scope_key"
          type: "string"
          description: "Versioned package, target, feature, harness, and discovery identity."
          constraints: "Exact match required; unknown targets or features are ambiguous."
        - name: "test_names"
          type: "list of strings"
          description: "Names emitted by successful compatible discovery."
          constraints: "Bounded and used with existing Cargo substring/exact filtering semantics."
        - name: "complete"
          type: "boolean"
          description: "Whether discovery can prove emptiness for this scope."
          constraints: "Only true snapshots may cause early rejection."
      relationships:
        - target: "ValidationScope"
          type: "one-to-many"
          description: "One exact snapshot may serve equivalent requests until source state changes."
    - name: "ExperimentDecision"
      description: "Durable adopt-or-reject conclusion for each evaluated tuning option."
      fields:
        - name: "candidate"
          type: "string"
          description: "Job count, scope rule, nextest mode, or sccache mode evaluated."
          constraints: "Every evaluated configuration appears exactly once in the final ledger."
        - name: "status"
          type: "adopted | rejected"
          description: "Final bounded conclusion."
          constraints: "Adoption requires lower p50 and p95 plus all reliability/resource/runtime gates."
        - name: "evidence"
          type: "list of receipt references"
          description: "Baseline/candidate samples and compatibility/resource results."
          constraints: "Complete and reviewable."
        - name: "reconsideration_condition"
          type: "string"
          description: "Evidence change that could justify reopening a rejected option."
          constraints: "Required for rejection."
      relationships:
        - target: "BenchmarkReceipt"
          type: "many-to-many"
          description: "The decision cites all relevant evidence."

api_contracts:
  endpoints: []
  commands:
    - name: "scripts/bench_rust_feedback.py"
      description: "Validate the matrix, execute or summarize bounded benchmark lanes, and emit JSON receipts/comparison reports."
      inputs: "Explicit matrix path, baseline/candidate label, executable/repository identity, scenario or lane, sample count, output path, and bounded experiment options."
      outputs: "Versioned JSON receipt and deterministic human-readable summary containing raw-sample references, p50/p95, resources, action counts, validity, and adoptability."
      exit_codes: "Zero only for a complete valid requested operation; nonzero for invalid matrix/receipt, incomplete samples, incompatible comparison, subprocess failure, timeout, or failed adoption gate."
    - name: "scripts/dev_cargo.sh"
      description: "Existing Cargo wrapper with additive conservative scope resolution and visible effective-scope receipt fields."
      inputs: "Existing Cargo argv and environment; explicit package/target/feature/job arguments retain precedence."
      outputs: "Unchanged Cargo output plus non-secret configured/effective package, target, feature, job, cache, and resolution-source metadata in rust-actions receipts."
      exit_codes: "Preserve Cargo and existing validation exit behavior; unsupported/conflicting inferred scope fails actionably or broadens before launch."
    - name: "selfdev test"
      description: "Existing server-owned queued test action with a conservative zero-test preflight before duplicate claim and queue/gate waiting."
      inputs: "Unchanged command, reason, notify, and wake fields."
      outputs: "Existing queued/follower output, or an actionable early zero-test result with effective scope and proof provenance."
      exit_codes: "Existing tool contract; no early rejection when discovery is absent, stale, incomplete, or ambiguous."
    - name: "scripts/check_guardrails.sh"
      description: "Unchanged full repository delivery gate including all-target and all-feature validation."
      inputs: "Existing options and stable Rust toolchain."
      outputs: "Existing gate-by-gate validation results."
      exit_codes: "Unchanged; any changed-surface failure blocks delivery."

