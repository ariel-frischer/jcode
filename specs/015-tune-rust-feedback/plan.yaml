plan:
  branch: "agent/jcode-l89.4-feedback-tuning"
  created: "2026-08-22"
  spec_path: "specs/015-tune-rust-feedback/spec.yaml"

summary: |
  Extend the existing Rust development path rather than creating a second build
  system. Add one versioned Python benchmark coordinator and matrix definition that
  drive scripts/dev_cargo.sh and the server-owned selfdev coordinator, retain raw
  machine-readable samples, validate environment comparability, and compute
  deterministic nearest-rank p50/p95 reports. The benchmark lanes explicitly compare
  the current adaptive Cargo job policy with 6 and 8 jobs and bound nextest and
  non-incremental sccache trials. Every candidate receives an adopt-or-reject ledger
  entry, and no default changes unless both p50 and p95 improve without reliability,
  resource, or maintained runtime-budget regressions.

  Keep scripts/dev_cargo.sh as the canonical Cargo policy and global-gate entry point.
  Add a small deterministic scope resolver for eligible focused requests, with explicit
  Cargo package, target, and feature arguments always taking precedence over inferred
  values. Unknown, ambiguous, generated, build-script, cross-package, optional-feature,
  broad, guardrail, and release-sensitive changes conservatively retain the established
  broader command. Add a source-state-keyed test-discovery snapshot that can reject only
  provably empty package/filter combinations before selfdev queue and Cargo-gate wait;
  missing, stale, or ambiguous discovery preserves existing Cargo semantics. Validate
  with focused Python, shell, and Rust tests, full-feature guardrails, coordinated
  build/reload, maintained runtime budgets, and a newly built isolated-socket smoke.

technical_context:
  language: "Rust 2024, Python 3.11+, and Bash"
  framework: "Tokio and Serde in jcode-app-core, Python standard library benchmark tooling, and repository-local Cargo shell policy"
  primary_dependencies:
    - name: "jcode-app-core selfdev coordinator"
      version: "workspace"
      purpose: "Canonical server-owned request queue, duplicate coalescing, source-state validation, early preflight seam, and multi-session execution ownership."
    - name: "jcode-build-support SourceState"
      version: "workspace"
      purpose: "Existing redacted revision, dirty-state, repository, and worktree identity for benchmark provenance and stale-discovery rejection."
    - name: "scripts/dev_cargo.sh"
      version: "repository-local"
      purpose: "Canonical feature precedence, adaptive or explicit job selection, sccache policy, global Cargo gate, and rust-actions timing receipt surface."
    - name: "Python standard library"
      version: ">=3.11"
      purpose: "Provide argparse, dataclasses, JSON, subprocess control, resource sampling, hashing, percentile aggregation, fixture validation, and unittest without a new benchmark dependency."
    - name: "Cargo metadata"
      version: "current stable toolchain"
      purpose: "Resolve workspace package and target ownership while preserving Cargo's authoritative manifest and feature definitions."
  storage: "Versioned benchmark matrix and committed decision/validation evidence under specs/015-tune-rust-feedback; caller-selected JSON receipts and source-state-keyed discovery snapshots under isolated benchmark state or JCODE_HOME, with no raw source content or secrets."
  testing:
    framework: "Python unittest, shell contract tests, Rust test harness with Tokio tests, repository guardrails, and isolated built-binary validation"
    approach: "TDD from deterministic fixtures: benchmark schema/percentiles first, scope and feature resolution second, zero-test preflight and selfdev queue bypass third, then bounded benchmark lanes, full-feature guardrails, runtime budgets, build/reload, and isolated-socket smoke. Serialize all Cargo-heavy checks except coordinator-owned duplicate scenarios."
  target_platform: "Linux canonical for /proc resource sampling, RSS, swap, sockets, and controlled benchmark evidence; existing macOS and Windows Cargo behavior remains compatible and unsupported metrics are explicit."
  project_type: "cli"
  performance_goals: "Adopt only candidates whose representative intended scenarios improve both edit-to-feedback p50 and nearest-rank p95, with no higher failure/retry rate, no unacceptable RSS/swap/disk growth, no uncontrolled duplicate Cargo execution, and no maintained client or daemon runtime-budget regression."
  constraints:
    - "Keep the existing single-server, multi-client selfdev coordinator and global Cargo safety gate as the only concurrency authority."
    - "Keep scripts/dev_cargo.sh as the canonical Cargo policy and preserve explicit JCODE_BUILD_JOBS/CARGO_BUILD_JOBS and explicit Cargo feature argument precedence."
    - "Narrow only eligible inner-loop requests when package, target, and required optional features are demonstrably sufficient; otherwise preserve the established broad scope."
    - "Never narrow explicit broad, all-feature, guardrail, release, generated, build-script, workspace-wide, or ambiguous requests."
    - "Reject a zero-test request before queue/gate acquisition only from current source-state-keyed discovery evidence that proves the effective package/target/filter is empty."
    - "Preserve exact Cargo test substring, exact-name, ignored, library, integration, and harness argument semantics whenever emptiness is not provable."
    - "Compare adaptive jobs against explicit 6 and 8 only in equivalent isolated one-action scenarios."
    - "Bound nextest to compatible focused-test scenarios and keep Cargo test as the fallback and default until adoption evidence passes."
    - "Bound sccache to cold or fresh-worktree non-incremental lanes; never enable it by default for warm incremental development."
    - "Retain every valid raw sample plus invalid/retried evidence and disclose incompatible environment conditions."
    - "Do not change linker policy, revisit Cranelift, split crates speculatively, weaken guardrails, or change runtime budgets."
    - "Run Cargo-heavy benchmark and validation commands serially except for explicitly coordinated duplicate-request scenarios."
  scale_scope: "One local Jcode workspace and controlled host, six required scenario classes, three job policies, two bounded optional experiments, repeated baseline/candidate samples, and one long-lived server coordinating multiple local clients."

