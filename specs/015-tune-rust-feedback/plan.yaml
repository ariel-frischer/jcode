implementation_phases:
  - phase: 1
    name: "Freeze benchmark and evidence contracts"
    goal: "Create a deterministic, versioned matrix and receipt/report validator before measuring or changing defaults."
    deliverables:
      - "Required warm, cold, focused, invalid, broad, and coordinated-duplicate scenario definitions."
      - "Environment/source/toolchain provenance and metric schema with explicit not-applicable values."
      - "Raw sample, invalidation, retry, nearest-rank p50/p95, comparability, and action-count fixture tests."
      - "Baseline collection procedure and incomplete-run failure behavior."
  - phase: 2
    name: "Resolve focused validation scope safely"
    goal: "Add one canonical narrow-or-fallback package, target, and feature resolver without changing explicit broad or feature contracts."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Cargo-metadata-backed package/target ownership and conservative path rules."
      - "Explicit, inferred, default, and fallback feature precedence matrix."
      - "Optional-feature regression fixtures and visible effective-scope receipts."
      - "Direct dev_cargo and selfdev-compatible integration with broad fallback."
  - phase: 3
    name: "Reject provably empty tests before waiting"
    goal: "Use current complete discovery evidence to fail zero-test requests before selfdev queue and Cargo-gate acquisition while preserving all uncertain cases."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Versioned source/scope-keyed discovery snapshot contract."
      - "Pre-claim selfdev preflight and actionable zero-test output."
      - "Positive, exact, substring, ignored, library, integration, stale, missing, and ambiguous compatibility tests."
      - "Proof that early rejection creates no producer and acquires no Cargo gate."
  - phase: 4
    name: "Run bounded tuning experiments"
    goal: "Compare candidates under the frozen matrix and adopt only repeatable operational wins."
    dependencies:
      - "Phase 1"
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "Equivalent adaptive, 6-job, and 8-job sample sets with timing, RSS, swap, exit, retry, and action-count evidence."
      - "Coordinator-owned duplicate-request receipts with no uncontrolled Cargo execution."
      - "Bounded nextest focused-test compatibility/resource/disk/fallback evidence."
      - "Bounded non-incremental cold/fresh-worktree sccache miss/hit/resource/disk/failure evidence."
      - "Complete adopted/rejected decision ledger, including reconsideration conditions."
  - phase: 5
    name: "Prove compatibility and runtime truth"
    goal: "Close every acceptance and constitution gate using focused tests, full-feature validation, maintained runtime budgets, and the actual candidate binary."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Focused Python, shell, and Rust test receipts mapped to FR-001 through FR-021."
      - "Unchanged explicit full-feature check/test/build/release behavior and scripts/check_guardrails.sh result."
      - "Maintained client and daemon runtime-budget comparison with no accepted regression."
      - "Coordinated selfdev build/reload result and resolved-executable isolated-socket smoke."
      - "Final PRIN-002/003/005/007/008/010 compliance matrix and benchmark receipt index."

