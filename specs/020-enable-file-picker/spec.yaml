feature:
  branch: "020-enable-file-picker"
  created: "2026-08-26"
  status: "Draft"
  input: "Enable the @ file mention fuzzy picker by default while preserving explicit opt-out, asynchronous generation-cancelled 32-entry batches, bounded visible suggestions, large-repository responsiveness, safe provider expansion, and existing PR2 separation"

user_stories:
  - id: "US-001"
    title: "Use file mentions without setup"
    priority: "P1"
    as_a: "Jcode TUI user"
    i_want: "the @ file mention fuzzy picker to be available by default while retaining an explicit way to disable it"
    so_that: "I can discover and insert repository files immediately without losing control over filesystem-backed suggestions"
    why_this_priority: "Default availability is the requested user-facing change, and explicit opt-out protects users who prefer literal @ input."
    independent_test: "Start isolated sessions with the setting absent, explicitly enabled, and explicitly disabled, then type an active @ mention and compare picker behavior."
    acceptance_scenarios:
      - given: "The file mention setting is absent"
        when: "The user types an active @ mention in the TUI composer"
        then: "The fuzzy picker opens and offers matching files by default."
      - given: "The file mention setting is explicitly disabled"
        when: "The user types an active @ mention"
        then: "The picker does not open, no file discovery begins, and the text remains available to the ordinary input flow."
      - given: "The file mention setting is explicitly enabled"
        when: "The user types an active @ mention"
        then: "The behavior matches the default-enabled picker behavior."

  - id: "US-002"
    title: "Search large repositories responsively"
    priority: "P1"
    as_a: "Jcode TUI user working in a large repository"
    i_want: "file matches to arrive incrementally while typing, navigating, or cancelling"
    so_that: "the composer remains responsive without waiting for complete repository discovery"
    why_this_priority: "Default enablement must not turn ordinary input into a blocking large-repository operation."
    independent_test: "Use deterministic repositories of increasing size, interact with the composer during active discovery, and verify first-result timing, event latency, batch bounds, and stale-result rejection."
    acceptance_scenarios:
      - given: "A repository contains more matching entries than one discovery batch"
        when: "The user opens the picker"
        then: "Matching entries arrive asynchronously in batches of no more than 32 without requiring complete repository enumeration."
      - given: "Discovery is active for one query"
        when: "The user changes the query or closes the picker"
        then: "The superseded generation is cancelled and its later results never alter the active suggestions or input."
      - given: "More matches have been discovered than can be shown at once"
        when: "The picker renders suggestions"
        then: "Only a bounded visible set is displayed while navigation and continued discovery remain responsive."

  - id: "US-003"
    title: "Expand selected files safely"
    priority: "P1"
    as_a: "Jcode user submitting a file mention to a provider"
    i_want: "selected file mentions to expand only when they refer to safe readable files within the active repository boundary"
    so_that: "useful file context reaches the provider without exposing unintended local files or corrupting editable input"
    why_this_priority: "Making the picker default-on must not weaken the established provider-expansion safety boundary."
    independent_test: "Submit valid and unsafe mentions, including traversal, absolute outside-root, symlink escape, missing, unreadable, binary, oversized, and structurally adversarial cases, then inspect user-visible text and provider-bound content."
    acceptance_scenarios:
      - given: "A selected mention resolves to an allowed readable file inside the active repository boundary"
        when: "The user submits the message"
        then: "The provider receives safely delimited file context while the composer, queue, and visible history retain the compact mention."
      - given: "A mention is unsafe, unavailable, unsupported, or would exceed the submission limit"
        when: "Expansion is attempted"
        then: "No unintended file content is disclosed, and the original editable or queued state is preserved or restored."

  - id: "US-004"
    title: "Preserve feature separation"
    priority: "P2"
    as_a: "Jcode maintainer"
    i_want: "the default-enable change to remain separate from PR2 inline preview work"
    so_that: "the picker behavior can be reviewed and released without coupling it to a distinct preview feature"
    why_this_priority: "The existing ownership and review boundary must remain intact, although it does not change the core picker interaction."
    independent_test: "Review the changed behavior and files and verify that no inline preview rendering, state, dependencies, fixtures, link handling, or sibling-repository preview behavior is introduced."
    acceptance_scenarios:
      - given: "The default-enabled picker change is reviewed"
        when: "Its scope and resulting behavior are compared with the established PR2 boundary"
        then: "No PR2 inline preview capability or implementation surface is included."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST treat an absent file mention configuration as enabled for the TUI @ file mention fuzzy picker."
      acceptance_criteria: "An isolated session with no explicit file mention setting opens the fuzzy picker for an active @ mention."
    - id: "FR-002"
      description: "MUST preserve explicit opt-out so that a disabled setting prevents picker activation and filesystem discovery while leaving typed @ text in the normal input flow."
      acceptance_criteria: "An isolated disabled session shows no picker and starts no discovery for active @ input, while the typed text remains unchanged except for user edits."
    - id: "FR-003"
      description: "MUST preserve explicit opt-in compatibility so an enabled setting behaves the same as the new default."
      acceptance_criteria: "Equivalent interactions in absent-setting and explicitly enabled sessions produce the same picker availability and selection behavior."
    - id: "FR-004"
      description: "MUST perform file discovery asynchronously and publish matching candidates in batches containing no more than 32 entries."
      acceptance_criteria: "Deterministic fixtures larger than 32 matches produce multiple observable batches, every non-final and final batch contains at most 32 entries, and input is handled before full discovery completes."
    - id: "FR-005"
      description: "MUST associate discovery results with their originating query generation and cancel or supersede discovery when the query changes, the picker closes, or the feature becomes disabled."
      acceptance_criteria: "Sequencing tests change or close an active query and verify that zero results from superseded generations reach the current visible suggestions or mutate input."
    - id: "FR-006"
      description: "MUST keep the number of simultaneously visible suggestions bounded independently of the total number of discovered matches."
      acceptance_criteria: "A fixture with substantially more matches than the display capacity never renders more than the defined visible capacity at once and still permits selection from the active bounded result set."
    - id: "FR-007"
      description: "MUST preserve responsive typing, navigation, cancellation, and submission while discovery is active in large repositories."
      acceptance_criteria: "Representative large-repository tests process user interactions within the stated latency target without waiting for complete repository enumeration."
    - id: "FR-008"
      description: "MUST preserve established exclusion behavior, including built-in generated and dependency exclusions plus additive valid user or profile exclusions, without failing discovery because one configured exclusion is invalid."
      acceptance_criteria: "Ignored content does not appear, valid custom exclusions remain additive, and an invalid custom exclusion is skipped without exposing excluded built-in content or terminating the session."
    - id: "FR-009"
      description: "MUST expand file mentions for provider submission only after resolving them within the authoritative active repository boundary and confirming that the target is an allowed readable file."
      acceptance_criteria: "Valid in-bound files expand, while traversal, absolute outside-root paths, symlink escapes, missing files, unreadable files, binary files, and oversized files disclose no file content and remain safely represented."
    - id: "FR-010"
      description: "MUST preserve safe delimiting and escaping of provider-bound file context and MUST keep expanded file contents out of the composer, queue, and user-visible persisted history."
      acceptance_criteria: "Adversarial paths and file text cannot break the provider context boundary, and direct, queued, resumed, and rewound user-visible states retain compact @ mentions rather than expanded contents."
    - id: "FR-011"
      description: "MUST preserve submission-size enforcement and restore the original editable or queued state when expansion cannot be submitted safely."
      acceptance_criteria: "An expansion that exceeds the accepted submission size sends no oversized payload and restores the original mention, surrounding text, attachments, and queue state without loss."
    - id: "FR-012"
      description: "MUST preserve existing mention replacement behavior so selecting a suggestion replaces only the active mention span and leaves surrounding input unchanged."
      acceptance_criteria: "Selections at the beginning, middle, and end of representative inputs preserve all non-mention text byte for byte."
    - id: "FR-013"
      description: "MUST keep PR2 inline preview behavior separate from this feature."
      acceptance_criteria: "Scope review finds no new inline preview rendering, preview state, preview dependencies, preview fixtures, link hit-testing changes, or sibling-repository preview behavior."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "The picker must provide useful initial results promptly across representative small, medium, and large repositories."
      measurable_target: "At least 95% of runs make the first non-empty batch available within 100 ms when a match exists among early discoverable entries."
    - id: "NFR-002"
      category: "performance"
      description: "Composer interactions must remain responsive during active discovery."
      measurable_target: "At least 95% of synthetic typing, navigation, cancellation, and submission events are handled within 50 ms, and no event waits for complete repository enumeration."
    - id: "NFR-003"
      category: "reliability"
      description: "Cancelled or superseded discovery must not leak stale results into current state."
      measurable_target: "Across 100 repeated query-change and close scenarios, zero stale-generation results alter visible suggestions, selection, or input."
    - id: "NFR-004"
      category: "security"
      description: "Default enablement must not broaden which local files can be disclosed to a provider."
      measurable_target: "All unsafe-path and unsupported-file cases disclose zero file bytes outside the established allowed repository and file constraints."
    - id: "NFR-005"
      category: "code_quality"
      description: "The feature must remain narrowly scoped to picker default behavior and preservation of its established contracts."
      measurable_target: "Every changed behavior maps to this specification, with zero PR2 inline preview capabilities or unrelated redesigns introduced."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can invoke the @ file mention fuzzy picker without first changing configuration, while users who opt out retain literal @ input behavior."
      metric: "Default, explicit-enable, and explicit-disable acceptance scenarios"
      target: "100% of scenarios pass"
    - id: "SC-002"
      description: "Users receive incremental file suggestions without losing responsiveness in large repositories."
      metric: "First-result timing and interaction latency during discovery across repository-size fixtures"
      target: "At least 95% of first eligible batches arrive within 100 ms and at least 95% of interactions complete within 50 ms"
    - id: "SC-003"
      description: "Suggestion delivery and display remain bounded even when thousands of files match."
      metric: "Largest observed discovery batch and simultaneously visible suggestion count"
      target: "No batch exceeds 32 entries and no render exceeds the defined visible capacity"
    - id: "SC-004"
      description: "Rapid query changes and cancellation never show obsolete file results or alter the wrong mention."
      metric: "Stale-result mutations across repeated sequencing scenarios"
      target: "0 stale mutations across 100 repetitions"
    - id: "SC-005"
      description: "Provider-bound file context remains useful for valid mentions and safe for invalid or hostile mentions."
      metric: "Valid-expansion success rate and unintended disclosure count across the safety matrix"
      target: "100% of valid fixtures expand correctly and 0 unsafe fixtures disclose file content"
    - id: "SC-006"
      description: "The default-enable delivery remains independent of PR2 inline previews."
      metric: "PR2 preview capabilities introduced by the feature"
      target: "0"

key_entities:
  - name: "File mention preference"
    description: "The effective user choice controlling whether active @ input invokes filesystem-backed suggestions."
    attributes:
      - "absent, explicitly enabled, or explicitly disabled state"
      - "effective default-enabled behavior"
  - name: "Discovery generation"
    description: "One bounded suggestion search associated with a specific active mention query."
    attributes:
      - "generation identity"
      - "query"
      - "cancellation state"
      - "completion state"
  - name: "Suggestion batch"
    description: "An incremental set of fuzzy-matched repository entries delivered for one discovery generation."
    attributes:
      - "originating generation"
      - "up to 32 entries"
      - "completion indicator"
  - name: "Visible suggestion set"
    description: "The bounded subset of current-generation matches shown to the user at one time."
    attributes:
      - "display capacity"
      - "selection position"
      - "current query ownership"
  - name: "Provider file context"
    description: "Safely delimited content derived from an allowed file mention only for final provider submission."
    attributes:
      - "canonical in-bound path"
      - "escaped boundary metadata"
      - "validated readable content"
      - "submission-size contribution"

edge_cases:
  - scenario: "The setting is omitted from an existing configuration created when the picker required opt-in."
    expected_behavior: "The picker follows the new default-enabled behavior; users can restore literal @ behavior by explicitly disabling it."
  - scenario: "The setting changes to disabled while discovery is active."
    expected_behavior: "Active discovery is cancelled, pending results are ignored, visible suggestions close, and existing composer text is preserved."
  - scenario: "The query changes repeatedly faster than discovery batches arrive."
    expected_behavior: "Only the newest generation can contribute visible suggestions or selection state."
  - scenario: "A repository has no matches, more matches than the display capacity, or more matches than the bounded discovery limit."
    expected_behavior: "The picker remains responsive, shows an empty or bounded useful result set as appropriate, and never grows visible state without bound."
  - scenario: "A directory is unreadable or an exclusion pattern is invalid during discovery."
    expected_behavior: "Discovery continues safely where possible, does not freeze input, and does not remove established built-in exclusions."
  - scenario: "A mention resolves through traversal, an absolute path, or a symlink outside the authoritative repository boundary."
    expected_behavior: "No outside file content is expanded or sent, and the compact mention remains intact."
  - scenario: "Expansion makes the submission exceed its accepted total size."
    expected_behavior: "The provider receives no oversized submission and the complete editable or queued state is restored without losing surrounding text or attachments."
  - scenario: "File content or a path contains text resembling provider-context delimiters."
    expected_behavior: "The content is safely represented without escaping its file-context boundary or altering unrelated provider message structure."
  - scenario: "A touched surface also contains PR2 inline preview code."
    expected_behavior: "Only the picker-default behavior may change; preview rendering, state, dependencies, and behavior remain untouched."

assumptions:
  - "The TUI composer is the user-facing surface covered by this feature."
  - "An absent setting and an explicitly enabled setting should be behaviorally equivalent after this change."
  - "Explicitly disabled file mentions should prevent both picker discovery and provider-side mention expansion, preserving the established feature gate."
  - "The established visible suggestion capacity and total discovery bound remain authoritative; this feature requires that they stay bounded rather than selecting new numeric values."
  - "Existing repository-root authority, ignore behavior, compact history behavior, provider context safety, and submission-size limits remain the baseline contracts."
  - "PR2 refers to the separately owned inline file preview feature and its associated rendering, state, link handling, dependencies, fixtures, and sibling-repository behavior."

constraints:
  - "Each asynchronous discovery batch contains no more than 32 entries."
  - "Discovery results are generation-owned and cancellable."
  - "The simultaneously visible suggestion set remains bounded."
  - "Large-repository interaction must not wait for full repository enumeration."
  - "Explicit opt-out remains supported and authoritative."
  - "Provider expansion must not weaken repository containment, content eligibility, escaping, compact persistence, or submission-size safeguards."
  - "PR2 inline preview work remains separate."

out_of_scope:
  - "Adding or redesigning inline file previews."
  - "Changing PR2 preview rendering, preview state, link hit-testing, sibling-repository preview lookup, dependencies, or fixtures."
  - "Redesigning the fuzzy ranking algorithm or mention replacement syntax."
  - "Increasing unbounded discovery, storage, or visible suggestion limits."
  - "Broad changes to provider message formatting beyond preserving established safe file-context expansion."
  - "Unrelated TUI input, configuration, or repository-discovery refactors."

