implementation_phases:
  - phase: 1
    name: "Change the canonical default and documentation"
    goal: "Make absent file mention configuration enabled without weakening explicit opt-out or introducing a second resolution path."
    deliverables:
      - "Manual Default implementation for FileMentionsConfig with enabled = true and an empty ignore list"
      - "Updated generated config template describing default-enabled behavior and enabled = false opt-out"
      - "Focused deserialization matrix proving absent, explicit true, and explicit false semantics"
      - "Scope check confirming no protocol, storage, desktop, or preview dependency change"
  - phase: 2
    name: "Lock picker lifecycle, bounds, and responsiveness"
    goal: "Prove default activation retains the existing asynchronous, generation-owned, bounded behavior in small and large repositories."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Default, explicit-enable, and explicit-disable picker activation tests, including zero discovery while disabled"
      - "Deterministic multi-batch tests proving every batch is at most 32 entries and first useful delivery meets the 100 ms target"
      - "Query-change, picker-close, and feature-disable tests proving cancellation and zero stale mutations across repeated sequences"
      - "Tests proving the candidate projection and 8-row visible window remain bounded while selection and navigation continue"
      - "Latency checks for typing, navigation, cancellation, and submission during active large-fixture discovery"
      - "Global, profile, built-in, repository-ignore, and invalid-custom-pattern coverage"
  - phase: 3
    name: "Preserve selection and provider safety contracts"
    goal: "Ensure default availability does not alter editable text semantics or broaden provider-bound filesystem disclosure."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Beginning, middle, and end active-span replacement tests preserving surrounding input byte for byte"
      - "Valid in-bound expansion tests with escaped path and closing-delimiter content"
      - "Negative matrix for traversal, outside-root absolute paths, symlink escape, missing, unreadable, directory, binary, invalid UTF-8, and oversized files"
      - "Direct, queued, resumed/materialized, rewound, remote, and interleaved regressions proving compact mentions remain user-visible"
      - "Submission-size failure tests proving original text, surrounding content, attachments, reminders, and queue state are restored"
  - phase: 4
    name: "Validate runtime behavior and delivery scope"
    goal: "Demonstrate the feature in the built TUI, satisfy repository gates, and prove PR2 remains separate."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Exact file-mention and affected render/dispatch tests passing"
      - "Relevant jcode-tui package check and coordinated selfdev TUI build passing"
      - "scripts/check_guardrails.sh passing or any unrelated pre-existing failure isolated and recorded"
      - "Isolated-socket runtime smoke evidence for absent and explicit-disabled configuration using the newly built binary"
      - "Final diff and dependency scan showing zero inline preview rendering, preview state, link hit-testing, sibling lookup, preview fixtures, or preview-only dependencies"
      - "Updated artifact validation and clean ownership-focused commit evidence on branch 020-enable-file-picker"

open_questions:
  - question: "Should the default-enabled test matrix live entirely in jcode-tui or should a small config-type unit test also be added in jcode-config-types?"
    context: "The default is owned by jcode-config-types, while user-observable activation and expansion are owned by jcode-tui. Both ownership and end-to-end behavior need direct evidence without duplicating a large matrix."
    proposed_resolution: "Add a minimal FileMentionsConfig default/deserialization unit test in the type crate if that crate has an established local test section, and keep activation, opt-out, discovery, and expansion behavior in the existing TUI test module."
  - question: "Can deterministic filesystem timing fixtures reliably enforce the 95th-percentile targets on all CI hosts?"
    context: "The current exact test uses single-run 100 ms and 50 ms assertions, which may be noisy on loaded or slower cross-platform runners even though the product targets are percentile-based."
    proposed_resolution: "Keep correctness tests deterministic, run repeated latency samples in a focused ignored or benchmark-style test, assert the stated 95th percentile where the repository permits timing tests, and record representative runtime evidence without weakening the product budget."

