plan:
  branch: "jcode-44d-safe-run"
  created: "2026-08-06"
  spec_path: "specs/002-safe-run-ownership/spec.yaml"

summary: |
  Make private Go SDK runtime ownership explicit and transferable without
  changing the non-owning contract of Connect or the shared Jcode daemon.
  Reuse the existing Instance supervision, reconnect policy, observations,
  harness protocol, and cleanup boundaries. Validate the full ownership
  lifecycle with focused Go tests, race checks, and private-instance runtime
  checks against the intended Jcode executable.

technical_context:
  language: "Go 1.23"
  framework: "Standard library with the existing Jcode Go SDK packages"
  primary_dependencies:
    - name: "github.com/ariel-frischer/jcode-go"
      version: "local module"
      purpose: "Owns typed protocol clients, transport, private launch supervision, lifecycle observations, and public SDK contracts."
    - name: "Jcode harness API"
      version: "v1 wire contract"
      purpose: "Remains the server and serialized protocol authority used by Connect and private instances."
  storage: "SDK-created private instance home and socket state only; Connect does not own shared runtime storage"
  testing:
    framework: "Go test, race detector, vet, module verification, and private-instance runtime smoke tests"
    approach: "Exercise private survival, explicit shutdown, shared non-ownership, finite reconnect observations, cancellation, unsafe instance paths, and cleanup without live provider calls."
  target_platform: "Linux and macOS for the Go v1 Unix-socket transport"
  project_type: "sdk"
  performance_goals: "Reconnect attempts remain finite, Close and Shutdown remain idempotent, and no background supervisor or unbounded retry loop is introduced."
  constraints:
    - "Connect remains transport-only and never acquires shared process ownership."
    - "Launch and Instance own only SDK-created private process, socket, home, and cleanup state."
    - "The harness API remains the wire-contract owner; the SDK does not parse CLI output or duplicate server definitions."
    - "Credentials are inherited only through the existing explicit private-launch filesystem contract and are never emitted in logs or protocol frames."
    - "Shutdown and cleanup are idempotent, bounded, and race-safe."
  scale_scope: "One explicit Instance owner per private runtime with a finite reconnect attempt budget and constant-size lifecycle state."

feature:
  branch: "jcode-44d-safe-run"
  status: "Draft"
  architecture:
    owner: "sdk/go"
    reuse: "Existing Connect non-owning contract, Launch/LaunchInstance private process supervision, Client instance attachment, and Reconnect policy/observations."
    boundary: "Connect owns only its transport. Launch owns a private bridge, daemon, instance home, and cleanup through an explicit Instance handle attached to the client."
    compatibility: "No changes to shared runtime shutdown, provider routing, credentials, or wire protocol. Existing APIs remain valid."
    non_goals: "Immortal clients, implicit ownership, infinite reconnect, Autospec policy, credential embedding."
  components:
    - name: "Go SDK ownership API"
      files: ["sdk/go/launch.go", "sdk/go/client.go", "sdk/go/connect.go"]
      responsibility: "Represent and enforce private versus shared lifecycle ownership."
    - name: "Lifecycle tests"
      files: ["sdk/go/client_api_test.go", "sdk/go/client_validation_test.go", "sdk/go/launch_test.go"]
      responsibility: "Deterministic ownership, shutdown, non-ownership, and reconnect evidence."
    - name: "Contract documentation"
      files: ["sdk/go/README.md"]
      responsibility: "Explain safe-run ownership and bounded reconnect semantics."
  decisions:
    - "Prefer an explicit private Instance handle over changing shared Connect behavior."
    - "Keep Launch client convenience while making ownership visible and idempotent through Instance."
    - "Use existing finite ReconnectPolicy and Observation events rather than adding a hidden supervisor loop."
  validation:
    - "go test ./... from sdk/go"
    - "go test -race ./... from sdk/go"
    - "go vet ./... from sdk/go"
    - "go mod verify from sdk/go"
    - "Review diff and run relevant runtime tests without live provider calls."

