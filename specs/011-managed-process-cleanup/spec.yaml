feature:
  branch: "011-managed-process-cleanup"
  created: "2026-08-21"
  status: "Draft"
  input: "Prevent Jcode managed Bash and Cargo process trees from leaking after timeout promotion, cancellation, reload, shutdown, or owner loss. Preserve active and intentionally transferred work. Persist identity-safe process-group ownership, ensure bounded terminate-and-reap semantics, and add nondestructive stale-task inspection plus explicit safe cleanup. Implement Bead jcode-07t acceptance criteria."

user_stories:
  - id: "US-001"
    title: "Cancel complete managed process trees"
    priority: "P0"
    as_a: "Jcode operator"
    i_want: "cancelling a managed Bash task to reach and reap its complete owned process tree"
    so_that: "timeout-promoted Cargo commands and descendants cannot survive as leaked work"
    why_this_priority: "Leaked process trees consume CPU, memory, build locks, and server child slots for hours or days."
    independent_test: "Promote a shell with a Cargo-like parent and long-lived descendant, cancel by task identity, and prove the isolated process group is gone and reaped within a bounded deadline."
    acceptance_scenarios:
      - given: "A foreground Bash command times out and is adopted by the background manager"
        when: "The operator cancels the adopted task"
        then: "Cancellation reaches the underlying workload, waits for bounded teardown, and leaves no live or zombie descendant."
      - given: "Graceful termination does not finish the owned process group"
        when: "The cancellation grace period expires"
        then: "Jcode escalates termination, records the outcome, and still waits for bounded reaping before reporting success or failure."

  - id: "US-002"
    title: "Reconcile managed work across owner loss"
    priority: "P0"
    as_a: "Jcode operator"
    i_want: "running task records to retain identity-verified process ownership across reload or restart"
    so_that: "Jcode can safely reconcile only its own stale work without PID-reuse risk"
    why_this_priority: "Owner reload and restart are confirmed leak paths, while unsafe PID-only signaling could terminate unrelated user processes."
    independent_test: "Persist a running promoted task, simulate owner reload or restart, and verify matching owned groups are terminated while mismatched process identity fails closed."
    acceptance_scenarios:
      - given: "A non-transferred owned Bash process group is running during server reload or shutdown"
        when: "The owner terminates or reloads"
        then: "The complete owned group is terminated and reaped, and status records the teardown result."
      - given: "Persisted task metadata references a PID whose process identity no longer matches"
        when: "Reconciliation or cleanup evaluates the task"
        then: "No signal is sent and diagnostics explain the identity mismatch."
      - given: "A process was intentionally transferred under the existing reload-persistence contract"
        when: "The server reloads"
        then: "The transferred group retains its documented behavior and is not terminated as ordinary owned foreground work."

  - id: "US-003"
    title: "Inspect and explicitly terminate stale managed tasks"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "a nondestructive stale-running inspection and explicit opt-in termination workflow"
    so_that: "I can recover safely without matching arbitrary commands or processes"
    why_this_priority: "Operators currently have no safe bulk recovery path because normal cleanup skips running tasks."
    independent_test: "Create matching, mismatched, active, and unrelated process fixtures, run dry-run inspection, then explicitly terminate one stale task by stable identity and verify only the verified owned group is affected."
    acceptance_scenarios:
      - given: "Persisted running managed tasks exist"
        when: "The operator requests stale-task inspection or cleanup dry-run"
        then: "Jcode reports exactly which stable task identities are eligible, why, and whether process identity verification succeeds without signaling anything."
      - given: "The operator explicitly opts to terminate a verified stale task by stable task identity"
        when: "The termination action runs"
        then: "Only that identity-verified Jcode-owned group is terminated and the result is visible in task status and diagnostics."
      - given: "Normal background artifact cleanup runs"
        when: "It encounters running tasks"
        then: "It remains nondestructive and does not signal those tasks."

  - id: "US-004"
    title: "Validate real managed-task lifecycle behavior"
    priority: "P1"
    as_a: "Jcode maintainer"
    i_want: "focused regressions and built-binary validation for process ownership"
    so_that: "future cancellation, reload, and cleanup changes cannot silently reintroduce leaked trees or zombies"
    independent_test: "Run focused process-tree and identity tests, then use a newly built binary on an isolated socket to time out, list, cancel or clean a managed command and inspect descendants."
    acceptance_scenarios:
      - given: "The focused regression suite"
        when: "Normal completion, cancellation, escalation, reload, stale status, identity mismatch, and unrelated-process preservation execute"
        then: "Every scenario passes within bounded deadlines without leaking descendants."
      - given: "A newly built isolated Jcode server"
        when: "A managed command times out into background and is listed then cancelled or explicitly cleaned"
        then: "No live or zombie descendant remains under that server process."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST replace the adopted-task wrapper-only cancellation gap with an explicit teardown contract that reaches the underlying adopted work and waits for bounded completion."
      acceptance_criteria: "A regression aborts or cancels the wrapper path and proves the underlying workload cannot detach and survive."
    - id: "FR-002"
      description: "MUST terminate and reap the complete owned isolated process group, including descendants, on explicit cancellation and forced escalation."
      acceptance_criteria: "A Linux process-tree test observes the Cargo-like parent and long-lived child disappear and verifies no unreaped descendant within the deadline."
    - id: "FR-003"
      description: "MUST preserve intentionally transferred work under the existing reload-persistence contract while terminating non-transferred owned work on reload and shutdown."
      acceptance_criteria: "Focused shutdown and reload tests distinguish transferred and non-transferred groups and assert the documented outcome for each."
    - id: "FR-004"
      description: "MUST persist sufficient owner and process-instance identity for running timeout-promoted or detached Bash tasks to reconcile safely after restart."
      acceptance_criteria: "Serialized status compatibility tests cover the new optional identity metadata, matching reconciliation, and legacy records without the field."
    - id: "FR-005"
      description: "MUST verify owner instance and process start identity immediately before any persisted-task signal and fail closed when identity is missing or mismatched."
      acceptance_criteria: "PID-reuse and mismatch regressions prove no signal reaches an unrelated fixture process and diagnostics record the refusal."
    - id: "FR-006"
      description: "MUST expose nondestructive stale-running inspection and explicit opt-in termination by stable task identity through the existing background-task CLI/API."
      acceptance_criteria: "Tool schema and execution tests cover dry-run reporting, explicit terminate, missing identity, mismatched identity, selected task identity, and unrelated-process preservation."
    - id: "FR-007"
      description: "MUST keep existing background artifact cleanup nondestructive for running tasks."
      acceptance_criteria: "Existing cleanup tests plus a running-task fixture prove default cleanup removes terminal artifacts only and never signals running work."
    - id: "FR-008"
      description: "MUST expose cancellation, incomplete reaping, and reconciliation failures in task status and diagnostics rather than reporting unconditional success."
      acceptance_criteria: "Negative-path tests assert visible failure state and reason when teardown or identity verification cannot complete."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "No process may be signaled based only on executable name, command text, PID, or age."
      measurable_target: "100% of persisted-task signaling paths require stable task ownership plus matching process-instance identity immediately before signaling."
    - id: "NFR-002"
      category: "reliability"
      description: "Cancellation and reload teardown must complete within bounded deadlines and leave truthful terminal state."
      measurable_target: "Focused tests finish within their declared deadlines and observe zero live or zombie owned descendants after successful teardown."
    - id: "NFR-003"
      category: "code_quality"
      description: "The solution must reuse existing background status, process guards, process-instance tokens, and platform signaling helpers without a parallel process registry."
      measurable_target: "Review finds no new general process manager, executable-name matcher, or upward dependency from jcode-base to app-core."
    - id: "NFR-004"
      category: "reliability"
      description: "Persisted status changes must remain backward compatible."
      measurable_target: "Legacy status fixtures deserialize successfully with safe defaults, and new metadata serializes deterministically."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Explicit cancellation leaves no owned Cargo-like parent or descendant running or unreaped."
      metric: "Live and zombie descendant count after bounded cancellation"
      target: "Zero"
    - id: "SC-002"
      description: "Reload and shutdown reconcile non-transferred owned work while preserving intentional transfer."
      metric: "Focused lifecycle scenario pass rate"
      target: "100%"
    - id: "SC-003"
      description: "Identity mismatch never terminates unrelated processes."
      metric: "Signals delivered to mismatch and unrelated-process fixtures"
      target: "Zero"
    - id: "SC-004"
      description: "Operators can inspect stale tasks safely and terminate one verified task explicitly."
      metric: "Dry-run and explicit-termination scenario pass rate"
      target: "100%"
    - id: "SC-005"
      description: "The newly built isolated runtime demonstrates the fixed end-to-end lifecycle."
      metric: "Live or zombie descendants after timed-out task listing and cancellation or cleanup"
      target: "Zero"

key_entities:
  - name: "Managed background task"
    description: "A stable Jcode task identity with persisted lifecycle, ownership, delivery, and process metadata."
    attributes:
      - "stable task ID"
      - "owner session and server instance"
      - "running or terminal status"
      - "underlying work teardown handle"
  - name: "Managed process identity"
    description: "Identity-verified metadata for a Jcode-owned isolated process group."
    attributes:
      - "process group leader PID"
      - "process start instance token"
      - "owner instance token"
      - "transfer or detached policy"
  - name: "Stale-task cleanup decision"
    description: "A nondestructive inspection result or explicit termination result for one stable managed task."
    attributes:
      - "task identity"
      - "eligibility reason"
      - "identity verification outcome"
      - "signal and reaping outcome"

edge_cases:
  - scenario: "The adopted wrapper is aborted before the underlying work task finishes."
    expected_behavior: "The teardown contract still owns and terminates the underlying workload instead of detaching it."
  - scenario: "The process exits naturally between identity verification and signaling."
    expected_behavior: "The operation reports an already-stopped or reconciled result without treating a new process as the target."
  - scenario: "A legacy running status has no process identity metadata."
    expected_behavior: "Inspection explains that termination is unsafe, and explicit cleanup fails closed without signaling."
  - scenario: "The PID has been reused or the process start token changed."
    expected_behavior: "Identity mismatch is visible and no signal is delivered."
  - scenario: "Graceful termination succeeds but a descendant is not yet reaped."
    expected_behavior: "Cancellation waits within the bounded reaping deadline and reports incomplete teardown if the descendant remains."
  - scenario: "Default cleanup sees both terminal and running artifacts."
    expected_behavior: "Only eligible terminal artifacts are removed; running tasks remain untouched."

assumptions:
  - "Linux provides the primary process-tree regression surface, while platform-neutral status and CLI behavior remains covered where practical."
  - "Existing process instance tokens and platform signaling helpers are sufficient for PID-reuse protection without a new registry."
  - "The existing reload-persistence contract for intentionally transferred Bash work remains authoritative."
  - "Staleness may inform inspection output but never authorizes signaling without stable ownership and matching process identity."

constraints:
  - "Keep shell spawning and process-group guards in jcode-app-core and task orchestration and persisted status in jcode-base."
  - "Stable lower crates must not depend upward on app-core."
  - "Reuse ProcessGroupKillGuard, DetachedChildKillGuard, signal_detached_process_group, existing process-instance tokens, and background event records."
  - "Do not change the default foreground timeout or remove timeout promotion."
  - "Validation must include focused tests before serialized guardrails and a newly built isolated-runtime check."

out_of_scope:
  - "Killing arbitrary processes by executable name, command substring, PID alone, or age alone."
  - "Automatically terminating active agents, current Cargo builds, or user-launched terminal commands."
  - "Building a general-purpose operating-system process manager or parallel process registry."
  - "Broad refactoring of unrelated background-task, tool, or server lifecycle code."
  - "Changing default foreground timeout, promotion policy, or unrelated background delivery behavior."

