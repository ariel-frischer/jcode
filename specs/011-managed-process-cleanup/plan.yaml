research_findings:
  decisions:
    - topic: "Adopted task ownership and cancellation"
      decision: "Extend RunningTask with a dependency-safe teardown target that owns or can explicitly cancel and await the underlying adopted work, while retaining the wrapper for status finalization."
      rationale: "Current timeout promotion awaits an inner Bash JoinHandle inside a wrapper, but RunningTask stores only the wrapper; aborting it drops and detaches the inner workload."
      alternatives_considered:
        - "Continue aborting only the wrapper and rely on ProcessGroupKillGuard drop"
        - "Store Bash-specific process guards directly in jcode-base"
        - "Disable timeout promotion"
    - topic: "Managed process identity persistence"
      decision: "Add optional persisted managed process metadata containing group leader PID, process start token, owner instance token, and transfer policy, populated before timeout-promoted or detached work becomes externally manageable."
      rationale: "PID and age are insufficient across owner restart; the existing Linux /proc start-token verification used by claude_live and the background owner-instance token provide the two required identity checks without a new registry."
      alternatives_considered:
        - "Match process executable or command text"
        - "Trust a PID if the task status is old enough"
        - "Create a separate process registry outside background status"
    - topic: "Identity-verified signaling"
      decision: "Centralize live instance verification and process-group signaling in jcode-base platform or background helpers, rechecking identity immediately before TERM and KILL and treating missing or mismatched identity as a non-destructive refusal."
      rationale: "Cancellation, restart reconciliation, and explicit stale cleanup need identical PID-reuse protection and diagnostics."
      alternatives_considered:
        - "Verify once when reading persisted status and signal later"
        - "Use kill(pid, 0) alone as identity proof"
        - "Implement identity verification independently in bg tool code"
    - topic: "Reload and transfer behavior"
      decision: "Use the same bounded teardown contract for non-transferred live tasks during reload, while preserving deliberately transferred or reload-persistable Bash work under its current detached ownership contract."
      rationale: "Reload already aborts and awaits wrappers, but cannot reach inner handles detached earlier; transfer semantics are intentional and must remain compatible."
      alternatives_considered:
        - "Terminate every process referenced by running status on reload"
        - "Preserve every adopted task across reload"
    - topic: "Operator stale-task workflow"
      decision: "Add bg stale inspection as a dry-run-capable action and explicit terminate action selected by stable task identity, with eligibility and identity verification reported per task."
      rationale: "Normal cleanup intentionally skips running tasks, and command-name or age matching would be unsafe."
      alternatives_considered:
        - "Make existing cleanup kill old running tasks automatically"
        - "Add a global kill-cargo command"
        - "Delete status artifacts without terminating processes"
    - topic: "Platform compatibility"
      decision: "Provide full identity-verified process-group behavior on Linux, preserve additive status and CLI compatibility elsewhere, and fail closed where an equivalent start-token check is unavailable."
      rationale: "The confirmed leak and required regression are Linux process-tree behaviors; conservative refusal is safer than PID-only signaling on unsupported platforms."
      alternatives_considered:
        - "Use PID-only termination on every platform"
        - "Block all status format and CLI improvements on cross-platform process identity parity"


data_model:
  entities:
    - name: "ManagedProcessIdentity"
      description: "Backward-compatible persisted identity for an owned process-group leader."
      fields:
        - name: "pid"
          type: "u32"
          description: "Process-group leader PID used for group signaling after verification."
          constraints: "Never sufficient alone to authorize signaling."
        - name: "process_instance"
          type: "String"
          description: "OS-derived process start identity token protecting against PID reuse."
          constraints: "Must match the live process immediately before signaling."
        - name: "owner_instance"
          type: "String"
          description: "Jcode server instance that created and owns the managed task."
          constraints: "Must match the recorded task ownership policy for reconciliation."
        - name: "detached"
          type: "bool"
          description: "Existing persisted policy indicating whether work was intentionally transferred from ordinary owner-bound lifecycle handling."
          constraints: "Reuse the existing serde default; legacy or missing process identity never becomes signal authorization."
      relationships:
        - target: "TaskStatusFile"
          type: "many-to-one"
          description: "Each running managed task may persist one managed process identity."
    - name: "RunningTask"
      description: "In-memory background task state retaining status wrapper and explicit underlying teardown ownership."
      fields:
        - name: "wrapper_handle"
          type: "JoinHandle"
          description: "Finalizes output, delivery, and terminal status."
          constraints: "Aborting it must not be the only cancellation action for adopted work."
        - name: "teardown_target"
          type: "optional cancellation and bounded-await handle"
          description: "Reaches the underlying adopted workload or owned process lifecycle."
          constraints: "Cancellation must invoke and await it before reporting successful teardown."
        - name: "managed_process"
          type: "Option<ManagedProcessIdentity>"
          description: "Identity used by explicit cancellation, reload, and status reconciliation."
          constraints: "Missing identity fails closed for persisted destructive actions."
      relationships:
        - target: "ManagedProcessIdentity"
          type: "one-to-one"
          description: "A live Bash task may own one verified isolated process group."
    - name: "StaleManagedTaskDecision"
      description: "Inspection or termination result for one stable background task."
      fields:
        - name: "task_id"
          type: "String"
          description: "Stable task identity selected by the operator."
          constraints: "Required for destructive action."
        - name: "eligibility"
          type: "enum"
          description: "Verified stale, active owner, missing identity, mismatch, terminal, or already stopped."
          constraints: "Only verified stale or explicitly cancellable owned tasks may be terminated."
        - name: "dry_run"
          type: "bool"
          description: "Whether the operation is inspection-only."
          constraints: "Defaults to nondestructive behavior."
        - name: "outcome"
          type: "String"
          description: "No-op, terminated, escalated, already stopped, refused, or incomplete teardown."
          constraints: "Must be visible in tool output and task diagnostics."
      relationships:
        - target: "TaskStatusFile"
          type: "many-to-one"
          description: "Each decision evaluates one persisted task status and its live process identity."

