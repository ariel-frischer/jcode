plan:
  branch: "011-managed-process-cleanup"
  created: "2026-08-21"
  spec_path: "specs/011-managed-process-cleanup/spec.yaml"

summary: |
  Close the managed Bash ownership gap by making background adoption retain an
  explicit teardown path to the underlying work rather than only a wrapper task.
  Running task state will carry a cancellation target that can terminate the
  complete owned process group, await the adopted workload, and report bounded
  teardown success or failure. Timeout-promoted foreground Bash work will publish
  identity-verified process-group metadata before adoption so cancellation,
  reload, and restart reconciliation all use one ownership contract.

  Extend the backward-compatible persisted background status with optional
  managed process identity: process-group leader PID, process start token, owner
  instance, and transfer policy. jcode-base platform helpers will verify the live
  process instance immediately before TERM, KILL, or liveness decisions and fail
  closed for missing or mismatched identity. The existing bg interface will gain
  nondestructive stale-running inspection and explicit opt-in termination by
  stable task ID, while normal cleanup continues to skip running tasks. Focused
  Linux regressions and a newly built isolated-server check will prove complete
  process-tree teardown, reaping, reload behavior, PID-reuse protection, and
  unrelated-process preservation.

technical_context:
  language: "Rust 2024"
  framework: "Tokio async runtime with Serde-persisted background task state and JSON-schema tool interfaces"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "JoinHandle ownership, bounded teardown waits, cancellation orchestration, process spawning, and asynchronous tests."
    - name: "serde and serde_json"
      version: "1"
      purpose: "Backward-compatible persisted running-task metadata and background tool request or response contracts."
    - name: "libc"
      version: "0.2"
      purpose: "Linux process-group TERM, KILL, liveness probes, and wait semantics through existing platform helpers."
    - name: "tempfile"
      version: "3"
      purpose: "Deterministic persisted status and process lifecycle fixtures."
  storage: "Existing background task status JSON files under the configured background output directory; no new registry or database."
  testing:
    framework: "Cargo unit, integration, and Linux process-tree tests"
    approach: "Write focused failing regressions for adopted cancellation, full-group teardown, escalation, reload transfer behavior, identity mismatch, stale inspection and explicit termination, then run affected crate tests and a newly built binary on an isolated socket."
  target_platform: "All existing Jcode platforms for compatible status and CLI behavior, with Linux-specific process identity, process-group, and reaping regressions."
  project_type: "CLI/TUI agent runtime and shared server"
  performance_goals: "Cancellation and reload teardown remain bounded by explicit grace and escalation deadlines; status listing and dry-run inspection perform bounded local process checks without command-name scans."
  constraints:
    - "Keep shell spawning, process-group ownership guards, and child reaping in jcode-app-core Bash ownership code."
    - "Keep task status, delivery, cancellation orchestration, cleanup policy, and restart reconciliation in jcode-base."
    - "jcode-base must not depend upward on jcode-app-core; cancellation hooks must use dependency-safe generic contracts."
    - "Reuse ProcessGroupKillGuard, DetachedChildKillGuard, signal_detached_process_group, process instance tokens, and existing event and status records."
    - "Persisted fields must be optional or defaulted so legacy task status remains readable and fails closed for destructive actions."
    - "No signal may be authorized by command text, executable name, PID alone, or age alone."
    - "Preserve the existing documented reload-persistence behavior for intentionally transferred Bash work."
    - "Default bg cleanup remains nondestructive for running tasks."
  scale_scope: "Local Jcode-managed background tasks and their isolated process groups, typically one to tens of concurrent tasks, with persisted recovery after a single owning server instance reload or loss."

