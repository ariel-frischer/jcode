implementation_phases:
  - phase: 1
    name: "Lock ownership and identity regressions"
    goal: "Create focused failing tests for wrapper detachment, complete group teardown, reload transfer behavior, persisted identity, and safe stale inspection."
    deliverables:
      - "Adopted-task cancellation regression proving the underlying workload cannot detach when the wrapper is aborted."
      - "Linux Cargo-like parent and descendant fixture with bounded TERM, KILL, liveness, and reaping assertions."
      - "Backward-compatible status and PID-reuse mismatch fixtures."
      - "Dry-run, explicit termination, default cleanup, and unrelated-process preservation tests."
  - phase: 2
    name: "Implement managed ownership and identity contract"
    goal: "Make RunningTask retain underlying teardown ownership and persist identity-safe process-group metadata."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Additive ManagedProcessIdentity fields integrated with the existing detached transfer policy and safe serde defaults."
      - "Dependency-safe adopted task cancellation and bounded-await handle."
      - "Timeout-promoted Bash publication of group leader and start identity before external management."
      - "Identity-verified signaling and conservative unsupported-platform behavior."
  - phase: 3
    name: "Unify cancellation, reload, and stale cleanup"
    goal: "Use one verified bounded teardown path for explicit cancellation, owner reload, restart reconciliation, and explicit operator cleanup."
    dependencies:
      - "Phase 2"
    deliverables:
      - "TERM then KILL escalation with bounded reaping and truthful task diagnostics."
      - "Reload and shutdown teardown for non-transferred work while preserving intentional transfer."
      - "Nondestructive stale-running inspection and explicit terminate-by-task-ID bg actions."
      - "Existing cleanup remains nondestructive for running tasks."
  - phase: 4
    name: "Validate lifecycle outcome and guardrails"
    goal: "Prove the complete managed process lifecycle through focused tests, affected crates, repository guardrails, and a newly built isolated runtime."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Focused background, platform, Bash, reload, and bg tool tests pass."
      - "Serialized affected-crate build and repository guardrail evidence."
      - "Newly built jcode binary on an isolated socket times out, lists, cancels or cleans a managed task with zero remaining live or zombie descendants."
      - "Final diff review confirms no unrelated process matching, broad refactor, or destructive default behavior."

