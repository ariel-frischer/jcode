phases:
    - number: 1
      title: "Setup"
      purpose: "Establish focused process-tree, persisted-status, and bg-tool fixtures without changing production behavior."
      tasks:
        - id: "T001"
          title: "Prepare deterministic managed process lifecycle fixtures"
          status: "Completed"
          type: "setup"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/background/tests.rs, crates/jcode-base/src/platform_tests.rs, crates/jcode-app-core/src/tool/bash_tests.rs, crates/jcode-app-core/src/tool/bash_shutdown_tests.rs"
          dependencies: []
          acceptance_criteria:
            - "Linux fixtures can start an isolated shell group with a Cargo-like intermediate process and long-lived descendant, observe process identity, and enforce bounded wait or cleanup deadlines."
            - "Persisted task fixtures can create legacy, matching, missing-identity, mismatched-identity, active-owner, and orphaned running status records in temporary directories."
            - "All fixtures clean up their own children on assertion failure and never match unrelated processes by command text or executable name."
    - number: 2
      title: "Foundational"
      purpose: "Lock the cancellation ownership and process identity safety contracts before implementation."
      tasks:
        - id: "T002"
          title: "Add adopted underlying-work cancellation regression"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: null
          file_path: "crates/jcode-base/src/background/tests.rs"
          dependencies: ["T001"]
          acceptance_criteria:
            - "A test adopts a long-lived underlying work handle, cancels the stable task, and proves the underlying task receives teardown and cannot survive wrapper abortion."
            - "The test distinguishes successful bounded teardown from wrapper-only status finalization."
        - id: "T003"
          title: "Add process start identity and verified signaling regressions"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: null
          file_path: "crates/jcode-base/src/platform_tests.rs, crates/jcode-base/src/background/tests.rs"
          dependencies: ["T001"]
          acceptance_criteria:
            - "Tests obtain a stable live process instance token and verify matching process-group liveness and signaling."
            - "A deliberately mismatched token or PID-reuse-equivalent fixture fails closed and leaves the unrelated process alive."
            - "Unsupported or missing identity never falls back to PID-only signaling."
        - id: "T004"
          title: "Implement additive managed process identity contracts"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/background/model.rs, crates/jcode-base/src/platform.rs"
          dependencies: ["T002", "T003"]
          acceptance_criteria:
            - "TaskStatusFile supports optional process-group PID, opaque process start token, owner instance, and transfer policy with backward-compatible serde defaults."
            - "Platform helpers verify a live process instance immediately before liveness probes and signals, returning explicit matching, stopped, missing, unsupported, or mismatch outcomes."
            - "No new dependency or app-core type enters jcode-base."
        - id: "T005"
          title: "Implement explicit adopted-work teardown ownership"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/background/model.rs, crates/jcode-base/src/background.rs"
          dependencies: ["T004"]
