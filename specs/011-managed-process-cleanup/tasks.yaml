          dependencies: ["T012"]
          acceptance_criteria:
            - "Exact-name or module-focused tests cover normal completion, cancellation, forced escalation, wrapper abortion, owner reload, shutdown, stale status, PID reuse or mismatch, default cleanup, explicit termination, and unrelated-process preservation."
