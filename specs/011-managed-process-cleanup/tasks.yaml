            - "cancel_with_grace invokes underlying teardown, waits boundedly, and cannot detach the inner JoinHandle by aborting only the wrapper."
            - "Normal completion still finalizes output, events, delivery, and terminal status exactly once."
    - number: 3
      title: "User Story 1 - Cancel complete managed process trees"
      purpose: "Make timeout-promoted Bash cancellation terminate and reap the complete owned isolated process group."
      story_reference: "US-001"
      independent_test: "Promote a Cargo-like process tree, cancel it, and prove every group member is gone and reaped within the bounded deadline."
      tasks:
        - id: "T006"
          title: "Add timeout promotion, escalation, and descendant reaping regressions"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-001"
          file_path: "crates/jcode-app-core/src/tool/bash_tests.rs, crates/jcode-base/src/background/tests.rs"
          dependencies: ["T005"]
          acceptance_criteria:
            - "A Linux regression starts a shell, Cargo-like parent, and long-lived descendant through the managed Bash path, forces timeout promotion, cancels by task ID, and observes zero live or zombie group members."
            - "A forced-escalation fixture ignores graceful termination, requires KILL, and records the escalation outcome."
            - "A normal completion fixture proves no unnecessary signal or false cancellation state."
        - id: "T007"
          title: "Publish Bash managed process identity and teardown contract on promotion"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "crates/jcode-app-core/src/tool/bash.rs, crates/jcode-app-core/src/tool/bash_process_guard.rs, crates/jcode-base/src/background.rs"
          dependencies: ["T006"]
          acceptance_criteria:
            - "Timeout-promoted foreground work registers its isolated process-group leader and process start token before it becomes externally cancellable."
            - "The adopted task receives an explicit teardown hook that retains ProcessGroupKillGuard ownership and waits for child completion or bounded escalation."
            - "Cancellation status is successful only when the owned workload has stopped and reaping completed; failures remain visible."
    - number: 4
      title: "User Story 2 - Reconcile managed work across owner loss"
      purpose: "Safely terminate non-transferred owned groups on reload or restart while preserving intentional transfer."
      story_reference: "US-002"
      independent_test: "Simulate reload or owner loss for matching, transferred, legacy, and mismatched task records and verify only matching non-transferred owned groups are terminated."
      tasks:
        - id: "T008"
          title: "Add reload, shutdown, orphan, and transfer-policy regressions"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-app-core/src/tool/bash_shutdown_tests.rs, crates/jcode-base/src/background/tests.rs"
          dependencies: ["T007"]
          acceptance_criteria:
            - "Abrupt shutdown and reload terminate and reap non-transferred promoted process groups."
            - "Intentionally transferred reload-persistable groups retain the existing documented behavior."
            - "Legacy or mismatched persisted identity is marked or reported safely without signaling."
        - id: "T009"
          title: "Unify reload and orphan reconciliation with verified bounded teardown"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-base/src/background.rs, crates/jcode-app-core/src/tool/bash.rs, crates/jcode-app-core/src/tool/bash_process_guard.rs"
          dependencies: ["T008"]
          acceptance_criteria:
            - "abort_live_tasks_for_reload reaches underlying non-transferred work, applies bounded teardown, and awaits wrapper finalization without detach gaps."
            - "Restart reconciliation verifies owner and process instance immediately before signaling and fails closed on mismatch or missing identity."
            - "Transferred groups remain excluded from ordinary owner-bound teardown and preserve existing status behavior."
    - number: 5
      title: "User Story 3 - Inspect and explicitly terminate stale managed tasks"
      purpose: "Give operators a safe dry-run and explicit stable-task cleanup path while preserving nondestructive default cleanup."
      story_reference: "US-003"
      independent_test: "Inspect mixed running fixtures, explicitly terminate one verified stale task by stable ID, and prove active, mismatched, legacy, and unrelated processes remain untouched."
      tasks:
        - id: "T010"
          title: "Add stale inspection, explicit termination, and cleanup safety regressions"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-003"
          file_path: "crates/jcode-base/src/background/tests.rs, crates/jcode-app-core/src/tool/bg.rs"
          dependencies: ["T009"]
          acceptance_criteria:
            - "Dry-run output identifies exact stable task IDs, eligibility reasons, owner state, and identity verification without signaling."
            - "Explicit termination affects only the selected matching stale task and reports already stopped, mismatch, missing identity, or incomplete reaping truthfully."
            - "Existing cleanup continues to skip all running tasks and remove only eligible terminal artifacts."
        - id: "T011"
          title: "Implement stale managed-task inspection and explicit termination API"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-003"
          file_path: "crates/jcode-base/src/background/model.rs, crates/jcode-base/src/background.rs"
          dependencies: ["T010"]
          acceptance_criteria:
            - "The manager returns structured nondestructive inspection decisions for persisted running tasks."
            - "Explicit termination requires stable task ID and matching owner or orphan policy plus matching process instance."
            - "Termination uses the same bounded TERM, KILL, liveness, reaping, status, and diagnostic contract as ordinary cancellation."
        - id: "T012"
          title: "Expose bg stale inspection and terminate actions"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-003"
          file_path: "crates/jcode-app-core/src/tool/bg.rs"
          dependencies: ["T011"]
          acceptance_criteria:
            - "The tool schema documents nondestructive stale inspection and explicit opt-in termination by stable task identity."
            - "Dry-run is the default inspection behavior; destructive action is explicit and never inferred from cleanup intent alone."
            - "Formatted output explains what would be or was terminated and why refusals failed closed."
