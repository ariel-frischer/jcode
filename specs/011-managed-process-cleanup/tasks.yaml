      purpose: "Exercise the full managed lifecycle through focused tests and a newly built isolated runtime."
      story_reference: "US-004"
      independent_test: "Use the newly built jcode binary and private socket to time out a managed process tree, list it, cancel or explicitly clean it, and inspect the server descendants and zombie count."
