feature:
  branch: "agent/jcode-6gp-disk-safety"
  created: "2026-08-23"
  status: "Approved"
  input: >-
    Complete Bead jcode-6gp by adding explicit disk headroom reporting, a
    configurable broad-Cargo preflight, and fail-closed cleanup of stale Jcode
    worktree target directories without deleting source, branches, worktrees,
    active sessions, dirty work, recent artifacts, or unrelated paths.
user_stories:
  - id: "US-001"
    title: "See disk pressure before broad validation"
    priority: "P0"
    as_a: "Jcode developer"
    i_want: "a bounded report and reserve check before broad Cargo work"
    so_that: "validation cannot silently consume the final filesystem reserve"
    acceptance_scenarios:
      - given: "free space is at or above the configured reserve"
        when: "the disk check or broad guardrails run"
        then: "the check passes and the existing guardrail sequence continues"
      - given: "free space is below the configured reserve"
        when: "broad guardrails run"
        then: "the command fails before Cargo with report and cleanup guidance"
  - id: "US-002"
    title: "Reclaim only safe generated artifacts"
    priority: "P0"
    as_a: "Jcode developer"
    i_want: "cleanup to be reviewable and fail closed"
    so_that: "I can reclaim stale Cargo artifacts without losing work"
    acceptance_scenarios:
      - given: "cleanup is invoked without an explicit apply flag"
        when: "eligible targets are found"
        then: "the command reports what would be removed and deletes nothing"
      - given: "an eligible target remains registered, contained, inactive, clean, and old"
        when: "explicit apply is requested"
        then: "only that target directory is removed and reclaimed bytes are reported"
      - given: "activity, dirty state, recency, registration, or containment is uncertain"
        when: "cleanup evaluates or revalidates a target"
        then: "the target is excluded or cleanup refuses before deleting it"
requirements:
  functional:
    - id: "FR-001"
      statement: "A repository command MUST report filesystem free space and bounded per-worktree Cargo target usage."
    - id: "FR-002"
      statement: "Broad guardrails MUST run a configurable inclusive free-space threshold check before the first Cargo command."
    - id: "FR-003"
      statement: "Cleanup MUST default to dry-run and require an explicit apply flag for deletion."
    - id: "FR-004"
      statement: "Cleanup candidates MUST be registered in-repository non-main worktrees with direct non-symlink target directories that are inactive, clean, readable, and older than the configured age."
    - id: "FR-005"
      statement: "Apply MUST revalidate registration, containment, activity, dirty state, and newest-artifact age immediately before removal."
    - id: "FR-006"
      statement: "Cleanup MUST remove only selected generated target directories and report logical bytes reclaimable or reclaimed."
    - id: "FR-007"
      statement: "Malformed configuration or uncertain live-session metadata MUST fail closed with actionable diagnostics."
    - id: "FR-008"
      statement: "Make targets and developer documentation MUST cover report, check, dry-run, apply, threshold precedence, exclusions, and rebuild expectations."
  non_functional:
    - id: "NFR-001"
      statement: "Focused temporary-fixture tests MUST cover threshold boundaries, malformed settings, containment, active/dirty/recent exclusions, dry-run, apply, and deletion-time revalidation."
    - id: "NFR-002"
      statement: "The implementation MUST use Python standard library, Git worktree metadata, and existing repository scripts without adding dependencies or weakening guardrails."
scope:
  owns:
    - "Makefile"
    - "scripts/check_guardrails.sh"
    - "scripts/disk_safety.py"
    - "scripts/test_disk_safety.py"
    - "docs/DISK_SAFETY.md"
    - "docs/README.md"
    - "specs/016-worktree-disk-safety/"
  reuses:
    - "Git worktree list --porcelain"
    - "JCODE_HOME active_pids and sessions metadata"
    - "scripts/check_guardrails.sh ordering"
  non_goals:
    - "Deleting source directories, Git branches, or whole worktrees"
    - "Automatic background cleanup"
    - "Changing Cargo cache architecture"
    - "Touching Locus, Dolt, provider credentials, or unrelated user files"
constraints:
  - "No live cleanup apply command may be executed during validation."
  - "Apply behavior is validated only against temporary fixtures."
  - "Broad Cargo validation runs only after the reserve preflight reports adequate space."
