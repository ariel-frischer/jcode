implementation_phases:
  - phase: 1
    name: "Freeze inventory and acceptance matrix"
    goal: "Turn the scratch attribution and independent review into complete durable, reviewable inputs before changing any baseline."
    deliverables:
      - "Record the baseline commits, current values, owning commit candidates, owning Beads, and merged-state evidence for all 74 production-size, 31 test-size, and 36 swallowed-error path deltas."
      - "Split mixed or aggregate deltas so intentional and unexplained portions are independently measurable."
      - "Inventory every applicable independent review comment by stable identifier and assign an initial disposition."
      - "Map FR-001 through FR-014 and SC-001 through SC-005 to direct checks in validation.md."
  - phase: 2
    name: "Restore blocker-branch no-growth"
    goal: "Make every changed already-oversized file flat or smaller than branch base 85f9f5e3b without altering accepted behavior."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Eliminate the positive blocker-branch LOC deltas in bash.rs, telemetry-core/lib.rs, and state_ui_input_helpers.rs."
      - "Verify all other changed oversized production and test files are flat or smaller independently."
      - "Preserve compile, Clippy, warning, panic, explicit-error, and focused behavior repairs."
      - "Run focused tests and changed-surface ratchets before continuing."
  - phase: 3
    name: "Implement provenance and review gates"
    goal: "Make ownership and review completeness mechanically enforceable before baseline reconciliation."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Add the canonical JSON provenance ledger with complete delta and review-disposition records."
      - "Add the standard-library provenance validator and focused failure fixtures."
      - "Register the validator in scripts/check_guardrails.sh before the three affected ratchets."
      - "Reject missing owners, mismatched values, invalid commit ancestry, unresolved review concerns, and duplicate or incomplete records."
  - phase: 4
    name: "Reconcile traced intentional state"
    goal: "Update only approved scopes while leaving every untraced or questionable delta failing."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Reconcile code-size, test-size, and swallowed-error budgets only for ledger entries accepted by review."
      - "Keep unrelated budget entries byte-for-byte unchanged where practical and explain any deterministic serialization-only differences."
      - "Record implemented, rejected-with-evidence, or out-of-scope outcomes for every independent review comment."
      - "Run focused ratchets and prove a controlled positive delta is rejected for every affected enforcement dimension."
  - phase: 5
    name: "Validate behavior, guardrails, and built product"
    goal: "Produce one internally consistent acceptance run across focused, broad, and distributable-product boundaries."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Focused behavior and error-path tests pass with no coverage removed merely to satisfy size limits."
      - "Provenance validator and all three focused ratchets pass."
      - "scripts/check_guardrails.sh passes on stable with all targets and features and unrelated thresholds unchanged."
      - "The selfdev binary is built and public plus integration scenarios pass on an isolated socket."
      - "Final branch-base file-size audit, scope-to-diff review, independent review dispositions, and validation receipts are recorded in validation.md and the Bead."

