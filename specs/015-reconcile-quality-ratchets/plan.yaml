plan:
  branch: "agent/jcode-l89.5-restore-guardrails"
  created: "2026-08-22"
  spec_path: "specs/015-reconcile-quality-ratchets/spec.yaml"

summary: |
  Restore the code-size, test-size, and swallowed-error guardrails through a
  traced reconciliation rather than a repository-wide refactor or an automatic
  `--update`. First make the blocker branch flat or smaller in every modified
  already-oversized file, preserving explicit error propagation and the focused
  behavior fixes already reviewed. Then build a complete inventory from each
  committed baseline to the current merged state, classify every delta by owning
  commit and Bead, and record every independent PR-review concern with a stable
  disposition. Untraced, reverted, superseded, or questionable growth remains a
  failure and is not included in a reconciled baseline.

  Keep the existing Python ratchet scripts and JSON budgets as the enforcement
  authority. Add one repository-local JSON provenance ledger and a standard-library
  Python validator that cross-checks ledger records, baseline values, owning Git
  commits, reconciliation ownership, bounded historical-Bead search results, and
  review dispositions before the three ratchets run.
  Reconcile only the approved ledger entries into the existing budgets, retain the
  current per-file, per-pattern, and total no-growth checks, add controlled negative
  tests proving future growth is rejected, and finish with focused behavior tests,
  serialized all-feature guardrails, and isolated built-binary public and integration
  validation.

technical_context:
  language: "Rust 2024 application with Python 3 quality guardrails and Bash orchestration"
  framework: "Cargo workspace, Rust test harness, Tokio tests, repository-local Python ratchets"
  primary_dependencies:
    - name: "Cargo and stable Rust toolchain"
      version: "stable, workspace edition 2024"
      purpose: "Compile all targets and features, run focused tests, Clippy, and build the distributable binary."
    - name: "Python standard library"
      version: "Python 3"
      purpose: "Run and extend JSON-backed code-size, test-size, swallowed-error, and provenance validators without adding a dependency."
    - name: "Git"
      version: "repository-local"
      purpose: "Verify baseline snapshots, owning commits, merged ancestry, branch-base file deltas, and unchanged unrelated budgets."
    - name: "Beads bd CLI"
      version: "repository-local"
      purpose: "Resolve durable ownership and acceptance context for each intentional historical delta."
    - name: "scripts/check_guardrails.sh"
      version: "repository-local"
      purpose: "Canonical all-feature formatting, build, Clippy, ratchet, dependency, and state-space delivery gate."
  storage: "Committed JSON budgets plus scripts/quality_ratchet_provenance.json and specs/015-reconcile-quality-ratchets/validation.md; no runtime or user-data storage changes."
  testing:
    framework: "Python unittest or subprocess fixtures, Rust test harness with Tokio where applicable, and isolated built-binary smoke tests"
    approach: "Validate inventory and branch deltas first, add focused provenance and negative ratchet tests, run affected behavior/error-path tests, then one serialized canonical guardrail run and private-socket built-binary validation."
  target_platform: "Supported Jcode development and release hosts, with primary validation on Linux x86_64 and existing cross-platform Cargo checks"
  project_type: "cli"
  performance_goals: "No runtime behavior or maintained performance-budget regression; provenance validation remains deterministic and fast enough for every guardrail run."
  constraints:
    - "Do not use automatic ratchet update output as ownership evidence."
    - "Only deltas traced to intentional commits that are ancestors of the accepted merged state may be reconciled."
    - "Every reconciled delta must include previous and new values, causal source commit, reconciliation Bead, bounded source-Bead search result, and PR-review disposition; never fabricate missing historical ownership."
    - "Untraced, reverted, superseded, or disputed deltas remain rejected."
    - "The blocker branch must be flat or smaller against 85f9f5e3b in every modified already-oversized file, including current positive deltas in bash.rs, telemetry-core/lib.rs, and state_ui_input_helpers.rs."
    - "Preserve existing observable behavior, test coverage, explicit error handling, and unrelated budget values."
    - "Keep existing per-file, aggregate, and per-pattern no-growth enforcement after reconciliation."
    - "Serialize Cargo-heavy validation and use a private socket for runtime checks so the shared daemon is not disturbed."
    - "Independent review dispositions must be complete before any baseline mutation is accepted."
  scale_scope: "One repository-wide historical reconciliation covering the currently reported 74 production-size, 31 test-size, and 36 swallowed-error path deltas, plus the blocker branch changed surface."

