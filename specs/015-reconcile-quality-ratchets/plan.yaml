research_findings:
  decisions:
    - topic: "Reconciliation versus repository-wide source repair"
      decision: "Repair only blocker-branch growth, then reconcile fully traced intentional historical merged growth."
      rationale: "The active Bead clarification explicitly rejects a refactor across 74 production and 31 test files. This restores meaningful no-growth enforcement while keeping the change reviewable."
      alternatives_considered:
        - "Refactor every oversized production and test file below its old baseline"
        - "Run scripts/check_guardrails.sh --fix and accept all current values"
        - "Disable or exempt stale paths"
    - topic: "Durable provenance location"
      decision: "Add scripts/quality_ratchet_provenance.json as the canonical ledger and validate it from scripts/check_guardrails.sh."
      rationale: "JSON matches the existing budget format, needs no new parser dependency, is reviewable beside the guardrails, and can represent cross-category ownership and review records without overloading enforcement budgets."
      alternatives_considered:
        - "Put prose only in a Bead comment or temporary scratch artifact"
        - "Embed large provenance objects independently in all three budget files"
        - "Use YAML and add a Python YAML dependency"
    - topic: "Provenance validation"
      decision: "Cross-check required fields, unique category/scope records, previous and reconciled values, current budget membership, causal source commit existence and accepted ancestry, reconciliation Bead syntax, bounded source-Bead search results, and stable review dispositions."
      rationale: "A ledger that is not mechanically tied to the budgets can drift and conceal unexplained growth. Git and JSON checks provide deterministic local evidence."
      alternatives_considered:
        - "Human review only"
        - "Trust commit subjects without ancestry checks"
        - "Accept one aggregate record per category"
    - topic: "Independent PR-review handling"
      decision: "Inventory each applicable comment by stable identifier and record implemented, rejected-with-evidence, or out-of-scope dispositions before reconciliation."
      rationale: "The spec requires transparent outcomes for all applicable independent feedback, and the existing review already identified branch no-growth and exceptional-behavior concerns."
      alternatives_considered:
        - "Record only accepted comments"
        - "Summarize the review without per-comment identifiers"
    - topic: "No-growth proof after reconciliation"
      decision: "Retain the existing ratchet algorithms and add fixture-based controlled positive-delta tests for code size, test size, per-pattern swallowed errors, per-file swallowed errors, and aggregate swallowed errors."
      rationale: "A passing reconciled snapshot alone does not prove that future growth is still rejected. Negative tests directly cover FR-010 and SC-004."
      alternatives_considered:
        - "Rely only on the current repository passing"
        - "Loosen aggregate checks while keeping per-file checks"
    - topic: "Acceptance ordering"
      decision: "Run inventory and focused checks before the single serialized canonical guardrail run, then validate the built binary on an isolated socket."
      rationale: "This follows repository feedback-loop rules, avoids repeated expensive Cargo runs, and ensures runtime evidence measures the built change rather than the shared daemon."
      alternatives_considered:
        - "Run the full guardrail suite after every ledger edit"
        - "Test through the long-lived shared-server binary"

data_model:
  entities:
    - name: "Baseline Delta Provenance"
      description: "One independently reviewable historical transition for one quality category and measured scope."
      fields:
        - name: "id"
          type: "string"
          description: "Stable ledger identifier."
          constraints: "Unique and immutable."
        - name: "category"
          type: "enum"
          description: "Quality ratchet owning the delta."
          constraints: "code_size, test_size, or swallowed_error."
        - name: "scope"
          type: "string"
          description: "Repository path and, for swallowed errors, optional pattern dimension."
          constraints: "Must resolve to the corresponding budget entry."
        - name: "previous_value"
          type: "integer or pattern-count object"
          description: "Accepted value in the referenced historical baseline."
          constraints: "Must match the baseline snapshot or be explicitly marked new."
        - name: "reconciled_value"
          type: "integer or pattern-count object"
          description: "Approved value in the reconciled budget."
          constraints: "Must match the committed budget and may not include untraced growth."
        - name: "baseline_commit"
          type: "Git object ID"
          description: "Commit containing the prior accepted budget."
          constraints: "Must exist."
        - name: "owning_commits"
          type: "list of Git object IDs"
          description: "Intentional merged commits accounting for the measured delta."
          constraints: "Non-empty; every commit must exist and be in accepted ancestry."
        - name: "reconciliation_bead"
          type: "Bead ID"
          description: "Durable ownership for the reconciliation decision."
          constraints: "Required and resolvable during review."
        - name: "source_bead_search"
          type: "object"
          description: "Bounded search evidence for historical Beads associated with the causal commits."
          constraints: "Records queries and either matching Bead IDs or an explicit not_found result; historical ownership is never fabricated."
        - name: "source_beads"
          type: "list of Bead IDs"
          description: "Historical work ownership found by the bounded search."
          constraints: "May be empty only when source_bead_search records not_found; every listed Bead must be resolvable."
        - name: "review_disposition_ids"
          type: "list of strings"
          description: "Links the delta to independent review outcomes."
          constraints: "Every identifier must resolve to a ledger disposition."
        - name: "merged_state_evidence"
          type: "string"
          description: "Bounded explanation of why the current state is intentional and active."
          constraints: "Must not rely only on a commit subject or temporary scratch file."
      relationships:
        - target: "Quality Ratchet"
          type: "many-to-one"
          description: "Each provenance record justifies one reconciled ratchet scope."
        - target: "PR Review Disposition"
          type: "many-to-many"
          description: "One review concern may affect several deltas and one delta may address several concerns."
        - target: "Validation Evidence"
          type: "many-to-many"
          description: "Focused and final checks prove the reconciled record is enforced and behavior-preserving."
    - name: "PR Review Disposition"
      description: "Durable outcome for one applicable independent review concern."
      fields:
        - name: "id"
          type: "string"
          description: "Stable comment, review, or Bead-comment identifier."
          constraints: "Unique and non-empty."
        - name: "source"
          type: "string"
          description: "PR URL, review identifier, or durable Bead comment identifier."
          constraints: "Must be reviewable without temporary local state."
        - name: "concern"
          type: "string"
          description: "Bounded statement of the reviewed issue."
          constraints: "Non-empty."
        - name: "disposition"
          type: "enum"
          description: "Final outcome."
          constraints: "implemented, rejected_with_evidence, or out_of_scope."
        - name: "evidence"
          type: "string"
          description: "Commit, test, diff, or policy evidence supporting the outcome."
          constraints: "Required for every disposition."
      relationships:
        - target: "Baseline Delta Provenance"
          type: "many-to-many"
          description: "Review outcomes govern one or more reconciled deltas."
    - name: "Quality Ratchet"
      description: "The existing enforceable JSON budget plus its Python checker."
      fields:
        - name: "category"
          type: "enum"
          description: "Code size, test size, or swallowed errors."
          constraints: "Exactly one existing canonical checker."
        - name: "baseline"
          type: "JSON object"
          description: "Accepted per-scope and aggregate values."
          constraints: "Unrelated values unchanged; reconciled values backed by provenance."
        - name: "violation_condition"
          type: "predicate"
          description: "Future positive growth rejected."
          constraints: "Existing behavior retained and covered by negative tests."
      relationships:
        - target: "Baseline Delta Provenance"
          type: "one-to-many"
          description: "Each adjusted scope has one or more complete ownership records."
    - name: "Validation Evidence"
      description: "Committed acceptance matrix and command results for focused, broad, behavior, and built-product checks."
      fields:
        - name: "requirement_ids"
          type: "list of strings"
          description: "Spec requirements proven by the evidence."
          constraints: "Every FR and measurable outcome must map to a direct check."
        - name: "command"
          type: "string"
          description: "Exact non-secret validation command."
          constraints: "Uses the intended worktree and binary."
        - name: "result"
          type: "enum"
          description: "Observed outcome."
          constraints: "pass, fail, or explicitly approved blocked."
        - name: "artifact"
          type: "string"
          description: "Relevant diff, log, built binary, socket, or fixture reference."
          constraints: "Durable or reproducible."
      relationships:
        - target: "Quality Ratchet"
          type: "many-to-many"
          description: "Evidence proves focused enforcement and complete guardrail stability."

