      story_reference: "US-003"
      independent_test: "Scroll to an earlier transcript position, type and paste multiline content, resize repeatedly, trigger credit and identity updates, and render with panes, overlays, scrollbars, status, and input while comparing the visible anchor and editor state before and after."
