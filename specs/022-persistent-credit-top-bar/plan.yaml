implementation_phases:
  - phase: 1
    name: "Configuration and presentation contracts"
    goal: "Define the additive opt-out and one safe renderer-facing snapshot without changing layout yet."
    deliverables:
      - "Add `display.top_bar` with serde/default behavior, generated-config documentation, effective summary output, and focused true/missing/false/round-trip tests."
      - "Define presentation-only top-bar context, credit-state, field, layout, and suppression types in jcode-tui."
      - "Expose existing session, provider, model, safe auth, reasoning, usage freshness, and usage progress through the minimal TuiState/App adapters needed by the renderer."
      - "Add negative tests proving raw credentials and provider error strings cannot enter the top-bar snapshot."
  - phase: 2
    name: "Deterministic adaptive selection and rendering"
    goal: "Produce width-safe zero-to-three-row top-bar lines from fixed-priority existing data."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Implement full/compact/hidden field variants with session and credit as immutable highest priorities."
      - "Implement known, pending, stale, unavailable, and not-applicable credit formatting for subscription, cost-based, and token-only providers."
      - "Use unicode-width-aware truncation and line-fit assertions for long identifiers, emoji, combining characters, and wide glyphs."
      - "Add pure size-table and 100-refresh stability tests proving deterministic row count and field selection."
  - phase: 3
    name: "First-class session layout integration"
    goal: "Make the top bar persistent without overlap or duplicate scrollable identity content."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Select row count from full session geometry and maintained minimum-content rules before allocating panes, transcript, status, inline UI, and input regions."
      - "Render the top bar in its own rectangle and extend layout/visual-debug snapshots with its bounds, fields, row count, and suppression reason."
      - "Separate the current rich startup header from active-session persistent chrome, omit duplicate identity lines when enabled, and preserve the current prepared-header path when disabled."
      - "Add rendered narrow/short/standard/wide/roomy and disabled comparisons proving zero overlap, at most three rows, and exact row reclamation when disabled."
  - phase: 4
    name: "Live updates and interaction stability"
    goal: "Refresh identity and credit values at the current source cadence while preserving the user's view and editor state."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Invalidate or refresh the top-bar snapshot on session, provider, model, auth, reasoning, usage progress, usage freshness, config, and terminal-size changes without invalidating unrelated transcript preparation."
      - "Preserve visible transcript anchors when bar content or row count changes during scrollback, typing, single-line paste, multiline paste, streaming, and repeated resize."
      - "Preserve input bytes and logical cursor position while multiline input, status rows, inline UI, notifications, panes, scrollbars, and active-session overlays coexist."
      - "Add App/TestBackend regressions for rapid usage updates, stale-to-fresh transitions, provider switches, and zero crashes or misleading values on missing/malformed optional data."
  - phase: 5
    name: "Performance and runtime validation"
    goal: "Prove the feature meets interactive budgets and behaves in the actual built TUI runtime."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Run focused jcode-config-types and jcode-tui tests first, including exact top-bar, usage, layout, scroll, and smoothness checks."
      - "Measure or attribute top-bar frame work and verify no blocking auth, filesystem, or network operations occur during rendering and that interaction responsiveness remains within the 100 ms target."
      - "Run formatting, the relevant TUI build, and `scripts/check_guardrails.sh` serially."
      - "Launch the newly built binary on an isolated socket, verify executable identity, exercise live scrollback/typing/paste/resize/config-off behavior, and capture debug-socket frames showing stable non-overlapping regions."

