plan:
  branch: "022-persistent-credit-top-bar"
  created: "2026-09-01"
  spec_path: "specs/022-persistent-credit-top-bar/spec.yaml"

summary: |
  Add the persistent credit top bar as client-owned Jcode TUI chrome rather than as another transcript message or server contract. The existing `ui_header.rs` already formats session, server, client, model, connection, and safe authentication identity, but `ui_prepare.rs` currently composes that header into the scrollable transcript. The implementation will extract a compact, adaptive presentation into a focused top-bar module, allocate its zero-to-three rows before pane and chat layout, and keep the richer startup/header content available without duplicating it in active conversations. Setting `display.top_bar = false` will preserve the current bar-free layout and reserve zero rows.

  A pure layout selector will derive prioritized fields from existing `TuiState` accessors and existing usage caches, then choose deterministic full, compact, or hidden representations based on display-cell width and the remaining usable height. Session identity and an explicit provider-credit state remain highest priority; model, provider, safe auth method, reasoning, server/client, connection, and version details are progressively compacted or removed. Credit rendering will distinguish known, pending, stale, unavailable, and not-applicable states without issuing network requests from the render path. Focused Ratatui `TestBackend`, scroll-anchor, input/cursor, pane/overlay, Unicode-width, refresh, and runtime checks will prove that updates remain stable and responsive.

technical_context:
  language: "Rust 2024 edition"
  framework: "Ratatui 0.30 and Crossterm 0.29 TUI"
  primary_dependencies:
    - name: "ratatui"
      version: "0.30"
      purpose: "Allocate and render the adaptive top-bar region alongside the existing transcript, pane, status, and input regions."
    - name: "unicode-width"
      version: "0.2"
      purpose: "Measure, truncate, and compact labels by terminal display cells without splitting wide Unicode or combining text into adjacent regions."
    - name: "serde"
      version: "1"
      purpose: "Add the backward-compatible boolean field to the existing persisted display configuration contract."
    - name: "jcode-app-core and jcode-usage-types"
      version: "workspace path dependencies"
      purpose: "Reuse the active session/provider identity, authentication, reasoning, cached usage, and provider usage progress data already owned by the runtime."
  storage: "Existing TOML configuration only. The top-bar preference is persisted under `[display]`; all top-bar content and layout state remain transient client presentation state."
  testing:
    framework: "Rust built-in test framework with Ratatui TestBackend, existing visual-debug/layout snapshots, and debug-socket runtime probes"
    approach: "Add pure formatting and deterministic layout-selection tests; configuration default, disabled, and round-trip tests; rendered size-matrix and Unicode tests; App-level usage-state refresh tests; scroll-anchor and input/cursor stability tests during typing, paste, resize, and top-bar height changes; pane, scrollbar, and overlay coexistence tests; focused jcode-config-types and jcode-tui checks; a TUI build, guardrails, and an isolated-socket smoke against the newly built binary."
  target_platform: "Jcode TUI on supported Linux, macOS, and Windows terminal targets"
  project_type: "cli"
  performance_goals: "Keep top-bar derivation and rendering bounded to a small fixed field set with no blocking I/O or network work in the frame path; preserve the specification target that at least 95% of typing and paste interactions render within 100 ms; and keep the selected row count and field set identical across 100 unchanged refreshes."
  constraints:
    - "Reuse existing session, server, client, model, provider authentication, reasoning, and usage sources; do not create a second source of truth or a new provider billing integration."
    - "Render zero to three top-bar rows, normally one or two, and allow three only when the remaining session surface stays usable."
    - "Preserve at least the existing minimum scrollable transcript allocation plus the complete status, inline UI, input, and required chrome before reserving optional top-bar rows."
    - "Allocate top-bar bounds before transcript, pane, scrollbar, and non-replacement overlay bounds so no region overlaps another."
    - "Preserve the visible transcript anchor, composed text, and logical cursor position while data, input height, or terminal dimensions change."
    - "Display only safe provider identity and authentication state; never render tokens, secrets, full sensitive account identifiers, or provider error text that may contain credentials."
    - "A disabled top bar must reserve zero rows and follow the current layout/header path without changing session behavior or usage data availability."
    - "Use display-cell-aware truncation for long paths, identifiers, emoji, combining text, and wide characters."
    - "Serialize Rust builds, tests, Clippy, and guardrail execution on the resource-constrained development machine."
  scale_scope: "One active TUI session, a fixed set of approximately eight candidate fields, zero to three rendered rows, and the existing provider usage snapshot/update cadence."

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "PRIN-001 Surgical, Scope-Bound Changes"
      status: "PASS"
      notes: "The plan is limited to the existing TUI header/layout/state seams, one display boolean, focused usage presentation adapters, tests, and default-config documentation. It excludes provider integrations, protocol changes, and unrelated UI refactors."
    - name: "PRIN-002 Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "The config field is additive with a serde default, no wire or persisted session shape changes, and `display.top_bar = false` retains the current bar-free allocation and scrolling-header behavior. The specification explicitly approves the new default-enabled presentation while preserving an exact opt-out path."
    - name: "PRIN-003 Explicit Configuration Precedence"
      status: "PASS"
      notes: "One canonical `display.top_bar` resolver will use the persisted boolean when present and the built-in documented default of true when absent. No duplicate CLI, environment, or per-session override path is introduced."
    - name: "PRIN-004 Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "Adaptive layout and transient display state remain in jcode-tui. Existing jcode-app-core and jcode-usage-types data flow upward through `TuiState`; no lower crate depends on presentation code, and no server, protocol, SDK, or desktop contract is added."
    - name: "PRIN-005 Focused Behavioral Tests"
      status: "PASS"
      notes: "Every functional requirement maps to pure selector/formatter, config, rendered size matrix, usage-state, scroll/input stability, or region coexistence checks before package and runtime validation."
    - name: "PRIN-006 Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "Missing, stale, pending, malformed, unsupported, and error-bearing usage snapshots map to explicit safe display states. Authentication and provider errors are normalized rather than rendered verbatim, preventing secret-bearing text from entering screen captures."
    - name: "PRIN-007 Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "Delivery includes focused package tests, formatting, the relevant TUI build, scripts/check_guardrails.sh, and runtime verification against the newly built binary."
    - name: "PRIN-008 Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The design extends Ariel's existing custom session header, info-widget usage, named-session identity, and visual-debug paths instead of importing a parallel header framework or new extension mechanism."
    - name: "PRIN-009 Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "The phases deliver the visible identity and credit outcome, an exact opt-out, deterministic constrained-terminal behavior, interaction stability, and runtime evidence without requiring destructive or external side effects."
    - name: "PRIN-010 Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "The render path uses cached non-blocking snapshots and fixed-size selection work; tests include unchanged-frame stability and interaction latency evidence, followed by an isolated-socket smoke using the newly built TUI binary."

research_findings:
  decisions:
    - topic: "Existing header behavior"
      decision: "Treat `crates/jcode-tui/src/tui/ui_header.rs` as the formatting source to reuse, but render the new compact top bar outside the prepared transcript. Preserve the current rich, scrollable header path when the top bar is disabled and avoid duplicate identity rows when it is enabled."
      rationale: "The function named `build_persistent_header` already contains robust session, server/client version, model, connection, and safe auth formatting, but `ui_prepare.rs` appends it to the scrollable `PreparedChatFrame`; it therefore cannot satisfy persistent visibility by itself."
      alternatives_considered:
        - "Add credit lines to the existing prepared transcript header and leave it scrollable."
        - "Build an unrelated second identity formatter with duplicated provider/auth logic."
        - "Move header ownership to the shared server or protocol."
    - topic: "Canonical feature ownership"
      decision: "Own top-bar snapshot derivation, adaptive selection, and rendering in jcode-tui, with renderer-facing state supplied through the existing `TuiState` presentation boundary."
      rationale: "The feature is transient client chrome. The server remains authoritative for sessions and shared provider data, while the TUI already owns terminal layout, scroll anchors, auth-safe labels, and usage widgets."
      alternatives_considered:
        - "Add a top-bar protocol message."
        - "Persist rendered top-bar rows in session state."
        - "Add top-bar logic to jcode-config-types or jcode-usage-types."
    - topic: "Top-level layout allocation"
      decision: "Select the top-bar height first, split the active session surface into top-bar and remaining-content rectangles, and run the existing diagram/side-pane/chat layout inside the remaining rectangle. Replacement surfaces may intentionally own the full screen; active-session overlays must use the remaining content bounds."
      rationale: "A first-class rectangle makes non-overlap structural rather than dependent on late collision detection and lets the bar span the usable session width without competing with transcript margins or native scrollbars."
      alternatives_considered:
        - "Draw over the first transcript rows as a late overlay."
        - "Place the bar inside only the chat message rectangle after pane splitting."
        - "Insert top-bar rows into `PreparedChatFrame`."
    - topic: "Deterministic adaptive policy"
      decision: "Use a pure selector with fixed field priorities and explicit full, compact, and hidden variants. Preserve session identity and credit state first; then provider/model, auth/reasoning, server/client/connection/version context. Suppress the entire bar before violating the maintained minimum content and input allocation."
      rationale: "A pure width/height/data function is deterministic, directly testable across a terminal matrix, resistant to oscillation, and easy to keep within the zero-to-three-row contract."
      alternatives_considered:
        - "Let Ratatui wrapping choose rows implicitly."
        - "Use user-configurable arbitrary field templates."
        - "Always reserve a fixed two- or three-row header."
    - topic: "Credit and usage source"
      decision: "Normalize the active provider's existing `UsageData`, `OpenAIUsageData`, `UsageInfo`, and provider usage progress into a presentation-only credit state without fetching from the renderer. Reuse cache timestamps, `is_stale`, errors, hard-limit flags, limits, cost, and in-flight status where those values already exist."
      rationale: "The current usage subsystem already refreshes stale OAuth snapshots asynchronously and the info widget already maps active auth/provider routes to quota or cost displays. Reusing it avoids duplicate network work and keeps the current runtime as source of truth."
      alternatives_considered:
        - "Poll provider billing endpoints on every redraw."
        - "Start a separate top-bar usage cache."
        - "Show zero when no trustworthy usage value exists."
    - topic: "Credit-state semantics"
      decision: "Represent known, pending, stale, unavailable, and not-applicable as distinct states. A stale state may retain the last trustworthy value with an explicit stale marker; unknown and unsupported states never fabricate a zero balance."
      rationale: "Existing caches expose fetched timestamps, staleness, errors, and in-flight progress, while providers differ between subscription percentages, monetary cost, token-only usage, and no applicable credit reporting."
      alternatives_considered:
        - "Collapse every non-success outcome to `0% left`."
        - "Hide the credit field when unsupported or pending."
        - "Render raw provider error strings."
    - topic: "Configuration contract"
      decision: "Add `display.top_bar: bool` with a documented default of true and no parallel CLI or environment switch. False bypasses both row reservation and top-bar rendering."
      rationale: "This is the smallest practical opt-out, matches the specification, uses the existing serde-defaulted `DisplayConfig`, and creates one explainable resolution path."
      alternatives_considered:
        - "Add a multi-value mode or arbitrary template configuration."
        - "Add separate CLI, environment, and session overrides."
        - "Default the feature off, contrary to the accepted feature behavior."
    - topic: "Scroll and editing stability"
      decision: "Keep top-bar height outside transcript line accounting and preserve the existing distance-from-bottom/visible-line anchor semantics when the viewport height changes. Never mutate `scroll_offset`, input text, or logical cursor position merely because top-bar content changes."
      rationale: "The renderer already tracks resolved scroll, viewport height, history anchors, and layout snapshots. Treating the bar as chrome avoids changing transcript indices and enables direct before/after anchor checks."
      alternatives_considered:
        - "Compensate by inserting/removing synthetic transcript lines."
        - "Snap to the bottom whenever the bar changes height."
        - "Freeze the bar height permanently to avoid anchor work."
    - topic: "Width-safe rendering"
      decision: "Measure all candidates with `unicode-width`, truncate only at character boundaries, and ensure every emitted line has display width no greater than its rectangle."
      rationale: "The TUI already uses these helpers for copy selection, usage bars, inline UI, and status text; byte or scalar counts are incorrect for emoji, combining text, and East Asian wide glyphs."
      alternatives_considered:
        - "Use byte length or `chars().count()` for fit checks."
        - "Allow Ratatui to clip arbitrary spans after composition."
    - topic: "Performance and cache invalidation"
      decision: "Keep data normalization non-blocking and either include top-bar inputs in a small signature/cache or make the pure formatter cheap enough to rebuild. Invalidate on session/provider/model/auth/reasoning/usage/config/size changes, not on unrelated transcript appends."
      rationale: "Header preparation is already cached because auth inventory can be expensive; top-bar work must not reintroduce credential-file reads or transcript preparation on every animated frame."
      alternatives_considered:
        - "Reuse the existing header cache without adding usage and reasoning inputs to its signature."
        - "Probe credentials or usage endpoints synchronously during drawing."
        - "Invalidate the entire prepared transcript for each credit update."

data_model:
  entities:
    - name: "TopBarContext"
      description: "A presentation-safe snapshot of current session identity and optional context derived from existing TuiState and usage sources."
      fields:
        - name: "session_label"
          type: "String"
          description: "Shortest recognizable active session name or identifier."
          constraints: "Required whenever the bar is shown; sanitized and display-width bounded at render time."
        - name: "server_label"
          type: "Option<String>"
          description: "Safe remote server name, icon, version, or connection context."
          constraints: "Optional and lower priority than session and credit fields."
        - name: "client_label"
          type: "Option<String>"
          description: "Safe client/session identity and client version context."
          constraints: "Optional and never contains process secrets or raw connection credentials."
        - name: "provider_label"
          type: "Option<String>"
          description: "Active provider display identity."
          constraints: "Uses the resolved active provider route and omits placeholder or unknown labels when misleading."
        - name: "model_label"
          type: "Option<String>"
          description: "Friendly current model name."
          constraints: "Uses existing header formatting and may be compacted or hidden after core fields."
        - name: "auth_label"
          type: "Option<String>"
          description: "Safe authentication method or status such as OAuth, API key, connected, or unavailable."
          constraints: "Must never contain tokens, raw credentials, full sensitive account identifiers, or raw provider errors."
        - name: "reasoning_label"
          type: "Option<String>"
          description: "Current reasoning mode or effort when known."
          constraints: "Optional and lower priority than model/provider context."
        - name: "credit"
          type: "ProviderCreditState"
          description: "Normalized active-provider credit, quota, cost, or availability state."
          constraints: "Required whenever the bar is shown, including explicit unavailable or not-applicable states."
      relationships:
        - target: "ProviderCreditState"
          type: "one-to-one"
          description: "Each rendered session context carries exactly one normalized credit state for its active route."
        - target: "TopBarLayout"
          type: "one-to-one"
          description: "The pure selector converts one context plus terminal constraints into one layout."
    - name: "ProviderCreditState"
      description: "A non-misleading normalized view of provider capacity and freshness."
      fields:
        - name: "status"
          type: "Known | Pending | Stale | Unavailable | NotApplicable"
          description: "Explicit availability and freshness classification."
          constraints: "Unknown, unsupported, and failed states must not be represented as numeric zero."
        - name: "provider"
          type: "String"
          description: "Safe active provider display label."
          constraints: "May be compacted but must not expose account secrets."
        - name: "primary_summary"
          type: "Option<String>"
          description: "Highest-priority quota, remaining percentage, cost, or token summary."
          constraints: "Derived only from trustworthy existing data and uses the configured left-versus-used wording."
        - name: "secondary_summary"
          type: "Option<String>"
          description: "Optional secondary window, reset, or detail."
          constraints: "Hidden before the primary summary when space contracts."
        - name: "fetched_at"
          type: "Option<Instant>"
          description: "Existing cache timestamp used to classify freshness."
          constraints: "Transient and never persisted or serialized."
      relationships:
        - target: "TopBarContext"
          type: "one-to-one"
          description: "The active context owns the provider credit state displayed in the bar."
    - name: "TopBarField"
      description: "One candidate item with deterministic priority and width variants."
      fields:
        - name: "kind"
          type: "Session | Credit | ProviderModel | AuthReasoning | ServerClient | VersionConnection"
          description: "Semantic field category."
          constraints: "Session and Credit have the highest immutable priorities."
        - name: "priority"
          type: "u8"
          description: "Stable ordering used for compaction and removal."
          constraints: "Lower-priority fields are compacted or removed before higher-priority fields."
        - name: "full"
          type: "Line or Span sequence"
          description: "Most informative presentation."
          constraints: "Must fit by display width before selection."
        - name: "compact"
          type: "Option<Line or Span sequence>"
          description: "Shorter deterministic presentation."
          constraints: "Must retain the field's meaning and never turn unknown credit into zero."
      relationships:
        - target: "TopBarLayout"
          type: "many-to-one"
          description: "Selected fields are packed into the chosen zero-to-three-row layout."
    - name: "TopBarLayout"
      description: "The selected top-bar rectangle, rows, fields, and suppression outcome for one frame."
      fields:
        - name: "row_count"
          type: "u16"
          description: "Reserved top-bar height."
          constraints: "Always between zero and three; normally one or two."
        - name: "lines"
          type: "Vec<Line<'static>>"
          description: "Width-bounded Ratatui rows to render."
          constraints: "Length equals row_count and every line fits its rectangle."
        - name: "visible_fields"
          type: "Vec<TopBarFieldKind>"
          description: "Deterministic selected field set used for testing and visual debug."
          constraints: "Stable for unchanged size and context."
        - name: "suppression_reason"
          type: "Option<Disabled | TooNarrow | TooShort | NoSession>"
          description: "Why no rows were reserved."
          constraints: "Suppression must not mutate or delete source data."
      relationships:
        - target: "TopBarContext"
          type: "one-to-one"
          description: "One context and one terminal geometry produce one selected layout."
        - target: "TopBarField"
          type: "one-to-many"
          description: "The layout contains the selected field candidates."
    - name: "TopBarPreference"
      description: "The persisted user opt-out controlling whether the adaptive top bar may reserve space."
      fields:
        - name: "enabled"
          type: "bool"
          description: "Effective value of `display.top_bar`."
          constraints: "Defaults to true; false reserves and renders zero rows."
      relationships:
        - target: "TopBarLayout"
          type: "one-to-many"
          description: "The preference gates every frame's layout selection without altering its source data."

