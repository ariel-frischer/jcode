feature:
  branch: "022-persistent-credit-top-bar"
  created: "2026-09-01"
  status: "Draft"
  input: "Add a persistent adaptive Jcode TUI top bar that keeps core session identity and provider credit usage visible without harming chat readability. Reuse current server/client/model/provider-auth/reasoning and usage data. Prefer one or two rows, allow at most three on roomy terminals, compact or hide low-priority fields on narrow or short terminals, avoid overlap with transcript, panes, scrollbars, overlays, status and input chrome, preserve scroll position while typing or pasting, and add a practical config boolean to disable the bar."

user_stories:
  - id: "US-001"
    title: "See session identity and credit usage at a glance"
    priority: "P1"
    as_a: "Jcode TUI user"
    i_want: "the current session identity and provider credit usage to remain visible while I work"
    so_that: "I can verify my active context and monitor available provider capacity without interrupting the conversation"
    why_this_priority: "Persistent identity and credit awareness are the primary value of the feature."
    independent_test: "Open an active session with identity and credit data, scroll through a long conversation, and confirm the core information remains visible and current."
    acceptance_scenarios:
      - given: "an active session has server, client, model, provider authentication, reasoning, and usage information"
        when: "the user reads, scrolls, types, or pastes in the conversation"
        then: "the top bar continuously shows the highest-priority session identity and provider credit information"
      - given: "the active session or provider usage information changes"
        when: "the updated information becomes available to the TUI"
        then: "the top bar reflects the current values without requiring the user to reopen the session"
      - given: "a credit value is unavailable or not applicable"
        when: "the top bar is displayed"
        then: "the bar communicates the unavailable state without presenting a misleading numeric value"

  - id: "US-002"
    title: "Keep the conversation readable on every terminal"
    priority: "P1"
    as_a: "Jcode TUI user working across different terminal sizes"
    i_want: "the top bar to adapt its content and height to the available space"
    so_that: "important context stays visible without crowding or covering the transcript and controls"
    why_this_priority: "The bar is only useful if it does not degrade the primary chat experience."
    independent_test: "Resize an active TUI through narrow, short, standard, and roomy dimensions and verify the bar compacts or hides lower-priority fields while all other regions remain usable."
    acceptance_scenarios:
      - given: "a standard terminal with sufficient space"
        when: "the top bar is enabled"
        then: "the bar uses one or two rows and shows core information plus additional relevant context when space permits"
      - given: "a roomy terminal where a third row does not materially reduce chat readability"
        when: "additional session context is available"
        then: "the bar may use up to three rows without overlapping or displacing required interface chrome"
      - given: "a narrow or short terminal"
        when: "all available top-bar fields cannot fit"
        then: "lower-priority fields are compacted or hidden before core session identity and credit status"
      - given: "the terminal is too small to show a useful bar and retain a usable conversation area"
        when: "the layout is calculated"
        then: "the bar yields space rather than making the transcript or input unusable"

  - id: "US-003"
    title: "Maintain stable chat interaction"
    priority: "P1"
    as_a: "Jcode TUI user composing and reviewing messages"
    i_want: "top-bar updates and resizing to preserve my transcript position and editing context"
    so_that: "typing, pasting, and reviewing earlier messages remain predictable"
    why_this_priority: "Unexpected scroll movement or covered controls would directly disrupt core workflows."
    independent_test: "Scroll away from the newest message, type and paste multiline content, trigger top-bar value and layout changes, and verify the viewed transcript content and editor state remain stable."
    acceptance_scenarios:
      - given: "the user has scrolled to an earlier transcript position"
        when: "the user types or pastes text and the top bar updates"
        then: "the same transcript content remains anchored in view unless the user explicitly scrolls"
      - given: "the user is composing a message"
        when: "the bar changes height because of a resize or content change"
        then: "the input, cursor, status area, and visible transcript remain usable and do not overlap"
      - given: "a pane, scrollbar, or overlay is visible"
        when: "the top bar is rendered or updated"
        then: "each region retains its allocated space and remains visually distinct and operable"

  - id: "US-004"
    title: "Disable the top bar when desired"
    priority: "P2"
    as_a: "Jcode TUI user who prefers maximum transcript space"
    i_want: "a simple configuration setting that disables the top bar"
    so_that: "I can retain the existing bar-free experience when screen space or personal preference makes it preferable"
    why_this_priority: "The feature should be practical by default while respecting users who do not want persistent chrome."
    independent_test: "Run otherwise equivalent sessions with the setting enabled and disabled, then confirm the bar appears only when enabled and the reclaimed area belongs to the conversation layout."
    acceptance_scenarios:
      - given: "the top-bar configuration is disabled"
        when: "the TUI session is displayed"
        then: "no top-bar rows are reserved and the remaining interface uses the available space"
      - given: "the top-bar configuration is enabled or unspecified"
        when: "the TUI session is displayed"
        then: "the adaptive top bar is available according to terminal space and data availability"

requirements:
  functional:
    - id: "FR-001"
      description: "The TUI MUST provide a persistent top bar for active sessions when the feature is enabled and sufficient usable space exists."
      acceptance_criteria: "During transcript reading, scrolling, message composition, and message submission, the bar remains at the top of the session view unless space-safety rules temporarily suppress it."
    - id: "FR-002"
      description: "The top bar MUST prioritize a recognizable current session identity and provider credit usage or credit availability state."
      acceptance_criteria: "At every supported terminal size where the bar is shown, the displayed fields identify the active session and communicate current credit information or an explicit unavailable state."
    - id: "FR-003"
      description: "The top bar SHOULD expose additional existing context for server, client, model, provider authentication, and reasoning when space and data availability permit."
      acceptance_criteria: "On a roomy terminal with all listed data available, additional context is visible; removing space hides or compacts lower-priority context before core identity and credit information."
    - id: "FR-004"
      description: "The feature MUST use the session and usage information already available to the user and MUST NOT require duplicate user entry of identity, authentication, reasoning, or credit data."
      acceptance_criteria: "The bar can be populated in an existing active session without requesting any new identity, credential, model, reasoning, or usage input from the user."
    - id: "FR-005"
      description: "The bar MUST adapt field labels, values, and visibility to the terminal width according to a deterministic priority order."
      acceptance_criteria: "Repeated tests at the same width and data state produce the same visible fields, and reducing width compacts or removes lower-priority fields before higher-priority fields."
    - id: "FR-006"
      description: "The bar MUST adapt its row count to terminal height and width, normally using one or two rows and never exceeding three rows."
      acceptance_criteria: "Across supported terminal dimensions, the bar occupies zero to three rows; one or two rows are used at standard dimensions, and three rows occur only when the remaining conversation area stays usable."
    - id: "FR-007"
      description: "The layout MUST prevent the top bar from overlapping the transcript, panes, scrollbars, overlays, status area, input area, or other session chrome."
      acceptance_criteria: "With each listed region visible individually and in supported combinations, every region has distinct bounds and all text and controls remain accessible."
    - id: "FR-008"
      description: "The bar MUST surrender or reduce its space on narrow or short terminals before the transcript or message input becomes unusable."
      acceptance_criteria: "At constrained supported dimensions, the transcript retains visible content, the message input remains operable, and optional top-bar content is compacted, hidden, or the bar is suppressed."
    - id: "FR-009"
      description: "Top-bar content and layout updates MUST preserve the user's visible transcript position while the user is typing or pasting."
      acceptance_criteria: "When the user is scrolled away from the newest message, typing and multiline paste combined with bar updates do not change the transcript content anchored at the top of the transcript viewport."
    - id: "FR-010"
      description: "Top-bar updates MUST preserve message input content and cursor context."
      acceptance_criteria: "After credit, identity, reasoning, or terminal-size changes, the composed text remains unchanged and the editing cursor remains at the same logical position."
    - id: "FR-011"
      description: "Provider credit information MUST distinguish known values, unavailable values, stale or pending values when identifiable, and providers for which credit reporting does not apply."
      acceptance_criteria: "Test sessions representing each available state display a non-misleading, understandable state and never substitute a zero balance for an unknown or inapplicable value."
    - id: "FR-012"
      description: "Sensitive provider authentication details MUST NOT be exposed in the top bar; only a safe provider identity or authentication status MAY be shown."
      acceptance_criteria: "Visible bar text and captured screen output contain no secrets, tokens, credential material, or full sensitive identifiers."
    - id: "FR-013"
      description: "The TUI MUST provide a boolean configuration option that disables the top bar."
      acceptance_criteria: "With the option set to false, the bar is absent and reserves no rows; with the option set to true or left at its documented default, the adaptive behavior is active."
    - id: "FR-014"
      description: "Disabling or suppressing the top bar MUST NOT remove session identity or usage data from their existing sources or change session behavior."
      acceptance_criteria: "Equivalent sessions behave the same and retain existing data access whether the bar is shown, configured off, or temporarily suppressed for space."
    - id: "FR-015"
      description: "The top bar MUST refresh displayed values when the active session context or provider usage state changes."
      acceptance_criteria: "Changing any displayed source value results in the matching visible value changing without restarting or reopening the session, within the normal update cadence of that source."

  non_functional:
    - id: "NFR-001"
      category: "usability"
      description: "The top bar must preserve chat readability and make its highest-priority values understandable without requiring navigation."
      measurable_target: "In all supported layout test sizes, 100% of visible fields fit within their assigned rows without clipping into adjacent regions, and core identity plus credit state can be located within 2 seconds in a moderated usability check."
    - id: "NFR-002"
      category: "performance"
      description: "Bar updates and adaptive relayout must not introduce perceptible input lag during normal typing or multiline paste."
      measurable_target: "At least 95% of observed keystroke and paste interactions remain visually responsive within 100 milliseconds while the bar is visible and updating."
    - id: "NFR-003"
      category: "reliability"
      description: "Missing, delayed, malformed, or rapidly changing optional data must not destabilize the session view."
      measurable_target: "Across all defined unavailable-data and rapid-update tests, the TUI remains operable with zero crashes, zero overlap defects, and zero loss of composed input."
    - id: "NFR-004"
      category: "usability"
      description: "Adaptive changes must be visually stable rather than repeatedly oscillating between layouts for an unchanged terminal size."
      measurable_target: "For a fixed terminal size and fixed source values, the selected row count and field set remain unchanged across 100 consecutive refreshes."
    - id: "NFR-005"
      category: "code_quality"
      description: "The feature must preserve established behavior when disabled and remain compatible with existing session presentation states."
      measurable_target: "All existing supported transcript, pane, overlay, status, input, scrolling, typing, and paste scenarios pass with the bar disabled, and their enabled counterparts pass without region overlap."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can identify the active session and provider credit state at a glance while continuing their conversation."
      metric: "Time to correctly report active session identity and credit state from an open session"
      target: "At least 90% of representative users answer correctly within 2 seconds without opening another view."
    - id: "SC-002"
      description: "The top bar preserves usable chat space across supported terminal dimensions."
      metric: "Layout checks across narrow, short, standard, wide, and roomy terminal scenarios"
      target: "100% of supported scenarios have no region overlap, no hidden required input controls, and no more than three top-bar rows."
    - id: "SC-003"
      description: "Typing and pasting do not disturb the user's transcript review position."
      metric: "Anchored transcript-position checks during single-line typing, multiline typing, and large paste operations"
      target: "100% of checks preserve the same visible transcript anchor unless the user explicitly scrolls or submits an action that intentionally changes it."
    - id: "SC-004"
      description: "Users who disable the feature recover the full bar-free conversation layout."
      metric: "Comparison of available conversation rows with the feature disabled versus the prior bar-free layout at identical dimensions"
      target: "The disabled configuration reserves zero top-bar rows and provides the same usable conversation area as the bar-free layout."
    - id: "SC-005"
      description: "Credit information remains trustworthy when provider data is incomplete or unavailable."
      metric: "Correct representation of known, unknown, pending or stale, and not-applicable credit states"
      target: "100% of tested states are labeled without displaying a misleading zero or fabricated balance."

key_entities:
  - name: "Session identity"
    description: "The concise user-recognizable identity of the currently active Jcode session."
    attributes:
      - "session name or identifier"
      - "server and client context when available"
      - "active model"
      - "reasoning context"
  - name: "Provider credit state"
    description: "The provider-specific usage or remaining-credit information already available for the active session."
    attributes:
      - "provider identity"
      - "available or consumed amount"
      - "unit or period"
      - "freshness or availability state"
      - "safe authentication status"
  - name: "Top-bar presentation"
    description: "The adaptive visible summary selected for the current data and terminal space."
    attributes:
      - "visible fields"
      - "field priority"
      - "compactness level"
      - "row count"
      - "suppression state"
  - name: "Top-bar preference"
    description: "The user's boolean choice controlling whether the adaptive top bar may be displayed."
    attributes:
      - "enabled or disabled value"
      - "documented default"

edge_cases:
  - scenario: "Provider usage or credit reporting is unsupported for the active provider."
    expected_behavior: "The bar shows a concise not-applicable or unavailable state and continues to show session identity without inventing a balance."
  - scenario: "Usage data is temporarily delayed, stale, or fails to refresh."
    expected_behavior: "The last trustworthy state is clearly distinguished from current data when freshness is known; otherwise an unavailable state is shown without disrupting the TUI."
  - scenario: "Session identity or optional context contains long text, wide Unicode characters, combining characters, or emoji."
    expected_behavior: "Content is safely compacted or truncated within bar bounds, remains valid terminal text, and never overlaps another region."
  - scenario: "The terminal is resized repeatedly while the user is scrolled back and has unsent multiline input."
    expected_behavior: "The layout adapts within zero to three rows while preserving the transcript anchor, input text, and logical cursor position."
  - scenario: "A pane, overlay, status message, scrollbar, and multiline input are visible together."
    expected_behavior: "The bar respects all allocated regions; if space is insufficient, lower-priority bar content or the entire bar yields space first."
  - scenario: "The session switches model, provider, authentication state, or reasoning setting during use."
    expected_behavior: "Visible fields refresh to represent the active context without retaining misleading values from the previous context."
  - scenario: "Credit values change rapidly during streaming or repeated requests."
    expected_behavior: "The bar remains readable and stable, eventually reflects the current source state, and does not cause scroll jumps or input lag."
  - scenario: "The boolean option is disabled in a very small terminal."
    expected_behavior: "No top-bar space is reserved, and all other layout behavior matches the existing bar-free experience."

assumptions:
  - "The bar is enabled by default so users receive the requested persistent visibility, while a documented boolean setting provides opt-out behavior."
  - "Core session identity means the shortest existing session label or identifier that lets a user distinguish the active session."
  - "Provider credit usage includes whichever remaining-credit, consumed-usage, quota, reset-period, or availability state the active provider already exposes; not every provider exposes the same fields."
  - "A deterministic priority order can favor session identity and credit state over server, client, model, authentication status, reasoning, and detailed usage metadata."
  - "The existing TUI defines minimum supported terminal dimensions and existing behavior below those dimensions remains authoritative."
  - "A useful conversation area includes at least one visible transcript row and an operable message input plus required status chrome."
  - "The feature is informational and does not modify provider credits, authentication, model selection, or reasoning settings."

constraints:
  - "The bar must reuse existing server, client, model, provider-authentication, reasoning, and usage data rather than establishing a separate source of truth."
  - "The bar must normally occupy one or two rows and may occupy at most three rows only on roomy terminals."
  - "The bar must coexist with the transcript, panes, scrollbars, overlays, status area, input area, and existing session chrome."
  - "The feature must preserve scroll position while typing or pasting."
  - "No secret or sensitive authentication material may be displayed."

out_of_scope:
  - "Adding new provider billing, quota, or credit-reporting integrations where no usage data currently exists."
  - "Changing provider authentication, model selection, reasoning controls, or server and client connection behavior."
  - "Providing credit purchase, payment, quota management, or account administration actions."
  - "Replacing existing detailed usage views, status areas, panes, or overlays."
  - "Allowing arbitrary user-defined top-bar fields, ordering, colors, or multi-line templates beyond the enable-or-disable preference."
  - "Displaying raw credentials, tokens, or other sensitive provider-authentication details."

