implementation_phases:
  - phase: 1
    name: "Lock contracts and acceptance regressions"
    goal: "Define the versioned privacy-safe lifecycle model and create focused failing tests for configuration, recorder behavior, decision categories, persistence, query, cleanup, and compatibility."
    deliverables:
      - "LifecycleEventEnvelope, exhaustive LifecycleEvent variants, policy snapshot, status, stream, process reference, and warning contracts."
      - "Serialization fixtures for all categories and required compaction and handoff fields."
      - "Acceptance matrix tests covering every master/output switch combination, privacy seeds, ordering, unknown versions, and non-authoritative failures."
      - "Scanner compatibility fixtures with active and rotated lifecycle sidecars."
  - phase: 2
    name: "Implement configuration and bounded session storage"
    goal: "Provide one effective configuration path, internal sidecar persistence, fixed rotation and retention, resilient reads, and canonical artifact cleanup."
    dependencies:
      - "Phase 1"
    deliverables:
      - "[lifecycle_observability] defaults, environment overrides, generated config template, and effective /config status."
      - "Validated lifecycle sidecar and rotation path helpers beneath the sessions directory."
      - "Complete-record append, 1 MiB rotation, three-rotation retention, 30-day pruning, torn-tail tolerance, and newer-version warnings."
      - "Canonical session artifact enumerator and cleanup helper adopted by prepared-spawn and takeover rollback paths."
  - phase: 3
    name: "Implement the server-owned recorder and lifecycle emission"
    goal: "Create the single non-blocking recorder authority and route all supported runtime decisions through its typed API."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Server-owned Arc<LifecycleRecorder> injected into new, resumed, recovered, and handoff-created Agents."
      - "Per-session monotonic ordering, policy-fingerprint snapshots, bounded queue, flush barriers, privacy validation, persistence fan-out, and structured local log fan-out."
      - "Compaction decision and completion events with context usage, semantic reason, and suppression reason."
      - "Handoff staging, chain, prompt-size, todo-count, parent/child, acknowledgment, and terminal outcome events."
      - "Retry scheduling and exhaustion, transparent strategy-switch, and canonical tool, command-risk, run-safety, and handoff-policy block events."
      - "Opaque Background TaskStatusFile task IDs for any active long-running process correlation."
  - phase: 4
    name: "Expose structured per-session query and status"
    goal: "Let operators retrieve one retained lifecycle stream and effective output status through built-in protocol and CLI surfaces."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Additive GetLifecycleEvents and LifecycleEvents protocol variants with round-trip and compatibility tests."
      - "Server request handling that flushes accepted records, reads retained artifacts, and returns ordered supported events plus bounded warnings."
      - "Client API correlation helper and `jcode session lifecycle <session> --json` command with session-name resolution."
      - "Human output generated from the same typed result and automation-stable JSON that distinguishes every category."
      - "Maximally retained stream timeout assertion at or below two seconds."
  - phase: 5
    name: "Close privacy, compatibility, cleanup, and documentation"
    goal: "Prove lifecycle observability remains local, bounded, privacy-safe, and behaviorally invisible to established session workflows."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Seeded prompt, secret, command, output, environment, error, and todo text is absent from persistence, logs, and query results."
      - "Enabled-versus-disabled decision equivalence for compaction, handoff, retry, strategy switch, and block outcomes."
      - "Picker, search, productivity, crash recovery, import, export, replay, and cleanup compatibility with absent, active, rotated, expired, and disabled artifacts."
      - "Telemetry consent state remains unchanged under every lifecycle configuration combination."
      - "Lifecycle observability documentation covering schema, categories, fields, privacy, configuration, status, query examples, retention, warnings, and cleanup."
  - phase: 6
    name: "Validate integrated runtime and repository gates"
    goal: "Demonstrate the requested operator outcome with focused checks, affected crates, guardrails, and the newly built runtime."
    dependencies:
      - "Phase 5"
    deliverables:
      - "Focused session-types, base, app-core, protocol, CLI, TUI picker, productivity, import, export, and E2E tests pass."
      - "Serialized affected-crate checks and build pass without new dependencies or boundary violations."
      - "scripts/check_guardrails.sh passes or any unrelated pre-existing failure is isolated without rebaselining."
      - "A newly built selfdev binary on a private socket produces representative lifecycle decisions, returns ordered structured JSON, reports effective settings, preserves runtime outcomes, and cleans all lifecycle artifacts with the session."
      - "Final diff and documentation review confirms no aggregate database, benchmark campaign, Locus, workflow engine, remote telemetry change, or sensitive content capture."

