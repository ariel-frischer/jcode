plan:
  branch: "013-add-lifecycle-observability"
  created: "2026-08-21"
  spec_path: "specs/013-add-lifecycle-observability/spec.yaml"

summary: |
  Add a dependency-light, versioned lifecycle event contract in jcode-session-types
  and a single server-owned LifecycleRecorder in jcode-app-core. The server will
  construct and share the recorder with Agents, and lifecycle decision sites will
  submit typed privacy-safe metadata only. The recorder will own effective
  enablement, per-session sequence assignment, policy-snapshot deduplication,
  privacy validation, and fan-out to the existing structured local logger plus a
  bounded asynchronous persistence worker. Recorder or sink failures remain
  best-effort diagnostics and cannot change compaction, handoff, retry, model
  strategy, block, or session execution outcomes.

  Persist detailed history beside the canonical session snapshot as an internal
  <session-id>.lifecycle.jsonl sidecar with fixed 1 MiB files, three retained
  rotations, and 30-day age retention. Add one session-artifact cleanup boundary
  that removes snapshots, journals, backups, lifecycle files, and rotations for
  the selected session without touching neighboring sessions. Expose the stream
  through additive jcode-protocol request/response types and `jcode session
  lifecycle <session> --json`; the response includes effective observability
  status, ordered typed events, and bounded compatibility warnings. Existing
  session discovery, recovery, reporting, import, export, telemetry consent, and
  runtime decisions remain unchanged.

technical_context:
  language: "Rust 2024 edition"
  framework: "Tokio async runtime with Serde contracts, the Jcode daemon protocol, and Clap CLI"
  primary_dependencies:
    - name: "tokio"
      version: "1.x"
      purpose: "Own the bounded non-blocking recorder queue, background persistence worker, flush barriers, and asynchronous protocol tests."
    - name: "serde"
      version: "1.x"
      purpose: "Define stable tagged lifecycle event, status, policy, and protocol representations."
    - name: "serde_json"
      version: "1.x"
      purpose: "Serialize complete JSONL records, parse retained streams safely, and produce structured CLI output."
    - name: "chrono"
      version: "0.4.x"
      purpose: "Timestamp ordered events and apply fixed age retention using existing workspace time types."
    - name: "clap"
      version: "4.x"
      purpose: "Extend the existing `jcode session` command family with lifecycle query arguments."
    - name: "jcode-logging"
      version: "workspace"
      purpose: "Reuse existing local structured event logging without creating a second logging backend."
  storage: "Bounded append-only per-session JSONL sidecars beside existing session snapshots and journals; no database or aggregate event store."
  testing:
    framework: "Cargo unit and integration tests with Tokio tests and tempfile-backed filesystem fixtures"
    approach: "Start with focused failing schema, recorder, configuration, persistence, protocol, CLI, privacy, and compatibility tests; then run affected crate checks, repository guardrails, and a newly built isolated-socket runtime query."
  target_platform: "Existing Jcode Linux, macOS, and Windows targets, using cross-platform std/Tokio filesystem operations and Unix isolated-socket runtime acceptance where supported."
  project_type: "cli"
  performance_goals: "Return the maximally retained single-session stream within 2 seconds in the standard test environment; lifecycle recording uses a bounded try-send path so filesystem work never blocks or changes the observed runtime decision."
  constraints:
    - "The Jcode server is the lifecycle recorder authority; clients and decision callers must not write the persistence format directly."
    - "Stable lifecycle event and query result data belongs in dependency-light jcode-session-types, while orchestration and sink fan-out remain in jcode-app-core."
    - "The JSONL sidecar is an internal persistence detail and must not become a transcript, replay event, or user-facing parsing contract."
    - "Use fixed product retention defaults of 1 MiB per file, three retained rotations, and 30 days; numeric retention configuration is out of scope."
    - "The master switch controls both outputs; persistence and structured local logging remain independently selectable beneath it."
    - "Environment overrides use the existing config resolver and take precedence over persisted config, which takes precedence over built-in defaults; no per-session observability override is added."
    - "Default effective values are enabled=true, persist_session_events=true, and emit_structured_logs=false so the primary per-session query works out of the box without duplicating normal logs."
    - "Events may contain only approved enums, counts, sizes, timestamps, policy values, session identifiers, and opaque process-manifest identifiers; raw prompts, command text, command output, environment values, secret values, and unnecessary todo content are forbidden across persistence, structured logs, and queries."
    - "Recorder, append, rotation, retention, logging, parse, and query failures must not alter lifecycle decisions or prevent session continuation."
    - "Local lifecycle observability must not call, configure, or mutate jcode-telemetry-core or remote telemetry consent."
    - "No global SQLite database, aggregate event source of truth, benchmark campaign, Locus integration, PRD, workflow engine, or general content capture is introduced."
  scale_scope: "One local stream per session or run, bounded to one active 1 MiB file plus three 1 MiB rotations and age retention; queries address exactly one session and do not aggregate across sessions."

constitution_check:
  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "Surgical, Scope-Bound Changes"
      status: "PASS"
      notes: "The plan is limited to lifecycle contracts, one recorder, per-session persistence and cleanup, additive query/config surfaces, focused tests, and documentation; it explicitly excludes databases, benchmarks, workflow systems, and adjacent refactors."
    - name: "Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "Wire changes are additive tagged variants, config fields are serde-defaulted, sidecars are ignored by existing snapshot scanners, transcript and replay formats are unchanged, and runtime decisions remain observationally identical."
    - name: "Explicit Configuration Precedence"
      status: "PASS"
      notes: "One Config resolution path owns built-in defaults, persisted [lifecycle_observability] values, and JCODE_LIFECYCLE_OBSERVABILITY_* environment overrides; status reports the effective booleans and master-switch suppression."
    - name: "Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "jcode-session-types owns stable data, jcode-base owns session paths and filesystem persistence, jcode-app-core owns server orchestration, and jcode-protocol reuses the lower-layer types without introducing an upward dependency."
    - name: "Focused Behavioral Tests"
      status: "PASS"
      notes: "Every functional and non-functional outcome maps to focused schema, config, recorder, decision, storage, query, CLI, privacy, cleanup, or compatibility checks before broader validation."
    - name: "Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "Typed fields minimize sensitive input, unknown schema versions and torn JSONL tails produce bounded compatibility warnings, invalid config is tested through the existing resolver, and observability failures are visible without becoming runtime failures."
    - name: "Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "Implementation validation will run focused tests first, affected crate checks and build next, then scripts/check_guardrails.sh and the plan's isolated runtime acceptance."
    - name: "Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The design adds one built-in recorder and one per-session query path using current server, protocol, session, logging, and CLI architecture rather than a plugin ABI, parallel telemetry system, or aggregate database."
    - name: "Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "The plan delivers operator-visible explanations, effective settings, bounded artifacts, cleanup, privacy guarantees, and runtime validation rather than stopping at an internal event type."
    - name: "Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "Recording is non-blocking and bounded, query latency has a two-second acceptance target, and final behavior is exercised with the newly built binary against a private socket rather than the shared daemon."

research_findings:
  decisions:
    - topic: "Stable lifecycle contract ownership"
      decision: "Create a focused lifecycle module in jcode-session-types for event envelopes, category payloads, policy snapshots, status, process references, query results, and compatibility warnings."
      rationale: "jcode-protocol already depends on jcode-session-types, and both jcode-base and jcode-app-core can reuse these types without reversing the workspace dependency direction."
      alternatives_considered:
        - "Define duplicate event structs in jcode-app-core and jcode-protocol"
        - "Add lifecycle fields directly to Session, replay_events, or transcript messages"
        - "Create a new general observability crate and abstraction layer"
    - topic: "Canonical recorder ownership"
      decision: "Add one Arc<LifecycleRecorder> owned by Server and injected into every server-created Agent; all supported decision paths call its typed record API."
      rationale: "The daemon is already authoritative for sessions and execution, while injection preserves testability and avoids a global singleton or client-owned emission."
      alternatives_considered:
        - "Global static recorder state"
        - "Per-Agent independent recorders with unrelated ordering"
        - "Direct JSONL writes from compaction, handoff, retry, provider, and tool modules"
    - topic: "Non-blocking delivery and ordering"
      decision: "Assign monotonic per-session sequence numbers in the recorder, enqueue through a bounded try-send channel, serialize sink work in one worker, and support a flush barrier before protocol queries."
      rationale: "This gives deterministic ordering across near-simultaneous events, keeps filesystem work off decision paths, and lets automated queries observe all previously accepted events without changing runtime outcomes."
      alternatives_considered:
        - "Synchronous append in every decision path"
        - "Timestamp-only ordering"
        - "Unbounded fire-and-forget tasks per event"
    - topic: "Privacy boundary"
      decision: "Use closed enums and numeric or opaque fields for semantic reasons, suppression reasons, outcomes, and references; reject or normalize unsupported payloads in the recorder and never accept raw prompt, command, output, environment, error, or todo text."
      rationale: "Privacy is easiest to guarantee when sensitive strings cannot enter the canonical event model, and the same filtered envelope can feed persistence, logs, and queries."
      alternatives_considered:
        - "Capture rich strings then redact each sink independently"
        - "Store truncated prompts or command previews"
        - "Rely only on documentation and caller discipline"
    - topic: "Configuration defaults and precedence"
      decision: "Add [lifecycle_observability] with enabled=true, persist_session_events=true, emit_structured_logs=false, plus matching environment overrides resolved by Config."
      rationale: "The primary per-session query is useful without setup, bounded privacy-safe persistence has a fixed footprint, structured log duplication remains opt-in, and the existing environment-over-file resolver provides one explainable effective status."
      alternatives_considered:
        - "Disable all lifecycle observability by default"
        - "Enable structured logs by default"
        - "Add CLI or profile-specific overrides in this feature"
    - topic: "Sidecar layout and bounded retention"
      decision: "Use <session-id>.lifecycle.jsonl plus numbered rotations, rotate before a complete event would exceed 1 MiB, retain at most three rotations, and prune artifacts older than 30 days during append, query, and maintenance."
      rationale: "Existing picker, search, productivity, crash, import, and export scanners recognize .json snapshots or exact journal suffixes, so lifecycle JSONL files remain internal while fixed bounds make query cost and disk growth predictable."
      alternatives_considered:
        - "Global SQLite or aggregate JSONL database"
        - "Store events inside session snapshots or journals"
        - "Unbounded per-session files"
        - "Split oversized JSON records across files"
    - topic: "Torn tails and schema compatibility"
      decision: "Read rotations oldest-to-newest, skip an incomplete final line, report bounded warnings for malformed middle records, and surface unsupported newer schema versions without decoding them as known events."
      rationale: "The existing session journal already treats crash-torn JSONL as recoverable; lifecycle queries need the same resilience without blocking session recovery or misinterpreting future data."
      alternatives_considered:
        - "Fail the entire query on the first parse error"
        - "Silently discard all unknown versions"
        - "Rewrite or repair files during a read-only query"
    - topic: "Canonical session-artifact cleanup"
      decision: "Add one jcode-base session artifact enumerator and removal helper covering snapshot, journal, backup, active lifecycle sidecar, and rotations, then use it from prepared-spawn rollback, takeover rollback, and canonical removal paths."
      rationale: "Current rollback helpers delete different subsets and would orphan sidecars; one lower-layer boundary makes future cleanup complete and session-scoped."
      alternatives_considered:
        - "Add ad hoc lifecycle remove_file calls to each current caller"
        - "Let age retention eventually remove orphaned files"
        - "Broadly delete every file sharing a textual prefix without path validation"
    - topic: "Structured query and CLI surface"
      decision: "Add GetLifecycleEvents and LifecycleEvents protocol variants, a client_api helper, and `jcode session lifecycle <session> --json` with optional human rendering from the same typed result."
      rationale: "The internal protocol is the existing server/client contract, the session command family already resolves session names and emits JSON, and users remain independent of sidecar naming."
      alternatives_considered:
        - "Require direct sidecar reads"
        - "Use the debug socket command parser as the public interface"
        - "Add an HTTP service or SDK-wide contract in this feature"
    - topic: "Lifecycle decision integration"
      decision: "Instrument compaction action/completion and context-limit recovery, handoff policy/staging/child startup, retry scheduling/exhaustion, transparent model strategy changes, and canonical block decisions such as tool-policy, destructive-command, run-safety, and handoff-policy refusals."
      rationale: "These are existing decision authority seams where semantic outcomes are already known; recording there avoids inferring decisions from logs or provider output."
      alternatives_considered:
        - "Infer lifecycle events by parsing current log strings"
        - "Record every generic error as a lifecycle block"
        - "Instrument only successful compaction and handoff outcomes"
    - topic: "Long-running process references"
      decision: "Represent active process state only with an opaque process_manifest_id derived from the persisted Background TaskStatusFile task_id; never include PID, command, output path, output content, or environment in lifecycle events."
      rationale: "TaskStatusFile is the durable local process manifest and its stable task ID is sufficient correlation without expanding the disclosure surface or authorizing process actions."
      alternatives_considered:
        - "Embed command text and PID for convenience"
        - "Copy ManagedProcessIdentity into lifecycle events"
        - "Use ephemeral in-memory task handles"
    - topic: "Local logs and remote telemetry"
      decision: "Flatten the already-filtered event envelope through jcode-logging event_info when enabled and keep all lifecycle code independent of jcode-telemetry-core."
      rationale: "Jcode already has structured local log formatting and rotation, while remote telemetry has a separate consent contract that this feature must neither inspect nor mutate."
      alternatives_considered:
        - "Create a second lifecycle log directory and logger"
        - "Send lifecycle events through remote usage telemetry"
        - "Log raw serialized event payloads before filtering"


data_model:
  entities:
    - name: "LifecycleEventEnvelope"
      description: "Versioned, ordered, privacy-safe record submitted through the canonical recorder."
      fields:
        - name: "schema_version"
          type: "u16"
          description: "Version of the persisted and queried lifecycle schema."
          constraints: "Starts at 1; unsupported newer versions produce compatibility warnings rather than reinterpretation."
        - name: "session_id"
          type: "String"
          description: "Owning session or run identifier."
          constraints: "Validated as an opaque session identifier and used only for session-scoped path resolution."
        - name: "sequence"
          type: "u64"
          description: "Recorder-assigned monotonic order within one session stream."
          constraints: "Assigned only by LifecycleRecorder; ordering does not depend on wall-clock uniqueness."
        - name: "recorded_at"
          type: "DateTime<Utc>"
          description: "Diagnostic event timestamp."
          constraints: "Informational; sequence is authoritative for ordering."
        - name: "event"
          type: "LifecycleEvent"
          description: "Tagged category-specific privacy-safe payload."
          constraints: "Must be one of policy_snapshot, compaction, handoff, retry, strategy_switch, or block."
      relationships:
        - target: "SessionLifecycleStream"
          type: "many-to-one"
          description: "Each envelope belongs to exactly one ordered session stream."
        - target: "EffectivePolicySnapshot"
          type: "many-to-one"
          description: "Decision events reference the effective policy fingerprint active for the session."
    - name: "LifecycleEvent"
      description: "Exhaustive tagged enum for supported lifecycle categories."
      fields:
        - name: "category"
          type: "enum"
          description: "policy_snapshot, compaction, handoff, retry, strategy_switch, or block."
          constraints: "Serde-tagged and exhaustively covered by serialization, logging, and query tests."
        - name: "decision_type"
          type: "enum"
          description: "Category-specific attempted, accepted, suppressed, started, completed, failed, exhausted, or pending decision."
          constraints: "No free-form decision strings."
        - name: "semantic_reason"
          type: "enum"
          description: "Safe reason describing why the decision occurred."
          constraints: "Closed allow-list; raw provider, prompt, command, or task text is forbidden."
        - name: "suppression_reason"
          type: "Option<enum>"
          description: "Safe explanation when a decision was not applied."
          constraints: "Required for suppressed decisions and absent otherwise."
        - name: "context_usage"
          type: "Option<ContextUsage>"
          description: "Token counts, context window, and bounded ratio at compaction or handoff decision time."
          constraints: "Counts and ratios only."
        - name: "process_manifest_id"
          type: "Option<String>"
          description: "Opaque durable Background TaskStatusFile task identifier when an active process is relevant."
          constraints: "Must not contain PID, command, output, path, environment, or secret values."
      relationships:
        - target: "ProcessManifestReference"
          type: "many-to-one"
          description: "A lifecycle decision may reference one durable process manifest without embedding process content."
    - name: "EffectivePolicySnapshot"
      description: "Credential-free compaction and handoff policy actually used by a session or run."
      fields:
        - name: "policy_version"
          type: "u16"
          description: "Version of the policy snapshot representation."
          constraints: "Versioned independently from the event envelope."
        - name: "fingerprint"
          type: "String"
          description: "Stable hash of safe effective policy values for deduplication and event correlation."
          constraints: "Must not include credentials, prompts, file paths, or secret configuration."
        - name: "compaction"
          type: "CompactionPolicySnapshot"
          description: "Effective mode, provider capability, thresholds, and native-compaction settings used by the session."
          constraints: "Safe enums, booleans, ratios, and counts only."
        - name: "handoff"
          type: "HandoffPolicySnapshot"
          description: "Effective enablement, confirmation, todo carryover, and chain-depth policy for the session profile."
          constraints: "Resolved values only; no prompt content or profile instructions."
      relationships:
        - target: "LifecycleEventEnvelope"
          type: "one-to-many"
          description: "A snapshot is emitted at session setup and whenever the effective fingerprint changes before a decision."
    - name: "HandoffLifecyclePayload"
      description: "Safe metadata for staging and starting a fresh child session."
      fields:
        - name: "chain_depth"
          type: "usize"
          description: "Parent-chain depth evaluated against the effective limit."
          constraints: "Non-negative count."
        - name: "generated_prompt_bytes"
          type: "usize"
          description: "UTF-8 byte size of the generated or supplied handoff prompt."
          constraints: "Size only; prompt content is forbidden."
        - name: "todo_carryover_count"
          type: "usize"
          description: "Number of todo records copied to the child."
          constraints: "Count only; todo text is forbidden."
        - name: "parent_session_id"
          type: "String"
          description: "Source session identifier."
          constraints: "Opaque identifier."
        - name: "child_session_id"
          type: "Option<String>"
          description: "Created destination session identifier when available."
          constraints: "Absent when child creation was suppressed or failed before allocation."
        - name: "startup_acknowledged"
          type: "Option<bool>"
          description: "Whether the destination startup submission was acknowledged."
          constraints: "None represents pending or unavailable acknowledgment, never an invented result."
        - name: "startup_outcome"
          type: "enum"
          description: "pending, started, completed, failed, or incomplete."
          constraints: "Failure detail is a safe class enum rather than raw error text."
      relationships:
        - target: "LifecycleEvent"
          type: "many-to-one"
          description: "Handoff events carry this payload for staged, suppressed, successful, failed, and incomplete outcomes."
    - name: "ProcessManifestReference"
      description: "Opaque correlation to the durable Background TaskStatusFile for an active long-running process."
      fields:
        - name: "process_manifest_id"
          type: "String"
          description: "Stable background task ID used to locate the process manifest through its owning subsystem."
          constraints: "Opaque identifier only; must not embed PID, command, output path, output content, environment, or secret data."
        - name: "session_id"
          type: "String"
          description: "Session or run that owns the referenced background task."
          constraints: "Must match the lifecycle event stream owner."
      relationships:
        - target: "LifecycleEvent"
          type: "one-to-many"
          description: "One durable process manifest may be referenced by multiple lifecycle decisions without copying process content."
    - name: "SessionLifecycleStream"
      description: "Ordered bounded lifecycle history and status returned for exactly one session or run."
      fields:
        - name: "session_id"
          type: "String"
          description: "Resolved session identifier requested by the operator."
          constraints: "Exactly one session per query."
        - name: "status"
          type: "LifecycleObservabilityStatus"
          description: "Effective master, persistence, and structured-log output state."
          constraints: "Reports output switches as inactive when the master switch is false."
        - name: "events"
          type: "Vec<LifecycleEventEnvelope>"
          description: "Supported records ordered by sequence across retained rotations and active file."
          constraints: "Bounded by fixed retention and returned within the two-second target."
        - name: "warnings"
          type: "Vec<LifecycleCompatibilityWarning>"
          description: "Bounded malformed-tail, unsupported-version, dropped-event, or unavailable-persistence indications."
          constraints: "No raw line content, paths containing secrets, or unbounded parse errors."
      relationships:
        - target: "LifecycleArtifactSet"
          type: "one-to-one"
          description: "The query reads the retained artifact set owned by the selected session."
    - name: "LifecycleObservabilityStatus"
      description: "Configured and effective local lifecycle output controls."
      fields:
        - name: "enabled"
          type: "bool"
          description: "Master local lifecycle recorder switch."
          constraints: "When false, both effective outputs are false."
        - name: "persist_session_events"
          type: "bool"
          description: "Configured persistence output switch."
          constraints: "Effective only when enabled is true."
        - name: "emit_structured_logs"
          type: "bool"
          description: "Configured local structured-log output switch."
          constraints: "Effective only when enabled is true and independent of remote telemetry."
      relationships:
        - target: "LifecycleRecorder"
          type: "one-to-many"
          description: "The recorder evaluates current effective status before accepting each event and when serving queries."
    - name: "LifecycleArtifactSet"
      description: "Canonical filesystem artifacts owned by one session for lifecycle persistence and cleanup."
      fields:
        - name: "active"
          type: "PathBuf"
          description: "The <session-id>.lifecycle.jsonl active stream."
          constraints: "Resolved beneath the canonical sessions directory with validated session identity."
        - name: "rotations"
          type: "Vec<PathBuf>"
          description: "At most three numbered retained rotations."
          constraints: "Complete JSONL records only; oldest excess or expired artifacts are removed."
        - name: "max_file_bytes"
          type: "u64"
          description: "Fixed 1 MiB rotation boundary."
          constraints: "A single event is never split; oversized invalid events are rejected before persistence."
        - name: "max_age_days"
          type: "u64"
          description: "Fixed 30-day artifact retention age."
          constraints: "Applied deterministically with size rotation during append, query, and maintenance."
      relationships:
        - target: "SessionLifecycleStream"
          type: "one-to-one"
          description: "The retained artifact set is the durable source for one session query."

api_contracts:
  endpoints:
    - method: "REQUEST"
      path: "jcode-protocol:GetLifecycleEvents"
      description: "Retrieve the flushed, retained lifecycle stream and effective local observability status for exactly one resolved session or run."
      request:
        content_type: "application/json"
        body_schema: "{ id: u64, session_id: string }"
      response:
        success_code: 200
        body_schema: "ServerEvent::LifecycleEvents { id: u64, stream: SessionLifecycleStream }"
      errors:
        - code: 400
          description: "The supplied session identifier is invalid or cannot be resolved safely beneath the sessions directory."
        - code: 404
          description: "The requested session does not exist; an existing session with no persisted lifecycle history returns a successful empty stream with status."

