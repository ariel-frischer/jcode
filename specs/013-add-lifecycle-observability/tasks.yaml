implementation_strategy:
  mvp_scope:
    phases: [1, 2, 3]
    description: "Setup, shared typed/configuration/storage/recorder infrastructure, all supported lifecycle decision emissions, and the built-in protocol plus CLI query for one session."
    validation: "Run the focused schema, recorder, decision, protocol, CLI, and isolated-socket tests; verify one representative session returns ordered typed JSON with effective status and completes within two seconds."
  incremental_delivery:
    - milestone: "Foundation Ready"
      phases: [1, 2]
      deliverable: "Versioned privacy-safe lifecycle contracts, effective configuration, bounded sidecar storage, canonical cleanup, recorder core, protocol variants, and Agent injection are ready for story integration."
    - milestone: "MVP Complete"
      phases: [1, 2, 3]
      deliverable: "Operators can query one session's ordered compaction, handoff, retry, strategy-switch, and block events through the built-in daemon protocol and jcode session lifecycle command."
    - milestone: "Privacy and Control Complete"
      phases: [1, 2, 3, 4, 5]
      deliverable: "Lifecycle outputs are privacy-safe, independently selectable, master-switch controlled, status-visible, and telemetry-independent."
    - milestone: "Bounded and Compatible"
      phases: [1, 2, 3, 4, 5, 6, 7]
      deliverable: "Rotation, age retention, canonical cleanup, and all existing session workflow compatibility checks pass."
    - milestone: "Release Ready"
      phases: [1, 2, 3, 4, 5, 6, 7, 8]
      deliverable: "Documentation, guardrails, affected-crate validation, and newly built isolated-runtime acceptance demonstrate the complete operator outcome."

