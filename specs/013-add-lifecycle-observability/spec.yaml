feature:
  branch: "013-add-lifecycle-observability"
  created: "2026-08-21"
  status: "Draft"
  input: "Implement jcode-6b6 built-in lifecycle observability: a typed server-owned recorder for compaction, handoff, retry, strategy-switch, and block events; bounded per-session JSONL sidecar as an internal persistence detail; built-in structured per-session query interface; lifecycle_observability configuration and effective status; privacy-safe events; retention, rotation, and canonical artifact cleanup; focused compatibility tests and documentation. No global SQLite, aggregate event database, benchmark campaign, Locus, PRD, or workflow engine."

user_stories:
  - id: "US-001"
    title: "Inspect a session lifecycle"
    priority: "P0"
    as_a: "Jcode operator"
    i_want: "to query structured lifecycle events for one session or run"
    so_that: "I can understand compaction, handoff, retry, strategy-switch, and blocked decisions without parsing internal storage files"
    why_this_priority: "Per-session operational visibility is the primary outcome of the feature."
    independent_test: "Exercise each supported lifecycle category in one session and verify the built-in query returns ordered, typed, structured events with the effective policy and decision context."
    acceptance_scenarios:
      - given: "A session has encountered compaction, handoff, retry, strategy-switch, or block decisions"
        when: "An operator requests that session's lifecycle stream through the built-in query interface"
        then: "The operator receives ordered structured events that distinguish each category and explain each decision"
      - given: "A lifecycle decision is suppressed"
        when: "The session lifecycle stream is queried"
        then: "The event identifies both the semantic decision reason and the suppression reason"

  - id: "US-002"
    title: "Control local lifecycle observability"
    priority: "P1"
    as_a: "Jcode administrator"
    i_want: "to enable or disable lifecycle persistence and structured local logging independently"
    so_that: "I can choose the desired local observability footprint and confirm the effective settings"
    why_this_priority: "Operational control and transparent effective status are required for safe adoption."
    independent_test: "Evaluate all master-switch, persistence, and structured-log combinations and verify effective status plus resulting outputs."
    acceptance_scenarios:
      - given: "Lifecycle observability is disabled by its master switch"
        when: "Lifecycle decisions occur"
        then: "No lifecycle sidecar or structured lifecycle log event is produced and runtime decisions are unchanged"
      - given: "Lifecycle observability is enabled with only one output enabled"
        when: "Lifecycle decisions occur"
        then: "Only the selected output is produced and effective status reports the active combination"

  - id: "US-003"
    title: "Protect sensitive session content"
    priority: "P0"
    as_a: "Privacy-conscious Jcode user"
    i_want: "lifecycle events to contain only safe operational metadata"
    so_that: "observability does not expose prompts, secrets, command output, or unnecessary task content"
    why_this_priority: "The feature observes sensitive execution paths and must not create a new disclosure channel."
    independent_test: "Inject representative secrets, prompts, command output, and task text into lifecycle paths and verify none appears in persisted, logged, or queried events."
    acceptance_scenarios:
      - given: "A lifecycle decision involves sensitive prompts, commands, output, or task content"
        when: "The event is recorded, logged, persisted, and queried"
        then: "Only approved metadata and opaque references are present"
      - given: "A long-running process is active"
        when: "Its state is referenced by a lifecycle event"
        then: "The event includes only a durable process-manifest identifier and no command output or secret values"

  - id: "US-004"
    title: "Keep lifecycle artifacts bounded"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "per-session lifecycle artifacts to rotate, expire, and clean up with their canonical session artifacts"
    so_that: "observability remains reliable without unbounded disk growth or orphaned files"
    why_this_priority: "Bounded storage and complete cleanup are necessary for a built-in capability."
    independent_test: "Drive a session past size and age limits, then remove the session through canonical cleanup and verify rotation, retention, and artifact removal behavior."
    acceptance_scenarios:
      - given: "A session lifecycle stream reaches its size limit"
        when: "Additional events are recorded"
        then: "The stream rotates according to the bounded retention policy without affecting session execution"
      - given: "A session is removed through canonical artifact cleanup"
        when: "Cleanup completes"
        then: "Its lifecycle sidecar and retained rotations are also removed"

  - id: "US-005"
    title: "Preserve existing session workflows"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "lifecycle observability to leave existing runtime and session workflows compatible"
    so_that: "I gain diagnostic visibility without regressions or changed lifecycle decisions"
    why_this_priority: "Observability must remain non-invasive across existing product behavior."
    independent_test: "Run focused compatibility checks for session picker, search, productivity reporting, crash recovery, import, export, and ordinary lifecycle decisions with sidecars present and absent."
    acceptance_scenarios:
      - given: "A session has a lifecycle sidecar"
        when: "Existing session discovery, recovery, reporting, import, or export workflows run"
        then: "Their established behavior remains compatible"
      - given: "Observability is enabled"
        when: "The same runtime scenario is compared with observability disabled"
        then: "The lifecycle decisions and user-visible execution outcome are unchanged"

requirements:
  functional:
    - id: "FR-001"
      description: "The system MUST provide one canonical typed, versioned, server-owned lifecycle recording capability for compaction, handoff, retry, strategy-switch, and block events."
      acceptance_criteria: "Focused tests show every supported runtime decision path emits through the canonical recorder and no decision path writes the persistence format directly."
    - id: "FR-002"
      description: "The recorder MUST own enablement evaluation, privacy filtering, event ordering, and delivery to enabled local outputs."
      acceptance_criteria: "Recorder tests verify disabled, partially enabled, redacted, ordered, and multi-output behavior without requiring decision callers to implement those concerns."
    - id: "FR-003"
      description: "Each session or run MUST record the effective compaction and handoff policy snapshot used for its lifecycle decisions."
      acceptance_criteria: "A queried session stream contains a versioned effective policy snapshot matching the policy active for that session or run."
    - id: "FR-004"
      description: "Every compaction and handoff decision event MUST include context usage, decision type, semantic reason, and any applicable suppression reason."
      acceptance_criteria: "Focused decision tests assert all required fields for accepted and suppressed compaction and handoff decisions."
    - id: "FR-005"
      description: "Handoff events MUST include chain depth, generated prompt byte size, todo carryover count, parent and child session identifiers, child startup acknowledgment, and terminal startup outcome when available."
      acceptance_criteria: "Successful, failed, and incomplete child-startup tests produce handoff events with the applicable fields and explicit outcome state."
    - id: "FR-006"
      description: "Lifecycle events that refer to an active long-running process MUST use a durable process-manifest identifier rather than process content."
      acceptance_criteria: "Process-related event tests expose an opaque manifest reference while excluding commands, command output, environment values, and secrets."
    - id: "FR-007"
      description: "The system MUST persist enabled detailed lifecycle events in a bounded append-only stream owned by the corresponding session, with a per-session JSONL sidecar treated as an internal persistence detail."
      acceptance_criteria: "A session with persistence enabled produces an append-only sidecar associated only with that session, while users can retrieve the same data without reading the file directly."
    - id: "FR-008"
      description: "The system MUST provide a built-in structured query interface for retrieving one session or run lifecycle stream."
      acceptance_criteria: "Automated tests request a session stream through the supported interface and receive structured, ordered, versioned results without accessing internal files."
    - id: "FR-009"
      description: "The existing command and status experience MUST expose structured per-session lifecycle query results suitable for automation."
      acceptance_criteria: "A focused command-level test retrieves one session's lifecycle stream in structured form and can distinguish all supported event categories."
    - id: "FR-010"
      description: "The lifecycle_observability configuration MUST provide enabled as a master switch plus persist_session_events and emit_structured_logs output switches."
      acceptance_criteria: "Configuration parsing and effective-value tests cover defaults, explicit values, and every meaningful switch combination."
    - id: "FR-011"
      description: "The effective lifecycle_observability values MUST be visible through built-in configuration or status output."
      acceptance_criteria: "Status output reports the resolved master, persistence, and structured-log values used by the running system."
    - id: "FR-012"
      description: "When enabled is false, the system MUST produce no lifecycle sidecar and no structured lifecycle log events, while leaving runtime decisions unaffected."
      acceptance_criteria: "A disabled-mode test confirms both outputs are absent and decision results match an equivalent run without recorder effects."
    - id: "FR-013"
      description: "Lifecycle events MUST exclude secret values, raw prompts, command output, and unnecessary todo content from persisted, logged, and queried representations."
      acceptance_criteria: "Privacy tests seed representative sensitive values into each lifecycle path and confirm none appears in any event representation."
    - id: "FR-014"
      description: "Per-session lifecycle persistence MUST enforce independent file-size rotation and age-based retention without blocking or changing session execution."
      acceptance_criteria: "Boundary tests exceed size and age limits, verify bounded retained artifacts, and confirm session execution continues with the same decisions."
    - id: "FR-015"
      description: "A canonical session-artifact cleanup operation MUST remove the active lifecycle sidecar and all retained rotations for the removed session."
      acceptance_criteria: "Cleanup tests create active and rotated lifecycle artifacts, invoke canonical session cleanup, and verify no lifecycle artifact for that session remains."
    - id: "FR-016"
      description: "Local lifecycle observability MUST remain separate from opt-in remote usage telemetry and MUST NOT alter or bypass telemetry consent."
      acceptance_criteria: "Tests show local lifecycle settings neither enable remote telemetry nor modify the effective remote telemetry consent state."
    - id: "FR-017"
      description: "The event schema, supported categories, field meanings, privacy guarantees, configuration, query usage, retention behavior, and cleanup behavior MUST be documented."
      acceptance_criteria: "Documentation review confirms each named topic is present and examples use only privacy-safe data."
    - id: "FR-018"
      description: "Session picker, search, productivity reporting, crash recovery, import, and export behavior MUST remain compatible when lifecycle sidecars are present, absent, rotated, or disabled."
      acceptance_criteria: "Focused compatibility tests cover each named workflow across representative lifecycle artifact states."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Lifecycle observability MUST minimize collected data and apply the same privacy guarantees consistently across persistence, logs, and queries."
      measurable_target: "Zero occurrences of seeded secret values, raw prompts, command output, or unnecessary todo text across all privacy fixtures and outputs."
    - id: "NFR-002"
      category: "reliability"
      description: "Recorder, persistence, retention, and query failures MUST NOT change lifecycle decisions or prevent a session from continuing."
      measurable_target: "All injected observability-failure tests preserve the expected runtime decision and session progress."
    - id: "NFR-003"
      category: "performance"
      description: "Querying a maximally retained single-session lifecycle stream MUST remain responsive for interactive and automated use."
      measurable_target: "A bounded session stream is returned within 2 seconds under the repository's standard test environment."
    - id: "NFR-004"
      category: "code_quality"
      description: "Supported lifecycle categories and event schemas MUST be explicit, versioned, and exhaustively testable."
      measurable_target: "Every supported event category has at least one focused schema, ordering, serialization, and query assertion."
    - id: "NFR-005"
      category: "usability"
      description: "Operators MUST be able to discover effective settings and retrieve session events through built-in interfaces without understanding the persistence layout."
      measurable_target: "Documented status and query examples complete successfully without direct sidecar access."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Operators can explain every supported lifecycle decision in a representative session from one structured session query."
      metric: "Supported decision categories represented with required decision context"
      target: "100% of compaction, handoff, retry, strategy-switch, and block categories in the acceptance fixture"
    - id: "SC-002"
      description: "Sensitive session content is absent from lifecycle observability outputs."
      metric: "Seeded sensitive values found in persisted, logged, and queried lifecycle data"
      target: "0 occurrences"
    - id: "SC-003"
      description: "Lifecycle artifacts remain within the defined per-session retention bounds and disappear with canonical session cleanup."
      metric: "Artifacts beyond retention bounds or remaining after cleanup"
      target: "0 artifacts"
    - id: "SC-004"
      description: "A bounded lifecycle stream can be retrieved quickly enough for routine diagnosis and automation."
      metric: "Elapsed time to retrieve the maximally retained single-session stream"
      target: "At most 2 seconds in the standard test environment"
    - id: "SC-005"
      description: "Existing session and runtime workflows remain behaviorally compatible with lifecycle observability enabled."
      metric: "Regressions in focused decision, picker, search, reporting, recovery, import, and export checks"
      target: "0 regressions"

key_entities:
  - name: "Lifecycle Event"
    description: "A versioned, privacy-safe record of one lifecycle observation or decision."
    attributes:
      - "schema version"
      - "session or run identifier"
      - "ordered event position and time"
      - "event category and decision type"
      - "semantic and suppression reasons"
      - "category-specific safe metadata"
  - name: "Effective Policy Snapshot"
    description: "The resolved compaction and handoff policy that governed a session or run."
    attributes:
      - "policy version"
      - "effective compaction settings"
      - "effective handoff settings"
  - name: "Session Lifecycle Stream"
    description: "The ordered, bounded collection of lifecycle events belonging to one session or run."
    attributes:
      - "session ownership"
      - "event ordering"
      - "retention state"
      - "rotation state"
  - name: "Lifecycle Observability Status"
    description: "The effective local configuration controlling lifecycle recording outputs."
    attributes:
      - "master enabled state"
      - "session persistence state"
      - "structured local logging state"
  - name: "Process Manifest Reference"
    description: "An opaque durable identifier linking an event to active long-running process state without embedding sensitive process content."
    attributes:
      - "manifest identifier"
      - "association to session or run"

edge_cases:
  - scenario: "The master switch is disabled while output-specific switches are enabled."
    expected_behavior: "The master switch wins, no lifecycle output is emitted, and effective status makes the inactive outputs clear."
  - scenario: "Persistence is disabled while structured local logging remains enabled, or vice versa."
    expected_behavior: "Only the enabled output receives privacy-filtered events and the query reports only available persisted history."
  - scenario: "A lifecycle decision is suppressed or has no child startup acknowledgment yet."
    expected_behavior: "The event uses an explicit suppression or pending outcome state rather than omitting or inventing an outcome."
  - scenario: "Several lifecycle events occur nearly simultaneously."
    expected_behavior: "The session stream exposes a deterministic recorder-owned order."
  - scenario: "The process ends during an append and leaves an incomplete final persisted record."
    expected_behavior: "Earlier valid events remain queryable, the incomplete tail is handled safely, and session recovery is not blocked."
  - scenario: "A single event approaches the configured file-size boundary."
    expected_behavior: "Rotation preserves a complete event and restores the stream to its bounded retention state without splitting an event."
  - scenario: "Age retention and size rotation become eligible at the same time."
    expected_behavior: "Cleanup applies both policies deterministically and retains only artifacts allowed by both bounds."
  - scenario: "Canonical session cleanup encounters active and rotated lifecycle artifacts."
    expected_behavior: "All lifecycle artifacts owned by that session are removed without affecting artifacts for other sessions."
  - scenario: "A query encounters an event schema version newer than the reader understands."
    expected_behavior: "The query preserves stream safety and returns a clear compatibility indication rather than misinterpreting fields."
  - scenario: "Existing session workflows scan a directory containing lifecycle sidecars and rotations."
    expected_behavior: "The files are recognized as internal session artifacts and are not treated as sessions, transcripts, or user content."

assumptions:
  - "Lifecycle observability is local by default and is independent of opt-in remote usage telemetry."
  - "Retention age and file-size limits use documented product-defined safe defaults; adding user-configurable numeric retention settings is not required by this feature."
  - "The built-in query scope is exactly one session or run at a time; cross-session aggregation can be derived externally without another source of truth."
  - "Observability is best-effort and non-authoritative: recorder or sink failures never determine compaction, handoff, retry, strategy-switch, or block behavior."
  - "Only counts, sizes, identifiers, enumerated reasons, policy values, and other approved metadata are needed to diagnose lifecycle behavior."
  - "The existing configuration and status experience can expose the new effective booleans without a separate workflow or product surface."

constraints:
  - "Detailed persistence is a bounded append-only per-session JSONL sidecar and remains an internal storage detail rather than the user query interface."
  - "The server-owned recorder is the only canonical lifecycle event emission path."
  - "Lifecycle artifacts must participate in the canonical session artifact path and cleanup boundary."
  - "The feature must preserve current runtime decisions and session workflows."
  - "The work is limited to built-in lifecycle observability, focused compatibility tests, and documentation."

out_of_scope:
  - "A global SQLite database or any other aggregate event database"
  - "A second source of truth for cross-session lifecycle events"
  - "A benchmark campaign or performance benchmarking program"
  - "Locus integration"
  - "A product requirements document"
  - "A durable workflow engine or workflow automation system"
  - "Remote telemetry enablement or changes to telemetry consent"
  - "General-purpose transcript, prompt, command-output, or todo-content capture"

