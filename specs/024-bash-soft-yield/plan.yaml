plan:
  branch: "024-bash-soft-yield"
  created: "2026-09-02"
  spec_path: "specs/024-bash-soft-yield/spec.yaml"

summary: |
  Separate Bash responsiveness from process termination by adding an additive
  per-invocation `soft_yield_ms` input with a documented 10,000 ms default and
  `0` as the explicit disabled value. Foreground execution will await the same
  original process until natural completion, the soft-yield deadline, or an
  optional hard timeout. Natural completion remains synchronous, soft yield
  adopts or registers the already-running process exactly once with the existing
  background manager, and hard timeout identity-safely terminates the complete
  process group and reports exit status 124 whether work is still foreground or
  has already yielded.

  Keep the change inside the existing Bash and background lifecycle seams. The
  ordinary Tokio path will move hard-timeout enforcement into the owned command
  work so it continues after adoption. The reload-persistable detached path will
  carry an optional persisted hard deadline through the existing managed-process
  record so reload reconciliation can enforce the same deadline without a second
  supervisor. Both promotion paths will reuse task IDs, bounded output, progress,
  completion and stall wakes, cancellation, and reload persistence. Focused race,
  process-tree, schema, output-bound, and performance tests plus an isolated
  newly built binary check will establish runtime behavior.

technical_context:
  language: "Rust 2024"
  framework: "Tokio async runtime with Serde JSON tool schemas and persisted background task state"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "Race natural completion, soft-yield timers, hard deadlines, cancellation, process waiting, and deterministic asynchronous tests."
    - name: "serde and serde_json"
      version: "1"
      purpose: "Deserialize the additive Bash input and preserve backward-compatible optional background status fields and tool metadata."
    - name: "chrono"
      version: "0.4"
      purpose: "Represent the existing detached-task start time and an optional absolute hard deadline across reloads."
    - name: "libc"
      version: "0.2"
      purpose: "Reuse existing Unix process-group isolation and verified termination for timeout and cancellation cleanup."
    - name: "tempfile"
      version: "3"
      purpose: "Create deterministic output, PID, status, and isolated lifecycle fixtures in focused tests."
  storage: "Existing background task output and status files; add only an optional hard-deadline field where detached yielded work requires reload-safe enforcement."
  testing:
    framework: "Cargo unit and integration tests with Tokio time control, Linux process-tree fixtures, schema assertions, and isolated built-binary smoke validation"
    approach: "Add focused failing tests first for direct completion, default/configured/disabled soft yield, hard timeout, promotion races, process-group cleanup, lifecycle delivery, reload persistence, bounded output, and fast-command overhead; then run affected crate tests, a serialized self-dev build, repository guardrails, and private-socket runtime checks against the resolved new executable."
  target_platform: "All existing Jcode CLI/TUI platforms for tool-contract behavior, with Unix/Linux-specific process-group, descendant cleanup, reload, and isolated socket validation."
  project_type: "cli"
  performance_goals: "Commands completing within 100 ms remain synchronous and add no more than 20 ms median overhead; default soft yield occurs near 10 seconds; all deterministic timeout and cancellation cleanup leaves zero descendants; 100 yield-boundary runs produce one process lineage and one terminal outcome."
  constraints:
    - "Preserve `run_in_background: true` as immediate managed background execution."
    - "Treat omitted timeout as no hard deadline and an explicit timeout as the existing bounded hard deadline with exit status 124."
    - "Retain the existing 1,800,000 ms maximum timeout compatibility behavior and document the effective bound rather than silently changing it."
    - "Use one original process and one existing background task identity; never respawn during promotion."
    - "Reuse existing adoption, detached registration, managed process identity, cancellation, progress, stall wake, completion wake, reload reconciliation, and bounded-output paths."
    - "Keep stable background contracts in jcode-base and Bash orchestration in jcode-app-core without adding dependency edges or a parallel supervisor."
    - "Keep stdout, stderr, promotion responses, retained files, and later bg output bounded by existing policies."
    - "Serialize Cargo-heavy validation on the resource-constrained development host."
    - "Do not disturb the shared daemon during acceptance checks; use the newly built executable with a unique socket."
  scale_scope: "One local Bash process group per invocation and the existing one-to-tens of concurrent managed background tasks within a single shared Jcode server."

constitution_check:
