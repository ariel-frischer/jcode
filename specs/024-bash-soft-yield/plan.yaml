  gates:
    - name: "Surgical, Scope-Bound Changes"
      status: "PASS"
      notes: "The plan is limited to Bash execution timing, the minimum reload-safe background deadline contract, focused lifecycle tests, schema, and one user-facing behavior document."
    - name: "Backward-Compatible User and Data Contracts"
      status: "PASS"
      notes: "The new input and persisted deadline are additive and optional; fast foreground commands and immediate backgrounding remain unchanged. The only intentional behavior correction is timeout matching its already documented hard-deadline contract and omission meaning no timeout."
    - name: "Explicit Configuration Precedence"
      status: "PASS"
      notes: "Soft yield has one resolver: explicit `soft_yield_ms`, then the 10,000 ms built-in default. Zero explicitly disables it; invalid JSON types fail deserialization, and no environment or persisted configuration path is introduced."
    - name: "Layered Rust Ownership and Dependency Direction"
      status: "PASS"
      notes: "jcode-app-core owns Bash spawning and foreground races, while jcode-base owns optional persisted managed-task deadline enforcement and reload reconciliation. No lower crate depends upward."
    - name: "Focused Behavioral Tests"
      status: "PASS"
      notes: "Each functional and nonfunctional acceptance area maps to exact Bash or background tests, including boundary races, silent and heavy output, descendants, schema, reload, and measured fast-command overhead."
    - name: "Visible Failures and Trust-Boundary Validation"
      status: "PASS"
      notes: "The public schema states units, default, disable behavior, hard-timeout maximum, and non-overlapping semantics; timeout and cleanup failures remain explicit terminal outcomes rather than silent promotion or swallowed errors."
    - name: "Repository Guardrails Are Delivery Gates"
      status: "PASS"
      notes: "The implementation workflow runs focused tests first, then the relevant serialized build, dependency and quality guardrails, artifact checks, and isolated runtime validation."
    - name: "Custom-First, Upstream-Aware Simplicity"
      status: "PASS"
      notes: "The design corrects the intentional local timeout-promotion path by reusing its existing background manager and process guards rather than importing another supervisor or copying an upstream architecture."
    - name: "Outcome Ownership and Safe Autonomy"
      status: "PASS"
      notes: "Healthy work is preserved exactly once, while explicit timeout and cancellation retain bounded identity-verified teardown controlled by the caller."
    - name: "Measured Efficiency and Runtime Truth"
      status: "PASS"
      notes: "The plan includes repeated timing checks and acceptance against the resolved newly built binary on an isolated socket, not merely compilation or the existing shared daemon."

research_findings:
  decisions:
    - topic: "Public soft-yield control"
      decision: "Add `soft_yield_ms: Option<u64>` to Bash input and schema, resolve omission to 10,000 ms, and define zero as disabled."
      rationale: "A dedicated millisecond input is additive, matches the existing timeout unit convention, supports default/shorter/longer/disabled acceptance cases, and avoids introducing a repository-wide configuration path for an invocation-specific tool behavior."
      alternatives_considered:
        - "Continue overloading `timeout` as a foreground wait budget"
        - "Use an environment or persisted config setting without a per-call override"
        - "Use a boolean-only automatic yield switch with no configurable duration"
    - topic: "Foreground race ownership"
      decision: "Create one command work future that owns the child, output readers, stdin handling, process-group guard, and optional hard-timeout enforcement; race only that future against the soft-yield timer in the caller."
      rationale: "When the yield timer wins, the exact same JoinHandle and process identity can be adopted without cancellation or respawn, while a hard deadline inside the work continues to apply after adoption. Tokio selection produces one authoritative winner and avoids duplicate terminal delivery."
      alternatives_considered:
        - "Kill and restart the command as an explicit background task"
        - "Use nested `tokio::time::timeout` calls that cancel the hard-timeout future on promotion"
        - "Create a second watcher task without transferring ownership"
    - topic: "Hard timeout semantics"
      decision: "Resolve timeout to `Option<Duration>` rather than a defaulted duration, preserve the existing 1,800,000 ms cap, and on expiry terminate and reap the verified process group before returning or recording exit status 124."
      rationale: "This makes omission genuinely unbounded, aligns foreground and background behavior with the public contract, retains the existing maximum-duration compatibility limit, and prevents descendants from escaping."
      alternatives_considered:
        - "Keep the implicit 120,000 ms timeout"
        - "Promote at the timeout deadline"
        - "Kill only the immediate shell process"
    - topic: "Reload-persistable yielded timeout"
      decision: "Extend the existing detached managed-task status with an optional absolute hard deadline and let the existing manager monitor/reconciliation path enforce it using persisted process identity."
      rationale: "An in-memory timer cannot survive supported reloads, and platform-specific shell `timeout` wrappers are not portable or sufficiently identity-safe. An optional field preserves old status files and keeps the background manager authoritative."
      alternatives_considered:
        - "Use GNU `timeout` inside the detached shell wrapper"
        - "Drop hard-timeout enforcement after reload"
        - "Add a new standalone process supervisor"
    - topic: "Lifecycle option parity after automatic yield"
      decision: "After adoption or detached registration, apply the same notify, wake, stall watchdog, progress attachment/follower, cancellation identity, and task metadata used by immediate background execution."
      rationale: "Current foreground promotion already adopts/registers into the manager but does not wire every immediate-background lifecycle option. Completing that wiring satisfies the spec without a second interface."
      alternatives_considered:
        - "Return an unmanaged process identifier"
        - "Create a separate yielded-command task type"
        - "Support only completion polling for yielded work"
    - topic: "Output handling"
      decision: "Continue concurrent stdout/stderr draining and existing `MAX_OUTPUT_LEN` formatting for adopted work; detached work continues writing to the established task output file and using existing bounded bg response/tail behavior."
      rationale: "Reusing the current collectors prevents pipe deadlock, retains progress parsing, and keeps high-volume work observable without embedding unbounded output in the yield response."
      alternatives_considered:
        - "Buffer all output until completion"
        - "Return accumulated output in the soft-yield response"
        - "Discard output emitted before promotion"
    - topic: "Validation strategy"
      decision: "Use deterministic sub-second test overrides for soft yield and timeout, repeated race loops, PID files for lineage and cleanup, output-volume fixtures, targeted Cargo tests, and two private-socket built-binary scenarios."
      rationale: "Production defaults should not make tests slow, race correctness needs repetition and process evidence, and repository rules require runtime truth from the actual new binary."
      alternatives_considered:
        - "Sleep for the 10-second default in every unit test"
        - "Rely only on mocked timers without real child processes"
        - "Validate through the currently running shared daemon"

data_model:
  entities:
    - name: "BashExecutionPolicy"
      description: "Resolved per-invocation timing and lifecycle policy for one Bash command."
      fields:
        - name: "soft_yield_ms"
          type: "Option<u64>"
          description: "Foreground wait window before adopting the still-running command."
          constraints: "Omission resolves to 10,000 ms; zero resolves to disabled; it never terminates work."
        - name: "hard_timeout_ms"
          type: "Option<u64>"
          description: "Optional wall-clock process lifetime limit."
          constraints: "Omission means no hard deadline; explicit values retain the existing 1,800,000 ms effective maximum and expire with status 124."
        - name: "run_in_background"
          type: "bool"
          description: "Whether to register managed work immediately."
          constraints: "When true, bypass the soft-yield wait but retain the hard deadline."
        - name: "notify"
          type: "bool"
          description: "Whether completion notification is requested."
          constraints: "Uses existing default and manager behavior."
        - name: "wake"
          type: "bool"
          description: "Whether completion wakes the agent."
          constraints: "Wake implies notification under existing behavior."
        - name: "stall_wake_seconds"
          type: "Option<u64>"
          description: "Optional inactivity interval for a managed task wake."
          constraints: "Uses the existing manager minimum and activity-reset behavior after immediate or automatic backgrounding."
      relationships:
        - target: "ForegroundCommandExecution"
          type: "one-to-one"
          description: "Each invocation resolves exactly one execution policy before spawning."
    - name: "ForegroundCommandExecution"
      description: "The single original process lineage initially awaited by the Bash caller."
      fields:
        - name: "process_identity"
          type: "ManagedProcessIdentity"
          description: "PID, process start token, process-group member identity, owner, and transfer policy."
          constraints: "Captured once and verified before destructive signaling."
        - name: "started_at"
          type: "Instant and RFC3339 timestamp"
          description: "Monotonic race origin and persisted wall-clock origin."
          constraints: "All deadlines derive from this one command start."
        - name: "soft_yield_deadline"
          type: "Option<Instant>"
          description: "When foreground waiting may return control without terminating work."
          constraints: "Absent when disabled or immediate backgrounding is selected."
        - name: "hard_timeout_deadline"
          type: "Option<Instant>"
          description: "When the process group must be terminated and reaped."
          constraints: "Independent of soft yield and authoritative whenever present."
        - name: "state"
          type: "enum"
          description: "Foreground, yielded, completed, timed out, or cancelled."
          constraints: "Transitions once from foreground and records at most one terminal outcome."
      relationships:
        - target: "ManagedBackgroundTask"
          type: "zero-or-one-to-one"
          description: "A still-running foreground command gains one existing task identity when soft yield wins."
    - name: "ManagedBackgroundTask"
      description: "The existing reusable task record for immediately backgrounded or automatically yielded Bash work."
      fields:
        - name: "task_id"
          type: "String"
          description: "Stable identifier used by bg status, output, wait, cancel, and cleanup."
          constraints: "Exactly one identifier per promoted command."
        - name: "managed_process"
          type: "Option<ManagedProcessIdentity>"
          description: "Identity-safe cancellation and timeout target."
          constraints: "Present for yielded Bash process groups on supported platforms."
        - name: "hard_deadline_at"
          type: "Option<DateTime<Utc>>"
          description: "Reload-safe absolute timeout for detached yielded work."
          constraints: "Optional and defaulted for backward-compatible status deserialization."
        - name: "output_file"
          type: "PathBuf"
          description: "Existing retained task output path."
          constraints: "Read and returned through existing bounded output operations."
        - name: "progress_and_delivery"
          type: "Existing background progress, notification, wake, and stall state"
          description: "Lifecycle signals shared with immediate background execution."
          constraints: "No parallel event or delivery contract."
        - name: "terminal_outcome"
          type: "BackgroundTaskStatus and optional exit code"
          description: "Completed, failed, timed out with 124, or cancelled result."
          constraints: "At most one terminal state and one completion delivery."
      relationships:
        - target: "ForegroundCommandExecution"
          type: "one-to-one"
          description: "An automatically yielded task continues the same process execution rather than a replacement."

