implementation_phases:
  - phase: 1
    name: "Lock contracts and regression cases"
    goal: "Replace timeout-promotion expectations with focused failing tests that encode independent soft yield and hard timeout behavior."
    deliverables:
      - "Schema tests for `soft_yield_ms`, 10,000 ms default, zero-disable behavior, optional hard timeout, immediate backgrounding, units, and maximum."
      - "Fast success and failure tests proving direct results and no managed task."
      - "Silent command tests for default override, shorter, longer, and disabled soft-yield policies."
      - "Explicit foreground and immediate-background timeout tests requiring exit 124 and zero surviving descendants."
  - phase: 2
    name: "Separate foreground yield from hard termination"
    goal: "Implement one-process foreground execution with independent soft-yield and hard-timeout deadlines."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Canonical BashExecutionPolicy resolver with no implicit timeout and additive `soft_yield_ms`."
      - "Ordinary foreground command work that owns output, stdin, process guard, natural completion, and hard timeout after adoption."
      - "Atomic adoption of the same JoinHandle and identity when soft yield wins, with updated non-timeout metadata and guidance."
      - "Immediate background dispatch that bypasses soft yield while preserving optional hard timeout."
  - phase: 3
    name: "Complete managed lifecycle and reload semantics"
    goal: "Make automatically yielded work indistinguishable from existing managed background work for management and supported reloads."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Notify, completion wake, stall wake, progress attachment/follower, bounded output, status, wait, output, cancellation, and cleanup parity on both promotion paths."
      - "Backward-compatible optional persisted hard deadline for detached yielded work."
      - "Reload monitor/reconciliation enforcement of hard timeout through verified managed process identity."
      - "Reload test proving discoverability and one eventual completion or timeout delivery."
  - phase: 4
    name: "Harden races, output bounds, and process cleanup"
    goal: "Prove all boundary outcomes converge without duplicate tasks, duplicate delivery, or orphan processes."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Repeated soft-yield versus completion, soft-yield versus hard timeout, timeout versus completion, and registration versus cancellation tests."
      - "One-lineage PID evidence across 100 deterministic yield-boundary runs."
      - "Silent and output-heavy fixtures proving scheduled yield, concurrent draining, truncation, retrievability, and bounded responses."
      - "Parent-child process-group assertions for hard timeout and cancellation on foreground, yielded, and immediate-background paths."
  - phase: 5
    name: "Document and validate runtime truth"
    goal: "Deliver consistent public guidance and prove behavior using the actual new executable."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Bash execution documentation and schema with no remaining implicit 120-second or timeout-as-yield claim."
      - "Focused jcode-app-core and jcode-base tests, including the controlled fast-command median overhead comparison."
      - "Serialized self-dev build and relevant repository guardrails with changed-surface failures resolved."
      - "Resolved newly built binary on a unique socket: one silent command soft-yields then completes, and one explicit-timeout parent/child command exits 124 with no descendants."
      - "Final scope and compatibility review confirming no unrelated tool timeout changes or parallel background mechanism."

