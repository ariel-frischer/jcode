feature:
  branch: "024-bash-soft-yield"
  created: "2026-09-02"
  status: "Draft"
  input: "Implement Bead jcode-zrc: automatically soft-yield foreground Bash commands so the model regains control without killing or duplicating the process. Current local behavior incorrectly overloads timeout: foreground timeout promotes to background while the public schema says timeout is a hard exit-124 limit, and omission currently implies 120 seconds despite schema saying no timeout. Introduce a separate configurable soft-yield window with a sensible default near the Codex-style automatic yield window, retain run_in_background for immediate backgrounding, preserve timeout as an explicit hard process-group kill deadline, reuse the existing background manager, completion/progress/stall wake delivery, cancellation, reload persistence, and bounded output. Silent healthy jobs must yield, not die. Fast commands must be unchanged. Include direct deterministic tests for soft yield, hard timeout, races, silent/output-heavy commands, child process cleanup, schema/docs, and isolated built-binary validation. Preserve compatibility where possible and keep scope surgical."

user_stories:
  - id: "US-001"
    title: "Regain control from long-running foreground commands"
    priority: "P0"
    as_a: "model operating the Bash tool"
    i_want: "a healthy foreground command to yield control automatically after a bounded waiting window"
    so_that: "I can continue reasoning while the original process keeps running exactly once"
    why_this_priority: "The current behavior either blocks control too long or misuses timeout semantics, directly impairing reliable agent operation."
    independent_test: "Run a silent command that outlasts the configured soft-yield window and verify the call returns a background task while the same process continues and later reports completion."
    acceptance_scenarios:
      - given: "a foreground command is still healthy when the soft-yield window expires"
        when: "the window elapses"
        then: "control returns with a reusable background task reference and the original command continues without being killed or duplicated"
      - given: "a foreground command finishes before the soft-yield window expires"
        when: "the command exits"
        then: "its ordinary completed result is returned with no background promotion"

  - id: "US-002"
    title: "Apply timeout only as a hard deadline"
    priority: "P0"
    as_a: "tool caller"
    i_want: "an explicitly supplied timeout to remain a hard execution limit"
    so_that: "commands cannot run beyond the deadline and public behavior matches the documented contract"
    why_this_priority: "Overloading timeout as background promotion violates the public schema and can leave work running when callers expect termination."
    independent_test: "Run a command and child process beyond an explicit short timeout, then verify exit status 124 and termination of the full process group."
    acceptance_scenarios:
      - given: "a command has an explicit timeout and remains active at the deadline"
        when: "the deadline is reached"
        then: "the command and its child processes are terminated and the result reports exit status 124"
      - given: "a command omits timeout"
        when: "it remains healthy beyond 120 seconds"
        then: "it is not killed merely because timeout was omitted"

  - id: "US-003"
    title: "Manage yielded work consistently"
    priority: "P1"
    as_a: "model monitoring a yielded command"
    i_want: "yielded foreground work to use the same management lifecycle as explicitly backgrounded work"
    so_that: "I receive bounded progress, wake, completion, cancellation, and reload-safe behavior through one consistent interface"
    why_this_priority: "A consistent lifecycle prevents lost jobs and avoids a second incompatible background mechanism."
    independent_test: "Yield a command, observe bounded progress and completion delivery, reload the session, and cancel another yielded command through the existing task controls."
    acceptance_scenarios:
      - given: "a foreground command has yielded into managed background execution"
        when: "it emits progress, becomes stalled, completes, is cancelled, or the session reloads"
        then: "the existing background lifecycle preserves and delivers the corresponding state without unbounded output"
      - given: "run_in_background is true"
        when: "the command starts"
        then: "it backgrounds immediately without waiting for the soft-yield window"

  - id: "US-004"
    title: "Configure automatic yielding without regressions"
    priority: "P1"
    as_a: "Jcode operator"
    i_want: "a separately configurable soft-yield window with a practical default"
    so_that: "I can balance responsiveness and foreground completion without changing timeout behavior"
    why_this_priority: "Operators need predictable defaults and explicit control while existing fast-command workflows remain unchanged."
    independent_test: "Exercise default, shorter, longer, and disabled soft-yield configurations against fast and slow commands and compare their observable behavior."
    acceptance_scenarios:
      - given: "no soft-yield value is supplied"
        when: "a foreground command runs"
        then: "a documented default near the established automatic-yield convention is used"
      - given: "a caller configures the soft-yield window"
        when: "a foreground command runs longer than that window"
        then: "the configured value controls only automatic yielding and does not alter the hard timeout deadline"

requirements:
  functional:
    - id: "FR-001"
      description: "The Bash tool MUST expose a soft-yield window independently from the hard timeout setting."
      acceptance_criteria: "The public schema and user documentation describe distinct soft-yield and timeout inputs with non-overlapping meanings."
    - id: "FR-002"
      description: "A foreground command that is still running when the soft-yield window expires MUST return control while continuing the original process exactly once."
      acceptance_criteria: "A deterministic command outlasting the window yields a task reference, retains one process lineage, and subsequently produces one terminal result."
    - id: "FR-003"
      description: "A foreground command that completes before the soft-yield window expires MUST retain existing synchronous completion behavior."
      acceptance_criteria: "Representative fast successful and failing commands return their direct results without creating managed background tasks."
    - id: "FR-004"
      description: "When run_in_background is true, the command MUST enter managed background execution immediately rather than waiting for automatic soft yield."
      acceptance_criteria: "An explicitly backgrounded command returns a task reference promptly and remains manageable through the existing lifecycle."
    - id: "FR-005"
      description: "An explicit timeout MUST be enforced as a hard wall-clock deadline that terminates the command process group and reports exit status 124."
      acceptance_criteria: "A command and spawned child that exceed the deadline are both absent afterward, and the caller receives exit status 124."
    - id: "FR-006"
      description: "Omitting timeout MUST mean no hard timeout is imposed by the Bash tool."
      acceptance_criteria: "A healthy command can remain active beyond the former implicit 120-second limit without timeout termination."
    - id: "FR-007"
      description: "The default soft-yield window MUST be documented and SHOULD be approximately 10 seconds unless an existing compatibility constraint requires a nearby value."
      acceptance_criteria: "With no override, a slow command yields within the documented default tolerance while a command completing sooner remains foreground."
    - id: "FR-008"
      description: "Yielded foreground commands MUST use the existing background task manager and its task identifiers."
      acceptance_criteria: "Existing status, output, wait, cancellation, and cleanup operations work for automatically yielded tasks without a separate management surface."
    - id: "FR-009"
      description: "Yielded commands MUST preserve completion, progress, stall-wake, and completion-wake delivery behavior available to existing background commands."
      acceptance_criteria: "Deterministic silent and output-producing jobs trigger the same applicable lifecycle notifications as explicitly backgrounded jobs."
    - id: "FR-010"
      description: "Yielded command state MUST survive supported reloads to the same extent as existing managed background work."
      acceptance_criteria: "After a reload during execution, the task remains discoverable and can deliver its eventual terminal state."
    - id: "FR-011"
      description: "Output returned at yield time and through later task operations MUST remain bounded under both silent and output-heavy workloads."
      acceptance_criteria: "A high-volume command yields without an unbounded response, retained output obeys documented limits, and terminal output remains retrievable within those limits."
    - id: "FR-012"
      description: "Cancellation of an automatically yielded command MUST terminate its managed process group and prevent orphan child processes."
      acceptance_criteria: "Cancelling a yielded parent with descendants produces one cancelled terminal state and leaves no descendant running."
    - id: "FR-013"
      description: "Soft-yield, natural completion, explicit timeout, and cancellation races MUST resolve to one coherent terminal or running state without duplicate tasks, duplicate completion delivery, or orphan processes."
      acceptance_criteria: "Repeated deterministic boundary tests observe exactly one task identity and at most one terminal outcome per execution."
    - id: "FR-014"
      description: "Public schema and documentation MUST state that soft yield does not terminate work, timeout is optional and hard, omission means no hard deadline, and run_in_background backgrounds immediately."
      acceptance_criteria: "Schema inspection and documentation review expose all four behaviors consistently with no remaining claim of an implicit 120-second timeout."
    - id: "FR-015"
      description: "The delivered built executable MUST demonstrate soft yield and hard timeout behavior in an isolated runtime environment."
      acceptance_criteria: "Validation using the newly built executable and an isolated execution endpoint confirms a silent job yields and completes, while a separately timed job exits 124 with children cleaned up."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Automatic yielding must not kill, restart, or duplicate a healthy command."
      measurable_target: "Across 100 deterministic yield-boundary executions, 100% retain one process lineage and one terminal outcome."
    - id: "NFR-002"
      category: "performance"
      description: "Fast foreground commands must not incur a user-visible regression from soft-yield support."
      measurable_target: "Commands completing within 100 milliseconds retain synchronous behavior and add no more than 20 milliseconds median overhead in a controlled comparison."
    - id: "NFR-003"
      category: "reliability"
      description: "Hard timeout and cancellation must clean up complete process groups."
      measurable_target: "100% of deterministic parent-child cleanup tests leave zero command descendants running after the bounded cleanup period."
    - id: "NFR-004"
      category: "code_quality"
      description: "The change must remain surgical and preserve compatibility for existing background task consumers."
      measurable_target: "All existing Bash and background-manager tests pass, and no existing public input is removed or redefined except correcting timeout to its documented contract."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Models regain control from healthy long-running foreground commands automatically without losing the work."
      metric: "Share of commands exceeding the default yield window that return a manageable task while later reaching their original terminal result"
      target: "100% in deterministic acceptance runs"
    - id: "SC-002"
      description: "Explicit hard deadlines behave predictably for callers."
      metric: "Share of over-deadline commands reporting status 124 with all descendants stopped"
      target: "100% in deterministic timeout and race runs"
    - id: "SC-003"
      description: "Ordinary fast command usage remains unchanged."
      metric: "Behavioral compatibility rate for commands completing before the soft-yield threshold"
      target: "100% across the existing foreground command test suite"
    - id: "SC-004"
      description: "Long-running silent and output-heavy jobs remain observable without overwhelming the caller."
      metric: "Acceptance cases that yield, remain manageable, deliver a terminal state, and respect output bounds"
      target: "100% of silent and output-heavy acceptance cases"
    - id: "SC-005"
      description: "Users can understand and independently select immediate backgrounding, automatic yielding, and hard timeout behavior."
      metric: "Consistency of public schema and documentation against the four documented execution modes"
      target: "No contradictory or missing behavior statements in review"

key_entities:
  - name: "Foreground Command Execution"
    description: "A command initially awaited directly by the model."
    attributes:
      - "command identity"
      - "start time"
      - "soft-yield deadline"
      - "optional hard-timeout deadline"
      - "current execution state"
  - name: "Managed Background Task"
    description: "The durable management record used after immediate backgrounding or automatic soft yield."
    attributes:
      - "task identifier"
      - "process-group identity"
      - "bounded output"
      - "progress and stall state"
      - "terminal outcome"
      - "wake delivery settings"

edge_cases:
  - scenario: "The command exits at nearly the same instant the soft-yield window expires."
    expected_behavior: "The caller observes either direct completion or one managed task with the same completion, never both and never a duplicate process."
  - scenario: "The hard timeout expires at nearly the same instant as soft yield or natural completion."
    expected_behavior: "One authoritative outcome is recorded, with status 124 only when the hard deadline wins, and no descendant process survives."
  - scenario: "A command is cancelled while automatic yielding is being registered."
    expected_behavior: "Cancellation reaches the original process group, produces one terminal state, and creates no orphan or duplicate task."
  - scenario: "A healthy command produces no output before or after yielding."
    expected_behavior: "It yields on schedule, remains active, and later delivers completion without being mistaken for a dead or timed-out job."
  - scenario: "A command continuously produces more output than can be retained."
    expected_behavior: "Execution continues, responses and retained output remain bounded, and truncation is communicated consistently."
  - scenario: "The session reloads after yield but before completion."
    expected_behavior: "The task remains discoverable and its existing progress, cancellation, and completion controls continue to work."
  - scenario: "The soft-yield window is longer than an explicit hard timeout."
    expected_behavior: "The hard timeout terminates the command before any soft yield and reports status 124."
  - scenario: "Immediate backgrounding is requested together with a hard timeout."
    expected_behavior: "The task backgrounds immediately and the hard timeout still terminates its process group at the deadline."

assumptions:
  - "A default soft-yield window of approximately 10 seconds is close to the intended Codex-style automatic yield behavior and can be adjusted slightly for compatibility."
  - "The existing background task lifecycle is the authoritative behavior for progress, stall wake, completion wake, cancellation, reload persistence, and output limits."
  - "Soft yield is enabled by default for foreground Bash commands and may be explicitly configured without changing timeout semantics."
  - "Correcting omitted timeout from an implicit 120-second limit to no hard deadline is an intentional contract fix despite the local behavioral change."

constraints:
  - "Preserve the existing run_in_background public behavior for immediate backgrounding."
  - "Preserve timeout as an optional hard process-group deadline with exit status 124."
  - "Reuse the existing background management lifecycle rather than creating a parallel task system."
  - "Keep responses and retained command output bounded."
  - "Keep the change narrowly scoped to Bash execution semantics, lifecycle integration, tests, schema, and documentation."

out_of_scope:
  - "Redesigning the general background task user interface or lifecycle."
  - "Changing timeout semantics for unrelated tools."
  - "Adding a new process supervisor independent of the existing background manager."
  - "Guaranteeing preservation of command output beyond the established bounded-output policy."

