  created: "2026-09-05"
  spec_path: "specs/026-workflow-observability/spec.yaml"
summary: |
  Add an opt-in server-owned workflow observer with a passive main-TUI panel.
  Reuse existing swarm membership, activity bus events, background types, canonical config,
  and client fanout. Keep custom Autospec parsing in a separate adapter module.
  A single explicit bg observation registration names the task worktree and spec artifact.
  The server observes registered files and the runtime's existing session members without
  shelling out, running models, changing providers, or controlling workflow processes.
technical_context:
  language: "Rust"
  framework: "Tokio and Ratatui"
  primary_dependencies:
    - name: "serde"
      version: "workspace existing"
      purpose: "Additive config, snapshot and registration contracts"
    - name: "tokio"
      version: "workspace existing"
      purpose: "Bounded server observer scheduling and existing fanout"
  storage: "Bounded private per-session registration and last-good snapshots under Jcode home"
  testing:
    framework: "Rust unit/integration tests and debug-socket tester frames"
    approach: "Deterministic clock and fake artifacts before isolated runtime and focused guardrails"
  target_platform: "Jcode TUI/CLI on Linux; portable observation without process control"
  project_type: "cli"
  performance_goals: "Zero model turns for routine monitoring; no reads while disabled; polling bounded and no I/O during rendering"
  constraints:
    - "No new Go implementation or SDK projection"
    - "No installed config changes or provider switches"
    - "No global filesystem/process scan or terminal-output parsing"
  scale_scope: "Small bounded owned workflow set, default at most three visible rows"
