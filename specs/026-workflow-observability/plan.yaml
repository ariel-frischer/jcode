research_findings:
  decisions:
    - topic: "Producer contract"
      decision: "Observe explicit Autospec tasks YAML plus optional controller status JSON, never autospec st output"
      rationale: "Installed status has no JSON mode; tasks artifacts are structured; controller failure must remain separate from task counts"
      alternatives_considered:
        - "Repeated model-run status commands waste tokens"
        - "Global history YAML lacks reliable worktree ownership"
    - topic: "Child association"
      decision: "Use explicit registered worktree ownership and runtime members, preserving a stable registration ID across phase sessions"
      rationale: "Autospec SDK createSessionOptions currently sets WorkingDir/Profile but no parent ID"
      alternatives_considered:
        - "Modify custom Autospec and Go SDK together, expanding scope"
        - "Infer children from transcript text or scan all saved sessions, unsafe and expensive"
    - topic: "Health"
      decision: "Separate lifecycle, observed activity, checkpoint progress and observer validity"
      rationale: "Liveness or repeated output does not prove task progress; silence alone is not failure"
      alternatives_considered:
        - "Single spinner with timeout"
        - "Model-estimated completion percentage"
    - topic: "Upstream compatibility"
      decision: "Keep optional adapter isolated from generic transport, renderer and lifecycle"
      rationale: "This fork-specific integration should remain removable without destabilizing native subagents"
      alternatives_considered:
        - "Hardcode Autospec logic into main TUI"
        - "Create a general plugin ABI before a second real adapter exists"
    - topic: "Mixed-version client compatibility"
      decision: "Add an omitted-when-false workflow_progress boolean to Subscribe; send typed workflow events only to opted-in connection senders"
      rationale: "Old servers ignore new Subscribe fields and old clients never receive an unknown event. SetFeature uses a closed enum and is busy-gated, so it is not the appropriate capability handshake."
      alternatives_considered:
        - "Broadcast a new event to every session attachment, which can break old clients"
        - "Overload SwarmStatus with empty members, which would clear older clients' existing galleries"
