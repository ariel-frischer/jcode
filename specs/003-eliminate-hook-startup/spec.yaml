feature:
  branch: "003-eliminate-hook-startup"
  created: "2026-08-08"
  status: "Draft"
  input: "Eliminate per-tool hook process startup overhead safely"

user_stories:
  - id: "US-001"
    title: "Run hooked tools without repeated startup delay"
    priority: "P1"
    as_a: "Jcode user with hooks enabled"
    i_want: "common tool operations to avoid paying the full hook startup cost for every event"
    so_that: "hooks remain useful without making fast tool calls feel slow"
    why_this_priority: "The measured hook overhead dominates the latency and processing cost of otherwise inexpensive tool operations."
    independent_test: "Compare repeated representative cheap tool operations with hooks enabled against the established baseline and verify the required latency reduction while every expected hook event is delivered."
    acceptance_scenarios:
      - given: "a valid hook configuration and a representative inexpensive tool operation"
        when: "the operation is invoked repeatedly"
        then: "the median added delay from hook handling is materially lower than the established per-invocation baseline"
      - given: "hooks are disabled"
        when: "the same inexpensive tool operation is invoked"
        then: "its behavior and performance remain consistent with the existing disabled-hook path"

  - id: "US-002"
    title: "Preserve trustworthy hook behavior"
    priority: "P1"
    as_a: "Jcode user who relies on hook automation"
    i_want: "faster hook handling to preserve delivery, ordering, filtering, and failure isolation"
    so_that: "performance improvements do not make automation unreliable or weaken safety boundaries"
    why_this_priority: "Dropped, duplicated, reordered, recursive, or leaking hook events would make the optimization unsafe."
    independent_test: "Exercise successful, failing, disabled, filtered, recursive, sequential, and concurrent hook scenarios and compare observable outcomes with the current contract."
    acceptance_scenarios:
      - given: "multiple eligible tool events and a configured hook"
        when: "the events occur sequentially or concurrently"
        then: "each eligible event is delivered exactly once with its expected payload and ordering contract"
      - given: "a hook fails, exits unexpectedly, or becomes unavailable"
        when: "an eligible tool operation completes"
        then: "the hook failure remains contained and does not change the tool result or destabilize later hook handling"
      - given: "an event is excluded by filtering or recursion suppression"
        when: "the tool operation completes"
        then: "no excluded or recursive hook execution occurs"

  - id: "US-003"
    title: "Verify and reverse the optimization"
    priority: "P2"
    as_a: "Jcode maintainer"
    i_want: "repeatable performance and behavior evidence plus a documented rollback path"
    so_that: "the improvement can be shipped confidently and reversed without changing user hook definitions"
    why_this_priority: "Repeatable evidence and rollback reduce rollout risk after core behavior is proven."
    independent_test: "Run the documented benchmark and behavior checks against the executing build, then follow the rollback procedure and verify the prior behavior is restored."
    acceptance_scenarios:
      - given: "the optimized behavior is available in the executing build"
        when: "the documented benchmark is repeated"
        then: "it reports attributable before-and-after hook cost and meets the stated performance target"
      - given: "a maintainer elects to roll back the optimization"
        when: "the documented rollback is applied"
        then: "existing hook definitions continue to work without migration"

requirements:
  functional:
    - id: "FR-001"
      description: "The product MUST materially reduce the repeated startup delay added by enabled hooks to representative inexpensive tool operations."
      acceptance_criteria: "A reproducible comparison shows at least an 80% reduction in median hook-attributable latency for the agreed cheap-tool workload relative to the established baseline."
    - id: "FR-002"
      description: "The product MUST deliver every eligible hook event exactly once with the same event data exposed by the existing hook contract."
      acceptance_criteria: "A deterministic run of at least 10,000 eligible events records no missing, duplicate, or payload-incompatible deliveries."
    - id: "FR-003"
      description: "The product MUST preserve the existing ordering contract for hook events."
      acceptance_criteria: "Sequential and concurrent behavior tests observe the same documented ordering guarantees as the baseline."
    - id: "FR-004"
      description: "The product MUST preserve hook selection, environment controls, filtering, and recursion suppression."
      acceptance_criteria: "Focused positive and negative scenarios produce the same eligible and excluded event sets as the baseline, including recursive hook-triggered operations."
    - id: "FR-005"
      description: "The product MUST contain hook startup, execution, and availability failures without changing the completed tool result or destabilizing subsequent hook handling."
      acceptance_criteria: "Failure scenarios covering invalid startup, non-zero completion, abrupt termination, and temporary unavailability leave tool outcomes unchanged and allow later eligible events to be handled."
    - id: "FR-006"
      description: "The product MUST preserve current behavior when hooks are disabled or no hook matches an event."
      acceptance_criteria: "Disabled-hook and no-match scenarios emit no hook event and show no material regression from their established latency baseline."
    - id: "FR-007"
      description: "The product MUST apply current hook configuration and enablement controls without executing stale or unauthorized events after a supported configuration transition."
      acceptance_criteria: "Supported enable, disable, and configuration-change scenarios observe only the configuration that is effective for each event."
    - id: "FR-008"
      description: "The product MUST provide repeatable evidence that attributes hook-related delay and processing cost before and after the change."
      acceptance_criteria: "The documented workload reports the executing build identity, hooks-enabled and hooks-disabled controls, event volume, median latency, and processing-cost measurements."
    - id: "FR-009"
      description: "The product MUST have a documented rollback path that does not require users to rewrite hook definitions."
      acceptance_criteria: "A maintainer can restore the prior execution behavior and all existing compatibility fixtures remain valid without hook-definition migration."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Enabled hooks must impose substantially less incremental delay on inexpensive tool operations."
      measurable_target: "At least 80% lower median hook-attributable latency for each agreed representative cheap-tool workload, with no material regression when hooks are disabled."
    - id: "NFR-002"
      category: "reliability"
      description: "Hook delivery must remain lossless, non-duplicating, ordered according to the existing contract, and recoverable after failures."
      measurable_target: "Zero missing or duplicate deliveries across at least 10,000 eligible events, with all focused ordering and recovery scenarios passing."
    - id: "NFR-003"
      category: "security"
      description: "The optimization must not broaden event visibility, transmitted data, permissions, environment exposure, or recursion behavior."
      measurable_target: "All trust-boundary, filtering, environment, payload, and recursion compatibility scenarios produce no new data exposure or eligible event."
    - id: "NFR-004"
      category: "code_quality"
      description: "Performance and compatibility evidence must be reproducible against the build that actually executes the workflow."
      measurable_target: "A clean documented run records the resolved executable identity and reproduces all benchmark and behavioral acceptance checks."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users with hooks enabled experience substantially faster inexpensive tool operations."
      metric: "Median hook-attributable end-to-end delay across the representative cheap-tool workload"
      target: "At least 80% lower than the established pre-change baseline for each agreed workload"
    - id: "SC-002"
      description: "Hook-dependent automation continues to receive complete and unambiguous events."
      metric: "Missing, duplicate, payload-incompatible, or contractually misordered deliveries"
      target: "Zero across at least 10,000 eligible events and all focused compatibility scenarios"
    - id: "SC-003"
      description: "Hook failures remain invisible to the completed tool outcome and do not prevent later automation."
      metric: "Tool-result changes or unrecovered later events across the defined failure matrix"
      target: "Zero"
    - id: "SC-004"
      description: "Existing users adopt the improved behavior without changing hook configuration."
      metric: "Existing valid hook configurations requiring migration or manual edits"
      target: "Zero"

key_entities:
  - name: "Hook configuration"
    description: "The user-authored rules that determine which tool events invoke which automation."
    attributes:
      - "enablement and filtering controls"
      - "hook command or action definition"
      - "effective environment"
  - name: "Hook event"
    description: "The contract-bounded notification produced for an eligible tool operation."
    attributes:
      - "event identity and type"
      - "ordered payload"
      - "eligibility and recursion state"
  - name: "Hook outcome"
    description: "The observable completion or failure of hook handling without ownership of the originating tool result."
    attributes:
      - "delivery status"
      - "failure state"
      - "recovery of later events"

edge_cases:
  - scenario: "Hooks are disabled, absent, or no configured hook matches the event."
    expected_behavior: "No hook runs, no stale event is delivered, and the inexpensive tool path retains its established behavior and performance."
  - scenario: "A hook fails to start, exits unsuccessfully, terminates abruptly, hangs, or becomes temporarily unavailable."
    expected_behavior: "The failure remains contained, the tool result is unchanged, and later eligible events can still be handled under the existing contract."
  - scenario: "Many eligible events arrive rapidly or concurrently."
    expected_behavior: "Every event is delivered exactly once without violating the existing ordering contract or causing unbounded delay."
  - scenario: "A hook action itself triggers a tool operation."
    expected_behavior: "Existing recursion suppression prevents unintended repeated hook execution."
  - scenario: "Hook configuration or enablement changes while Jcode remains active."
    expected_behavior: "Each event follows the configuration effective under the existing transition contract, with no stale or cross-configuration delivery."
  - scenario: "The optimized hook handling capability restarts or is unavailable during an event."
    expected_behavior: "Failure is contained and observable according to the current contract, without duplicate delivery or a changed tool result."

assumptions:
  - "The existing hook event payload, ordering, filtering, environment, recursion suppression, and failure-containment behavior are the compatibility baseline."
  - "The profiling evidence owned by Bead jcode-skr provides the pre-change cheap-tool latency and processing-cost baseline."
  - "An 80% median reduction is a material target given the observed approximately 50-millisecond per-event startup cost, while exact budgets will be confirmed during planning."
  - "Existing valid user hook definitions must continue to work without migration or opt-in."
  - "Performance validation can use deterministic local workloads without live, costly, or production-adjacent systems."

constraints:
  - "The change must remain surgical and preserve all existing CLI, configuration, event, and persisted contracts in accordance with PRIN-001 and PRIN-002."
  - "Hook inputs, environment, failures, and transmitted event data remain trust-boundary concerns governed by PRIN-006."
  - "The executing build must be identified and measured with before-and-after evidence in accordance with PRIN-010; compilation alone is insufficient."
  - "Focused behavioral checks and repository delivery guardrails remain mandatory under PRIN-005 and PRIN-007."
  - "The hook dispatch lifecycle remains the single capability owner; the work must not introduce an unrelated general-purpose execution framework under PRIN-004 and PRIN-008."
  - "No live, costly, or production-adjacent validation may run without explicit user approval."

out_of_scope:
  - "Changing user-authored hook payloads, definitions, ordering guarantees, filtering rules, or enablement controls."
  - "Bypassing hooks or special-casing one tool to avoid hook cost."
  - "Creating a general-purpose process or task broker for unrelated Jcode capabilities."
  - "Redesigning tool execution, provider behavior, session ownership, or the shared-server architecture."
  - "Requiring a migration or configuration rewrite for existing valid hooks."

