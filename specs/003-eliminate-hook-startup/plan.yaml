      notes: "Maps detachment, arguments, cwd, environment removals, fallback, failures, filtering, recursion, concurrency, and disabled/no-match behavior to focused tests before broader checks."
    - name: "Visible Failures and Trust-Boundary Validation (PRIN-006)"
      status: "PASS"
      notes: "Preserves contract-bounded payload and environment transmission, logs launch failures without secret values, retains recursion suppression, and falls back safely when the launcher is unavailable."
    - name: "Repository Guardrails Are Delivery Gates (PRIN-007)"
      status: "PASS"
