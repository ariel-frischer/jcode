implementation_phases:
  - phase: 1
    name: "Observer launch boundary"
    goal: "Avoid the shared-server pre_exec fork path while preserving detached-process semantics and a portable rollback path."
    deliverables:
      - "Add the Linux observer-only setsid launcher and immediate fallback to the existing spawn_detached implementation when it cannot start."
      - "Preserve program, arguments, cwd, inherited environment, explicit assignments, explicit removals, and null stdio during command reconstruction."
      - "Add focused platform tests proving new-session detachment, command fidelity, unavailable-launcher fallback, and unchanged non-Linux behavior."
  - phase: 2
    name: "Hook dispatch integration and compatibility"
    goal: "Use the optimized boundary only for detached observers and prove the existing hook contract is unchanged."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Route dispatch_observer through the observer-specific launcher while leaving run_pre_tool_gate untouched."
      - "Add focused success, invalid-start, non-zero or abrupt completion, multiple-command, filtering, recursion, configuration-transition, sequential, concurrent, disabled, and no-match coverage."
      - "Verify observer failure never changes Registry tool success or error results and later events remain dispatchable."
  - phase: 3
    name: "Reproducible performance and delivery evidence"
    goal: "Prove the user-visible latency target and exact-once compatibility through the landed production Registry profiler."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Extend tool_profile and profile_tools.py with deterministic paired tiny-read and bash-true hook workloads, hooks-disabled controls, event identifiers, completion synchronization, child CPU, and canonical executable identity."
      - "Run before and after measurements and require at least 80% lower median hook-attributable latency with no material disabled-hook regression."
      - "Run at least 10,000 eligible events and assert zero missing, duplicate, payload-incompatible, excluded, or contractually misordered deliveries."
  - phase: 4
    name: "Executing-build validation and delivery"
    goal: "Validate the optimized behavior through the actual Jcode runtime and leave a documented, migration-free rollback."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Build the selfdev binary and run a public Registry tool workflow against its own socket or private instance, recording the resolved executable identity."
      - "Run focused package tests and build checks followed by scripts/check_guardrails.sh, isolating any pre-existing unrelated failures."
      - "Document rollback as restoring observer dispatch to spawn_detached; verify existing hook definitions and compatibility fixtures require no changes."

risks:
  - id: "RISK-001"
    risk: "Reconstructing Command could lose an explicit env_remove and expose a daemon environment variable to a hook."
    likelihood: "medium"
    impact: "high"
    mitigation: "Replay both Some assignments and None removals from get_envs and add a negative environment-inheritance test."
  - id: "RISK-002"
    risk: "The host setsid utility may be absent or incompatible on a supported environment."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Restrict the fast path to Linux, fall back on launcher startup failure, retain other platforms unchanged, and test the unavailable-launcher path explicitly."
  - id: "RISK-003"
    risk: "Fire-and-forget completion timing could make a delivery benchmark report false missing events."
    likelihood: "high"
    impact: "medium"
    mitigation: "Use unique event identifiers and a bounded completion barrier or marker-count poll before evaluating the deterministic 10,000-event record."
  - id: "RISK-004"
    risk: "A broad hook benchmark could measure arbitrary user configuration or shared-daemon binaries instead of the implementation."
    likelihood: "medium"
    impact: "high"
    mitigation: "Set a deterministic hook environment explicitly, isolate runtime and scratch paths, canonicalize the measured binary, and retain hooks-disabled controls in the same campaign."
  - id: "RISK-005"
    risk: "Concurrent detached processes can complete in a different order even though dispatch attempts occur in declaration order."
    likelihood: "high"
    impact: "medium"
    mitigation: "Pin tests to the existing documented dispatch-order contract and do not invent completion ordering or serialization that would change current concurrency behavior."

