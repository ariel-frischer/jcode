plan:
  branch: "agent/jcode-d5o-hook-startup"
  created: "2026-08-08"
  spec_path: "specs/003-eliminate-hook-startup/spec.yaml"

summary: |
  Remove the measured observer-hook overhead without introducing a resident
  broker or changing the hook contract. The current shared server detaches each
  observer through a Unix pre-exec callback that calls setsid; Rust documents
  that pre-exec runs after fork, so the large server address space is duplicated
  before every cheap post-tool hook. Add an observer-only Linux launch path that
  executes the existing hook command through the system setsid launcher, allowing
  Rust to retain its lower-overhead spawn path, and fall back to the existing
  detachment helper when that launcher is unavailable. Keep the synchronous
  pre_tool gate and every user-authored hook definition unchanged.

  Preserve command arguments, inherited and explicitly removed environment
  entries, client terminal identity, current directory, null stdio, recursion
  suppression, declaration-order dispatch, and failure isolation. Extend the
  landed tool profiling harness with deterministic hooks-enabled and
  hooks-disabled comparison modes, delivery accounting, child CPU measurement,
  and executable identity so the optimized build can prove the 80% median
  hook-attributable latency reduction and zero missing or duplicate deliveries
  over 10,000 eligible events.

technical_context:
  language: "Rust 2024 edition and Python 3 for the existing benchmark driver"
  framework: "None"
  primary_dependencies:
    - name: "Rust standard library std::process"
      version: "current stable toolchain"
      purpose: "Builds hook commands and uses the ordinary platform spawn path when no pre_exec callback is installed."
    - name: "libc"
      version: "0.2"
      purpose: "Retains the existing Unix setsid fallback and process/session assertions; no new native dependency is introduced."
    - name: "tokio"
      version: "1"
      purpose: "Preserves the existing asynchronous pre_tool gate, timeout, and process handling without modification."
    - name: "serde_json"
      version: "1"
      purpose: "Preserves lifecycle-hook payload serialization and benchmark result parsing."
    - name: "util-linux setsid"
      version: "host-provided on the measured Linux target"
      purpose: "Creates the observer hook session in the spawned launcher process so the shared server does not require a pre_exec callback."
  storage: "None; benchmark results and deterministic delivery markers are temporary files under the existing JCODE_SCRATCH_DIR workflow"
  testing:
    framework: "Rust built-in test harness plus the existing tool_profile binary and scripts/profile_tools.py driver"
    approach: "Run exact hook and platform tests first; add Linux fast-path, fallback, environment, cwd, detachment, failure, configuration, sequential/concurrent, recursion, and disabled/no-match scenarios; then run paired built-binary profiling with at least 10,000 eligible events and repository guardrails."
  target_platform: "Jcode-supported Linux, macOS, and Windows behavior; the measured fast path and 80% performance target apply to Linux, while other targets retain the existing detachment implementation"
  project_type: "cli"
  performance_goals: "At least 80% lower median hook-attributable latency for agreed tiny-read and bash-true workloads versus the approximately 50 ms baseline; no material disabled-hook regression; zero missing or duplicate deliveries across at least 10,000 eligible events."
  constraints:
    - "Observer hooks remain detached, fire-and-forget external commands; pre_tool remains synchronous, ordered, timeout-bounded, and fail-open."
    - "Every event resolves current hook configuration before launch; no queue or resident worker may retain stale commands, payloads, environment, or enablement state."
    - "Existing hook payloads, command syntax, declaration-order dispatch, client terminal environment, recursion suppression, and tool-result isolation remain unchanged."
    - "The fast launcher must preserve both explicit environment assignments and env_remove entries; reconstructed commands must not accidentally re-inherit removed daemon variables."
    - "Failure to locate or start the Linux setsid launcher falls back to the existing detached spawn path without changing the completed tool result."
    - "No new protocol, configuration field, persisted state, general-purpose broker, daemon authority, or third-party Rust crate is introduced."
    - "Benchmark evidence must identify the resolved executing binary and use isolated, deterministic, local workloads without live or production-adjacent services."
    - "Implementation validation runs focused checks before the relevant build and scripts/check_guardrails.sh, isolating rather than rebaselining unrelated failures."
  scale_scope: "One direct launch attempt per configured observer command and event, including bursts of at least 10,000 post-tool events; constant Jcode-side state and no retained event queue."

