research_findings:
  decisions:
    - topic: "Root cause of observer hook startup cost"
      decision: "Treat the Unix pre_exec setsid callback, not hook parsing or tool execution, as the first optimization target."
      rationale: "Rust's current standard-library contract states that pre_exec runs after fork and duplicates mapped resources; the landed profile shows approximately 50 ms of child CPU per enabled cheap-tool call, while observers are the only hook path using the generic pre_exec-based detached launcher."
      alternatives_considered:
        - "Optimize JSON payload construction, which is too small to explain the measured child CPU and would not remove process startup cost."
        - "Bypass post_tool for cheap tools, which would violate event delivery compatibility."
    - topic: "Execution architecture"
      decision: "Keep one external process per observer event and introduce an observer-specific Linux setsid launcher path with the existing detachment helper as fallback."
      rationale: "Moving setsid into a small spawned launcher permits the shared server to avoid its pre_exec fork path while preserving process isolation, per-event configuration freshness, direct command execution, and rollback as a small call-site change."
      alternatives_considered:
        - "A persistent local broker, which adds lifecycle, IPC, queueing, stale-configuration, replay, authorization, and recovery contracts that the measured problem does not require."
        - "Removing session detachment, which could let terminal or daemon lifecycle affect observer hooks."
        - "Calling libc posix_spawn directly, which duplicates standard-library process construction and adds platform-specific file-action and environment handling risk."
    - topic: "Synchronous gate scope"
      decision: "Do not change pre_tool spawning or execution."
      rationale: "pre_tool deliberately waits for exit status, stderr, stdin consumption, and timeout; its synchronous policy cost is semantically different from detached post-tool observer overhead and is not the approximately 50 ms observer baseline targeted by this feature."
      alternatives_considered:
        - "Route pre_tool through a broker, which would alter policy ordering, timeout, failure, and blocking contracts."
        - "Launch pre_tool through setsid, which provides no observer detachment benefit and expands regression scope."
    - topic: "Environment and command reconstruction"
      decision: "Rebuild the launcher command from Command introspection while copying program, arguments, current directory, explicit environment values, and explicit environment removals, then force null stdio exactly as observer dispatch already does."
      rationale: "Command::get_envs excludes inherited values and represents env_remove entries as None; replaying only assigned values would silently re-inherit variables intentionally removed from the hook environment."
      alternatives_considered:
        - "Copy only non-null get_envs entries, which changes the environment trust boundary."
        - "Change build_hook_process to return a custom command DTO, which broadens the hook construction contract for a single launch optimization."
    - topic: "Portability and launcher availability"
      decision: "Compile the setsid-launcher fast path for Linux, fall back immediately when the launcher cannot be spawned, and retain the existing implementation unchanged on macOS and Windows."
      rationale: "The performance baseline and available launcher are Linux-specific; explicit fallback preserves supported-platform behavior without making util-linux a Cargo or product installation dependency."
      alternatives_considered:
        - "Assume setsid on every Unix platform, which is false on supported macOS installations."
        - "Make setsid a required external dependency, which would turn an optimization into a startup compatibility break."
    - topic: "Performance and delivery evidence"
      decision: "Extend tool_profile and profile_tools.py with a deterministic paired hook mode rather than create a separate benchmark harness."
      rationale: "The existing harness already owns production Registry execution, wall time, self and child CPU, randomization, fixtures, and binary identity; paired suppression and deterministic marker accounting provide attributable evidence with minimal duplication."
      alternatives_considered:
        - "Use arbitrary user-configured hooks with --include-hooks, which is not reproducible and cannot prove delivery counts."
        - "Measure only a platform spawn microbenchmark, which would not prove end-to-end tool behavior or the executing Jcode path."

data_model:
  entities:
    - name: "ObserverHookInvocation"
      description: "The ephemeral command invocation produced for one configured observer hook and one lifecycle event."
      fields:
        - name: "event"
          type: "HookEvent"
          description: "Existing event name, session, cwd, and contract-bounded fields."
          constraints: "Payload and environment representation remain byte-compatible with the current hook contract."
        - name: "command_line"
          type: "String"
          description: "One command selected from the current effective hook configuration."
          constraints: "Parsed with the existing direct-execution parser; blank and suppressed commands remain ineligible."
        - name: "environment_delta"
          type: "Iterator of key and optional value"
          description: "Explicit assignments and removals applied on top of inherited process environment."
          constraints: "None values must remain removals and may not be converted back to inherited daemon values."
        - name: "launch_strategy"
          type: "ObserverLaunchStrategy"
          description: "Linux fast launcher or existing portable fallback selected without changing the hook contract."
          constraints: "Failure is contained and never changes the originating tool result."
      relationships:
        - target: "HookDeliveryEvidence"
          type: "one-to-one"
          description: "A deterministic benchmark hook records whether this eligible invocation was delivered exactly once."
    - name: "ObserverLaunchStrategy"
      description: "The internal, non-persisted method used to create a detached observer process."
      fields:
        - name: "fast_launcher"
          type: "Optional platform command"
          description: "Linux system setsid launcher used without a Jcode pre_exec callback."
          constraints: "Must create a new session and preserve reconstructed command state."
        - name: "fallback"
          type: "Existing spawn_detached function"
          description: "Current Unix pre_exec or Windows creation-flags implementation."
          constraints: "Used when the fast launcher is unsupported or cannot start."
      relationships:
        - target: "ObserverHookInvocation"
          type: "one-to-many"
          description: "One internal strategy handles any number of independent observer invocations without retaining their data."
    - name: "HookDeliveryEvidence"
      description: "The temporary benchmark record used to attribute performance and verify lossless delivery."
      fields:
        - name: "build_identity"
          type: "String"
          description: "Canonical path and version or commit identity of the measured executable."
          constraints: "Must identify the binary that actually runs the Registry workload."
        - name: "eligible_event_count"
          type: "Unsigned integer"
          description: "Number of post-tool events expected from the deterministic workload."
          constraints: "At least 10,000 for reliability acceptance."
        - name: "observed_event_ids"
          type: "Temporary sequence"
          description: "Identifiers written by the deterministic hook for missing, duplicate, and ordering analysis."
          constraints: "Must contain every eligible identifier exactly once and no excluded identifier."
        - name: "wall_and_cpu_distributions"
          type: "Paired benchmark summary"
          description: "Enabled, disabled, and hook-attributable median wall and processing cost."
          constraints: "Reports workload, volume, controls, medians, and at least 80% latency improvement relative to baseline."
      relationships:
        - target: "ObserverHookInvocation"
          type: "one-to-many"
          description: "Aggregates delivery and performance evidence for the eligible invocation set."

