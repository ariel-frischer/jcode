          title: "Run focused validation, formatting, build checks, and scripts/check_guardrails.sh"
          status: "Pending"
          type: "refactor"
          parallel: false
          story_id: null
          file_path: "scripts/check_guardrails.sh"
          dependencies: ["T013"]
          acceptance_criteria:
            - "Exact platform, hook, and Registry tests pass before broader package checks."
            - "The affected selfdev binaries build on the current stable Rust toolchain and Rust formatting and clippy checks pass."
            - "scripts/check_guardrails.sh passes, or any unrelated pre-existing failure is isolated with evidence and the changed surface is proven not to worsen it."
            - "Final status and explicit diffs contain only the observer launch boundary, focused tests, profiler, benchmark documentation, and generated feature artifacts; no secrets, ratchet rebaselines, unrelated cleanup, or hook-contract changes are present."
