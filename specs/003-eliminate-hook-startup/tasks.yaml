phases:
    - number: 1
      title: "Setup"
      purpose: "Establish deterministic test support for observer-hook scenarios without changing production behavior"
      tasks:
        - id: "T001"
          title: "Add reusable observer-hook test fixtures in crates/jcode-base/src/hooks.rs"
          status: "InProgress"
          type: "setup"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/hooks.rs"
          dependencies: []
          acceptance_criteria:
            - "Test-only helpers can install isolated hook configuration, temporary marker output, client-terminal environment, and recursion state without leaking process-global state between tests."
            - "The helpers support unique event identifiers and bounded completion polling needed by sequential, concurrent, configuration-transition, and failure-recovery scenarios."
            - "No production hook payload, configuration, or dispatch behavior changes in this task."
    - number: 2
      title: "Foundational"
      purpose: "Provide the observer-only detached launch boundary required by both performance and compatibility stories"
      tasks:
        - id: "T002"
          title: "Write detached-observer launcher contract tests in crates/jcode-base/src/platform_tests.rs"
          status: "Pending"
          type: "test"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/platform_tests.rs"
          dependencies: ["T001"]
          acceptance_criteria:
            - "Linux tests fail before implementation unless the observer child enters a new session without a Jcode pre_exec callback."
            - "Tests cover exact program and argument forwarding, current directory, inherited environment, explicit environment assignments, explicit environment removals, and null stdio."
            - "A deterministic launcher-unavailable test requires immediate fallback to the existing spawn_detached behavior."
            - "Conditional coverage asserts that non-Linux targets continue to use the established portable detachment path."
        - id: "T003"
          title: "Implement the Linux observer launcher and portable fallback in crates/jcode-base/src/platform.rs"
          status: "Pending"
          type: "implementation"
          parallel: false
          story_id: null
          file_path: "crates/jcode-base/src/platform.rs"
          dependencies: ["T002"]
          acceptance_criteria:
            - "On Linux, spawn_detached_observer reconstructs the command through the host setsid launcher without installing a Jcode pre_exec callback."
            - "Command reconstruction preserves the program, arguments, current directory, inherited environment, explicit assignments, explicit removals, and null stdio exactly."
            - "Failure to locate or start the launcher immediately retries through spawn_detached and returns the fallback result."
            - "macOS and Windows behavior remains on the existing detachment implementation, with no new crate, protocol, configuration, or persisted state."
    - number: 3
      title: "User Story 1 - Run hooked tools without repeated startup delay"
      purpose: "Make repeated cheap tool operations measurably faster with hooks enabled while preserving the disabled path"
      story_reference: "US-001"
      independent_test: "Run paired tiny-read and bash-true workloads through the production Registry profiler with deterministic hooks enabled and disabled; compare against the recorded baseline and require at least 80% lower median hook-attributable latency with no material disabled-hook regression."
      tasks:
        - id: "T004"
          title: "Add failing paired-profile assertions in scripts/profile_tools.py"
          status: "Pending"
          type: "test"
          parallel: false
          story_id: "US-001"
          file_path: "scripts/profile_tools.py"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Testable aggregation logic rejects results missing canonical binary identity, enabled and disabled controls, workload volume, wall medians, or child CPU measurements."
            - "The comparison computes hook-attributable cost from paired tiny-read and bash-true runs and fails when either workload improves by less than 80%."
            - "The disabled control fails on a documented material regression rather than allowing an enabled-only comparison."
        - id: "T005"
          title: "Expose deterministic hook profiling inputs and build identity in src/bin/tool_profile.rs"
          status: "Pending"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "src/bin/tool_profile.rs"
          dependencies: ["T004"]
          acceptance_criteria:
            - "The profiler continues to execute read_tiny and bash_true through production Registry::execute while assigning a deterministic event identity to each measured iteration."
            - "Output reports canonical executing-binary identity, iteration count, wall distribution, self CPU, and child CPU in a machine-readable shape consumed by profile_tools.py."
            - "A bounded completion signal permits fire-and-forget observers to finish without changing Registry hook semantics."
            - "Existing non-hook profiling cases and the default hooks-disabled attribution behavior remain compatible."
        - id: "T006"
          title: "Implement deterministic paired hook campaigns in scripts/profile_tools.py"
          status: "Pending"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "scripts/profile_tools.py"
          dependencies: ["T005"]
          acceptance_criteria:
            - "The driver creates an isolated deterministic observer command and runs randomized enabled and disabled campaigns for read_tiny and bash_true."
            - "The result artifact records the canonical binary, repository, workload, seed, event volume, enabled and disabled medians, hook-attributable wall cost, and child CPU cost."
            - "The driver enforces at least 80% lower median hook-attributable latency relative to the established baseline and reports a clear failure when the target or disabled-path budget is missed."
            - "All fixtures and delivery markers remain under the configured JCODE_SCRATCH_DIR and require no live or production-adjacent service."
    - number: 4
      title: "User Story 2 - Preserve trustworthy hook behavior"
      purpose: "Prove exact-once delivery, existing ordering and filtering, current configuration, and failure isolation"
      story_reference: "US-002"
      independent_test: "Run focused hook and Registry scenarios plus a 10,000-event deterministic campaign; require identical payload and eligibility behavior, zero missing or duplicate events, preserved dispatch ordering, unchanged tool results, and recovery after every defined launch or execution failure."
      tasks:
        - id: "T007"
          title: "Add observer compatibility and recovery tests in crates/jcode-base/src/hooks.rs"
          status: "Pending"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "crates/jcode-base/src/hooks.rs"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Focused tests cover payload and environment compatibility, multiple commands in declaration order, filtering, recursion suppression, disabled and no-match behavior, and client-terminal environment isolation."
            - "Enable, disable, and command-change transitions prove that each event uses current effective configuration and no stale command receives a later event."
            - "Invalid startup, non-zero exit, abrupt termination, and temporary unavailability remain contained and do not prevent a later eligible dispatch."
            - "Sequential and concurrent tests assert the existing dispatch-order contract without inventing child-completion ordering."
        - id: "T008"
          title: "Add Registry tool-result isolation tests in crates/jcode-app-core/src/tool/tests.rs"
          status: "Pending"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "crates/jcode-app-core/src/tool/tests.rs"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Registry-level success and error scenarios prove post-tool observer startup or execution failure never changes the originating ToolOutput or tool error."
            - "Disabled and no-match scenarios emit no observer marker and preserve the established Registry result."
            - "A later eligible tool event remains dispatchable after a failed observer event."
        - id: "T009"
          title: "Route only detached observers through the optimized boundary in crates/jcode-base/src/hooks.rs"
          status: "Pending"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-base/src/hooks.rs"
          dependencies: ["T007", "T008"]
          acceptance_criteria:
            - "dispatch_observer uses spawn_detached_observer after resolving the current hook configuration and building the existing command payload."
            - "Observer launch failures remain warning-only and do not propagate into the completed tool result."
            - "run_pre_tool_gate, hook parsing, payload fields, environment controls, filtering, recursion suppression, and declaration-order dispatch are unchanged."
        - id: "T010"
          title: "Add 10,000-event delivery accounting to scripts/profile_tools.py"
          status: "Pending"
          type: "test"
          parallel: false
          story_id: "US-002"
          file_path: "scripts/profile_tools.py"
          dependencies: ["T006", "T009"]
          acceptance_criteria:
            - "A deterministic campaign emits at least 10,000 eligible unique event identifiers and waits through a bounded completion barrier before evaluation."
            - "Validation fails for any missing, duplicate, payload-incompatible, excluded, recursive, or contractually misordered delivery."
            - "Sequential and concurrent campaigns distinguish dispatch ordering from nondeterministic detached-child completion ordering."
            - "Failure injection confirms later events recover without duplicate replay or a changed tool result."
    - number: 5
      title: "User Story 3 - Verify and reverse the optimization"
      purpose: "Produce repeatable executing-build evidence and a migration-free rollback procedure"
      story_reference: "US-003"
      independent_test: "Build the selfdev profiler and Jcode binary, resolve their executable identities, run the documented paired and 10,000-event checks against an isolated runtime, then verify that restoring observer dispatch to spawn_detached requires no hook-definition change."
      tasks:
        - id: "T011"
          title: "Document the benchmark and source-level rollback in docs/TOOL_PERFORMANCE_PROFILE.md"
          status: "Pending"
          type: "documentation"
          parallel: true
          story_id: "US-003"
          file_path: "docs/TOOL_PERFORMANCE_PROFILE.md"
          dependencies: ["T010"]
          acceptance_criteria:
            - "Documentation gives exact build and paired-profile commands, isolated scratch and socket usage, workload volume, baseline source, metric definitions, thresholds, and expected output fields."
            - "The rollback restores observer dispatch to spawn_detached without changing user-authored hook definitions, payloads, environment variables, configuration, or persisted data."
            - "The procedure explains how to resolve and record the actual executable instead of measuring the shared-server symlink or an old daemon."
        - id: "T012"
          title: "Validate performance and delivery against the executing selfdev build via src/bin/tool_profile.rs"
          status: "Pending"
          type: "test"
          parallel: true
          story_id: "US-003"
          file_path: "src/bin/tool_profile.rs"
          dependencies: ["T010"]
          acceptance_criteria:
            - "A selfdev build with dev-bins runs the paired read_tiny and bash_true workloads and records the canonical executable identity."
            - "Each workload demonstrates at least 80% lower median hook-attributable latency than the established baseline with no material disabled-hook regression."
            - "At least 10,000 eligible events produce zero missing, duplicate, payload-incompatible, excluded, recursive, or contractually misordered deliveries."
            - "A newly built Jcode runtime executes a representative public Registry workflow through its own isolated socket, confirming the optimized code rather than the shared daemon."
        - id: "T013"
          title: "Record measured results and rollback verification in docs/TOOL_PERFORMANCE_PROFILE.md"
          status: "Pending"
          type: "documentation"
          parallel: false
          story_id: "US-003"
          file_path: "docs/TOOL_PERFORMANCE_PROFILE.md"
          dependencies: ["T011", "T012"]
          acceptance_criteria:
            - "The document records the resolved binary identity, workload and event volume, enabled and disabled medians, child CPU, calculated reduction, delivery totals, and command results."
            - "A focused compatibility run using the prior spawn_detached call path confirms existing hook definitions require no migration."
            - "Any skipped, unavailable-platform, or pre-existing evidence gap is identified with scope and owner rather than presented as passing."
    - number: 6
      title: "Polish & Cross-Cutting Concerns"
      purpose: "Apply repository delivery gates and verify that the final diff remains surgical and compatible"
      tasks:
