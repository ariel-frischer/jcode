feature:
  branch: "003-cache-find-inventory"
  created: "2026-08-08"
  status: "Draft"
  input: "Cache agentgrep find file inventory with secure invalidation"

user_stories:
  - id: "US-001"
    title: "Repeat file discovery quickly"
    priority: "P1"
    as_a: "coding agent"
    i_want: "repeated file-finding requests in the same repository to avoid unnecessary inventory discovery work"
    so_that: "I can locate files with lower latency during iterative coding tasks"
    why_this_priority: "Repeated find calls are a common workflow and currently repay repository traversal costs even when the working tree changes little."
    independent_test: "Run the same representative find requests repeatedly in an unchanged repository and compare warm request latency and results with a cold request baseline."
    acceptance_scenarios:
      - given: "a repository whose file inventory and applicable search rules have not changed since a completed find request"
        when: "the coding agent repeats the same or a differently filtered find request"
        then: "the request completes materially faster while returning the same paths, ordering, and limits as an uncached discovery"
      - given: "a repository with no reusable inventory"
        when: "the coding agent performs the first find request"
        then: "the request returns complete results without a material cold-path regression"

  - id: "US-002"
    title: "Trust every returned path"
    priority: "P0"
    as_a: "Jcode user"
    i_want: "file-finding results to reflect repository changes and all existing exclusion rules"
    so_that: "agents do not act on stale, ignored, or sensitive paths"
    why_this_priority: "Incorrect reuse can expose sensitive paths or cause an agent to read, edit, or reference files that no longer exist."
    independent_test: "Prime the inventory, then create, delete, rename, and change applicable ignore rules before issuing another find request; compare every result with a fresh uncached discovery."
    acceptance_scenarios:
      - given: "a previously discovered file is created, deleted, or renamed"
        when: "the next find request is made"
        then: "the result reflects the current repository state and contains no stale path"
      - given: "applicable ignore or sensitive-path rules change after an inventory is reused"
        when: "the next find request is made"
        then: "the result applies the current rules and never reveals newly excluded paths"
      - given: "two repositories contain similar paths"
        when: "find requests alternate between them"
        then: "inventory information from one repository is never returned for the other"

  - id: "US-003"
    title: "Preserve predictable find behavior"
    priority: "P1"
    as_a: "Jcode maintainer"
    i_want: "inventory reuse to remain bounded and behaviorally compatible under varied filters and concurrent requests"
    so_that: "faster discovery does not create runaway resource use or nondeterministic results"
    why_this_priority: "A shared optimization must remain safe for long-lived, multi-session use and preserve the established find contract."
    independent_test: "Exercise path and glob filters, result caps, multiple repositories, concurrent callers, and repeated repository turnover while comparing results and resource use with established behavior."
    acceptance_scenarios:
      - given: "multiple callers issue find requests concurrently for the same or different repositories"
        when: "their requests overlap"
        then: "each caller receives complete, repository-correct results without corruption or cross-request leakage"
      - given: "inventory reuse has covered many repositories or a large repository"
        when: "configured resource bounds are reached"
        then: "older reusable state is discarded without changing find correctness or causing unbounded memory growth"

requirements:
  functional:
    - id: "FR-001"
      description: "MUST reuse a valid repository file inventory across eligible agentgrep find requests."
      acceptance_criteria: "In an unchanged repository, repeated requests demonstrate inventory reuse and return results identical to fresh discovery."
    - id: "FR-002"
      description: "MUST keep repository inventories isolated by canonical repository identity."
      acceptance_criteria: "Alternating requests across repositories with overlapping path names never returns a path from the wrong repository."
    - id: "FR-003"
      description: "MUST detect relevant file creation, deletion, and rename changes before returning a subsequent result."
      acceptance_criteria: "After a primed request, each change type is reflected by the next request with exact parity against fresh discovery."
    - id: "FR-004"
      description: "MUST invalidate reusable inventory state when applicable ignore or exclusion rules change."
      acceptance_criteria: "Changes to repository ignore rules and other applicable search exclusions are reflected by the next request, including removal of newly excluded paths."
    - id: "FR-005"
      description: "MUST preserve all existing sensitive-path exclusions for both cold and reused inventory requests."
      acceptance_criteria: "A security-focused fixture containing sensitive and allowed paths produces zero sensitive-path disclosures across cold, warm, invalidated, and concurrent requests."
    - id: "FR-006"
      description: "MUST preserve current path normalization, ignore behavior, glob and path filtering, result ordering, and result-cap semantics."
      acceptance_criteria: "A representative compatibility matrix produces exact result parity with uncached traversal for every supported filter and cap combination."
    - id: "FR-007"
      description: "MUST bound retained inventory state across repositories and repository sizes."
      acceptance_criteria: "Stress workloads reach the defined bound, discard reusable state as needed, and continue returning correct results without continuing memory growth."
    - id: "FR-008"
      description: "MUST support concurrent find requests without incomplete results, state corruption, or cross-request leakage."
      acceptance_criteria: "Concurrent same-repository and cross-repository workloads complete successfully with exact parity against serialized fresh discovery."
    - id: "FR-009"
      description: "MUST fall back to fresh discovery when reusable inventory validity cannot be established."
      acceptance_criteria: "Simulated ambiguous or unavailable freshness evidence returns correct fresh results and does not silently serve potentially stale paths."
    - id: "FR-010"
      description: "MUST make cache effectiveness, invalidation, retained size, and fallback behavior observable without exposing file contents or sensitive path details."
      acceptance_criteria: "Diagnostics distinguish reuse, invalidation, eviction, and fallback outcomes and disclose only non-sensitive counts or redacted repository identifiers."
    - id: "FR-011"
      description: "MUST preserve established behavior when inventory reuse is unavailable or unused."
      acceptance_criteria: "Requests with no reusable state and requests forced through fresh discovery match the current agentgrep find contract."
  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Repeated find requests in an unchanged representative repository must complete materially faster than fresh discovery."
      measurable_target: "Warm median wall time is at least 30% lower than the cold median for the maintained representative workload."
    - id: "NFR-002"
      category: "performance"
      description: "The first request and requests requiring invalidation must not materially regress."
      measurable_target: "Cold and invalidated median wall time is no more than 10% slower than the established uncached baseline."
    - id: "NFR-003"
      category: "security"
      description: "Inventory reuse must not weaken repository isolation, ignore handling, or sensitive-path protection."
      measurable_target: "100% output parity and zero excluded-path disclosures across the security and repository-isolation test matrix."
    - id: "NFR-004"
      category: "reliability"
      description: "Freshness-sensitive and concurrent workloads must consistently return current results."
      measurable_target: "100% of create, delete, rename, rule-change, and concurrent test iterations match fresh discovery."
    - id: "NFR-005"
      category: "code_quality"
      description: "The optimization must have one canonical owner and remain independently verifiable against the established find contract."
      measurable_target: "Every functional requirement maps to at least one focused automated check, with one end-to-end command-path parity test."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Coding agents receive repeated file-finding results substantially sooner in unchanged repositories."
      metric: "Median elapsed time for representative repeated find workflows"
      target: "At least 30% lower than equivalent fresh discovery"
    - id: "SC-002"
      description: "Users receive current and policy-compliant paths after repository or rule changes."
      metric: "Result mismatches against fresh discovery after freshness-sensitive changes"
      target: "Zero mismatches across all create, delete, rename, ignore-change, and sensitive-path scenarios"
    - id: "SC-003"
      description: "Users experience no meaningful slowdown when reuse is unavailable."
      metric: "Median elapsed time for cold and invalidated requests"
      target: "No more than 10% above the established uncached baseline"
    - id: "SC-004"
      description: "Long-lived multi-session use remains stable as repositories and callers increase."
      metric: "Correctness failures and retained-state growth after the resource bound is reached"
      target: "Zero correctness failures and no continued retained-state growth beyond the defined bound"
    - id: "SC-005"
      description: "Maintainers can determine whether faster discovery is effective without exposing user data."
      metric: "Coverage of reuse, invalidation, eviction, and fallback outcomes in non-sensitive diagnostics"
      target: "All four outcomes are distinguishable using counts or redacted identifiers only"

key_entities:
  - name: "Repository File Inventory"
    description: "The current set of discoverable paths for one repository before request-specific filtering."
    attributes:
      - "canonical repository identity"
      - "discoverable paths"
      - "freshness evidence"
      - "retained size"
  - name: "Freshness Context"
    description: "The repository and policy state that determines whether a retained inventory remains safe to reuse."
    attributes:
      - "repository state"
      - "applicable ignore and exclusion rules"
      - "file change state"
  - name: "Find Request"
    description: "A caller's file-discovery query applied to the current repository inventory."
    attributes:
      - "repository"
      - "path or glob filters"
      - "result cap"
  - name: "Inventory Outcome"
    description: "The non-sensitive operational outcome used to assess correctness and effectiveness."
    attributes:
      - "fresh discovery or reuse"
      - "invalidation or eviction reason"
      - "item count and retained size"

edge_cases:
  - scenario: "A file changes while inventory discovery or a find request is in progress."
    expected_behavior: "The request returns a self-consistent result, and the next request reflects the completed change rather than continuing to reuse stale state."
  - scenario: "A repository is deleted, replaced, moved, or recreated at a previously used path."
    expected_behavior: "Prior inventory state is not treated as valid for the new repository identity; fresh discovery or an actionable error occurs."
  - scenario: "Ignore or exclusion configuration is malformed or unreadable."
    expected_behavior: "The request follows the established visible error or fallback behavior and never relaxes sensitive-path exclusions."
  - scenario: "A request's glob or path filter matches no files."
    expected_behavior: "The request returns an empty result consistently on cold and reused inventory paths."
  - scenario: "The result cap is smaller than the number of matches."
    expected_behavior: "The established deterministic ordering and cap are preserved after inventory reuse."
  - scenario: "Concurrent requests trigger reuse, invalidation, and eviction for the same repository."
    expected_behavior: "Every request remains correct and isolated; uncertain freshness causes fresh discovery rather than stale output."

assumptions:
  - "The optimization is transparent to callers and requires no new user configuration for normal use."
  - "The repository identity, current ignore semantics, path normalization, filter behavior, ordering, and result caps are existing authoritative contracts."
  - "A material warm-path improvement means at least a 30% reduction in median wall time for the maintained representative workload."
  - "A material cold-path regression means more than a 10% increase in median wall time against the established uncached baseline."
  - "When freshness cannot be proven safely, correct fresh discovery is preferable to faster potentially stale results."
  - "Resource bounds will be selected during planning from measured multi-session workloads and maintained as an explicit testable budget."

constraints:
  - "The feature must remain backward-compatible with existing agentgrep find results and error behavior."
  - "The feature must use one canonical bounded repository inventory capability rather than introduce competing caches."
  - "Sensitive file content, credentials, and unredacted sensitive paths must not appear in retained diagnostics."
  - "Validation must compare the executing command path with fresh discovery and record wall time, CPU use, memory use, freshness behavior, and executable identity."
  - "The optimization must not introduce an unbounded resident inventory."

out_of_scope:
  - "Changing agentgrep find query syntax, ranking, ordering, filters, result caps, or error contracts."
  - "Weakening or redefining ignore rules, sensitive-path exclusions, or repository isolation."
  - "Caching file contents or search matches."
  - "Building a general-purpose persistent repository index or new extension mechanism."
  - "Optimizing content-grep execution except where it consumes the canonical inventory contract in later separately scoped work."
  - "Unrelated agentgrep refactors or repository-wide cleanup."

