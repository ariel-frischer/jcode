    - path: "scripts/test_profile_tools.py"
      description: "Profile driver parsing, case identity, summary, and budget-regression tests if the existing script tests are split into a dedicated file."

implementation_phases:
  - phase: 1
    name: "Canonical reusable inventory seam"
    goal: "Make inventory reuse possible without duplicating agentgrep find semantics or accepting unrelated dependency behavior changes."
    deliverables:
      - "Add FileInventory and freshness-manifest collection to agentgrep using the existing ignore traversal."
      - "Refactor run_find so fresh discovery and supplied-inventory evaluation call one scoring, sorting, and rendering-compatible implementation."
      - "Add dependency-level parity and invalidation tests, obtain a reviewed immutable commit, and pin it only after the Jcode compatibility matrix passes."
      - "If the available revision includes unrelated v0.1.7 changes, either backport the seam to the v0.1.6 behavior line or prove and explicitly preserve every affected Jcode contract."
  - phase: 2
    name: "Bounded Jcode cache integration"
    goal: "Reuse safe repository inventories across normal find calls in the long-lived server process."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Implement canonical repository identity and subtree rebasing."
      - "Implement synchronous manifest validation, immutable snapshots, short-held locking, and fresh fallback."
      - "Enforce 8-repository, 64 MiB aggregate, and 16 MiB per-inventory LRU admission limits."
      - "Emit reuse, invalidation, eviction, and fallback diagnostics using opaque process-local IDs and aggregate counts only."
  - phase: 3
    name: "Correctness, security, and concurrency proof"
    goal: "Demonstrate exact compatibility and current-path correctness across every cache lifecycle transition."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Add fresh-versus-warm output parity for query, subtree, glob, type, ordering, and cap combinations."
      - "Add create, delete, rename, empty-directory, root-replacement, .gitignore, .ignore, .rgignore, git-exclude, and global-exclude invalidation tests."
      - "Add ignored credential and sensitive-path fixtures for cold, warm, invalidated, fallback, and concurrent requests."
      - "Add same-repository and cross-repository concurrent workloads plus LRU and oversized-inventory stress tests."
      - "Trace FR-001 through FR-011 to exact focused checks and record commands in the Bead."
  - phase: 4
    name: "Performance and runtime validation"
    goal: "Prove the requested gain on the executing Jcode path without cold regressions or unbounded memory."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Run randomized cold, warm, invalidated, and forced-fresh profiler campaigns with wall, CPU, high-water memory, retained bytes, and resolved binary identity."
      - "Require at least 30% lower warm median and no more than 10% cold or invalidated median regression against the fresh baseline."
      - "Build the selfdev binary and run private-socket CLI-to-daemon find parity after priming and filesystem or ignore-rule changes."
      - "Run focused dependency and jcode-app-core tests, relevant build, formatting, Clippy, and scripts/check_guardrails.sh; isolate only proven unrelated baseline failures."
      - "Run the polish workflow to synchronize performance documentation and changelog without unrelated cleanup."

risks:
  - id: "RISK-001"
    risk: "The current agentgrep API cannot consume a pre-collected inventory, and a later upstream revision may include unrelated semantic changes."
    likelihood: "high"
    impact: "high"
    mitigation: "Land the smallest dependency seam, pin an immutable reviewed revision, run exact v0.1.6 behavior parity before adoption, and backport rather than silently absorb incompatible changes."
  - id: "RISK-002"
    risk: "A freshness signal misses a completed filesystem or ignore-policy change and serves a stale or excluded path."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use synchronous native directory-entry and policy-content digests, capture empty traversed directories, validate root identity, and fall back on every ambiguity or I/O failure."
  - id: "RISK-003"
    risk: "Manifest validation costs erase the required warm-path gain on directory-heavy repositories."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Benchmark representative and synthetic directory-heavy fixtures before enabling reuse, keep digest data compact, and retain fresh behavior if the 30% warm target is not met without weakening validation."
  - id: "RISK-004"
    risk: "Concurrent validation, rebuild, and eviction publish partial state or cause lock contention."
    likelihood: "medium"
    impact: "high"
    mitigation: "Publish immutable Arc snapshots only after successful validation, perform filesystem and find work outside the cache lock, and stress same-repository and cross-repository races."
  - id: "RISK-005"
    risk: "Diagnostics or retained metadata expose sensitive repository paths."
    likelihood: "low"
    impact: "high"
    mitigation: "Keep inventories memory-only, never retain contents or matches, use opaque process-local IDs, and test that logs expose only bounded reasons and aggregate counts."

open_questions:
  - question: "Which immutable agentgrep commit will provide the reusable-inventory seam?"
    context: "v0.1.6 is pinned and lacks the seam; v0.1.7 also lacks it and contains additional behavior changes that cannot be accepted implicitly."
    proposed_resolution: "Implement and review the minimal seam against current agentgrep, prefer an upstream release or commit, and pin it only after the Jcode v0.1.6 compatibility matrix passes; if unrelated deltas fail parity, backport the seam rather than widening this feature."

