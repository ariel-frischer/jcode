feature:
  branch: "011-clickable-file-mentions"
  created: "2026-08-21"
  status: "Draft"
  input: "Implement jcode-910 and jcode-9xb as one coordinated TUI capability: clicking valid @filepath mentions in any rendered session message opens the existing inline file viewer using session-CWD path resolution and safe invalid-path handling; improve clicked file content readability by using existing syntax highlighting only when already available, adding no packages, and otherwise rendering file contents in the theme normal high-contrast foreground rather than dim grey/background-like text. Preserve URL clicks, selection, scrolling, inline previews, metadata distinction, and light/dark behavior. Add focused tests and built-binary TUI validation."

user_stories:
  - id: "US-001"
    title: "Open clicked file mentions"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "to click a valid @filepath mention in any rendered session message"
    so_that: "the referenced file opens in the existing inline file viewer without copying or retyping its path"
    why_this_priority: "Direct navigation from rendered responses is the primary requested capability and must work consistently across session messages."
    independent_test: "Render assistant, user, and other supported session-message fixtures containing valid @filepath mentions, click each mention, and verify the inline viewer opens the referenced file."
    acceptance_scenarios:
      - given: "A rendered session message contains an @filepath mention for a readable file relative to the session working directory"
        when: "The user clicks the mention"
        then: "The existing inline file viewer opens the referenced file resolved from the session working directory."
      - given: "A valid file mention appears in each supported rendered session-message kind"
        when: "The user clicks the mention"
        then: "The same file-opening behavior is available regardless of which supported message kind rendered it."

  - id: "US-002"
    title: "Handle invalid file mentions safely"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "invalid or unavailable @filepath mentions to fail safely"
    so_that: "a mistaken click does not open an unintended URL or destabilize the session"
    why_this_priority: "Path resolution crosses a filesystem trust boundary, so missing, unreadable, and unsafe targets require explicit safe behavior."
    independent_test: "Click missing, unreadable, directory, malformed, and disallowed-path mention fixtures and verify the viewer does not open an unintended target while the session remains usable."
    acceptance_scenarios:
      - given: "An @filepath mention does not resolve to a readable regular file from the session working directory"
        when: "The user clicks it"
        then: "Jcode leaves the current view intact or shows actionable failure feedback and does not launch it through URL handling."
      - given: "A mention attempts path traversal or otherwise falls outside the permitted session path boundary"
        when: "The user clicks it"
        then: "Jcode refuses the file open safely and does not expose or externally open the disallowed path."

  - id: "US-003"
    title: "Read clicked files clearly"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "clicked file content to use readable, high-contrast styling"
    so_that: "I can read source and text files in both light and dark themes"
    why_this_priority: "Opening a file is not useful if its content is rendered as dim grey or blends into the background."
    independent_test: "Open representative plain-text and supported source files in light and dark theme fixtures and inspect their rendered foreground styles."
    acceptance_scenarios:
      - given: "An opened file has an already available syntax-highlighting path"
        when: "The inline viewer renders its content"
        then: "The viewer uses that existing highlighting without adding a package or changing unrelated rendering."
      - given: "An opened file has no available syntax-highlighting path"
        when: "The inline viewer renders its content"
        then: "The content uses the theme's normal high-contrast foreground rather than dim grey or a background-like color."
      - given: "The user opens a file in either light or dark mode"
        when: "The content is displayed"
        then: "The file remains readable with the active theme's appropriate normal foreground and background contrast."

  - id: "US-004"
    title: "Preserve existing rendered-message interactions"
    priority: "P1"
    as_a: "Jcode user"
    i_want: "URL clicks, text selection, scrolling, inline previews, and metadata behavior to remain unchanged"
    so_that: "file navigation adds capability without disrupting established TUI workflows"
    why_this_priority: "The new click target shares the rendered-message interaction surface and must not regress existing navigation or reading controls."
    independent_test: "Exercise URL, file, metadata, selection, scrolling, and inline-preview fixtures before and after clicking file mentions, asserting each existing interaction contract."
    acceptance_scenarios:
      - given: "A rendered message contains both a genuine URL and an @filepath mention"
        when: "The user clicks the URL"
        then: "The existing URL click behavior is used and the URL is not treated as a file mention."
      - given: "The user is selecting text or scrolling a rendered message"
        when: "The pointer passes over or clicks non-file content"
        then: "Selection and scrolling continue to work without accidental file opening."
      - given: "A message includes an inline preview or metadata content"
        when: "The user interacts with that content"
        then: "Inline preview and metadata distinction remain as before, without metadata being treated as ordinary file content unless it contains a valid rendered mention."

  - id: "US-005"
    title: "Verify the capability with focused evidence"
    priority: "P2"
    as_a: "Jcode maintainer"
    i_want: "focused tests and built-binary TUI validation for file mention clicks and readability"
    so_that: "the coordinated behavior is protected against regressions at both rendering and runtime boundaries"
    why_this_priority: "Automated and runtime evidence is needed because the capability spans text hit-testing, path resolution, rendering, and a built executable."
    independent_test: "Run the focused unit or component tests and a built-binary TUI scenario suite covering positive, negative, preservation, and theme cases."
    acceptance_scenarios:
      - given: "Deterministic message, filesystem, and theme fixtures"
        when: "The focused tests and built binary validation run"
        then: "They report passing evidence for valid mentions, invalid paths, existing URLs, selection/scrolling, metadata/preview distinctions, and light/dark readability."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST make valid @filepath mentions clickable in every supported rendered session-message kind where the mention is displayed."
      testable: true
      acceptance_criteria: "Focused rendered-message tests click valid mentions in each supported message kind and verify that the existing inline file viewer opens."
    - id: "FR-002"
      description: "MUST resolve relative @filepath mentions against the clicked session's current working directory, including nested paths, without using the caller's unrelated working directory."
      testable: true
      acceptance_criteria: "A multi-session fixture gives sessions different working directories and verifies that each click opens the file relative to the originating session CWD."
    - id: "FR-003"
      description: "MUST reject missing, unreadable, non-regular, malformed, and disallowed @filepath targets safely, without routing them to generic URL opening or opening an unintended path."
      testable: true
      acceptance_criteria: "Negative path fixtures verify no inline viewer is opened for invalid targets, no external-link success is reported, and the session remains interactive with actionable feedback where applicable."
    - id: "FR-004"
      description: "MUST preserve genuine URL click handling, including messages containing both URLs and @filepath mentions."
      testable: true
      acceptance_criteria: "URL regression tests verify supported URL targets continue to invoke the existing URL behavior and are never classified as local file mentions."
    - id: "FR-005"
      description: "MUST preserve text selection, scrolling, inline previews, and the distinction between metadata and ordinary rendered message content when adding file hit targets."
      testable: true
      acceptance_criteria: "Interaction tests cover pointer and keyboard selection, scroll movement, inline-preview activation, and metadata fixtures and show no changed behavior outside valid file-mention hits."
    - id: "FR-006"
      description: "MUST render clicked file contents using existing syntax highlighting when that capability is already available for the file, without adding packages or a new highlighting dependency."
      testable: true
      acceptance_criteria: "Supported-language fixtures show the existing highlighting output and dependency inspection shows no package additions."
    - id: "FR-007"
      description: "MUST render clicked file contents with the active theme's normal high-contrast foreground when syntax highlighting is unavailable, instead of dim grey or background-like text."
      testable: true
      acceptance_criteria: "Plain-text and unsupported-language fixtures in both light and dark themes assert the normal foreground style and readable contrast."
    - id: "FR-008"
      description: "MUST keep the existing inline file viewer navigation and preview lifecycle, opening the viewer in the same interaction surface used by current file previews."
      testable: true
      acceptance_criteria: "A built-binary scenario confirms a valid click opens the existing viewer and that its close, scroll, and return behavior remain functional."
    - id: "FR-009"
      description: "MUST add focused automated coverage and built-binary TUI validation for the coordinated click, path-resolution, styling, and regression contracts."
      testable: true
      acceptance_criteria: "The targeted test commands and built-binary TUI validation complete successfully with evidence for all P1 behaviors and the readability fallback."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "File mention activation MUST remain bounded by the existing safe session path and filesystem permission rules."
      measurable_target: "100% of traversal, outside-CWD, missing, unreadable, directory, and malformed fixtures are refused without unintended open or external navigation."
    - id: "NFR-002"
      category: "usability"
      description: "Clicked file content MUST remain legible in the active light or dark theme and MUST NOT use a low-contrast default style when no highlighting is available."
      measurable_target: "All plain-text and unsupported-language fixtures pass contrast/style assertions in both supported theme modes."
    - id: "NFR-003"
      category: "reliability"
      description: "Adding file mention hit targets MUST NOT alter established URL, selection, scrolling, inline-preview, or metadata interactions."
      measurable_target: "All preservation regression scenarios pass with zero unintended file opens or interaction regressions."
    - id: "NFR-004"
      category: "code_quality"
      description: "The implementation MUST use existing highlighting and viewer capabilities where available and remain focused on the requested TUI behavior."
      measurable_target: "The reviewed change adds no package or dependency and contains no unrelated UI redesign or broad refactor."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can open a valid @filepath mention from every supported rendered session-message kind in the existing inline file viewer."
      metric: "Valid file-mention activation scenarios"
      target: "100% of supported message-kind and relative-path fixtures pass"
    - id: "SC-002"
      description: "File mentions resolve to the file associated with the originating session rather than an unrelated process location."
      metric: "Cross-session CWD resolution scenarios"
      target: "100% of multi-session CWD fixtures resolve to the expected file"
    - id: "SC-003"
      description: "Invalid file-looking mentions never cause unintended external navigation or unsafe file access."
      metric: "Negative path activation scenarios"
      target: "100% of missing, unreadable, non-regular, malformed, traversal, and disallowed fixtures are safely rejected"
    - id: "SC-004"
      description: "Users can read opened files clearly regardless of whether highlighting is available or which supported theme is active."
      metric: "Readability and theme scenarios"
      target: "100% of highlighting-available and fallback fixtures pass in light and dark modes"
    - id: "SC-005"
      description: "Existing rendered-message interactions remain stable after file mention clicks are introduced."
      metric: "URL, selection, scrolling, inline-preview, and metadata preservation scenarios"
      target: "100% of focused preservation scenarios pass with zero unintended file activations"
    - id: "SC-006"
      description: "The coordinated capability is validated in the executable users run, not only in source-level tests."
      metric: "Built-binary TUI validation result"
      target: "The built-binary validation completes successfully for all required P1 scenarios"

key_entities:
  - name: "Rendered session message"
    description: "A displayed session message whose text and interaction metadata can expose clickable targets."
    attributes:
      - "message kind"
      - "rendered spans"
      - "session identity"
      - "session working directory"
  - name: "File mention target"
    description: "An @filepath reference displayed in a rendered session message and eligible for activation when it resolves safely."
    attributes:
      - "display text"
      - "relative or absolute path"
      - "hit region"
      - "resolution status"
  - name: "Inline file viewer"
    description: "The existing in-session viewer used to display the contents of an activated file."
    attributes:
      - "resolved file"
      - "content rendering mode"
      - "active theme"
      - "navigation and scroll state"
  - name: "Rendered interaction target"
    description: "A URL, file mention, selection region, inline preview, or metadata region competing for pointer interaction."
    attributes:
      - "target type"
      - "screen bounds"
      - "activation behavior"
      - "selection and scrolling effect"

edge_cases:
  - scenario: "A valid @filepath mention appears in a user, assistant, tool, system, or other supported rendered session message with a different session CWD."
    expected_behavior: "The click uses the originating session context and opens the expected file regardless of message kind."
  - scenario: "A file mention is adjacent to punctuation, inline markup, a URL, or another clickable span."
    expected_behavior: "Hit testing selects only the intended target, preserves URL behavior, and does not expand the file target into surrounding punctuation or text."
  - scenario: "A mention points to a missing file, directory, unreadable file, malformed path, traversal path, or path outside the allowed boundary."
    expected_behavior: "The click is safely rejected with no unintended viewer or URL open, and the TUI remains usable."
  - scenario: "The same message is viewed while text selection or scrolling is active."
    expected_behavior: "Selection and scrolling retain their existing behavior, and a click only opens a file when it is an unambiguous file-target activation."
  - scenario: "A message contains metadata or an inline preview that visually resembles ordinary content."
    expected_behavior: "Metadata and preview interaction remain distinct, with no accidental file activation from their non-file regions."
  - scenario: "The opened file has a supported language, an unsupported language, empty content, long lines, or non-UTF-8/unreadable content."
    expected_behavior: "Existing highlighting is used only where already available; otherwise the normal high-contrast theme foreground is used, and existing viewer error handling applies to unreadable content."
  - scenario: "The active theme changes between light and dark mode before or while the inline viewer is displayed."
    expected_behavior: "File content and surrounding viewer styling follow the active theme without becoming dim or background-like."

assumptions:
  - "The existing inline file viewer, rendered-message hit-testing, session CWD context, URL handling, and theme palette are the canonical capabilities to extend."
  - "A valid @filepath mention means a displayed file reference that resolves to an allowed readable regular file under the existing path and permission rules; invalid references do not fall back to URL opening."
  - "Existing syntax highlighting is used only for languages and paths already supported by the repository; no package, dependency, or new highlighting engine is required."
  - "The existing file-size, encoding, and readability limits remain in force unless current viewer behavior already defines a different result."
  - "Focused tests may use deterministic temporary filesystem, rendered-message, and theme fixtures; built-binary validation may use a dedicated local socket or isolated runtime so the shared daemon is not disturbed."
  - "No clarification is needed because the request identifies the viewer, session-CWD resolution, safe invalid-path behavior, preservation requirements, and fallback styling contract."

constraints:
  - "The implementation must preserve genuine URL clicks, selection, scrolling, inline previews, metadata distinction, and light/dark behavior."
  - "The implementation must not add packages or dependencies and must prefer existing syntax highlighting when already available."
  - "The implementation must use session-CWD path resolution and existing safe filesystem boundaries."
  - "Validation must include focused automated tests and built-binary TUI evidence without requiring live network or production infrastructure."
  - "The change must remain limited to the coordinated file-mention activation and file-content readability capability plus its tests and validation."

out_of_scope:
  - "Redesigning the inline file viewer, rendered-message layout, URL opener, selection model, scrolling model, or metadata presentation."
  - "Adding a new syntax-highlighting package, language grammar, dependency, or persistent indexing service."
  - "Changing the meaning or availability of @filepath mentions in text input or the existing file mention picker."
  - "Broad theme redesign, unrelated contrast changes, or changing color semantics outside clicked file content."
  - "Opening arbitrary invalid paths externally, bypassing existing permission boundaries, or changing filesystem trust policy."
  - "Live production-scale, network, or browser validation beyond the requested built-binary local TUI checks."

