    approach: "Parser unit tests, focused TUI mouse/render tests, then isolated built-binary TUI frames"
  target_platform: "Jcode TUI on supported terminal platforms"
  project_type: "cli"
  performance_goals: "No additional filesystem discovery or per-frame indexing; retain linear token scanning and existing preview caching"
  constraints:
