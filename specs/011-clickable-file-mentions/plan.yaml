    - "Preserve URL clicks, copy selection, scrolling, preview collapse, and markdown rendering"
    - "Preserve existing policy for absolute and parent-relative paths"
    - "Plain/source file body text must use the active theme's normal foreground"
  scale_scope: "One transcript line at hit-test time and files up to the existing 512 KiB inline preview limit"

