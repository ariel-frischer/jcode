summary: |
  Extend the existing transcript click-target parser so an @path token is returned as a local
  file target without the leading @. The existing chat click dispatch then resolves and toggles
  the existing inline file preview using the active session working directory and its current
  filesystem, size, and text-readability rules. Invalid mentions remain handled locally and are
  never passed to the generic URL opener.

  Keep the viewer change deliberately small: preserve markdown rendering and all current preview
  lifecycle behavior, add no dependency or new highlighting path, and render ordinary source and
  text file bodies with the normal theme foreground instead of dim_color(). Focused parser and
  rendered-click tests cover token boundaries, session-CWD resolution, invalid targets, URL
  preservation, and semantic foreground styling before built-binary TUI validation.

