research_findings:
  decisions:
    - topic: "@filepath click recognition"
      decision: "Recognize @path tokens in ui/url.rs before generic plain-path matching and return the path without @."
      rationale: "chat_link_target_from_screen already maps a hit to the originating message and try_open_link_at already delegates local paths to the existing preview."
      alternatives_considered:
        - "Add a second message renderer hit-region registry"
        - "Rewrite rendered messages as Markdown links"
    - topic: "Invalid mention dispatch"
      decision: "Distinguish syntactically recognized @mentions from unrelated text so invalid file mentions are consumed locally and never externally opened."
      rationale: "The existing try_toggle_inline_file_preview returns false for missing files, which would otherwise allow generic link handling to inspect the same target."
      alternatives_considered:
        - "Open missing targets externally"
        - "Add a new filesystem policy"
    - topic: "Viewer content readability"
      decision: "Replace dim_color() on ordinary file body spans with the default/normal foreground while leaving markdown rendering unchanged."
      rationale: "The reported defect is low contrast; the existing syntax helper is not a current inline-viewer path and adding one would exceed the clarified scope."
      alternatives_considered:
        - "Add or expose a new theme-aware syntax rendering pipeline"
        - "Use a fixed white RGB value that would fail in light themes"
    - topic: "Path policy"
      decision: "Reuse try_toggle_inline_file_preview unchanged for relative, absolute, and parent-relative resolution."
      rationale: "The Bead explicitly requires the existing viewer/path policy rather than inventing a stricter boundary."
      alternatives_considered:
        - "Canonicalize and restrict all paths to session CWD"
        - "Resolve relative mentions against process CWD"

data_model:
  entities:
    - name: "FileMentionHit"
      description: "A syntactically valid @path token under the clicked display column."
      fields:
        - name: "display_range"
          type: "display-column range"
          description: "Exact clickable columns including the visible @ prefix"
          constraints: "Must respect Unicode display width and token boundaries"
        - name: "target"
          type: "String"
          description: "Path passed to the existing inline viewer without the @ prefix"
          constraints: "Non-empty and not a URL/email token"
      relationships:
        - target: "RenderedSessionMessage"
          type: "many-to-one"
          description: "The prepared chat frame maps the clicked line to its originating message index"
    - name: "InlineFilePreview"
      description: "Existing transient viewer state keyed by the originating message hash."
      fields:
        - name: "display_path"
          type: "String"
          description: "Original local path shown in the viewer header"
          constraints: "Existing behavior"
        - name: "content"
          type: "String"
          description: "Readable text loaded under the existing size limit"
          constraints: "Existing 512 KiB and UTF-8 rules"
        - name: "markdown"
          type: "bool"
          description: "Preserves existing markdown rendering path"
          constraints: "Existing extension detection"
      relationships:
        - target: "FileMentionHit"
          type: "one-to-one"
          description: "A successful mention activation toggles the existing preview"

