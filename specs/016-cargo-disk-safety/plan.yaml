      description: "Canonical configuration, reporting, worktree/activity inspection, candidate selection, final revalidation, and target-only deletion logic."
    - path: "scripts/check_guardrails.sh"
      description: "Reserve preflight integration placed before the first possible Cargo command."
    - path: "Makefile"
      description: "Discoverable disk-report, disk-check, disk-clean dry-run, and disk-clean-apply entry points with explicit variables."
  tests:
    - path: "scripts/test_disk_safety.py"
      description: "Focused unit, process/session uncertainty, post-scan mutation, command contract, and temporary registered-worktree apply fixtures."
    - path: "specs/016-cargo-disk-safety/validation.md"
      description: "Later command receipts proving requirement coverage, reserve-gated broad validation, and that apply paths used only temporary fixtures."

implementation_phases:
  - phase: 1
    name: "Freeze safety contracts"
    goal: "Turn every configuration, threshold, activity, filesystem, and destructive boundary into focused failing tests before production changes."
    deliverables:
      - "Inclusive reserve tests for below, equal, and above values with zero Cargo starts when blocked"
      - "Strict newest-artifact age tests for newer, equal, older, empty, and unreadable targets"
      - "Negative-path matrix for malformed config and uncertain registration/session/process/filesystem evidence"
      - "Temporary registered-worktree fixtures for dry-run, apply, and post-scan mutations"
  - phase: 2
    name: "Bounded report and reserve preflight"
    goal: "Provide truthful allocated-byte visibility and prevent guardrails from starting Cargo without adequate reserve."
    dependencies:
      - "Phase 1"
    deliverables:
      - "One headroom summary and one direct-target record for every registered worktree"
      - "Allocated-block estimate accounting without symlink traversal"
      - "Strict configuration resolver and actionable check failures"
      - "Guardrail preflight before every Cargo invocation path"
  - phase: 3
    name: "Fail-closed cleanup selection"
    goal: "Produce a deterministic dry-run candidate and exclusion inventory without deleting anything."
    dependencies:
      - "Phase 1"
      - "Phase 2"
    deliverables:
      - "Registered in-repository non-main direct-target containment checks"
      - "Cleanliness, readability, session, process, symlink, and strict recency exclusions"
      - "Per-record reasons and aggregate allocated-byte estimate"
      - "Dry-run as the default for direct CLI and Make entry points"
  - phase: 4
    name: "Explicit apply and deletion-boundary revalidation"
    goal: "Remove only generated targets whose complete safety evidence remains valid after scanning."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Unambiguous apply authorization"
      - "Whole-candidate-set final validation before deletion begins"
      - "Immediate registration, activity/process, dirty, containment, direct-child, symlink, readability, and recency rechecks"
      - "Temporary-fixture-only proof that eligible target content is removed while source, roots, branches, and external sentinels remain"
  - phase: 5
    name: "Operations, polish, and delivery validation"
    goal: "Make the workflow discoverable and prove the repository command contracts without risking real artifacts."
    dependencies:
      - "Phase 2"
      - "Phase 4"
    deliverables:
      - "Make targets for report, check, dry-run, and explicit apply"
      - "Developer guide covering defaults, precedence, boundaries, exclusions, estimates, and Cargo rebuild rollback"
      - "Focused Python, syntax, Make, documentation, and guardrail-order checks"
      - "Reserve-gated repository guardrails with any unrelated baseline failures isolated"

