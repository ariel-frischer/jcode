feature:
  branch: "016-cargo-disk-safety"
  created: "2026-08-23"
  status: "Draft"
  input: "Prevent disk exhaustion from Jcode worktree Cargo build artifacts. Add a bounded readable filesystem-headroom and per-registered-worktree target usage report; add a documented configurable inclusive free-space threshold that stops scripts/check_guardrails.sh before its first Cargo command when reserve is inadequate; add cleanup that defaults to dry-run and requires explicit apply. Cleanup may remove only direct non-symlink target directories of registered in-repository non-main worktrees that are inactive, clean, readable, and older than the configured newest-artifact age. It must fail closed on malformed configuration or uncertain live-session metadata and must revalidate registration, active sessions/processes, dirty state, path containment, symlink status, and recency after target scanning immediately before deletion. Report an allocated-byte estimate, never delete source, branches, whole worktrees, dirty or active work, or paths outside the repository, and validate apply only in temporary fixtures. Add Make targets and developer docs for report, check, dry-run, apply, thresholds, exclusions, and Cargo rebuild rollback. Bead: jcode-6gp."

user_stories:
  - id: "US-001"
    title: "Inspect build-artifact disk use"
    priority: "P1"
    as_a: "Jcode developer"
    i_want: "a concise report of filesystem headroom and Cargo target usage for every registered worktree"
    so_that: "I can identify disk pressure and the worktrees responsible before builds exhaust the filesystem"
    why_this_priority: "Visibility is required to make informed cleanup and validation decisions."
    independent_test: "Create registered-worktree fixtures with known allocated usage and verify one bounded report identifies headroom, each worktree, exclusions, and the aggregate estimate."
    acceptance_scenarios:
      - given: "the repository has multiple registered worktrees with and without direct target directories"
        when: "the developer requests the disk-usage report"
        then: "the output shows filesystem free space plus at most one readable target-usage record per registered worktree and labels allocated-byte values as estimates"
      - given: "a registered worktree or target cannot be read safely"
        when: "the developer requests the report"
        then: "the report identifies the unknown state without presenting that path as safe to clean"

  - id: "US-002"
    title: "Protect guardrail reserve"
    priority: "P0"
    as_a: "Jcode developer running repository validation"
    i_want: "guardrails to check a configurable minimum free-space reserve before starting Cargo"
    so_that: "validation stops predictably instead of consuming the final filesystem headroom"
    why_this_priority: "Preventing disk exhaustion protects the repository, other sessions, and the host system."
    independent_test: "Run guardrails with synthetic free-space readings below, equal to, and above the configured threshold and prove no Cargo command starts in the first two cases."
    acceptance_scenarios:
      - given: "available space is equal to or below the configured inclusive threshold"
        when: "the developer starts scripts/check_guardrails.sh"
        then: "the script exits with an actionable reserve error before its first Cargo command"
      - given: "available space is above the configured threshold"
        when: "the developer starts scripts/check_guardrails.sh"
        then: "the preflight permits the existing guardrail workflow to continue unchanged"
      - given: "the threshold configuration is malformed or unsupported"
        when: "the developer starts scripts/check_guardrails.sh"
        then: "the script fails before Cargo and explains how to provide a valid value"

  - id: "US-003"
    title: "Reclaim stale target storage safely"
    priority: "P0"
    as_a: "Jcode repository maintainer"
    i_want: "an explicit cleanup workflow that previews eligible stale target directories and revalidates them before deletion"
    so_that: "I can reclaim generated build storage without risking source, active work, dirty changes, or unrelated paths"
    why_this_priority: "Cleanup is destructive and therefore requires the strongest safety boundary."
    independent_test: "Use only temporary registered-worktree fixtures covering eligible, main, active, dirty, recent, unreadable, symlinked, unregistered, and out-of-repository paths; verify dry-run deletes nothing and apply deletes only the eligible direct target directory after revalidation."
    acceptance_scenarios:
      - given: "cleanup is invoked without explicit apply authorization"
        when: "eligible stale target directories exist"
        then: "the command reports candidates and estimated allocated bytes but deletes nothing"
      - given: "a direct non-symlink target directory belongs to a registered in-repository non-main worktree that is inactive, clean, readable, and old enough"
        when: "the maintainer explicitly applies cleanup and every safety condition still holds after scanning"
        then: "only that target directory is removed and the allocated-byte estimate is reported"
      - given: "registration, activity, process, cleanliness, containment, symlink, readability, or recency evidence is uncertain or changes after scanning"
        when: "cleanup reaches its final deletion decision"
        then: "cleanup fails closed without deleting the affected target or any other path"

  - id: "US-004"
    title: "Operate and recover confidently"
    priority: "P1"
    as_a: "Jcode contributor"
    i_want: "documented Make entry points, configuration, exclusions, and rebuild guidance"
    so_that: "I can use disk safety consistently and understand the reversible cost of removing Cargo artifacts"
    why_this_priority: "Clear operating guidance reduces unsafe ad hoc cleanup and makes the feature discoverable."
    independent_test: "Verify the documented Make entry points expose report, check, dry-run, and apply behavior and that the guide covers threshold semantics, age configuration, exclusions, and Cargo rebuild rollback."
    acceptance_scenarios:
      - given: "a contributor consults the developer documentation"
        when: "they look for disk-safety operations"
        then: "they can find commands for report, reserve check, dry-run cleanup, explicit apply, configuration, exclusions, and rebuilding removed artifacts"

requirements:
  functional:
    - id: "FR-001"
      description: "The repository MUST provide a bounded, human-readable disk report covering filesystem headroom and every registered worktree."
      acceptance_criteria: "With N registered worktrees, output contains one filesystem summary and no more than N worktree records, with no per-file listing."
    - id: "FR-002"
      description: "The report MUST identify whether each registered worktree has a direct Cargo target directory and provide its estimated allocated-byte usage when readable."
      acceptance_criteria: "Fixtures with absent, readable, and unreadable direct target directories are distinguished, and readable estimates match fixture filesystem allocation within the platform's allocation unit."
    - id: "FR-003"
      description: "All reported storage totals MUST be labeled as allocated-byte estimates rather than exact logical sizes or guaranteed reclaimable space."
      acceptance_criteria: "Report and cleanup output consistently use estimate terminology and never promise an exact reclaimed-byte value."
    - id: "FR-004"
      description: "scripts/check_guardrails.sh MUST evaluate a documented configurable minimum-free-space threshold before its first Cargo command."
      acceptance_criteria: "An instrumented guardrail run proves the headroom decision occurs before every Cargo invocation path."
    - id: "FR-005"
      description: "The free-space threshold MUST be inclusive: available space equal to or below the effective threshold is inadequate, while space above it is adequate."
      acceptance_criteria: "Boundary tests for threshold minus one allocation unit, exactly the threshold, and threshold plus one allocation unit stop, stop, and continue respectively."
    - id: "FR-006"
      description: "Malformed, negative, ambiguous, or unsupported threshold configuration MUST produce an actionable failure before Cargo begins."
      acceptance_criteria: "Each invalid configuration fixture exits nonzero, names the invalid setting and accepted form, and records zero Cargo starts."
    - id: "FR-007"
      description: "Cleanup MUST default to dry-run and MUST require an unambiguous explicit apply request before any deletion."
      acceptance_criteria: "Invocations with no mode or dry-run mode leave all fixtures intact; only the documented apply form can enter deletion behavior."
    - id: "FR-008"
      description: "A cleanup candidate MUST be a direct, non-symlink target directory of a currently registered, readable worktree contained within the repository."
      acceptance_criteria: "Nested, symlinked, unregistered, unreadable, and out-of-repository target fixtures are excluded and remain intact."
    - id: "FR-009"
      description: "Cleanup MUST exclude the main checkout and every worktree with dirty tracked or untracked state."
      acceptance_criteria: "Main-checkout, tracked-dirty, and untracked-dirty fixtures are reported as excluded and remain intact during apply."
    - id: "FR-010"
      description: "Cleanup MUST exclude worktrees associated with active Jcode sessions or relevant live processes."
      acceptance_criteria: "Fixtures carrying definite session activity or a live relevant process are excluded and remain intact during apply."
    - id: "FR-011"
      description: "Cleanup MUST fail closed without deleting anything when live-session or relevant-process metadata is malformed, unreadable, incomplete, or otherwise uncertain."
      acceptance_criteria: "Each uncertain-activity fixture causes a nonzero apply result and all candidate target directories remain intact."
    - id: "FR-012"
      description: "Cleanup MUST require the newest artifact in a candidate target directory to be older than the documented configurable age, and MUST exclude candidates whose age cannot be established."
      acceptance_criteria: "Newer-than, exactly-at, older-than, and unknown-age fixtures are excluded, excluded, eligible, and excluded respectively."
    - id: "FR-013"
      description: "After target usage scanning and immediately before each deletion, cleanup MUST revalidate registration, active sessions and processes, dirty state, repository containment, direct-child relationship, symlink status, readability, and newest-artifact age."
      acceptance_criteria: "Tests mutate each safety condition after scanning; every changed candidate is rejected without deletion."
    - id: "FR-014"
      description: "If any final revalidation is uncertain or fails, apply MUST stop safely and MUST NOT continue deleting other candidates."
      acceptance_criteria: "A multi-candidate fixture with one induced revalidation failure preserves every target directory and returns an actionable error."
    - id: "FR-015"
      description: "Cleanup MUST remove only an eligible target directory and MUST never remove source files, branches, registered worktree roots, whole worktrees, or paths outside the repository."
      acceptance_criteria: "Temporary apply fixtures prove eligible target content is removed while sibling source, worktree roots, branch registrations, and external sentinels remain unchanged."
    - id: "FR-016"
      description: "Dry-run and apply output MUST state each candidate or exclusion reason and the estimated allocated bytes selected for cleanup."
      acceptance_criteria: "Mixed fixtures yield a deterministic eligibility summary with reasons and an aggregate estimated allocation for selected targets."
    - id: "FR-017"
      description: "Apply behavior MUST be validated only against temporary fixtures and MUST NOT be exercised against real developer worktrees as part of acceptance validation."
      acceptance_criteria: "The validation record shows all apply commands use temporary repository and worktree roots and includes no real-worktree deletion command."
    - id: "FR-018"
      description: "The repository MUST expose documented Make targets for the disk report, reserve check, cleanup dry-run, and cleanup apply operations."
      acceptance_criteria: "Each documented Make target resolves successfully to its stated mode, and the default cleanup entry point remains non-destructive."
    - id: "FR-019"
      description: "Developer documentation MUST explain effective threshold and age semantics, configuration validity, cleanup exclusions, explicit apply authorization, allocated-byte estimates, and Cargo rebuild rollback."
      acceptance_criteria: "A documentation checklist finds every topic and accurately states that deleted targets are regenerated by subsequent Cargo builds."
  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "All deletion decisions must fail closed at filesystem, repository-registration, and live-activity trust boundaries."
      measurable_target: "100% of unsafe or uncertain temporary-fixture cases result in zero deletions."
    - id: "NFR-002"
      category: "reliability"
      description: "The guardrail reserve check must behave deterministically at and around the configured boundary."
      measurable_target: "All below-threshold and equal-threshold cases stop before Cargo; all valid above-threshold cases proceed."
    - id: "NFR-003"
      category: "usability"
      description: "Reports and failures must be concise, readable, and actionable for repository contributors."
      measurable_target: "Output is limited to one summary plus one record per registered worktree and every failure names a safe next action."
    - id: "NFR-004"
      category: "performance"
      description: "Inspection work must remain bounded by registered worktrees and their direct target contents rather than unrelated repository or filesystem paths."
      measurable_target: "No scan traverses an unregistered worktree, a non-target source subtree, or a path outside the repository."
    - id: "NFR-005"
      category: "code_quality"
      description: "Every destructive-safety predicate and configuration boundary must have direct automated coverage."
      measurable_target: "Each predicate in FR-006 through FR-015 maps to at least one focused negative-path test."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Developers can identify filesystem headroom and the relative Cargo target footprint of all registered worktrees from one bounded report."
      metric: "Coverage and output cardinality across registered-worktree fixtures"
      target: "100% of registered worktrees represented with no more than one record each."
    - id: "SC-002"
      description: "Broad validation never starts Cargo when the configured reserve is inadequate or invalid."
      metric: "Cargo starts observed in threshold boundary and invalid-configuration tests"
      target: "Zero Cargo starts for every below, equal, malformed, negative, ambiguous, or unsupported threshold case."
    - id: "SC-003"
      description: "A normal cleanup request cannot delete data accidentally."
      metric: "Directories removed by default and dry-run invocations"
      target: "Zero directories removed across all dry-run fixtures."
    - id: "SC-004"
      description: "Explicit cleanup removes only demonstrably safe generated artifacts."
      metric: "Apply outcomes across eligible and excluded temporary fixtures"
      target: "100% of eligible target directories removed and 100% of source, dirty, active, recent, uncertain, symlinked, unregistered, main, and external paths preserved."
    - id: "SC-005"
      description: "Late safety changes cannot turn a previously scanned target into an unsafe deletion."
      metric: "Post-scan mutation scenarios rejected before deletion"
      target: "100% of registration, activity, process, dirty-state, containment, symlink, readability, and recency mutations prevent all deletion."
    - id: "SC-006"
      description: "Contributors can operate and recover from cleanup without undocumented knowledge."
      metric: "Developer-guide coverage of required operations and recovery"
      target: "All four operations, both thresholds, all exclusion classes, estimate semantics, and Cargo rebuild rollback are documented."

key_entities:
  - name: "Filesystem headroom"
    description: "The available allocation capacity on the filesystem that holds the repository and its worktree artifacts."
    attributes:
      - "available bytes"
      - "effective inclusive threshold"
      - "adequate or inadequate status"
  - name: "Registered worktree"
    description: "A worktree currently recognized by repository metadata and evaluated for reporting or cleanup exclusion."
    attributes:
      - "canonical path"
      - "main or non-main role"
      - "readability and cleanliness"
      - "session and process activity"
  - name: "Target usage record"
    description: "A bounded per-worktree observation of a direct Cargo target directory."
    attributes:
      - "presence and direct-child relationship"
      - "non-symlink status"
      - "estimated allocated bytes"
      - "newest known artifact age"
  - name: "Cleanup candidate"
    description: "A target usage record that currently satisfies every deletion predicate and awaits final revalidation."
    attributes:
      - "eligibility or exclusion reason"
      - "dry-run or explicit apply mode"
      - "pre-deletion revalidation result"
  - name: "Disk-safety configuration"
    description: "Documented operator-controlled reserve and recency policy values."
    attributes:
      - "minimum free-space threshold"
      - "newest-artifact age threshold"
      - "valid form and effective value"

edge_cases:
  - scenario: "Available space is exactly equal to the configured reserve threshold."
    expected_behavior: "The reserve is inadequate and guardrails stop before Cargo."
  - scenario: "The newest artifact is exactly as old as the configured cleanup age."
    expected_behavior: "The target is excluded because eligibility requires it to be strictly older."
  - scenario: "A target directory is empty or its newest artifact timestamp cannot be determined."
    expected_behavior: "Cleanup cannot prove recency and excludes the target."
  - scenario: "A direct target path is a symlink, becomes a symlink, or resolves outside the repository."
    expected_behavior: "The path is never traversed for deletion and cleanup fails or excludes it without affecting its destination."
  - scenario: "A worktree becomes dirty, active, unregistered, unreadable, or recent after its target was scanned."
    expected_behavior: "Final revalidation stops apply before any deletion."
  - scenario: "Live-session metadata is present but stale-looking, partially written, malformed, or permission-denied."
    expected_behavior: "Activity is uncertain, so apply fails closed and deletes nothing."
  - scenario: "One candidate fails final revalidation after another candidate was scanned."
    expected_behavior: "No candidate is deleted; the operator receives the failed condition and can retry from a fresh scan."
  - scenario: "Allocated bytes differ from apparent file sizes or free space does not increase by the estimate after deletion."
    expected_behavior: "Output continues to label the value as an estimate and makes no exact-reclamation guarantee."

assumptions:
  - "The repository containing the invoked command is the authoritative containment boundary for reporting and cleanup."
  - "Only a directory named target that is an immediate child of a currently registered worktree is eligible for cleanup."
  - "The main checkout is identifiable from repository worktree metadata and is always excluded regardless of age or cleanliness."
  - "Threshold and age settings use documented, unambiguous non-negative values; unset values resolve to documented safe defaults."
  - "A target is old enough only when its newest artifact is strictly older than the configured age."
  - "Cargo target artifacts are reproducible build outputs; the supported rollback is to rerun the appropriate Cargo build or validation command."
  - "Uncertain safety evidence blocks the whole apply operation so candidate ordering cannot cause partial cleanup."

constraints:
  - "No cleanup apply validation may target a real developer checkout or worktree."
  - "No operation may delete source, branches, worktree roots, whole worktrees, dirty work, active work, symlinks, or paths outside the repository."
  - "The reserve decision must occur before the first Cargo command in scripts/check_guardrails.sh."
  - "Deletion requires explicit apply authorization and a fresh successful revalidation after target scanning."
  - "The feature must preserve existing guardrail behavior when free space is above a valid effective threshold."

out_of_scope:
  - "Automatically deleting artifacts in the background or without an explicit apply request."
  - "Removing branches, source trees, registered worktrees, or entire worktree directories."
  - "Cleaning global Cargo caches, shared target directories, unregistered checkouts, or unrelated repositories."
  - "Changing Cargo's build-cache architecture or weakening repository validation."
  - "Guaranteeing that reported allocated bytes equal the filesystem space ultimately reclaimed."

