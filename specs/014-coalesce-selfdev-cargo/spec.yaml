feature:
  branch: "014-coalesce-selfdev-cargo"
  created: "2026-08-22"
  status: "Draft"
  input: "Coalesce and supersede redundant server-owned SelfDevTool Cargo validation for Bead jcode-l89.2. Extend the existing crates/jcode-app-core selfdev build queue, not a second daemon. Exact eligible build, test, and check requests from multiple sessions must share one leader execution and truthful subscriber results. Define a versioned redacted identity covering repository/worktree, source or dirty fingerprint, Cargo.lock, toolchain, action, profile, features, package/target, relevant environment, and normalized arguments. Near misses never coalesce. Revalidate queued work before Cargo gate acquisition so obsolete requests are visibly superseded without terminating unrelated active work. Followers cancel independently; final-subscriber cancellation preserves the existing safe contract. Preserve build, build-reload, test, status, follow-existing-build, cancel-build, progress, reload, failure, and global Cargo-gate behavior. Extend rust-actions/status receipts with queue/gate/execution timing, leader/follower/reuse, cancellation reason, exit, and source identity without secrets or raw source. Add focused concurrency, recovery, activation, and isolated built-binary multi-session validation plus before/after duplicate and latency evidence. Runtime budgets from jcode-l89.1 must not regress. Trace PRIN-002, PRIN-004, PRIN-005, PRIN-006, PRIN-007, PRIN-009, and PRIN-010. Use TDD and surgical changes."

user_stories:
  - id: "US-001"
    title: "Share exact duplicate validation"
    priority: "P0"
    as_a: "developer using multiple Jcode sessions"
    i_want: "identical eligible build, test, and check requests to share one server-owned execution"
    so_that: "duplicate validation does not waste Cargo capacity or delay my sessions"
    why_this_priority: "Eliminating redundant execution is the primary outcome and directly protects multi-session responsiveness."
    independent_test: "Submit the same eligible request concurrently from multiple isolated sessions and verify one execution serves every subscriber with equivalent truthful results."
    acceptance_scenarios:
      - given: "two or more sessions submit requests with the same complete source identity before completion"
        when: "the requests enter the self-development queue"
        then: "one request is the leader, the others are followers, and only one Cargo execution occurs"
      - given: "a matching execution has already completed and remains safely reusable"
        when: "another session submits the same eligible request"
        then: "the subscriber receives an explicitly identified reused result without a duplicate execution"

  - id: "US-002"
    title: "Keep near misses isolated"
    priority: "P0"
    as_a: "developer relying on validation correctness"
    i_want: "requests that differ in any behavior-relevant identity dimension to remain separate"
    so_that: "I never receive a result produced for different source, inputs, targets, or execution conditions"
    why_this_priority: "Incorrect coalescing would make validation receipts untrustworthy and could activate the wrong build."
    independent_test: "Vary each identity dimension one at a time and verify every near-miss request receives its own execution and source identity."
    acceptance_scenarios:
      - given: "two requests differ in repository or worktree, source state, lockfile, toolchain, action, profile, features, package or target, relevant environment, or normalized arguments"
        when: "both requests are queued"
        then: "they do not coalesce or reuse one another's result"

  - id: "US-003"
    title: "Supersede obsolete queued work"
    priority: "P1"
    as_a: "developer iterating while validation waits"
    i_want: "queued validation to be revalidated immediately before it competes for Cargo execution"
    so_that: "obsolete work is visibly superseded without interrupting unrelated active work"
    why_this_priority: "Fast iteration requires stale queued work to stop consuming scarce validation capacity while preserving safe active-work boundaries."
    independent_test: "Queue a request behind the global gate, change its source identity before acquisition, and verify it is superseded with no Cargo launch and no termination of the active unrelated request."
    acceptance_scenarios:
      - given: "a queued request's source identity becomes obsolete while unrelated Cargo work is active"
        when: "the queued request is revalidated before gate acquisition"
        then: "the obsolete request is marked superseded, does not start Cargo, and the unrelated active work continues"

  - id: "US-004"
    title: "Cancel subscribers safely"
    priority: "P1"
    as_a: "developer controlling work from one of several sessions"
    i_want: "each subscriber to cancel independently while preserving the established final-subscriber safety contract"
    so_that: "leaving one session does not cancel validation still needed by another session"
    why_this_priority: "Multi-session coalescing must not weaken user control or existing cancellation guarantees."
    independent_test: "Attach multiple subscribers, cancel followers in different orders, and verify execution continues until the existing final-subscriber rule permits cancellation."
    acceptance_scenarios:
      - given: "a leader execution has multiple active subscribers"
        when: "one follower cancels"
        then: "only that follower is cancelled and remaining subscribers continue receiving progress and the final result"
      - given: "the final subscriber cancels"
        when: "the established safe cancellation conditions are met"
        then: "the underlying work follows the existing final-subscriber cancellation behavior"

  - id: "US-005"
    title: "Inspect truthful lifecycle receipts"
    priority: "P1"
    as_a: "developer diagnosing self-development validation"
    i_want: "status and action receipts to explain queueing, gate wait, execution, reuse, cancellation, exit, and source identity"
    so_that: "I can distinguish progress, delay, supersession, failure, cancellation, and reuse without exposing sensitive data"
    why_this_priority: "Coalesced work is operationally trustworthy only when every subscriber can understand the result and its provenance."
    independent_test: "Exercise success, failure, follower, reuse, supersession, and cancellation paths and verify complete redacted receipts for each subscriber."
    acceptance_scenarios:
      - given: "a subscriber observes a queued, running, reused, failed, cancelled, or superseded request"
        when: "it requests status or receives the final action receipt"
        then: "the receipt reports applicable timing, role, reuse, cancellation reason, exit, and redacted source identity consistently"

requirements:
  functional:
    - id: "FR-001"
      description: "The system MUST use the existing server-owned self-development build queue as the sole authority for request coalescing, supersession, progress, cancellation, and results, preserving the single-server multi-client model. [PRIN-004]"
      testable: true
      acceptance_criteria: "Architecture inspection and multi-session tests show one canonical queue and no second daemon or client-owned execution path."
    - id: "FR-002"
      description: "The system MUST coalesce concurrent exact eligible build, test, and check requests into one leader execution with one or more follower subscribers."
      testable: true
      acceptance_criteria: "For each eligible action, concurrent identical requests produce exactly one Cargo process and all subscribers receive a terminal result."
    - id: "FR-003"
      description: "The system MUST define a versioned, deterministic, redacted request identity that covers repository and worktree, source or dirty fingerprint, Cargo.lock, toolchain, action, profile, features, package and target selection, relevant environment, and normalized arguments. [PRIN-006]"
      testable: true
      acceptance_criteria: "Identity tests prove deterministic equality for equivalent requests, a visible version, and no secrets or raw source content in identities or receipts."
    - id: "FR-004"
      description: "The system MUST treat requests as coalescible only when every identity dimension and identity version match exactly."
      testable: true
      acceptance_criteria: "A test matrix varying one identity dimension at a time shows no coalescing or result reuse for any near miss."
    - id: "FR-005"
      description: "The system MUST normalize arguments only where differences are proven behaviorally irrelevant, while preserving distinctions that can change Cargo behavior."
      testable: true
      acceptance_criteria: "Equivalent spelling or ordering cases defined by the normalization contract share an identity, while behavior-changing argument differences do not."
    - id: "FR-006"
      description: "The system MUST revalidate queued request identity and eligibility immediately before Cargo-gate acquisition."
      testable: true
      acceptance_criteria: "A request made obsolete while queued is detected before acquiring the gate and launches no Cargo process."
    - id: "FR-007"
      description: "The system MUST visibly complete an obsolete queued request as superseded, including a non-secret reason and its source identity, without terminating unrelated active work. [PRIN-006]"
      testable: true
      acceptance_criteria: "Supersession tests verify an explicit terminal receipt, no interruption to unrelated work, and no hidden or ambiguous cancellation."
    - id: "FR-008"
      description: "The system MUST permit each follower subscriber to cancel independently without cancelling the leader execution or other subscribers. [PRIN-009]"
      testable: true
      acceptance_criteria: "Cancelling any proper subset of subscribers only terminates those subscriptions and leaves remaining progress and execution intact."
    - id: "FR-009"
      description: "When the final subscriber cancels, the system MUST preserve the existing safe contract for deciding whether and how underlying work is cancelled. [PRIN-002, PRIN-009]"
      testable: true
      acceptance_criteria: "Regression tests reproduce existing final-subscriber cancellation outcomes for queued and active work."
    - id: "FR-010"
      description: "The system MUST provide truthful subscriber-specific outcomes for leader, follower, reused, superseded, cancelled, successful, and failed requests."
      testable: true
      acceptance_criteria: "Every lifecycle path returns the correct role and terminal state to each subscriber, including the actual shared execution exit outcome when applicable."
    - id: "FR-011"
      description: "The system MUST preserve existing build, build-reload, test, status, follow-existing-build, cancel-build, progress, reload, failure, and global Cargo-gate behavior unless this specification explicitly changes duplicate handling. [PRIN-002]"
      testable: true
      acceptance_criteria: "Focused compatibility tests cover every named workflow in unchanged single-request operation and in relevant coalesced operation."
    - id: "FR-012"
      description: "Rust action and status receipts MUST report applicable queue wait, Cargo-gate wait, execution duration, total duration, leader or follower role, reuse state, cancellation or supersession reason, process exit, and versioned source identity."
      testable: true
      acceptance_criteria: "Receipt schema and lifecycle tests verify every field is present when applicable, absent or explicitly unavailable when not applicable, and consistent across status and terminal actions."
    - id: "FR-013"
      description: "Receipts, progress, logs, and identities MUST NOT expose secrets, raw source content, raw dirty diffs, or sensitive environment values. [PRIN-006]"
      testable: true
      acceptance_criteria: "Fixtures containing sentinel secrets and source text produce only approved redacted fingerprints and metadata, with no sentinel value in observable output."
    - id: "FR-014"
      description: "A shared execution MUST continue publishing accurate progress to all active subscribers, including followers that attach after execution has started."
      testable: true
      acceptance_criteria: "Late and early subscribers observe monotonic lifecycle progress and the same execution terminal result."
    - id: "FR-015"
      description: "A failed, crashed, or abandoned shared execution MUST not leave identities permanently blocked or cause later matching requests to receive a false in-progress or successful result."
      testable: true
      acceptance_criteria: "Recovery tests simulate failure and abandoned ownership, then verify a later request can execute and receives a truthful result."
    - id: "FR-016"
      description: "Build-reload subscribers MUST activate or reload only an artifact produced by the matching successful source identity and MUST preserve established reconnection and continued-session behavior."
      testable: true
      acceptance_criteria: "Activation tests verify the resolved executable and source identity before reload, then confirm affected sessions reconnect and continue correctly."
    - id: "FR-017"
      description: "The change MUST be developed test-first, with focused automated checks tracing every behavioral acceptance criterion before broader validation. [PRIN-005]"
      testable: true
      acceptance_criteria: "Development evidence records failing focused tests before implementation and passing focused tests afterward, mapped to requirements."
    - id: "FR-018"
      description: "Delivery MUST pass the repository's relevant build and guardrail contracts using the current stable toolchain, with unrelated baseline failures isolated rather than hidden. [PRIN-007]"
      testable: true
      acceptance_criteria: "Validation receipts record focused checks, the relevant build, and the canonical guardrail command with passing changed-surface results."
    - id: "FR-019"
      description: "Runtime validation MUST exercise the newly built binary through isolated multi-session instances and verify the executable being tested, including build, activation or reload, recovery, and continued session behavior. [PRIN-010]"
      testable: true
      acceptance_criteria: "A built-binary validation record names the resolved executable, isolated runtime endpoint, session count, scenarios, and observed outcomes."
    - id: "FR-020"
      description: "Validation MUST record before-and-after evidence for duplicate execution count and subscriber-observed latency under exact duplicate requests. [PRIN-010]"
      testable: true
      acceptance_criteria: "Comparable baseline and changed measurements show execution count and latency for the same controlled multi-session scenarios."
    - id: "FR-021"
      description: "The completed outcome MUST include evidence traceable to PRIN-002, PRIN-004, PRIN-005, PRIN-006, PRIN-007, PRIN-009, and PRIN-010."
      testable: true
      acceptance_criteria: "The acceptance matrix maps each named principle to at least one requirement and an executed compliance check."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Exact duplicate requests must reduce redundant validation work without regressing the self-development runtime budgets established by jcode-l89.1."
      measurable_target: "Zero duplicate Cargo executions for an overlapping exact-identity request group, and every applicable jcode-l89.1 budget remains at or below its maintained threshold."
    - id: "NFR-002"
      category: "reliability"
      description: "Every active subscriber must receive a truthful terminal outcome despite follower cancellation, leader-session departure, execution failure, or queue recovery."
      measurable_target: "100% of active subscribers in focused concurrency and recovery tests receive exactly one terminal outcome matching the underlying lifecycle."
    - id: "NFR-003"
      category: "security"
      description: "Request identity and observability must reveal only bounded redacted provenance."
      measurable_target: "Zero secret, raw-source, raw-diff, or sensitive-environment sentinel values appear in identities, receipts, status, progress, or logs across negative-path tests."
    - id: "NFR-004"
      category: "code_quality"
      description: "The change must remain surgical and owned by the existing self-development queue boundary."
      measurable_target: "No new daemon, no unrelated refactor, no new general-purpose framework, and all changed behavior is covered by focused requirement-linked tests."
    - id: "NFR-005"
      category: "usability"
      description: "Lifecycle receipts must let a developer distinguish shared execution, reuse, waiting, supersession, cancellation, success, and failure without consulting internal logs."
      measurable_target: "All tested lifecycle outcomes are unambiguously identifiable from the public action or status receipt alone."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Developers issuing overlapping exact duplicate validation from multiple sessions observe one shared execution rather than repeated work."
      metric: "Number of validation executions per exact-identity overlap group"
      target: "Exactly 1 execution for every eligible group with 2 or more overlapping requests"
    - id: "SC-002"
      description: "Developers never receive validation results from a request with different behavior-relevant inputs."
      metric: "Incorrectly shared near-miss cases in the identity variation matrix"
      target: "0 incorrectly coalesced or reused cases"
    - id: "SC-003"
      description: "Developers can identify why a request waited, reused work, ended, or was superseded from its receipt."
      metric: "Lifecycle scenarios with complete and unambiguous public receipts"
      target: "100% of required leader, follower, reuse, cancellation, supersession, success, and failure scenarios"
    - id: "SC-004"
      description: "Obsolete queued validation stops consuming future execution capacity without disrupting current unrelated work."
      metric: "Obsolete queued requests launched and unrelated active executions interrupted"
      target: "0 obsolete launches and 0 unrelated interruptions in focused concurrency tests"
    - id: "SC-005"
      description: "Multi-session self-development iteration is no slower than the maintained baseline while duplicate demand is reduced."
      metric: "Maintained runtime budgets and subscriber-observed completion latency versus the jcode-l89.1 baseline"
      target: "No maintained budget regression and duplicate-group latency is no worse than baseline single-execution latency plus measurement tolerance"
    - id: "SC-006"
      description: "The feature works in the executable users will actually run, including activation and recovery."
      metric: "Passing isolated built-binary multi-session scenarios"
      target: "100% pass for exact duplicate, near miss, cancellation, supersession, failure recovery, activation or reload, and continued-session scenarios"

key_entities:
  - name: "Validation Request Identity"
    description: "A versioned redacted description of all inputs that determine whether two validation requests are exactly equivalent."
    attributes:
      - "identity version"
      - "repository and worktree fingerprint"
      - "source or dirty-state fingerprint"
      - "lockfile fingerprint"
      - "toolchain"
      - "action and profile"
      - "features, package, and target selection"
      - "relevant redacted environment"
      - "normalized arguments"
  - name: "Shared Validation Execution"
    description: "One queued or active validation lifecycle that serves all exact-matching subscribers."
    attributes:
      - "leader request"
      - "active subscribers"
      - "queue, gate, execution, and total timing"
      - "progress and terminal state"
      - "process exit outcome"
      - "reusable result state"
  - name: "Validation Subscriber"
    description: "A session-specific interest in a shared validation execution with independent cancellation and truthful receipts."
    attributes:
      - "leader or follower role"
      - "attachment and cancellation state"
      - "reuse state"
      - "subscriber-visible progress"
      - "terminal outcome and reason"
  - name: "Validation Receipt"
    description: "The redacted public evidence returned through action and status surfaces for one subscriber."
    attributes:
      - "source identity"
      - "lifecycle timings"
      - "role and reuse"
      - "cancellation or supersession reason"
      - "exit and terminal state"

edge_cases:
  - scenario: "An exact follower arrives after the leader acquires the Cargo gate or begins execution."
    expected_behavior: "The follower attaches to the same execution, receives current and future progress, and receives a truthful follower result."
  - scenario: "A request has the same source tree but a different Cargo.lock, toolchain, target, feature set, relevant environment, or argument semantics."
    expected_behavior: "The request is a near miss and executes separately."
  - scenario: "The worktree is dirty and changes again while its request waits behind unrelated Cargo work."
    expected_behavior: "Pre-gate revalidation detects the obsolete identity and visibly supersedes the queued request without interrupting active work."
  - scenario: "One follower cancels while other followers and the leader remain interested."
    expected_behavior: "Only the cancelling subscriber ends; shared execution and other subscriptions continue."
  - scenario: "The leader's originating session disconnects while followers remain."
    expected_behavior: "Server ownership preserves execution and follower delivery independent of the leader session's lifetime."
  - scenario: "All subscribers cancel at nearly the same time as execution completes."
    expected_behavior: "The established final-subscriber safety rule determines process handling, and each subscriber receives exactly one truthful terminal outcome without double completion."
  - scenario: "A shared execution fails, panics, or its owner state is recovered after restart."
    expected_behavior: "Subscribers receive a visible failure or recovery outcome, stale ownership is cleared safely, and later matching requests are not falsely reused or blocked."
  - scenario: "A successful matching build is eligible for build-reload while a near-miss build is also present."
    expected_behavior: "Only the artifact with the exact successful source identity may be activated for the subscriber."
  - scenario: "Timing data is unavailable for a lifecycle phase that did not occur, such as gate wait for a reused result."
    expected_behavior: "The receipt distinguishes not-applicable or unavailable timing from zero elapsed time."

assumptions:
  - "Eligibility for sharing includes only exact build, test, and check requests whose current behavior is safe to execute once for multiple subscribers; unsupported action shapes remain independent."
  - "The existing self-development queue, global Cargo gate, cancellation contract, reload lifecycle, and jcode-l89.1 runtime budget artifacts are the authoritative baselines."
  - "A source identity may use redacted cryptographic fingerprints and bounded non-secret labels, but never raw source, raw diffs, credentials, or sensitive environment values."
  - "Safe result reuse is limited to results whose full identity and lifecycle state remain valid at subscription time; otherwise a new execution is required."
  - "No new user configuration is required; existing commands retain their current defaults and public behavior when there is no duplicate request."
  - "Equivalent normalized arguments are defined conservatively; ambiguity defaults to treating requests as different."

constraints:
  - "Implementation is owned by Bead jcode-l89.2 and must extend crates/jcode-app-core's existing server-owned self-development build queue."
  - "No second daemon, client-side scheduler, parallel execution authority, or duplicate queue may be introduced. [PRIN-004]"
  - "Existing public command, protocol, persistence, receipt, cancellation, and reload contracts must remain backward compatible through additive fields or compatible defaults. [PRIN-002]"
  - "All diagnostic identity and receipt data must be redacted and bounded at trust boundaries. [PRIN-006]"
  - "Focused tests must precede implementation, and relevant repository guardrails must pass before delivery. [PRIN-005, PRIN-007]"
  - "Validation must use the newly built executable through an isolated runtime endpoint and include multi-session, recovery, and activation evidence. [PRIN-010]"
  - "Runtime budgets inherited from jcode-l89.1 must not regress. [PRIN-010]"
  - "Cancellation and supersession must remain bounded by user control and must not terminate unrelated active work. [PRIN-009]"
  - "Changes must be surgical and must not include adjacent cleanup or broad refactoring."

out_of_scope:
  - "Creating a second daemon, distributed scheduler, or general-purpose cross-process build service."
  - "Coalescing non-Cargo tools or arbitrary commands."
  - "Sharing near-miss requests through partial, fuzzy, or best-effort identity matching."
  - "Changing Cargo's own dependency resolution, compilation cache, or incremental compilation behavior."
  - "Redefining existing command semantics, global Cargo-gate policy, reload policy, or final-subscriber cancellation safety rules."
  - "Exposing raw source, dirty diffs, secret environment values, or credentials for diagnostics."
  - "Unrelated queue refactors, crate moves, dependency additions, or broad observability redesign."

