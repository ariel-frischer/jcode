implementation_phases:
  - phase: 1
    name: "Freeze identity, eligibility, and receipt contracts with failing tests"
    goal: "Turn every behavior-relevant equality dimension and public lifecycle outcome into explicit test-first contracts before queue implementation changes."
    deliverables:
      - "Failing CargoRequestIdentity determinism, identity-version, equivalent-normalization, and one-dimension-at-a-time near-miss tests."
      - "Failing eligibility tests for generated builds, single Cargo build/test/check commands, opaque shell, compound shell, and unsupported Cargo actions."
      - "Failing additive serde compatibility and redaction sentinel tests for persisted request and receipt shapes."
      - "Acceptance matrix mapping FR-001 through FR-021 and PRIN-002/004/005/006/007/009/010 to direct checks."
  - phase: 2
    name: "Implement versioned redacted request identity"
    goal: "Collect and normalize every approved identity component without exposing behavior inputs or changing existing execution."
    dependencies:
      - "Phase 1"
    deliverables:
