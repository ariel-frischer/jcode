research_findings:
  decisions:
    - topic: "Atomic ownership"
      decision: "Serialize duplicate lookup and initial request persistence with one process-wide claim mutex owned by BuildRequest."
      rationale: "All sessions share one server process; persisted requests and existing reconciliation provide restart recovery. The mutex closes the current multi-threaded find-then-save race without changing the queue or global Cargo gate."
      alternatives_considered:
        - "A second daemon or database"
        - "A new persisted shared-execution model"
        - "Relying only on dev_cargo.sh flock after duplicate producers already exist"
    - topic: "Follower reuse"
      decision: "Generalize the existing Attached watcher helper just enough for both build and eligible test requests."
      rationale: "It already preserves per-session background delivery, progress polling, terminal propagation, and follower cancellation."
      alternatives_considered:
        - "A new subscriber/execution subsystem"
        - "Returning the leader task directly to every caller"
    - topic: "Eligible test commands"
      decision: "Recognize only one unambiguous cargo or scripts/dev_cargo.sh build/test/check invocation and keep the exact trimmed command in the identity."
      rationale: "This captures the expensive compile-capable cases while proving arbitrary shell side-effect equivalence is out of scope."
      alternatives_considered:
        - "Whitespace-normalizing arbitrary shell"
        - "Coalescing pipelines, environment-prefixed commands, or command chains"
        - "Rejecting opaque commands"
    - topic: "Identity"
      decision: "Version the existing worktree scope + SourceState fingerprint + exact rendered command key."
      rationale: "SourceState already includes clean revision or dirty tracked/untracked state; generated commands retain target/profile/features/package semantics; exact command preservation avoids unsafe normalization."
      alternatives_considered:
        - "New public identity types and a new dependency"
        - "Raw source, path, diff, lockfile, toolchain, or environment values in receipts"
    - topic: "Queued supersession"
      decision: "Reuse build source revalidation and add the analogous test-source check after queue ownership and before command launch."
      rationale: "This prevents stale eligible validation from reaching Cargo while leaving unrelated active work and dev_cargo.sh unchanged."
      alternatives_considered:
        - "Killing the active gate holder"
        - "Revalidating only after Cargo completes"
    - topic: "Observability"
      decision: "Keep persisted request timestamps/source state and rust-actions gate/execution timings; add bounded identity-version and role/coalesced metadata only."
      rationale: "The existing surfaces already own the required timing and source receipts. Duplicating them into a new schema would expand scope without changing the outcome."
      alternatives_considered:
        - "Changing scripts/dev_cargo.sh"
        - "A new lifecycle receipt framework"

data_model:
  entities:
    - name: "BuildRequest"
      description: "Existing persisted request remains both producer record and attached watcher record."
      fields:
        - name: "dedupe_key"
          type: "optional string"
          description: "Version-prefixed redacted exact identity used only for eligible requests."
          constraints: "Legacy missing keys and ineligible commands never coalesce."
        - name: "attached_to_request_id"
          type: "optional string"
          description: "Existing follower-to-producer relationship."
          constraints: "Attached requests never produce Cargo work."
        - name: "requested_source"
          type: "optional SourceState"
          description: "Existing redacted source identity used for equality and pre-launch revalidation."
          constraints: "No raw source or diff content."
      relationships:
        - target: "BackgroundTask"
          type: "one-to-one"
          description: "A leader owns execution; a follower owns only its watcher task."
    - name: "AtomicRequestClaim"
      description: "Short process-local critical section around lookup and initial persistence."
      fields:
        - name: "identity"
          type: "optional versioned dedupe key"
          description: "Eligible exact identity, or none for independent execution."
          constraints: "The lock is never held across await or Cargo execution."
        - name: "outcome"
          type: "leader or attached"
          description: "Exactly one caller persists the producer for an active identity."
          constraints: "Restart safety falls back to persisted request reconciliation."
      relationships:
        - target: "BuildRequest"
          type: "one-to-many"
          description: "One leader may have multiple existing Attached watcher requests."

