plan:
  branch: "agent/jcode-l89.2-selfdev-coalesce"
  created: "2026-08-22"
  spec_path: "specs/014-coalesce-selfdev-cargo/spec.yaml"

summary: |
  Complete the smallest coherent extension of the existing server-owned SelfDevTool
  queue. Preserve BuildRequest persistence, attached watcher delivery, source-state
  fingerprints, the selfdev worktree lock, scripts/dev_cargo.sh, and every public
  action. Add one atomic in-process claim around duplicate lookup plus leader or
  follower persistence so concurrent sessions cannot both create producers. Reuse
  that claim and the existing follower path for conservatively eligible exact Cargo
  build, test, and check commands submitted through selfdev test. Opaque or compound
  shell commands remain independent.

  Existing build source revalidation, terminal reconciliation, follower background
  task cancellation, build-reload source validation, request timestamps, source
  fingerprints, and rust-actions gate/execution receipts remain the canonical safety
  and observability contracts. Extend only additive request/tool metadata needed to
  identify the versioned coalescing identity and leader/follower role. Add focused
  race, near-miss, stale-source, cancellation, failure, recovery, and reload tests,
  then validate the built binary on an isolated socket and record before/after
  duplicate-count, gate-wait, latency, and runtime-budget evidence.

