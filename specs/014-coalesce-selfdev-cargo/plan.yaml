  language: "Rust 2024"
  framework: "Tokio, Serde, Jcode background tasks, existing selfdev queue"
  primary_dependencies:
    - name: "jcode-app-core selfdev queue"
      version: "workspace"
      purpose: "Canonical server-owned request persistence, ordering, following, cancellation, and status."
    - name: "jcode-build-support SourceState"
      version: "workspace"
      purpose: "Existing redacted repository, worktree, version, and dirty-source identity."
    - name: "scripts/dev_cargo.sh"
      version: "repository-local"
      purpose: "Unchanged host-wide Cargo gate and rust-actions timing receipts."
  storage: "Existing JCODE_HOME/selfdev-build-requests JSON files only; additive serde-compatible fields where required."
  testing:
    framework: "Rust test harness with Tokio tests plus isolated built-binary validation"
    approach: "TDD with focused selfdev tests before implementation, then serialized Cargo checks and repository guardrails."
  target_platform: "Existing supported selfdev hosts"
  project_type: "cli"
  performance_goals: "One producer for overlapping exact eligible requests, no duplicate broad Cargo action, and no jcode-l89.1 runtime-budget regression."
  constraints:
    - "Keep the existing single-server, multi-client runtime and SelfDevTool queue as sole authority."
    - "Do not add a daemon, cache, dependency, new crate, general scheduler, or alternate Cargo gate."
    - "Keep scripts/dev_cargo.sh and its flock behavior unchanged."
    - "Coalesce selfdev test only for a conservative single Cargo or scripts/dev_cargo.sh build/test/check command; ambiguity is ineligible."
    - "Exact command semantics remain part of identity; do not normalize quoting, shell expansion, environment assignments, pipelines, chaining, or redirection."
    - "Use the existing SourceState fingerprint and rendered command, prefixed by a visible identity version; the server process environment is shared across sessions."
    - "Preserve arbitrary selfdev test commands by executing them independently."
    - "Preserve existing progress, notify/wake, build-reload, failure propagation, cancellation, status, and restart reconciliation."
    - "Receipts expose only existing redacted source fingerprints, bounded identity version/role fields, timestamps, and structured rust-actions timing."
    - "All Cargo-heavy validation is serialized."
  scale_scope: "One long-lived local server with multiple sessions and a bounded persisted request history."

