  endpoints: []
  commands:
    - name: "selfdev build"
      description: "Existing behavior with atomic exact duplicate claim."
      inputs: "Unchanged reason, target, notify, wake."
      outputs: "Existing leader or attached output plus additive bounded identity-version/role metadata."
      exit_codes: "Unchanged."
    - name: "selfdev test"
      description: "Exact eligible Cargo build/test/check commands may attach; all other shell commands remain independent."
      inputs: "Unchanged command, reason, notify, wake."
      outputs: "Existing queue output or attached watcher output with additive eligibility/role metadata."
      exit_codes: "Actual producer command result is propagated unchanged."
    - name: "selfdev build-reload"
      description: "Continues to use selfdev build result and existing source-validated reload path."
      inputs: "Unchanged."
      outputs: "Unchanged, including attached-build success/failure propagation."
      exit_codes: "Unchanged."
    - name: "selfdev cancel-build"
      description: "Cancelling an Attached watcher cancels only that watcher; leader cancellation retains existing safe behavior."
      inputs: "Unchanged request_id or task_id."
      outputs: "Existing cancellation output."
      exit_codes: "Unchanged."
    - name: "selfdev status"
      description: "Existing queue and Attached watcher status remains canonical."
      inputs: "None."
      outputs: "Existing status with source, timestamps, queue state, and watcher attribution."
      exit_codes: "Unchanged."
  receipt_schema: "Existing BuildRequest/status metadata and rust-actions JSONL, with additive identity_version, role, coalesced, and duplicate_of metadata where applicable."

