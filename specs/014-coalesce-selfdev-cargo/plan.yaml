research_findings:
  decisions:
    - topic: "Canonical runtime owner"
      decision: "Extend BuildRequest and the existing SelfDevTool queue in crates/jcode-app-core into explicit shared execution plus subscriber records."
      rationale: "The current queue already persists requests, orders work per worktree, attaches duplicate builds, follows progress, reconciles background tasks, and owns cancellation. Extending it preserves the single-server multi-client architecture and minimizes changed boundaries."
      alternatives_considered:
        - "Add a second Cargo-coalescing daemon"
        - "Coordinate duplicate work in each client session"
        - "Use only the filesystem Cargo lock and let followers poll process state"
    - topic: "Stable contract ownership"
      decision: "Define versioned redacted identity and lifecycle receipt value types in jcode-selfdev-types, keep source and command collection helpers in jcode-build-support, and keep mutable queue state and orchestration private to jcode-app-core."
      rationale: "Identity and receipt shapes are stable serialized contracts, while repository inspection and process orchestration have heavier runtime dependencies and belong in their existing owners."
      alternatives_considered:
        - "Keep every new type private inside build_queue.rs"
        - "Move the entire queue into jcode-selfdev-types"
        - "Create a new workspace crate for this feature"
    - topic: "Request identity representation"
      decision: "Use an explicit identity schema version plus redacted component fingerprints and canonical normalized enums/lists, then derive one deterministic digest for lookup."
      rationale: "A visible version makes future normalization changes non-equal by construction, component metadata explains near misses without secrets, and a bounded digest provides efficient persisted lookup. Existing repo_scope, worktree_scope, and source fingerprint patterns already hash raw paths and source bytes."
      alternatives_considered:
        - "Continue using worktree_scope, source fingerprint, and command display only"
        - "Serialize raw paths, Cargo.lock, environment, and argv into the key"
        - "Hash one opaque concatenated command without component receipts"
    - topic: "Identity inputs"
      decision: "Capture repository and worktree scope hashes, source fingerprint, Cargo.lock content fingerprint, rust-toolchain/rustc/cargo identity, Cargo action/profile, normalized feature/package/target selections, an allowlist of behavior-relevant effective environment fingerprints, and lossless normalized eligible argv."
      rationale: "These dimensions cover the spec's behavior-changing inputs while keeping source, paths, lockfile content, and environment values out of observable state."
      alternatives_considered:
        - "Use Git commit and dirty boolean only"
        - "Include every environment variable"
        - "Trust the rendered command string as complete provenance"
    - topic: "Eligibility and argument normalization"
      decision: "Coalesce generated selfdev builds and understood single Cargo build/test/check invocations only; parse Cargo options into a canonical form using a narrow allowlist, sort only documented order-insensitive sets such as features and package selections, and preserve all unknown or positional ordering."
      rationale: "Current selfdev test accepts arbitrary shell, so treating opaque compound commands as equivalent would be unsafe. Conservative eligibility and normalization guarantee near misses remain isolated without breaking existing arbitrary tests."
      alternatives_considered:
        - "Coalesce all shell command strings after whitespace normalization"
        - "Never normalize any Cargo spelling or set ordering"
        - "Reject existing arbitrary selfdev test commands"
    - topic: "Leader, follower, and result reuse lifecycle"
      decision: "Create one execution record per identity and one subscriber request per invoking session; queued/running matches attach as followers, and completed successful matches reuse only after receipt and artifact/source validation."
      rationale: "Separating execution truth from subscriber delivery avoids leader-session ownership leaks, supports late progress attachment, and gives each subscriber an independent terminal outcome."
      alternatives_considered:
        - "Promote the first BuildRequest itself to permanent owner of every follower"
        - "Return the leader task ID directly to all sessions"
        - "Reuse any historical successful request without revalidation"
    - topic: "Queued supersession boundary"
      decision: "Recompute eligibility and complete identity after reaching queue head but before acquiring the selfdev build lock or invoking dev_cargo.sh; identity drift completes the execution and subscribers as superseded without touching the current gate owner."
      rationale: "This prevents obsolete Cargo launches while honoring the requirement not to interrupt unrelated active work and avoids holding a scarce gate during repository inspection."
      alternatives_considered:
        - "Cancel stale work at initial enqueue only"
        - "Acquire the Cargo gate before source revalidation"
        - "Terminate the active gate holder when newer source appears"
    - topic: "Cancellation and recovery"
      decision: "Track active subscribers independently; cancelling a proper subset ends only those subscriptions, while zero subscribers delegates to the existing queued/active safe cancellation path. Reconciliation clears abandoned execution ownership and never treats an incomplete receipt as reusable success."
      rationale: "This preserves current final-subscriber semantics while preventing one departing session from cancelling work needed elsewhere or a crashed leader from poisoning the identity."
      alternatives_considered:
        - "Leader cancellation always kills the shared process"
        - "Followers cannot cancel"
        - "Keep abandoned identities blocked until manual cleanup"
    - topic: "Observability and Cargo receipt integration"
      decision: "Use one lifecycle receipt shape for status and terminal tool metadata, and pass bounded selfdev execution context into scripts/dev_cargo.sh so rust-actions.jsonl records queue/gate/execution/total timing, role/reuse, terminal reason, exit, and identity digest/version."
      rationale: "The wrapper already measures Cargo-gate wait and process duration. Adding redacted context there avoids reconstructing cross-process timing from logs and keeps public receipts consistent."
      alternatives_considered:
        - "Add status-only fields and leave rust-actions unchanged"
        - "Parse human Cargo output to infer lifecycle timing"
        - "Log raw argv and effective environment values for diagnostics"
    - topic: "Validation strategy"
      decision: "Combine deterministic unit/concurrency tests with controlled dev_cargo receipt fixtures, then run an isolated private-socket multi-session scenario using target/selfdev/jcode and compare duplicate count and subscriber latency before and after."
      rationale: "Compilation cannot verify the long-lived daemon path, activation, reconnection, shared execution, or measured efficiency. The predecessor runtime-budget workflow supplies the maintained performance contract."
      alternatives_considered:
        - "Rely on cargo build and unit tests only"
        - "Reload the user's active shared daemon for validation"
        - "Use terminal-output parsing instead of structured receipts"

data_model:
  entities:
    - name: "CargoRequestIdentity"
      description: "Versioned, deterministic, redacted description of one eligible Cargo behavior."
      fields:
        - name: "schema_version"
          type: "u16"
          description: "Identity normalization and component contract version."
          constraints: "Required; different versions are never equal or reusable."
        - name: "repository_scope"
          type: "hex fingerprint"
          description: "Redacted Git common-directory identity."
          constraints: "Derived from the canonical path without serializing the path."
        - name: "worktree_scope"
          type: "hex fingerprint"
          description: "Redacted canonical worktree identity."
          constraints: "Different worktrees remain distinct even at the same revision."
        - name: "source_fingerprint"
          type: "hex fingerprint"
          description: "Commit plus dirty tracked/untracked source state."
          constraints: "Never contains raw source, path lists, or diff content."
        - name: "cargo_lock_fingerprint"
          type: "hex fingerprint"
          description: "Cargo.lock content and absence state."
          constraints: "Required and recomputed before execution."
        - name: "toolchain_fingerprint"
          type: "hex fingerprint plus bounded labels"
          description: "rust-toolchain selection and effective rustc/cargo identity."
          constraints: "Command failures make the request ineligible or visibly failed, never silently omitted."
        - name: "cargo_selection"
          type: "object"
          description: "Action, profile, features, packages, workspace/exclude, targets, target triple, and normalized argv."
          constraints: "Canonical only for understood eligible build/test/check invocations."
        - name: "environment_fingerprint"
          type: "hex fingerprint"
          description: "Allowlisted effective behavior-relevant build environment."
          constraints: "Receipts may expose variable names/presence and digest only, never sensitive values."
        - name: "digest"
          type: "hex fingerprint"
          description: "Deterministic lookup key over the canonical versioned identity."
          constraints: "Equality requires both matching schema version and complete canonical components, not digest alone in tests."
      relationships:
        - target: "SharedCargoExecution"
          type: "one-to-many"
          description: "An identity may have historical attempts, but at most one reusable or active canonical execution at a time."
    - name: "SharedCargoExecution"
      description: "One server-owned queued or running Cargo attempt shared by subscribers."
      fields:
        - name: "execution_id"
          type: "UUID-backed string"
          description: "Stable persisted execution identifier."
          constraints: "Unique across queue history."
        - name: "identity"
          type: "CargoRequestIdentity"
          description: "Exact behavior and source identity served by this attempt."
          constraints: "Immutable after enqueue; revalidation compares a fresh identity to it."
        - name: "state"
          type: "enum"
          description: "queued, gate_wait, running, completed, failed, cancelled, superseded, or abandoned."
          constraints: "Terminal transitions occur once and incomplete states are never reusable."
        - name: "timing"
          type: "object"
          description: "Requested, queue-head, gate-acquired, started, and completed timestamps plus queue/gate/execution/total durations."
          constraints: "Durations are monotonic and present only when the lifecycle reached that boundary."
        - name: "process_exit"
          type: "object or null"
          description: "Exit code, signal/termination classification, and success."
          constraints: "Reflects the actual shared process; absent when Cargo never launched."
        - name: "terminal_reason"
          type: "bounded redacted string or enum"
          description: "Failure, cancellation, supersession, or recovery explanation."
          constraints: "Actionable without source, diff, secret, or sensitive environment content."
        - name: "result_reference"
          type: "object or null"
          description: "Output/status paths and produced artifact/source metadata."
          constraints: "Reusable only after successful completeness and artifact/source validation."
      relationships:
        - target: "CargoSubscriber"
          type: "one-to-many"
          description: "One execution delivers progress and terminal truth to all active subscribers."
    - name: "CargoSubscriber"
      description: "One session's independently cancellable interest in a shared execution."
      fields:
        - name: "request_id"
          type: "UUID-backed string"
          description: "Existing public request identifier retained per invocation."
          constraints: "Unique and persisted with serde-compatible defaults."
        - name: "session_identity"
          type: "object"
          description: "Session ID and existing optional display labels."
          constraints: "Used for delivery and diagnostics, not Cargo identity equality."
        - name: "role"
          type: "enum"
          description: "leader, follower, or reused."
          constraints: "Stable for the subscriber receipt; leader departure does not invalidate execution ownership."
        - name: "state"
          type: "enum"
          description: "active, completed, failed, cancelled, or superseded."
          constraints: "Exactly one terminal outcome per subscriber."
        - name: "cancellation_reason"
          type: "bounded redacted string or null"
          description: "Why this subscriber detached."
          constraints: "Cancelling a proper subset cannot alter other subscriber state or process ownership."
        - name: "background_delivery"
          type: "object"
          description: "Background task, notify, wake, output, and status references."
          constraints: "Preserves current follow-existing-build and completion delivery behavior."
      relationships:
        - target: "LifecycleReceipt"
          type: "one-to-one"
          description: "Every subscriber receives its own role-aware public receipt."
    - name: "LifecycleReceipt"
      description: "Consistent redacted status, terminal action, progress, and rust-action provenance."
      fields:
        - name: "identity_summary"
          type: "object"
          description: "Identity version, digest, redacted component fingerprints, action, and bounded selection labels."
          constraints: "Contains no raw path, source, diff, secret, or sensitive environment value."
        - name: "role_and_reuse"
          type: "object"
          description: "Leader/follower/reused role, execution ID, leader request reference, and reuse state."
          constraints: "Subscriber-specific and truthful for every lifecycle path."
        - name: "timing"
          type: "object"
          description: "Applicable queue, gate, execution, and total timings."
          constraints: "Status and terminal metadata use the same field meanings."
        - name: "outcome"
          type: "object"
          description: "Lifecycle state, cancellation/supersession reason, validation state, process exit, and artifact/source match."
          constraints: "Never reports success from an incomplete, abandoned, cancelled, or mismatched execution."
      relationships:
        - target: "RustActionRecord"
          type: "one-to-one"
          description: "A launched Cargo execution contributes one wrapper receipt referenced by subscriber receipts."
    - name: "RustActionRecord"
      description: "Append-only dev_cargo.sh record for the one actual Cargo process."
      fields:
        - name: "existing_process_fields"
          type: "object"
          description: "Started time, argv policy, profile, repository fingerprint, execution location, gate wait, duration, exit, and success."
          constraints: "Existing consumers remain compatible through additive fields; raw repository path and unsafe argv values are redacted for selfdev receipts."
        - name: "selfdev_context"
          type: "object or null"
          description: "Execution ID, identity version/digest, action role, subscriber count at launch, and queue timing."
          constraints: "Accepted only from bounded server-provided environment fields and never trusted as raw secret-bearing data."
      relationships:
        - target: "SharedCargoExecution"
          type: "many-to-one"
          description: "Normally one Cargo record belongs to one execution; remote/local wrapper internals may add bounded related records with the same execution context."

api_contracts:
  endpoints: []
  commands:
    - name: "selfdev build"
      description: "Submit a generated eligible selfdev Cargo build identity and return a leader, follower, or reused subscriber receipt."
      inputs: "Existing reason, target, notify, and wake fields plus effective server-side source/toolchain/environment context."
      outputs: "Existing human output and additive structured metadata containing request/execution identity, role, reuse, timing, progress references, and terminal provenance."
      exit_codes: "Tool success indicates accepted subscription or truthful terminal reuse; execution failure, cancellation, supersession, and activation mismatch remain explicit structured outcomes."
    - name: "selfdev build-reload"
      description: "Subscribe to the matching build execution, then activate and reload only its successful artifact/source identity while preserving reconnection."
      inputs: "Existing build-reload fields and current session context."
      outputs: "Build lifecycle receipt plus artifact identity, activation/reload state, and continued-session evidence."
      exit_codes: "No reload on failed, cancelled, superseded, abandoned, or source-mismatched execution."
    - name: "selfdev test"
      description: "Classify the existing command; coalesce understood single Cargo build/test/check requests and preserve non-coalesced behavior for opaque commands."
      inputs: "Existing command, reason, notify, and wake fields."
      outputs: "Eligibility plus leader/follower/reuse receipt for eligible Cargo requests, or the existing independent execution receipt for ineligible opaque commands."
      exit_codes: "The actual command exit is preserved and shared only among exact eligible subscribers."
    - name: "selfdev status"
      description: "Render active and recent shared executions and subscriber state from the canonical persisted queue."
      inputs: "No new required input."
      outputs: "Existing build/channel/reload status plus redacted identity, queue/gate/execution timing, subscriber count/roles, reuse, terminal reason, and exit fields."
      exit_codes: "Nonzero only for existing status read/validation failures; malformed persisted additions fall back through serde defaults or explicit reconciliation."
    - name: "selfdev cancel-build"
      description: "Cancel one subscriber request and invoke existing underlying cancellation only when no active subscribers remain and current safety checks allow it."
      inputs: "Existing request or task identifier."
      outputs: "Subscriber cancellation result, remaining subscriber count, underlying cancellation decision, and reason."
      exit_codes: "Explicitly distinguishes subscriber-only cancellation, underlying cancellation, already-terminal state, and cancellation that could not complete."
    - name: "scripts/dev_cargo.sh"
      description: "Retain the global Cargo gate and append one redacted rust-actions record for each actual Cargo execution."
      inputs: "Existing Cargo argv plus bounded JCODE_SELFDEV_* execution context set by the server-owned queue."
      outputs: "Existing Cargo output and additive JSONL queue/gate/execution/total timing, identity, role/reuse, cancellation/terminal reason, and exit fields."
      exit_codes: "Unchanged Cargo/wrapper exit semantics; receipt writing remains best-effort but validation detects a missing receipt before result reuse."
  receipt_schema: "Additive versioned JSON metadata shared by selfdev action results and status, with execution identity, subscriber role, reuse state, lifecycle timings, terminal reason, process exit, artifact/source validation, and redacted identity components."

