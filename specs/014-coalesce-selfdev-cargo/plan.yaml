plan:
  branch: "agent/jcode-l89.2-selfdev-coalesce"
  created: "2026-08-22"
  spec_path: "specs/014-coalesce-selfdev-cargo/spec.yaml"

summary: |
  Extend the existing server-owned self-development queue in
  crates/jcode-app-core rather than adding a daemon or client-side scheduler.
  Replace the current worktree/source/command display dedupe key with a
  versioned redacted Cargo request identity, then model every request as a
  subscriber to one canonical shared execution. Exact eligible build, test,
  and check identities can attach to queued or running work and can reuse a
  still-valid successful result; requests with any behavior-relevant mismatch
  remain isolated.

  Keep persisted request compatibility additive, revalidate identity and
  eligibility immediately before competing for the existing selfdev lock and
  scripts/dev_cargo.sh global Cargo gate, and complete obsolete queued work as
  visibly superseded. Subscriber cancellation remains independent until the
  final active subscriber invokes the existing safe cancellation contract.
  Status, tool metadata, progress, and rust-actions receipts gain consistent
  queue/gate/execution timing, role, reuse, exit, reason, and redacted identity
  fields. Delivery proceeds test-first through focused concurrency, recovery,
  activation, compatibility, privacy, built-binary multi-session, duplicate
  count, latency, maintained runtime-budget, and repository guardrail checks.

technical_context:
  language: "Rust 2024 with a small existing Bash Cargo wrapper"
  framework: "Tokio async runtime, Serde persisted/tool metadata, Jcode background tasks, and the existing Cargo workspace"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "Coordinate queue wait, shared execution, subscriber progress, cancellation, and process lifecycle without blocking the server runtime."
    - name: "serde and serde_json"
      version: "1"
      purpose: "Preserve additive persisted BuildRequest compatibility and emit versioned identity and lifecycle receipts."
    - name: "sha2"
      version: "0.10"
      purpose: "Produce deterministic bounded fingerprints for identity components and the canonical identity digest without exposing raw source, paths, lockfile content, arguments, or environment values."
    - name: "chrono"
      version: "0.4"
      purpose: "Record queue, gate, execution, completion, cancellation, supersession, and reuse timestamps and durations."
    - name: "scripts/dev_cargo.sh"
      version: "repository-local"
      purpose: "Retain the canonical cross-process Cargo gate, local/remote execution policy, and rust-actions.jsonl instrumentation."
    - name: "jcode-selfdev-types"
      version: "workspace 0.1.0"
      purpose: "Own additive dependency-light identity and receipt contracts reused by app-core and build-support."
  storage: "Additive JSON request/execution/subscriber state under the existing JCODE_HOME selfdev-build-requests boundary, bounded by current terminal history archival; rust-actions remain append-only JSONL under JCODE_HOME/logs."
  testing:
    framework: "Rust built-in test harness with Tokio tests, focused shell/Python receipt fixtures where needed, isolated Jcode runtime smoke, and repository guardrails"
    approach: "Write failing identity, eligibility, near-miss, concurrent attachment, reuse, supersession, cancellation, recovery, activation, receipt, and redaction tests first; implement the minimum queue changes; run exact jcode-app-core and jcode-build-support tests before relevant builds, scripts/dev_cargo.sh receipt tests, scripts/check_guardrails.sh, and private-socket built-binary multi-session scenarios."
  target_platform: "Linux and macOS as primary self-development hosts, with existing Windows-compatible persisted contracts and lock fallback preserved"
  project_type: "cli"
  performance_goals: "Exactly one Cargo execution for every overlapping exact eligible identity group; zero execution for requests superseded before gate acquisition; 100% of active subscribers receive one truthful terminal result; duplicate-group latency is no worse than baseline single-execution latency plus measurement tolerance; all maintained jcode-l89.1 runtime budgets remain within their documented gates or same-environment tolerances."
  constraints:
    - "The existing crates/jcode-app-core selfdev queue remains the sole runtime authority; no second daemon, client-owned queue, or parallel execution path."
    - "Preserve build, build-reload, test, status, follow-existing-build, cancel-build, progress, reload, failure, activation, reconnection, and global Cargo-gate behavior outside exact duplicate handling."
    - "Persisted fields and public metadata evolve additively with serde defaults so old request JSON remains readable."
    - "Identity equality requires the same identity version and every repository/worktree, source, Cargo.lock, toolchain, action, profile, feature, package/target, relevant-environment, and normalized-argument component."
    - "Only syntactically understood single Cargo build, test, or check requests are eligible; opaque or compound shell commands retain existing execution behavior but do not coalesce or reuse."
    - "Argument normalization is allowlisted and semantics-preserving; unknown ordering or spelling distinctions remain distinct."
    - "Queued identity is recomputed immediately before selfdev lock and Cargo-gate competition; drift produces an explicit superseded terminal result and never signals unrelated active work."
    - "Reuse requires an exact successful identity, complete receipt, no cancellation or supersession, and any required produced artifact still resolving to the recorded source identity."
    - "Receipts and logs expose only approved names, enums, durations, exit status, counts, and redacted fingerprints, never raw source, dirty diffs, paths, arguments containing values, or sensitive environment values."
    - "Use TDD, surgical changes, serialized Cargo-heavy validation, the stable Rust toolchain, and the canonical repository guardrails."
    - "Runtime checks must use a newly built binary on a unique isolated socket and confirm the resolved executable rather than measuring the shared daemon."
  scale_scope: "One long-lived server queue serving multiple local sessions, tens of queued or historical requests, one shared Cargo execution per exact identity, and a small subscriber set per execution; no distributed scheduler or unbounded cache."

