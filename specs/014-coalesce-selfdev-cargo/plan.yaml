open_questions:
  - question: "What exact completed-result retention boundary should define 'remains safely reusable' after a server restart?"
    context: "The existing request archive keeps bounded terminal history, but the spec does not mandate a time-to-live. Test/check evidence may remain valid indefinitely while the complete identity is unchanged, whereas build reuse also requires the recorded artifact to remain installed and source-matched."
    proposed_resolution: "Use identity and evidence validity rather than a new time setting: allow reuse while the successful terminal record remains in active bounded history, its rust-action receipt is complete, and any required artifact exists and matches the identity. Archived or incomplete records are not lookup candidates. Add no TTL configuration unless implementation evidence shows the bounded history contract is insufficient."
  - question: "Which environment variables are behavior-relevant identity inputs for the first identity schema version?"
    context: "Including every variable would create unstable identities and risk sensitive provenance, while omitting linker, feature, target, wrapper, or remote-execution policy could incorrectly share results."
    proposed_resolution: "Derive a reviewed allowlist from scripts/dev_cargo.sh and Cargo's documented effective inputs, including feature/profile/target/linker/rustflags/jobs/incremental/wrapper/target-dir/remote policy names. Hash canonical effective values, expose names/presence only, add a negative sentinel fixture, and treat future allowlist changes as a new identity schema version."

