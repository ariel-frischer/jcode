implementation_phases:
  - phase: 1
    name: "Freeze comparison scope and acceptance matrix"
    goal: "Enumerate all in-scope PR1 file mentions and behaviors, separate PR2 inline previews, and capture current dev and candidate evidence before editing."
    deliverables:
      - "Revision and ancestry inventory for PR1 commit 49738a4d508c69a49aeff00928db32d07609ecc"
      - "Explicit matrix rows for file-mention defaults, picker responsiveness, compact persistence, final-dispatch expansion, input-size restoration, ignore patterns, local/remote working directories, unsafe files, and PR1 provider projection assertions"
      - "Port, preserve, reject, or no-op decision with compatibility risk and direct validation for every row"
      - "PR2 inline-preview exclusion checklist and search terms"
  - phase: 2
    name: "Validate and lock current-dev invariants"
    goal: "Run focused baseline checks and identify which candidate differences are already fixed, intentionally customized, or still actionable in dev."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Baseline focused TUI, config, app-core, compact/provider, and remote behavior results"
      - "Documented dev-only profiles, jcode run safety, remote, and architecture invariants"
      - "Evidence-backed narrowing of the candidate edit set to only compatible improvements"
  - phase: 3
    name: "Apply surgical ports and regression tests"
    goal: "Implement only positive matrix dispositions in existing owners, preserving current dev behavior everywhere else."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Minimal source/test edits mapped to positive matrix rows"
      - "Focused tests for each selected port and preserved behavior"
      - "No PR2 inline-preview source, dependency, or behavior introduced"
      - "Updated active documentation only where implemented behavior actually changes"
  - phase: 4
    name: "Run integration acceptance and delivery gates"
    goal: "Prove the superset-preserving integration, scope exclusion, runtime behavior, and repository policy compliance."
    dependencies:
      - "Phase 3"
    deliverables:
      - "All targeted acceptance checks for defaults, picker, compact/provider projection, dispatch expansion, input restoration, ignores, local/remote paths, and unsafe files passing"
      - "Relevant TUI build passing, with the PR1 rewind/provider projection assertions included"
      - "PR2 exclusion scan and changed-file justification review passing"
      - "scripts/check_guardrails.sh passing or any pre-existing unrelated failure isolated and recorded"
      - "Isolated-socket runtime check using the resolved newly built binary, without touching the shared daemon"
      - "Final diff, status, and commit evidence showing a surgical integration on the dedicated worktree"

open_questions:
  - question: "Which PR1 ancestry rows are still behaviorally superior after current dev and adjacent Beads have landed?"
    context: "The specified PR1 tip is a focused test commit, while the accepted scope names earlier file-mention, compact, config, and remote changes that may already be superseded in dev."
    proposed_resolution: "Resolve during Phase 1 and Phase 2 by comparing exact source/test behavior and running baseline checks; preserve or reject when evidence is insufficient."
  - question: "Does any overlapping file contain PR2 inline-preview behavior that must be split from a PR1 candidate change?"
    context: "The two features may touch common TUI or file-handling surfaces, but ownership and scope are explicitly separate."
    proposed_resolution: "Mark PR2-only hunks as excluded in the matrix and verify with changed-file review plus targeted repository searches before acceptance."

