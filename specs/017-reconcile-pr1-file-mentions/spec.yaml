feature:
  branch: "017-reconcile-pr1-file-mentions"
  created: "2026-08-25"
  status: "Draft"
  input: "Reconcile fork PR 1 file mentions at 49738a4d508c69a49aeaff00928db32d07609ecc into current dev as a superset-preserving integration. Compare PR and dev behavior first. Preserve current dev architecture and custom features. Exclude PR 2 inline previews. Produce an explicit behavior matrix and plan surgical ports only where PR 1 is demonstrably better. Acceptance is defined in Bead jcode-5kb and the 2026-08-25 alignment comment."

user_stories:
  - id: "US-001"
    title: "Reconcile PR 1 file mentions safely"
    priority: "P1"
    as_a: "maintainer of the custom dev branch"
    i_want: "a behavior-first comparison of PR 1 with current dev and only the demonstrably superior PR 1 changes ported"
    so_that: "the integrated branch gains useful fixes without regressing current architecture or custom features"
    why_this_priority: "The integration must preserve existing behavior while addressing the accepted PR 1 scope."
    independent_test: "Review the behavior matrix and run targeted tests for every selected port and preserved behavior."
    acceptance_scenarios:
      - given: "PR 1 and current dev have differing behavior in a mentioned file"
        when: "the reconciliation analysis is performed"
        then: "the difference is recorded in an explicit behavior matrix with a disposition of port, preserve, or reject and evidence for that disposition"
      - given: "a PR 1 change is demonstrably better and compatible with current dev"
        when: "the integration is implemented"
        then: "only the minimal surgical change is ported and targeted validation passes"
      - given: "a current dev custom feature or architectural invariant is not superseded by evidence"
        when: "the reconciliation is implemented"
        then: "current dev behavior and architecture remain unchanged"
      - given: "PR 2 contains inline preview behavior"
        when: "the reconciliation scope is applied"
        then: "inline previews are excluded from analysis decisions and implementation"

requirements:
  functional:
    - id: "FR-001"
      description: "MUST compare the behavior of each PR 1 file mention at commit 49738a4d508c69a49aeaff00928db32d07609ecc against the corresponding current dev behavior before editing code."
      acceptance_criteria: "An explicit matrix lists each relevant file or behavior, PR 1 behavior, dev behavior, compatibility or regression risk, evidence, and disposition."
    - id: "FR-002"
      description: "MUST preserve current dev architecture, custom features, and behavior unless a narrowly scoped PR 1 change is proven superior and compatible."
      acceptance_criteria: "Existing architecture and custom-feature tests remain passing, and each changed behavior has a documented reason tied to comparison evidence."
    - id: "FR-003"
      description: "MUST port only surgical PR 1 changes that are demonstrably better than current dev."
      acceptance_criteria: "The diff contains no unrelated PR 1 changes, and every port maps to a matrix row with a positive disposition and targeted test evidence."
    - id: "FR-004"
      description: "MUST explicitly classify unchanged or rejected PR 1 differences so that the integration is superset-preserving rather than a wholesale replacement."
      acceptance_criteria: "The matrix records preserve and reject decisions, including the reason and any known tradeoff, for all examined differences."
    - id: "FR-005"
      description: "MUST exclude PR 2 inline previews from the integration."
      acceptance_criteria: "No inline preview implementation, dependency, or behavior is introduced from PR 2, and scope validation confirms its absence."
    - id: "FR-006"
      description: "MUST validate the resulting integration using the acceptance defined by Bead jcode-5kb and the 2026-08-25 alignment comment."
      acceptance_criteria: "The implementation records the applicable Bead and alignment acceptance checks and all required checks pass before completion."
    - id: "FR-007"
      description: "SHOULD document the final port, preserve, and reject decisions in a reviewable plan before implementation."
      acceptance_criteria: "A concise plan identifies the selected files, intended surgical edits, preserved areas, excluded PR 2 scope, and validation for each port."
  non_functional:
    - id: "NFR-001"
      category: "code_quality"
      description: "The integration should minimize change surface and retain existing project conventions."
      measurable_target: "Every changed file is directly justified by a behavior-matrix row, with no unrelated formatting or refactoring."
    - id: "NFR-002"
      category: "reliability"
      description: "The reconciliation must not regress established current dev behavior."
      measurable_target: "All targeted acceptance checks and the relevant existing regression suite pass with zero new failures."

success_criteria:
  - id: "SC-001"
    description: "All in-scope PR 1 file mentions have an evidence-backed disposition."
    metric: "Count of in-scope matrix rows with behavior comparison, evidence, and disposition."
    target: "100%"
  - id: "SC-002"
    description: "Selected PR 1 improvements are available without loss of current dev custom behavior."
    metric: "Targeted port checks and current-dev regression checks."
    target: "100% pass, with zero unexplained regressions"
  - id: "SC-003"
    description: "Excluded PR 2 inline previews do not enter the integrated behavior."
    metric: "Scope review and targeted search or test for inline preview artifacts."
    target: "Zero PR 2 inline preview changes"
  - id: "SC-004"
    description: "The final change is reviewable as a surgical integration."
    metric: "Changed files with direct matrix justification."
    target: "100% justified"

key_entities:
  - name: "PR 1 file mention"
    description: "A file or behavior identified as relevant to fork PR 1 at the specified commit."
    attributes:
      - "path or behavior identifier"
      - "PR 1 behavior"
      - "current dev behavior"
      - "evidence"
      - "disposition"
  - name: "Behavior matrix"
    description: "The comparison record used to decide which differences to port, preserve, or reject."
    attributes:
      - "comparison scope"
      - "compatibility risk"
      - "selected validation"
      - "final decision"

edge_cases:
  - scenario: "A PR 1 file mention has no meaningful behavioral difference from current dev."
    expected_behavior: "Record preserve or no-op with evidence and do not modify the file."
  - scenario: "PR 1 improves one path but conflicts with a current dev custom feature in another path."
    expected_behavior: "Retain current dev behavior unless the change can be split surgically without regression; otherwise reject the port and document why."
  - scenario: "A referenced file overlaps with PR 2 inline preview changes."
    expected_behavior: "Separate the PR 1-relevant behavior from PR 2 preview behavior and exclude the preview portion."
  - scenario: "Evidence is insufficient to establish that PR 1 is better."
    expected_behavior: "Preserve current dev and record the unresolved comparison rather than speculatively porting."

assumptions:
  - "Current dev is the authoritative integration baseline and must remain the active architectural direction."
  - "The specified PR 1 commit is available for read-only comparison without changing the integration baseline."
  - "Bead jcode-5kb and the 2026-08-25 alignment comment provide the authoritative acceptance details."
  - "Existing project tests and targeted behavior checks are the preferred evidence for regression and superiority decisions."

constraints:
  - "Do not introduce PR 2 inline previews."
  - "Do not replace current dev wholesale with the fork PR."
  - "Keep changes surgical and directly justified by the behavior matrix."
  - "Preserve current dev architecture and custom features."

out_of_scope:
  - "PR 2 inline preview implementation or related behavior."
  - "Unrelated fork PR changes not represented in PR 1 file mentions."
  - "Broad refactors, architecture replacement, or speculative cleanup."
  - "Changes that cannot be demonstrated to improve behavior over current dev."

