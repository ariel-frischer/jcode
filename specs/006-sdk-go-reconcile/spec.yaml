feature:
    branch: "006-sdk-go-reconcile"
    created: "2026-08-11"
    status: "Completed"
    completed_at: 2026-08-11T08:48:57Z
    input: "Reconcile canonical sdk/go with /home/ari/repos/jcode-go main. Inventory and classify every source, test, example, documentation, and governance divergence. Treat the public module lifecycle, observability, private-runtime, terminal turn outcome, protocol v1, process safety, ToolExec, and ReasoningDone behavior as authoritative unless repository architecture proves otherwise. Bring all authoritative public code/tests/examples into canonical sdk/go without deleting public-only repository governance, specs, or docs. Add a deterministic scripts/sync-jcode-go.sh dry-run/apply workflow with explicit repository-specific exclusions, add or restore scripts/validate_go_sdk.sh for formatting, module, vet, build, tests, race, and Windows compile boundary, update canonical SDK publication docs, and leave public jcode-go untouched. Validate canonical SDK and produce a dry-run where only intentional public repository governance/docs remain."
user_stories:
    - id: "US-001"
      title: "Understand every SDK divergence"
      priority: "P1"
      as_a: "Jcode SDK maintainer"
      i_want: "every source, test, example, documentation, and governance difference classified by authority and purpose"
      so_that: "I can reconcile the canonical SDK without losing intentional work or preserving accidental drift"
      why_this_priority: "A complete inventory is the safety basis for every reconciliation and exclusion decision."
      independent_test: "Compare the inventory with a complete recursive comparison of both SDK trees and verify that every reported path has a classification."
      acceptance_scenarios:
        - given: "the canonical and public SDK trees contain divergent files"
          when: "the reconciliation inventory is reviewed"
          then: "every divergent path is present and classified as authoritative SDK content, intentional repository-specific content, or obsolete drift"
        - given: "a divergence affects an established public behavior"
          when: "authority is assigned"
          then: "the classification preserves the public behavior unless current repository architecture provides contrary evidence"
    - id: "US-002"
      title: "Use the complete canonical SDK contract"
      priority: "P0"
      as_a: "Go SDK consumer"
      i_want: "the canonical SDK to include the authoritative public lifecycle, event, runtime, and safety behavior"
      so_that: "applications receive compatible and complete behavior from the source that owns SDK publication"
      why_this_priority: "Missing public behavior in the canonical source makes future publication unsafe and can regress consumers."
      independent_test: "Exercise the canonical SDK's focused tests and examples for module lifecycle, observability, private runtime, terminal turn outcomes, protocol v1, process safety, ToolExec, and ReasoningDone."
      acceptance_scenarios:
        - given: "authoritative code, tests, or examples exist only in the public SDK"
          when: "reconciliation completes"
          then: "equivalent authoritative content exists in the canonical SDK and its observable behavior remains compatible"
        - given: "an unknown or terminal event is received"
          when: "the canonical SDK processes the event"
          then: "it follows the established public compatibility and terminal-outcome contract"
    - id: "US-003"
      title: "Preview and apply deterministic publication sync"
      priority: "P1"
      as_a: "Jcode SDK publisher"
      i_want: "a deterministic synchronization workflow with safe preview and explicit apply modes"
      so_that: "I can publish canonical SDK content without deleting public-repository governance, specifications, or documentation"
      why_this_priority: "A repeatable publication boundary prevents the same unsafe whole-tree synchronization from recurring."
      independent_test: "Run the workflow twice in preview mode against unchanged trees, compare the reports, confirm neither tree changes, and verify only intentional repository-specific paths remain after reconciliation."
      acceptance_scenarios:
        - given: "the public repository contains protected repository-specific content"
          when: "synchronization is previewed or applied"
          then: "the protected content is explicitly excluded and is not proposed for deletion or replacement"
        - given: "preview mode is selected"
          when: "the synchronization workflow runs"
          then: "it reports the exact proposed changes deterministically and does not modify either repository"
        - given: "apply mode is explicitly selected"
          when: "the synchronization workflow runs against an eligible destination"
          then: "it applies only canonical publishable SDK content while retaining every documented exclusion"
    - id: "US-004"
      title: "Validate and document SDK publication readiness"
      priority: "P1"
      as_a: "Jcode maintainer"
      i_want: "one complete canonical SDK validation contract and current publication guidance"
      so_that: "I can determine whether an SDK revision is safe to publish across supported boundaries"
      why_this_priority: "Publication confidence requires reproducible evidence and accurate operator guidance."
      independent_test: "Run the canonical validation entry point and follow the publication documentation from a clean checkout, verifying every required check is represented and succeeds."
      acceptance_scenarios:
        - given: "the canonical SDK is ready for validation"
          when: "the validation contract runs"
          then: "formatting, module consistency, vetting, build, tests, race detection, and the Windows compile boundary all pass or fail visibly"
        - given: "a maintainer prepares an SDK publication"
          when: "they consult canonical documentation"
          then: "the documented source of truth, exclusions, preview, apply, validation, and public-repository preservation rules match the actual workflow"
requirements:
    functional:
        - id: "FR-001"
          description: "The reconciliation MUST inventory every path-level divergence between the canonical and public SDK trees across source, tests, examples, documentation, and governance content."
          acceptance_criteria: "A fresh recursive comparison yields no divergent path absent from the inventory."
        - id: "FR-002"
          description: "Each inventoried divergence MUST identify its content category, authoritative owner, reconciliation disposition, and rationale."
          acceptance_criteria: "Every inventory entry contains all four classifications and reviewers can trace the disposition to current behavior, architecture, or an intentional repository boundary."
        - id: "FR-003"
          description: "The canonical SDK MUST preserve the established public module lifecycle, observability, private-runtime, terminal turn outcome, protocol v1, process safety, ToolExec, and ReasoningDone contracts unless repository architecture demonstrates a conflicting canonical contract."
          acceptance_criteria: "Focused canonical tests cover each named contract, and any exception cites concrete current architecture evidence and an explicit disposition."
        - id: "FR-004"
          description: "All public code, tests, and examples classified as authoritative MUST be represented in the canonical SDK without removing compatible canonical behavior."
          acceptance_criteria: "The final comparison and inventory show no authoritative public code, test, or example remaining only in the public repository."
        - id: "FR-005"
          description: "The reconciliation MUST retain public-only repository governance, specifications, and documentation as intentional public-repository content rather than treating them as canonical SDK payload."
          acceptance_criteria: "The final preview lists protected public-only content as intentional exclusions and never as deletion or overwrite candidates."
        - id: "FR-006"
          description: "The synchronization workflow MUST define explicit repository-specific inclusion and exclusion rules for the canonical and public repository layouts."
          acceptance_criteria: "Each non-payload path visible in a full comparison is covered by a named rule whose purpose is documented and testable."
        - id: "FR-007"
          description: "The synchronization workflow MUST provide a preview mode that reports the exact proposed publication changes without mutating either repository."
          acceptance_criteria: "Checksums and repository status are unchanged before and after preview mode, and the report identifies additions, updates, retained exclusions, and proposed removals."
        - id: "FR-008"
          description: "The synchronization workflow MUST require an explicit apply choice before changing a destination and MUST apply the same change set previously represented by preview under unchanged inputs."
          acceptance_criteria: "Default or preview invocation performs no writes; explicit apply on a controlled copy produces content matching the preview and preserves exclusions."
        - id: "FR-009"
          description: "Repeated preview runs over unchanged inputs MUST produce the same ordered reconciliation result."
          acceptance_criteria: "Two consecutive preview reports are byte-for-byte identical after excluding any explicitly documented invocation timestamp."
        - id: "FR-010"
          description: "The canonical SDK validation contract MUST check formatting, module consistency, vetting, buildability, automated tests, race behavior, and the Windows compile boundary."
          acceptance_criteria: "A single documented validation entry point runs every named check and returns failure when any check fails."
        - id: "FR-011"
          description: "Validation failures MUST identify the failed boundary and return a non-successful result without concealing later or earlier failures."
          acceptance_criteria: "A controlled failure for each validation category produces a visible category-specific failure and a non-zero result."
        - id: "FR-012"
          description: "Canonical SDK publication documentation MUST identify the canonical source, public destination, protected public-only content, preview and apply workflow, full validation requirement, and publication verification expectations."
          acceptance_criteria: "A documentation review finds each required topic and all referenced commands and paths agree with the delivered workflow."
        - id: "FR-013"
          description: "This reconciliation MUST NOT modify the public jcode-go working tree or its main branch."
          acceptance_criteria: "The public repository's branch, status, tracked-file checksums, and commit remain unchanged from the recorded pre-reconciliation state."
        - id: "FR-014"
          description: "After canonical reconciliation, a publication preview MUST report only intentional public repository governance, specification, documentation, and other explicitly classified repository-specific differences."
          acceptance_criteria: "The final preview contains no unclassified source, test, example, module, or behavioral divergence."
        - id: "FR-015"
          description: "The reconciliation MUST preserve backward compatibility for existing public imports, event decoding, lifecycle outcomes, runtime controls, and process-safety behavior."
          acceptance_criteria: "Existing public behavior tests and newly reconciled canonical tests pass without requiring consumer changes."
    non_functional:
        - id: "NFR-001"
          category: "reliability"
          description: "Synchronization results must be reproducible for identical repository states."
          measurable_target: "100% identical ordered preview results across two consecutive runs with unchanged inputs."
        - id: "NFR-002"
          category: "security"
          description: "The workflow must fail safely when repository identity, source availability, destination eligibility, or requested mode is invalid."
          measurable_target: "Every tested invalid precondition produces no file mutation and a non-successful result with an actionable explanation."
        - id: "NFR-003"
          category: "code_quality"
          description: "Every behavioral requirement must have direct automated evidence or an explicit reviewable artifact check."
          measurable_target: "100% of functional requirements map to at least one recorded validation check."
        - id: "NFR-004"
          category: "usability"
          description: "A maintainer must be able to determine publication readiness through one documented workflow."
          measurable_target: "The complete preview and validation workflow requires no undocumented decisions or commands."
success_criteria:
    measurable_outcomes:
        - id: "SC-001"
          description: "Maintainers can account for every difference between the canonical and public SDK repositories."
          metric: "Share of divergent paths with a complete classification"
          target: "100%"
        - id: "SC-002"
          description: "SDK consumers retain every established authoritative lifecycle, observability, runtime, event, and process-safety behavior after reconciliation."
          metric: "Authoritative behavioral acceptance scenarios passing in the canonical SDK"
          target: "100%"
        - id: "SC-003"
          description: "Maintainers receive a stable and non-mutating publication preview for unchanged repository states."
          metric: "Preview reproducibility and mutation count"
          target: "Two identical consecutive previews and zero mutated files"
        - id: "SC-004"
          description: "The canonical SDK is demonstrably ready for supported publication boundaries."
          metric: "Required validation categories passing"
          target: "7 of 7 categories pass: formatting, module consistency, vetting, build, tests, race behavior, and Windows compilation"
        - id: "SC-005"
          description: "The final publication preview contains no accidental SDK drift."
          metric: "Unclassified or non-intentional differences remaining after reconciliation"
          target: "0"
key_entities:
    - name: "Divergence Record"
      description: "A classified difference between the canonical and public SDK repositories."
      attributes:
        - "repository-relative path"
        - "content category"
        - "authoritative owner"
        - "reconciliation disposition"
        - "evidence and rationale"
    - name: "Synchronization Rule"
      description: "A declared publication treatment for a repository path or content class."
      attributes:
        - "source scope"
        - "destination scope"
        - "include or exclude decision"
        - "repository-specific purpose"
        - "preview and apply behavior"
    - name: "Validation Result"
      description: "Evidence that a canonical SDK publication boundary satisfies a required quality check."
      attributes:
        - "validation category"
        - "outcome"
        - "failure explanation"
        - "repository state"
edge_cases:
    - scenario: "A path exists on both sides but differs only because one repository owns governance or publication metadata."
      expected_behavior: "The divergence is classified and excluded explicitly rather than copied or deleted to force byte identity."
    - scenario: "Public behavior conflicts with current canonical repository architecture."
      expected_behavior: "The conflict is documented with concrete architecture evidence, compatibility impact, and an explicit authoritative disposition before reconciliation."
    - scenario: "The public repository contains uncommitted changes or is not on the expected main branch."
      expected_behavior: "Preview may report the ineligible state, but apply refuses to mutate it and explains how to restore eligibility."
    - scenario: "The source changes between preview and apply."
      expected_behavior: "Apply refuses to claim equivalence with the stale preview and requires a new preview of the changed inputs."
    - scenario: "A protected public-only file shares a name with canonical SDK documentation."
      expected_behavior: "The explicit repository-specific rule determines ownership, and the workflow does not overwrite the protected public file."
    - scenario: "A validation tool or supported compile boundary is unavailable."
      expected_behavior: "Validation fails visibly or records the boundary as unverified; it never reports complete publication readiness."
assumptions:
    - "The current public main branch is the comparison baseline and reflects intentionally published SDK behavior."
    - "The existing public behavior named in the feature description is authoritative unless current canonical architecture supplies specific contrary evidence."
    - "Repository-specific governance, specifications, and documentation are intentionally retained only in the public repository and need not be copied into the canonical SDK."
    - "The delivered apply capability will be verified on a controlled copy or equivalent safe fixture; the live public repository remains untouched during this reconciliation."
    - "Existing compatible canonical-only behavior remains in scope and is not removed merely to match the public repository."
constraints:
    - "The canonical sdk/go tree is the publication source of truth after reconciliation."
    - "The public repository at /home/ari/repos/jcode-go must remain untouched throughout this work."
    - "Public import paths, wire behavior, lifecycle semantics, and process-safety guarantees remain backward compatible."
    - "Public-only governance, specifications, and documentation must not be deleted or overwritten by synchronization."
    - "Validation must be local and non-production-adjacent."
out_of_scope:
    - "Publishing or pushing changes to the public jcode-go repository."
    - "Deleting or consolidating public-only governance, specifications, or documentation."
    - "Changing providers, models, or unrelated Jcode runtime behavior."
    - "Introducing new SDK capabilities unrelated to resolving the inventoried divergence."
    - "Broad refactoring of canonical or public SDK code beyond what authoritative behavior requires."
