research_findings:
  decisions:
    - topic: "Behavior and wire authority"
      decision: "Treat public jcode-go main as authoritative for established Go lifecycle, observability, private-runtime, terminal-outcome, process-safety, ToolExec, ReasoningDone, test, and example behavior, while checking every wire-facing value against crates/jcode-harness-api and existing parity tests."
      rationale: "The public tree contains the newer Turn API, typed terminal outcomes, bounded Linux supervision, redacted observations, acceptance tests, and updated examples, while the constitution assigns serialized protocol ownership to the Rust harness boundary."
      alternatives_considered:
        - "Replace public behavior with the older canonical SDK, which would regress consumers."
        - "Treat the public SDK as the wire owner, which would duplicate the server contract."
    - topic: "Repository-specific content"
      decision: "Publish SDK payload files such as Go source, tests, examples, module files, license, and root SDK README; protect public-only governance, Autospec/Beads state, specs, worktrees, and repository documentation through named exclusion rules."
      rationale: "A whole-tree mirror would delete intentional public repository history and governance, but excluding the entire README/docs category would also preserve stale consumer guidance."
      alternatives_considered:
        - "Force byte identity across repository roots."
        - "Exclude all documentation, including the publishable SDK README."
    - topic: "Preview and apply equivalence"
      decision: "Preview emits a versioned, timestamp-free manifest with ordered rules and operations plus source and destination content fingerprints; apply requires that manifest, recomputes both fingerprints, and refuses stale or malformed input."
      rationale: "The specification requires apply to match a previously reviewed preview and explicitly requires rejection when either input changes. A fresh dry run at apply time cannot prove that contract."
      alternatives_considered:
        - "Run the same copy command with and without --dry-run, which does not bind apply to the reviewed result."
        - "Use an interactive confirmation without persisted fingerprints, which cannot detect stale previews."
    - topic: "Synchronization implementation"
      decision: "Implement scripts/sync-jcode-go.sh with Bash, Git, sorted path traversal, portable content hashing, and explicit file operations; do not depend on rsync."
      rationale: "The required entry point is a shell script, repository scripts already use this pattern, rsync is absent locally, and direct manifest execution makes each removal reviewable and stale-safe."
      alternatives_considered:
        - "Add rsync as a system dependency."
        - "Add a general-purpose Go synchronization application for this single publication boundary."
    - topic: "Validation contract"
      decision: "Replace the stale validator with seven named, non-mutating categories: formatting, module consistency using go mod tidy -diff plus go mod verify, vet, build, tests, race tests, and Windows amd64 build. Run all categories and emit a final pass/fail summary."
      rationale: "Go 1.23 supports non-mutating go mod tidy -diff, the CI workflow already defines the same platform boundary, and aggregated results satisfy the requirement that one failure not conceal other boundaries."
      alternatives_considered:
        - "Keep go mod tidy in place and merely warn about changes."
        - "Fail on the first category and leave later readiness boundaries unknown."
    - topic: "Public repository mutation safety"
      decision: "Record public branch, status, commit, and tracked-content fingerprint before reconciliation; exercise apply only against temporary fixture repositories; repeat the public checks after all validation."
      rationale: "The public main working tree is an explicit protected boundary and no live/costly/external action is needed to prove the workflow."
      alternatives_considered:
        - "Apply to public main and revert afterward."
        - "Rely only on git status without content fingerprints."

data_model:
  entities:
    - name: "Divergence Record"
      description: "One path-level difference between canonical sdk/go and public jcode-go, retained as the reviewed reconciliation inventory."
      fields:
        - name: "path"
          type: "repository-relative path"
          description: "Identifies the divergent file or directory entry."
          constraints: "Unique, normalized, and complete against a fresh recursive comparison."
        - name: "category"
          type: "enum"
          description: "Classifies source, test, example, module, documentation, or governance content."
          constraints: "Must use one documented category."
        - name: "authority"
          type: "enum"
          description: "Names canonical, public, shared, or repository-specific ownership."
          constraints: "Wire-facing authority must cite the canonical harness contract."
        - name: "disposition"
          type: "enum"
          description: "Records import, retain-canonical, protect-public, merge, or remove-obsolete treatment."
          constraints: "Must map to a synchronization rule or an explicit one-time reconciliation action."
        - name: "rationale"
          type: "string"
          description: "Explains the behavioral, architectural, or repository-boundary evidence."
          constraints: "Non-empty and reviewable."
      relationships:
        - target: "Synchronization Rule"
          type: "many-to-one"
          description: "Each recurring publication disposition is enforced by one declared rule."
    - name: "Synchronization Rule"
      description: "A named include or protect rule governing one publication path class."
      fields:
        - name: "name"
          type: "string"
          description: "Stable rule identifier printed in preview output."
          constraints: "Unique and deterministic."
        - name: "path_scope"
          type: "path pattern"
          description: "Canonical or destination-relative paths covered by the rule."
          constraints: "Explicit; no implicit catch-all may delete protected content."
        - name: "treatment"
          type: "include | protect"
          description: "Declares whether content is synchronized or retained destination-only."
          constraints: "Protected paths are never add, update, or remove operations."
        - name: "reason"
          type: "string"
          description: "Documents the repository-specific purpose."
          constraints: "Non-empty and included in the manifest."
      relationships:
        - target: "Preview Manifest"
          type: "many-to-many"
          description: "Every manifest records the complete ordered rule set used to derive operations."
    - name: "Preview Manifest"
      description: "The deterministic reviewed change set that binds preview to apply."
      fields:
        - name: "format_version"
          type: "integer"
          description: "Allows strict parsing and future incompatible changes."
          constraints: "Initially 1; unsupported versions fail closed."
        - name: "source_fingerprint"
          type: "digest"
          description: "Fingerprint of publishable canonical content and modes."
          constraints: "Recomputed immediately before apply."
        - name: "destination_fingerprint"
          type: "digest"
          description: "Fingerprint of destination payload and protected-boundary state."
          constraints: "Recomputed immediately before apply."
        - name: "operations"
          type: "ordered list"
          description: "Exact add, update, remove, and retained-exclusion records."
          constraints: "C-locale path order, no timestamps, duplicates, unsafe paths, tabs, or newlines."
      relationships:
        - target: "Divergence Record"
          type: "one-to-many"
          description: "Manifest operations are the executable projection of the reviewed classifications."
    - name: "Validation Result"
      description: "One category outcome from the canonical SDK validation run."
      fields:
        - name: "category"
          type: "enum"
          description: "Formatting, module consistency, vet, build, tests, race, or Windows compile."
          constraints: "Exactly seven categories are reported."
        - name: "status"
          type: "pass | fail"
          description: "Machine-visible result for the category."
          constraints: "Any failure makes the entry point exit non-zero."
        - name: "diagnostic"
          type: "string"
          description: "Bounded category-specific failure information."
          constraints: "Must not expose credentials, prompts, or private runtime data."
      relationships: []

