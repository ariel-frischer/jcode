implementation_phases:
  - phase: 1
    name: "Inventory and authority ledger"
    goal: "Account for every current canonical/public difference and fix the publication boundary before copying content."
    deliverables:
      - "Recorded public main branch, clean status, commit, and tracked-content fingerprint baseline"
      - "Complete divergence inventory with category, authority, disposition, rationale, and architecture evidence"
      - "Reviewed publishable path set and explicit protected destination rules"
  - phase: 2
    name: "Canonical behavior reconciliation"
    goal: "Bring all authoritative public SDK behavior into sdk/go without removing compatible canonical contracts."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Turn lifecycle, terminal outcomes, observability, private-runtime, bounded process shutdown, ToolExec, and ReasoningDone behavior in canonical source"
      - "Authoritative public tests and examples reconciled into canonical locations"
      - "Focused Go and race tests proving public API and protocol v1 compatibility"
  - phase: 3
    name: "Deterministic publication workflow"
    goal: "Create a non-mutating preview and stale-safe explicit apply contract with protected public content."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Versioned ordered preview manifest with source/destination fingerprints and exact operations"
      - "Explicit apply mode that consumes the manifest and rejects changed, dirty, ineligible, or unsafe inputs"
      - "Fixture coverage for reproducibility, exclusions, invalid preconditions, stale inputs, and exact controlled-copy apply"
  - phase: 4
    name: "Canonical validation and publication documentation"
    goal: "Make publication readiness one non-mutating command and align all operator guidance with the delivered boundary."
    dependencies:
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "Seven-category aggregate Go SDK validator using go mod tidy -diff and visible category summaries"
      - "Validation failure fixture coverage and CI reuse of the canonical entry point"
      - "Updated SDK, architecture, release, preview/apply, exclusion, and verification documentation"
  - phase: 5
    name: "Reconciliation proof and delivery gates"
    goal: "Prove canonical readiness, intentional-only residual drift, and zero mutation of public jcode-go."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Two byte-identical final previews containing no unclassified source, test, example, module, or behavior drift"
      - "Complete scripts/validate_go_sdk.sh result with all 7 categories passing"
      - "Repository guardrail result and before/after public branch, status, commit, and content-fingerprint equality evidence"

