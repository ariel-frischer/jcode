plan:
  branch: "agent/jcode-5rv-sdk-reconcile"
  created: "2026-08-11"
  spec_path: "specs/006-sdk-go-reconcile/spec.yaml"

summary: |
  Reconcile the public jcode-go module into the canonical sdk/go source in two
  deliberately separate steps. First, classify every current divergence and
  bring authoritative public lifecycle, observability, private-runtime, turn,
  process-safety, event, test, and example behavior into sdk/go while retaining
  compatible canonical behavior. The Rust harness API remains the wire-contract
  owner; public Go behavior is authoritative only within that boundary.

  Then establish a repeatable publication boundary. A dependency-free Bash/Git
  workflow will produce an ordered manifest containing explicit inclusion and
  protection rules, content fingerprints, and exact add/update/remove actions.
  Apply must consume that reviewed manifest and reject changed inputs. The public
  repository will not be mutated during this feature: apply coverage uses a
  controlled fixture. A non-mutating validation entry point will aggregate the
  seven required Go checks and canonical documentation will describe the same
  preview, apply, validation, and verification contract.

technical_context:
  language: "Go 1.23 module with Bash publication tooling"
  framework: "None"
  primary_dependencies:
    - name: "Go toolchain"
      version: "1.23.x and 1.24.x supported matrix"
      purpose: "Builds, vets, tests, race-tests, verifies, tidies, and cross-compiles the dependency-free SDK."
    - name: "Go standard library"
      version: "Go 1.23"
      purpose: "Implements the SDK protocol client, lifecycle, process supervision, and tests without third-party modules."
    - name: "Bash"
      version: "3.2+"
      purpose: "Hosts the required sync and validation entry points using repository script conventions."
    - name: "Git CLI"
      version: "2.x"
      purpose: "Validates repository identity and eligibility and fingerprints tracked repository state."
  storage: "Canonical and destination working-tree files plus a deterministic, reviewable sync manifest; no database"
  testing:
    framework: "Go testing package and repository-local Bash fixture scripts"
    approach: "Run focused Go unit/race tests for reconciled contracts, fixture tests for preview/apply and validation failures, then the complete canonical Go SDK validator and repository guardrails"
  target_platform: "Linux and macOS SDK/runtime support, with a Windows amd64 compile-only boundary"
  project_type: "library"
  performance_goals: "Two previews over unchanged inputs are byte-identical, preview mutates zero files, apply performs exactly the reviewed operations, and all 7 validation categories pass"
  constraints:
    - "sdk/go remains the canonical publication source and crates/jcode-harness-api remains the wire-contract authority."
    - "The public repository at /home/ari/repos/jcode-go must remain on main, clean, and byte-for-byte untouched throughout this feature."
    - "Public imports, protocol v1 decoding, lifecycle outcomes, runtime controls, and process-safety behavior remain backward compatible."
    - "Public-only .autospec, .beads, .worktrees, governance, specs, and repository documentation are protected by explicit destination rules."
    - "Default and preview sync modes are read-only; apply requires an explicit reviewed manifest and unchanged source and destination fingerprints."
    - "Apply validation uses only controlled temporary copies, never the live public repository."
    - "Validation is local and non-production-adjacent; the optional real OAuth smoke is excluded."
    - "The supported Go 1.23/1.24 matrix is authoritative; the currently installed Go 1.26.3 toolchain is supplementary evidence only."
    - "No rsync dependency is introduced because it is absent locally and does not provide stale-preview replay guarantees."
  scale_scope: "One dependency-free Go module, roughly thirty current payload divergences, protected public repository metadata, two shell workflows, and focused fixture coverage"

