phases:
    - number: 1
      title: "Setup"
      purpose: "Freeze requirement ownership, safety boundaries, and direct acceptance checks before implementation"
      tasks:
        - id: "T001"
          title: "Create the typed-event acceptance and ownership matrix"
          status: "Completed"
          type: "setup"
          parallel: false
          story_id: null
          file_path: "specs/007-typed-event-compatibility/evidence.md"
          dependencies: []
          acceptance_criteria:
            - "Map FR-001 through FR-016 and NFR-001 through NFR-004 to one direct automated check or reviewed artifact check, including the exact command and owning task."
            - "Record canonical ownership for Rust wire semantics, Rust translation, canonical sdk/go behavior, and the public jcode-go projection."
            - "Record data-safety, cleanup, isolated-runtime, no-routing-change, public apply/commit/push approval, and downstream validation boundaries."
            - "Do not record event payloads, prompts, tool arguments, file contents, credentials, or other sensitive run data."
    - number: 2
      title: "Foundational"
      purpose: "Establish the evidence-handling protocol and current owned-turn inventory used by every story"
      tasks:
        - id: "T002"
          title: "Record the baseline public-event inventory and evidence protocol"
          status: "Completed"
          type: "documentation"
          parallel: false
          story_id: null
          file_path: "specs/007-typed-event-compatibility/evidence.md"
          dependencies: ["T001"]
          acceptance_criteria:
            - "Inventory every current ApiEvent wire kind with its Rust variant and current owned-turn, filtered, or outside-owned-turn behavior without yet assigning an inferred semantic class."
            - "For every existing filter, record its source location and public-contract rationale; flag any implicit or undocumented filter as uncovered."
            - "Define how authoritative run evidence is reduced to sanitized kind and concrete type identifiers while discarding payload fields and sensitive content."
            - "Record the current immutable Jcode revision and timestamp correlation needed to distinguish authoritative evidence from the connection_phase hypothesis."
    - number: 3
      title: "User Story 1 - Diagnose the rejected event safely"
      purpose: "Identify and reproduce the exact failed-run event without exposing its payload"
      story_reference: "US-001"
      independent_test: "Replay payload-free Rust and Go fixtures derived from authoritative run evidence and verify the former unsupported_typed_event result names only the exact sanitized kind and type within 256 UTF-8 bytes."
      tasks:
        - id: "T003"
          title: "Recover and record the authoritative failed-run event identity"
          status: "Completed"
          type: "documentation"
          parallel: false
          story_id: "US-001"
          file_path: "specs/007-typed-event-compatibility/evidence.md"
          dependencies: ["T002"]
          acceptance_criteria:
            - "Correlate Locus run-1c2020f67330 timestamps and immutable Jcode revision with authoritative bridge or runtime evidence and record the exact sanitized wire kind and Go concrete type."
            - "Explicitly confirm or reject the connection_phase hypothesis; do not infer the answer from repository history alone."
            - "Record only source identifiers, timestamps, revision, sanitized kind, and sanitized type; retain no raw frame or payload values."
            - "If authoritative evidence is unavailable, stop behavioral implementation and record the precise missing source rather than guessing."
        - id: "T004"
          title: "Add the payload-free Rust failed-event translation fixture"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-001"
          file_path: "crates/jcode-harness-api-server/src/translate_tests.rs"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Construct the evidence-proven event using synthetic non-sensitive fields and assert its exact protocol-v1 wire kind and publication path."
            - "Demonstrate the pre-fix compatibility gap deterministically without embedding raw Locus frames or payload content."
            - "Preserve existing ReasoningDone, ToolExec, terminal, permission, and background-event translation expectations."
        - id: "T005"
          title: "Add the payload-free Go unsupported-event regression fixture"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-001"
          file_path: "sdk/go/typed_api_test.go"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Decode the evidence-proven protocol-v1 fixture and assert the exact former unsupported_typed_event kind and concrete type outcome."
            - "Use synthetic payload values and assert that none of them appear in the error or observer output."
            - "Keep the fixture deterministic and independent of live Locus, provider credentials, or the shared Jcode daemon."
        - id: "T006"
          title: "Add bounded Rust unsupported-identity diagnostic tests"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-001"
          file_path: "crates/jcode-harness-api/src/client.rs"
          dependencies: ["T003"]
          acceptance_criteria:
            - "Cover empty, control-bearing, oversized, and malformed identifiers plus an event containing sensitive synthetic payload fields."
            - "Require a complete diagnostic of at most 256 UTF-8 bytes containing sanitized kind and type only and no payload-derived value."
            - "Require unsupported input to remain fail-closed rather than returning a generic success or ignore disposition."
        - id: "T007"
          title: "Implement bounded Rust unsupported-event identity diagnostics"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "crates/jcode-harness-api/src/client.rs"
          dependencies: ["T006"]
          acceptance_criteria:
            - "Sanitize kind and type without formatting ApiEvent values, raw frames, or event fields."
            - "Cap the complete rendered diagnostic at 256 UTF-8 bytes and preserve valid bounded identifiers."
            - "Pass T006 while preserving the established unsupported_typed_event failure code and existing client behavior."
    - number: 4
      title: "User Story 2 - Apply explicit event semantics"
      purpose: "Classify every public owned-turn event and enforce advisory-only filtering with fail-closed safety semantics"
      story_reference: "US-002"
      independent_test: "Exercise every semantic class plus repeated advisory, unknown, malformed, nil, and unclassified events; only advisory/lifecycle metadata continues with exactly one bounded warning per Turn."
      tasks:
        - id: "T008"
          title: "Add exhaustive Rust publication-contract tests"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "crates/jcode-harness-api/src/harness_api_tests/schema_snapshot.rs"
          dependencies: ["T004", "T005", "T007"]
          acceptance_criteria:
            - "Assert every ApiEvent variant has exactly one explicit publication disposition and every owned-turn variant has exactly one class."
            - "Cover content/progress, advisory/lifecycle metadata, terminal, permission, and tool-effect classes with no unknown or default class."
            - "Assert existing protocol-v1 tags and serialized fields remain unchanged."
        - id: "T009"
          title: "Add explicit translator filter and safety-class tests"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "crates/jcode-harness-api-server/src/translate_tests.rs"
          dependencies: ["T004", "T005", "T007"]
          acceptance_criteria:
            - "Assert only documented internal non-public-turn events are filtered and every filter has a reviewable rationale."
            - "Reject attempts to filter content/progress, terminal, permission, tool-effect, or another public-contract event."
            - "Preserve existing ReasoningDone continuation, ToolExec, terminal, permission, and background translation behavior."
        - id: "T010"
          title: "Add Go typed-event classification and redaction tests"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/typed_api_test.go"
          dependencies: ["T004", "T005", "T007"]
          acceptance_criteria:
            - "Require a concrete TypedEvent and exactly one EventSemanticClass for every known owned-turn kind, including the evidence-proven event."
            - "Require SemanticClassOf to return false for UnknownEvent, nil, malformed, and deliberately unclassified values."
            - "Cover empty, control-bearing, oversized, and sensitive synthetic identifiers and require payload-free diagnostics of at most 256 UTF-8 bytes."
            - "Preserve legacy Session.Events UnknownEvent kind and fields compatibility."
        - id: "T011"
          title: "Add owned-Turn semantic dispatch policy tests"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/turn_test.go"
          dependencies: ["T004", "T005", "T007"]
          acceptance_criteria:
            - "Repeated advisory/lifecycle metadata continues the Turn and emits exactly one payload-free warning of at most 256 UTF-8 bytes."
            - "Unhandled content/progress, terminal, permission, and tool-effect fixtures fail closed rather than being dropped."
            - "Unknown, malformed, nil, and unclassified fixtures terminate with TurnResultProtocolError and do not continue the Turn."
            - "Event ordering and existing bounded subscriber-overflow behavior remain unchanged."
        - id: "T012"
          title: "Add terminal and cancellation compatibility regressions"
          status: "Completed"
          type: "test"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/turn_outcome_test.go"
          dependencies: ["T004", "T005", "T007"]
          acceptance_criteria:
            - "ReasoningDone remains nonterminal and continues to a later typed terminal result."
            - "ToolExec remains a tool-effect event, and an unhandled required tool-effect fails closed."
            - "Success, provider failure, cancellation, protocol error, and bridge error retain their existing immutable terminal classifications and outcomes."
        - id: "T013"
          title: "Implement the exhaustive Rust event publication contract"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "crates/jcode-harness-api/src/events.rs"
          dependencies: ["T008"]
          acceptance_criteria:
            - "Define the closed EventSemanticClass set and EventPublicationContract returned by ApiEvent::publication_contract."
            - "Use an exhaustive variant match with no wildcard/default classification so a new ApiEvent forces review."
            - "Assign exactly one disposition and, for owned-turn events, exactly one semantic class without changing wire tags or fields."
        - id: "T014"
          title: "Implement explicit Rust translation and filter dispositions"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: "US-002"
          file_path: "crates/jcode-harness-api-server/src/translate.rs"
          dependencies: ["T009", "T013"]
          acceptance_criteria:
            - "Route translated events according to the canonical publication contract and keep filters explicit and rationale-backed."
            - "Never filter an owned-turn content/progress, terminal, permission, or tool-effect event."
            - "Pass T004 and T009 without changing established protocol-v1 or terminal ownership."
        - id: "T015"
          title: "Implement concrete Go typed events and semantic classification"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/session.go"
          dependencies: ["T010", "T013"]
          acceptance_criteria:
            - "Decode every known owned-turn kind to one concrete TypedEvent, including the evidence-proven event."
            - "Expose SemanticClassOf using explicit concrete-type handling with no inference from event names or payload shapes."
            - "Return false for unknown, nil, and unclassified values while preserving the exported legacy UnknownEvent contract."
            - "Render compatibility errors from sanitized kind/type only and cap complete messages at 256 UTF-8 bytes."
        - id: "T016"
          title: "Preserve protocol-v1 event provenance in the Go decoder"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/protocol/protocol.go"
          dependencies: ["T010"]
          acceptance_criteria:
            - "Preserve stable known and unknown event kind provenance needed by typed classification and bounded diagnostics."
            - "Do not change existing protocol-v1 tags, fields, enum representations, or additive UnknownEvent preservation."
            - "Malformed known events fail decoding without formatting raw fields into errors."
        - id: "T017"
          title: "Enforce semantic policy at the owned-Turn boundary"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "sdk/go/turn.go"
          dependencies: ["T011", "T013", "T015", "T016", "T018"]
          acceptance_criteria:
            - "Publish ordered content/progress, terminal, permission, and tool-effect typed events to valid handlers."
            - "Filter only explicitly advisory/lifecycle metadata and suppress warnings after the first advisory warning within each Turn."
            - "Terminate unknown, malformed, nil, and unclassified owned-turn input with the typed bounded protocol compatibility error."
            - "Keep warning state per Turn and preserve queue bounds, cancellation, and terminal-result ownership."
        - id: "T018"
          title: "Extend Observer with bounded advisory compatibility metadata"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: "US-002"
          file_path: "sdk/go/client.go"
          dependencies: ["T011"]
          acceptance_criteria:
            - "Reuse the existing Observer contract for the first ignored advisory event without adding a second logging or callback surface."
            - "Expose only sanitized kind, sanitized type, and advisory disposition; include no event fields or payload values."
            - "Preserve existing observer behavior for consumers that do not use owned Turns."
        - id: "T019"
          title: "Run the complete P0 semantic-policy regression matrix"
          status: "Completed"
          type: "test"
          parallel: false
          story_id: "US-002"
          file_path: "specs/007-typed-event-compatibility/evidence.md"
          dependencies: ["T012", "T014", "T017"]
          acceptance_criteria:
            - "Record passing exact Rust schema/translator and Go typed_api/turn/turn_outcome test commands."
            - "Show one-warning advisory continuation and fail-closed outcomes for every required class, unknown, malformed, nil, and unclassified fixtures."
            - "Show diagnostics are at most 256 UTF-8 bytes and the full fixture corpus contains zero sensitive synthetic payload values."
            - "Show ReasoningDone, ToolExec, terminal, cancellation, and protocol-v1 behavior remains compatible."
    - number: 5
      title: "User Story 3 - Prevent publication gaps"
