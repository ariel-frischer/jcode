    context: "The sealed run retained the terminal classification but omitted the rejected identity. Source history makes connection_phase the leading candidate because Rust publishes it while the current Go typed decoder does not, but FR-001 forbids guessing."
    proposed_resolution: "In Phase 1, correlate the sealed run timestamps and immutable Jcode revision with authoritative bridge/runtime evidence, project only sanitized kind/type, reproduce the pre-fix decoder result in a payload-free fixture, and record whether connection_phase is confirmed before implementation continues."

