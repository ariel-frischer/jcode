plan:
  branch: "007-typed-event-compatibility"
  created: "2026-08-13"
  spec_path: "specs/007-typed-event-compatibility/spec.yaml"

summary: |
  Stabilize the owned-turn event boundary by making event semantics and publication
  disposition exhaustive at the Rust harness authority, then mirroring the public
  typed contract in the canonical Go SDK. The implementation will first recover the
  exact event rejected by Locus run-1c2020f67330 from authoritative runtime evidence
  and reduce it to a payload-free fixture. Repository history makes connection_phase
  the leading candidate, but the plan deliberately does not promote that inference to
  a contract until the evidence fixture proves the exact wire kind and Go type.

  Existing protocol-v1 shapes, Session.Events unknown-event preservation, ReasoningDone,
  ToolExec, terminal outcomes, cancellation, and provider routing remain unchanged.
  Owned Turn dispatch will publish handled safety-relevant typed events, filter only
  explicitly advisory/lifecycle metadata with one bounded redacted observation per
  turn, and fail closed on unknown, malformed, or semantically uncovered input. Rust
  and Go completeness tests will prevent new harness events from bypassing typing,
  classification, or an explicit pre-publication filter; the existing deterministic
  SDK validation and one-way jcode-go publication workflow remain the delivery path.

technical_context:
  language: "Rust 2024 edition and Go 1.23, with existing Bash publication tooling"
  framework: "None"
  primary_dependencies:
    - name: "serde"
      version: "1.x"
      purpose: "Owns the canonical protocol-v1 tagged Rust event representation and compatibility decoding."
    - name: "serde_json"
      version: "1.x"
      purpose: "Builds deterministic protocol fixtures and validates bounded event identity without logging payloads."
    - name: "Go standard library"
      version: "Go 1.23"
      purpose: "Implements the dependency-free typed-event decoder, semantic policy, turn state, diagnostics, and tests."
    - name: "Git CLI and Bash"
      version: "Git 2.x and Bash 3.2+"
      purpose: "Reuse the reviewed deterministic sdk/go to jcode-go synchronization and validation workflows."
  storage: "Payload-free regression fixtures, source-level event inventories, and deterministic synchronization manifests; no database"
  testing:
    framework: "Rust cargo test, Go testing package, and repository-local shell fixture suites"
    approach: "Start with exact Rust translator/schema and Go decoder/Turn tests, run the complete protocol-v1 compatibility matrices and Go race tests, then validate the SDK, sync manifest, relevant builds, and repository guardrails"
  target_platform: "Linux and macOS runtime support, with the existing Windows amd64 Go compile-only boundary"
  project_type: "library"
  performance_goals: "100% classified-or-filtered owned-turn coverage; diagnostics and warnings at most 256 UTF-8 bytes with zero payload disclosure; at most one ignored-advisory warning per turn; unchanged terminal and protocol-v1 outcomes"
  constraints:
    - "crates/jcode-harness-api remains the protocol-v1 wire authority; sdk/go remains the canonical Go source of truth."
    - "The exact run-1c2020f67330 event identity must come from authoritative evidence and a deterministic redacted fixture, not repository-history inference alone."
    - "Only explicitly classified advisory/lifecycle metadata may be filtered from an owned Turn, and the filter must be reviewable and emit no more than one bounded redacted observation per turn."
    - "Content/progress, terminal, permission, and tool-effect events remain visible to valid handlers and may not enter an implicit ignore path."
    - "Unknown, malformed, and semantically unclassified owned-turn input fails closed while preserving bounded kind/type provenance."
    - "Protocol-v1 tags, fields, unknown-event preservation, ReasoningDone, ToolExec, terminal results, and cancellation remain backward compatible."
    - "No new third-party Rust or Go dependency is needed; semantic ownership stays in the existing harness and SDK layers."
    - "Provider, model, authentication, and effort routing are out of scope and must remain byte-for-byte behaviorally unchanged."
    - "Public jcode-go apply, commit, push, or downstream live Locus recovery requires the existing explicit authorization and reviewed publication boundary."
    - "No live, paid, production-adjacent, or credential-bearing validation is part of local implementation acceptance."
  scale_scope: "One canonical Rust event enum and translator boundary, one dependency-free Go SDK typed-event/Turn boundary, approximately thirty-one protocol-v1 event tags, focused fixtures and parity tests, and the existing public SDK projection"

