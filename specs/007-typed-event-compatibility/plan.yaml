research_findings:
  decisions:
    - topic: "Failed-run event identity"
      decision: "Treat connection_phase as the leading evidence-backed candidate, but require recovery from authoritative Jcode/Locus runtime evidence before naming the fixture or changing compatibility behavior."
      rationale: "Commit b86833ba2e added ConnectionPhase publication to the Rust bridge after the prior ReasoningDone fix; sdk/go/protocol recognizes connection_phase while sdk/go.decodeTypedEvent lacks a concrete type, which deterministically yields UnknownEvent. The preserved run artifact records unsupported_typed_event but omitted the rejected kind, so history alone is insufficient for FR-001."
      alternatives_considered:
        - "Declare connection_phase to be the failed event from source history alone."
        - "Broaden the fix to ignore every UnknownEvent without identifying the observed contract."
    - topic: "Canonical event semantics owner"
      decision: "Add an exhaustive publication disposition and semantic class beside ApiEvent in crates/jcode-harness-api, with every enum variant explicitly marked as owned-turn published, internally filtered, or outside the owned-turn contract."
      rationale: "The Rust enum is the wire authority and an exhaustive match makes new variants a compile-time review point. Explicit non-turn and filter dispositions avoid inferring safety from an event name or payload shape."
      alternatives_considered:
        - "Keep semantics only in the Locus adapter, which would leave other SDK consumers exposed."
        - "Infer advisory events from naming conventions, which could misclassify permission, terminal, or tool-effect additions."
    - topic: "Cross-language completeness gate"
      decision: "Extend the existing Rust-to-Go source parity pattern so every current ApiEvent tag has a declared disposition and every owned-turn published tag has a concrete Go type plus exactly one semantic class."
      rationale: "The repository already machine-checks the hand-written Go tag list against the Rust enum. Expanding that single gate is smaller and more visible than introducing code generation or a second schema authority."
      alternatives_considered:
        - "Generate Go sources from Rust for this isolated contract change."
        - "Maintain independent Rust and Go lists without a parity assertion."
    - topic: "Advisory metadata handling"
      decision: "Filter only explicitly advisory/lifecycle events at the owned Turn publication boundary and emit one bounded redacted Observer classification for the first ignored advisory event in that Turn. Preserve typed delivery on the legacy Session.Events stream where compatibility requires it."
      rationale: "Turn.dispatch already owns message_accepted filtering, ordering, buffering, and terminal state, while Observer already carries bounded payload-free lifecycle metadata. Reusing both paths enforces the per-turn warning bound without global state or a second logging API."
      alternatives_considered:
        - "Require every downstream consumer to independently implement warning suppression."
        - "Silently drop advisory events with no diagnostic."
    - topic: "Unknown, malformed, and unclassified behavior"
      decision: "Preserve UnknownEvent kind and fields in the legacy raw/typed Session.Events compatibility seam, but make owned Turn dispatch terminate with a typed protocol compatibility error whose rendered diagnostic contains only sanitized bounded kind and concrete type identifiers."
      rationale: "This preserves protocol-v1 forward-diagnostic data for callers that explicitly use the legacy stream while preventing an owned execution Turn from continuing past semantically unknown input. Recognized malformed events already fail decoding and will use the same bounded identity path."
      alternatives_considered:
        - "Remove UnknownEvent fields from the public legacy API, which would be breaking."
        - "Publish unknown values to owned turns and rely on every consumer to fail closed."
    - topic: "Safety-relevant event handling"
      decision: "Publish content/progress, terminal, permission, and tool-effect typed events unchanged to owned Turn consumers and expose their semantic class; do not place them in the advisory filter. Downstream adapters must either handle their class or return the compatibility failure."
      rationale: "These events can affect output, completion, user control, or tool effects. Explicit classes allow Locus and other consumers to enforce exhaustive handler switches without weakening the canonical SDK's additive API."
      alternatives_considered:
        - "Treat all non-output events as ignorable metadata."
        - "Make the SDK synthesize downstream-specific terminal outcomes."
    - topic: "Diagnostic redaction and bounds"
      decision: "Use one shared small sanitizer contract per language that normalizes empty, control-bearing, malformed UTF-8, and oversized identifiers and caps the complete diagnostic or warning at 256 UTF-8 bytes. Never format an event value or raw fields."
      rationale: "Kind and concrete type are sufficient to remediate drift; formatting UnknownEvent or a raw frame can disclose arbitrary prompts, tool arguments, file content, credentials, and provider data."
      alternatives_considered:
        - "Serialize the rejected event after deleting selected known-sensitive fields."
        - "Report only the generic unsupported_typed_event code with no bounded identity."
    - topic: "Protocol-v1 and terminal compatibility"
      decision: "Keep existing wire tags/fields and terminal state ownership unchanged; add semantic metadata and boundary checks around decoding/publication rather than changing ServerFrame or TurnResult shapes."
      rationale: "ReasoningDone is nonterminal, ToolExec is a tool-effect event, TurnDone and provider errors own terminal outcomes, and cancellation remains terminal only through the established immutable Turn result path."
      alternatives_considered:
        - "Encode semantic class on the protocol-v1 wire, which would expand the public wire contract unnecessarily."
        - "Treat advisory metadata or cancellation acknowledgement as terminal."
    - topic: "SDK publication boundary"
      decision: "Reuse scripts/validate_go_sdk.sh and scripts/sync-jcode-go.sh; prepare and review the deterministic one-way manifest, validate both copies, and require explicit authorization before public apply, commit, push, or downstream version update."
      rationale: "The current architecture already names sdk/go as canonical and protects public governance/docs. Reusing the fingerprinted manifest preserves reviewability and prevents reverse edits or destination drift."
      alternatives_considered:
        - "Edit github.com/ariel-frischer/jcode-go directly and copy changes back."
        - "Create a new mirror or publication script for typed events."

data_model:
  entities:
    - name: "Public Turn Event Contract"
      description: "The canonical record for one ApiEvent variant at the owned-turn publication boundary."
      fields:
        - name: "wire_kind"
          type: "snake_case string"
          description: "Stable protocol-v1 event tag."
          constraints: "Unique, non-empty for known events, and unchanged for existing variants."
        - name: "rust_variant"
          type: "ApiEvent variant"
          description: "Canonical serialized Rust representation."
          constraints: "Exactly one per known wire kind."
        - name: "publication_disposition"
          type: "owned_turn | filtered | outside_owned_turn"
          description: "Declares whether the event reaches an owned Turn stream."
          constraints: "Exactly one explicit disposition; filtered entries require a public-contract rationale."
        - name: "semantic_class"
          type: "Event Semantic Class or none"
          description: "Handling class for public owned-turn events."
          constraints: "Exactly one class for owned-turn events; none only for explicit filters or non-turn events."
      relationships:
        - target: "Go Typed Event"
          type: "one-to-one"
          description: "Every owned-turn published Rust event has one concrete canonical Go representation."
    - name: "Event Semantic Class"
      description: "The explicit safety and handling category for a public owned-turn event."
      fields:
        - name: "name"
          type: "enum"
          description: "Content/progress, advisory/lifecycle metadata, terminal, permission, or tool-effect."
          constraints: "Closed reviewed set; no unknown/default class."
        - name: "unhandled_policy"
          type: "publish_required | ignore_with_warning"
          description: "Determines whether a missing consumer handler may continue."
          constraints: "Only advisory/lifecycle metadata may use ignore_with_warning."
      relationships:
        - target: "Public Turn Event Contract"
          type: "one-to-many"
          description: "Each owned-turn event belongs to exactly one semantic class."
    - name: "Go Typed Event"
      description: "The canonical sdk/go concrete value decoded from one public turn event."
      fields:
        - name: "kind"
          type: "string"
          description: "Protocol-v1 event kind used by decodeTypedEvent."
          constraints: "Matches the Rust wire kind exactly."
        - name: "concrete_type"
          type: "TypedEvent implementation"
          description: "Public Go representation of the event fields."
          constraints: "Known owned-turn events may not decode as UnknownEvent."
        - name: "semantic_class"
          type: "EventSemanticClass"
          description: "Public classification exposed to downstream handlers."
          constraints: "Exactly one recognized class for every known owned-turn concrete type."
      relationships:
        - target: "Compatibility Diagnostic"
          type: "one-to-many"
          description: "Malformed or unclassified decoding failures produce bounded diagnostics."
    - name: "Compatibility Diagnostic"
      description: "Payload-free evidence for an ignored advisory event or a fail-closed compatibility error."
      fields:
        - name: "disposition"
          type: "warning | failure"
          description: "Whether the owned Turn continued or terminated."
          constraints: "Warning is valid only for classified advisory/lifecycle metadata."
        - name: "sanitized_kind"
          type: "UTF-8 string"
          description: "Bounded normalized event kind."
          constraints: "Contains no control characters or payload-derived data."
        - name: "sanitized_type"
          type: "UTF-8 string"
          description: "Bounded normalized concrete event type or stable unknown placeholder."
          constraints: "Contains no formatted event fields or raw frame data."
        - name: "encoded_length"
          type: "integer"
          description: "Complete rendered message length in UTF-8 bytes."
          constraints: "At most 256 bytes."
      relationships:
        - target: "Turn Warning State"
          type: "many-to-one"
          description: "Warnings are suppressed after the first advisory warning in a Turn."
    - name: "Turn Warning State"
      description: "Per-owned-Turn state that bounds ignored advisory observations."
      fields:
        - name: "advisory_warning_emitted"
          type: "boolean"
          description: "Records whether this Turn already emitted its bounded advisory warning."
          constraints: "Starts false, changes at most once, and is never shared across turns."
      relationships:
        - target: "Compatibility Diagnostic"
          type: "one-to-many"
          description: "Permits at most one warning diagnostic and any fail-closed terminal evidence."
    - name: "SDK Publication Projection"
      description: "The reviewed one-way synchronization of canonical sdk/go into public jcode-go."
      fields:
        - name: "source_revision"
          type: "Git commit"
          description: "Validated canonical Jcode revision."
          constraints: "Must be recorded before publication."
        - name: "manifest"
          type: "jcode-go-sync-manifest-v1"
          description: "Exact deterministic add/update/remove and protected-retain projection."
          constraints: "Reviewed, fingerprint-bound, and unchanged at apply time."
        - name: "validation_evidence"
          type: "command results"
          description: "Equivalent canonical and public module contract checks."
          constraints: "All required checks pass before push."
      relationships:
        - target: "Go Typed Event"
          type: "one-to-many"
          description: "The projection publishes the canonical typed-event contract without reverse ownership."

api_contracts:
  endpoints:
    - method: "Rust method"
      path: "ApiEvent::publication_contract"
      description: "Returns the exhaustive owned-turn publication disposition and semantic class for a known harness event."
      request:
        content_type: "Rust value"
        body_schema: "&ApiEvent"
      response:
        success_code: 200
        body_schema: "EventPublicationContract { wire_kind, disposition, semantic_class }"
      errors:
        - code: 500
          description: "A newly added ApiEvent variant without an explicit disposition fails compilation or the completeness test; no runtime default is accepted."
    - method: "Go function"
      path: "SemanticClassOf"
      description: "Returns the reviewed semantic class for one known canonical TypedEvent without inspecting payload values."
      request:
        content_type: "Go value"
        body_schema: "TypedEvent"
      response:
        success_code: 200
        body_schema: "(EventSemanticClass, true) for every known owned-turn concrete type"
      errors:
        - code: 422
          description: "UnknownEvent, nil, or a concrete type with no reviewed class returns false and must enter the fail-closed compatibility path."
    - method: "Go method"
      path: "Turn.Next"
      description: "Publishes ordered safety-relevant typed events, filters only explicit advisory/lifecycle metadata, and terminates on unknown, malformed, or unclassified input."
      request:
        content_type: "protocol-v1 ServerFrame"
        body_schema: "Known or unknown event carrying a stable ev tag and fields"
      response:
        success_code: 200
        body_schema: "TypedEvent in original order, or no event plus one bounded Observer warning for ignored advisory metadata"
      errors:
        - code: 422
          description: "Unknown, malformed, or semantically unclassified input produces TurnResultProtocolError with a bounded payload-free compatibility error."
        - code: 507
          description: "Existing bounded subscriber-overflow behavior remains unchanged."
    - method: "Go method"
      path: "TypedEventStream.Next"
      description: "Preserves the legacy Session.Events typed stream, including UnknownEvent kind/fields compatibility, while known events decode to concrete types and classes."
      request:
        content_type: "protocol-v1 ServerFrame"
        body_schema: "Raw known or additive event frame"
      response:
        success_code: 200
        body_schema: "Concrete TypedEvent for known kinds or UnknownEvent { Kind, Fields } for additive unknown kinds"
      errors:
        - code: 400
          description: "Malformed known-event fields return a decode error without formatting raw fields into the error."
    - method: "Shell command"
      path: "scripts/sync-jcode-go.sh preview/apply"
      description: "Projects the validated canonical SDK to public jcode-go through the existing reviewed one-way manifest."
      request:
        content_type: "CLI arguments and manifest"
        body_schema: "Canonical sdk/go path, eligible clean public main destination, and unchanged reviewed manifest for apply"
      response:
        success_code: 200
        body_schema: "Deterministic manifest in preview or exact reviewed operations in authorized apply"
      errors:
        - code: 400
          description: "Wrong repository, branch, dirty state, stale fingerprints, unsafe paths, malformed manifest, or reverse synchronization is rejected before mutation."

