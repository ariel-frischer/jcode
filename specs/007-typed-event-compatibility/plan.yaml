implementation_phases:
  - phase: 1
    name: "Recover evidence and freeze the event inventory"
    goal: "Prove the exact run-1c2020f67330 event identity without retaining payloads and establish the current owned-turn publication matrix."
    deliverables:
      - "Authoritative source and timestamp trail for the rejected wire kind and concrete Go type, with the connection_phase hypothesis confirmed or rejected"
      - "Deterministic payload-free Rust and Go fixture that reproduces the former unsupported_typed_event path"
      - "Complete ApiEvent inventory recording owned-turn publication, explicit pre-publication filters with rationale, or outside-turn disposition"
      - "Requirement-to-check acceptance matrix covering all 16 functional requirements, 4 non-functional requirements, publication, push authorization, cleanup, and data-safety boundaries"
  - phase: 2
    name: "Establish canonical Rust semantics and publication gates"
    goal: "Make the harness wire authority exhaustive about semantic class and public owned-turn disposition."
    dependencies:
      - "Phase 1"
    deliverables:
      - "EventSemanticClass and exhaustive ApiEvent publication contract with no default classification"
      - "Explicit reviewable filters limited to non-public-turn events and a test that rejects undeclared or public-contract filters"
      - "Bounded sanitized Rust event identity for unsupported input without payload retention"
      - "Focused schema and translator regressions preserving protocol-v1, ReasoningDone, ToolExec, terminal, permission, and background behavior"
  - phase: 3
    name: "Enforce canonical Go typed-event compatibility"
    goal: "Give every owned-turn event a concrete Go type and semantic class, permit only bounded advisory filtering, and fail closed on unsafe drift."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Concrete typed decoder support for the evidence-proven event and all currently published owned-turn tags"
      - "Public EventSemanticClass classification with parity coverage against the Rust inventory"
      - "Turn dispatch policy that filters only advisory/lifecycle metadata and emits exactly one bounded redacted Observer warning per Turn"
      - "Typed protocol compatibility errors for unknown, malformed, nil, and semantically unclassified Turn events while legacy Session.Events preserves UnknownEvent"
      - "Focused Go fixtures for every class, repeated advisory metadata, control/malformed/oversized identifiers, payload exclusion, and required-handler paths"
  - phase: 4
    name: "Lock protocol, lifecycle, and SDK regressions"
    goal: "Prove the new semantic policy does not alter established protocol-v1 or terminal behavior."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Complete Rust-to-Go coverage gate that fails for any newly owned event lacking a type, class, or explicit filter"
      - "Deterministic ReasoningDone continuation, ToolExec/tool-effect, success, provider failure, cancellation, unknown-event, and protocol-v1 corpus"
      - "Go unit, race, Windows compile, and isolated newly built private-runtime smoke evidence with no provider-routing changes"
