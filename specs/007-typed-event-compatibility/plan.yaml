    dependencies:
      - "Phase 4"
    deliverables:
      - "Passing focused Rust package tests, relevant builds, scripts/validate_go_sdk.sh, sync/validator fixture suites, and scripts/check_guardrails.sh"
      - "Two byte-identical sync previews whose reviewed manifest contains only canonical SDK projection changes and preserves public governance/docs"
