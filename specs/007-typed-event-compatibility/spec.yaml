feature:
    branch: "007-typed-event-compatibility"
    created: "2026-08-13"
    status: "Completed"
    completed_at: 2026-08-14T03:23:23Z
    input: "Stabilize typed-event compatibility across the Jcode harness API and canonical sdk/go. Identify the exact event that caused Locus run-1c2020f67330 to fail with unsupported_typed_event, preserve bounded redacted diagnostics, define explicit semantic classes for public events so only advisory/lifecycle metadata may be ignored with one bounded warning, keep unknown terminal permission tool-effect malformed and unclassified events fail-closed, machine-check that every owned turn event is typed and semantically classified or filtered before publication, preserve existing reasoning_done ToolExec terminal cancellation unknown-event and protocol-v1 behavior, add deterministic Rust and Go regression fixtures and SDK sync validation, and document the canonical sdk/go to public jcode-go publication boundary. Do not change provider routing or silently ignore arbitrary future events."
user_stories:
    - id: "US-001"
      title: "Diagnose the rejected event safely"
      priority: "P0"
      as_a: "Jcode integrator"
      i_want: "the exact public event that caused Locus run-1c2020f67330 to fail to be identified and reproducible"
      so_that: "the compatibility defect can be corrected from evidence without exposing sensitive event payloads"
      why_this_priority: "The failed run cannot be explained or protected against until the rejected event kind and type are known."
      independent_test: "Replay a deterministic redacted fixture derived from the failed run and verify that it reproduces the prior unsupported_typed_event outcome while naming only the bounded sanitized event kind and type."
      acceptance_scenarios:
        - given: "the preserved evidence for Locus run-1c2020f67330"
          when: "the rejected event is reconstructed as a deterministic fixture"
          then: "the fixture records the exact event kind and type, reproduces the former rejection, and contains no payload fields or sensitive content"
        - given: "an unsupported public event with payload data"
          when: "a compatibility diagnostic is produced"
          then: "the diagnostic is bounded, includes only sanitized kind and type identifiers, and excludes payload contents"
    - id: "US-002"
      title: "Apply explicit event semantics"
      priority: "P0"
      as_a: "consumer of the Jcode harness API"
      i_want: "every public turn event to have an explicit semantic class"
      so_that: "I can distinguish safe advisory metadata from events that require handling or fail-closed behavior"
      why_this_priority: "Incorrectly ignoring terminal, permission, or tool-effect events could change execution outcomes or bypass user control."
      independent_test: "Exercise one representative of every semantic class plus unknown, malformed, and unclassified inputs and verify the required handling policy."
      acceptance_scenarios:
        - given: "a recognized advisory or lifecycle metadata event"
          when: "a consumer intentionally does not process its metadata"
          then: "the turn continues and emits no more than one bounded warning for that turn stream"
        - given: "a recognized content, progress, terminal, permission, or tool-effect event"
          when: "the consumer has no valid handler for it"
          then: "the event is not ignored and processing fails closed"
        - given: "an unknown, malformed, or unclassified event"
          when: "the event reaches the compatibility boundary"
          then: "processing fails closed with a bounded redacted diagnostic"
    - id: "US-003"
      title: "Prevent publication gaps"
      priority: "P1"
      as_a: "Jcode maintainer"
      i_want: "a complete machine-checked inventory of owned turn events"
      so_that: "new harness events cannot be published without a typed representation, semantic classification, or intentional pre-publication filter"
      why_this_priority: "A completeness gate prevents the same class of downstream regression from recurring as the event set evolves."
      independent_test: "Run the inventory check against the owned turn-event set, then add an untyped or unclassified test event and verify that the check fails."
      acceptance_scenarios:
        - given: "the complete set of events owned by a public turn stream"
          when: "the compatibility inventory is checked"
          then: "each event is either typed and semantically classified or explicitly filtered before publication"
        - given: "a newly owned event with no public type, class, or publication filter"
          when: "the compatibility inventory is checked"
          then: "the check fails and identifies the uncovered event"
    - id: "US-004"
      title: "Publish the canonical SDK safely"
      priority: "P1"
      as_a: "maintainer of Jcode SDK consumers"
      i_want: "the canonical SDK source and public module publication boundary to be explicit and validated"
      so_that: "downstream consumers receive the same reviewed event contract that was validated in Jcode"
      why_this_priority: "A correct canonical contract still fails users if the public module drifts or is published without equivalent validation."
      independent_test: "Validate the canonical SDK, verify the deterministic synchronization manifest, validate the synchronized public module, and confirm the documented source-to-publication direction."
      acceptance_scenarios:
        - given: "a validated change to canonical sdk/go"
          when: "the public jcode-go synchronization is prepared"
          then: "the reviewed manifest contains only the canonical SDK projection and both copies pass equivalent contract fixtures"
        - given: "a proposed direct or reverse edit from public jcode-go into canonical sdk/go"
          when: "the publication boundary is reviewed"
          then: "the workflow identifies canonical sdk/go as the source of truth and rejects the divergent path"
requirements:
    functional:
        - id: "FR-001"
          description: "The compatibility work MUST identify and record the exact event kind and type that caused Locus run-1c2020f67330 to terminate with unsupported_typed_event."
          acceptance_criteria: "A deterministic redacted fixture derived from authoritative run evidence reproduces the former rejection and asserts the exact kind and type."
        - id: "FR-002"
          description: "Unsupported-event diagnostics MUST retain a sanitized event kind and type while excluding event payload fields, prompts, tool arguments, file content, credentials, and other sensitive data."
          acceptance_criteria: "Fixtures containing control characters, oversized identifiers, and sensitive payload fields produce diagnostics of at most 256 UTF-8 bytes containing sanitized bounded identifiers and none of the payload values."
        - id: "FR-003"
          description: "Every public owned turn event MUST be assigned exactly one explicit semantic class: content/progress, advisory/lifecycle metadata, terminal, permission, or tool-effect."
          acceptance_criteria: "The public event inventory reports one and only one recognized semantic class for every typed event that can be published to an owned turn stream."
        - id: "FR-004"
          description: "Only events explicitly classified as advisory/lifecycle metadata MAY be ignored by a consumer, and doing so MUST produce at most one bounded redacted warning per turn stream."
          acceptance_criteria: "A fixture with repeated ignorable metadata events continues successfully and emits exactly one warning no longer than 256 UTF-8 bytes for the turn stream."
        - id: "FR-005"
          description: "Content/progress, terminal, permission, and tool-effect events MUST NOT be ignored when the consumer lacks a valid handler."
          acceptance_criteria: "Representative unhandled fixtures from each class terminate processing with the established compatibility failure rather than continuing."
        - id: "FR-006"
          description: "Unknown, malformed, and semantically unclassified events MUST remain fail-closed."
          acceptance_criteria: "Representative unknown, malformed, and unclassified fixtures each produce unsupported_typed_event with bounded redacted identifiers and do not continue the turn."
        - id: "FR-007"
          description: "The public event publication gate MUST machine-check that every event owned by a turn stream is either typed and semantically classified or intentionally filtered before publication."
          acceptance_criteria: "The gate passes for the complete current inventory and deterministically fails when a fixture introduces an owned event without a public type, semantic class, or explicit publication filter."
        - id: "FR-008"
          description: "Intentional pre-publication filters MUST be explicit, reviewable, and limited to events that are not part of the public turn contract."
          acceptance_criteria: "The inventory identifies every filtered event and its public-contract rationale; an undeclared filter or public-contract event filter fails validation."
        - id: "FR-009"
          description: "Existing reasoning_done behavior MUST remain nonterminal and compatible."
          acceptance_criteria: "A deterministic fixture continues past reasoning_done and reaches its subsequent typed terminal outcome without unsupported_typed_event."
        - id: "FR-010"
          description: "Existing ToolExec behavior and tool-effect safety MUST remain compatible."
          acceptance_criteria: "Deterministic fixtures preserve the current typed ToolExec sequence and fail closed if a required tool-effect event is unhandled."
        - id: "FR-011"
          description: "Existing terminal-result and cancellation behavior MUST remain compatible and terminal."
          acceptance_criteria: "Deterministic success, failure, and cancellation fixtures each reach the same terminal classification and outcome as before the change."
        - id: "FR-012"
          description: "Existing unknown-event behavior MUST remain preserved for diagnosis and MUST not become a universal ignore path."
          acceptance_criteria: "An arbitrary future event remains represented as unknown, retains bounded kind/type provenance, and fails closed unless a later reviewed contract explicitly classifies it."
        - id: "FR-013"
          description: "Protocol-v1 wire behavior MUST remain backward compatible for all existing typed events and unknown-event preservation."
          acceptance_criteria: "The complete protocol-v1 regression corpus decodes to the same public event identities and terminal outcomes except for the newly identified event receiving its reviewed typed classification or explicit publication filter."
        - id: "FR-014"
          description: "The canonical sdk/go contract MUST include deterministic regression fixtures equivalent to the harness contract fixtures."
          acceptance_criteria: "Canonical SDK validation exercises the failed-run event, every semantic class, repeated advisory metadata, malformed input, unknown input, reasoning_done, ToolExec, terminal results, cancellation, and protocol-v1 compatibility."
        - id: "FR-015"
          description: "The repository MUST document canonical sdk/go as the source of truth and public github.com/ariel-frischer/jcode-go as a reviewed publication projection."
          acceptance_criteria: "Publication documentation names the one-way boundary, required synchronization manifest, validation in both repositories, reviewed commit and push steps, and downstream version update evidence."
        - id: "FR-016"
          description: "Provider, model, authentication, and effort routing MUST remain unchanged."
          acceptance_criteria: "The final change contains no routing configuration or behavior changes, and existing routing contract checks remain unchanged and passing."
    non_functional:
        - id: "NFR-001"
          category: "security"
          description: "Compatibility diagnostics and warnings must disclose only the minimum event identity needed for remediation."
          measurable_target: "Zero payload field values or sensitive contents appear in the full diagnostic fixture corpus; every message is at most 256 UTF-8 bytes."
        - id: "NFR-002"
          category: "reliability"
          description: "Event coverage must remain complete as owned public turn events evolve."
          measurable_target: "100% of owned published turn events have one public type and one semantic class, or an explicit validated pre-publication filter."
        - id: "NFR-003"
          category: "code_quality"
          description: "Regression evidence must be deterministic and attributable across the harness, canonical SDK, and public publication projection."
          measurable_target: "All required fixtures pass in repeated local validation with identical classifications, warning counts, and terminal outcomes."
        - id: "NFR-004"
          category: "reliability"
          description: "The compatibility policy must not reduce existing protocol-v1 interoperability."
          measurable_target: "100% of the pre-change protocol-v1 compatibility corpus retains its prior observable outcome."
success_criteria:
    measurable_outcomes:
        - id: "SC-001"
          description: "Maintainers can determine the exact compatibility-breaking event from a failed run without inspecting sensitive payload data."
          metric: "Failed-run reproduction evidence"
          target: "One deterministic fixture names the exact sanitized event kind and type and reproduces the prior failure with zero payload disclosure."
        - id: "SC-002"
          description: "Consumers can safely tolerate recognized advisory lifecycle metadata without weakening control or terminal semantics."
          metric: "Semantic-policy scenario outcomes"
          target: "100% of advisory/lifecycle scenarios continue with one bounded warning, while 100% of unhandled safety-relevant, unknown, malformed, and unclassified scenarios fail closed."
        - id: "SC-003"
          description: "Future public event additions are stopped before release when their compatibility contract is incomplete."
          metric: "Owned event inventory coverage"
          target: "100% classified-or-filtered coverage, with every deliberately uncovered test event rejected by the publication gate."
        - id: "SC-004"
          description: "Existing consumers retain their established protocol-v1 turn behavior."
          metric: "Legacy regression outcomes"
          target: "100% of reasoning completion, tool execution, terminal result, cancellation, and unknown-event compatibility scenarios match their approved baseline."
        - id: "SC-005"
          description: "Downstream users receive the same event contract that maintainers validated at the canonical source."
          metric: "Canonical-to-public synchronization evidence"
          target: "One reviewed one-way synchronization manifest and equivalent passing compatibility fixtures in both the canonical and public SDK copies before publication."
key_entities:
    - name: "Public Turn Event"
      description: "An event that a harness consumer may observe during an owned turn stream."
      attributes:
        - "stable kind and type identity"
        - "typed public representation"
        - "exactly one semantic class"
        - "publication or explicit filtering status"
    - name: "Event Semantic Class"
      description: "The explicit handling category that determines whether an event must be consumed, may be ignored with warning, or must fail closed when unhandled."
      attributes:
        - "content/progress"
        - "advisory/lifecycle metadata"
        - "terminal"
        - "permission"
        - "tool-effect"
    - name: "Compatibility Diagnostic"
      description: "Bounded evidence identifying an unsupported or ignored event without retaining its payload."
      attributes:
        - "sanitized event kind"
        - "sanitized event type"
        - "maximum encoded length"
        - "warning or failure disposition"
    - name: "SDK Publication Projection"
      description: "The reviewed one-way synchronization from canonical sdk/go to the public jcode-go module."
      attributes:
        - "canonical source revision"
        - "deterministic synchronization manifest"
        - "canonical validation evidence"
        - "public module validation evidence"
        - "published revision"
edge_cases:
    - scenario: "An advisory/lifecycle metadata event repeats many times in one turn stream."
      expected_behavior: "The events may be ignored, the turn continues, and no more than one bounded redacted warning is emitted for that turn stream."
    - scenario: "An event identifier is empty, oversized, malformed, or contains control characters."
      expected_behavior: "The event fails closed and its diagnostic substitutes or sanitizes the identifier, truncates it to the bound, and excludes all payload data."
    - scenario: "A future protocol-v1 event arrives before the consumer has a semantic classification for it."
      expected_behavior: "The event remains preserved as unknown and fails closed; it is not inferred to be advisory from its name or shape."
    - scenario: "A terminal, permission, or tool-effect event is mislabeled as advisory metadata."
      expected_behavior: "Completeness and semantic-policy validation rejects the classification before publication."
    - scenario: "An internal-only event is intentionally removed before the public stream."
      expected_behavior: "The event appears in the inventory with an explicit filter rationale and never reaches public consumers."
    - scenario: "The canonical and public SDK copies differ after synchronization."
      expected_behavior: "Publication validation fails and no downstream update is declared ready."
assumptions:
    - "The exact rejected event can be recovered from authoritative Jcode runtime or protocol evidence even though the current Locus terminal diagnostic omitted its kind."
    - "One bounded warning means at most one warning per owned turn stream, regardless of how many advisory/lifecycle metadata events are ignored in that stream."
    - "A 256 UTF-8 byte limit is sufficient to carry sanitized kind and type identifiers plus actionable compatibility context without retaining payload data."
    - "Canonical sdk/go remains the sole source of truth for the public jcode-go module."
    - "Public protocol-v1 remains additive, but additive wire compatibility does not grant consumers permission to ignore semantically unknown events."
constraints:
    - "The change must comply with backward-compatible user and data contracts, trust-boundary validation, focused behavioral tests, repository delivery gates, and canonical SDK ownership."
    - "Unknown or unclassified future events cannot be silently treated as advisory."
    - "Public SDK publication requires the repository's reviewed one-way synchronization and validation workflow."
    - "No live, costly, or production-adjacent validation is authorized by this specification."
out_of_scope:
    - "Changing provider, model, authentication, or effort routing."
    - "Introducing a universal ignore policy for unknown or future events."
    - "Weakening terminal, permission, tool-effect, cancellation, or unknown-event fail-closed behavior."
    - "Creating a second SDK source of truth or a reverse synchronization path from public jcode-go."
    - "Publishing the public jcode-go module or running a paid Locus recovery as part of specification generation."
