plan:
  branch: "agent/jcode-3so-session-profiles"
  created: "2026-08-08"
  spec_path: "specs/003-add-session-profiles/spec.yaml"

summary: |
  Add an optional named-session-profile map to the existing TOML configuration,
  with the serialized profile data owned by jcode-config-types and the runtime
  resolver kept at the configuration/CLI boundary. A selected profile will be
  loaded strictly, validated before provider contact, and converted into an
  immutable per-run overlay. Resolution will use the documented order of
  explicit invocation values, environment overrides, selected profile values,
  unprofiled persisted configuration, and built-in defaults; absent profiles
  will leave the current Config and request path unchanged.

  Integrate the overlay through the existing ProviderChoice/provider catalog,
  provider_profile, ToolConfig/ToolSelection, SkillRegistry, and prompt builder
  owners. The one-shot run path will receive provider/model/reasoning and tool
  overrides directly, while selected skills and additional instructions will be
  added to the session's static prompt context. No persisted configuration,
  shared skill registry, unrelated session, or running daemon will be mutated;
  structured runs will either use the same profile while starting a private/new
  server or fail with a lifecycle diagnostic when a shared daemon cannot accept
  a per-session overlay.

technical_context:
  language: "Rust 2024 edition"
  framework: "None"
  primary_dependencies:
    - name: "jcode-config-types"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns the serde/TOML data contract for optional named session profiles."
    - name: "jcode-base"
      version: "workspace path dependency (0.1.0)"
      purpose: "Owns Config loading, strict profile validation, ToolConfig semantics, provider catalog access, SkillRegistry, and prompt construction."
    - name: "clap"
      version: "4"
      purpose: "Adds the global --profile option and routes explicit run overrides, including the missing reasoning-effort invocation value."
    - name: "serde"
      version: "1"
      purpose: "Deserializes optional profile fields with defaults and preserves round-trip field names."
    - name: "toml"
      version: "0.8"
      purpose: "Loads strict profile configuration and verifies round-trip serialization."
    - name: "jcode-provider-core"
      version: "workspace path dependency"
      purpose: "Reuses canonical reasoning-effort vocabulary and provider capability validation instead of duplicating provider rules."
  storage: "Existing ~/.jcode/config.toml (or JCODE_HOME config.toml) plus existing environment overrides; no migration or new store"
  testing:
    framework: "Rust built-in test harness with existing jcode-base, CLI, app-core, and e2e mock-provider utilities"
    approach: "Focused unit tests for TOML/defaults/strict diagnostics, CLI placement and precedence, ToolConfig composition, prompt overlays and session isolation; deterministic mock-provider integration tests for outgoing setup and no-request failures; then affected-package builds and repository guardrails."
  target_platform: "Jcode-supported Linux, macOS, and Windows CLI/server builds"
  project_type: "cli"
  performance_goals: "No profile lookup, prompt section, tool selection, provider initialization, network request, or serialized-config change when --profile is absent; selected profiles add only one strict config read and bounded local skill validation before a run."
  constraints:
    - "Profiles are opt-in and the absent profiles section must preserve current defaults, serialized output, provider selection, tool exposure, prompt bytes, and request shape."
    - "The canonical precedence order is explicit invocation > environment > selected profile > unprofiled persisted config > built-in defaults; parser defaults must not masquerade as explicit overrides."
    - "Profile values are applied per current jcode run/session through existing owners; selecting a profile never writes config.toml or mutates shared/global skill state."
    - "Strict selected-profile loading must reject malformed TOML/profile fields, unknown profile names, unsupported provider/model/reasoning/tool/skill references, and contradictory provider/profile combinations before a provider request."
    - "Tool profile, allow-list, and deny-list composition must reuse ToolConfig selection and canonical tool-name normalization; no parallel tool semantics are introduced."
    - "Selected skills must resolve through the existing session working-directory-aware SkillRegistry; profile instructions must be additive and must not replace AGENTS.md, project overlays, or the user message."
    - "Diagnostics may name profiles, keys, safe values, available choices, and lengths, but must never print credentials, API keys, or full instruction contents."
    - "The profile option is a global CLI input for jcode run; unsupported command/lifecycle combinations fail clearly rather than changing an existing daemon or unrelated command."
    - "No profile inheritance, aliases, management UI, skill installation, provider credential changes, protocol-wide profile persistence, or unrelated cleanup is included."
  scale_scope: "A small BTreeMap of user-defined profiles resolved once per selected run, with one immutable overlay attached to one Agent/session."

