    - path: "crates/jcode-app-core/src/agent_tests/"
      description: "Two-session profile overlay and tool-policy isolation tests using existing mock providers/registries."
    - path: "src/cli/args/tests.rs"
      description: "Accept --profile before and after run, retain normal parsing for unrelated commands, and cover explicit reasoning override parsing."
    - path: "src/cli/profile.rs"
      description: "Pure precedence matrix, provider/profile/model/reasoning diagnostics, unknown profile choices, and no-side-effect resolution tests."
    - path: "tests/e2e/session_flow.rs"
      description: "Mock-provider outgoing setup and prompt assertions for a complete profile, explicit overrides, selected skills/instructions, and independent sessions."
    - path: "tests/e2e/provider_behavior.rs"
      description: "Negative no-request/provider fixture coverage for invalid provider/model/reasoning/tool/skill profile values where the existing mock harness is appropriate."

implementation_phases:
  - phase: 1
    name: "Persisted profile contract and strict resolver"
    goal: "Represent [profiles.<name>] without changing absent/default serialization and produce a validated immutable overlay before provider startup."
    deliverables:
      - "Add SessionProfileConfig and Config.profiles with serde defaults, skip-empty serialization, and complete default-file comments."
      - "Implement exact-name strict lookup, safe field/type/value diagnostics, provider/profile reference checks, reasoning vocabulary checks, and effective working-directory skill validation."
      - "Define the source-aware precedence helper and ToolConfig overlay conversion without mutating persisted Config or shared registries."
      - "Add focused config, serialization, invalid-input, and resolver tests."
  - phase: 2
    name: "CLI selection and provider/tool run integration"
    goal: "Make --profile usable with jcode run in both supported flag placements and apply effective provider, model, reasoning, and tools through existing runtime paths."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Add global --profile parsing and the minimal explicit --reasoning-effort route, preserving current parser defaults and unrelated commands."
      - "Resolve profile values before provider contact; explicit invocation and environment values win field by field, then feed ProviderChoice, model, provider_profile, and reasoning into existing initialization."
      - "Pass the resulting ToolSelection into the run Agent and validate allow/deny names against the constructed Registry before the first provider request."
      - "Cover precedence matrix, both CLI placements, unknown/invalid profile diagnostics, no-request behavior, and absent-profile regressions."
  - phase: 3
    name: "Session prompt overlay and lifecycle isolation"
    goal: "Apply selected skills and additional instructions to only the selected run/session while preserving normal prompt layers and daemon safety."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Extend prompt assembly with deterministic static profile instructions and selected Skill::get_prompt sections, leaving AGENTS.md, project overlays, available-skill listing, active slash skills, memory, and user messages intact."
      - "Add profile-aware Agent/session construction that owns overlay and tool policy per session and retains existing constructors for no-profile callers."
      - "Handle structured/schema runs through existing server bootstrap when safe, or fail clearly if a shared daemon cannot accept a per-session profile without mutation."
      - "Add mock-provider prompt, tool, persistence, reload, and two-session isolation tests."
  - phase: 4
    name: "Documentation, changelog, and delivery validation"
    goal: "Document the supported contract and prove the complete acceptance surface with repository guardrails."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Update the generated config example, README/run reference, structured-run caveat if applicable, and next-release changelog entry with a secret-free complete example."
      - "Run exact profile/config/CLI/prompt/e2e tests first, then affected-package cargo check/build/test and scripts/check_guardrails.sh."
      - "Record commands/results and isolate any pre-existing unrelated guardrail failures without rebaselining them."

risks:
  - id: "RISK-001"
    risk: "A parser default such as ProviderChoice::Auto could be mistaken for an explicit invocation and prevent a profile provider from applying."
    likelihood: "medium"
    impact: "high"
    mitigation: "Keep explicit Option fields for newly added values, treat only concrete provider choices as explicit in the resolver, and test omitted versus supplied flags in the precedence matrix."
  - id: "RISK-002"
    risk: "Profile settings could be applied through process-global environment/config state and leak into an existing daemon or another session."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use immutable run/Agent options for tools and prompt context, scope provider/profile handoff to new/private server startup, and fail before request when a shared daemon cannot isolate the overlay."
  - id: "RISK-003"
    risk: "Provider/model catalogs or MCP tools may be unavailable during offline validation, making a valid profile appear invalid or allowing an unknown value through."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Reuse existing local provider/profile capability checks, validate built-in/loaded Registry names before the request, distinguish local structural validation from remote catalog availability, and test both known and unavailable fixtures."
  - id: "RISK-004"
    risk: "Prompt section ordering or nondeterministic skill iteration could change cache prefixes or duplicate profile context."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Keep profile content in the existing static prompt path, preserve configured skill order (with deterministic duplicate handling), render exactly once, and assert exact ordering/bytes in prompt tests."
  - id: "RISK-005"
    risk: "Diagnostics could expose instruction text or provider credentials while explaining an invalid profile."
    likelihood: "low"
    impact: "high"
    mitigation: "Report only profile/key/safe scalar values, available names, correction hints, and lengths; add redaction assertions to negative tests and never include full instructions in errors."

