    - name: "Backward-Compatible User and Data Contracts (PRIN-002)"
      status: "PASS"
      notes: "Uses optional serde-defaulted fields and skips an empty profiles map during serialization, keeps the no-profile path on the current Config/provider/Agent constructors, and adds regression checks for absent-section and unset invocations."
    - name: "Explicit Configuration Precedence (PRIN-003)"
      status: "PASS"
      notes: "Defines one resolver with invocation > environment > selected profile > base config > built-in precedence, preserves explicit flag provenance, and routes provider, reasoning, tools, skills, and instructions through their existing owners."
    - name: "Layered Rust Ownership and Dependency Direction (PRIN-004)"
      status: "PASS"
      notes: "Places stable serialized profile data in jcode-config-types, keeps Config/ToolConfig/provider/skills/prompt resolution in jcode-base, and limits app-core/CLI changes to session composition rather than moving stable types into orchestration."
    - name: "Focused Behavioral Tests (PRIN-005)"
      status: "PASS"
      notes: "Maps loading, round-trip, precedence, CLI placement, tool composition, prompt skill/instruction content, session isolation, unknown/invalid diagnostics, no-request behavior, and unset compatibility to focused tests before broad checks."
    - name: "Visible Failures and Trust-Boundary Validation (PRIN-006)"
      status: "PASS"
      notes: "Uses strict parsing and pre-request profile/skill/tool/provider validation, wraps errors with profile/key context and corrective choices, and keeps secrets and instruction bodies out of diagnostics."
    - name: "Repository Guardrails Are Delivery Gates (PRIN-007)"
      status: "PASS"
      notes: "Requires exact artifact validation now and, during implementation, focused Rust tests, affected-package build/check, and scripts/check_guardrails.sh with any pre-existing unrelated failures isolated rather than rebaselined."

research_findings:
  decisions:
    - topic: "Persisted profile ownership and serialization"
      decision: "Add a serde-defaulted SessionProfileConfig type in jcode-config-types and a BTreeMap<String, SessionProfileConfig> profiles field on Config with skip_serializing_if for an empty map."
      rationale: "The profile is a stable user-authored TOML contract, while the empty map must not change existing serialized defaults or files that omit [profiles]. The type crate already owns dependency-light config records."
      alternatives_considered:
        - "Define profiles only in the root CLI crate, which would make Config deserialization and other config consumers depend on the interface layer."
        - "Serialize an empty [profiles] table by default, which would violate the absent-section compatibility requirement."
    - topic: "Strict selection and canonical resolution"
      decision: "Resolve a selected profile through a dedicated Config/session-profile resolver using strict TOML loading and an immutable ResolvedSessionProfile value; keep Config::load's forgiving legacy behavior for the no-profile path."
      rationale: "Selected profiles are an explicit trust-boundary input and must not silently fall back to defaults, while existing users with malformed config currently retain the established load behavior when no profile is requested."
      alternatives_considered:
        - "Use the forgiving global config cache for profile selection, which can silently discard malformed profile data."
        - "Patch and save the global Config before a run, which risks persistent changes and cross-session leakage."
    - topic: "Precedence and explicit CLI provenance"
      decision: "Treat only supplied global flags as invocation overrides, fill unset fields from the selected profile only when the corresponding environment source is absent, and leave the existing Auto provider sentinel as the unselected provider default. Add a global --reasoning-effort option because no current CLI field exposes an explicit reasoning override."
      rationale: "This makes the specified field-by-field matrix testable without turning parser defaults into user intent, preserves current environment-over-config behavior, and supplies the missing explicit reasoning input required by FR-008."
      alternatives_considered:
        - "Let profile values overwrite environment-derived Config values, which reverses the documented environment precedence."
        - "Convert every existing provider argument to Option<T>, which would broaden parser churn beyond the minimum provenance seam."
        - "Treat reasoning as profile-only, which would leave explicit invocation precedence untestable for that field."
    - topic: "Provider/model/profile application"
      decision: "Convert profile provider strings through the existing provider catalog/ProviderChoice selection, reuse the existing named provider_profile path, pass the effective model into provider initialization, and apply a validated reasoning override through the provider's existing setter before the first request."
      rationale: "Provider catalog and runtime capability checks already know built-in/custom providers and model routes; using them avoids a second provider vocabulary and lets invalid choices fail before a request."
      alternatives_considered:
        - "Create a profile-specific provider registry or model parser, which would drift from current startup and model-picker behavior."
        - "Write profile values into persistent [provider] defaults, which would violate session scope."
    - topic: "Tool profile composition and validation"
      decision: "Clone the effective base ToolConfig, overlay profile tool_profile/tools/disabled_tools only for fields not won by explicit or environment sources, derive ToolSelection with the existing profile/allow/deny rules, and validate canonical names against the constructed Registry before Agent execution."
      rationale: "ToolConfig already defines baseline, allow-list, deny-list, aliases, and `*`/`all` behavior; Registry is the authoritative source for actual built-in/MCP tool names and can provide no-request validation."
      alternatives_considered:
        - "Add separate profile-specific filtering logic, which could expose tools differently from [tools] and CLI flags."
        - "Ignore unknown names as current normalization does, which would violate the profile diagnostic requirement."
    - topic: "Session prompt skills and instructions"
      decision: "Resolve selected skills from the effective working-directory SkillRegistry, preserve configured order after validation, and extend the prompt builder with a static per-session profile overlay section for skill prompts and additional instructions. Keep slash-invoked active skills and available-skill listing on their existing paths."
      rationale: "This preserves global/project guidance and user-message boundaries, keeps project-local skills session-scoped, and avoids using system_prompt_override, which would replace rather than compose normal prompt sources."
      alternatives_considered:
        - "Mutate the shared registry or set one global active skill, which would leak context between sessions."
        - "Use system_prompt_override, which would drop AGENTS.md, project overlays, and other normal prompt layers."
    - topic: "Daemon and structured-run lifecycle"
      decision: "Reuse the existing server bootstrap for a profile when it starts a new/private server; detect an already-running shared daemon for profile-sensitive structured runs and return a clear lifecycle error unless the per-session handoff is available."
      rationale: "The current schema path uses a shared daemon and has no profile field in the wire contract. Refusing an unsafe global mutation satisfies the isolation requirement without expanding the protocol."
      alternatives_considered:
        - "Silently apply profile environment to the client while using an existing daemon, which would not affect the target session and would mislead users."
        - "Add a durable protocol/session schema immediately, which is outside the requested one-shot profile capability and increases compatibility risk."

data_model:
  entities:
    - name: "NamedSessionProfile"
      description: "A user-authored optional entry under [profiles.<name>] containing session defaults and prompt context."
      fields:
        - name: "name"
          type: "String (BTreeMap key)"
          description: "Exact profile identifier selected by --profile."
          constraints: "Must be non-empty after trimming; no inheritance, aliases, or implicit fallback names."
        - name: "provider"
          type: "Option<String>"
          description: "Built-in or configured provider selection string."
          constraints: "Non-empty when present; validated through existing provider catalog/selection rules."
        - name: "model"
          type: "Option<String>"
          description: "Provider model identifier used when no higher-precedence model is supplied."
          constraints: "Non-empty when present; validated by existing provider/model route resolution before request."
        - name: "reasoning_effort"
          type: "Option<String>"
          description: "Provider-supported reasoning effort for this run."
          constraints: "Canonicalized through existing provider vocabulary and rejected when unsupported by the resolved provider/model."
        - name: "provider_profile"
          type: "Option<String>"
          description: "Existing named [providers.<name>] selection."
          constraints: "Must reference an available built-in or configured named provider profile; contradictory provider combinations fail."
        - name: "tool_profile"
          type: "Option<String>"
          description: "Existing ToolConfig baseline such as full, minimal/lite, acp, or none."
          constraints: "Uses current ToolConfig profile semantics and diagnostics."
        - name: "tools"
          type: "Vec<String>"
          description: "Explicit allow-list using existing ToolConfig enabled-list semantics."
          constraints: "Canonical aliases are normalized; `*`/`all` retain unrestricted behavior; unknown names fail with suggestions before request."
        - name: "disabled_tools"
          type: "Vec<String>"
          description: "Deny-list applied after the selected baseline/allow-list."
          constraints: "Canonical aliases are normalized and unknown names fail before request."
        - name: "skills"
          type: "Vec<String>"
          description: "Installed skill names whose prompts are included in this session."
          constraints: "Names must resolve in the effective working-directory SkillRegistry; configured order is deterministic and duplicates are handled explicitly."
        - name: "instructions"
          type: "Option<String>"
          description: "Additional additive system guidance for this session."
          constraints: "String only; empty/whitespace-only values add no section; content is never echoed in diagnostics."
      relationships:
        - target: "Config"
          type: "many-to-one"
          description: "Profiles are persisted in Config under a named map."
        - target: "ResolvedSessionProfile"
          type: "one-to-one"
          description: "One selected entry becomes one effective per-run overlay after precedence and validation."
    - name: "ResolvedSessionProfile"
      description: "Immutable effective provider, model, reasoning, tool, skill, and instruction choices for one run, including source/provenance decisions."
      fields:
        - name: "profile_name"
          type: "Option<String>"
          description: "Selected profile name, absent for the legacy no-profile path."
          constraints: "Only present after successful exact-name lookup."
        - name: "provider_and_model"
          type: "ProviderChoice + Option<String> + Option<String>"
          description: "Effective provider choice, model, and named provider_profile passed to existing startup."
          constraints: "Explicit values beat environment/profile values; provider/profile errors stop before request."
        - name: "reasoning_effort"
          type: "Option<String>"
          description: "Effective explicit effort, if any, applied through the provider setter."
          constraints: "Environment and invocation precedence is preserved and provider/model support is checked."
        - name: "tool_selection"
          type: "ToolSelection"
          description: "Effective allowed and disabled tool sets for the Agent/session."
          constraints: "Derived only through ToolConfig selection and validated against the constructed Registry."
        - name: "prompt_overlay"
          type: "SessionPromptOverlay"
          description: "Validated selected skill content and profile instructions for one session."
          constraints: "Session-local, deterministic ordering, additive to normal guidance, and not persisted as global config."
      relationships:
        - target: "NamedSessionProfile"
          type: "many-to-one"
          description: "The selected profile supplies only fields not won by invocation or environment."
        - target: "ToolSelection"
          type: "one-to-one"
          description: "The Agent uses this selection instead of reading a profile-specific global Config."
        - target: "SessionPromptOverlay"
          type: "one-to-one"
          description: "The Agent's prompt builder incorporates this overlay for the current session."
    - name: "SessionPromptOverlay"
      description: "Prompt-layer data attached to one Agent, containing profile-selected skill prompts and additional instructions."
      fields:
        - name: "skill_names"
          type: "Vec<String>"
          description: "Validated names retained for deterministic session context."
          constraints: "Resolved against the current session working directory; no shared registry mutation."
        - name: "skill_prompts"
          type: "Vec<String>"
          description: "Rendered Skill::get_prompt content in configured order."
          constraints: "Included exactly once in the static profile section."
        - name: "instructions"
          type: "Option<String>"
          description: "Profile-provided additive guidance."
          constraints: "Placed before dynamic user turns and never replaces normal system/project guidance."
      relationships:
        - target: "Agent"
          type: "one-to-one"
          description: "Each run Agent owns its overlay for prompt generation and session isolation."

