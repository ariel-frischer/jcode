feature:
  branch: "003-add-session-profiles"
  created: "2026-08-08"
  status: "Draft"
  input: "Implement named session profiles for jcode run (#721): add a persisted [profiles.<name>] configuration contract that can bundle provider, model, reasoning effort, tool profile or tool allow/deny lists, selected skills, and additional instructions; add --profile as a global CLI option usable with jcode run; apply profiles through the existing Config, provider_profile, ToolConfig, prompt skill, and instruction resolution paths with explicit invocation overrides winning; preserve behavior when unset; fail clearly for unknown or invalid profiles; add focused tests and update docs/changelog."

user_stories:
  - id: "US-001"
    title: "Define reusable session profiles"
    priority: "P1"
    as_a: "Jcode user who runs recurring types of tasks"
    i_want: "to persist a named bundle of provider, model, reasoning, tools, skills, and instructions"
    so_that: "I can reproduce a deliberate session setup without repeating a long list of options"
    why_this_priority: "A persisted, readable contract is the foundation for selecting a profile and must work before invocation behavior has value."
    independent_test: "Load a configuration containing one complete profile and inspect the resolved profile values without starting a provider request."
    acceptance_scenarios:
      - given: "The configuration contains [profiles.review] with valid provider, model, reasoning, tool, skill, and instruction values"
        when: "Jcode loads the configuration"
        then: "The named profile is available with every configured value preserved"
      - given: "The configuration contains no profiles section"
        when: "Jcode loads the configuration"
        then: "Configuration loading succeeds and existing defaults are unchanged"

  - id: "US-002"
    title: "Select a profile for a run"
    priority: "P1"
    as_a: "Jcode user invoking a one-shot task"
    i_want: "to select a named profile with a global --profile option"
    so_that: "jcode run starts with the intended session setup"
    why_this_priority: "Selection is the user-facing entry point and the requested feature must be usable directly with jcode run."
    independent_test: "Invoke jcode run with --profile against a fake provider and assert the outgoing session setup matches the selected profile."
    acceptance_scenarios:
      - given: "A valid profile named review exists"
        when: "The user runs jcode --profile review run \"Review this change\""
        then: "The run uses review's configured session values"
      - given: "The user omits --profile"
        when: "The user runs jcode run with the same message"
        then: "The run follows the pre-profile resolution path and behavior"

  - id: "US-003"
    title: "Override profile values per invocation"
    priority: "P1"
    as_a: "Jcode user with a temporary exception to a standard setup"
    i_want: "explicit invocation options to override corresponding profile values"
    so_that: "I can make a one-off change without editing persisted configuration"
    why_this_priority: "Predictable precedence prevents a profile from silently defeating an intentional command-line choice."
    independent_test: "Select a profile with conflicting provider, model, reasoning, and tool values, then provide explicit flags and verify each explicit value wins."
    acceptance_scenarios:
      - given: "review selects model A and tool profile minimal"
        when: "The invocation explicitly supplies model B and --tool-profile full"
        then: "The session uses model B and full tools while retaining other unset review values"
      - given: "An environment override conflicts with a selected profile"
        when: "The session is resolved without a conflicting command-line flag"
        then: "The existing environment-over-persisted precedence remains observable"

  - id: "US-004"
    title: "Apply prompt and skill context safely"
    priority: "P1"
    as_a: "Jcode user who relies on reusable guidance"
    i_want: "a profile's selected skills and additional instructions to participate in normal prompt resolution"
    so_that: "the model receives the same trusted context every time I select that profile"
    why_this_priority: "Skills and instructions are part of the requested bundle and must remain session-scoped and composable with existing guidance."
    independent_test: "Use a fake session with installed skills and inspect the resolved prompt for selected skill content and profile instructions without changing another session."
    acceptance_scenarios:
      - given: "A profile selects installed skills and includes additional instructions"
        when: "A run is created with that profile"
        then: "The existing skill and instruction resolution paths include the selected context in the new session"
      - given: "Two sessions select different profiles"
        when: "Both sessions resolve their prompts"
        then: "Each session receives only its own profile context plus the normal global/project context"

  - id: "US-005"
    title: "Understand profile failures"
    priority: "P1"
    as_a: "Jcode user diagnosing a failed run"
    i_want: "unknown and invalid profiles to fail with actionable diagnostics"
    so_that: "I can correct configuration before making a provider request"
    why_this_priority: "A profile is a persisted trust-boundary input; silently falling back could select the wrong provider, tools, or instructions."
    independent_test: "Exercise an unknown profile name, malformed profile field, unsupported reasoning value, and missing skill, and assert each error names the profile and corrective action."
    acceptance_scenarios:
      - given: "--profile names a profile that is not present"
        when: "jcode run starts"
        then: "The command exits before the request with an error naming the unknown profile and available choices"
      - given: "A selected profile contains an invalid field"
        when: "The profile is resolved"
        then: "The command exits with the field, supplied value, and corrective guidance instead of using a partial profile"

requirements:
  functional:
    - id: "FR-001"
      description: "The configuration MUST support a persisted [profiles.<name>] map whose entries are named session profiles."
      acceptance_criteria: "A TOML configuration with one or more profile tables loads, round-trips without losing profile values, and remains valid when the profiles section is absent."
    - id: "FR-002"
      description: "Each session profile MUST optionally define provider, model, reasoning effort, and the existing named provider_profile selection."
      acceptance_criteria: "Focused resolution tests cover each scalar independently and verify that an omitted scalar does not replace the corresponding existing default."
    - id: "FR-003"
      description: "Each session profile MUST optionally define tool_profile, an explicit tool allow-list, and a tool deny-list using the existing ToolConfig semantics."
      acceptance_criteria: "Profile resolution produces the same effective tool selection as the equivalent existing ToolConfig values, including profile baseline, allow-list restriction, and deny-list removal."
    - id: "FR-004"
      description: "Each session profile MUST optionally define selected skill names and additional instructions for the session prompt."
      acceptance_criteria: "A focused prompt test observes selected installed skills and profile instructions in the resolved session while preserving normal global and project guidance."
    - id: "FR-005"
      description: "Profile names and profile field values MUST be validated at configuration or selection time before a provider request is made."
      acceptance_criteria: "Invalid profile names, unsupported provider/model/reasoning/tool values, malformed list or instruction types, and unavailable selected skills produce errors that identify the profile and field."
    - id: "FR-006"
      description: "The CLI MUST expose --profile as a global option and jcode run MUST accept it before or after the run subcommand according to normal CLI parsing rules."
      acceptance_criteria: "CLI parsing tests accept both supported placements and pass the selected profile name into run resolution without changing unrelated commands."
    - id: "FR-007"
      description: "When --profile names an unknown profile, jcode run MUST fail clearly before contacting a provider or starting a request."
      acceptance_criteria: "The exit is non-success, the diagnostic includes the requested name and available profile names or the configuration location, and no provider fixture records a request."
    - id: "FR-008"
      description: "Explicit invocation overrides MUST win over matching profile values on a field-by-field basis."
      acceptance_criteria: "A precedence matrix verifies explicit provider, model, reasoning, provider_profile, tool profile, tool allow-list, and tool deny-list values over conflicting profile values; profile values still apply for fields left unset."
    - id: "FR-009"
      description: "Existing environment overrides MUST retain their documented precedence over persisted profile values, and the selected profile MUST take precedence over the unprofiled persisted defaults for fields it sets."
      acceptance_criteria: "Conflicting environment, selected-profile, base-config, and built-in values resolve in one documented order and are covered for provider/model/reasoning and tools."
    - id: "FR-010"
      description: "Profile skill selections MUST be resolved through the existing prompt skill path and remain scoped to the selected session."
      acceptance_criteria: "Two concurrent or sequential fake sessions using different profiles see only their own selected skill context, and the shared skill registry and unrelated sessions are unchanged."
    - id: "FR-011"
      description: "Profile additional instructions MUST be resolved through the existing instruction path with deterministic ordering relative to existing configuration, project guidance, and the user message."
      acceptance_criteria: "Prompt-resolution tests assert profile instructions are present exactly once, preserve existing guidance, and do not replace the user message or unrelated instruction sources."
    - id: "FR-012"
      description: "Selecting a profile MUST apply only to the current run/session and MUST NOT rewrite persisted configuration or silently mutate an unrelated running session."
      acceptance_criteria: "A run using a profile leaves the config file byte-equivalent apart from unrelated state, and a separate session without that profile retains its prior effective values."
    - id: "FR-013"
      description: "A profile containing an unsupported reasoning effort, provider, model, tool profile, malformed list, or invalid skill reference MUST fail with an actionable diagnostic rather than silently falling back or partially applying."
      acceptance_criteria: "Negative tests assert the error names the profile, offending key/value, and a valid alternative or correction; no provider request is emitted."
    - id: "FR-014"
      description: "When no profile is selected, all existing CLI, Config, provider, ToolConfig, skill, instruction, and prompt behavior MUST remain unchanged."
      acceptance_criteria: "Regression tests compare representative unset invocations and serialized configuration with the pre-profile resolution path, including the absence of a profiles section."
    - id: "FR-015"
      description: "User-facing configuration guidance MUST document the [profiles.<name>] shape, supported fields, precedence, session scope, and examples for jcode run."
      acceptance_criteria: "The default/example configuration or reference docs contain a valid complete profile example and explain unset, override, and invalid-value behavior."
    - id: "FR-016"
      description: "The feature MUST include focused tests for loading, round-tripping, selection, precedence, unset compatibility, tool composition, prompt skills, instructions, and negative diagnostics, plus a changelog entry."
      acceptance_criteria: "The relevant test targets pass and the changelog describes named session profiles and the --profile option without claiming unsupported behavior."
  non_functional:
    - id: "NFR-001"
      category: "compatibility"
      description: "Profiles are opt-in and must not change behavior, serialized defaults, provider selection, tool exposure, prompt content, or cost when unset."
      measurable_target: "100% of focused unset and absent-section regression cases match the existing effective values and request shapes."
    - id: "NFR-002"
      category: "usability"
      description: "Profile diagnostics must let a user correct unknown or invalid configuration without inspecting source code."
      measurable_target: "100% of negative cases identify the profile, offending key/value, and a valid alternative, available name, or corrective action."
    - id: "NFR-003"
      category: "reliability"
      description: "Profile overlays must be deterministic and isolated between sessions, including when configuration is reloaded or a daemon is already running."
      measurable_target: "Zero cross-session profile leakage or persisted-config mutation in focused isolation and reload tests."
    - id: "NFR-004"
      category: "security"
      description: "Profile resolution and diagnostics must not expose provider credentials, API keys, or secret instruction contents in logs or error summaries."
      measurable_target: "Secret-scanning and diagnostic tests find no credential values; only profile names, keys, redacted values, and lengths may be reported."
    - id: "NFR-005"
      category: "code_quality"
      description: "The implementation must reuse the existing Config, provider_profile, ToolConfig, prompt skill, and instruction resolution paths rather than creating parallel precedence rules."
      measurable_target: "Focused tests and repository guardrails pass with no new dependency-boundary or duplicate-resolution violations."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "A user can define a complete named session profile and reproduce its provider, model, reasoning, tool, skill, and instruction choices with one jcode run invocation."
      metric: "Complete-profile acceptance scenarios"
      target: "100% of documented complete-profile scenarios resolve every configured field correctly"
    - id: "SC-002"
      description: "Explicit command-line choices remain authoritative over selected profile values."
      metric: "Precedence matrix cases"
      target: "100% of conflicting explicit overrides win while unset fields inherit the profile"
    - id: "SC-003"
      description: "Existing users who do not select a profile experience no behavior or request-shape change."
      metric: "Unset and absent-section regression cases"
      target: "100% preserve the pre-feature effective configuration and prompt behavior"
    - id: "SC-004"
      description: "Users can diagnose and correct invalid profile selection or configuration before a provider request is sent."
      metric: "Unknown and invalid profile scenarios"
      target: "100% fail before provider contact with actionable, non-secret diagnostics"
    - id: "SC-005"
      description: "Profile context remains isolated to the selected run/session and does not alter persisted configuration or unrelated sessions."
      metric: "Isolation and persistence checks"
      target: "Zero observed cross-session leakage or unintended config writes"

key_entities:
  - name: "Named session profile"
    description: "A user-authored entry under [profiles.<name>] that provides optional session defaults."
    attributes:
      - "profile name"
      - "provider and provider_profile"
      - "model and reasoning effort"
      - "tool profile, allow-list, and deny-list"
      - "selected skills"
      - "additional instructions"
  - name: "Profile resolution"
    description: "The effective session configuration produced by combining the selected profile with environment, persisted defaults, built-in defaults, and explicit invocation overrides."
    attributes:
      - "selected profile source"
      - "effective provider and model"
      - "effective reasoning effort"
      - "effective tool selection"
      - "resolved skills and instruction layers"
      - "precedence decisions"
  - name: "Tool selection"
    description: "The existing ToolConfig-derived set of exposed and disabled tools for one session."
    attributes:
      - "baseline tool profile"
      - "explicit allowed tools"
      - "disabled tools"
      - "effective exposed set"
  - name: "Session prompt overlay"
    description: "The profile-provided skill and instruction context combined with the existing prompt sources for one run."
    attributes:
      - "selected skill names"
      - "loaded skill prompts"
      - "additional instructions"
      - "ordering relative to existing guidance"

edge_cases:
  - scenario: "The user omits --profile or the configuration has no profiles section."
    expected_behavior: "The existing behavior and serialized defaults remain unchanged, with no profile lookup or extra prompt/tool context."
  - scenario: "The requested profile name is empty, whitespace-only, or not present in the configuration."
    expected_behavior: "Selection fails before provider contact with the requested name and available profile names or configuration location."
  - scenario: "A profile field has the wrong TOML type or an unsupported value."
    expected_behavior: "The profile is rejected with the profile name, key, supplied value in a safe form, and corrective guidance; no partial overlay is used."
  - scenario: "A profile references a provider profile, model, or skill that is unavailable in the current environment."
    expected_behavior: "Resolution fails clearly at the existing owning boundary and identifies the missing reference without exposing credentials."
  - scenario: "A profile supplies tool_profile together with allow and deny lists."
    expected_behavior: "The existing ToolConfig composition rules apply deterministically: the profile establishes the baseline, the allow-list restricts it when present, and the deny-list removes entries."
  - scenario: "A profile contains an unknown tool name in an allow or deny list."
    expected_behavior: "Handling follows existing ToolConfig normalization and diagnostics, without granting an unintended tool or changing the unset behavior."
  - scenario: "An explicit invocation flag conflicts with a profile and an environment override also exists."
    expected_behavior: "The documented precedence order is applied consistently: explicit invocation, environment, selected profile, unprofiled persisted config, then built-in defaults."
  - scenario: "The selected profile has empty skills or additional instructions, or the profile is used while another session is active."
    expected_behavior: "Empty values add no context, and the selected overlay remains scoped to its own run without rewriting config or altering the other session."
  - scenario: "A profile is selected while a shared daemon is already running."
    expected_behavior: "The run does not silently change unrelated sessions or persisted daemon configuration; it either applies the profile through the existing per-session path or fails with a clear lifecycle diagnostic."

assumptions:
  - "Configuration profiles are stored in the existing user/project TOML configuration and use the literal [profiles.<name>] table shape."
  - "Profile field names align with existing contracts where they exist: provider, model, reasoning_effort, provider_profile, tool_profile, tools (allow-list), disabled_tools (deny-list), skills, and instructions."
  - "Tool profile and allow/deny lists may be combined because the existing ToolConfig resolver already defines their composition; no new tool semantics are introduced."
  - "Explicit invocation means a value supplied by the current command, not a parser default; an omitted flag leaves the corresponding profile value eligible."
  - "Existing environment-over-config precedence remains authoritative; selecting a profile overlays the unprofiled persisted defaults only for fields the profile sets."
  - "Selected skills must already be installed and resolvable by the existing session-scoped skill registry; profile selection does not install or fetch skills."
  - "Additional profile instructions are additive context resolved by the existing instruction path, while the user message remains the final task input."
  - "Profile names are exact, non-empty TOML table keys; profile inheritance, aliases, and implicit fallback names are not needed for the requested capability."

constraints:
  - "PRIN-001 applies: keep the change limited to named session profile configuration and jcode run resolution; report unrelated cleanup separately."
  - "PRIN-002 applies: preserve all CLI, Config, provider, tool, prompt, persisted, and serialized behavior when profile selection is unused."
  - "PRIN-003 applies: document and test explicit invocation > environment > selected profile > unprofiled persisted config > built-in defaults, while reusing existing resolver exceptions where required for compatibility."
  - "PRIN-004 applies: keep the persisted profile contract in the existing configuration ownership layer and route runtime application through existing provider, ToolConfig, skill, and instruction owners."
  - "PRIN-005 and PRIN-006 apply: focused positive, precedence, compatibility, isolation, and negative-path tests must cover every acceptance criterion and validate all external profile inputs."
  - "PRIN-007 applies: implementation delivery requires focused checks, the relevant build, and repository guardrails; this specification stage requires artifact validation."
  - "Profiles must not contain or reproduce provider credentials, API keys, or other secrets in configuration summaries, documentation examples, fixtures, or diagnostics."

out_of_scope:
  - "A profile-management CLI, interactive profile editor, profile deletion workflow, or profile discovery UI."
  - "Nested profiles, profile inheritance, aliases, environment-selected default profiles, or profile version migrations beyond the additive configuration contract."
  - "Changing the existing named provider profile ([providers.<name>]) contract, provider credentials, authentication flows, or provider catalog behavior."
  - "Installing, fetching, editing, or globally enabling skills as a side effect of selecting a session profile."
  - "Changing interactive /model behavior, ACP profile behavior, or adding a new /profile command unless required to preserve the existing run resolution contract."
  - "Remote profile synchronization, secret management, or sharing profiles between users or machines."

