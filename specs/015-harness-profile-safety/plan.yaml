plan:
  branch: "agent/jcode-8on"
  created: "2026-08-23"
  spec_path: "specs/015-harness-profile-safety/spec.yaml"

summary: |
  Extend the stable harness request contract and legacy daemon wire message additively. The bridge resolves string profile names by loading Jcode configuration and using Config::resolve_session_profile, then converts the resolved non-secret policy into the existing SessionProfileStartup wire object. Existing object-shaped profiles and omitted profiles retain their current behavior; profile resolution failures are converted to typed InvalidRequest API replies before subscribe state is marked pending.

  Add optional message run_safety data to jcode-protocol and feed it through server message handling into the existing RunSafetyCandidates resolver and Agent controller before provider work. The per-message invocation config is validated at the daemon trust boundary, emits a normal typed protocol error on failure, and is cleared/replaced for each turn so omitted fields preserve legacy behavior. Unit contract tests precede code, followed by isolated daemon/bridge and built-binary public API smokes.

