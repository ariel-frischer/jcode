  storage: "Existing JCODE_HOME configuration and session records; no new persistence."
  testing:
    framework: "Rust built-in test harness plus isolated socket/built-binary smoke scripts"
    approach: "TDD contract tests in harness and protocol crates, daemon integration tests with fake providers, then private-socket built-binary and free-model public API smokes."
  target_platform: "Jcode-supported Linux, macOS, and Windows server/client builds"
  project_type: "service"
  performance_goals: "No additional work for omitted fields; one bounded config load/profile resolution per named create request and constant-time safety installation per message."
  constraints:
    - "No credential-bearing data may enter SessionProfileStartup, diagnostics, or smoke receipts."
    - "Existing object-shaped profile and no-profile clients remain compatible."
    - "Safety controls are invocation-scoped and cannot persist to later messages."
    - "Invalid input fails before provider work without closing the client connection."
    - "No new external dependencies."
  scale_scope: "One bridge translation state per API connection and one active turn per attached session."

