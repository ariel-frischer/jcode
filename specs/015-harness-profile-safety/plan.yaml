research_findings:
  decisions:
    - topic: "Named profile input compatibility"
      decision: "Accept either a JSON string name or the existing object-shaped startup payload; resolve only strings in the bridge."
      rationale: "The released Go SDK sends a string while protocol-v1 Rust fixtures already model resolved objects."
      alternatives_considered:
        - "Change the Go SDK back to sending objects, which would leave released clients broken."
        - "Teach the daemon subscribe parser to accept strings, which duplicates config resolution below the bridge boundary."
    - topic: "Profile conversion ownership"
      decision: "Add a dependency-light conversion from ResolvedSessionProfile plus ToolConfig to SessionProfileStartup in jcode-base or a bridge-local explicit conversion using public resolved fields."
      rationale: "The bridge must forward the same credential-free effective values as CLI profile startup without depending on root CLI orchestration."
      alternatives_considered:
        - "Depend on src/cli/profile.rs, which violates crate layering."
        - "Forward only profile_name, which would not apply the resolved policy on the server."
    - topic: "Run-safety wire shape"
      decision: "Add an optional RunSafetyConfig field to daemon Message requests and matching optional stable harness request fields."
      rationale: "RunSafetyConfig already owns raw invocation semantics and serde defaults, avoiding a parallel wire validator."
      alternatives_considered:
        - "Send three unrelated ad hoc fields only in legacy JSON translation."
        - "Store safety on the session, which would leak one request's limits into later turns."
    - topic: "Daemon validation and errors"
      decision: "Resolve invocation/environment/persisted candidates before start_processing_message and return the existing typed daemon error event on validation failure."
      rationale: "This is the last canonical trust boundary before provider work and keeps environment/persisted precedence consistent."
      alternatives_considered:
        - "Validate only in the bridge, which other daemon clients could bypass."
        - "Let malformed values fail inside provider execution, which is too late and risks disconnects."

data_model:
  entities:
    - name: "SessionProfileSelection"
      description: "Public create-session profile input and its credential-free resolved startup overlay."
      fields:
        - name: "input"
          type: "Option<String | JSON object>"
          description: "Named profile from released SDKs or legacy resolved object."
          constraints: "Strings must be non-empty configured names; objects must deserialize as SessionProfileStartup."
        - name: "startup"
          type: "Option<SessionProfileStartup>"
          description: "Resolved daemon subscribe payload."
          constraints: "Contains no credentials or provider secrets."
      relationships: []
    - name: "HarnessTurnSafety"
      description: "Optional raw invocation limits for one message."
      fields:
        - name: "max_turns"
          type: "Option<String>"
          description: "Positive decimal maximum completed turns."
          constraints: "Validated by the canonical resolver."
        - name: "token_budget"
          type: "Option<String>"
          description: "Positive decimal native token-usage delta."
          constraints: "Validated by the canonical resolver."
        - name: "deadline"
          type: "Option<String>"
          description: "Absolute RFC3339 deadline."
          constraints: "Must include an explicit offset and be in the future."
      relationships:
        - target: "RunSafetyController"
          type: "one-to-one"
          description: "One message may install one invocation-scoped controller for its real turn."
    - name: "RunSafetyController"
      description: "Existing typed Agent enforcement state resolved from invocation, environment, and persisted candidates."
      fields:
        - name: "policy"
          type: "EffectiveRunSafetyPolicy"
          description: "Validated typed limits plus source metadata."
          constraints: "Must be replaced or absent for every new message."
      relationships: []

api_contracts:
  endpoints:
    - method: "JSONL"
      path: "create_session"
      description: "Create and attach a session with optional named or resolved profile input."
      request:
        content_type: "application/json"
        body_schema: "{req:create_session, working_dir?:string, profile?:string|SessionProfileStartup}"
      response:
        success_code: 200
        body_schema: "typed session_created/state events"
      errors:
        - code: 400
          description: "Invalid profile type, empty name, unknown name, or invalid configured profile."
    - method: "JSONL"
      path: "send_message"
      description: "Start a real turn with optional invocation-scoped safety controls."
      request:
        content_type: "application/json"
        body_schema: "{req:send_message, session_id:string, content:string, max_turns?:string, token_budget?:string, deadline?:string}"
      response:
        success_code: 200
        body_schema: "typed turn events ending in turn_done or bounded stop/error"
      errors:
        - code: 400
          description: "Invalid counter or deadline before provider work."

