          - "Existing single-message open and collapse behavior continues to work before asynchronous pending state is introduced."

  - number: 3
    title: "User Story 1 - Preview local and sibling-repository files inline"
    purpose: "Resolve local files first and fall back only to one safe same-relative-path match in an immediate sibling repository."
    story_reference: "US-001"
    independent_test: "Render a quoted relative path, prove the session-working-directory file wins, remove it, and prove exactly one immediate sibling repository match opens beneath the owning message with Markdown rendering."
    tasks:
      - id: "T005"
        title: "Add local-precedence and unique-sibling resolver tests"
        status: "Completed"
        type: "test"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T004"]
        acceptance_criteria:
          - "Tests cover a local relative file, a local-and-sibling collision where local wins, and exactly one eligible sibling repository containing the identical relative path."
          - "A direct sibling is eligible with either a .git directory or worktree .git file, while nested descendants and non-repository siblings are ignored."
          - "Relative references with supported line and column suffixes resolve the same underlying file as the unsuffixed reference."
      - id: "T006"
        title: "Implement deterministic local-first and unique-sibling resolution"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T005"]
        acceptance_criteria:
          - "Relative resolution canonicalizes and checks the session working directory candidate before enumerating any siblings."
          - "Fallback inspects only direct child repository directories of the session repository parent at the unchanged relative path and accepts exactly one safe regular file."
          - "Resolution does not recursively search, search by basename, inspect ancestors, or choose the first result from multiple matches."
      - id: "T007"
        title: "Integrate resolved local and sibling Markdown previews beneath the owning message"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs, crates/jcode-tui/src/tui/app/navigation.rs, crates/jcode-tui/src/tui/ui_prepare.rs"
        dependencies: ["T006"]
        acceptance_criteria:
          - "Quoted plain paths and plain Markdown link targets reach the canonical resolver without requiring an @ prefix."
          - "A uniquely resolved sibling .md, .mdx, or .markdown file sets Markdown presentation and renders beneath the exact owning message."
          - "Clicking the same resolved reference again collapses only that message's preview."

  - number: 4
    title: "User Story 2 - Receive safe and unambiguous preview results"
    purpose: "Reject ambiguous, missing, escaped, non-text, binary, oversized, and non-regular targets with deterministic bounded outcomes."
    story_reference: "US-002"
    independent_test: "Exercise ambiguous sibling matches, no match, traversal and symlink escapes, directories, invalid UTF-8, NUL-bearing bytes, and files around the 512 KiB limit, then verify no unintended content is exposed."
    tasks:
      - id: "T008"
        title: "Add resolver safety, ambiguity, and bounded-reader tests"
        status: "Completed"
        type: "test"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T007"]
        acceptance_criteria:
          - "Tests cover zero and multiple sibling matches, non-repository and nested matches, traversal, symlink escape where supported, directories, and canonicalization failures."
          - "Reader tests cover exactly 512 KiB, 512 KiB plus one byte, invalid UTF-8, NUL-bearing bytes, empty files, and metadata/read races without unbounded allocation."
          - "Ambiguous and unsafe cases expose none of the candidate contents and return the established unavailable outcome."
      - id: "T009"
        title: "Implement canonical boundary checks and bounded binary-safe reads"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T008"]
        acceptance_criteria:
          - "Relative local and sibling candidates are canonical regular files beneath their canonical permitted roots, so traversal and symlink escapes are rejected."
          - "The reader opens the selected file and consumes at most 512 KiB plus one sentinel byte, rejecting overflow without relying only on metadata length."
          - "Invalid UTF-8, NUL-bearing binary data, missing files, directories, and read failures produce a stable unavailable result without panic or lossy content exposure."
      - id: "T010"
        title: "Preserve explicit home and absolute path policy while surfacing unavailable results"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-002"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs, crates/jcode-tui/src/tui/app/navigation.rs"
        dependencies: ["T009"]
        acceptance_criteria:
          - "Home-relative and absolute references preserve established explicit-path behavior and never use sibling fallback."
          - "Missing, ambiguous, unsafe, oversized, and non-text references are consumed as file-preview attempts and show the established unavailable notice rather than opening an unrelated external target."
          - "The suffix parser supplies the underlying path consistently to resolution, availability notices, and extension checks."

