          - "Tests cover quoted plain paths, plain Markdown targets, relative, home-relative, Unix absolute, and Windows drive-prefixed paths."
          - "Right-to-left parsing strips supported :line and :line:column numeric suffixes while preserving colons that belong to the path and rejecting URL or mailto targets."
          - "Two transcript messages with identical content and path text receive distinct keys based on message position plus stable message hash."
      - id: "T003"
        title: "Implement canonical FileReference parsing and InlineFilePreviewKey"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: null
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs, crates/jcode-tui/src/tui/mod.rs"
        dependencies: ["T002"]
        acceptance_criteria:
          - "One reusable parser returns the display path, Relative/HomeRelative/Absolute kind, optional line, optional column, and exact message key without performing filesystem I/O."
          - "Numeric navigation suffixes are excluded from filesystem lookup and extension checks, including for paths containing other colons."
          - "InlineFilePreviewKey contains message index and stable message hash and is suitable for loaded and pending preview maps."
      - id: "T004"
        title: "Migrate App and renderer-facing preview state to exact message keys"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: null
        file_path: "crates/jcode-tui/src/tui/app.rs, crates/jcode-tui/src/tui/app/tui_lifecycle.rs, crates/jcode-tui/src/tui/app/state_ui_messages.rs, crates/jcode-tui/src/tui/app/tui_state.rs, crates/jcode-tui/src/tui/ui_prepare.rs"
