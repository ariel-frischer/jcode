          - "Two duplicate-text messages loading the same display path maintain independent pending, loaded, and collapsed states."
      - id: "T012"
        title: "Add pending PreviewRequest state and background worker spawning"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-003"
        file_path: "crates/jcode-tui/src/tui/app.rs, crates/jcode-tui/src/tui/app/inline_file_preview.rs, crates/jcode-tui/src/tui/app/tui_lifecycle.rs"
        dependencies: ["T011"]
        acceptance_criteria:
          - "App owns pending requests keyed by InlineFilePreviewKey plus a monotonically increasing request generation."
          - "Each request captures its exact message key, display-messages version, display path, and completion receiver."
          - "Filesystem resolution and bounded reading run via tokio spawn_blocking when a runtime exists and a standard thread fallback in runtime-less tests, with one bounded completion per request."
      - id: "T013"
        title: "Poll preview completions from local and remote TUI maintenance loops"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-003"
        file_path: "crates/jcode-tui/src/tui/app/local.rs, crates/jcode-tui/src/tui/app/remote.rs, crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T012"]
        acceptance_criteria:
          - "Both local/test and normal remote-client loops use non-blocking receiver polling and never wait synchronously for preview completion."
          - "A current successful result moves atomically from pending to loaded state, and worker disconnection produces a visible unavailable result without panic."
          - "Polling work is proportional to the small pending-request set and does not introduce a busy wait."
      - id: "T014"
        title: "Reject stale completions and clear pending ownership on lifecycle changes"
        status: "Completed"
        type: "implementation"
        parallel: false
        story_id: "US-003"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs, crates/jcode-tui/src/tui/app/state_ui_messages.rs, crates/jcode-tui/src/tui/app/tui_lifecycle.rs"
        dependencies: ["T013"]
        acceptance_criteria:
