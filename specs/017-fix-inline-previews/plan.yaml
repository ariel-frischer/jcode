implementation_phases:
  - phase: 1
    name: "Identity and parsing foundation"
    goal: "Create unambiguous message/request ownership and one reusable parser without changing successful current behavior."
    deliverables:
      - "Add InlineFilePreviewKey using message index plus stable message hash and migrate renderer/state lookups from hash-only keys."
      - "Add right-to-left path, line, and column suffix parsing that preserves URL rejection, query/fragment handling, Windows drive prefixes, home paths, and absolute paths."
      - "Add regression tests proving duplicate message text remains isolated and all supported unsuffixed and suffixed paths identify the same file."
  - phase: 2
    name: "Safe deterministic resolution"
    goal: "Resolve local and sibling-repository files with exact precedence and no arbitrary or unsafe fallback."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Split explicit absolute/home resolution from boundary-constrained relative resolution."
      - "Canonicalize the session root and local candidate, rejecting traversal or symlink escapes."
      - "Enumerate only immediate sibling repositories, test the identical relative path, and return success only for exactly one safe regular-file match."
      - "Add focused local-wins, unique-sibling, missing, ambiguous, nested, non-repository, traversal, and symlink-boundary tests."
  - phase: 3
    name: "Bounded asynchronous loading"
    goal: "Move all potentially blocking resolution and file reading off the TUI interaction path while keeping results correctly owned."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Add pending request state, request generations, background spawn_blocking or thread fallback, and non-blocking receiver polling."
      - "Read at most 512 KiB plus one byte, reject overflow, invalid UTF-8, NUL-bearing binary content, directories, and worker failures."
      - "Poll completions in local and remote loops and discard requests whose generation, message key, path, or transcript identity is no longer current."
      - "Clear or cancel pending state during collapse, supersession, transcript clear, and App lifecycle resets."
  - phase: 4
    name: "Routing and rendering compatibility"
    goal: "Integrate resolved async results while preserving all current dev link and inline interaction semantics."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Keep quoted plain and plain Markdown paths inline-clickable without @."
      - "Preserve configured external HTML opening and use the parsed underlying path for extension and resolution checks."
      - "Preserve Markdown rendering, ordinary text rendering, unavailable notices, collapse, copy selection, and transcript scrolling."
      - "Update inline preview documentation to reflect the implemented current state."
  - phase: 5
    name: "Acceptance and runtime validation"
    goal: "Demonstrate correctness, responsiveness, safety, compatibility, and execution by the intended binary."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Run exact and module-scoped jcode-tui preview tests, including 100-iteration stale, duplicate, and ambiguous stress checks."
      - "Run cargo fmt checks, cargo check or test for jcode-tui, and a coordinated TUI selfdev build."
      - "Run scripts/check_guardrails.sh and record any proven unrelated baseline failures without widening scope."
      - "Run a newly built jcode instance on an isolated socket and exercise a local and unique sibling Markdown preview while confirming the resolved executable."
      - "Measure delayed-load interactions against the 100 ms target using deterministic test instrumentation or a bounded runtime probe."

