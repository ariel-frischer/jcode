research_findings:
  decisions:
    - topic: "Canonical feature ownership"
      decision: "Implement the behavior in crates/jcode-tui, centered on tui/app/inline_file_preview.rs and the existing App/TuiState/rendering seams."
      rationale: "The preview is local, transient presentation state. Current dev already owns detection, resolution, link routing, rendering, copy, and scrolling in jcode-tui, so moving it server-side would broaden contracts without benefit."
      alternatives_considered:
        - "Move preview resolution to jcode-app-core or the shared server."
        - "Create a new filesystem preview crate or protocol message."
    - topic: "Cross-repository resolution policy"
      decision: "For relative paths, resolve the canonical session-working-directory candidate first. If absent, enumerate only direct child directories of its parent that are sibling repositories, test the identical relative path under each canonical sibling root, and accept only one safe regular-file match."
      rationale: "This implements local precedence, exact-path fallback, and deterministic ambiguity handling with work proportional only to the immediate repository neighborhood. Recognize repositories through a .git directory or worktree .git file rather than recursively searching."
      alternatives_considered:
        - "Recursively search the workspace or filesystem by basename."
        - "Choose the first sibling match returned by directory iteration."
        - "Search ancestors, descendants, or differently located paths."
    - topic: "Path safety and compatibility"
      decision: "Parse navigation suffixes separately, preserve absolute and home-relative behavior, and canonicalize relative local and sibling candidates before verifying they remain beneath their permitted root."
      rationale: "Right-to-left numeric suffix parsing preserves colons inside paths, including Windows drive prefixes, while canonical boundary checks reject traversal and symlink escapes without removing established explicit absolute or home path support."
      alternatives_considered:
        - "Treat :line and :line:column text as part of the filename."
        - "Lexically reject every path containing .. without canonicalization."
        - "Ban all absolute and home-relative previews."
    - topic: "Asynchronous loading model"
      decision: "Adapt PR 2's bounded background worker plus mpsc polling pattern, using tokio spawn_blocking when a runtime exists and a standard thread fallback for tests or runtime-less contexts. Poll from both local and remote TUI maintenance loops."
      rationale: "The codebase already uses background workers and try_recv polling for filesystem discovery and picker previews. This keeps blocking metadata, directory enumeration, canonicalization, and reads off the interaction path without introducing a new dependency or async ownership model."
      alternatives_considered:
        - "Continue synchronous std::fs calls inside mouse handling."
        - "Make the entire navigation and rendering stack async."
        - "Create an unbounded global task service for this single feature."
    - topic: "Preview and request identity"
      decision: "Key loaded and pending state by message index plus stable message hash, and add a monotonically increasing request generation or equivalent token captured with the display-messages version and requested display path."
      rationale: "The current hash-only map collides for duplicate messages. Position plus content identity isolates duplicates, while a request token and current-message validation discard superseded or stale completions."
      alternatives_considered:
        - "Continue keying only by stable_cache_hash."
        - "Key only by visible path text."
        - "Attach the result to whichever message currently occupies the original index."
    - topic: "Bounded and binary-safe reads"
      decision: "Open the resolved file and read at most 512 KiB plus one sentinel byte, reject overflow, invalid UTF-8, and NUL-bearing binary content, then derive Markdown presentation from the resolved extension."
      rationale: "This avoids metadata-only size races and unbounded allocation, matches PR 2's useful hardening, and preserves current Markdown rendering through InlineFilePreview.markdown."
      alternatives_considered:
        - "Use std::fs::read_to_string after metadata length inspection."
        - "Render arbitrary bytes lossily."
        - "Increase or remove the established 512 KiB bound."
    - topic: "Link-routing compatibility"
      decision: "Retain current dev routing order and html_file_open behavior, but share the suffix parser and safe resolver so external HTML opening and inline preview target the same underlying file."
      rationale: "PR 2's navigation branch would route plain Markdown differently and conflict with the specification. Surgical reuse avoids regressing local product behavior."
      alternatives_considered:
        - "Adopt PR 2 navigation.rs and link_opening.rs wholesale."
        - "Require @ prefixes for inline previews."
        - "Force HTML files into inline preview mode."

data_model:
  entities:
    - name: "FileReference"
      description: "A clickable local file reference rendered in one transcript message."
      fields:
        - name: "display_path"
          type: "String"
          description: "The path text shown to the user after removing navigation metadata."
          constraints: "Must not be a URL or mailto target."
        - name: "path_kind"
          type: "Relative | HomeRelative | Absolute"
          description: "Selects the applicable resolution and safety policy."
          constraints: "Relative paths may use sibling fallback. Home-relative and absolute paths do not."
        - name: "line"
          type: "Option<u64>"
          description: "Optional navigation line parsed from a numeric suffix."
          constraints: "Must be parsed from the right and excluded from filesystem lookup."
        - name: "column"
          type: "Option<u64>"
          description: "Optional navigation column parsed from a numeric suffix."
          constraints: "Valid only with the supported numeric suffix form and excluded from filesystem lookup."
        - name: "message_key"
          type: "InlineFilePreviewKey"
          description: "Identity of the exact transcript message that owns the preview."
          constraints: "Contains message index and stable message hash so duplicate text remains isolated."
      relationships:
        - target: "PreviewRequest"
          type: "one-to-many"
          description: "A reference may be clicked repeatedly, creating superseding load requests over time."
    - name: "SiblingRepositoryMatch"
      description: "A safe same-relative-path regular file found under one immediate sibling repository."
      fields:
        - name: "repository_root"
          type: "PathBuf"
          description: "Canonical direct sibling repository root."
          constraints: "Must be a direct child of the session repository parent and contain a .git directory or file."
        - name: "relative_path"
          type: "PathBuf"
          description: "The unchanged relative file path from the clicked reference."
          constraints: "Must not escape the canonical repository root after resolution."
        - name: "resolved_file"
          type: "PathBuf"
          description: "Canonical candidate file path."
          constraints: "Must be a regular file beneath repository_root."
      relationships:
        - target: "PreviewRequest"
          type: "many-to-one"
          description: "Zero, one, or multiple candidates determine unavailable, success, or ambiguous resolution."
    - name: "PreviewRequest"
      description: "Transient background work that resolves and reads one file reference."
      fields:
        - name: "request_id"
          type: "u64"
          description: "Monotonic generation distinguishing superseded requests."
          constraints: "Must match the current pending request before a result can be applied."
        - name: "message_key"
          type: "InlineFilePreviewKey"
          description: "Exact owner of the requested preview."
          constraints: "Must still match the message at completion time."
        - name: "display_messages_version"
          type: "u64"
          description: "Transcript generation captured when loading starts."
          constraints: "A changed version causes stale-result rejection unless exact ownership validation proves the request remains current."
        - name: "display_path"
          type: "String"
          description: "Stable user-facing label used for loading, success, collapse, and failure notices."
          constraints: "Must correspond to the parsed underlying file reference."
        - name: "receiver"
          type: "std::sync::mpsc::Receiver<Result<PreviewResult, PreviewError>>"
          description: "Non-blocking completion channel polled by the TUI loops."
          constraints: "Disconnected workers produce a visible failure and never panic."
      relationships:
        - target: "FileReference"
          type: "many-to-one"
          description: "Each request loads one selected reference."
        - target: "PreviewResult"
          type: "one-to-one"
          description: "A completed current request yields one loaded or unavailable result."
    - name: "PreviewResult"
      description: "Bounded loaded content or a deterministic unavailable outcome."
      fields:
        - name: "resolved_file"
          type: "Option<PathBuf>"
          description: "The selected canonical local or unique sibling file."
          constraints: "Absent for missing, ambiguous, unsafe, oversized, or non-text outcomes."
        - name: "content"
          type: "Option<String>"
          description: "UTF-8 preview content."
          constraints: "At most 512 KiB and rejected when invalid UTF-8 or binary NUL content is detected."
        - name: "markdown"
          type: "bool"
          description: "Whether the renderer should use Markdown presentation."
          constraints: "True only for md, mdx, or markdown extensions."
        - name: "status"
          type: "Loaded | Unavailable"
          description: "Determines whether content is inserted or an established notice is shown."
          constraints: "Ambiguous resolution must always be Unavailable."
      relationships:
        - target: "PreviewRequest"
          type: "one-to-one"
          description: "The result is applied only while its request and owner remain current."

