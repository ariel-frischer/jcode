correction:
  date: "2026-08-25"
  reason: "Sibling discovery is an unwanted behavior introduced from a mistaken problem statement."
  binding_override: "Relative paths resolve only against the session working directory. Do not enumerate parents, siblings, or unrelated repositories. Explicit ../, absolute, and home-relative paths keep their established behavior. This override supersedes every sibling-fallback design item below, which remains only as historical planning context."

summary: |
  Keep inline file previews owned by the jcode-tui client and extend the existing click-to-preview path with one canonical parser, resolver, bounded reader, and asynchronous result lifecycle. Relative paths resolve against the session working directory first. Only when that file is absent will resolution inspect immediate sibling repository directories at the identical relative path, accept exactly one safe file, and reject missing, ambiguous, nested, traversal, and symlink-escape outcomes.

  Adapt only the applicable hardening from ariel-frischer/jcode PR 2: right-to-left numeric line and column suffix stripping, bounded byte reads, binary-safe UTF-8 handling, background loading, and stale-result rejection. Preserve current dev behavior that PR 2 diverged from, including quoted plain paths and plain Markdown links opening inline, Markdown rendering, configured external HTML opening, home and absolute paths, collapse, copy, scrolling, and established unavailable notices. Preview ownership will use message position plus stable message hash and a request generation so duplicate-text messages and superseded loads cannot cross-wire.

technical_context:
  language: "Rust 2024 edition"
  framework: "Ratatui 0.30 and Crossterm 0.29 TUI"
  primary_dependencies:
    - name: "tokio"
      version: "1"
      purpose: "Use the existing runtime and spawn_blocking support for non-blocking filesystem preview work."
    - name: "ratatui"
      version: "0.30"
      purpose: "Render bounded inline previews beneath the owning transcript message."
    - name: "crossterm"
      version: "0.29"
      purpose: "Preserve mouse click, copy selection, and scrolling interaction behavior."
    - name: "dirs"
      version: "5"
      purpose: "Preserve established home-relative path expansion."
    - name: "tempfile"
      version: "3"
      purpose: "Build isolated local, sibling, ambiguous, unsafe, binary, and oversized filesystem fixtures in tests."
  storage: "None. Preview state is transient in-memory TUI state and file content is never persisted by this feature."
  testing:
    framework: "Rust built-in test framework with Ratatui TestBackend and tempfile fixtures"
    approach: "Add pure resolver and bounded-reader unit tests, App state and async lifecycle tests, rendered click/collapse/copy/scroll regression tests, focused jcode-tui package checks, a TUI build, guardrails, and an isolated-socket runtime smoke test using the newly built binary."
  target_platform: "Jcode TUI on supported Linux, macOS, and Windows targets, with platform-safe path parsing"
  project_type: "cli"
  performance_goals: "Keep filesystem resolution and reads off the interactive event path so 95% of ordinary interactions remain below 100 ms during loading, cap every preview read at 512 KiB plus one sentinel byte, and produce zero stale or ambiguous attachments across 100 repeated stress iterations."
  constraints:
    - "Preserve current dev plain-Markdown and quoted plain-path inline preview semantics without requiring an @ prefix."
    - "Preserve configured external opening for HTML files and existing home-relative and absolute-path behavior."
    - "Resolve relative paths locally first, then inspect only immediate sibling repositories at the same relative path."
    - "Do not recursively search the filesystem or select among multiple sibling matches."
    - "Canonicalize and boundary-check relative local and sibling candidates so traversal and symlink escapes do not expose content."
    - "Use bounded, binary-safe reads and do not block the TUI event loop."
    - "Do not merge or import PR 2 wholesale and do not include unrelated refactors."
    - "Serialize Rust builds, tests, Clippy, and guardrail runs on the resource-constrained development machine."
  scale_scope: "One transient preview request per clicked message/path, a small map of open or pending previews, and a bounded scan of direct children of one repository parent directory."

