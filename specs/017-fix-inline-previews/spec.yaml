feature:
  branch: "017-fix-inline-previews"
  created: "2026-08-25"
  status: "Draft"
  input: "Fix cross-repository inline file previews and integrate applicable hardening and async loading from ariel-frischer/jcode PR 2 while preserving current dev plain-Markdown inline previews. Bead jcode-2hl defines scope and acceptance."

user_stories:
  - id: "US-001"
    title: "Preview local and sibling-repository files inline"
    priority: "P0"
    as_a: "Jcode TUI user working across related repositories"
    i_want: "clicking a rendered local file path to open a bounded inline preview, including when a uniquely matching relative path exists in an immediate sibling repository"
    so_that: "I can inspect referenced content without leaving the conversation or manually locating the repository"
    why_this_priority: "Cross-repository resolution is the core defect and requested outcome."
    independent_test: "Render a quoted plain relative path, verify session-directory precedence, then remove the local file and verify that exactly one same-relative-path sibling match opens inline and renders Markdown."
    acceptance_scenarios:
      - given: "a quoted plain relative path refers to a file present under the session working directory"
        when: "the user clicks the rendered path"
        then: "the file opens as a bounded inline preview beneath the owning message"
      - given: "the relative path is absent under the session working directory and exactly one immediate sibling repository contains the same relative path"
        when: "the user clicks the rendered path"
        then: "the sibling-repository file opens inline and Markdown content is rendered"
      - given: "both the session working directory and a sibling repository contain the same relative path"
        when: "the user clicks the rendered path"
        then: "the session-working-directory file is selected"

  - id: "US-002"
    title: "Receive safe and unambiguous preview results"
    priority: "P1"
    as_a: "Jcode TUI user"
    i_want: "ambiguous, missing, oversized, non-text, or unsafe file references to fail predictably"
    so_that: "the interface never guesses incorrectly, exposes unintended files, or becomes unusable"
    why_this_priority: "Repository safety and deterministic failure behavior are required hardening."
    independent_test: "Exercise ambiguous sibling matches, absent files, paths outside allowed boundaries, non-UTF-8 content, and content beyond the preview limit, then verify unavailable or bounded outcomes without arbitrary selection."
    acceptance_scenarios:
      - given: "two or more immediate sibling repositories contain the same missing relative path"
        when: "the user requests a preview"
        then: "no file is selected and the preview reports that the file is unavailable"
      - given: "the resolved file contains invalid text bytes or exceeds the preview bound"
        when: "the user requests a preview"
        then: "the result is binary-safe, bounded, and does not disrupt the TUI"
      - given: "a relative path would escape the permitted repository scope"
        when: "the user requests a preview"
        then: "the file is not exposed"

  - id: "US-003"
    title: "Keep previews responsive and attached to the correct message"
    priority: "P1"
    as_a: "Jcode TUI user navigating an active conversation"
    i_want: "file previews to load without blocking interaction and to remain associated with the exact message and path I clicked"
    so_that: "I can continue working while loading occurs and never see stale or cross-wired content"
    why_this_priority: "Async loading must not introduce stale-result or duplicate-message collisions."
    independent_test: "Delay preview completion while changing messages and open identical path text from duplicate messages, then verify responsiveness and exact result ownership."
    acceptance_scenarios:
      - given: "a preview load is in progress"
        when: "the user scrolls, copies text, or interacts elsewhere"
        then: "the TUI remains responsive"
      - given: "the owning message changes before its preview load completes"
        when: "the stale result arrives"
        then: "the result is discarded rather than attached to the changed message"
      - given: "two distinct messages contain identical file-path text"
        when: "the user opens either preview"
        then: "each preview state remains isolated to the selected message"

  - id: "US-004"
    title: "Preserve established link and preview behavior"
    priority: "P1"
    as_a: "existing Jcode TUI user"
    i_want: "the cross-repository fix to preserve current plain-Markdown preview and configured link-opening behavior"
    so_that: "the fix does not regress familiar navigation, viewing, or interaction workflows"
    why_this_priority: "Current dev behavior intentionally differs from PR 2 and must remain intact."
    independent_test: "Verify plain Markdown paths, HTML external mode, home and absolute paths, line and column suffixes, collapse, copy, scrolling, and missing-file behavior before and after the change."
    acceptance_scenarios:
      - given: "a plain Markdown file path is rendered in a message"
        when: "the user clicks it"
        then: "it remains eligible for inline preview without requiring an @ prefix"
      - given: "a supported file reference includes a line or column suffix"
        when: "the user opens it"
        then: "the suffix targets the underlying file rather than becoming part of the file name"
      - given: "HTML links are configured to open externally"
        when: "the user clicks an HTML link"
        then: "the configured external-open behavior is preserved"
      - given: "an inline preview is open"
        when: "the user clicks the same path again"
        then: "the preview collapses while copy and scroll behavior remain usable"

requirements:
  functional:
    - id: "FR-001"
      description: "The product MUST keep quoted plain paths and plain Markdown file paths clickable for inline preview without requiring an @ prefix."
      acceptance_criteria: "A quoted plain path and a plain Markdown path each open inline from a rendered message."
    - id: "FR-002"
      description: "The product MUST resolve relative file references against the session working directory before considering any fallback."
      acceptance_criteria: "When matching files exist locally and in siblings, the local session-working-directory file is previewed."
    - id: "FR-003"
      description: "When a relative file is absent from the session working directory, the product MUST allow fallback only when exactly one immediate sibling repository contains the same relative path."
      acceptance_criteria: "One unique immediate sibling match opens, while nested or differently located matches do not qualify."
    - id: "FR-004"
      description: "The product MUST treat multiple qualifying sibling matches as ambiguous and MUST NOT select one arbitrarily."
      acceptance_criteria: "Two qualifying sibling matches produce an unavailable result and neither file content is shown."
    - id: "FR-005"
      description: "The product MUST report an unavailable result when no permitted local or sibling match exists."
      acceptance_criteria: "An absent path produces the established unavailable behavior without opening unrelated content."
    - id: "FR-006"
      description: "The product MUST preserve repository safety boundaries for relative, home-relative, and absolute paths."
      acceptance_criteria: "Supported safe paths retain their established behavior, and traversal outside permitted scope does not expose content."
    - id: "FR-007"
      description: "The product MUST interpret supported line and column suffixes as navigation metadata for the underlying file rather than as part of its path."
      acceptance_criteria: "References with each supported suffix resolve the same underlying file as the unsuffixed reference."
    - id: "FR-008"
      description: "The product MUST bound preview content and handle arbitrary file bytes without crashing, corrupting the interface, or reading unbounded content."
      acceptance_criteria: "Oversized and invalid-text files produce a bounded, stable preview outcome and the TUI remains operational."
    - id: "FR-009"
      description: "The product MUST load file preview content without blocking normal TUI interaction."
      acceptance_criteria: "Scrolling, copying, and other ordinary interaction remain available while a deliberately delayed preview is loading."
    - id: "FR-010"
      description: "The product MUST discard a completed preview result when its owning message or request identity is no longer current."
      acceptance_criteria: "A delayed result cannot attach after the owning message changes or the request is superseded."
    - id: "FR-011"
      description: "The product MUST distinguish preview state for separate messages even when their visible text or file references are identical."
      acceptance_criteria: "Opening or collapsing a preview on one duplicate-text message does not change the other message's preview."
    - id: "FR-012"
      description: "The product MUST render Markdown files as Markdown within the bounded inline preview."
      acceptance_criteria: "A uniquely resolved sibling Markdown file displays rendered Markdown rather than an unformatted raw-path result."
    - id: "FR-013"
      description: "The product MUST preserve configured external opening for HTML links."
      acceptance_criteria: "With external HTML opening enabled, clicking an HTML link follows the existing external behavior rather than forcing an inline preview."
    - id: "FR-014"
      description: "The product MUST preserve existing preview collapse, copy, scroll, home-path, absolute-path, and missing-file behaviors."
      acceptance_criteria: "Regression checks for each named behavior pass with the same user-observable outcome as current dev."
    - id: "FR-015"
      description: "The product MUST limit sibling fallback to same-relative-path matches in immediate sibling directories and MUST NOT perform recursive filesystem search."
      acceptance_criteria: "A match outside an immediate sibling at the same relative path is not selected."

  non_functional:
    - id: "NFR-001"
      category: "performance"
      description: "Preview loading must preserve interactive responsiveness."
      measurable_target: "During preview loading, 95% of ordinary user interactions complete without a user-visible pause longer than 100 milliseconds."
    - id: "NFR-002"
      category: "reliability"
      description: "Preview results must be deterministic and correctly associated under concurrent or superseded requests."
      measurable_target: "Across 100 repeated delayed, stale, ambiguous, and duplicate-message test runs, zero results attach to the wrong message and zero ambiguous paths select a file."
    - id: "NFR-003"
      category: "security"
      description: "Cross-repository fallback must not broaden access beyond the explicitly permitted repository neighborhood and path rules."
      measurable_target: "All traversal, nested-search, ambiguous-match, and out-of-scope path cases expose zero unintended file contents."
    - id: "NFR-004"
      category: "usability"
      description: "Success and failure states must remain understandable and consistent with existing inline previews."
      measurable_target: "All supported paths either show the intended bounded content or a clear unavailable result, with no silent arbitrary fallback."
    - id: "NFR-005"
      category: "code_quality"
      description: "The change must preserve existing supported behavior and include focused automated coverage for new and hardened cases."
      measurable_target: "Focused preview tests, the TUI build, and isolated runtime validation all pass with no regression in the listed established behaviors."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can open a uniquely matching same-relative-path file from an immediate sibling repository directly beneath the owning message."
      metric: "Successful previews across the defined unique sibling-match scenarios"
      target: "100% of qualifying scenarios open the intended file and render Markdown when applicable."
    - id: "SC-002"
      description: "Users never receive an arbitrary file when a sibling lookup is ambiguous or absent."
      metric: "Incorrect file selections across ambiguous and missing scenarios"
      target: "0 incorrect selections across all acceptance tests."
    - id: "SC-003"
      description: "Users can continue interacting normally while preview content loads."
      metric: "User-visible interaction delay during preview loading"
      target: "95% of measured interactions complete within 100 milliseconds."
    - id: "SC-004"
      description: "Users never see stale preview content attached to a changed or duplicate message."
      metric: "Misattached preview results in repeated concurrency and duplicate-message checks"
      target: "0 misattachments in 100 repeated runs."
    - id: "SC-005"
      description: "Existing inline preview and configured link workflows remain unchanged except for the intended sibling fallback."
      metric: "Passing regression scenarios for plain Markdown, external HTML opening, path forms, collapse, copy, scroll, suffixes, and missing files"
      target: "100% of listed regression scenarios pass."

key_entities:
  - name: "File Reference"
    description: "A rendered path a user can select from a conversation message."
    attributes:
      - "displayed path text"
      - "underlying path without navigation suffix"
      - "optional line and column target"
      - "owning message identity"
  - name: "Preview Request"
    description: "A user's request to resolve and display one file reference inline."
    attributes:
      - "request identity"
      - "owning message identity"
      - "session working directory"
      - "loading state"
  - name: "Preview Result"
    description: "The bounded content or unavailable outcome returned for a preview request."
    attributes:
      - "resolved file identity"
      - "content presentation type"
      - "bounded content"
      - "success or unavailable status"
  - name: "Sibling Repository Match"
    description: "A same-relative-path candidate found in an immediate sibling directory of the session repository."
    attributes:
      - "sibling repository identity"
      - "relative path"
      - "match count"

edge_cases:
  - scenario: "The same relative path exists in the session working directory and one or more sibling repositories."
    expected_behavior: "The session-working-directory file wins and sibling fallback is not used."
  - scenario: "The same missing relative path exists in multiple immediate sibling repositories."
    expected_behavior: "The result is unavailable and no candidate is chosen."
  - scenario: "A matching path exists only in a nested descendant, ancestor, or non-sibling repository."
    expected_behavior: "The match is ignored because recursive or broad workspace search is not permitted."
  - scenario: "The rendered reference includes a supported line or column suffix."
    expected_behavior: "The underlying file resolves normally and the suffix remains navigation metadata."
  - scenario: "The file is oversized, empty, contains invalid UTF-8, or appears binary."
    expected_behavior: "The read remains bounded and binary-safe, with a stable preview or unavailable outcome and no TUI disruption."
  - scenario: "The message changes, disappears, or issues a newer request before loading completes."
    expected_behavior: "The stale result is discarded."
  - scenario: "Two messages have identical text and identical file references."
    expected_behavior: "Their open, loading, loaded, and collapsed states remain independent."
  - scenario: "The user clicks an already open inline preview path."
    expected_behavior: "The preview collapses without disturbing other message previews."

assumptions:
  - "The session repository is the repository associated with the session working directory."
  - "An immediate sibling repository is a direct child of the session repository's parent directory and is eligible only at the identical relative path."
  - "Current dev behavior is the baseline for plain-Markdown previews, HTML external-open configuration, supported home and absolute paths, content bounds, and interaction semantics."
  - "The established unavailable presentation is sufficiently clear and does not require a new error-dialog workflow."
  - "Only behavior from PR 2 that satisfies this specification and does not conflict with current dev semantics is applicable."

constraints:
  - "Preserve current dev plain-Markdown inline preview semantics."
  - "Preserve session-working-directory precedence and repository safety."
  - "Preview reads must remain bounded, binary-safe, and non-blocking to the user interface."
  - "Do not merge or import the divergent PR 2 branch wholesale."
  - "The canonical behavior remains within Jcode TUI inline file path detection, resolution, loading, and rendering."

out_of_scope:
  - "Recursive filesystem or workspace-wide file search."
  - "Changes to @ mention submission behavior."
  - "Changes to side-panel semantics outside link clicks."
  - "Unrelated refactors or features from the PR 2 review branch."
  - "New cross-repository write, edit, or mutation capabilities."

