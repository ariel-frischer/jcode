        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-tui/src/tui/app/inline_file_preview.rs"
        dependencies: ["T004", "T005"]
        acceptance_criteria:
          - "Relative targets resolve from the active session working directory and absolute targets are canonicalized before access."
          - "The canonical resolved path must remain within the permitted workspace root, refer to a regular file, and obey the existing 512 KiB and UTF-8 readability limits."
          - "Successful activation stores the bounded content in existing per-message preview state and preserves current collapse behavior."
      - id: "T007"
        title: "Wire valid local targets through chat click precedence"
        status: "Pending"
        type: "implementation"
        parallel: false
        story_id: "US-001"
        file_path: "crates/jcode-tui/src/tui/app/navigation.rs"
        dependencies: ["T006"]
        acceptance_criteria:
