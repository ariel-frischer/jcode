      - "Session-relative and absolute-path resolution with canonical workspace-boundary enforcement."
      - "Handled status outcomes for missing, non-regular, unreadable, oversized, and disallowed files, preventing external opener fallback."
      - "Existing successful inline preview and collapse behavior retained for supported local files."
  - phase: 3
    name: "Validate compatibility and delivery gates"
    goal: "Run the smallest deterministic checks first, then verify the focused crate behavior and artifact scope."
    dependencies:
