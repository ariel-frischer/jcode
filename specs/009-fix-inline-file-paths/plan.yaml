plan:
  branch: "agent/jcode-w4q-inline-file-link"
  created: "2026-08-19"
  spec_path: "specs/009-fix-inline-file-paths/spec.yaml"

summary: |
  Fix click-time dispatch for inline file-looking targets in the Rust TUI without
  changing the established URL parser or external opener. The target extractor
  will continue to recognize Markdown links and supported http, https, mailto,
  and file URLs first, while the activation path will normalize local targets,
  resolve relative paths from the active session working directory, and enforce
  the existing workspace boundary before opening a preview.

  A path-looking target will be treated as handled even when it is missing,
  unreadable, oversized, or disallowed, so it produces actionable status
  feedback instead of falling through to generic external-link handling. The
  implementation remains in the existing `jcode-tui` modules and adds focused
  unit and interaction regressions for local paths, query/fragment suffixes,
  supported URL schemes, and unavailable files. No new dependencies, storage,
  navigation model, or browser behavior are introduced.

technical_context:
  language: "Rust 2024"
  framework: "Ratatui 0.30 with Crossterm 0.29"
  primary_dependencies:
    - name: "std::path and std::fs"
      version: "Rust standard library"
      purpose: "Normalize, resolve, canonicalize, bound, inspect, and read local file targets."
    - name: "regex"
      version: "1"
      purpose: "Reuse the existing inline target extraction regexes for supported URLs and file paths."
    - name: "url"
      version: "2"
      purpose: "Preserve validation and normalization of existing URL candidates."
    - name: "tempfile"
      version: "3"
      purpose: "Create deterministic workspace fixtures for focused file activation tests."
  storage: "None; preview content and session working-directory state remain in-memory App state."
  testing:
    framework: "Cargo unit and integration tests"
    approach: "Focused `jcode-tui` unit tests for target extraction and activation, plus deterministic terminal interaction tests for click precedence, URL preservation, and safe negative outcomes."
  target_platform: "Jcode desktop platforms supported by the existing Rust path and TUI layers, including Linux, macOS, and Windows."
  project_type: "CLI/TUI application"
  performance_goals: "Keep click handling bounded to the existing target scan and one local metadata/read operation; preserve the 512 KiB inline-preview limit and avoid network or browser work for local targets."
  constraints:
    - "Limit the diff to inline target extraction, local preview activation, related navigation dispatch, and focused regression tests."
    - "Preserve existing http, https, mailto, and file URL behavior, including URL trimming and the established detached opener."
    - "Resolve relative paths from the active session working directory and refuse paths outside the permitted canonical workspace boundary."
    - "Retain existing file-size and text-readability limits and return actionable status feedback for unavailable local targets."
    - "Use deterministic local fixtures only; do not require live browser, network, or production-adjacent validation."
    - "Do not add dependencies, change Markdown rendering, or redesign the inline preview UI."
  scale_scope: "One clicked transcript target at a time in a local Jcode session; previews remain bounded by the existing per-file size limit and per-message in-memory state."

