implementation_phases:
  - phase: 1
    name: "Lock classification and fixture contracts"
    goal: "Capture the existing URL contract and the intended local-path activation boundary in focused deterministic tests."
    deliverables:
      - "Parser tests for docs/myfile.md-style targets, Markdown-link query/fragment suffixes, and unchanged http/https/mailto/file URL trimming."
      - "Temporary workspace fixtures for nested files, missing paths, oversized files, non-text files, and out-of-bound targets."
      - "A direct regression demonstrating that a path-looking target must not fall through to generic external-link handling."
  - phase: 2
