    deliverables:
      - "Focused `jcode-tui` URL and inline-file-preview tests covering all acceptance scenarios."
      - "Serialized broader repository validation only as required by the repository guardrails, with no live browser or network checks."
      - "Final diff review confirming no dependency, renderer, URL-opener, or unrelated formatting changes."

open_questions:
  - question: "What should happen when a relative path is clicked without an active session working directory?"
    context: "The existing preview path requires session.working_dir, while generic opening could otherwise interpret the text against the process directory."
    proposed_resolution: "Treat the target as a handled local reference, report that it cannot be resolved without an active working directory, and do not fall through to external opening."
  - question: "How should absolute local paths be constrained?"
    context: "The spec permits supported absolute paths but requires refusal outside the permitted repository or working-directory boundary."
    proposed_resolution: "Use the canonical active session working directory as the permitted root and refuse canonical absolute targets that do not remain beneath it; preserve the existing status-notice failure surface."

