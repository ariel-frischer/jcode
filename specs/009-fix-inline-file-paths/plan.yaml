research_findings:
  decisions:
    - topic: "Inline target extraction order"
      decision: "Keep Markdown-link and supported-URL extraction ahead of the existing file-path regex, then route the selected target through local-file activation before generic opening."
      rationale: "The current extractor already preserves URL trimming and scheme recognition; the regression is at click-time fallback when a path is not opened as a preview."
      alternatives_considered:
        - "Replace the existing URL regex and parser with a unified target classifier"
        - "Only recognize paths after generic external-link opening"
    - topic: "Local path resolution and boundary enforcement"
      decision: "Strip query and fragment suffixes for filesystem access, resolve relative paths against the active session working directory, canonicalize the result, and reject targets outside the permitted workspace root."
      rationale: "This matches the spec's session-relative contract and existing Markdown-link boundary checks while preventing absolute or traversal paths from becoming unintended external opens."
      alternatives_considered:
        - "Use the process current directory as a fallback for missing session working-directory state"
        - "Allow every readable absolute path without workspace containment"
    - topic: "Unavailable local target behavior"
      decision: "Classify path-looking targets as handled before generic opening and report missing, non-regular, unreadable, oversized, or disallowed files through the existing status-notice surface."
      rationale: "Returning false for these cases is what currently causes the misclassification to become a successful or attempted external-link action."
      alternatives_considered:
        - "Fall through to the detached opener when the file does not exist"
        - "Silently ignore invalid targets and leave the previous status unchanged"
    - topic: "Regression test placement"
      decision: "Extend the existing `jcode-tui` URL and inline-file-preview tests, adding terminal click coverage where dispatch order matters."
      rationale: "These modules already own target extraction, preview state, fixture setup, and status assertions, so new tests stay close to the contract without broad end-to-end dependencies."
      alternatives_considered:
        - "Add a new cross-crate test harness"
        - "Rely only on manual browser or terminal checks"

data_model:
  entities:
    - name: "Inline target"
      description: "The target text selected from a transcript line and passed to click-time navigation."
      fields:
        - name: "display_target"
          type: "String"
          description: "Target returned by Markdown-link, URL, or file-path extraction."
          constraints: "Must preserve the existing normalized URL target or visible local path text."
        - name: "classification"
          type: "InlineTargetKind"
          description: "Local file reference, supported external URL, or unsupported/non-actionable target."
          constraints: "URL schemes are evaluated before local filesystem access."
        - name: "message_index"
          type: "usize"
          description: "Transcript message owning the clicked target for preview state lookup."
          constraints: "Must resolve to an existing display message before mutating preview state."
        - name: "screen_location"
          type: "CopySelectionPoint"
          description: "Rendered chat position used to identify the clicked target."
          constraints: "Only transcript and side-pane locations that already participate in link hit testing are actionable."
      relationships:
        - target: "Local file reference"
          type: "one-to-one"
          description: "A local target is normalized and resolved before preview activation."
        - target: "External URL"
          type: "one-to-one"
          description: "A supported URL bypasses local preview resolution and uses the existing opener."
    - name: "Local file reference"
      description: "A relative or absolute target that may resolve to a readable file inside the active workspace boundary."
      fields:
        - name: "path_text"
          type: "String"
          description: "Filesystem portion of the target after removing an optional query or fragment suffix."
          constraints: "Must not include URL schemes; relative values resolve against session working_dir."
        - name: "resolved_path"
          type: "PathBuf"
          description: "Canonical path used for boundary, metadata, and text-readability checks."
          constraints: "Must remain within the permitted canonical workspace root and refer to a regular file."
        - name: "availability"
          type: "LocalFileAvailability"
          description: "Resolved, missing, disallowed, oversized, unreadable, or otherwise unavailable state."
          constraints: "Every unavailable state produces one actionable status and no external-link success status."
        - name: "preview_content"
          type: "String"
          description: "Bounded UTF-8 content retained for the existing inline preview."
          constraints: "Read only when the file is regular, within limits, and valid text."
      relationships:
        - target: "Inline file preview"
          type: "one-to-one"
          description: "A successfully resolved reference projects into the existing per-message preview state."
    - name: "External URL"
      description: "A supported http, https, mailto, or file URL handled by the existing link-opening workflow."
      fields:
        - name: "scheme"
          type: "String"
          description: "URL scheme recognized by the current extractor."
          constraints: "Only http, https, mailto, and file are in scope."
        - name: "normalized_target"
          type: "String"
          description: "URL after existing sentence-punctuation and delimiter trimming."
          constraints: "Must be passed unchanged to the existing opener."
        - name: "opening_result"
          type: "Result"
          description: "Existing opened-link or failed-link status outcome."
          constraints: "Must never be replaced by local file-preview status for a genuine supported URL."
      relationships:
        - target: "Inline target"
          type: "many-to-one"
          description: "Each clicked supported URL originates from one extracted inline target."

